<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神經疾病物理治療學 — 114 年互動測驗</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --ink: #1f2933;
    --ink-soft: #52606d;
    --line: #e4e7eb;
    --primary: #1d6f9b;
    --primary-soft: #e6f1f7;
    --green: #2f9e44;
    --green-soft: #d3f9d8;
    --red: #c92a2a;
    --red-soft: #ffe3e3;
    --yellow: #d9a700;
    --yellow-soft: #fff4c2;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei",
                 "Noto Sans TC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
    font-size: 16px;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 14px 22px;
    position: sticky; top: 0; z-index: 10;
  }
  .h-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    background: #f1f3f5; border: 1px solid var(--line); color: var(--ink-soft);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .progress { color: var(--ink-soft); font-size: 14px; margin-left: auto; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 22px; max-width: 1400px; margin: 18px auto; padding: 0 22px; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; padding: 0 14px; } .sidebar { order: 2; position: static; } }
  .sidebar {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; height: fit-content; position: sticky; top: 78px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
  }
  .gbtn {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
    color: var(--ink-soft); font-size: 13px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .gbtn:hover { border-color: var(--primary); }
  .gbtn.cur { background: var(--primary); color: #fff; border-color: var(--primary); }
  .gbtn.right { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .gbtn.wrong { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .legend { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 4px; border: 1px solid var(--line); }
  .dot.r { background: var(--green-soft); border-color: var(--green); }
  .dot.w { background: var(--red-soft); border-color: var(--red); }
  .main { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .qhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .qnum { font-size: 22px; font-weight: 700; color: var(--primary); }
  .qmeta { color: var(--ink-soft); font-size: 13px; }
  .stem { font-size: 16px; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
  .qimg { display: block; max-width: 100%; max-height: 480px; margin: 8px 0; border: 1px solid var(--line); border-radius: 6px; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    transition: background .12s, border-color .12s;
    text-align: left;
    font-size: 15.5px;
    color: var(--ink);
  }
  .opt:hover:not(.locked) { background: var(--primary-soft); border-color: var(--primary); }
  .opt.locked { cursor: default; }
  .opt .label { font-weight: 700; min-width: 22px; }
  .opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .opt.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .verdict { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 14px; line-height: 1.7; }
  .verdict.right { background: var(--green-soft); color: #186b29; }
  .verdict.wrong { background: var(--red-soft); color: #861818; }
  .verdict.note { background: var(--yellow-soft); color: #6b4e00; }
  .verdict h3 { margin: 0 0 6px; font-size: 14px; }
  .nav { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    background: var(--primary); color: #fff; border: 0; padding: 9px 18px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: #fff; color: var(--red); border: 1px solid var(--red); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .summary { padding: 18px; }
  .summary h2 { margin: 0 0 8px; }
  .score { font-size: 32px; font-weight: 700; color: var(--primary); }
  .wrong-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .wrong-row { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .wrong-row:hover { background: var(--primary-soft); }
  .footer { color: var(--ink-soft); font-size: 12px; text-align: center; margin: 16px 0 30px; }

  .homelink { color: var(--soft); text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .homelink:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }


  /* Export modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,30,.45); display: none; align-items: center; justify-content: center; z-index: 100; padding: 18px; }
  .modal-bg.show { display: flex; }
  .modal-card { background: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.18); max-width: 460px; width: 100%; padding: 22px; }
  .modal-card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 700; }
  .modal-card .modal-sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; }
  .modal-card .opt-row { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
  .modal-card .exp-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; background: #f8f9fa; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left; color: var(--ink); }
  .modal-card .exp-opt:hover { background: var(--primary-soft); border-color: var(--primary); }
  .modal-card .exp-opt:disabled { opacity: 0.5; cursor: not-allowed; background: #f1f3f5; }
  .modal-card .exp-opt .count { color: var(--ink-soft); font-size: 12px; }
  .modal-card .hint { color: var(--ink-soft); font-size: 12px; line-height: 1.6; margin: 0 0 12px; }
  .modal-card .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }


  /* Bookmark / marker */
  .gbtn { position: relative; }
  .gbtn.marked::after {
    content: "★"; position: absolute; top: 1px; right: 3px;
    font-size: 10px; color: var(--yellow); line-height: 1;
    text-shadow: 0 0 2px #fff;
  }
  .markbtn {
    margin-left: auto; background: #fff; border: 1px solid var(--line);
    color: var(--ink-soft); padding: 6px 13px; border-radius: 999px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .markbtn:hover { border-color: var(--yellow); color: var(--yellow); }
  .markbtn.marked { background: var(--yellow-soft); color: #6b4e00; border-color: var(--yellow); font-weight: 600; }
  .qhead { flex-wrap: wrap; }
  .marked-badge { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--yellow-soft); color: #6b4e00; font-size: 11px; border: 1px solid var(--yellow); margin-left: 4px; }
  .wrong-row.mk { border-color: var(--yellow); }

</style>
</head>

<script>
const DATA = {"Q1": {"label": "第一次", "questions": [{"n": 1, "stem": "下列何者直接接收由脊髓上行之感覺回饋訊息，比對與來自大腦皮質之動作意圖之差距後，可對動作做出即時\n修正？", "options": {"A": "中腦", "B": "丘腦", "C": "基底核", "D": "小腦"}, "images": [], "answer": "D", "explanation": "小腦接收脊髓上行的本體感覺與觸覺回饋（脊髓小腦徑），同時接收大腦皮質下傳的動作意圖（皮質橋腦小腦徑），比對兩者差異後，透過小腦輸出修正動作。中腦、丘腦、基底核功能不同。"}, {"n": 2, "stem": "利用軸突迴返枝（recurrent branch）的輸入，導致α運動神經元產生自我抑制作用的中間神經元為何？", "options": {"A": "Ia中間神經元", "B": "Ib中間神經元", "C": "瑞修細胞（Renshaw cell）", "D": "許旺氏細胞（Schwann cell）"}, "images": [], "answer": "C", "explanation": "瑞修細胞（Renshaw cell）為脊髓中間神經元，接收α運動神經元軸突迴返枝，產生負迴饋抑制原本的α運動神經元（recurrent inhibition），調節肌肉活化的精準度。"}, {"n": 3, "stem": "下列有關Dr. John Hughlings Jackson（1835-1911）的階層理論觀點，下列何者已被近代的神經科學發現所推\n翻？", "options": {"A": "中樞神經系統的階層分類與神經發展的成熟度有關", "B": "中樞神經系統的階層中，全是由上而下的控制", "C": "最高階的控制是在聯結皮質區，負責設定目標、策略與計劃", "D": "最低階的控制是在脊髓，負責動作之執行"}, "images": [], "answer": "B", "explanation": "Jackson階層理論認為高階控制低階，且強調由上而下單向控制。近代神經科學發現各階層間有雙向交互作用（如基底神經節與皮質回饋迴路），故「全是由上而下」的觀點被推翻。"}, {"n": 4, "stem": "有關系統動作控制理論（Systems theory）之敘述，下列何者錯誤？", "options": {"A": "最早由蘇聯科學家Nicolai Bernstein所提出", "B": "主張動作是來自於多個系統交互合作所產出的結果", "C": "認為協同動作可以解決肌肉及關節自由度的問題", "D": "強調反射是最基本的動作控制單位，而複雜的動作則由多個反射串連而成"}, "images": [], "answer": "D", "explanation": "Bernstein系統理論強調動作由多系統交互合作產生、利用協同動作解決自由度問題；反射理論才主張反射為基本單位，故D錯誤。"}, {"n": 5, "stem": "根據Fitts與Posner三階段模型，動作學習過程中那一個學習階段的注意力需求最高？", "options": {"A": "自動化期（autonomous stage）", "B": "聯結期（associative stage）", "C": "認知期（cognitive stage）", "D": "專家期（expert stage）"}, "images": [], "answer": "C", "explanation": "Fitts & Posner三階段：認知期（cognitive，需高度注意力理解任務）→聯結期（associative，逐步精煉）→自動化期（autonomous，注意力需求最低）。"}, {"n": 6, "stem": "訓練巴金森氏病患者從坐姿站起之動作策略，要他當場練習兩回合、每回合5次的坐到站動作，兩回合動作間\n休息1分鐘，第一次治療的第一回合給予口語回饋，第二回合則不給任何回饋。隔3天後，第2次治療時，同樣\n執行坐到站的動作兩回合，每回合做5次動作，兩回合間休息1分鐘，但都不給回饋。下列何者較能代表因為第\n一次治療而產生的動作學習成效？", "options": {"A": "第一次治療中第一回合的第5次表現", "B": "第一次治療中第二回合的第1次表現", "C": "第二次治療中第一回合的第1次表現", "D": "第二次治療中第二回合的第1次表現"}, "images": [], "answer": "C", "explanation": "動作學習效果應透過保留測試（retention test）評估，即在隔日（>1日）且無回饋條件下測量。第二次治療第一回合第一次最能反映先前學習成效。"}, {"n": 7, "stem": "病患使用健側肢體去代償患側癱瘓肢體，會減少患側肢體的使用，可能因此失去患側肢體剩餘能力。此現象為\n何？", "options": {"A": "習得無助（learned helpless）", "B": "習得廢用（learned non-use）", "C": "習得使用（learned use）", "D": "習得適應（learned adaptation）"}, "images": [], "answer": "B", "explanation": "Edward Taub提出的「習得廢用」（learned non-use）：中風後因健側代償使患側肢體愈來愈少使用，導致神經塑性負面強化，故患側功能下降。"}, {"n": 8, "stem": "葛拉斯哥昏迷量表的評估，屬於國際健康功能與身心障礙分類系統（ICF）的那個層面？", "options": {"A": "活動能力", "B": "身體構造與功能", "C": "環境因素", "D": "個人因素"}, "images": [], "answer": "B", "explanation": "GCS評估意識（睜眼、語言、運動），反映大腦功能，屬ICF的「身體功能」（Body Function）面向。"}, {"n": 9, "stem": "巴賓斯基徵象（Babinski sign）陽性反應，最不可能之病灶為何？", "options": {"A": "大腦", "B": "脊髓", "C": "上運動神經元損傷", "D": "下運動神經元損傷"}, "images": [], "answer": "D", "explanation": "Babinski sign（腳掌劃過大拇趾上揚伸直、其他腳趾分開）為上運動神經元損傷的徵象（皮質脊髓徑受損）；下運動神經元病變則出現肌肉萎縮、深腱反射減弱、Babinski陰性。"}, {"n": 10, "stem": "下列中風患者的評估結果，何項屬於國際健康功能與身心障礙分類系統（ICF）的活動限制？", "options": {"A": "柏格氏平衡評估35分", "B": "患側的握力約5公斤", "C": "患者左側下肢針刺覺變差", "D": "患者尚無法從事病前同樣職務的工作"}, "images": [], "answer": "A", "explanation": "Berg balance scale（柏格氏平衡）反映個體的功能性平衡能力，是「活動」面向；握力與感覺檢查屬身體功能；無法工作屬參與限制。"}, {"n": 11, "stem": "關於中風後肌力變差的敘述，下列何者錯誤？", "options": {"A": "主要發生在中風對側肢體", "B": "通常遠端比近端嚴重", "C": "中風同側也可能出現", "D": "主要發生在第一類肌肉纖維，影響快速啟動的能力"}, "images": [], "answer": "D", "explanation": "中風後肌力下降主要影響第II型（快縮）肌纖維，題敘「主要發生在第I類肌纖維」錯誤。其餘正確（多影響中風對側、遠端>近端、同側部分受損）。"}, {"n": 12, "stem": "下列何種肌力訓練，一定需要使用儀器？", "options": {"A": "等張向心收縮", "B": "等張離心收縮", "C": "等長收縮", "D": "等速收縮"}, "images": [], "answer": "D", "explanation": "等速收縮（isokinetic contraction）需要等速肌力儀控制角速度恆定；其他三種收縮可徒手或自由重量完成，無需專門儀器。"}, {"n": 13, "stem": "張老先生左側殼核缺血性中風一個月，目前下肢布朗斯壯分期為第一期，下列敘述何者正確？", "options": {"A": "家屬表示：張老先生在打呵欠時，腳就會抬很高", "B": "根據布朗斯壯的治療原則，應該趕快開始練習站立平衡", "C": "可以誘發反射或聯合反應（associated reaction），使下肢動作進展到下一階段", "D": "執行踝關節背屈被動關節運動時，會發生陣攣（clonus）"}, "images": [], "answer": "C", "explanation": "Brunnstrom第一期肌肉軟癱、無主動或反射動作；可運用反射或聯合反應誘發進入第二期（出現肌肉張力與基本協同動作）。"}, {"n": 14, "stem": "下列何者是現代玻巴斯觀念應用於中風病人的治療重點？", "options": {"A": "使用靜態的反射抑制姿勢來長時間抑制痙攣", "B": "依神經發展里程碑的順序，從墊上活動依序開始訓練及誘發", "C": "控制軀幹關鍵點，誘發病人產生行走時正常的姿勢平衡反應", "D": "使用行走輔具（四腳枴、足踝裝具）以盡早達到功能獨立"}, "images": [], "answer": "C", "explanation": "現代Bobath（NDT）強調主動參與、控制軀幹與肩胛骨等關鍵點，誘發行走時動態姿勢平衡反應；非靜態反射抑制姿勢或固定的發展順序。"}, {"n": 15, "stem": "在施予本體感覺神經肌肉誘發技巧（PNF）時的口令是｢用力推我的手、停在這裡不要被我推動、然後用力慢\n慢的被我推回去｣，是使用下列那一項技巧？", "options": {"A": "複製（replication）", "B": "節律啟動（rhythmic initiation）", "C": "等張收縮的組合（combination of isotonics）", "D": "重複牽張（repeated stretch）"}, "images": [], "answer": "C", "explanation": "等張收縮的組合（combination of isotonics）包括向心、保持（等長）與離心三相收縮的連續組合：「用力推→停住→慢慢被推回」對應向心→等長→離心。"}, {"n": 16, "stem": "72歲婆婆因中風導致右側肢體偏癱，坐在床緣時須以雙手支撐才能維持靜態坐姿平衡，且無法放手獨自坐\n著。治療師可以採用下列那些本體感覺神經肌肉誘發技巧來改善靜態坐姿平衡？①穩定反轉（stabilization\nreversal） ②固定－放鬆（hold-relax） ③快速牽張（quick stretch） ④節律性穩定（rhythmic\nstabilization）", "options": {"A": "①③", "B": "②③", "C": "僅①④", "D": "①②④"}, "images": [], "answer": "C", "explanation": "靜態坐姿平衡訓練適用穩定反轉（stabilization reversal）與節律性穩定（rhythmic stabilization）；快速牽張與固定-放鬆主要為動作誘發或拉長肌肉，非平衡訓練。"}, {"n": 17, "stem": "在坐姿下，利用PNF訓練中風患者用右手將右前方治療床上的眼鏡戴上，此訓練最接近的動作型態為何？", "options": {"A": "D1伸直模式（D1E）", "B": "D2伸直模式（D2E）", "C": "D1屈曲模式（D1F）", "D": "D2屈曲模式（D2F）"}, "images": [], "answer": "C", "explanation": "戴上眼鏡需肩屈曲、外展、外轉+肘屈曲，符合D1屈曲模式（D1F：屈曲-內收-外轉）的鏡像延伸動作。實際應用上，把右手往右前方拿物品較接近D1F。"}, {"n": 18, "stem": "為患有巴金森氏病的吳奶奶進行坐姿平衡訓練，目前已經從「閉眼靜坐在治療床上5分鐘」進步到可以「閉眼\n靜坐在治療床上被推不會倒」，接下來的訓練下列何者較為適合？", "options": {"A": "睜開眼靜坐在治療床上", "B": "延長練習至30分鐘不中斷", "C": "從治療床換成坐在彈力球上", "D": "躺下練抬臀拱橋運動"}, "images": [], "answer": "C", "explanation": "巴金森氏病坐姿平衡進階：靜態（不動）→反應性（被推不倒）→自我啟動的動態平衡（坐在彈力球上需主動調控）。坐彈力球為下一步合適挑戰。"}, {"n": 19, "stem": "下列何者符合玻巴斯學派對中風患者擺位之原則？", "options": {"A": "坐姿時，上背部放置枕頭以得到較好支撐", "B": "仰躺時，在腳底放置枕頭或托足板以避免垂足（drop foot）", "C": "側躺於患側時，身體略向後倒，以使患側肩關節處於前突（protraction）位置", "D": "側躺於健側時，為鼓勵活動儘量讓患側上肢懸空"}, "images": [], "answer": "C", "explanation": "Bobath擺位原則：側躺於患側時，身體應略向後倒，使患側肩胛前突避免被壓迫。健側躺時患側上肢應由枕頭支撐，避免懸空。"}, {"n": 20, "stem": "下列何種患者較適合使用部分載重跑步機訓練？", "options": {"A": "站立或行走時血壓不穩定的中風患者", "B": "下肢關節嚴重攣縮（contracture）的脊髓損傷患者", "C": "無法與其溝通的中風患者", "D": "骨質缺乏（osteopenia）的脊髓損傷患者"}, "images": [], "answer": "D", "explanation": "部分載重跑步機適用骨質缺乏（osteopenia）的脊髓損傷者，提供承重訓練改善骨密度且減低跌倒風險。血壓不穩、嚴重攣縮或無法溝通者皆不適合。"}, {"n": 21, "stem": "有關任務取向概念的基本原則，下列敘述何者正確？", "options": {"A": "強調協同動作，利用下肢伸直張力支撐走路，早日開始行走運動", "B": "由站姿、坐姿至躺姿逐漸減少動作控制難度，先強調四肢非對稱性活動，再擴及對稱性活動", "C": "強調病人主動參與，學習找出解決動作困難，逐步發展動作策略", "D": "隨著治療進展，治療師應持續增加感覺回饋給患者"}, "images": [], "answer": "C", "explanation": "任務取向強調病人主動參與、找出解決動作困難的策略，逐步發展動作策略。其他選項違反此理念（不應強調協同動作、不應從躺姿開始減少難度、感覺回饋應漸進淡出）。"}, {"n": 22, "stem": "關於非穿戴式機器人輔助行走訓練，下列敘述何者正確？", "options": {"A": "僅能提供下肢被動跨步，無法讓病患主動訓練步行", "B": "使用過程病患可獨立運作，通常不需要治療師介入", "C": "支撐病患體重的幅度越小，病患心臟負荷會越低", "D": "支撐病患體重的幅度越大，單腳站立期比例越高"}, "images": [], "answer": "D", "explanation": "機器人輔助行走訓練支撐病患體重比例越大，下肢承重越少，相對增加單腳站立期比例（治療師輔助下穩定）。其他選項皆描述錯誤。"}, {"n": 23, "stem": "有關機器人輔助（robot assisted）部分載重跑步機之敘述，下列何者最適當？", "options": {"A": "以反射理論為治療基礎，透過感覺刺激誘發脊髓產生雙腳規律性的交替跨步動作", "B": "屬於治療型設備，可進行神經誘發模式訓練", "C": "相較於功能性電刺激，價格更為便宜", "D": "有證據顯示可改善不完全損傷脊髓損傷患者的行走功能"}, "images": [], "answer": "D", "explanation": "機器人輔助部分載重跑步機已有實證可改善不完全脊髓損傷患者行走功能，是治療型且非便宜（昂貴）；其原理混合中樞型態產生器與感覺驅動，非純反射。"}, {"n": 24, "stem": "依據路德（Rood）學派的觀念，下列何種運動最適合用來促進技巧性動作？", "options": {"A": "上肢放在桌上，以軀幹或近端晃動的方式來產生患側上肢動作", "B": "手肘趴姿", "C": "站立時以患側手支撐牆面，然後轉動軀幹由面向牆壁改為側向牆壁的姿勢", "D": "站著擦黑板"}, "images": [], "answer": "D", "explanation": "Rood學派四階段：易動性（mobility）→穩定性（stability）→可控性（controlled mobility）→技巧（skill）。技巧階段以遠端肢體執行精細動作，如站著擦黑板。"}, {"n": 25, "stem": "陳先生在家中浴室跌倒時撞到頭部，家人立即送急診，他的電腦斷層影像顯示其出血部位為何？", "options": {"A": "大腦皮質", "B": "胼胝體", "C": "硬腦膜下腔", "D": "中大腦動脈"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAN8AAADdCAIAAAC0UzBwAAAACXBIWXMAAA7EAAAOxAGVKw4bAACR6ElEQVR4nOzdd9ylVXnvf5ViECMiRZqAVAFRNGrsJaRHk5OTnpP6S0xyctKMHTu9SBk6SG8D0tuAdBlAeu996L2qoCHh9z77c7jPcwbmmXHmGWZGZ/2xX/e+97rLXuu7rrau8ornF7aFbX5tr5jXL7CwLWwzbP8Hnd9e2Ba2+aYdfvjhp59++v9F5ysWtoVtfmof+tCHFqJzYZtP24c// 瘀青（左側忽略導致碰撞）。前/後大腦動脈症狀範圍不同，陷窩梗塞為小範圍。"}, {"n": 28, "stem": "有關踝足矯具（AFO）在中風患者之應用，下列何者最不適當？", "options": {"A": "改善垂足現象", "B": "改善步態", "C": "增加站立穩定性", "D": "改善感覺功能"}, "images": [], "answer": "D", "explanation": "踝足矯具（AFO）改善垂足、步態穩定、增加站立穩定，但無法直接改善感覺功能（如本體感覺）。"}, {"n": 29, "stem": "有關修正式限制誘發動作治療（modified constraint-induced movement therapy）用於中風復健之敘述，下列何\n者錯誤？", "options": {"A": "理論基礎為大腦具有神經塑性（neural plasticity）", "B": "和任務取向治療模式（task-oriented approach）有相似的治療觀念", "C": "限制偏癱病患使用健側手，同時進行患側手密集訓練", "D": "對上肢尚無任何動作的患者效果最好"}, "images": [], "answer": "D", "explanation": "mCIMT對於上肢已具部分動作（伸腕10°、伸指10°）的中風患者最有效；對於完全無動作者效果差，因無法執行任務練習。"}, {"n": 30, "stem": "有關單側忽略的敘述，下列何者正確？", "options": {"A": "多發生在左大腦損傷病患", "B": "有不同的忽略種類，其中一類是對周邊空間的忽略", "C": "臨床上最常使用對質測試（confrontational test）加以檢查", "D": "對於視覺刺激忽略的患者，通常不會忽略體感覺的刺激"}, "images": [], "answer": "B", "explanation": "單側忽略可分為：個人空間忽略、周邊空間忽略、表徵性忽略等多種；對視覺刺激忽略者通常也忽略體感覺；多發生於右大腦損傷；常用Albert劃線測試、星星刪除等專門工具，不是對質測試。"}, {"n": 31, "stem": "有關訓練中風病患坐到站的轉位，下列敘述何者正確？", "options": {"A": "針對平衡能力不佳的病患，動量策略（momentum strategy）是比較好的選擇", "B": "動量策略（momentum strategy）利用上半身快速向前，一氣呵成帶動重心往上的動作", "C": "針對下肢肌力不足的病患，力量控制策略（force control strategy）是比較好的選擇", "D": "力量控制策略（force control strategy）利用上半身向前的力量控制，帶動重心往上的動作"}, "images": [], "answer": "B", "explanation": "動量策略（momentum strategy）：上半身快速向前帶動重心，一氣呵成站起，適用下肢肌力較弱者；力量控制策略適用平衡較佳但可慢動作的個案。"}, {"n": 32, "stem": "下列何者屬於中風患者常見之聯合反應（associated reaction）？", "options": {"A": "雷密斯特氏現象（Raimiste phenomenon）", "B": "巴賓斯基徵象（Barbinski sign）", "C": "彈簧刀現象（clasp-knife phenomenon）", "D": "霍夫曼徵象（Hoffmann's sign）"}, "images": [], "answer": "A", "explanation": "雷密斯特氏現象（Raimiste phenomenon）：對健側肢體施加阻力（如外展），可在患側引發相同方向動作，是中風常見的聯合反應。其他三項屬反射或張力異常徵象。"}, {"n": 33, "stem": "訓練有推者症候群（pusher syndrome）的中風患者之直立姿勢平衡與控制，下列敘述何者正確？", "options": {"A": "雙腳站在高密度泡棉上來練習", "B": "不宜使用鏡子作為視覺回饋", "C": "若健側使用手杖支撐時，可將手杖調短一點", "D": "患側不宜使用綁腿固定，以免造成錯誤的感覺回饋"}, "images": [], "answer": "C", "explanation": "推者症候群（pusher syndrome）：患者推向偏癱側、抗拒被動矯正。健側使用手杖時應將手杖調短，鼓勵患側承重而非過度依賴健側支撐。"}, {"n": 34, "stem": "老蔡中風右側肢體偏癱兩年了，上肢仍處於軟癱狀態，但可以在家人監督下短距離行走，對於家人諮詢以虛\n擬實境來做治療的方式和效益，下列回應何者最不適當？", "options": {"A": "虛擬實境的活動選擇以老蔡的需求和能力為出發點，可選擇坐著做", "B": "虛擬實境的活動進行過程中，可能發生失去方向感或空間感的現象，會有危險", "C": "坊間虛擬實境遊戲的練習成果都可以立即轉移至日常生活功能，因此可以在家自行練習", "D": "虛擬實境的活動進行後可能產生短暫的噁心頭暈現象，要做好跌倒預防準備"}, "images": [], "answer": "C", "explanation": "虛擬實境治療成果未必能立即轉移到日常生活功能，需專業治療師指導與評估個案能力，不應自行在家無監督練習。"}, {"n": 35, "stem": "張女士中風3個月了，右側偏癱，根據治療師的評估上肢為布朗斯壯第二期，下肢為布朗斯壯第三期且各項分\n數約2分，下列敘述何者正確？", "options": {"A": "可以將左手綁起來，讓張女士練習自己用右手拿湯匙吃飯", "B": "練習動態站立平衡時，右腳可能會自發性往後踢", "C": "練習走路時，右手可能會自發性彎起來", "D": "以目前狀況，尚不適合練習站立平衡"}, "images": [], "answer": "C", "explanation": "Brunnstrom第II期下肢仍有強烈協同動作（如屈肌或伸肌協同）。練習走路時，患側上肢可能出現屈曲協同動作（聯合反應），是常見現象。"}, {"n": 36, "stem": "一位中風患者，右手從右大腿上抬高去碰觸右側耳朵，呈現肩帶提起及後縮、肩關節外展及外轉、手肘彎曲\n及前臂旋後的動作，其上肢動作型態為布朗斯壯分期第幾期？", "options": {"A": "1", "B": "2", "C": "3", "D": "5"}, "images": [], "answer": "C", "explanation": "Brunnstrom上肢第III期：可主動執行協同動作但全範圍。題目動作（屈曲協同：肩外展外轉、肘屈、前臂旋後）為典型屈肌協同動作，第III期。"}, {"n": 37, "stem": "脊髓損傷病患在執行翻身練習時，突然臉部潮紅且有盜汗現象。下列何者為最可能的原因？", "options": {"A": "過度換氣", "B": "自主神經反射異常", "C": "傷口感染", "D": "低血壓"}, "images": [], "answer": "B", "explanation": "脊髓損傷T6以上者翻身時可能誘發自主神經反射異常（autonomic dysreflexia）：表現為臉紅、盜汗、頭痛、血壓飆升，需立即處理排除誘因（膀胱、腸道刺激）。"}, {"n": 38, "stem": "有關發生在脊髓損傷病患的深部靜脈栓塞，下列敘述何者正確？", "options": {"A": "較常見於慢性期階段", "B": "女性發生比例較男性高", "C": "可能造成疼痛、皮膚潰瘍及慢性水腫等症狀", "D": "與周邊血管的過度收縮有關"}, "images": [], "answer": "C", "explanation": "DVT於SCI多發於急性期（首2-3個月）；可造成皮膚潰瘍與慢性水腫；無性別差異或下肢血管過度收縮機轉。題目C「可能造成疼痛、皮膚潰瘍及慢性水腫」相對較正確。"}, {"n": 39, "stem": "針對不完全性脊髓損傷患者，進行功能性墊上運動訓練之原則與技巧，下列何者錯誤？", "options": {"A": "ASIA A與 B之基本技巧極為類似，但後者可運用神經機能部位三節以下殘餘的動作功能來輔助", "B": "ASIA D可採很接近正常人所使用之動作型態", "C": "肌肉張力強弱或感覺功能的保留／恢復與否，也會影響功能訓練方式與進展", "D": "對於上肢較下肢虛弱之個案，可儘量訓練運用下肢或軀幹力量來執行墊上運動"}, "images": [], "answer": "A", "explanation": "ASIA A與B不同：A為完全性（無感覺、運動功能保留至S4-S5）；B為不完全性，神經機能部位以下保留某些感覺但無運動功能；故B非「殘餘運動功能」可用，題敘錯誤。"}, {"n": 40, "stem": "脊髓損傷後的復健策略主要分為代償式（compensatory）與修復／重建式（restorative）兩種策略，下列敘述\n何者錯誤？", "options": {"A": "代償式策略主要是透過肌肉代償、動量或頭臀關係來替代喪失的功能", "B": "修復式策略是對殘存的正常組織加以訓練，而非對壞損部位或組織加以訓練", "C": "懸吊式跑步機訓練可達到修復式訓練效果", "D": "針對ASIA C或 D患者，以接近正常人的動作型態來訓練轉位，此為修復式策略的概念"}, "images": [], "answer": "B", "explanation": "修復式策略目的是訓練受損部位/組織以恢復正常動作型態，並非僅訓練「殘存正常組織」。題敘B反向描述。"}, {"n": 41, "stem": "頸髓損傷患者有異常呼吸（paradoxical breathing）現象，主要為下列何肌肉無力？", "options": {"A": "肋間肌", "B": "橫膈肌", "C": "胸大肌", "D": "腹肌"}, "images": [], "answer": "A", "explanation": "頸髓損傷影響T1-T11肋間肌（不能維持胸壁吸氣穩定），單靠C3-C5橫膈肌呼吸時，吸氣時肋間肌癱瘓胸壁內凹形成異常呼吸（paradoxical breathing）。"}, {"n": 42, "stem": "根據美國脊髓損傷學會分類，病患檢查結果如表列，其神經損傷等級為何？", "options": {"A": "C5", "B": "C6", "C": "C7", "D": "C8"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAcIAAAErCAIAAADCMRRYAAAACXBIWXMAAA7EAAAOxAGVKw4bAAECKElEQVR4nOxdBXxUx9dNW1qgLRQo7u7uLsXdJXhwggd3h+DuEiRAcHdCkAQSIISQkBD3rPtbt+/MTHZZpBT7N0k/8rssb9++N2/ezJkz987cueNkNZk/JFar+T8iFpPZLlazhYo53XP1XTKoAPkfbBHpnrHvkgGF8qTFYnEyWyw2wWmrxUr+LP+hP/ZS/733+v73P/pDQ3BsDt+R8/3v43+Ah5P1Q38EPZb/lJjN6Z+H75Ip5MMtIr1z9V0yrIBbnLQGPafVqrVafHIaDRGthlNrObXuPyF6tcbAaQxavQkHKrWeS5N0z9h3yZCi0QH/aBQane7tFpHeGfsuGU9Uap1aozcYzE5ao4kvlvPFMqFUQQ/kfImcL1LwRfL/gAglSp5QliqQqnUmsUyd7vn5LhleFKlCCafTS5VqNIr/Xov4Lt9UFAKhVK3WEhoVSBQQoUxJDqRUJDjmBBJVZheRFI0BTKpQ680ShVYgTv8sfZcMLATzPJGM0KhKI5DI05oDaRHpnrfvkgGFE4oUGo3WSWM08yVKPqFRFT75UiZKvpTjS1WZXYQyNU+sTBUpOINZrNDyJemfpc8WkmdOAJGpBbRSBG9Xjf0kE3Yxe1PbAWcTkpr9V/6bXx2PubRrbMcoQ3uaAsekbHlzeERaaiyrgjc54TJJySPDQItMpTNIVVqH5qDINM1BYvu0A+AdqEgcMfBOnXIfqFOJyi6CN1XMvXnQG+CRC96g5V34OTzXMXuSN9AVyDgHGKd3SX4iYN6jUbySUiAlFEveRKLO7MLHpxQ0qkoVqtQGi1ih54szwXuxbNu/ihU6vlglkmk5nUXOwXRQJ/PlQqlGwC6TqhN5EtJbiJS0w1CK5BpcqTVacWOyQCZV6nEelodIpsFdEoUuVSAXy7VylVGuMkgVOtyoUpskMq1CZRBJ1BqdVa21pPJlVHPnwChCmUZntiJliVKfKlQgM3zWD0vVWhOeolUhYyqDRmcR4xFiYgEgNSVJU4Mr5MiAUI6f0t5O+j8ptG8nXKpITmlUl9Yc0iSDIoeixcY+EspiEk5jsOrNVmAmCfVIDDKOAAZtQYROUYPaT+bLgAc0DalKL1MZ1HpSd3yAR6qWAW9CAgm+EDo4BxQhTYXapNJaUPVIRMbpcRJnkA6AodKYkQ6QRhNUIkGDxQpQ4a4UgVxC4PcGLQCnnDPKOKPOaJXKtSk8iVSukyn1Cs6Ih3IaC2uwSEcg1fDTu2w/qfDFCmLUO9ComvYMKtY4HQCUu II級（廣義反應期）腦傷者擺位：應避免引發伸肌張力，使用毛巾捲穩定頭部、肩胛/骨盆下放枕頭防後縮、後穿式AFO抑制蹠屈張力。題答B（僅③⑤）較吻合（不需頸屈或膝屈45°）。"}, {"n": 46, "stem": "治療昏迷且顱內壓不穩定，且處於去大腦僵直（decerebrate rigidity）姿勢的創傷性腦傷病人，下列何種處置\n最為適當？", "options": {"A": "連續播放音樂提供聽覺刺激，喚醒知覺", "B": "進行上肢被動關節運動，物理治療師將手放在肱二頭肌上，避免引起伸直張力", "C": "漸進式搖高床頭至70度，以降低顱內壓", "D": "漸進式傾斜床訓練以增加肢體承重，並避免踝關節攣縮"}, "images": [], "answer": "B", "explanation": "去大腦僵直病人於急性顱壓不穩階段，物理治療上肢被動運動時應以手抵住肱二頭肌避免引發伸肌張力惡化；不適合大幅度傾斜或音樂刺激（增ICP）。"}, {"n": 47, "stem": "創傷性腦傷病人處於認知程度迷惑且激動（confused-agitated）的時期，在提供物理治療時，應注意介入方\n式，下列何者最適當？", "options": {"A": "安排彈性變動的治療時間與地點，增加病人的適應力與彈性", "B": "安排兩步驟以上指令的活動時，若病人執行有障礙，不要給提示，試著給予挑戰", "C": "同一次的療程中，只安排1項活動，注意力不集中時，休息後再重新練習", "D": "病人較自我中心，給予適當的選擇權，可以提高其控制感"}, "images": [], "answer": "D", "explanation": "迷惑且激動期（confused-agitated）：須給予一致的常規與簡單指令，每次只一項任務，並提供適當選擇權以減少抗拒；不應彈性變動環境或給太多挑戰。"}, {"n": 48, "stem": "評估創傷性腦傷患者行走功能的進步是否與注意力的改善有關，下列何者最適當？", "options": {"A": "閉眼睛走一直線", "B": "3公尺坐站起走測試", "C": "6分鐘行走測試", "D": "邊走邊回答問題"}, "images": [], "answer": "D", "explanation": "雙重任務評估（如邊走邊回答問題）可反映注意力分配對行走表現的影響，符合題意。其他單一測試無法直接評估認知與行走的整合。"}, {"n": 49, "stem": "面對瑞秋洛斯阿米哥斯認知功能程度量表（LOCF）第四分級的創傷性腦傷，下列何種治療策略或態度最不適\n當？", "options": {"A": "建立一致性的治療常規，例如讓患者接受同一治療師在同一時間、同一地點的治療", "B": "選擇安靜封閉的環境來進行治療，但是希望家屬陪同，以協助安撫情緒", "C": "對於病患的缺失要清楚指出並請其改正，以增加病患的抗壓性", "D": "治療師要預備多項治療項目提供選擇，以便病患分心或躁動時可以合作"}, "images": [], "answer": "C", "explanation": "LOCF IV期（confused-agitated）：應建立一致常規、安靜環境、家屬陪伴。不可清楚指出缺失或要求改正（會增加躁動），故C不適當。"}, {"n": 50, "stem": "一位78歲罹患巴金森氏病已6年的患者，走路為典型的拖曳步態及小碎步，且行走啟動困難。下列何種治療方\n式最不適當？", "options": {"A": "教導足跟著地－足尖推進之行走模式", "B": "提供附輪助行器，以促進其行走啟動能力", "C": "增加下肢的膝關節及髖關節的活動度訓練", "D": "口頭數左右左右，以促進步態的節律性"}, "images": [], "answer": "B", "explanation": "巴金森氏病步態啟動困難不適合提供附輪助行器（會因動作不協調反而推行加速增加跌倒風險）。應以視覺/聽覺提示誘發步行（地板線、節拍）。"}, {"n": 51, "stem": "有關巴金森氏病患者的臨床症狀，下列敘述何者正確？", "options": {"A": "軀幹經常呈過度伸直", "B": "僵直是動作減慢的主要原因", "C": "程序性學習（procedural learning）能力較差", "D": "相較於小腦病變而言，寫字會愈寫愈大"}, "images": [], "answer": "C", "explanation": "巴金森氏病程序性學習能力較差（基底神經節受損）；軀幹過度屈曲、動作緩慢主要因運動不能（bradykinesia）而非僵直；寫字會愈寫愈小（micrographia）。"}, {"n": 52, "stem": "有關巴金森氏病患者的非動作表徵，下列敘述何者正確？", "options": {"A": "做夢通常發生於非快速動眼期", "B": "服用左旋多巴胺通常會使病患血壓上升而造成頭暈", "C": "自主神經系統失調通常出現在病程較晚期", "D": "嗅覺喪失通常早於動作表徵出現"}, "images": [], "answer": "D", "explanation": "巴金森氏病非運動症狀：嗅覺喪失常於動作症狀前數年出現（前驅期）；夢境與快速動眼期RBD有關；左多巴可致姿勢性低血壓（不是高血壓）；自律失調可早期或後期皆有。"}, {"n": 53, "stem": "有關侯葉氏分期（Hoehn & Yahr Stage）第II & III期巴金森氏病患者的最佳運動時間，下列敘述何者正確？", "options": {"A": "一早起床，精神最好，尚未用早餐也未服用levodopa前", "B": "服用一般劑型levodopa後馬上運動", "C": "服用一般劑型levodopa後的45分鐘至1小時內開始運動", "D": "服用一般劑型levodopa 12小時後開始運動"}, "images": [], "answer": "C", "explanation": "Hoehn-Yahr II-III期病人運動最佳時機在服用一般劑型左多巴後45分鐘到1小時（藥效高峰），症狀緩解最明顯。"}, {"n": 54, "stem": "失智症初期應強調下列那些訓練？", "options": {"A": "床上活動訓練及飲食吞嚥能力指導", "B": "肌力、平衡、認知與功能性活動度訓練", "C": "輔具提供及家屬的照護指導", "D": "給予音樂與簡單休閒活動，例如唱歌"}, "images": [], "answer": "B", "explanation": "失智症初期應強調肌力、平衡、認知與功能性活動度訓練，以維持功能與認知；床上活動、輔具與簡單娛樂屬中後期重點。"}, {"n": 55, "stem": "下列何者不是與阿茲海默症病因相關的因子？", "options": {"A": "Tau蛋白質（tau-protein）", "B": "乙型類澱粉胜肽（beta-amyloid peptide）", "C": "神經纖維糾結（neurofibrillary tangle）", "D": "介白素-6（interleukin-6）"}, "images": [], "answer": "D", "explanation": "阿茲海默症病理：β-amyloid斑塊、tau蛋白磷酸化形成神經纖維糾結；IL-6為免疫發炎因子，與阿茲海默病因關聯較弱（屬次要免疫反應）。"}, {"n": 56, "stem": "指導運動失調（ataxia）的小腦損傷病患進行下肢法朗克氏運動（Frenkel exercise），最理想的起始訓練姿勢\n為何？", "options": {"A": "仰躺", "B": "坐姿有靠背", "C": "坐姿無靠背", "D": "站姿"}, "images": [], "answer": "A", "explanation": "Frenkel exercise訓練協調性，從最容易控制的姿勢開始：仰躺→坐→站→走，逐步增加挑戰。仰躺消除平衡需求，最理想起始姿勢。"}, {"n": 57, "stem": "下列何者為動作協調評估？Ƃ①患者手指來回碰觸自己的鼻子和治療師的手指 ②將患者手肘被動伸直或彎\n曲，觀察是否有阻力 ③治療師托住患者的肘部，且上臂稍微外展，並敲擊患者的肱三頭肌肌腱 ④以最快\n速度行走 ⑤在行走的過程中指示患者改變速度和行進方向", "options": {"A": "②③", "B": "②④", "C": "僅①⑤", "D": "①④⑤"}, "images": [], "answer": "D", "explanation": "動作協調評估：手指鼻尖測試（finger-nose）、足跟脛骨測試、快速交替動作、動態行走測試（變速、變方向）等。被動阻力檢查與深腱反射敲擊屬肌張力/反射檢查。"}, {"n": 58, "stem": "關於小腦損傷患者的功能恢復預後，下列敘述何者最不適當？", "options": {"A": "小腦深層核受損的患者較小腦淺層區域受損的患者預後差", "B": "若致病原因、病變位置與受損範圍皆相同，老年人預後比年輕人預後差", "C": "因良性腫瘤發病的患者較因酒精性小腦退化發病的患者預後差", "D": "小腦病變合併腦幹損傷比只有小腦損傷的患者預後差"}, "images": [], "answer": "C", "explanation": "良性腫瘤（如毛狀星細胞瘤）術後預後通常較酒精性小腦退化好（後者持續性退化）；題敘C反向描述，故較不適當。"}, {"n": 59, "stem": "下列何者最適用於評估多發性硬化症的嚴重程度與疾病進程？", "options": {"A": "共濟失調等級量表（scale for the assessment and rating of ataxia）", "B": "擴增失能狀態量表（expanded disability status scale）", "C": "改良式疲勞影響量表（modified fatigue impact scale）", "D": "多發性硬化症生活品質－54量表（multiple sclerosis quality of life–54）"}, "images": [], "answer": "B", "explanation": "EDSS（Expanded Disability Status Scale）為評估MS嚴重程度與進展的標準量表；其他三項評估特定面向（共濟失調、疲勞、生活品質）。"}, {"n": 60, "stem": "下列何種運動型態對於提升多發性硬化症患者肌力與肌耐力最為理想？", "options": {"A": "1天中體溫最高時進行，先練習完上肢小肌群，再練下肢大肌群", "B": "1天中體溫最高時進行，上肢肌群與下肢肌群交替練習", "C": "1天中體溫最低時進行，先練習完上肢小肌群，再練下肢大肌群", "D": "1天中體溫最低時進行，上肢肌群與下肢肌群交替練習"}, "images": [], "answer": "D", "explanation": "MS患者運動建議：1）一天中體溫最低時（早晨或冷天）進行，避免Uhthoff現象（熱使症狀惡化）；2）上下肢交替訓練避免局部過熱、降低疲勞累積。"}, {"n": 61, "stem": "對於已經進入輪椅期的肌萎縮性側索硬化症（amyotrophic lateral sclerosis）患者，下列治療何者最不適當？", "options": {"A": "在能忍受的範圍內訓練等長收縮", "B": "利用熱敷協助控制肌肉痙攣（spasm）", "C": "如有長距離的移行需求時，建議使用電動輪椅", "D": "教導家屬協助患者進行主動阻力運動"}, "images": [], "answer": "D", "explanation": "ALS輪椅期患者肌力嚴重下降，主動阻力運動會加速肌肉疲勞與衰退；應以等長與輕度有氧為主，避免過度負荷。家屬主導阻力訓練不適當。"}, {"n": 62, "stem": "有關早期肌萎縮性側索硬化症的運動介入原則，下列何者正確？", "options": {"A": "肌力訓練應強調進行離心收縮", "B": "肌耐力訓練的強度應以患者訓練完會覺得疲乏為原則", "C": "肌力訓練應以中等強度進行，並著重在肌力大於3分的肌群", "D": "患者在肌力訓練30分鐘內出現肌力降低的現象是常見的，不需因此調整介入方式"}, "images": [], "answer": "C", "explanation": "早期ALS運動原則：肌力訓練以中等強度進行，重點放在肌力≥3分（重力以上）的肌群，避免低肌力肌肉過度疲勞而加速衰退。"}, {"n": 63, "stem": "有關人類免疫缺乏病毒（HIV）感染或愛滋病患者可能產生的系統性表徵，下列何者錯誤？", "options": {"A": "肌肉骨骼系統病變通常發生於早期HIV感染者，常見病變包含骨頭或軟組織感染、多發性肌炎、肌肉病變、 關節炎等", "B": "HIV感染者可能發生代謝異常，包含身材改變（凸腹）、高血脂及胰島素阻抗等，而這可能與服用抗愛滋的 雞尾酒療法有關", "C": "HIV感染者之自主、中樞及周邊神經系統都可能受到影響", "D": "可能產生肢體末梢肌無力或疼痛麻刺感，影響個案的姿勢控制、平衡或步態"}, "images": [], "answer": "A", "explanation": "HIV感染早期通常無明顯肌肉骨骼系統病變；多發於慢性期或愛滋階段。題敘述「通常發生於早期」錯誤。"}, {"n": 64, "stem": "林小姐5年前因寡突細胞膠質瘤術後造成左側肢體無力，2週前發現腫瘤復發，下列何者與腦瘤復發較無關？", "options": {"A": "最近3個月從開朗變得容易莫名的沮喪或突然發脾氣", "B": "近半年看電腦時覺得視力變得模糊，好像有複視的現象", "C": "最近在做運動時，覺得左側肩膀疼痛，尤其是舉高過頭時", "D": "近來變得不愛吃東西，喝水的時候容易咳嗽"}, "images": [], "answer": "C", "explanation": "腦瘤復發症狀為腦壓上升或腫瘤侵犯造成：情緒改變、視野/複視、吞嚥困難、頭痛等。「肩痛舉過頭」較像肩關節肌骨問題，與腦瘤復發較無關。"}, {"n": 65, "stem": "後小兒麻痺症候群（post-polio syndrome）患者出現下列何症狀時，顯示有其他神經系統疾病？", "options": {"A": "肌力萎縮", "B": "肌束顫動", "C": "肌肉僵直", "D": "肌肉抽筋"}, "images": [], "answer": "C", "explanation": "後小兒麻痺症候群（PPS）症狀為：肌力下降、肌束顫動、疲勞、肌肉抽筋、疼痛。肌肉僵直（rigidity）為錐體外症候，提示其他疾病（如帕金森、ALS）。"}, {"n": 66, "stem": "下列有關基蘭－巴瑞氏症候群（Guillain-Barré syndrome）之敘述，下列何者正確？①為自身免疫損害周邊神\n經系統，而導致的急性肌肉無力之疾病 ②與周邊神經脫髓鞘損害以及軸索病變有關 ③可能會侵犯感覺神\n經造成疼痛 ④只會影響四肢，不會影響到呼吸肌肉 ⑤自主神經系統不會受到侵犯", "options": {"A": "①②③", "B": "②③④", "C": "①③⑤", "D": "①②⑤"}, "images": [], "answer": "A", "explanation": "GBS：①自體免疫攻擊周邊神經②脫髓鞘+軸索病變③可侵犯感覺神經造成疼痛。但會影響呼吸肌肉（橫膈、肋間肌→需呼吸器）與自主神經（心律不整、血壓不穩）。"}, {"n": 67, "stem": "關於糖尿病周邊神經病變，下列敘述何者最不適當？", "options": {"A": "以感覺為主的多發性神經病變最為常見", "B": "會影響溫度覺、震動覺與本體覺", "C": "不會影響自主神經", "D": "病患常主訴足部及下肢麻與刺痛"}, "images": [], "answer": "C", "explanation": "糖尿病周邊神經病變不只影響感覺，也影響自主神經（如體位性低血壓、胃輕癱）。題敘「不會影響自主神經」錯誤。"}, {"n": 68, "stem": "病患的周邊神經損傷程度已經出現軸突斷裂、瓦勒氏退化，但周圍支持組織仍完好，根據桑德蘭\n（Sunderland）的分類，會判定受傷等級為何？", "options": {"A": "I", "B": "II", "C": "III", "D": "IV"}, "images": [], "answer": "B", "explanation": "Sunderland分類：I（神經傳導阻滯，髓鞘輕傷）→II（軸突斷裂+Wallerian變性，內神經膜完整）→III（內神經膜斷）→IV（神經束膜斷）→V（神經外膜斷）。題目敘述屬第II級。"}, {"n": 69, "stem": "進行豪派－狄克測試（Hallpike-Dix test）時，將受試者擺位完成，宜等待多久後詢問眩暈情況？", "options": {"A": "立即", "B": "20秒", "C": "1分鐘", "D": "由病患主動告知，無須詢問"}, "images": [], "answer": "B", "explanation": "Hallpike-Dix testing擺位完成後須等待約20-30秒以觀察特徵性眼震延遲與漸減特徵；立即詢問可能尚未引發症狀。"}, {"n": 70, "stem": "65歲女士診斷為良性偶發性姿勢性眩暈，下列敘述何者正確？", "options": {"A": "病理機轉為內淋巴液水腫，造成內耳壓力不正常", "B": "最常發生在水平半規管", "C": "可經由豪派－狄克測試作為診斷測試", "D": "會有耳鳴、眩暈、噁心、姿勢不平衡的症狀"}, "images": [], "answer": "C", "explanation": "BPPV病理為後半規管耳石脫落，最常用Hallpike-Dix測試診斷；不是水平半規管最常見；無耳鳴、聽力影響（與梅尼爾氏病不同）。"}, {"n": 71, "stem": "關於前庭復健，下列訓練原則何者錯誤？", "options": {"A": "先在張眼時練習，漸漸進展到閉眼時練習，以減少視覺代償", "B": "先在平地上行走，漸漸進展到軟墊上行走，以減少體感覺輸入的貢獻", "C": "先直線行走，漸漸進展到走8字型或轉圈的路徑，以增加前庭刺激", "D": "行走時先與肩同寬，漸漸進展到加大底面積的方式行走"}, "images": [], "answer": "D", "explanation": "前庭復健中，行走訓練應從寬底面積（與肩同寬）漸進到窄底面積（一直線、串聯步），不是反向。其他三點訓練原則正確。"}, {"n": 72, "stem": "小蘇因為頭暈被轉診到物理治療，下列那一項檢查結果呈現陽性時，可以確定為半規管病變所引起的暈眩？", "options": {"A": "自發性眼球震顫（spontaneous nystagmus）", "B": "平滑追視（smooth pursuit）", "C": "快速移動掃視（saccade）", "D": "頭部猛推測試（head-thrust test）"}, "images": [], "answer": "D", "explanation": "Head-thrust（頭部猛推）測試陽性可確認單側半規管功能異常（VOR異常）；眼震、平滑追視、跳視可呈現中樞或周邊病變但非半規管特定。"}, {"n": 73, "stem": "古先生在一次感冒過後，突然發現雙手及雙腳從遠端開始出現對稱性麻麻的感覺及無力感，並在接下來幾天\n迅速往肢體近端蔓延，檢查發現腦脊液白蛋白（albumin protein）細胞數正常但濃度增加，應最先懷疑古先生\n是罹患何種疾病？", "options": {"A": "多發性硬化症", "B": "基蘭－巴瑞氏症候群", "C": "後小兒麻痺症候群", "D": "肌萎縮性側索硬化症"}, "images": [], "answer": "B", "explanation": "GBS症狀：感冒後對稱性遠端→近端蔓延的麻木與無力，CSF出現「白蛋白-細胞分離現象」（蛋白增加、細胞數正常）。"}, {"n": 74, "stem": "有關基蘭－巴瑞氏症候群和後小兒麻痺症候群的比較，下列何者正確？", "options": {"A": "皆有對稱性肌肉無力的症狀", "B": "肌肉張力皆會明顯增大", "C": "訓練時皆需避免肌肉疲勞", "D": "皆有機會完全復原"}, "images": [], "answer": "C", "explanation": "GBS可疲勞、PPS不應過度疲勞→兩者皆需避免肌肉疲勞。GBS可大部分恢復但PPS無法完全恢復；GBS非對稱性、PPS兩者都不會張力增大（為下運動神經元病變）。"}, {"n": 75, "stem": "關於老年人行走表現，下列敘述何者錯誤？", "options": {"A": "較謹慎或較不穩定的步態，但與病態步態不類似", "B": "步伐縮短、步頻和雙腳支撐時間增加", "C": "單腳支撐的時間減少", "D": "足部較平貼地面而減少推進力量"}, "images": [], "answer": "B", "explanation": "老年人步態：步伐縮短、步寬增加、雙腳支撐期增加、單腳支撐減少；但步頻通常下降（不是增加）。"}, {"n": 76, "stem": "根據實證證據，對於肌少症的肌力訓練，下列何者正確？", "options": {"A": "年紀大於80歲，每週至少3次高強度（70% to 80% 1 RM）訓練，對肌力增加才有助益", "B": "年紀大於80歲，應避免阻力訓練，改以有氧訓練依然相同效果", "C": "高強度向心助力運動較高強度離心助力運動，有助於肌力增加", "D": "高強度離心阻力運動較高強度向心阻力運動，有助於肌力增加"}, "images": [], "answer": "D", "explanation": "肌少症高強度離心訓練（與向心比較）可有效增加肌力與肌肉量，所需代謝負擔較低，特別適合年長者。"}, {"n": 77, "stem": "安寧團隊照會物理治療師前去評估李奶奶的日常生活功能，發現李奶奶已完全依賴他人進行床與輪椅之間轉\n位，其生活功能獨立量表（FIM）中轉位項目得分為何？", "options": {"A": "1", "B": "0", "C": "6", "D": "7"}, "images": [], "answer": "A", "explanation": "FIM轉位項目1分：完全依賴他人（<25%自我執行）；7分為完全獨立。"}, {"n": 78, "stem": "一位長期臥床的個案，在薦骨處有一個2公分的傷口，有部分組織壞死且有化膿現象，但個案不覺疼痛，屬於\n第幾級的壓瘡？", "options": {"A": "一", "B": "二", "C": "三", "D": "四"}, "images": [], "answer": "C", "explanation": "壓瘡分級：1級紅斑不褪色、2級表淺潰瘍、3級全層皮膚壞死至皮下組織、4級延伸至肌肉骨骼。題目「2 cm有部分組織壞死、化膿、不痛」屬第3級。"}, {"n": 79, "stem": "美國疾病與控制預防中心（Center for Disease Control and Prevention）建議，老人每週身體活動量至少應為多\n少？", "options": {"A": "30分鐘的中強度運動", "B": "30分鐘的重度運動", "C": "150分鐘的中強度運動", "D": "150分鐘的重度運動"}, "images": [], "answer": "C", "explanation": "CDC建議老年人每週至少150分鐘中強度有氧運動（或75分鐘高強度），加上每週2次以上肌力訓練。"}, {"n": 80, "stem": "在社區帶領健康促進活動時，下列何種體況絕對不適合進行有氧運動？", "options": {"A": "休息時心跳99 bpm", "B": "血氧濃度92%", "C": "收縮壓185 mmHg", "D": "舒張壓121 mmHg"}, "images": [], "answer": "D", "explanation": "舒張壓>110-120 mmHg為運動絕對禁忌（高血壓性緊急情況風險）；題目D（121 mmHg）超過此限。其他選項為相對禁忌或須監測。"}]}, "Q2": {"label": "第二次", "questions": [{"n": 1, "stem": "下列何項動作控制理論強調控制系統有階層之分，其最高階層是抽象規則（abstract rules），可用低階不同肢\n體部分來執行，得到同樣的動作模式？", "options": {"A": "階層理論（hierarchical theory）", "B": "動作程式理論（motor programming theory）", "C": "系統理論（systems theory）", "D": "動態系統理論（dynamical systems theory）"}, "images": [], "answer": "B", "explanation": "動作程式理論（motor programming theory）強調控制階層化，最高階為抽象動作規則（如書寫），可由不同肢體（手、腳）執行而產生相同模式（如signature with foot）。"}, {"n": 2, "stem": "讓前庭損傷患者在治療室練習平地原地踏步，以降低動作時的眩暈感，依照Gentile的任務分類方法，其依環境\n分類為何？", "options": {"A": "靜態變化", "B": "動態變化", "C": "靜態一致", "D": "動態一致"}, "images": [], "answer": "C", "explanation": "Gentile任務分類：環境靜態vs.動態、需身體移動vs.不需。原地踏步在固定治療室進行，環境靜態，且重複執行相同動作（任務一致），故為「靜態一致」。"}, {"n": 3, "stem": "下列敘述，何者較能確認有動作學習的發生？", "options": {"A": "動作練習過程中，錯誤率降低", "B": "動作練習10分鐘、休息2分鐘、再次練習時，錯誤率降低", "C": "動作練習10分鐘、休息2分鐘、再次練習時，動作練習時間縮短", "D": "上肢動作練習20分鐘、接著步態訓練30分鐘，接著進行上肢動作，此時錯誤率降低"}, "images": [], "answer": "D", "explanation": "動作學習的真正評估須通過保留與遷移測試。題目D「上肢→步態→上肢」之中存在干擾任務後再次測試，仍可降低錯誤率代表學習已轉化為長期記憶。"}, {"n": 4, "stem": "有關亞當的閉鏈式動作學習理論（Adam's closed-loop theory），下列敘述何者錯誤？", "options": {"A": "強調利用動作過程中的回饋訊息，來增強動作的感知痕跡（perceptual trace）", "B": "主張若在學習的過程中犯錯則不利於學習，若給予指引則有利於學習", "C": "適用於解釋慢速、線性的動作，無法解釋快速的動作是如何學習", "D": "可用此理論解釋為何去感覺神經的動物仍可產生熟練的動作"}, "images": [], "answer": "D", "explanation": "Adam's閉鏈理論強調感覺回饋；去感覺神經動物仍可產生熟練動作，這與Schmidt's open-loop / generalized motor program理論才能解釋；故D錯誤。"}, {"n": 5, "stem": "有關神經塑性的說明，下列何者最為適當？", "options": {"A": "在中樞神經系統中，目前只在大腦中有證據指出具神經塑性", "B": "大腦塑性的可能機轉主要以神經細胞新生（neurogenesis）為主", "C": "依據促進大腦塑性的概念，治療師不應給予太多不必要的練習，以免妨礙皮質重組", "D": "神經塑性可能是「限制誘發動作治療」產生效果的原因"}, "images": [], "answer": "D", "explanation": "神經塑性可解釋限制誘發動作治療（CIMT）的療效（皮質地圖重組）。塑性發生於整個CNS（不限大腦）；以突觸效能改變為主而非神經細胞新生；需大量練習。"}, {"n": 6, "stem": "有較佳的患側上肢動作功能恢復的成人中風病患，在偏癱側上肢動作時，最常伴隨下列那一種腦部活化模式？", "options": {"A": "受損的腦半球（ipsilesional hemisphere）會高度活化，另一側腦半球幾乎不活化", "B": "受損對側腦半球（contralesional hemisphere）會高度活化，另一側腦半球幾乎不活化", "C": "兩側大腦半球會同時高度活化", "D": "兩側大腦半球會同時低度活化"}, "images": [], "answer": "A", "explanation": "上肢動作恢復較佳的中風病患通常以「同側受損腦半球」高度活化、對側活化降低（接近正常模式）；恢復差的個案兩側皆活化（補償型重組）。"}, {"n": 7, "stem": "使用修正式艾許沃斯量表（modified Ashworth scale）評估一名上運動神經元損傷患者，被動移動關節時，阻力\n發生在關節活動度前1/2。下列關於此評估在國際健康功能與身心障礙分類系統（ICF）的面向與分數何者正\n確？", "options": {"A": "身體功能（body function）、 1", "B": "活動限制（activity limitation）、1+", "C": "身體功能（body function）、1+", "D": "活動限制（activity limitation）、1"}, "images": [], "answer": "C", "explanation": "MAS分數1+：阻力出現於關節活動度前1/2範圍。MAS評估反映身體功能（張力），屬ICF body function面向。"}, {"n": 8, "stem": "使用巴氏量表評估中風患者的移位能力，下列關於此評估在國際健康功能與身心障礙分類系統（ICF）的面向\n與分數何者正確？", "options": {"A": "身體功能（body function）、得分越低失能程度越高", "B": "活動限制（activity limitation）、得分越低失能程度越高", "C": "身體功能（body function）、得分越低失能程度越低", "D": "活動限制（activity limitation）、得分越低失能程度越低"}, "images": [], "answer": "B", "explanation": "Barthel index評估自我照顧與行動能力，屬ICF活動限制面向；分數越低（越無法獨立執行）失能程度越高。"}, {"n": 9, "stem": "陳先生可以流利的講話，但無法聽懂或遵循治療師的口語指令，其語言問題為下列何者？", "options": {"A": "全失語症（global aphasia）", "B": "Wernicke's失語症", "C": "Broca's失語症", "D": "構音困難（dysarthria）"}, "images": [], "answer": "B", "explanation": "Wernicke's失語症（接受性失語）：流利但內容空洞、無法理解口語。Broca's失語症為非流利但理解較佳。全失語症兩者皆受損。"}, {"n": 10, "stem": "治療師利用肌貼改善中風病人的動作表現，下列敘述何者不適當？", "options": {"A": "藉由提供感覺刺激，增加動作目標部位的感覺回饋", "B": "藉由改變貼紮的起始位置抑制肌肉張力", "C": "藉由肌貼的張力協助肌肉收縮", "D": "藉由肌貼改善淋巴循環，協助改善動作控制異常"}, "images": [], "answer": "D", "explanation": "肌貼可提供感覺刺激、輔助肌肉收縮、調整貼紮張力來抑制或促進肌肉。肌貼改善淋巴循環的機轉與動作控制無直接關聯，故D不適當。"}, {"n": 11, "stem": "小腦中風病患，行走時因缺乏軀幹及下肢的協調性交替動作控制，造成跌倒。下列那些訓練方式較適合改善\n該病患的問題？①坐在治療球上，練習踏步 ②站姿下練習跨步，治療師在跨步腳的骨盆前方給予阻力以誘\n發骨盆旋前 ③練習快速度行走 ④提供滑輪式助行器", "options": {"A": "①②", "B": "②③", "C": "③④", "D": "①③"}, "images": [], "answer": "A", "explanation": "小腦中風患者的核心訓練是動態平衡與軀幹下肢協調：坐治療球練踏步、跨步阻力誘發骨盆旋前皆適合。快走或被動助行器無法改善協調。"}, {"n": 12, "stem": "具有痙攣症狀的中風患者與具有僵硬症狀的巴金森氏病患者，巴賓斯基（Babinski）反射之測量結果，最有可\n能為下列何者？", "options": {"A": "兩者皆呈陽性反應", "B": "兩者皆呈陰性反應", "C": "中風患者為陽性反應、巴金森氏病患者為陰性反應", "D": "中風患者為陰性反應、巴金森氏病患者為陽性反應"}, "images": [], "answer": "C", "explanation": "中風患者上運動神經元損傷會出現Babinski陽性；巴金森氏病為基底神經節病變（不損傷皮質脊髓徑），Babinski通常陰性。"}, {"n": 13, "stem": "訓練偏癱病患由患側翻向健側的能力，下列何者較符合神經發展治療（NDT）的技巧原則？", "options": {"A": "誘發患側上肢跨過中線往健側方向，以帶動上軀幹的屈曲旋轉動作產生翻身", "B": "引導健側腳勾住患側腳，帶動軀幹的伸直旋轉動作以翻向健側", "C": "誘發頭部的向後伸直，以引發患側肩胛骨離開床面以翻向健側", "D": "協助雙下肢屈曲，足部踩在床上以推動下軀幹伸直旋轉動作產生翻身"}, "images": [], "answer": "A", "explanation": "NDT翻身原則：誘發患側上肢跨過中線→帶動軀幹屈曲旋轉→翻身至健側。著重對稱性軀幹啟動。"}, {"n": 14, "stem": "訓練一名無法主動翻身的中風患者，首先利用被動動作到主動－協助動作，再給予適合的阻力，最後請患者\n主動翻身至健側，此方式最可能是下列那個本體感覺神經肌肉誘發技巧？", "options": {"A": "節律穩定", "B": "重複收縮", "C": "節律啟動", "D": "重複牽張"}, "images": [], "answer": "C", "explanation": "Rhythmic initiation節律啟動：被動→主動協助→主動→主動阻力的漸進過程，用於難以主動啟動動作的患者。"}, {"n": 15, "stem": "利用布朗斯壯的治療方法誘發下肢行走擺盪期的髖屈曲，下列何者正確？①利用雷密特式（Raimiste\nphenomenon）聯合動作給健側阻力，誘發患側動作 ②利用不對稱的頸強直反射，將病人頭轉向患側，誘發\n患側腳屈曲 ③請病人將健側髖關節屈曲，並給予髖屈肌阻力 ④抓住患側腳趾很快輕輕做出向下屈曲刺\n激，引發下肢屈曲反射 ⑤站立時，膝微彎練習患側腳往前後踏步", "options": {"A": "④⑤", "B": "①③", "C": "②④", "D": "①②"}, "images": [], "answer": "A", "explanation": "Brunnstrom誘發下肢屈曲動作：抓住腳趾向下做快速被動屈曲（屈肌反射），或站立膝微彎踏步以反覆刺激；皆能使屈髖協同動作出現。"}, {"n": 16, "stem": "患者剛開始進行中風急性後期（PAC）訓練，雖已可行走，但患側於站立期膝關節會過度伸直（back\nknee）。經評估發現，下肢僅肌力較差，張力、本體感覺、活動度等均大致正常。下列何訓練最適合此患\n者？", "options": {"A": "使用穿戴式護膝行走，並等待肌力自行恢復", "B": "提供輔具於健側做支撐，並避免用患側承重", "C": "進行承重跑步機訓練，支撐重量為體重之50%，速度愈慢愈好", "D": "站立時用彈力帶繞過患側大腿，以PNF D1伸直模式做阻力訓練"}, "images": [], "answer": "D", "explanation": "Back-knee（膝過度伸直）若僅肌力不足可用彈力帶提供PNF D1伸直阻力訓練（強化股四頭與膕旁協調），維持站立期穩定。"}, {"n": 17, "stem": "根據玻巴斯學派，要誘發一位偏癱患者翻身向患側，下列何者應優先考慮？", "options": {"A": "訓練健側肌力", "B": "確認患者頭部可以抬高", "C": "引導患側上肢支撐床面", "D": "鼓勵患者先做心像練習"}, "images": [], "answer": "B", "explanation": "Bobath翻身向患側：頭部抬起為先決條件（避免頸過度伸直反射），確認後再帶動軀幹翻轉。"}, {"n": 18, "stem": "有關使用手杖對神經科物理治療病患造成的影響，下列敘述何者錯誤？", "options": {"A": "目的為協助病患支撐體重", "B": "可增加病患的支撐底面積、增加穩定度", "C": "會增加認知上注意力需求", "D": "不當使用會增加跌倒風險"}, "images": [], "answer": "A", "explanation": "手杖目的是提供感覺資訊與部分穩定，不是支撐體重（體重支撐為腋下枴/助行器功能）；可增加支撐底面積、認知需求並可能增加跌倒風險。"}, {"n": 19, "stem": "採用任務取向策略來評估一位神經系統損傷患者由坐姿站起功能時，下列那一項不是檢查的重點？", "options": {"A": "平時從坐姿站起來以執行日常活動的頻率", "B": "從坐姿站起來採用的動作策略型態", "C": "有那些損傷影響其從坐姿站起來之功能", "D": "站起來後能維持站姿多久"}, "images": [], "answer": "D", "explanation": "任務取向評估重點：頻率（情境）、動作策略、損傷因子；維持站姿時間屬另一獨立任務評估，不是坐到站動作評估的重點。"}, {"n": 20, "stem": "根據任務取向模式概念，應如何進行步行訓練？", "options": {"A": "須等候步態前的動作控制訓練成功後，才能開始進行步行訓練", "B": "須等候平衡訓練成功後，才能開始進行步行訓練", "C": "應儘早開始進行步行訓練", "D": "應利用懸吊系統完全支撐體重，以避免不正常步態"}, "images": [], "answer": "C", "explanation": "任務取向強調儘早開始實際任務練習（如行走訓練），不必等待平衡或預備動作完全成熟才開始。"}, {"n": 21, "stem": "下列何者不屬於虛擬實境應用於神經物理治療的優點？", "options": {"A": "提供多樣性感覺刺激回饋", "B": "減少治療產生的頭暈副作用", "C": "促進大腦皮質再造", "D": "降低治療的無趣感"}, "images": [], "answer": "B", "explanation": "VR治療常見副作用包括頭暈、眩暈（cybersickness）；不能消除而是仍需觀察和管理。其他三項為VR治療優點。"}, {"n": 22, "stem": "王先生已經中風六個月了，目前上肢仍然沒有主動動作，只有肘關節有些微的彎曲張力，下列處置何者較不\n合適？", "options": {"A": "利用四肢著地跪姿（all four）增加肩關節的穩定性", "B": "利用本體感覺神經肌肉誘發技巧的下砍與上抬（chopping / lifting）增加上肢動作", "C": "隨時配戴三角巾固定患側上肢，以避免肩關節脫位", "D": "練習患側上肢承重姿勢，同時拍打三頭肌誘發肌肉收縮"}, "images": [], "answer": "C", "explanation": "中風後若整天配戴三角巾固定上肢會使肩關節僵硬，反而妨礙血液循環與動作恢復；應交替使用並結合主動運動。"}, {"n": 23, "stem": "神經內科醫師照會一位35歲的電腦工程師王先生，主要診斷為小腦梗塞型中風，治療師到病房進行評估，下\n列何者不屬於王先生的優先評估項目？", "options": {"A": "觀察病人用手摸臀部後方的動作模式", "B": "請病人放鬆，用不同速度活動病人的各肢段", "C": "請病人反覆用食指碰觸治療師的食指與自己的鼻尖", "D": "請病人說出自己家的住址，觀察說話的清晰度"}, "images": [], "answer": "A", "explanation": "小腦中風急性評估重點：肌張力、協調性（手指鼻尖）、口語清晰度（dysarthria）。「摸臀部後方」屬功能性動作，非優先小腦評估。"}, {"n": 24, "stem": "腦中風病患經影像診斷為視丘後外側核受損，其臨床症狀出現無法維持穩定坐姿、重心偏向患側，且健側無\n法適當承重代償，為訓練其坐姿平衡能力，下列何者最為適當？", "options": {"A": "應先強調患側的動作控制訓練，以增加其承重能力", "B": "治療師或照顧者應儘量在患側邊保護，並且協助調整其姿勢將重心往健側位移", "C": "鼓勵病患將頭轉向患側，以提供患側邊適當的視覺回饋，改善其坐姿", "D": "在健側邊提供標的物，使病患主動將重心轉移向健側標的物"}, "images": [], "answer": "D", "explanation": "視丘後外側核受損（同側偏癱）造成承重失衡：應提供健側標的物，鼓勵主動轉移重心至健側以促進患側承重，符合任務取向訓練。"}, {"n": 25, "stem": "中風患者平躺時，健側下肢抵抗阻力進行外展動作，患側下肢也出現外展動作。有關患側下肢之布朗斯壯動\n作分期，下列敘述何者最適當？", "options": {"A": "尚無主動動作且軟癱無力", "B": "尚無主動動作，但出現肌肉張力增強的痙攣反應", "C": "已有主動動作，且可在平躺膝關節伸直時外展單側髖關節", "D": "已有主動動作，且可在站姿髖關節伸直時單獨彎曲膝關節"}, "images": [], "answer": "B", "explanation": "Raimiste反射型聯合反應屬Brunnstrom第II期：尚無主動動作，但對健側阻力可誘發患側相同方向動作（張力增強的痙攣反應）。"}, {"n": 26, "stem": "訓練中風病人在單腳站立時期支持身體抵抗重力和向前推進，最需加強下列何肌肉的控制？", "options": {"A": "臀中肌", "B": "髖內收肌", "C": "髖屈肌", "D": "足踝背屈肌"}, "images": [], "answer": "A", "explanation": "單腳站立時期的支撐主要由臀中肌穩定骨盆，避免Trendelenburg掉落；同時提供向前推進的側向穩定。"}, {"n": 27, "stem": "關於中風族群體適能運動處方的設計及運動時的注意事項，下列那些正確？①初期有氧運動強度在60%至\n80%的最大耗氧量 ②每天運動20～60分鐘，每周運動3至5次，內容應包含阻力訓練、有氧運動及伸展運\n動 ③服用乙型阻斷劑患者，應以自覺用力程度（RPE）來決定運動強度 ④服用血管擴張劑患者，可能會\n有心律不整的症狀，運動時應有心電圖監測 ⑤服用利尿劑患者，運動後需要有較長的緩和時間（cool-\ndown），避免運動後低血壓發生 ⑥統合分析結果，中風後的體適能訓練可以有效改善行走速度及行走耐力", "options": {"A": "①②③⑥", "B": "①②④⑤", "C": "③⑤⑥", "D": "僅②③⑥"}, "images": [], "answer": "D", "explanation": "中風體適能：強度應為40-70%最大耗氧量（不是60-80%初期）；服用利尿劑運動後需較長cool-down防低血壓；服用乙型阻斷劑使用RPE評估強度；統合分析確認體適能訓練改善行走速度與耐力。故D（②③⑥）正確。"}, {"n": 28, "stem": "處理中風病人股四頭肌痙攣的問題，下列何者較無法達到緩和張力的效果？", "options": {"A": "熱敷股四頭肌，放鬆肌肉緊繃，增加肌肉延展度", "B": "在屈膝仰臥（hooklying）的姿勢下，使用節律性旋轉（rhythmic rotation）手法，延展並旋轉下半身軀幹及股 四頭肌", "C": "在四足趴（quadruped）的載重姿勢下，利用壓力抑制張力", "D": "訓練膕旁肌的主動收縮來抑制拮抗肌張力"}, "images": [], "answer": "A", "explanation": "熱敷可放鬆肌肉但對中樞性痙攣（spasticity）效果有限。其他三項（節律性旋轉、四足趴承重、拮抗肌主動收縮）對降低痙攣有實證效果。"}, {"n": 29, "stem": "根據任務取向模式概念，及早開始步行訓練才能增進步行能力。下列那種步行訓練方式，較不易產生不對稱\n的步態？", "options": {"A": "及早穿戴前穿式踝足裝具協助行走", "B": "以步行輔具（助行器、四腳拐）協助訓練行走", "C": "以手杖－患側腳－健側腳，三點步態的順序訓練行走", "D": "以部分載重懸吊系統進行平面步行訓練"}, "images": [], "answer": "D", "explanation": "部分載重懸吊跑步機提供對稱負重與穩定環境，最不易產生不對稱步態；其他輔具或踝足裝具可能加深不對稱性。"}, {"n": 30, "stem": "有關以限制誘發動作治療（CIMT）訓練中風患者上肢動作，下列敘述何者最不適當？", "options": {"A": "認知功能差的患者較不適用", "B": "相較於患側手完全癱瘓的患者，已具備部分動作控制功能者，其治療效果較差", "C": "治療過程須限制患者的健側手，可能會使患者順從度較差", "D": "因需要較長的介入時間，所以患者的動機是重要的考量因素"}, "images": [], "answer": "B", "explanation": "CIMT對部分動作功能（伸腕10°、伸指10°）患者效果最佳；題敘B（已具部分動作者效果差）反向錯誤。"}, {"n": 31, "stem": "對於中風患者進行步行訓練之敘述，下列何者最不適當？", "options": {"A": "可利用本體感覺神經肌肉誘發技巧之D2伸直模式進行踝關節阻力訓練", "B": "急性期之中風患者可進行早期行走訓練介入，例如可使用懸吊式跑步機進行行走訓練", "C": "部分體重支撐跑步機訓練之概念，為透過活化中樞型態產生器產生跨步動作促進行走功能", "D": "可使用踝足矯具（ankle foot orthosis）改善步態"}, "images": [], "answer": "A", "explanation": "PNF D2伸直模式為下肢蹠屈內翻（不適合中風垂足訓練）；應使用D1屈曲（背屈外翻）改善垂足。"}, {"n": 32, "stem": "中風病患看到鬧鐘，無法知道是什麼東西，但聽到鬧鐘的滴答聲就能說出這個物體是鬧鐘，此病患可能有什\n麼症狀？", "options": {"A": "聯想型失用症（ideational apraxia）", "B": "失讀症（alexia）", "C": "失認症（agnosia）", "D": "接受性失語症（receptive aphasia）"}, "images": [], "answer": "C", "explanation": "失認症（agnosia）：感覺路徑完整但無法辨識物體（視覺agnosia看到鬧鐘但不認識）；其他感覺（聽覺）正常時可辨識，故為失認症。"}, {"n": 33, "stem": "有關中風患者肢體動作訓練之敘述，下列何者正確？", "options": {"A": "布朗斯壯學派主張要完全抑制不正常協同動作的發生", "B": "本體感覺神經肌肉誘發技巧利用慢速伸展及機器產生阻力來誘發動作", "C": "玻巴斯治療學說強調反射抑制模式", "D": "機器人輔助運動的治療效果已證實比熟練治療師的治療效果好"}, "images": [], "answer": "C", "explanation": "Bobath（玻巴斯）強調反射抑制模式（reflex inhibiting patterns），透過特定姿勢抑制不正常張力。Brunnstrom則使用協同動作。"}, {"n": 34, "stem": "以雙重任務的方式訓練中風個案行走，下列何種作法最正確？", "options": {"A": "練習從坐姿站起再走路的連續動作", "B": "分別在安靜與吵雜的區域練習走路", "C": "手上拿一個裝水的杯子行走", "D": "戴上太陽眼鏡行走"}, "images": [], "answer": "C", "explanation": "雙重任務（dual task）訓練同時做認知或動作任務（手拿杯子需平衡控制與物體操作）。其他三項偏向情境變化或環境調適。"}, {"n": 35, "stem": "使用限制誘發動作治療，增進中風患者的手部功能，其治療原則包括下列那些項目？①限制患側手的活動\n②限制健側手的活動 ③長時間限制 ④短時間限制  ⑤密集性訓練 ⑥分散式訓練", "options": {"A": "①③⑤", "B": "②④⑥", "C": "②③⑤", "D": "①④⑥"}, "images": [], "answer": "C", "explanation": "CIMT原則：限制健側手（②）、長時間限制（每天6小時，2-3週，③）、密集性訓練（⑤），三者結合促進患側使用。"}, {"n": 36, "stem": "有關中風後肩關節疼痛之敘述，下列何者正確？", "options": {"A": "中風早期屬於軟癱性的肩關節疼痛，需長期使用肩吊帶來減少肩關節附近軟組織被過度拉扯受傷", "B": "痙攣性的肩關節疼痛，應特別注意肩胛骨的活動度，可搭配使用肩關節鬆動術", "C": "反射性交感神經失養症，在手部皮膚冷濕且過度敏感時，應加強保護與減少活動", "D": "中風後肩關節疼痛與肩關節半脫位病理機轉相同，應同時評估"}, "images": [], "answer": "B", "explanation": "Bobath觀念中，痙攣性肩痛應加強肩胛骨活動度與旋轉，搭配肩關節鬆動術。軟癱期不應長期使用肩吊帶（會加深痙攣）；CRPS不需減少活動。"}, {"n": 37, "stem": "對於胸髓完全損傷患者與腰髓完全損傷患者的支架行走訓練，下列敘述何者正確？", "options": {"A": "二者皆能利用支架協助完成日常社區行走功能", "B": "前者即令使用支架亦無法具備日常社區行走功能；而後者在支架協助下則有較多機會可於戶外行走", "C": "二者皆必須使用膝踝足矯具（KAFO）協助行走訓練", "D": "前者可使用交替式步行支架（reciprocal gait orthosis, RGO）訓練行走；而後者則不適合使用RGO"}, "images": [], "answer": "B", "explanation": "胸髓完全損傷者步行能力有限，即使使用支架也僅可短距離治療性行走；腰髓損傷者保留下肢部分運動功能，使用矯具可有戶外行走機會。"}, {"n": 38, "stem": "一位經診斷為T6右側布朗斯夸症候群的脊髓損傷病患，受傷節以下之症狀，下列何者正確？①右側下肢無\n力  ②左側震動覺保留  ③右側疼痛覺保留  ④左側下肢肌肉張力高張 ⑤左側軀幹兩點區辨觸覺喪失", "options": {"A": "①②④", "B": "①②③", "C": "③④⑤", "D": "②③⑤"}, "images": [], "answer": "B", "explanation": "Brown-Séquard症候群（半邊損傷T6右）：同側運動+本體感覺/震動覺喪失（右下肢無力）、對側痛溫覺喪失（左側痛溫喪失）。題目③（右側痛覺保留）：右側痛覺保留=同側痛覺正常，因痛覺於入髓即交叉。①②③正確。"}, {"n": 39, "stem": "脊髓損傷患者接受感覺及運動機能檢查，頸髓及胸髓的表現都正常，腰髓檢查結果如下表。依ASIA分類，病\n人的神經機能損傷部位與等級為何？", "options": {"A": "L4，完全性損傷（ASIA A）", "B": "L4，不完全性損傷（ASIA C）", "C": "L3，不完全性損傷（ASIA C）", "D": "L2，不完全性損傷（ASIA C）"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAhUAAADQCAIAAAA/PAQHAAAACXBIWXMAAA7EAAAOxAGVKw4bAABo30lEQVR4nOx9d1wUyba/rpt0V91d85rTqqw5u+aMEXPOCSPmgJhQRDACKqIEwYCYMKIIGEBBBUEBQZ8IXrnKD58JLjz0+tT+fbfPtV47MK5M9cy0s/39Yz41Pd01p6tPne85VdV1CggqVKhQoUJF/lHA2AKoUKFChYovEip/qFChQoUKXaDyhwoVKlSo0AUqf6hQoUKFCl3wEX+8ePEiMTHxvoovEPfu3YuPj09OTjauGLGxsUaXAQLcunXL6GIYDAkJCXfv3jW2FIrD300N8gXYefn5Iy0t7dWrV7LUq8LAePv27aNHj4wthYDuamwR/gTY1NgiGA5Pnz7Nzs42thRKxN9KDfKF//qv/5Klno/44//9v//3P//zP7LUq8LA+Pe///3Pf/7T2FIIcG2MLcKfkKt7fBH47//+73/961/GlkKJ+FupQb6g8oeKj6DyhxR/K8Oh8oc2/K3UIF9Q+UPFR1D5Q4q/leHQB3+8fv1a3gqNAiWoQVZWlrFFyAMqf6j4CCp/SKEEw2Ew6IM/fv/997Vr1wrinOjjx48zMzOfP3/+UgQM4oABAy5fvkxn3rx585dffmF8Y2Fh4ebmtnXrVnxu37598+bN5ubm79+/p1/v3buHC4cNG4bKU1JS7ty54+7ubm9vf+XKlcDAwLZt20ZGRsp4F/pQg5MnTxYooLlsdeTIkV26dMnzfCcnp2r onfused, inappropriate, non-agitated）：能簡單回答但複雜問題困難、注意力不集中、無法新學習。題述符合V期。"}, {"n": 47, "stem": "承上題，針對此時期的患者，介入策略可包含下列那些？①預防次發性傷害 ②一致性方式建立治療常規\n③提供多元感覺刺激 ④選用熟悉的任務，重複、段落式的學習 ⑤訓練日常生活功能的活動當中，同時進\n行認知訓練 ⑥任務取向的介入模式", "options": {"A": "①②", "B": "③④", "C": "④⑥", "D": "②⑤"}, "images": [], "answer": "C", "explanation": "LOCF V期適合策略：選用熟悉任務（④）、任務取向介入（⑥）、結構化、重複式練習。多元感覺刺激與一致常規多用於III-IV期。"}, {"n": 48, "stem": "有關侯葉氏第二期的巴金森氏病患者，進行走路訓練之敘述，下列何者正確？", "options": {"A": "同時給予算術任務，不會影響行走表現", "B": "同時抱著球，是一種雙重任務的練習", "C": "應避免同時進行其他的任務訓練，以免讓患者分心", "D": "讓患者跟著貼在地上的腳印行走，是一種雙重任務的練習"}, "images": [], "answer": "B", "explanation": "Hoehn-Yahr II期巴金森步行訓練：抱球行走是雙重任務（dual task）練習；地面腳印為視覺提示（cueing）；算術任務會干擾步態。"}, {"n": 49, "stem": "下列何者最不可能是原發性巴金森氏病患者在中後期之臨床表徵？", "options": {"A": "認知功能降低", "B": "出現幻覺", "C": "四肢肌張力過低", "D": "講話變小聲"}, "images": [], "answer": "C", "explanation": "巴金森氏病中後期常見：認知降低、幻覺、構音障礙（講話小聲）、肌張力增高（rigidity，不是降低）；故C不太可能。"}, {"n": 50, "stem": "巴金森氏病患者服用左多巴（L-dopa）藥物後，對下列何種動作控制或行為問題改善較多？", "options": {"A": "僵直與動作緩慢", "B": "僵直與休息時的顫抖", "C": "動作緩慢與認知變差", "D": "姿勢不穩與休息時的顫抖"}, "images": [], "answer": "A", "explanation": "L-dopa對動作症狀（僵直、動作緩慢bradykinesia）改善最佳；對姿勢不穩、靜止性顫抖、認知效果有限。"}, {"n": 51, "stem": "有關巴金森氏病患者的運動訓練，下列敘述何者正確？", "options": {"A": "病患在侯葉氏分期第四期與第五期時，治療最主要以肌力訓練和耐力訓練為主", "B": "病患經常出現小碎步，因此不建議在跑步機上做行走訓練，有跌倒風險且效果不佳", "C": "步態訓練建議加強軀幹伸直與交替轉動、步長加大，輔以外在視覺或聽覺提示", "D": "建議在仰臥姿勢下做放鬆運動，坐姿下反而可能會增加僵硬程度"}, "images": [], "answer": "C", "explanation": "巴金森步態訓練重點：軀幹伸直與旋轉、加大步長、外在視覺/聽覺提示。跑步機+提示可有效；坐姿放鬆運動仍可進行；早晚期皆需運動訓練。"}, {"n": 52, "stem": "吳先生被診斷為進行性神經系統疾病，出現寫字困難，字體越來越小（micrographia），其有可能罹患下列那\n種疾病？", "options": {"A": "多發性硬化症或失智症", "B": "巴金森氏病或肌萎縮性側索硬化症", "C": "威爾氏症或巴金森氏病", "D": "亨丁頓氏症或阿茲海默氏症"}, "images": [], "answer": "B", "explanation": "Micrographia（書寫變小）為巴金森氏病典型表徵。ALS雖也可影響書寫但非以micrographia為核心。"}, {"n": 53, "stem": "周奶奶的記憶時好時壞，情緒非常不穩定容易生氣，且症狀呈現階梯式退化，這最可能是那一種失智症會出\n現的症狀？", "options": {"A": "阿茲海默型失智症", "B": "血管型失智症", "C": "額顳葉型失智症", "D": "路易氏體失智症"}, "images": [], "answer": "B", "explanation": "血管型失智症常呈階梯式退化（與血管事件相關），情緒不穩；阿茲海默為漸進式；額顳葉以行為與語言為主；路易氏體有視覺幻覺與認知波動。"}, {"n": 54, "stem": "練習法朗克氏運動（Frenkel exercise）之最佳動作順序為何？", "options": {"A": "閉眼到張眼練習", "B": "雙側動作到單側動作", "C": "無姿勢支撐到有支撐", "D": "單關節動作到多關節動作"}, "images": [], "answer": "D", "explanation": "Frenkel exercise進階順序：簡單→複雜（單關節→多關節、雙側→單側、有支撐→無支撐、張眼→閉眼）。"}, {"n": 55, "stem": "關於脊髓小腦萎縮患者之治療方式，下列何者不適當？", "options": {"A": "利用法朗克氏運動訓練動作的協調性", "B": "利用本體感覺神經肌肉誘發技巧增進動作的穩定度", "C": "利用被動牽張將上肢擺在承重姿勢下降低肌肉張力", "D": "利用水中運動的阻力與浮力訓練動作控制的穩定性"}, "images": [], "answer": "C", "explanation": "脊髓小腦萎縮患者之痙攣性張力應使用主動承重訓練、PNF或法朗克氏運動降低；被動牽張上肢承重姿勢無法降低小腦病變產生的張力。"}, {"n": 56, "stem": "小明聽說外公生病了，醫師說應該是小腦損傷，下列敘述何者符合？", "options": {"A": "媽媽說，阿公左手左腳都不會動，而且很僵硬", "B": "阿嬤說，阿公一直喊頭暈，血壓量起來都超過180 mmHg", "C": "舅舅說，阿公可以坐在床邊和大家聊天了，但是心裡大概很擔心住院花錢，所以大拇指一直動好像在算錢", "D": "阿姨說，阿公吃飯都不認真，用湯匙吃飯一直抖，還把飯灑得滿桌子都是"}, "images": [], "answer": "D", "explanation": "小腦損傷症狀：運動失調、共濟失調、辨距不能、震顫（intention tremor）。題敘D「用湯匙吃飯一直抖」（意向性顫抖）符合小腦損傷。"}, {"n": 57, "stem": "多發性硬化症病患最容易出現的肌肉張力異常為何？", "options": {"A": "痙攣", "B": "僵直", "C": "癱軟", "D": "肌張力障礙（dystonia）"}, "images": [], "answer": "A", "explanation": "MS最常見肌張力異常為痙攣（spasticity，皮質脊髓徑脫髓鞘）。其他選項較不典型。"}, {"n": 58, "stem": "就整體疾病的進程與預後而言，下列何種疾病的醫療與照護可採安寧照護（palliative care）原則？", "options": {"A": "腦中風", "B": "多發性硬化症", "C": "肌萎縮性側索硬化症", "D": "巴金森氏病"}, "images": [], "answer": "C", "explanation": "ALS進行性退化最終致呼吸衰竭，預後3-5年；安寧照護原則合理。MS、巴金森多為慢性緩慢退化；中風通常不是安寧照護對象。"}, {"n": 59, "stem": "詹小姐3年前被確診為多發性硬化症，4年前因左下肢無力跌倒造成脛骨骨折住院開刀，後來一直使用助行器\n行走，直到最近因無力症狀加劇、無法行走而就診，經評估上肢肌力4分、下肢3分。有關詹小姐的物理治療\n計畫，下列何者錯誤？", "options": {"A": "短期的治療目標應以使用輪椅安全轉位", "B": "應設計高強度運動以增強全身肌力", "C": "治療計畫應包含預防跌倒", "D": "合理的長期治療目標是讓病人拿助行器行走"}, "images": [], "answer": "B", "explanation": "MS復健應採低-中強度漸進、避免Uhthoff現象（高熱）。題目B「高強度運動以增強全身肌力」可能加重疲勞與症狀，故錯誤。"}, {"n": 60, "stem": "林先生三年前被診斷為肌萎縮性側索硬化症，下列何現象最不可能出現？", "options": {"A": "坐在高背輪椅上，頭被綁帶固定在輪椅的頭靠上", "B": "兩下肢因為伸直張力太強，導致腳踝無法適當彎曲放在輪椅踏板上", "C": "右側肢體無力，但是可以使用左側肢體完成部分的日常生活活動", "D": "右眼無法順暢的向外移動，目前只能使用左眼"}, "images": [], "answer": "D", "explanation": "ALS主要影響上下運動神經元，但眼球運動神經（CN III, IV, VI）通常被保留至最後階段，故D「右眼無法外移」較不可能出現。"}, {"n": 61, "stem": "下列何者不是下運動神經元損傷的症狀？", "options": {"A": "肌肉無力", "B": "反射減小或消失", "C": "肌肉痙攣", "D": "粗大動作與精細動作受損"}, "images": [], "answer": "C", "explanation": "下運動神經元損傷：肌肉無力、深腱反射↓、肌肉萎縮、肌束顫動、Babinski陰性、無痙攣。痙攣為上運動神經元徵象。"}, {"n": 62, "stem": "下列何者最不可能是腦膜炎的臨床表徵？", "options": {"A": "發燒", "B": "嚴重頭痛", "C": "頸部做伸直動作時會感到疼痛", "D": "意識不清"}, "images": [], "answer": "C", "explanation": "腦膜炎徵象：發燒、頭痛、頸部僵硬（屈曲時疼痛）、Brudzinski/Kernig陽性。「頸部伸直疼痛」非典型；應為頸屈曲疼痛。"}, {"n": 63, "stem": "有關慢性酒精中毒引起的神經病變，下列何者正確？", "options": {"A": "只有周邊感覺神經系統受影響", "B": "只有周邊運動神經系統受影響", "C": "部分患者會有癲癇發作的症狀", "D": "大部分患者平衡能力正常"}, "images": [], "answer": "C", "explanation": "慢性酒精中毒可影響感覺、運動、自主神經系統與小腦（共濟失調），可能伴發癲癇；平衡能力受影響。"}, {"n": 64, "stem": "60歲王先生最近一個月看東西有複視、顏面麻痺、步態不穩且合併頭痛，經檢查後確認為顱內腫瘤，其可能\n的腫瘤部位為何？", "options": {"A": "頂葉", "B": "枕葉", "C": "顳葉", "D": "腦幹"}, "images": [], "answer": "D", "explanation": "腦幹腫瘤可同時影響顱神經（複視、顏面麻痺）、長徑（步態不穩）並引起頭痛；其他葉病灶較不會同時造成這組症狀。"}, {"n": 65, "stem": "有關後小兒麻痺症候群（post-polio syndrome），下列敘述何者錯誤？", "options": {"A": "目前沒有完全治癒的方法", "B": "不論是長期或短期治療目標的設定，皆以症狀控制為主", "C": "長期目標可能為維持高強度的體能訓練，以增加運動能力", "D": "短期目標可能為輔導調整生活形態，以減少不必要的體能消耗"}, "images": [], "answer": "C", "explanation": "PPS治療目標：症狀控制、避免肌肉疲勞、調整生活形態。長期目標不應為「維持高強度體能訓練」（會加速衰退）。"}, {"n": 66, "stem": "有關周邊神經病變的術後治療，下列敘述何者最不適當？", "options": {"A": "在接受神經手術後一週內，通常可於患肢施予牽拉活動以充分拉緊神經，幫助神經修復", "B": "對於非患部之肢體，應鼓勵進行主動關節活動", "C": "在接受神經接合手術後之急性期可適當的進行擺位固定一段時間，確保傷口組織癒合", "D": "在神經修復後之復原期，可藉由按摩技巧降低過度敏感"}, "images": [], "answer": "A", "explanation": "神經接合術後一週內為癒合期，應避免大幅牽拉以免縫合處張力過大破壞修復。應於後期復原期循序漸進牽拉。"}, {"n": 67, "stem": "下列何者最符合神經根病變（radiculopathy）患者之臨床表現？", "options": {"A": "肌張力過強，並可能觀察到失用型肌肉萎縮", "B": "深腱反射變弱，並可能觀察到神經性肌肉萎縮", "C": "肌張力降低，並可能觀察到巴賓斯基徵象", "D": "深腱反射變強，並可能觀察到彈簧刀現象"}, "images": [], "answer": "B", "explanation": "神經根病變為下運動神經元病變：深腱反射↓、肌肉無力、神經性肌肉萎縮（denervation atrophy）、感覺異常。痙攣與Babinski為上運動神經元徵象。"}, {"n": 68, "stem": "小凌被診斷為後小兒麻痺症候群，下列那些是他可能經常抱怨的症狀？①Ƃ異常疲勞 ②肌肉疼痛 ③功能性\n動作能力下降 const state = {
  paper: "Q1",
  idx: {Q1: 0, Q2: 0},
  picks: { Q1: {}, Q2: {} }, // hydrated later, after persistence block defines PICKS_STORAGE_KEY
};

const $ = sel => document.querySelector(sel);
const main = $("#main");
const grid = $("#grid");
const progressEl = $("#progress");

function isCorrect(paper, n, pick) {
  const ans = DATA[paper].questions[n-1].answer;
  if (ans === "#") return true; // 一律給分
  return ans.indexOf(pick) >= 0; // single "A" or multi "AB" (X 或 Y 均給分)
}

function picksDone(paper) {
  return Object.keys(state.picks[paper]).length;
}

function score(paper) {
  let s = 0;
  for (const n in state.picks[paper]) {
    if (isCorrect(paper, parseInt(n), state.picks[paper][n])) s++;
  }
  return s;
}

function renderGrid() {
  grid.innerHTML = "";
  const qs = DATA[state.paper].questions;
  for (let i = 0; i < qs.length; i++) {
    const n = i + 1;
    const btn = document.createElement("button");
    btn.className = "gbtn";
    btn.textContent = n;
    if (state.idx[state.paper] === i && !state.viewSummary) btn.classList.add("cur");
    if (n in state.picks[state.paper]) {
      const ok = isCorrect(state.paper, n, state.picks[state.paper][n]);
      btn.classList.add(ok ? "right" : "wrong");
    }
    if (isMarked(state.paper, n)) btn.classList.add("marked");
    btn.onclick = () => { state.viewSummary = false; state.idx[state.paper] = i; render(); };
    grid.appendChild(btn);
  }
}

function escapeHTML(s) { return s.replace(/&/g, "&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderQuestion() {
  const qs = DATA[state.paper].questions;
  const i = state.idx[state.paper];
  const q = qs[i];
  const pick = state.picks[state.paper][q.n];
  const locked = !!pick;
  const correct = q.answer;
  const total = qs.length;
  progressEl.textContent = `第 ${i+1} 題 / 共 ${total} 題　·　已作答 ${picksDone(state.paper)}　·　目前得分 ${score(state.paper)}`;

  let imgsHTML = "";
  for (const u of q.images) imgsHTML += `<img class="qimg" src="${u}" alt="題目附圖">`;

  let optsHTML = "";
  for (const k of ["A","B","C","D"]) {
    let cls = "opt";
    if (locked) {
      cls += " locked";
      const isCorrLetter = (correct !== "#" && correct.indexOf(k) >= 0);
      if (isCorrLetter) cls += " correct";
      else if (k === pick && correct !== "#") cls += " wrong";
      else if (correct === "#" && k === pick) cls += " correct";
    }
    optsHTML += `<button class="${cls}" data-k="${k}" ${locked ? "disabled" : ""}>
      <span class="label">${k}.</span><span>${escapeHTML(q.options[k] || "")}</span>
    </button>`;
  }

  let verdictHTML = "";
  if (locked) {
    if (correct === "#") {
      verdictHTML = `<div class="verdict note">
        <h3>本題經考選部公告「一律給分」</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else if (correct.length > 1) {
      const ok = correct.indexOf(pick) >= 0;
      const letters = correct.split("").join(" 或 ");
      verdictHTML = `<div class="verdict note">
        <h3>本題經考選部公告「答 ${letters} 均給分」　·　${ok ? "✓ 你的選擇 ("+pick+") 在正解內" : "✗ 你選 "+pick+"，未在正解內"}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else {
      const ok = pick === correct;
      verdictHTML = `<div class="verdict ${ok ? "right" : "wrong"}">
        <h3>${ok ? "✓ 答對" : "✗ 答錯"}　·　正解：${correct}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    }
  }

  main.innerHTML = `<div class="card">
    <div class="qhead">
      <span class="qnum">第 ${q.n} 題</span>

  $("#clearBtn").onclick = () => { delete state.picks[state.paper][q.n]; savePicks(); render(); };
  $("#markBtn").onclick = () => { toggleMark(state.paper, q.n); render(); };
  const fb = document.getElementById("finishBtn");
  if (fb) fb.onclick = () => { state.viewSummary = true; render(); };

    ${(()=>{ const rows=[]; for (let i=0;i<qs.length;i++){ const q=qs[i]; if (!isMarked(state.paper,q.n)) continue; const pick=state.picks[state.paper][q.n]; const stemShort = q.stem.length>50?q.stem.slice(0,50)+'…':q.stem; const tag = pick===undefined?'未作答':(q.answer==='#'?'一律給分':(pick===q.answer?'答對':'答錯')); const tagColor = pick===undefined?'var(--ink-soft)':(q.answer==='#'?'var(--yellow)':(pick===q.answer?'var(--green)':'var(--red)')); rows.push(`<div class="wrong-row mk" data-idx="${i}"><strong>★ 第 ${q.n} 題</strong><span style="color:${tagColor};">${tag}</span><span style="color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(stemShort)}</span></div>`); } return rows.length>0 ? `<div style="margin-top:14px;"><h3 style="margin:0 0 6px;">🔖 已標記題目（${rows.length}）</h3><div class="wrong-list">${rows.join('')}</div><button class="btn ghost" id="clearMarksBtn" style="margin-top:8px;font-size:13px;">清除本卷所有標記</button></div>` : ''; })()}
    <div class="nav" style="margin-top:18px;">

// ===== Answer persistence (per-paper picks, saved to localStorage) =====
const PICKS_STORAGE_KEY = "nephron_111_neuro_picks_v1";
const QUIZ_ID = "neuro_111";  // unique id used when broadcasting summary

function loadPicks() {
  try {
    const s = localStorage.getItem(PICKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function savePicks() {
  try { localStorage.setItem(PICKS_STORAGE_KEY, JSON.stringify(state.picks)); } catch (e) {}
  broadcastProgress();
}

// Send a summary of progress to parent window if embedded in an iframe.
// Used by the dashboard (index.html) to show progress bars.
function broadcastProgress() {
  if (typeof window === "undefined") return;
  let target = null;
  try { if (window.parent && window.parent !== window) target = window.parent; } catch(e){}
  if (!target) return;
  try {
    const summary = { type: "quizSummary", quizId: QUIZ_ID, papers: {} };
    for (const tag of ["Q1","Q2"]) {
      const qs = DATA[tag].questions;
      const picks = state.picks[tag] || {};
      const marks = state.marks ? (state.marks[tag] || {}) : {};
      let answered = 0, correct = 0;
      for (const n in picks) {
        answered++;
        if (isCorrect(tag, parseInt(n), picks[n])) correct++;
      }
      summary.papers[tag] = {
        label: DATA[tag].label,
        total: qs.length,
        answered, correct,
        marked: Object.keys(marks).length,
      };
    }
    target.postMessage(summary, "*");
  } catch (e) {}
}

// Hydrate persisted picks now that PICKS_STORAGE_KEY and loadPicks are defined
state.picks = loadPicks();

// ===== Bookmarks (per-paper question marks, persisted to localStorage) =====
const MARKS_STORAGE_KEY = "nephron_111_neuro_marks_v1";
function loadMarks() {
  try {
    const s = localStorage.getItem(MARKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function saveMarks() {
  try { localStorage.setItem(MARKS_STORAGE_KEY, JSON.stringify(state.marks)); } catch (e) {}
  broadcastProgress();
}
function toggleMark(paper, n) {
  if (state.marks[paper][n]) delete state.marks[paper][n];
  else state.marks[paper][n] = true;
  saveMarks();
}
function isMarked(paper, n) { return !!state.marks[paper][n]; }
function clearAllMarks(paper) {
  state.marks[paper] = {};
  saveMarks();
}
function markedCount(paper) { return Object.keys(state.marks[paper]).length; }
state.marks = loadMarks();

// ===== Export / Download report =====
function _esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function _stamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function _nowStr() { return new Date().toLocaleString("zh-TW", {hour12: false}); }

function _filterQs(paper, filter) {
  const qs = DATA[paper].questions;
  const picks = state.picks[paper];
  if (filter === "all") return qs.slice();
  if (filter === "answered") return qs.filter(q => picks[q.n] !== undefined);
  if (filter === "unanswered") return qs.filter(q => picks[q.n] === undefined);
  if (filter === "wrong") {
    return qs.filter(q => {
      const p = picks[q.n];
      return p !== undefined && q.answer !== "#" && q.answer.indexOf(p) < 0;
    });
  }
  if (filter === "marked") return qs.filter(q => isMarked(paper, q.n));
  return qs.slice();
}

function _filterCounts(paper) {
  return {
    all: _filterQs(paper, "all").length,
    answered: _filterQs(paper, "answered").length,
    wrong: _filterQs(paper, "wrong").length,
    unanswered: _filterQs(paper, "unanswered").length,
    marked: _filterQs(paper, "marked").length,
  };
}

function buildExportHTML(paper, filter) {
  const allQs = DATA[paper].questions;
  const picks = state.picks[paper];
  const qs = _filterQs(paper, filter);
  const total = allQs.length;
  const answered = Object.keys(picks).length;
  const correctCount = Object.entries(picks).filter(([n, p]) => isCorrect(paper, parseInt(n), p)).length;
  const pct = total > 0 ? ((correctCount / total) * 100).toFixed(1) : "0.0";
  const filterLabel = {all:"全部題目", wrong:"僅錯題", answered:"僅已作答", unanswered:"僅未作答", marked:"僅已標記"}[filter];
  const paperLabel = DATA[paper].label + (paper === "Q1" ? "（114020）" : "（114090）");

  const subjectTitle = "神經疾病物理治療學 · 民國 111 年 · " + paperLabel;
  const fileTitle = `神經_111_${paperLabel.replace(/[（）]/g, "")}_${filterLabel}_${_stamp()}`;

  let body = "";
  for (const q of qs) {
    const pick = picks[q.n];
    const correct = q.answer;
    const errata = (correct === "#");
    const answeredFlag = pick !== undefined;
    let statusLabel, statusCls;
    const multiHere = (!errata && correct && correct.length > 1);
    if (errata) { statusLabel = "一律給分"; statusCls = "errata"; }
    else if (!answeredFlag) { statusLabel = "未作答"; statusCls = "unanswered"; }
    else if (multiHere) {
      const ok = correct.indexOf(pick) >= 0;
      statusLabel = ok ? "✓ 多解·入正解" : "✗ 多解·未入正解";
      statusCls = ok ? "correct" : "wrong";
    }
    else if (pick === correct) { statusLabel = "✓ 答對"; statusCls = "correct"; }
    else { statusLabel = "✗ 答錯"; statusCls = "wrong"; }

    let imgsHTML = "";
    for (const u of q.images) {
      imgsHTML += `<img class="qimg" src="${u}" alt="題目附圖">`;
    }

    let optsHTML = "";
    const multi = (!errata && correct && correct.length > 1);
    for (const k of ["A","B","C","D"]) {
      const isPick = (k === pick);
      const isCorr = (!errata && correct && correct.indexOf(k) >= 0);
      let cls = "opt";
      let tag = "";
      if (isPick && isCorr) { cls += " correct user-pick"; tag = "（你的選擇 ✓）"; }
      else if (isPick && !isCorr && !errata) { cls += " wrong user-pick"; tag = "（你的選擇 ✗）"; }
      else if (isCorr) { cls += " correct"; tag = (multi ? "（正解之一）" : "（正解）"); }
      else if (isPick && errata) { cls += " errata user-pick"; tag = "（你的選擇）"; }
      optsHTML += `<li class="${cls}"><b>${k}.</b> ${_esc(q.options[k] || "")}<span class="opt-tag">${tag}</span></li>`;
    }

    let verdictHTML = "";
    if (errata) {
      verdictHTML = `<div class="verdict errata"><b>本題經考選部公告「一律給分」</b>${answeredFlag ? `（你選了 ${pick}）` : ""}</div>`;
    } else if (multi) {
      const letters = correct.split("").join(" 或 ");
      const ok = answeredFlag && correct.indexOf(pick) >= 0;
      verdictHTML = `<div class="verdict errata"><b>本題經考選部公告「答 ${letters} 均給分」</b>${answeredFlag ? ` · 你選 <b>${pick}</b>${ok ? " ✓" : " ✗"}` : " · 未作答"}</div>`;
    } else if (!answeredFlag) {
      verdictHTML = `<div class="verdict unanswered"><b>未作答</b> · 正解：<b>${correct}</b></div>`;
    } else {
      const ok = pick === correct;
      verdictHTML = `<div class="verdict ${ok ? "correct" : "wrong"}"><b>${ok ? "✓ 答對" : "✗ 答錯"}</b> · 你的選擇：<b>${pick}</b> · 正解：<b>${correct}</b></div>`;
    }

    const explHTML = q.explanation ? `<div class="expl"><b>詳解 ▸</b> ${_esc(q.explanation)}</div>` : "";

    const markedBadge = isMarked(paper, q.n) ? ` <span class="qstatus marked">🔖 已標記</span>` : "";
    body += `<article class="q ${statusCls}">
  <div class="qhead">
    <h2>第 ${q.n} 題</h2>
    <span class="qstatus ${statusCls}">${statusLabel}</span>${markedBadge}
  </div>
  <div class="stem">${_esc(q.stem)}</div>
  ${imgsHTML}
  <ol class="opts">${optsHTML}</ol>
  ${verdictHTML}
  ${explHTML}
</article>`;
  }

  const css = `

function downloadExport(filter) {
  const { html, fileTitle } = buildExportHTML(state.paper, filter);
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });

  const a = document.createElement("a");
  a.href = url; a.download = fileTitle + ".html";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);

document.getElementById("exportModal").addEventListener("click", e => {
  if (e.target.id === "exportModal") hideExportModal();
});
document.querySelectorAll("#exportOpts .exp-opt").forEach(btn => {
  btn.onclick = () => {
    const filter = btn.getAttribute("data-filter");
    if (btn.disabled) return;
    downloadExport(filter);
    hideExportModal();
  };
});

render();
// Broadcast initial state to parent (dashboard) if loaded as iframe
broadcastProgress();
</script>
</body>
</html>
