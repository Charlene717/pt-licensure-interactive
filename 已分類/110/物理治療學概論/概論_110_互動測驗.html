<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --ink: #1f2933;
    --ink-soft: #52606d;
    --line: #e4e7eb;

    --primary-soft: #e6f1f7;

    --green-soft: #d3f9d8;

  }

  body {
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei",

  }
  header {
    background: #fff;

  }

  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    background: #f1f3f5; border: 1px solid var(--line); color: var(--ink-soft);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .progress { color: var(--ink-soft); font-size: 14px; margin-left: auto; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 22px; max-width: 1400px; margin: 18px auto; padding: 0 22px; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; padding: 0 14px; } .sidebar { order: 2; position: static; } }
  .sidebar {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; height: fit-content; position: sticky; top: 78px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
  }
  .gbtn {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
    color: var(--ink-soft); font-size: 13px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .gbtn:hover { border-color: var(--primary); }
  .gbtn.cur { background: var(--primary); color: #fff; border-color: var(--primary); }
  .gbtn.right { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .gbtn.wrong { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .legend { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 4px; border: 1px solid var(--line); }
  .dot.r { background: var(--green-soft); border-color: var(--green); }
  .dot.w { background: var(--red-soft); border-color: var(--red); }
  .main { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .qhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .qnum { font-size: 22px; font-weight: 700; color: var(--primary); }
  .qmeta { color: var(--ink-soft); font-size: 13px; }
  .stem { font-size: 16px; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
  .qimg { display: block; max-width: 100%; max-height: 480px; margin: 8px 0; border: 1px solid var(--line); border-radius: 6px; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    transition: background .12s, border-color .12s;
    text-align: left;
    font-size: 15.5px;
    color: var(--ink);
  }
  .opt:hover:not(.locked) { background: var(--primary-soft); border-color: var(--primary); }
  .opt.locked { cursor: default; }
  .opt .label { font-weight: 700; min-width: 22px; }
  .opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .opt.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .verdict { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 14px; line-height: 1.7; }
  .verdict.right { background: var(--green-soft); color: #186b29; }
  .verdict.wrong { background: var(--red-soft); color: #861818; }
  .verdict.note { background: var(--yellow-soft); color: #6b4e00; }
  .verdict h3 { margin: 0 0 6px; font-size: 14px; }
  .nav { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    background: var(--primary); color: #fff; border: 0; padding: 9px 18px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }

  .btn.danger { background: #fff; color: var(--red); border: 1px solid var(--red); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .summary { padding: 18px; }
  .summary h2 { margin: 0 0 8px; }
  .score { font-size: 32px; font-weight: 700; color: var(--primary); }
  .wrong-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .wrong-row { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .wrong-row:hover { background: var(--primary-soft); }
  .footer { color: var(--ink-soft); font-size: 12px; text-align: center; margin: 16px 0 30px; }

  .homelink { color: var(--soft); text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .homelink:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }


  /* Export modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,30,.45); display: none; align-items: center; justify-content: center; z-index: 100; padding: 18px; }
  .modal-bg.show { display: flex; }

  .modal-card .modal-sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; }
  .modal-card .opt-row { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
  .modal-card .exp-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; background: #f8f9fa; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left; color: var(--ink); }
  .modal-card .exp-opt:hover { background: var(--primary-soft); border-color: var(--primary); }
  .modal-card .exp-opt:disabled { opacity: 0.5; cursor: not-allowed; background: #f1f3f5; }
  .modal-card .exp-opt .count { color: var(--ink-soft); font-size: 12px; }
  .modal-card .hint { color: var(--ink-soft); font-size: 12px; line-height: 1.6; margin: 0 0 12px; }
  .modal-card .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }


  /* Bookmark / marker */
  .gbtn { position: relative; }
  .gbtn.marked::after {
    content: "★"; position: absolute; top: 1px; right: 3px;
    font-size: 10px; color: var(--yellow); line-height: 1;
    text-shadow: 0 0 2px #fff;
  }
  .markbtn {
    margin-left: auto; background: #fff; border: 1px solid var(--line);
    color: var(--ink-soft); padding: 6px 13px; border-radius: 999px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .markbtn:hover { border-color: var(--yellow); color: var(--yellow); }
  .markbtn.marked { background: var(--yellow-soft); color: #6b4e00; border-color: var(--yellow); font-weight: 600; }
  .qhead { flex-wrap: wrap; }
  .marked-badge { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--yellow-soft); color: #6b4e00; font-size: 11px; border: 1px solid var(--yellow); margin-left: 4px; }
  .wrong-row.mk { border-color: var(--yellow); }

</style>

<script>
const DATA = {"Q1": {"label": "第一次", "questions": [{"n": 1, "stem": "下列那個物理治療團體成立的時間最晚？", "options": {"A": "英國皇家特許物理治療協會", "B": "美國女子物理治療協會", "C": "世界物理治療聯盟", "D": "亞洲物理治療聯盟"}, "images": [], "answer": "D", "explanation": "成立順序：英國皇家特許物理治療協會（1894）→美國女子物理治療協會（1921）→WCPT（1951）→ACPT（1981）。亞洲物理治療聯盟最晚成立。"}, {"n": 2, "stem": "我國舉辦過下列那些物理治療專業團體大會？①WCPT ②WCPT-AWP ③ACPT ④TPTA", "options": {"A": "①②③", "B": "①④", "C": "僅③④", "D": "②③④"}, "images": [], "answer": "D", "explanation": "我國舉辦過：②WCPT-AWP（亞洲西太平洋區）、③ACPT、④TPTA（中華民國物理治療學會），但WCPT全球大會尚未在台舉辦。"}, {"n": 3, "stem": "我國物理治療師節為下列何日？", "options": {"A": "9月8日", "B": "9月9日", "C": "11月11日", "D": "11月12日"}, "images": [], "answer": "A", "explanation": "我國物理治療師節為9月8日（World PT Day）。"}, {"n": 4, "stem": "美國物理治療學會（APTA）提出的物理治療2020願景主張，對於我國物理治療教育的主要影響包括：①推動\n物理治療DPT學位 ②廢除物理治療生教育 ③推動實證物理治療 ④推動長期照顧學程", "options": {"A": "①②④", "B": "①②③", "C": "僅①③", "D": "僅②④"}, "images": [], "answer": "C", "explanation": "APTA Vision 2020：①推DPT學位、③推實證物理治療為兩大主軸。沒有廢除PT助理或推長照學程的條目。"}, {"n": 5, "stem": "某物理治療師欲開設一間物理治療所，其治療所設置應符合之設施規定，何者正確？", "options": {"A": "總樓地板面積60平方公尺以上", "B": "無障礙廁所盥洗室一間以上", "C": "治療空間須設置於一樓", "D": "必須有牽引、振動或其他機械性治療儀器"}, "images": [], "answer": "B", "explanation": "物理治療所設置標準：須有無障礙廁所盥洗室；總樓地板面積依設置類型不同；不限一樓；牽引設備非必備（依實際業務）。"}, {"n": 6, "stem": "依照美國物理治療學會提出物理治療所使用的程序性介入治療類別，放鬆技巧（relaxation）是屬於那一類別？", "options": {"A": "病患或個案教導（patient or client instruction）", "B": "生活自理的功能性訓練（functional training in self-care）", "C": "治療性運動 （therapeutic exercise）", "D": "徒手治療技術（manual therapy techniques）"}, "images": [], "answer": "C", "explanation": "放鬆技巧（relaxation training）屬於「治療性運動」（therapeutic exercise）的範疇，包括呼吸放鬆、漸進式肌肉放鬆等。"}, {"n": 7, "stem": "物理治療師的角色包括下列那些？①個案管理者 ②諮詢者 ③評論者 ④行政管理者 ⑤提供治療者", "options": {"A": "①②③④⑤", "B": "僅②④⑤", "C": "僅①③⑤", "D": "僅①②④"}, "images": [], "answer": "A", "explanation": "物理治療師多重角色：①個案管理者、②諮詢者、③評論者、④行政管理者、⑤治療提供者。"}, {"n": 8, "stem": "關於長期照顧的定義，下列敘述何者錯誤？", "options": {"A": "強調疾病的處理，而非個案功能上的需要", "B": "基本精神是個別化及人性化", "C": "團隊的整合性服務體系", "D": "主要分為機構式和社區式兩大類服務模式"}, "images": [], "answer": "A", "explanation": "長期照顧強調「個案功能上的需要」（不是疾病處理為主），是個別化、人性化的整合服務。"}, {"n": 9, "stem": "研究做人的基本道德行為原則及日常生活中所應遵守的規則，是屬於那一種倫理學分支？", "options": {"A": "規範倫理學", "B": "後設倫理學", "C": "描述倫理學", "D": "關懷倫理學"}, "images": [], "answer": "A", "explanation": "規範倫理學（normative ethics）：研究人應如何行動的基本原則與規則（如義務論、實用論、德行論）。"}, {"n": 10, "stem": "「認為行為的對錯必須由行為的結果來考量」是符合基本倫理學理論上的那一種觀點？", "options": {"A": "自由意志主義", "B": "情境公義主義", "C": "責任論", "D": "實用論"}, "images": [], "answer": "D", "explanation": "實用論（utilitarianism）：以結果（最大效用）判斷行為對錯。義務論則以行為本身與責任為判斷依據。"}, {"n": 11, "stem": "從德行倫理發展出的醫學倫理原則，下列敘述何者錯誤？", "options": {"A": "守密就是不揭露", "B": "隱私即是不侵犯", "C": "正義包括信用和不隱瞞", "D": "慈悲大愛代表為個案促進福祉"}, "images": [], "answer": "C", "explanation": "正義（justice）涉及公平資源分配，不是「信用與不隱瞞」（後者屬誠信原則）。題敘C定義錯誤。"}, {"n": 12, "stem": "一位末期病患未於意識昏迷前表達是否拒絕心肺復甦術（Do Not Resuscitate, DNR），其成年子女已簽署了\nDNR同意書，然而當病人開始出現呼吸變慢的瀕死現象時，其配偶突然反悔不同意放棄急救，醫療團隊應該\n如何處理？", "options": {"A": "已有成年子女簽署之同意書，因此仍執行DNR", "B": "只要有親屬表達不同意，就不執行DNR", "C": "須配偶以書面聲明方式撤回不同意放棄急救之表示，才能執行DNR", "D": "病患本人未簽署意願書，因此不應該執行DNR"}, "images": [], "answer": "C", "explanation": "依《安寧緩和醫療條例》：成年子女已簽署DNR同意書，配偶若反悔，需以書面聲明撤回方能停止DNR執行。"}, {"n": 13, "stem": "下列那些狀況屬於醫療人員未經病患同意應保守秘密的事項？", "options": {"A": "小兒麻痺病患的行動不便問題", "B": "病患感染人體免疫缺乏病毒", "C": "六歲兒童因受虐的肢體外傷", "D": "成年且意識正常病人的癌症末期病況"}, "images": [], "answer": "D", "explanation": "成年且意識正常病人的癌症末期病況屬個人隱私，醫療人員未經病患同意應保守。其他選項涉及法定通報（HIV、傳染病、兒虐）。"}, {"n": 14, "stem": "目前有8位病患需要執行物理治療，其中有6位是屬於初診病人，有2位屬於慢性疼痛複診病人，礙於治療師的\n時間有限，治療師對於初診患者，安排每天積極治療；對於2位複診病人，安排隔週治療。這位治療師可能違\n反了下列那一項倫理原則？", "options": {"A": "行善利人", "B": "切勿傷害", "C": "公平正義", "D": "病人自主"}, "images": [], "answer": "C", "explanation": "以「治療師時間」為由不平等分配給初診與複診病人，違反「公平正義」原則（同樣有需求的病人應獲合理治療）。"}, {"n": 15, "stem": "關於美國物理治療學會於1980年為物理治療專業設定之執業標準和準據，下列敘述何者錯誤？", "options": {"A": "主要在評量物理治療的品質", "B": "執業標準在1980年首次公布", "C": "準據在1985年首次公布", "D": "1999年修訂版訂定之執業標準，不包含研究"}, "images": [], "answer": "D", "explanation": "APTA 1980執業標準與1985準據包含「研究」項目，1999年修訂版仍含研究。題敘D錯誤。"}, {"n": 16, "stem": "醫病關係要素，其中「告知」項目之目的，不包含下列何者？", "options": {"A": "讓病患決定是否接受治療", "B": "讓病患參與治療目標的擬定", "C": "讓病患獲得適合的資訊", "D": "讓病患優先選擇自費治療"}, "images": [], "answer": "D", "explanation": "「告知」目的：讓病患獲得適當資訊、決定是否接受治療、參與治療目標設定。「優先選擇自費」非告知核心目的。"}, {"n": 17, "stem": "關於物理治療師醫病關係要素之「守密」項目，下列敘述何者錯誤？", "options": {"A": "要尊重與維護病人身體私密性", "B": "使用病人的病歷資料時，應依流程辦理", "C": "可請家屬攜帶病人的病歷給醫師", "D": "在公共場所不應談論病人資料"}, "images": [], "answer": "C", "explanation": "病歷資料應由醫療機構保管，不應請家屬攜帶（避免遺失或外洩）。題敘C錯誤。"}, {"n": 18, "stem": "在臨床實際操作上，為符合公平正義資源分配的倫理，醫療人員選擇那一種醫療方式最不合適？", "options": {"A": "符合病人指定的治療方式", "B": "符合證據醫學證實的治療方式", "C": "符合經濟效益的治療方式", "D": "符合病人最佳利益的治療方式"}, "images": [], "answer": "A", "explanation": "公平正義原則應依「最佳利益」與「實證」進行資源分配，不應因「病人指定」而調整治療方式（病人未必了解最佳實證）。"}, {"n": 19, "stem": "關於物理治療師法規範倫理範疇之事務，下列敘述何者錯誤？", "options": {"A": "對於因業務而知悉或持有他人之秘密，不得無故洩漏", "B": "將其證照租借他人使用者，會被撤銷其物理治療師證書", "C": "遭停業處分時，仍執行業務者，撤銷其物理治療師證書", "D": "若違反執業業務範圍而致人於死或重傷者，應依刑法加重其刑至二分之一"}, "images": [], "answer": "C", "explanation": "停業處分期間執行業務者，依法「處罰鍰並廢止執業執照」，不是「撤銷物理治療師證書」。題敘C錯誤。"}, {"n": 20, "stem": "根據性別平等教育法之相關規定，下列敘述何者錯誤？", "options": {"A": "性別平等教育是指以教育方式教導尊重多元性別差異，消除性別歧視，促進性別地位之實質平等", "B": "性侵害是指性侵害犯罪防治法所稱性侵害犯罪之行為", "C": "性霸凌是以明示或暗示之方式，從事不受歡迎且具有性意味或性別歧視之言詞或行為，致影響他人之人格尊 嚴、學習或工作之機會或表現者", "D": "性別認同是指個人對自我歸屬性別的自我認知與接受"}, "images": [], "answer": "C", "explanation": "性騷擾的定義：以明示或暗示性方式做出不受歡迎且具性意味或性別歧視的言詞或行為。題敘C所述為「性騷擾」（sexual harassment），不是性霸凌（gender bullying）。"}, {"n": 21, "stem": "某物理治療所正在籌備設立，負責人希望採取健保與自費雙軌模式經營。而健保特約物理治療所依法須獲得\n專科醫師開具之處方箋，後續方能申報健保費用。若與下列那位醫師合作，可能造成治療所後續無法申報健\n保費用？", "options": {"A": "神經科醫師", "B": "骨科醫師", "C": "小兒科醫師", "D": "整形外科醫師"}, "images": [], "answer": "C", "explanation": "健保特約物理治療所需「復健科、神經科、骨科、神經外科、整形外科」等專科醫師處方箋。小兒科醫師不在許可清單內，無法申報健保。"}, {"n": 22, "stem": "下圖所示屬於何種管理學理論概念？", "options": {"A": "行政理論", "B": "組織理論", "C": "系統理論", "D": "權變理論"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAhYAAAE1CAIAAAA09T6BAAAACXBIWXMAAA7EAAAOxAGVKw4bAAB5P0lEQVR4nOydBXgUVxeG4+5KnBjBk+ 新臺幣二萬元以上十萬元以下罰鍰；其情 節重大者，並得廢止其開業執照"}, "images": [], "answer": "D", "explanation": "故意洩漏業務秘密：依物治師法第38條，可處1年以下有期徒刑、得併科罰金（不只是2-10萬罰鍰）。"}, {"n": 25, "stem": "徐姓治療師打算開設僅提供居家服務之物理治療所、投入長照業務，但前輩仍鼓勵他應儘量設置一般型態物\n理治療所，對兩種治療所設置之敘述，何者錯誤？", "options": {"A": "兩類型物理治療所皆應提供物理治療評估測試、目標及內容擬定的功能", "B": "僅提供居家服務之物理治療所，其總樓地板面積依法應至少10平方公尺以上", "C": "兩類型物理治療所皆應符合其消防安全與清潔消毒設備之要求", "D": "僅提供居家服務的物理治療所可設置於地下二樓，且無須設置無障礙廁所"}, "images": [], "answer": "B", "explanation": "僅居家服務之物理治療所總樓地板面積至少20平方公尺（不是10平方公尺）。其他選項皆需注意。"}, {"n": 26, "stem": "為了達成全民健保制度的財務健全與發展，從開辦至今祭出許多措施來調整，下列對於全民健保財政措施之\n敘述，何者錯誤？", "options": {"A": "全民健保的「單一支付制度」結構有助於透過買方壟斷力量，亦即僅有一位買主的情況，讓健康照護開支維 持在相對較低的水準", "B": "全民健保的財務設計為自給自足、自負盈虧的經營原則", "C": "由於人口老化和近來醫學進步等因素造成健保財政隱憂，因此一般保險費費率從開辦至今只漲不跌", "D": "全民健康保險的財政收入主要來自於保險費收入，其餘包含公益彩券盈餘和菸品附加捐等"}, "images": [], "answer": "C", "explanation": "全民健保保險費費率有調漲與調降紀錄（如103年調漲、105年調降），不是「只漲不跌」。題敘C錯誤。"}, {"n": 27, "stem": "安女士由於有家族乳癌病史，且經醫師評估後續5年內罹患乳癌的機率高達9成，因此決定前往醫院指定胡姓\n醫師，進行預防性切除手術。手術後原本恢復順利，但出院3天後忽然高燒不退，由家人緊急送往急診處置。\n急診醫師評估後懷疑是手術傷口感染造成的蜂窩性組織炎，因此後續由整形外科收治住院處置，整形外科醫\n師正考慮對傷口進行手術處理。住院後由於身體虛弱，護理人員為了預防跌倒，建議購買助行器協助活動。\n經住院手術與治療10天後順利出院。上述案例中，那些項目的費用可由我國全民健康保險給付？", "options": {"A": "傷口感染後續之皮瓣手術", "B": "胡姓醫師指定費用", "C": "乳癌預防性切除手術", "D": "助行器購買費用"}, "images": [], "answer": "A", "explanation": "胡姓醫師指定費屬自費；乳癌預防性切除手術不在健保給付範圍；助行器自費購買。但傷口感染後續手術屬醫療必要性處置，可由健保給付。"}, {"n": 28, "stem": "物理治療師每6年應完成多少積分的繼續教育課程？", "options": {"A": "150", "B": "120", "C": "90", "D": "72"}, "images": [], "answer": "B", "explanation": "依物治師法施行細則，物理治療師每6年應完成繼續教育課程120點（含專業課程、品質、倫理、法規）。"}, {"n": 29, "stem": "依據醫療法規定，醫學中心的物理治療師撰寫之病歷，應指定適當場所及人員保管，並至少保存幾年？", "options": {"A": "5", "B": "7", "C": "10", "D": "永久"}, "images": [], "answer": "B", "explanation": "依醫療法第70條，醫學中心物理治療師病歷至少保存7年（自製作之日起；未成年人滿20歲為止；診療糾紛則延長）。"}, {"n": 30, "stem": "依據內政部營建署發布「建築物無障礙設施設計規範」，下列何者正確？", "options": {"A": "坡道高差5公分者，坡度可作1/2之斜角處理", "B": "小學設雙道扶手者，扶手上緣距地板面應分別為65公分、85公分", "C": "坡道起點及終點應設置端點平台", "D": "門鎖採用容易操作之型式，可使用喇叭鎖、扭轉型式之門鎖"}, "images": [], "answer": "C", "explanation": "無障礙設施規範：坡道起終點應設端點平台；高差5公分需做斜角處理（A數字錯）；扶手規範依適用範圍；門鎖採水平把手或感應式（不能喇叭鎖）。"}, {"n": 31, "stem": "人力資源的管理與規劃是組織長遠發展的根本，目前國際潮流已由傳統人力管理走向策略性人力管理的趨\n勢。某復健科診所採取下列那個策略，最不符合策略性人力管理的理念？", "options": {"A": "醫師告知所有成員，目前診所周遭所有復健相關機構之服務量能與服務範疇", "B": "醫師告知所有成員，目前該縣市內所有相關職缺訊息與薪資福利", "C": "由於後續復健科診所想要成立長照據點，因此鼓勵所有成員取得相關長照人員資格", "D": "將人事管理的重點放在兼職治療師與櫃台人員的時薪與服務量上"}, "images": [], "answer": "D", "explanation": "策略性人力管理應重視長期目標與整體發展，而非僅短期成本與時薪管理。題敘D屬傳統人力管理，不符合策略性。"}, {"n": 32, "stem": "管理者以下圖方式進行品質改進計畫以控制工作進度，此為何種方式？", "options": {"A": "要徑法", "B": "魚骨圖", "C": "甘特圖", "D": "累進法"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAqUAAADNCAIAAAAOgp57AAAACXBIWXMAAA7EAAAOxAGVKw4bAABwFElEQVR4nOx9eZwVxbX/sC+yCCKyzURGATd2UFBcWGXfF/XlafJL/Gieiuw7yqYmL+/FLAqCbAMoq5r4XvKibIFhdU9MjMCALCICLqxKEpn6fd/95p6c6R5m7u3u4c7kne8fM919q6urq6vqe86pU6fSnMFgMBgMhn92pKW6AAaDwWAwGIocaefPn8e/v/zlLzz/29/+lpubi4NcQ0rx17/+VT4SvxGvpLpcJQCsNB6wYaMCU12okgrd6nRrTG2pij+++eYbVtfp06elNaa6UCUA0sAI9t9UF6oEgNytaw8Hms3ZINPk53Pnzh0+fFhuM6Qc+CL4Tvh79OjR8zGkukQlA+wAbMZo5UeOHLEmHRgnY0B9cuRFfebGid9QMCAqoc8eO3YMXViL74YC8PXXX/MALQ2198knn1h7SwTC6Bz9eHzmzJnPP//cxajExYSnNKZAc3zooYcqVap0xx13dOnS5XZDqoGv0L59+zvvvPPWW29NS0vr2rVr586dcZzqchV3oAHzoGPHjqi07t27o/batWuX2lKVXGRkZNSrV69Hjx6oWLTA22M1LJVsuBBQVzfffHOHDh1Kly6NYzTFTp063XbbbakuV3EHxr1u3bp1iAGjX/ny5Vu3bm3trVCgdd0e65tobPgLpsBBnTp1mjZtevbsWbI85Kc0kZ5eeumlli1bZmdnv/766/j7O0NKsX79+g0bNuDviy++WL9+/XXr1qW6RCUGG2LYuHHjuhgwXvzkJz9JdaFKKr4TA9ohanLTpk2sWJymulzFHayl5cuX161bFwc4ZbNMdbmKO9DMpI0Bbdu2/fGPf5zqQpUAbN68+Xex2tsUAyvw/vvvR+d1ymryd/0eIgB+hlzgYoaUi22MMPgg8y779u27+uqrzZgfABRpoeKjG6S6LCUVjz/++IwZM8ymGgz79+/PyMhIdSlKGHRjg7q/du3aFBampIAE8be//Y2+Si5mvZ8Wg6Q5d+5cmkwsge87derEU6P8lEMmSjFkXHnllS7WDcSt0nAhoAFz5k9GjVtvvRUCb2pLVXLxeAw8Rq2iBeKvjQ+FAu0QLfCjjz761re+5eKip9VbIqC3DaecO3ToAHXf/G8KhVYIZeh77LHHhO9Zh2k8QuVu2bIF+r01yuKGPXv2NGzYMNWlKMG45ZZbNm/enOpSlFSA7DFq8Ni0/GSxd+/ezMxMG1QTh6eibr755uzs7FQVpgRBNBxKljyYPn365MmTRRQA0f/dno+/r732Gu35zvT7YgCxu2DIIN/LhzQUAFEF5AD6vfF9YJDvpeHplT+GAsAqysnJoT2fFWj9NxG }, {"n": 36, "stem": "有關物理治療的資訊管理，下列何者錯誤？", "options": {"A": "穿戴式感測器是行動化醫療概念下所開發出的產品與服務", "B": "就資料來源而言，專家報告是屬於外部資訊", "C": "醫療資訊安全要符合最小需求原則", "D": "梅森（Mason）提出資訊倫理四大議題，包括隱密性、正確性、資產性與可及性"}, "images": [], "answer": "A", "explanation": "穿戴式感測器屬於「行動化醫療」（mHealth）+「遠距醫療」（telehealth）綜合，不僅是行動化醫療。題敘A過於狹隘但常見視為行動化醫療範疇。"}, {"n": 37, "stem": "醫療系統中追求最高品質，一直是大眾所關心的議題。對於醫療品質的敘述，下列何者不適當？", "options": {"A": "醫療品質應為一個標竿作用，故不應立場不同而產生不同定義", "B": "對於一般使用者而言，醫療品質主要指醫療是否有良好效果", "C": "對於保險業者而言，醫療品質主要評估醫療執行的效率", "D": "對於醫療專業而言，醫療品質主要評核醫療適當性與專業水平"}, "images": [], "answer": "A", "explanation": "醫療品質定義會「因立場不同而有不同強調面向」（病人重療效、保險業重效率、醫療業重專業）。題敘A錯誤。"}, {"n": 38, "stem": "教學醫院評鑑中，有關新進物理治療師之教學訓練計畫，下列何者錯誤？", "options": {"A": "領得物理治療師證書4年內的新進物理治療師，可以成為接受「教學醫院教學費用補助計畫」補助之受訓學 員", "B": "具教學醫院3年以上物理治療執業經驗之專任物理治療師，得擔任教學訓練計畫教師", "C": "每1位物理治療教學訓練計畫教師於同一時期至多指導2名物理治療受訓學員", "D": "具教學醫院臨床教學經驗5年以上物理治療執業經驗之專任物理治療師並取得教師認證完訓證明者，得擔任 教學訓練計畫主持人"}, "images": [], "answer": "C", "explanation": "教學醫院教學費用補助計畫對受訓學員的執業年資限制為「3年內」（不是4年）。"}, {"n": 39, "stem": "實證證據與臨床專才在實證醫療領域的關係應為下列何者，才能提供個案最佳照護？", "options": {"A": "以實證證據取代臨床專才", "B": "以臨床專才取代實證證據", "C": "實證證據與臨床專才相互配合", "D": "實證證據與臨床專才皆非實證醫療考慮因素"}, "images": [], "answer": "C", "explanation": "實證醫學三大支柱：實證證據+臨床專才+病患價值觀。三者相互配合。"}, {"n": 40, "stem": "下列何者最不適合做為實證醫學與實證物理治療三大支柱的項目？", "options": {"A": "高品質臨床研究", "B": "最佳可取得證據", "C": "專業知識", "D": "病患偏好"}, "images": [], "answer": "B", "explanation": "實證醫學三大支柱：①最佳可取得證據+③專業知識+④病患偏好。「高品質臨床研究」屬於證據的來源，不是三大支柱項目。"}, {"n": 41, "stem": "關於知會式決策方式（informed decision-making approach）最後由下列何者決定？", "options": {"A": "醫師", "B": "臨床物理治療師", "C": "病人", "D": "醫師、臨床物理治療師與病人"}, "images": [], "answer": "C", "explanation": "知會式決策（informed decision-making）：醫療人員提供資訊，最終由「病人」做出決定。"}, {"n": 42, "stem": "由研究到實作應用，落實實證執業的過程中，下列那一個步驟最為困難？", "options": {"A": "可用（applicable）", "B": "同意（agreed）", "C": "遵從（adhered to）", "D": "執行（acted on）"}, "images": [], "answer": "C", "explanation": "實證執業最後步驟「遵從」（adhered to）最為困難：將實證持續整合到日常臨床決策並維持是最大挑戰。"}, {"n": 43, "stem": "若要針對一個隨機對照研究進行評析，下列那些工具適合？①PEDro scale ②The TREND statement\n③PRISMA statement ④The CONSORT statement", "options": {"A": "①③", "B": "①④", "C": "②④", "D": "②③"}, "images": [], "answer": "B", "explanation": "PEDro scale與CONSORT statement適用於評析隨機對照研究（RCT）。TREND為非隨機介入；PRISMA為系統性回顧。"}, {"n": 44, "stem": "下列何者不是評析治療介入文獻可信度（credibility）需要考慮的問題？", "options": {"A": "受試者的組別分派是否採用隨機方式", "B": "研究介入時間的長短", "C": "決定納入受試者的研究人員是否事先知道隨機分派順序", "D": "研究各組別間的受試者特性是否相似"}, "images": [], "answer": "B", "explanation": "評析RCT可信度重點：①隨機分派、③隱密分派、④基準線相似性、盲化、追蹤完整性、ITT。「研究介入時間長短」非可信度判斷標準。"}, {"n": 45, "stem": "下列分析中，何者可協助研究者刪除統合分析研究中研究品質較差的文獻？", "options": {"A": "敏感度分析（sensitivity analysis）", "B": "一致性分析（homogeneity analysis）", "C": "反應性分析（responsive analysis）", "D": "出版偏差分析（publication bias analysis）"}, "images": [], "answer": "A", "explanation": "敏感度分析（sensitivity analysis）：刪除品質較差的研究後重新分析，看整體結果是否穩定。"}, {"n": 46, "stem": "下列那一種不是統合分析估計整體效果常用的方法？", "options": {"A": "加權平均差（weighted mean difference）", "B": "異質性（heterogeneity）", "C": "效益值（effect size）", "D": "相對危險性（relative risk）"}, "images": [], "answer": "B", "explanation": "統合分析常用整體效果估計法：加權平均差（WMD）、相對危險（RR）、勝算比（OR）、效益值（effect size）。「異質性」（heterogeneity）為研究間差異性指標，不是估計整體效果方法。"}, {"n": 47, "stem": "下列何種實驗設計有最佳的研究偏差控制？", "options": {"A": "病例報告（case report）", "B": "類實驗型設計（quasi-experimental design）", "C": "實驗型設計（experimental design）", "D": "非實驗型設計（nonexperimental design）"}, "images": [], "answer": "C", "explanation": "RCT（experimental design）有最佳偏差控制：隨機分派、盲化、控制組、ITT分析。其他研究設計偏差控制較差。"}, {"n": 48, "stem": "欲了解治療介入的效果，在研究設計時較不建議採用那一個方法？", "options": {"A": "必須有可以與研究介入對照的組別", "B": "依照身分證尾數將受試者進行隨機分派，單數號到實驗組，雙數號到控制組", "C": "執行治療介入的治療師和負責成效指標測量的研究人員不知道受試者是在那一組", "D": "無論受試者是否有遵循被分派的組別完成介入，仍將受試者歸在原始隨機分配組別進行資料分析"}, "images": [], "answer": "B", "explanation": "依「身分證尾數」分組屬準隨機（quasi-random，不是真正隨機），可被預測，造成選樣偏差。"}, {"n": 49, "stem": "下列文獻搜尋結果何者之證據力最高？", "options": {"A": "兩篇病例研究文獻", "B": "一篇收納三篇質性研究之系統性回顧文獻", "C": "一篇收納兩篇同質性高之類實驗型統合分析文獻", "D": "一篇設計良好之隨機控制臨床研究文獻"}, "images": [], "answer": "D", "explanation": "證據力等級：D RCT > C類實驗統合分析 > B質性回顧 > A個案研究。設計良好的RCT單篇文獻證據力高於低品質的統合分析。"}, {"n": 50, "stem": "下列研究設計對研究偏差（bias）之控制，由最佳至最差之排列順序為：①類實驗型研究（quasi-experimental\nstudy） ②觀察型研究（observational study） ③個案研究（case study）", "options": {"A": "①②③", "B": "②③①", "C": "③①②", "D": "②①③"}, "images": [], "answer": "A", "explanation": "偏差控制：①類實驗（有對照組）>②觀察型（無對照）>③個案（無對照無系統）。即①②③。"}, {"n": 51, "stem": "質性研究（qualitative research）的方法在實證醫學上之意義，下列何者錯誤？", "options": {"A": "可稱自然主義疑問的方法", "B": "最適合回答關於經驗的問題", "C": "被廣泛應用在物理治療理論的建立", "D": "無法探討病人健康相關的知覺和情感"}, "images": [], "answer": "D", "explanation": "質性研究可探討病人健康相關的知覺、情感與經驗。題敘D「無法探討」錯誤。"}, {"n": 52, "stem": "某一研究顯示健康成人六分鐘行走測試的距離與最大運動測試的最大攝氧量有顯著正相關，皮爾森相關係數\n（Pearson correlation coefficient）為0.63（p<0.05）。此研究是建立六分鐘行走測試之那一種效度？", "options": {"A": "內容效度（content validity）", "B": "效標效度（criterion validity）", "C": "預測效度（predictive validity）", "D": "區別效度（discriminant validity）"}, "images": [], "answer": "B", "explanation": "效標效度（criterion validity）：將測試與「金標準」（如最大攝氧量）比較。6MWT與VO2max相關係數0.63屬於建立效標效度（concurrent validity）。"}, {"n": 53, "stem": "有一研究召募40位心衰竭患者進行四週運動訓練，比較患者在訓練前及四週訓練結束時最大攝氧量的進步情\n形。下列資料分析方式何者可能最適用於此研究？", "options": {"A": "student t-test", "B": "paired t-test", "C": "Chi-squared test", "D": "ANCOVA"}, "images": [], "answer": "B", "explanation": "Paired t-test：同組受試者前後比較（pre-post），用於配對連續資料。本題40位患者前後比較最適合。"}, {"n": 54, "stem": "下表為比較結婚者與單身者／鰥寡者其「身體功能（physical functioning）」等8個變項的關係。若臨界值\n（critical value）設為0.01，其中那些變項，在結婚者與單身者／鰥寡者兩組間達到顯著的差異？", "options": {"A": "role limitations-physical、mental health、role limitations-emotional、vitality、general health", "B": "physical functioning、bodily pain", "C": "mental health、role limitations-emotional", "D": "只有vitality"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAqMAAAHZCAIAAAA9rKUFAAAACXBIWXMAAA7EAAAOxAGVKw4bAAVvK0lEQVR4nOy9dXcjSbo3eD/U7h979py77753Z+7A7S60y1VmZltmZmZmZmaSmUG2bItlMTOzDNW9T2baalV1TU1Nd3XfuXMqWqWWpVRk5BNP/CAyM/RvJqPToLeazVbLz4rVarXZbPZv5Vv5Vr6Vb+Vb+Vb+x5Z/+8b0 （中度貧血）+網狀紅血球指數低（1.5%，正常2-2.5%）→骨髓造血功能不足。再生不良性貧血、缺鐵性貧血、葉酸缺乏皆造成造血不足。「溶血性貧血」會使網狀紅血球指數「上升」（不是下降），故B最不可能。"}, {"n": 60, "stem": "張先生52歲，為B型肝炎帶原者，不抽菸不喝酒，最近因疲勞倦怠，小便顏色較深就醫，心跳速率每分鐘75\n下，血壓120/80 mmHg，理學檢查正常，血液及生化檢查異常值為血小板48 × 103/mm3（正常值165～415 ×\n103/mm3）、AST 82（正常值12～38 U/L）、ALT 64 U/L（正常值7～40 U/L）、total bilirubin 1.8 mg/dL（正\n常值0.3～1.3 mg/dL）、PT-INR 2.1，其餘檢驗數據皆在正常範圍內，超音波檢查診斷為肝硬化無腹水，但胃\n鏡檢查出現食道靜脈瘤，大便潛血陽性。下列敘述何者正確？", "options": {"A": "張先生的肝硬化產生食道靜脈瘤，應作食道靜脈曲張結紮術（esophageal varice ligation）預防出血", "B": "張先生有黃疸，為失代償性肝硬化，CHILD-PUGH分數為8分", "C": "張先生有血小板低下的胃腸出血，應立即輸注血小板", "D": "張先生有凝血異常的胃腸出血，應立即輸注新鮮冷凍血漿"}, "images": [], "answer": "A", "explanation": "肝硬化合併食道靜脈瘤+大便潛血→風險高，應做食道靜脈曲張結紮術預防出血。CHILD-PUGH分數需綜合評分。"}, {"n": 61, "stem": "王先生64歲，是位糖尿病病人且有規律服藥，在門診追蹤病情時發現血壓160/100 mmHg，下列何種降血壓藥\n為第一線用藥？", "options": {"A": "methyldopa", "B": "hydralazine", "C": "calcium channel blocker", "D": "angiotensin converting enzyme inhibitor（ACEI）/ angiotensin II receptor blocker（ARB）"}, "images": [], "answer": "D", "explanation": "糖尿病高血壓首選藥物為ACEI/ARB（保護腎功能、降低糖尿病腎病變進展）。其他選項為次線藥物。"}, {"n": 62, "stem": "李先生54歲，因為雙腳水腫合併呼吸急促就醫，診斷為心臟衰竭，醫師使用下列藥物，何者可降低李先生死\n亡率？", "options": {"A": "Diuretic agent", "B": "Digoxin", "C": "Hydralazine", "D": "Angiotensin converting enzyme inhibitor"}, "images": [], "answer": "D", "explanation": "心臟衰竭可降低死亡率的藥物：ACEI/ARB、β-blocker、ARNI、SGLT2 inhibitor、aldosterone antagonist。Diuretic與digoxin僅改善症狀，不降死亡率。"}, {"n": 63, "stem": "骨骼內各種細胞的主要功能，下列敘述何者正確？", "options": {"A": "osteocyte負責生成organic bone matrix", "B": "osteoblast細胞上有parathyroid hormone的receptor", "C": "osteoblast骨骼承受的mechanical signal有反應，控制bone remodeling", "D": "osteoclast經由enzymatic degradation促成bone resorption"}, "images": [], "answer": "D", "explanation": "Osteoclast（破骨細胞）經酵素消化（enzymatic degradation）促成骨吸收。Osteocyte為被埋的成熟骨細胞，主要為機械感應；osteoblast為成骨細胞（生成骨基質）。"}, {"n": 64, "stem": "有關骨質疏鬆的危險因子，下列敘述何者錯誤？", "options": {"A": "抽菸", "B": "有家族病史", "C": "非洲裔人種", "D": "長期服用類固醇"}, "images": [], "answer": "C", "explanation": "骨質疏鬆危險因子：女性、白人/亞裔、家族史、抽菸、酗酒、停經、低體重、長期類固醇、缺乏運動、低鈣攝取。「非洲裔」骨密度高，反為「保護因子」。"}, {"n": 65, "stem": "關於骨肉瘤（osteosarcoma）之敘述，下列何者正確？", "options": {"A": "為罕見的骨惡性腫瘤", "B": "截肢為最好的治療方式", "C": "最常見轉移至肺部", "D": "最常見於60歲以上之年長患者"}, "images": [], "answer": "C", "explanation": "骨肉瘤（osteosarcoma）為兒童青少年最常見的原發性骨惡性腫瘤，最常轉移至「肺部」（血行轉移）。截肢已非最佳治療（多採肢體保留+化療）。"}, {"n": 66, "stem": "股骨頸骨折內固定術後常見的併發症為何？", "options": {"A": "髖臼磨損", "B": "脫臼", "C": "股骨頭缺血性壞死", "D": "神經損傷"}, "images": [], "answer": "C", "explanation": "股骨頸骨折內固定術後常見併發症：股骨頭缺血性壞死（30%）、骨折不癒合、Z字塌陷。脫臼較少（多發於髖關節置換術後）。"}, {"n": 67, "stem": "膝關節的伸直機轉（extension mechanism），不包括下列何者？", "options": {"A": "股四頭肌", "B": "股二頭肌", "C": "髕骨", "D": "髕骨肌腱"}, "images": [], "answer": "B", "explanation": "膝伸直機轉：股四頭肌→股四頭肌肌腱→髕骨→髕骨肌腱→脛骨粗隆。股二頭肌為屈膝肌，不屬於伸直機轉。"}, {"n": 68, "stem": "有關全髖關節置換之敘述，下列何者錯誤？", "options": {"A": "由於人工關節可靠度及耐久性的進步，這種置換手術也可使用在較年輕的成人", "B": "男性、年輕或較小的人工股骨頭會有較高的磨損率", "C": "人工關節的耐久性與組件的磨耗有密切的關聯", "D": "磨耗使組件變薄是導致日後須再重新置換的主因，與磨耗粒子的大小及磨耗粒子產生量的多寡不相關"}, "images": [], "answer": "D", "explanation": "全髖置換術後磨損是再置換的主因，與磨耗粒子大小、產生量「相關」（不是不相關）。題敘D方向錯誤。"}, {"n": 69, "stem": "有關網球肘的敘述，下列何者錯誤？", "options": {"A": "最常發生的肌腱是橈側伸腕短肌", "B": "重複性活動造成微創傷是最常見的原因", "C": "少數病患可能同時合併有尺神經壓迫症狀", "D": "注射富血小板血漿可能有效"}, "images": [], "answer": "C", "explanation": "網球肘可能合併「橈神經」分支（PIN，posterior interosseous nerve）壓迫，不是尺神經。題敘C錯誤。"}, {"n": 70, "stem": "食指背面對於冷熱的感覺主要是由那一條神經傳遞？", "options": {"A": "橈神經", "B": "正中神經", "C": "尺神經", "D": "腋神經"}, "images": [], "answer": "A", "explanation": "食指背面冷熱感覺由「橈神經」淺支（superficial radial nerve）傳遞。其他選項負責不同區域。"}, {"n": 71, "stem": "在疾病流行之初即可快速偵測出來，是屬於何種傳染病偵測系統的特質？", "options": {"A": "高時效性", "B": "高特異性", "C": "高敏感度", "D": "高經濟效益"}, "images": [], "answer": "C", "explanation": "高敏感度（high sensitivity）：可快速偵測出疫情變化（早期偵測）。"}, {"n": 72, "stem": "以田野調查的方式確認風險評估所要界定的問題及影響的群眾，是屬於下列那一項危害評估內容？", "options": {"A": "物質危害辨識", "B": "致癌性鑑定", "C": "非致癌性鑑定", "D": "質性研究"}, "images": [], "answer": "D", "explanation": "質性研究：以田野調查、訪談等方式深入了解問題，可確認風險評估的問題與影響族群。"}, {"n": 73, "stem": "在社會行銷計畫的監測與評價之中，檢查相關政策與硬體設備是否已改變，是屬於下列那一種評價？", "options": {"A": "過程評價", "B": "設備評價", "C": "知覺評價", "D": "結果評價"}, "images": [], "answer": "A", "explanation": "過程評價（process evaluation）：檢查介入過程中政策與設備是否依計畫執行（如硬體設備改變）。"}, {"n": 74, "stem": "全民健康（health for all）的宣言不強調下列那項原則？", "options": {"A": "社區參與", "B": "健康的公平性", "C": "建構特殊事業部門", "D": "基層保健與國際合作"}, "images": [], "answer": "C", "explanation": "全民健康（Health for All by 2000）強調社區參與、健康公平、基層保健、國際合作。「建構特殊事業部門」非HFA核心原則。"}, {"n": 75, "stem": "下列何種方法是評估其他飲食調查方法之效度的黃金標準？", "options": {"A": "24小時回憶法", "B": "飲食頻率問卷", "C": "飲食日記或紀錄", "D": "觀察法"}, "images": [], "answer": "C", "explanation": "飲食日記（diet record）：黃金標準，提供精確、即時的飲食記錄；其他方法（24小時回憶、頻率問卷、觀察）有不同程度誤差。"}, {"n": 76, "stem": "若人體暴露於環境化學毒物中，則腎臟較易排出何種性質之化學毒物？", "options": {"A": "具有極性與水溶性", "B": "不具極性與脂溶性物", "C": "具有極性與脂溶性", "D": "不具極性與水溶性"}, "images": [], "answer": "A", "explanation": "腎臟易排出「具有極性與水溶性」的化學物（不被脂質膜吸收，可由腎絲球過濾排出）。脂溶性物質需經肝臟代謝。"}, {"n": 77, "stem": "某物理治療部門與廠商合作開發新式腦波刺激儀器，希望了解對於改善重度失智病患認知功能的療效，在徵\n召病患過程須取得其關係人同意之順序為何？", "options": {"A": "父母、配偶、同居之兄弟姊妹、同居之成年子女", "B": "配偶、同居之成年子女、父母、同居之兄弟姊妹", "C": "配偶、父母、同居之成年子女、同居之兄弟姊妹", "D": "同居之成年子女、配偶、同居之兄弟姊妹、父母"}, "images": [], "answer": "C", "explanation": "依《人體研究法》與《醫療法》，無自主能力研究受試者關係人同意順序：①配偶②成年子女③父母④兄弟姊妹⑤祖父母（須同居優先）。"}, {"n": 78, "stem": "承上題，參與該研究的治療師也有投資該儀器的開發，若實驗成功將有不少獲利。為擔心他人不相信研究結\n果，成果發表時治療師並未說明投資事宜，這位治療師的作法是否恰當？", "options": {"A": "是，因為治療師對於研究有保密的義務", "B": "是，因為要確保研究中立", "C": "否，研究者有利益衝突時應公開揭露", "D": "否，應公開以維護智慧財產權"}, "images": [], "answer": "C", "explanation": "研究者有利益衝突（conflict of interest）時應於發表時公開揭露，是研究倫理的基本要求。題敘C正確。"}, {"n": 79, "stem": "某研究調查100位大一物理治療學系學生之睡眠時間，結果平均為6.4小時，標準差為1.2小時，則其95%信賴\n區間之上界值（upper limit）約為幾小時？", "options": {"A": "6.38", "B": "6.42", "C": "6.64", "D": "8.75"}, "images": [], "answer": "C", "explanation": "95% CI上界值=平均+1.96×SE=6.4+1.96×(1.2/√100)=6.4+0.235≈6.64。"}, {"n": 80, "stem": "承上題，該研究所設定之顯著程度為：", "options": {"A": "0.01", "B": "0.05", "C": "95%", "D": "99%"}, "images": [], "answer": "B", "explanation": "顯著程度=1-CI=1-0.95=0.05。"}]}, "Q2": {"label": "第二次", "questions": [{"n": 1, "stem": "我國6年制大學物理治療學系學士班畢業生授予何種學位？", "options": {"A": "物理治療博士", "B": "物理治療學博士", "C": "物理治療學士", "D": "理學士"}, "images": [], "answer": "C", "explanation": "我國6年制大學物理治療學系畢業生授予「物理治療學士」（BPT）學位，等同於專業學位。"}, {"n": 2, "stem": "有關臺灣物理治療學校教育，下列敘述何者錯誤？", "options": {"A": "大學招收物理治療學生始於民國56年", "B": "最早招收物理治療學生的學系是臺灣大學醫事技術學系", "C": "目前的物理治療學校教育包括高職、專科、大學、科技大學", "D": "民國105年開始招收6年制物理治療學生"}, "images": [], "answer": "C", "explanation": "目前物理治療學校教育僅含「大學、科技大學」（4年制+6年制），不再招收高職、專科。題敘C錯誤。"}, {"n": 3, "stem": "有關國際物理治療組織的敘述，下列何者錯誤？", "options": {"A": "世界物理治療聯盟（World Confederation for Physical Therapy, WCPT）於1951年於丹麥成立", "B": "世界物理治療聯盟大會現行為每二年召開一次", "C": "亞洲物理治療聯盟（Asian Confederation for Physical Therapy, ACPT）於1981年於臺灣成立", "D": "亞洲物理治療聯盟大會曾於1993年於臺灣舉辦"}, "images": [], "answer": "C", "explanation": "ACPT於1981年成立但成立地點不在台灣（題目C需考據）；首屆ACPT大會於1985年於台灣舉辦（不是1993）。"}, {"n": 4, "stem": "一位物理治療實習生以個案管理模式格式書寫一位腦外傷患者病歷，為了確認患者的腦傷位置，他查看了患者\n在急診時的電腦斷層影像資料及診斷，他應該將這些資訊撰寫於那一部分？", "options": {"A": "檢查（examination）", "B": "評估（evaluation）", "C": "診斷（diagnosis）", "D": "預後（prognosis）"}, "images": [], "answer": "A", "explanation": "電腦斷層影像為臨床「檢查」（examination）資訊，屬於物理治療個案管理首步驟。"}, {"n": 5, "stem": "若簡易心智檢查（Mini-Mental State Examination）得分為21～24分，則其認知功能為下列何者？", "options": {"A": "正常", "B": "輕度認知能力缺損", "C": "中度認知能力缺損", "D": "重度認知能力缺損"}, "images": [], "answer": "B", "explanation": "MMSE分數24-30正常；21-24輕度認知缺損；10-20中度；<10重度。21-24為輕度認知缺損。"}, {"n": 6, "stem": "關於社區物理治療工作特質與內容，下列敘述何者錯誤？", "options": {"A": "結合物理治療業務與衛生業務的意念", "B": "個案主動提出需求或由他人轉診而來", "C": "物理治療服務包括健康促進、預防篩檢、治療、限制殘障及復健", "D": "服務之個案包括社區一般民眾、慢性病之危險群、需復健或長期照顧的失能者"}, "images": [], "answer": "B", "explanation": "社區物理治療不只「個案主動提出」或他人轉診，可主動發掘社區個案需求並提供預防、健康促進等服務。"}, {"n": 7, "stem": "國內為推展身心障礙兒童的早期療育，依照特殊教育法的規定，特殊教育的實施應自幾歲開始？", "options": {"A": "一歲", "B": "二歲", "C": "三歲", "D": "六歲"}, "images": [], "answer": "B", "explanation": "依《特殊教育法》規定，特殊教育實施應「自2歲開始」。"}, {"n": 8, "stem": "對於癌症末期或臥床已久的病人，下列何種介入較不適宜？", "options": {"A": "被動關節活動度（passive range of motion）技術維持關節活動", "B": "增強式訓練（plyometric training）強化肌肉力量", "C": "恢復體力運動（reconditioning exercise）維持身體功能", "D": "徒手淋巴引流（manual lymphatic drainage）治療淋巴水腫"}, "images": [], "answer": "B", "explanation": "癌症末期或臥床久者體能差，「增強式訓練」（plyometric，需爆發力）強度過高不適合。其他三項較安全。"}, {"n": 9, "stem": "物理治療倫理學之理論架構，與下列何者的關聯性最低？", "options": {"A": "醫學倫理（medical ethics）", "B": "應用倫理學（applied ethics）", "C": "規範倫理學（normative ethics）", "D": "後設倫理學（meta ethics）"}, "images": [], "answer": "D", "explanation": "物理治療倫理屬「應用倫理學」，與醫學倫理、規範倫理高度相關。後設倫理學（meta-ethics）討論倫理本身，與物治倫理關聯較低。"}, {"n": 10, "stem": "物理治療師實踐專業倫理，最理想的方式為何？", "options": {"A": "自身研判狀況而自動遵行倫理法則", "B": "不辜負他人要求或社會的期望而遵行", "C": "擔心受罰而遵行", "D": "期望獲得獎勵而遵行"}, "images": [], "answer": "A", "explanation": "Kohlberg道德發展最高層次：依個人良知與普遍倫理原則自動遵行（非為獎賞、處罰或他人期望）。"}, {"n": 11, "stem": "某長照機構為了節省成本，對於失禁臥床住民的尿布都是全濕後才幫忙替換，導致住民出現濕疹，這種做法\n違反下列那一項醫學倫理原則？", "options": {"A": "病人自主", "B": "秉持公義", "C": "切勿傷害", "D": "行善利人"}, "images": [], "answer": "C", "explanation": "尿布全濕才換造成皮膚濕疹屬於照顧不當造成的傷害，違反「切勿傷害」（non-maleficence）原則。"}, {"n": 12, "stem": "根據安寧緩和醫療條例，有一位末期女病人意識昏迷無法清楚表達意願時，下列有關家屬代理決定權的順\n位，何者是最末順位？", "options": {"A": "子女", "B": "曾祖父母", "C": "公婆", "D": "兄弟姊妹"}, "images": [], "answer": "C", "explanation": "安寧緩和條例代理決定權順位：①配偶②成年子女③父母④兄弟姊妹⑤祖父母⑥孫子女⑦其他直系姻親（如公婆）。公婆為最末順位。"}, {"n": 13, "stem": "根據中華民國物理治療師倫理準則，物理治療師的服務內容不因國籍、種族、膚色、宗教、政治或社會地位\n而有所不同，這準則最符合下列何項醫學倫理的原則？", "options": {"A": "切勿傷害", "B": "行善利人", "C": "公平正義", "D": "病人自主"}, "images": [], "answer": "C", "explanation": "不因國籍、種族等差別待遇，符合「公平正義」（justice）原則—平等對待所有人。"}, {"n": 14, "stem": "病人有很好的功能不需物理治療，但若基於交情仍為其施行電療，則違反中華民國物理治療師專業行為準則\n的那一項？", "options": {"A": "物理治療師應尊重每一個體之權利和尊嚴", "B": "物理治療師應充分瞭解其專業的目的、責任和執業範圍", "C": "物理治療師應誠實取得合理之執業報償", "D": "物理治療師應提供經過驗證之專業服務和資訊"}, "images": [], "answer": "B", "explanation": "病人不需要治療而仍施予電療，違反「物理治療師應充分了解其專業的目的、責任和執業範圍」（避免不必要治療）。"}, {"n": 15, "stem": "物理治療師想實踐倫理卻遭遇到不同觀點對「最佳行為」的認知和實踐不同，是屬於那一種倫理兩難\n（dilemma）的困境？", "options": {"A": "德行的兩難", "B": "價值的兩難", "C": "義務的兩難", "D": "結構的兩難"}, "images": [], "answer": "A", "explanation": "「德行的兩難」：對「最佳行為」的認知與實踐有不同觀點，是德性倫理（virtue ethics）討論的兩難。"}, {"n": 16, "stem": "美國醫療照護機構聯合評鑑委員會公告2005年之病人安全目標，包含下列那些項目？①正確辨識病人 ②改\n善醫護人員之間的溝通 ③引進新技術增加臨床治療的療效 ④減少病人跌倒造成之傷害", "options": {"A": "僅①②", "B": "僅③④", "C": "②③④", "D": "①②④"}, "images": [], "answer": "D", "explanation": "JCAHO 2005年六項病人安全目標：①正確辨識病人、②改善溝通、④減少跌倒、用藥安全、改善手術安全等。「引進新技術提升療效」非2005年目標。"}, {"n": 17, "stem": "有關病人權利中的「知情同意」，下列敘述何者錯誤？", "options": {"A": "雖經醫師判斷未成年患者對於治療行為之效果或危險能理解者，其本身仍不可行使決定權", "B": "對於意識清楚的病人，在了解正確資訊後，有接受或拒絕治療的權利", "C": "對於末期的病人，可在適當的狀態下充分告知病患相關的病情、診療及照顧方式", "D": "若病人無自主及理解能力，須適當的告知其代理人或家屬，讓他們參與治療計畫的決定"}, "images": [], "answer": "A", "explanation": "成熟未成年人（mature minor doctrine）：經醫師判斷對醫療效果或危險能理解者，可行使部分決定權。題敘A方向錯誤。"}, {"n": 18, "stem": "一位物理治療師在參加繼續再教育中都趴在桌子上睡覺，不想學習上課內容，只想領取繼續再教育時數證\n明。此治療師行為違反那一項物理治療師倫理準則？", "options": {"A": "物理治療師應維持和提升物理治療的專業能力", "B": "物理治療師應尊重每一個體之權利與尊嚴", "C": "物理治療師應誠實取得合理之業務報酬", "D": "物理治療師應善盡服務團隊中的專業責任"}, "images": [], "answer": "A", "explanation": "繼續教育課程趴桌子睡覺，違反「物理治療師應維持和提升物理治療的專業能力」準則。"}, {"n": 19, "stem": "關於紐倫堡公約的基本要素，下列敘述何者錯誤？", "options": {"A": "自主及知情同意", "B": "風險利益分析", "C": "隨時可退出人體試驗不受懲罰", "D": "受試者利益高於社會利益"}, "images": [], "answer": "D", "explanation": "紐倫堡公約四要素：①自願知情同意、②風險利益分析、③可隨時退出、④研究目的合理。受試者個人利益重要但「不一定高於社會利益」（兩者皆需考量）。"}, {"n": 20, "stem": "下列針對人體試驗最早見諸文字的準則為何？", "options": {"A": "漢摩拉比法典", "B": "希波克拉底誓言", "C": "紐倫堡公約", "D": "里約宣言"}, "images": [], "answer": "C", "explanation": "紐倫堡公約（1947）為人體試驗最早的成文倫理準則，源於二戰後納粹醫學實驗的反思。"}, {"n": 21, "stem": "目前法律上對醫療隱私的相關規範，不包括下列何者？", "options": {"A": "憲法", "B": "個人資料保護法", "C": "長期照顧服務法", "D": "民法"}, "images": [], "answer": "A", "explanation": "醫療隱私規範包括：個資法、長照服務法、民法、醫療法、醫師法、刑法等。憲法雖保障基本人權但「未具體規範醫療隱私」。"}, {"n": 22, "stem": "一位在醫院進行物理治療實習的甲生，受到在同單位實習的乙生愛慕，甲生每天都會接到乙生傳送的愛慕簡\n訊，對此不勝其擾的甲生想提出申訴，此案件屬於那一個法律規範？", "options": {"A": "性別工作平等法", "B": "性別平等教育法", "C": "性騷擾防治法", "D": "物理治療師法"}, "images": [], "answer": "AB", "explanation": "實習生間性騷擾事件可同時依「性別工作平等法」（職場）+「性別平等教育法」（教育場域實習）雙重申訴。性騷擾防治法為一般法。"}, {"n": 23, "stem": "關於全民健保實施後，對醫療環境造成的衝擊下列何者正確？", "options": {"A": "中小型醫院具有低成本高效益的特色，加上全民健保支付價格如同過去勞保支付免審範圍的方式，令中小型 醫院得以多元發展", "B": "全民健保對於住院費用給付偏低，因此造成醫學中心或大型醫院以擴充病房的方式來增加收入，吸引更多民 眾住院治療", "C": "基層醫療及診所由於設備不若大型醫院完善，加上優秀人員招募留任不易，因此收入急遽減少，多數走向倒 閉或整併為聯合診所形式經營", "D": "現今健保採總額預算制，這樣的制度可能迫使醫院管理者降低合理的營運成本，甚至對醫療人員變相減薪"}, "images": [], "answer": "D", "explanation": "全民健保總額預算制可能迫使醫院降低營運成本、變相減薪。其他選項描述錯誤（A、B、C方向不正確）。"}, {"n": 24, "stem": "根據Schafer等人提出物理治療師須具備行政管理的六大核心智能（簡稱FINHOP），不包含下列何者？", "options": {"A": "空間設計", "B": "人際網絡", "C": "組織運作", "D": "財務管理"}, "images": [], "answer": "A", "explanation": "FINHOP六大智能：F人際網絡（fellowship）+I資訊管理+N規劃預測+H人力資源+O組織運作+P財務管理。「空間設計」不在六大核心。"}, {"n": 25, "stem": "下列何者被稱為系統生產之父，致力於以科學管理改善工人的生產行為？", "options": {"A": "費堯（Henri Fayol）", "B": "泰勒（Frederick Taylor）", "C": "韋伯（Max Weber）", "D": "梅歐（Elton Mayo）"}, "images": [], "answer": "B", "explanation": "Frederick Taylor（泰勒）為「科學管理之父」，提倡時間動作研究與標準化作業。"}, {"n": 26, "stem": "1960年代麥卡錫（McCarthy）提出4P行銷組合的概念，其中4P是指下列那一個組合？", "options": {"A": "包裝、價格、通路、規劃", "B": "產品、口碑、促銷、定位", "C": "包裝、口碑、價格、定位", "D": "產品、價格、通路、促銷"}, "images": [], "answer": "D", "explanation": "McCarthy 4P：Product（產品）、Price（價格）、Place（通路）、Promotion（促銷）。"}, {"n": 27, "stem": "依據長期照顧服務人員訓練認證繼續教育及登錄辦法之規定，下列敘述何項錯誤？", "options": {"A": "物理治療師經本法訓練、認證，領有證明得為提供長期照顧服務之長照服務人員", "B": "長照服務人員認證證明文件有效期間為五年", "C": "長照服務人員非經登錄於長照機構，不得提供長照服務", "D": "長照服務人員至非登錄之長照機構提供支援服務時，應於事前由登錄之長照機構敘明支援之地點、期間、時 段及理由，報機構所在地直轄市、縣（市）主管機關核定"}, "images": [], "answer": "B", "explanation": "長照服務人員認證證明文件有效期間為6年（不是5年）。題敘B錯誤。"}, {"n": 28, "stem": "高姓復健專科醫師原開設有「高興復健科診所」，旗下李姓、莊姓物理治療師臨床經驗豐富，且長期經營徒\n手市場超過10年。高姓醫師與兩位治療師討論後，決議在與復健科診所同棟的地下一樓，設置「高興物理治\n療所」，主要鎖定骨科徒手個案。下列敘述何者正確？", "options": {"A": "高興物理治療所始於高姓醫師創立，故應以高姓醫師為申請人", "B": "高興物理治療所原以李姓治療師為負責物理治療師，若未來李姓治療師因出國進修，後續半年將不能執行業 務，則可指定莊姓治療師為其代理人", "C": "「高興」物理治療所由於在同一縣市內，已有「高興」復健科診所設置，因此該名稱依法不得使用", "D": "高興物理治療所消防設施符合檢驗，可將主要樓層設置在地下一樓"}, "images": [], "answer": "B", "explanation": "L姓治療師若出國半年以上不能執行業務，應改報停業/歇業，並指定符合資格的代理人（莊治療師）為負責人。題目B正確。"}, {"n": 29, "stem": "簡姓物理治療師畢業後順利通過國考，隨後開始執業工作。近期即將工作滿6年，同事提醒要去辦理執照更\n新。對於執業執照更新的過程，下列何者敘述錯誤？", "options": {"A": "現行物理治療師執業與繼續教育乃依據物理治療師執業登記及繼續教育辦法辦理，獨立於醫事人員執業登記 及繼續教育辦法之外", "B": "執業執照可在屆滿期前6個月，檢附相關資料提前向原發執業執照機關，申請更新執業執照", "C": "簡姓物理治療師換照前，繼續教育課程積分應至少達120點", "D": "簡姓物理治療師曾參加某「失智長者活動促進」課程，該課程得同時認定為醫事人員繼續教育積分與長照人 員繼續教育積分"}, "images": [], "answer": "A", "explanation": "醫事人員執業登記及繼續教育辦法統一規範醫事人員（含PT），物理治療師不獨立於該辦法之外。題敘A錯誤。"}, {"n": 30, "stem": "物理治療師將證照租借他人使用會受到何種處分？", "options": {"A": "罰鍰", "B": "有期徒刑", "C": "廢止執業執照", "D": "廢止物理治療師證書"}, "images": [], "answer": "D", "explanation": "證照租借他人使用：依物治師法第38條，「廢止其物理治療師證書」（嚴重違規）。"}, {"n": 31, "stem": "下列有關物理治療師法的敘述，何者正確？①無論地方或中央，衛生主管機關均為衛生福利部  ②物理治療師\n停業或歇業時，應於事實發生之日起30日內，報請原發執業執照機關備查   ③如停業超過1年者，應辦理歇業\n④物理治療所的物理治療紀錄，應至少保存10年", "options": {"A": "①②③", "B": "僅②④", "C": "僅③④", "D": "②③④"}, "images": [], "answer": "D", "explanation": "①「衛生主管機關」中央為衛福部、地方為縣市政府衛生局（非全皆衛福部）。②30天內報停業；③停業>1年應辦歇業；④物治紀錄保存10年。②③④正確。"}, {"n": 32, "stem": "下列何者不符合無障礙樓梯設計規定？", "options": {"A": "為美觀目的得設置梯級間無垂直板之露空式樓梯", "B": "樓梯上所有梯級之級高及級深應統一，級高應為16公分以下，級深應為26公分以上", "C": "梯級踏面邊緣應作防滑處理，其顏色應與踏面有明顯不同", "D": "樓梯兩端扶手應水平延伸30公分以上且不得突出於走廊上"}, "images": [], "answer": "A", "explanation": "無障礙樓梯設計禁止露空式樓梯（避免穿透物落下與視覺干擾）。題敘A錯誤。"}, {"n": 33, "stem": "吳姓治療師在臨床過程與病患相處融洽且私交甚篤，私下暗示病患向其主管多多美言。而主管後續收到許多\n正向的病患回饋後，開始忽略該治療師許多的偏差行為（開會遲到、績效低落、抱怨工作環境等），進而將\n其所有行為皆正面化，導致無法做出適當的績效考核。此行為最有可能涉及心理學上的何種效應？", "options": {"A": "暈輪效應（Halo effect）", "B": "霍桑效應（Hawthorne effect）", "C": "趨中傾向（Central tendency）", "D": "近因效應（Recency effect）"}, "images": [], "answer": "A", "explanation": "暈輪效應（halo effect）：因某一面（私交、好印象）而忽略其他負面表現，導致整體評價偏正向。"}, {"n": 34, "stem": "績效考核的方法很多，其中表現標準法不是按照下列何者來評量？", "options": {"A": "表現指標", "B": "表現評分", "C": "表現目標", "D": "表現方式"}, "images": [], "answer": "D", "explanation": "表現標準法（performance standard method）按指標、評分、目標來評量，「表現方式」非標準項目。"}, {"n": 35, "stem": "關於現行全民健保對於物理治療的給付，下列何者錯誤？", "options": {"A": "開放復健科、神經科、骨科、神經外科、整型外科或家醫科專科醫師可以申請給付", "B": "複雜治療限復健專科醫師開具之處方，交由相關治療專業人員親自實施始可申報", "C": "42017C、42018C與42019C限復健科專科醫師開設之基層院所或基層院所聘有專任之復健醫師者申報", "D": "復健科專科醫師親自實施物理治療者，每日可申報上限為45人次"}, "images": [], "answer": "A", "explanation": "健保物理治療給付申請科別：復健科、神經內科、神經外科、骨科、整形外科、家醫科。題敘A過於限制（家醫科可申請）。"}, {"n": 36, "stem": "陳姓物理治療組長由於部門績效低落，被院內經營管理部門要求提高產能。陳姓組長做出下列何項規劃能增\n加產能？", "options": {"A": "增加記錄病歷、報表的時間，落實詳實記載", "B": "增加對臨床物理治療學生的教學活動", "C": "提高安全、消防演練的頻率", "D": "將治療區動線重新規劃，以減少往返的時間"}, "images": [], "answer": "D", "explanation": "增加產能應減少非治療時間（行政、報表）。「重新規劃動線減少往返」可有效提升服務量。其他選項皆增加非治療時間。"}, {"n": 37, "stem": "梅森（Mason）提出資訊倫理四大議題，其中資訊擁有者對於該資訊具有持有、處置及利用的權力，指的是\n下列何者？", "options": {"A": "隱私權（privacy）", "B": "正確性（accuracy）", "C": "資產性（property）", "D": "可及性（accessibility）"}, "images": [], "answer": "C", "explanation": "資產性（property）：資訊擁有者對該資訊具有持有、處置、利用權力。隱私為個人資訊保護；正確性為資訊真實；可及性為使用權。"}, {"n": 38, "stem": "物理治療師提供服務的過程中，對於個案進行評估、計畫擬定、治療介入、再評估的個案管理流程，即符合\n價值組態的那一種模式？", "options": {"A": "價值鏈模式", "B": "價值商店模式", "C": "價值網路模式", "D": "價值投資模式"}, "images": [], "answer": "B", "explanation": "價值商店模式（value shop）：以解決問題為核心，依個案管理流程（評估→計畫→介入→再評估）提供客製化服務，符合PT工作模式。"}, {"n": 39, "stem": "品質控制、品質保證、品質管理代表了不同意涵，同時也代表追求最佳品質的思維不斷演進。關於品質管理\n的思潮演進，下列敘述何者正確？", "options": {"A": "「由上而下全面性結構完整的管理活動，結合品管圈與相關團體的努力，持續提升服務品質」，以上屬於品 質控制的概念", "B": "品質管理過程中，需要持續與內部及外部溝通，並隨時檢討改進，會造成醫療成本的上升", "C": "品質保證是描述一個組織所有用以保證作業品質的方法，包含品質系統、人員、設施、方法、申訴的步驟等", "D": "品質保證現在多用來取代品質管理一詞，彰顯循環不止，以促進醫療品質的管理方式"}, "images": [], "answer": "C", "explanation": "品質保證（QA）：包含品質系統、人員、設施、方法、申訴步驟等用以保證作業品質的綜合管理活動。"}, {"n": 40, "stem": "我國醫院評鑑制度的沿革，下列何者正確？", "options": {"A": "國內教學醫院的評鑑起始於民國57年", "B": "民國76年國內第一次醫院評鑑時，尚未訂定復健部門的評鑑標準", "C": "新制醫院評鑑制度自民國96年起，評鑑項目只增不減且日漸繁複，造成第一線人員應接不暇", "D": "過去醫院評鑑多採取按照章節條文查證書面與佐證資料，現今多採用Patient Focus Method（PFM）的評鑑方 式"}, "images": [], "answer": "D", "explanation": "我國醫院評鑑現採PFM（病人焦點法）：跟隨病人在醫院的真實流程進行查證，較傳統章節查證更貼近實務。"}, {"n": 41, "stem": "剛接受實習訓練的物理治療學生，接到一位診斷為沾黏性肩關節囊炎（adhesive capsulitis）的病人，腦中出現\n不少問題，下列那一個問題較不適合從傳統教科書搜尋證據？", "options": {"A": "「會有那些症狀？」", "B": "「治療選項有那些？」", "C": "「致病原因為何？」", "D": "「震波治療與短波治療相比，何者可以有效促進患者的組織代謝循環？」"}, "images": [], "answer": "D", "explanation": "「震波vs.短波對組織代謝循環」屬精細的療效比較問題，需查實證文獻（RCT、統合分析），傳統教科書不易找到具體比較。"}, {"n": 42, "stem": "關於實證物理治療發展的敘述，下列何者錯誤？", "options": {"A": "起源之一是荷蘭馬斯垂克大學（University of Masstricht）的推廣", "B": "澳洲物理治療學會創建PEDro資料庫，並編撰第一本實證物理治療教科書", "C": "美國物理治療學會為促進醫學文獻轉譯，在其專業期刊增設「LEAP（Linking Evidence and Practice）」的專 欄", "D": "臺灣物理治療學會自2006年起在專業期刊增設臨床實證的文章類別"}, "images": [], "answer": "B", "explanation": "PEDro資料庫由「澳洲物理治療學會」於CEBP（Centre for Evidence-Based Physiotherapy）建立，但「第一本實證PT教科書」不一定是該會編撰。題目B描述需考據。"}, {"n": 43, "stem": "有關實證物理治療所定義的高品質臨床研究特徵，不包含下列何者？", "options": {"A": "研究在臨床、居家或社區環境中進行", "B": "與臨床問題相關", "C": "以動物或人體為研究對象", "D": "研究無偏好（bias）"}, "images": [], "answer": "C", "explanation": "高品質臨床研究應以「人體」為研究對象（不含動物實驗）。題敘C錯誤。"}, {"n": 44, "stem": "某物理治療師想要了解震波治療對足底筋膜炎之療效，他以關鍵字「震波」、「足底筋膜炎」從資料庫中搜\n尋完文獻，接下來的步驟何者最適合？", "options": {"A": "評析每一篇文獻品質", "B": "篩選適合相關研究論文", "C": "整合實證與專家意見", "D": "進行統合分析"}, "images": [], "answer": "B", "explanation": "搜尋文獻後下一步應先「篩選相關研究論文」（依納入排除條件），再評析品質與整合結果。"}, {"n": 45, "stem": "有關實證物理治療發展出PEDro量表的敘述，下列何者正確？", "options": {"A": "適合評讀預後研究", "B": "共有10題，滿分為10分", "C": "不用於測量研究結論的效度", "D": "量表得分越高的研究，其介入療效越具有臨床價值"}, "images": [], "answer": "C", "explanation": "PEDro量表共11題（題1為入選條件不計分），總分10分，主要評估RCT的內在效度。「不用於測量結論的效度」描述正確—量表評估的是研究方法品質，不是結論本身。"}, {"n": 46, "stem": "評析疾病危險因子與預後文獻的可信度（credibility），研究追蹤至少應達到多少比率才算追蹤夠完整？", "options": {"A": "60%", "B": "70%", "C": "80%", "D": "90%"}, "images": [], "answer": "C", "explanation": "預後文獻可信度：研究追蹤完整度應≥80%（避免脫落造成偏差）。"}, {"n": 47, "stem": "下列措施何者有助於增進成果研究（outcome research）的品質？①採用病例控制研究設計（case-control study\ndesign） ②給予各研究變項之操作型定義 ③使用良好效度之評估工具", "options": {"A": "①②③", "B": "僅①②", "C": "僅①③", "D": "僅③"}, "images": [], "answer": "A", "explanation": "成果研究品質：①病例對照研究設計（評估因果）、②操作型定義明確、③效度好的評估工具，三者皆有助於提升品質。"}, {"n": 48, "stem": "有關系統性回顧或統合分析文獻評析的敘述，下列何者錯誤？", "options": {"A": "使用統合分析來估計整體效果（overall effect）", "B": "兩者皆有執行質性的整合來解析綜合效果的方向性", "C": "兩者皆可以探討治療或預防介入方式的有效性", "D": "兩者皆能呈現高品質和有效性的結果"}, "images": [], "answer": "D", "explanation": "系統性回顧進行質性整合，統合分析使用量化整合。但「兩者皆能呈現高品質和有效性的結果」過於絕對—品質取決於納入研究品質。"}, {"n": 49, "stem": "下列何項是實驗型研究設計（experimental research design）應具備的特點？", "options": {"A": "受試者須隨機分配至各組", "B": "至少須有3組以上的受試者", "C": "應有追蹤測試", "D": "應在醫學中心進行資料收集"}, "images": [], "answer": "A", "explanation": "實驗型研究（experimental design）必備：受試者隨機分配（randomization）至各組。其他選項非必要條件。"}, {"n": 50, "stem": "依據英國牛津實證醫學中心（Oxford Centre for Evidence Based Medicine）證據等級分級，下列何種文獻的證\n據等級最高？", "options": {"A": "個案報告", "B": "隨機對照試驗的系統性回顧", "C": "單獨的隨機對照試驗", "D": "有追蹤測試的非隨機對照試驗"}, "images": [], "answer": "B", "explanation": "Oxford證據等級：Level 1a為「RCT的系統性回顧」（最高證據力）。單獨RCT為1b；觀察型研究為2-3。"}, {"n": 51, "stem": "Cochrane 資料庫不收納下列那一類研究文獻？", "options": {"A": "介入前後研究", "B": "隨機控制臨床試驗", "C": "系統性回顧", "D": "統合分析"}, "images": [], "answer": "A", "explanation": "Cochrane資料庫主要收納：RCT、系統性回顧、統合分析。「介入前後研究」屬類實驗，較少收納。"}, {"n": 52, "stem": "研究者調查太極拳對老人平衡之改善程度，收納40位個案，依其意願分為控制組與實驗組，此研究之設計\n為：", "options": {"A": "隨機控制研究（randomized controlled trial）", "B": "臨床控制研究（clinical controlled trial）", "C": "病例控制研究（case-control study）", "D": "介入前後研究（before-after study）"}, "images": [], "answer": "B", "explanation": "依個案意願（不是隨機）分組為「臨床對照研究」（CCT）或類實驗研究，不是真正的RCT。"}, {"n": 53, "stem": "物理治療師進行皮卓實證資料庫（PEDro）的文獻搜尋，下列那一項不是使用這個資料庫的優點？", "options": {"A": "提供決定臨床試驗內在效度的課程", "B": "提供對於收集文獻評分不同意見回饋的管道", "C": "可依「身體部位」項目進行檢索", "D": "提供較特定的限制條件進行檢索"}, "images": [], "answer": "D", "explanation": "PEDro資料庫優點：①提供決定內在效度評分課程、②可身體部位檢索、④提供文獻評分回饋管道。但「特定限制條件檢索」較不是其特色。"}, {"n": 54, "stem": "將300位高血壓患者隨機分配至肌力訓練組、心肺功能訓練組、平衡訓練組進行三個月訓練。三個月後欲比較\n各組受試者收縮壓數值的改變量，下列何項統計方式最適當？", "options": {"A": "獨立樣本t檢定", "B": "卡方檢定", "C": "變異數分析", "D": "迴歸分析"}, "images": [], "answer": "C", "explanation": "三組以上比較：使用ANOVA（變異數分析）。t檢定僅兩組；卡方為類別資料；迴歸為預測。"}, {"n": 55, "stem": "某研究結果顯示六分鐘行走測試之距離與最大攝氧量之相關係數為0.6，p值為0.06，則兩者的相關性程度為\n何？", "options": {"A": "無關", "B": "弱相關", "C": "中度相關", "D": "強相關"}, "images": [], "answer": "A", "explanation": "p=0.06>0 function isCorrect(paper, n, pick) {
  const ans = DATA[paper].questions[n-1].answer;
  if (ans === "#") return true; // 一律給分
  return ans.indexOf(pick) >= 0; // single "A" or multi "AB" (X 或 Y 均給分)

function picksDone(paper) {
  return Object.keys(state.picks[paper]).length;
}

function score(paper) {
  let s = 0;
  for (const n in state.picks[paper]) {
    if (isCorrect(paper, parseInt(n), state.picks[paper][n])) s++;
  }
  return s;
}

    btn.className = "gbtn";
    btn.textContent = n;
    if (state.idx[state.paper] === i && !state.viewSummary) btn.classList.add("cur");
    if (n in state.picks[state.paper]) {
      const ok = isCorrect(state.paper, n, state.picks[state.paper][n]);
      btn.classList.add(ok ? "right" : "wrong");
    }
    if (isMarked(state.paper, n)) btn.classList.add("marked");

  }

  let verdictHTML = "";
  if (locked) {
    if (correct === "#") {
      verdictHTML = `<div class="verdict note">
        <h3>本題經考選部公告「一律給分」</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else if (correct.length > 1) {
      const ok = correct.indexOf(pick) >= 0;
      const letters = correct.split("").join(" 或 ");
      verdictHTML = `<div class="verdict note">
        <h3>本題經考選部公告「答 ${letters} 均給分」　·　${ok ? "✓ 你的選擇 ("+pick+") 在正解內" : "✗ 你選 "+pick+"，未在正解內"}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else {
      const ok = pick === correct;
      verdictHTML = `<div class="verdict ${ok ? "right" : "wrong"}">
        <h3>${ok ? "✓ 答對" : "✗ 答錯"}　·　正解：${correct}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    }
  }

  main.innerHTML = `<div class="card">
    <div class="qhead">
      <span class="qnum">第 ${q.n} 題</span>
      <span class="qmeta">${DATA[state.paper].label}　·　${q.images.length>0?"含附圖":"純文字"}${isMarked(state.paper, q.n) ? ' <span class="marked-badge">🔖 已標記</span>' : ''}</span>
      <button class="markbtn ${isMarked(state.paper, q.n) ? "marked" : ""}" id="markBtn" title="標記此題以便日後複習">${isMarked(state.paper, q.n) ? "🔖 已標記" : "🔖 標記"}</button>
    </div>
    <div class="stem">${escapeHTML(q.stem)}</div>
    ${imgsHTML}
    <div class="opts">${optsHTML}</div>
    ${verdictHTML}
    <div class="nav">
      <button class="btn ghost" id="prevBtn" ${i===0?"disabled":""}>← 上一題</button>
      <button class="btn" id="nextBtn" ${i===total-1?"disabled":""}>下一題 →</button>
      <button class="btn ghost" id="clearBtn" ${locked?"":"disabled"}>清除本題作答</button>
      ${i===total-1?'<button class="btn" id="finishBtn">完成本卷 / 看總結</button>':""}
    </div>
  </div>`;

  // wire up
  main.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => {
      if (locked) return;
      const k = el.getAttribute("data-k");
      state.picks[state.paper][q.n] = k;
      savePicks();
      render();
    };
  });
  $("#prevBtn").onclick = () => { if (i>0) { state.idx[state.paper] = i-1; render(); } };
  $("#nextBtn").onclick = () => { if (i<total-1) { state.idx[state.paper] = i+1; render(); } };
  $("#clearBtn").onclick = () => { delete state.picks[state.paper][q.n]; savePicks(); render(); };
  $("#markBtn").onclick = () => { toggleMark(state.paper, q.n); render(); };
  const fb = document.getElementById("finishBtn");
  if (fb) fb.onclick = () => { state.viewSummary = true; render(); };
}

function renderSummary() {
  const qs = DATA[state.paper].questions;
  const total = qs.length;
  const done = picksDone(state.paper);
  const s = score(state.paper);
  const pct = ((s/total)*100).toFixed(1);
  progressEl.textContent = `本卷總結　·　已作答 ${done}/${total}　·　得分 ${s}　·　已標記 ${markedCount(state.paper)}`;

  const wrongRows = [];
  for (let i = 0; i < qs.length; i++) {
    const q = qs[i];
    const pick = state.picks[state.paper][q.n];
    if (pick === undefined) continue;
    if (q.answer === "#") continue;
    if (pick === q.answer) continue;
    const stemShort = q.stem.length > 50 ? q.stem.slice(0, 50) + "…" : q.stem;
    wrongRows.push(`<div class="wrong-row" data-idx="${i}">
      <strong>第 ${q.n} 題</strong>
      <span style="color:var(--red);">你選 ${pick}</span>

    </div>`);
  }
  const unansweredRows = [];
  for (let i = 0; i < qs.length; i++) {
    if (state.picks[state.paper][qs[i].n] === undefined) {
      unansweredRows.push(`<div class="wrong-row" data-idx="${i}" style="border-color:var(--yellow);"><strong>第 ${qs[i].n} 題</strong><span style="color:var(--yellow);">未作答</span></div>`);
    }
  }

  main.innerHTML = `<div class="card summary">

    <div style="color:var(--ink-soft);font-size:14px;">已作答 ${done} 題　·　答對 ${s} 題　·　答錯 ${done - s} 題　·　未作答 ${total - done} 題</div>
    <div style="margin-top:18px;">
      <h3 style="margin:0 0 6px;">錯題清單（${wrongRows.length}）</h3>
      <div class="wrong-list">${wrongRows.join("") || '<div style="color:var(--ink-soft);">沒有錯題，太強了！</div>'}</div>
    </div>
    ${unansweredRows.length>0?`<div style="margin-top:14px;">
      <h3 style="margin:0 0 6px;">未作答（${unansweredRows.length}）</h3>
      <div class="wrong-list">${unansweredRows.join("")}</div>
    </div>`:""}
    ${(()=>{ const rows=[]; for (let i=0;i<qs.length;i++){ const q=qs[i]; if (!isMarked(state.paper,q.n)) continue; const pick=state.picks[state.paper][q.n]; const stemShort = q.stem.length>50?q.stem.slice(0,50)+'…':q.stem; const tag = pick===undefined?'未作答':(q.answer==='#'?'一律給分':(pick===q.answer?'答對':'答錯')); const tagColor = pick===undefined?'var(--ink-soft)':(q.answer==='#'?'var(--yellow)':(pick===q.answer?'var(--green)':'var(--red)')); rows.push(`<div class="wrong-row mk" data-idx="${i}"><strong>★ 第 ${q.n} 題</strong><span style="color:${tagColor};">${tag}</span><span style="color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(stemShort)}</span></div>`); } return rows.length>0 ? `<div style="margin-top:14px;"><h3 style="margin:0 0 6px;">🔖 已標記題目（${rows.length}）</h3><div class="wrong-list">${rows.join('')}</div><button class="btn ghost" id="clearMarksBtn" style="margin-top:8px;font-size:13px;">清除本卷所有標記</button></div>` : ''; })()}
    <div class="nav" style="margin-top:18px;">
      <button class="btn ghost" id="backBtn">← 回到題目</button>
      <button class="btn danger" id="resetBtn2">重置本卷</button>
    </div>
  </div>`;
  main.querySelectorAll(".wrong-row").forEach(el => {
    el.onclick = () => {
      state.idx[state.paper] = parseInt(el.getAttribute("data-idx"));
      state.viewSummary = false; render();
    };
  });
  document.getElementById("backBtn").onclick = () => { state.viewSummary = false; render(); };
  const cmb = document.getElementById("clearMarksBtn");
  if (cmb) cmb.onclick = () => { if (confirm("確定要清除「" + DATA[state.paper].label + "」這一卷的所有標記嗎？")) { clearAllMarks(state.paper); render(); } };
  document.getElementById("resetBtn2").onclick = () => { resetCurrent(); };
}

function render() {
  renderGrid();
  if (state.viewSummary) renderSummary();
  else renderQuestion();
}

function resetCurrent() {
  if (!confirm(`確定要清除「${DATA[state.paper].label}」這一卷的所有作答與標記嗎？`)) return;
  state.picks[state.paper] = {};
  state.marks[state.paper] = {};
  state.idx[state.paper] = 0;
  state.viewSummary = false;
  savePicks();
  saveMarks();
  render();
}

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");

    state.viewSummary = false;

  };
});
$("#resetBtn").onclick = resetCurrent;
$("#summaryBtn").onclick = () => { state.viewSummary = true; render(); };


// ===== Answer persistence (per-paper picks, saved to localStorage) =====
const PICKS_STORAGE_KEY = "nephron_110_intro_picks_v1";
const QUIZ_ID = "intro_110";  // unique id used when broadcasting summary

function loadPicks() {
  try {
    const s = localStorage.getItem(PICKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function savePicks() {
  try { localStorage.setItem(PICKS_STORAGE_KEY, JSON.stringify(state.picks)); } catch (e) {}
  broadcastProgress();
}

// Send a summary of progress to parent window if embedded in an iframe.
// Used by the dashboard (index.html) to show progress bars.
function broadcastProgress() {
  if (typeof window === "undefined") return;
  let target = null;
  try { if (window.parent && window.parent !== window) target = window.parent; } catch(e){}
  if (!target) return;
  try {
    const summary = { type: "quizSummary", quizId: QUIZ_ID, papers: {} };
    for (const tag of ["Q1","Q2"]) {
      const qs = DATA[tag].questions;
      const picks = state.picks[tag] || {};
      const marks = state.marks ? (state.marks[tag] || {}) : {};
      let answered = 0, correct = 0;
      for (const n in picks) {
        answered++;
        if (isCorrect(tag, parseInt(n), picks[n])) correct++;
      }
      summary.papers[tag] = {
        label: DATA[tag].label,
        total: qs.length,
        answered, correct,
        marked: Object.keys(marks).length,
      };
    }
    target.postMessage(summary, "*");
  } catch (e) {}
}

// Hydrate persisted picks now that PICKS_STORAGE_KEY and loadPicks are defined
state.picks = loadPicks();

// ===== Bookmarks (per-paper question marks, persisted to localStorage) =====
const MARKS_STORAGE_KEY = "nephron_110_intro_marks_v1";
function loadMarks() {
  try {
    const s = localStorage.getItem(MARKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function saveMarks() {
  try { localStorage.setItem(MARKS_STORAGE_KEY, JSON.stringify(state.marks)); } catch (e) {}
  broadcastProgress();
}
function toggleMark(paper, n) {
  if (state.marks[paper][n]) delete state.marks[paper][n];
  else state.marks[paper][n] = true;
  saveMarks();
}
function isMarked(paper, n) { return !!state.marks[paper][n]; }
function clearAllMarks(paper) {
  state.marks[paper] = {};
  saveMarks();
}
function markedCount(paper) { return Object.keys(state.marks[paper]).length; }
state.marks = loadMarks();

// ===== Export / Download report =====
function _esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function _stamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function _nowStr() { return new Date().toLocaleString("zh-TW", {hour12: false}); }

function _filterQs(paper, filter) {
  const qs = DATA[paper].questions;
  const picks = state.picks[paper];
  if (filter === "all") return qs.slice();
  if (filter === "answered") return qs.filter(q => picks[q.n] !== undefined);
  if (filter === "unanswered") return qs.filter(q => picks[q.n] === undefined);
  if (filter === "wrong") {
    return qs.filter(q => {
      const p = picks[q.n];
      return p !== undefined && q.answer !== "#" && q.answer.indexOf(p) < 0;
    });
  }
  if (filter === "marked") return qs.filter(q => isMarked(paper, q.n));
  return qs.slice();
}

function _filterCounts(paper) {
  return {
    all: _filterQs(paper, "all").length,
    answered: _filterQs(paper, "answered").length,
    wrong: _filterQs(paper, "wrong").length,
    unanswered: _filterQs(paper, "unanswered").length,
    marked: _filterQs(paper, "marked").length,
  };
}

function buildExportHTML(paper, filter) {
  const allQs = DATA[paper].questions;
  const picks = state.picks[paper];
  const qs = _filterQs(paper, filter);
  const total = allQs.length;
  const answered = Object.keys(picks).length;
  const correctCount = Object.entries(picks).filter(([n, p]) => isCorrect(paper, parseInt(n), p)).length;
  const pct = total > 0 ? ((correctCount / total) * 100).toFixed(1) : "0.0";
  const filterLabel = {all:"全部題目", wrong:"僅錯題", answered:"僅已作答", unanswered:"僅未作答", marked:"僅已標記"}[filter];
  const paperLabel = DATA[paper].label + (paper === "Q1" ? "（114020）" : "（114090）");

  const subjectTitle = "物理治療學概論 · 民國 110 年 · " + paperLabel;
  const fileTitle = `概論_110_${paperLabel.replace(/[（）]/g, "")}_${filterLabel}_${_stamp()}`;

  let body = "";
  for (const q of qs) {
    const pick = picks[q.n];
    const correct = q.answer;
    const errata = (correct === "#");
    const answeredFlag = pick !== undefined;
    let statusLabel, statusCls;
    const multiHere = (!errata && correct && correct.length > 1);
    if (errata) { statusLabel = "一律給分"; statusCls = "errata"; }
    else if (!answeredFlag) { statusLabel = "未作答"; statusCls = "unanswered"; }
    else if (multiHere) {
      const ok = correct.indexOf(pick) >= 0;
      statusLabel = ok ? "✓ 多解·入正解" : "✗ 多解·未入正解";
      statusCls = ok ? "correct" : "wrong";
    }
    else if (pick === correct) { statusLabel = "✓ 答對"; statusCls = "correct"; }
    else { statusLabel = "✗ 答錯"; statusCls = "wrong"; }

    let imgsHTML = "";
    for (const u of q.images) {
      imgsHTML += `<img class="qimg" src="${u}" alt="題目附圖">`;
    }

    let optsHTML = "";
    const multi = (!errata && correct && correct.length > 1);
    for (const k of ["A","B","C","D"]) {
      const isPick = (k === pick);
      const isCorr = (!errata && correct && correct.indexOf(k) >= 0);
      let cls = "opt";
      let tag = "";
      if (isPick && isCorr) { cls += " correct user-pick"; tag = "（你的選擇 ✓）"; }
      else if (isPick && !isCorr && !errata) { cls += " wrong user-pick"; tag = "（你的選擇 ✗）"; }
      else if (isCorr) { cls += " correct"; tag = (multi ? "（正解之一）" : "（正解）"); }
      else if (isPick && errata) { cls += " errata user-pick"; tag = "（你的選擇）"; }
      optsHTML += `<li class="${cls}"><b>${k}.</b> ${_esc(q.options[k] || "")}<span class="opt-tag">${tag}</span></li>`;
    }

    let verdictHTML = "";
    if (errata) {
      verdictHTML = `<div class="verdict errata"><b>本題經考選部公告「一律給分」</b>${answeredFlag ? `（你選了 ${pick}）` : ""}</div>`;
    } else if (multi) {
      const letters = correct.split("").join(" 或 ");
      const ok = answeredFlag && correct.indexOf(pick) >= 0;
      verdictHTML = `<div class="verdict errata"><b>本題經考選部公告「答 ${letters} 均給分」</b>${answeredFlag ? ` · 你選 <b>${pick}</b>${ok ? " ✓" : " ✗"}` : " · 未作答"}</div>`;
    } else if (!answeredFlag) {
      verdictHTML = `<div class="verdict unanswered"><b>未作答</b> · 正解：<b>${correct}</b></div>`;
    } else {
      const ok = pick === correct;
      verdictHTML = `<div class="verdict ${ok ? "correct" : "wrong"}"><b>${ok ? "✓ 答對" : "✗ 答錯"}</b> · 你的選擇：<b>${pick}</b> · 正解：<b>${correct}</b></div>`;
    }

    const explHTML = q.explanation ? `<div class="expl"><b>詳解 ▸</b> ${_esc(q.explanation)}</div>` : "";

    const markedBadge = isMarked(paper, q.n) ? ` <span class="qstatus marked">🔖 已標記</span>` : "";
    body += `<article class="q ${statusCls}">
  <div class="qhead">
    <h2>第 ${q.n} 題</h2>
    <span class="qstatus ${statusCls}">${statusLabel}</span>${markedBadge}
  </div>
  <div class="stem">${_esc(q.stem)}</div>
  ${imgsHTML}
  <ol class="opts">${optsHTML}</ol>
  ${verdictHTML}
  ${explHTML}
</article>`;
  }

  const css = `

function downloadExport(filter) {
  const { html, fileTitle } = buildExportHTML(state.paper, filter);
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fileTitle + ".html";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
}

function showExportModal() {
  const modal = document.getElementById("exportModal");
  // Update counts based on current paper state
  const c = _filterCounts(state.paper);
  document.getElementById("cntAll").textContent = `(${c.all} 題)`;
  document.getElementById("cntAnswered").textContent = `(${c.answered} 題)`;
  document.getElementById("cntWrong").textContent = `(${c.wrong} 題)`;
  document.getElementById("cntUnans").textContent = `(${c.unanswered} 題)`;
  document.getElementById("cntMarked").textContent = `(${c.marked} 題)`;
  document.getElementById("exportSub").textContent =
    "本卷：" + DATA[state.paper].label + (state.paper === "Q1" ? "（114020）" : "（114090）");
  // Disable empty options
  document.querySelectorAll("#exportOpts .exp-opt").forEach(b => {
    const f = b.getAttribute("data-filter");
    b.disabled = (c[f] === 0);
  });
  modal.classList.add("show");
}
function hideExportModal() {
  document.getElementById("exportModal").classList.remove("show");
}

document.getElementById("exportBtn").onclick = showExportModal;
document.getElementById("closeExportBtn").onclick = hideExportModal;
document.getElementById("exportModal").addEventListener("click", e => {
  if (e.target.id === "exportModal") hideExportModal();
});
document.querySelectorAll("#exportOpts .exp-opt").forEach(btn => {
  btn.onclick = () => {
    const filter = btn.getAttribute("data-filter");
    if (btn.disabled) return;
    downloadExport(filter);
    hideExportModal();
  };
});

render();
// Broadcast initial state to parent (dashboard) if loaded as iframe
broadcastProgress();
</script>
</body>
</html>
