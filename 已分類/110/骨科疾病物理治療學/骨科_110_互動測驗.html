<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骨科疾病物理治療學 — 114 年互動測驗</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --ink: #1f2933;
    --ink-soft: #52606d;
    --line: #e4e7eb;
    --primary: #1d6f9b;
    --primary-soft: #e6f1f7;
    --green: #2f9e44;
    --green-soft: #d3f9d8;
    --red: #c92a2a;
    --red-soft: #ffe3e3;
    --yellow: #d9a700;
    --yellow-soft: #fff4c2;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei",
                 "Noto Sans TC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
    font-size: 16px;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 14px 22px;
    position: sticky; top: 0; z-index: 10;
  }
  .h-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    background: #f1f3f5; border: 1px solid var(--line); color: var(--ink-soft);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .progress { color: var(--ink-soft); font-size: 14px; margin-left: auto; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 22px; max-width: 1400px; margin: 18px auto; padding: 0 22px; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; padding: 0 14px; } .sidebar { order: 2; position: static; } }
  .sidebar {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; height: fit-content; position: sticky; top: 78px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
  }
  .gbtn {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
    color: var(--ink-soft); font-size: 13px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .gbtn:hover { border-color: var(--primary); }
  .gbtn.cur { background: var(--primary); color: #fff; border-color: var(--primary); }
  .gbtn.right { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .gbtn.wrong { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .legend { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 4px; border: 1px solid var(--line); }
  .dot.r { background: var(--green-soft); border-color: var(--green); }
  .dot.w { background: var(--red-soft); border-color: var(--red); }
  .main { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .qhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .qnum { font-size: 22px; font-weight: 700; color: var(--primary); }
  .qmeta { color: var(--ink-soft); font-size: 13px; }
  .stem { font-size: 16px; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
  .qimg { display: block; max-width: 100%; max-height: 480px; margin: 8px 0; border: 1px solid var(--line); border-radius: 6px; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    transition: background .12s, border-color .12s;
    text-align: left;
    font-size: 15.5px;
    color: var(--ink);
  }
  .opt:hover:not(.locked) { background: var(--primary-soft); border-color: var(--primary); }
  .opt.locked { cursor: default; }
  .opt .label { font-weight: 700; min-width: 22px; }
  .opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .opt.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .verdict { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 14px; line-height: 1.7; }
  .verdict.right { background: var(--green-soft); color: #186b29; }
  .verdict.wrong { background: var(--red-soft); color: #861818; }
  .verdict.note { background: var(--yellow-soft); color: #6b4e00; }
  .verdict h3 { margin: 0 0 6px; font-size: 14px; }
  .nav { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    background: var(--primary); color: #fff; border: 0; padding: 9px 18px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: #fff; color: var(--red); border: 1px solid var(--red); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .summary { padding: 18px; }
  .summary h2 { margin: 0 0 8px; }
  .score { font-size: 32px; font-weight: 700; color: var(--primary); }
  .wrong-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .wrong-row { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .wrong-row:hover { background: var(--primary-soft); }
  .footer { color: var(--ink-soft); font-size: 12px; text-align: center; margin: 16px 0 30px; }

  .homelink { color: var(--soft); text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .homelink:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }


  /* Export modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,30,.45); display: none; align-items: center; justify-content: center; z-index: 100; padding: 18px; }
  .modal-bg.show { display: flex; }
  .modal-card { background: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.18); max-width: 460px; width: 100%; padding: 22px; }
  .modal-card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 700; }
  .modal-card .modal-sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; }
  .modal-card .opt-row { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
  .modal-card .exp-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; background: #f8f9fa; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left; color: var(--ink); }
  .modal-card .exp-opt:hover { background: var(--primary-soft); border-color: var(--primary); }
  .modal-card .exp-opt:disabled { opacity: 0.5; cursor: not-allowed; background: #f1f3f5; }
  .modal-card .exp-opt .count { color: var(--ink-soft); font-size: 12px; }
  .modal-card .hint { color: var(--ink-soft); font-size: 12px; line-height: 1.6; margin: 0 0 12px; }
  .modal-card .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }


  /* Bookmark / marker */
  .gbtn { position: relative; }
  .gbtn.marked::after {
    content: "★"; position: absolute; top: 1px; right: 3px;
    font-size: 10px; color: var(--yellow); line-height: 1;
    text-shadow: 0 0 2px #fff;
  }
  .markbtn {
    margin-left: auto; background: #fff; border: 1px solid var(--line);
    color: var(--ink-soft); padding: 6px 13px; border-radius: 999px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .markbtn:hover { border-color: var(--yellow); color: var(--yellow); }
  .markbtn.marked { background: var(--yellow-soft); color: #6b4e00; border-color: var(--yellow); font-weight: 600; }
  .qhead { flex-wrap: wrap; }
  .marked-badge { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--yellow-soft); color: #6b4e00; font-size: 11px; border: 1px solid var(--yellow); margin-left: 4px; }
  .wrong-row.mk { border-color: var(--yellow); }

</style>
</head>
<body>
<header>
  <div class="h-row">
    <a class="homelink" href="../../../index.html" title="回到測驗首頁">← 回首頁</a>
    <h1>骨科疾病物理治療學 · 民國 110 年</h1>
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="Q1">第一次 (114020)</button>
      <button class="tab" data-tab="Q2">第二次 (114090)</button>
    </div>
    <div class="progress" id="progress"></div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div style="font-size:13px;color:var(--ink-soft);margin-bottom:6px;">題號（共 80 題）</div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="dot r"></i>答對</span>
      <span><i class="dot w"></i>答錯</span>
      <span style="color:var(--yellow);">★ 已標記</span>
    </div>
    <button id="resetBtn" class="btn danger" style="margin-top:12px;width:100%;font-size:13px;">重置本卷作答</button>
    <button id="summaryBtn" class="btn ghost" style="margin-top:6px;width:100%;font-size:13px;">查看本卷總結</button>
    <button id="exportBtn" class="btn ghost" style="margin-top:6px;width:100%;font-size:13px;">📤 匯出結果…</button>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="footer">資料來源：考選部 110 年第一次／第二次專技高等考試 · 物理治療師 · 骨科疾病物理治療學</div>

<div class="modal-bg" id="exportModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h3>匯出測驗結果</h3>
    <div class="modal-sub" id="exportSub">本卷：第一次 (114020)</div>
    <div class="opt-row" id="exportOpts">
      <button class="exp-opt" data-filter="all">📄 全部題目（含詳解） <span class="count" id="cntAll"></span></button>
      <button class="exp-opt" data-filter="answered">📝 僅已作答 <span class="count" id="cntAnswered"></span></button>
      <button class="exp-opt" data-filter="wrong">❌ 僅錯題 <span class="count" id="cntWrong"></span></button>
      <button class="exp-opt" data-filter="unanswered">⏳ 僅未作答 <span class="count" id="cntUnans"></span></button>
      <button class="exp-opt" data-filter="marked">🔖 僅已標記 <span class="count" id="cntMarked"></span></button>
    </div>
    <p class="hint">將下載一份自包含的 .html 檔，可離線檢視。打開後可用瀏覽器「列印」（Ctrl/⌘+P）→「另存為 PDF」存成 PDF。</p>
    <div class="modal-actions">
      <button class="btn ghost" id="closeExportBtn">取消</button>
    </div>
  </div>
</div>

<script>
const DATA = {"Q1": {"label": "第一次", "questions": [{"n": 1, "stem": "針對澳洲物理治療師Maitland所提之被動關節鬆動術，下列何敘述最不符合其理論？", "options": {"A": "關節鬆動術治療應依據病患症狀而非醫學診斷", "B": "橫向脊椎施壓主要是用來評估頸椎單側的小面關節活動度", "C": "此被動關節鬆動術的評估手法與治療手法相似", "D": "此手法主要是了解脊椎各節關節動作如何影響疼痛"}, "images": [], "answer": "B", "explanation": "Maitland橫向脊椎施壓主要評估椎節整體活動度（不限單側小面關節）。其他三項描述符合Maitland理念。"}, {"n": 2, "stem": "教導病人避免牙關緊閉（clenching）和夜間磨牙的第一線方法為：", "options": {"A": "保持舌頭置於上排牙齒後方上硬顎處", "B": "保持嘴唇分開、上下排牙齒碰觸", "C": "保持顱骨向後旋轉位置", "D": "保持舌頭置於上下排牙齒中間後側"}, "images": [], "answer": "A", "explanation": "教導避免牙關緊閉與磨牙的第一線動作為「舌頂上齶」（舌頭置於上排牙齒後上硬顎處），保持下頜放鬆與上下齒分離。"}, {"n": 3, "stem": "一位有頸部關節退化合併神經根病變患者，抱怨晚上睡覺時，會因為頸部與右側手臂疼痛而痛醒，下列那種睡\n姿較適合？", "options": {"A": "趴睡", "B": "採左側睡", "C": "平躺頭轉右邊", "D": "不要睡枕頭"}, "images": [], "answer": "B", "explanation": "頸椎神經根病變者夜間痛右肩臂→側睡左側（將疼痛側朝上）並使用合適枕頭支撐，可降低神經根壓迫。"}, {"n": 4, "stem": "長期前位頭部（forward head）姿勢合併有圓肩（round shoulder）姿勢者，下列那些肌肉會處於過度活動\n（overactivation）的緊繃狀態？①枕骨下肌（suboccipital） ②胸鎖乳突肌（sternocleidomastoid） ③提肩胛\n肌（levator scapulae） ④中斜方肌（middle trapezius）", "options": {"A": "僅①②", "B": "僅③④", "C": "①②③④", "D": "僅①②③"}, "images": [], "answer": "D", "explanation": "前位頭部+圓肩姿勢通常有：枕骨下肌、SCM、提肩胛肌、上斜方肌、胸大小肌過度活動。中斜方肌與下斜方肌反而是無力（被拉長）。①②③為過度活化。"}, {"n": 5, "stem": "一位30歲女性上班族，工作需要一直低頭，主訴多年以來斷斷續續有肩頸疼痛，頸部關節活動度正常，且頸椎\n與胸椎被動椎間活動度（segmental mobility）皆正常，沒有神經症狀，對於這位慢性頸痛的上班族，下列建議\n何者最有長期效果？", "options": {"A": "規律訓練上半身的肌力與肌耐力", "B": "上班中找時間多做牽張運動以改善肌肉疼痛", "C": "需要時用頸圈，讓頸椎肌肉休息", "D": "定期做熱敷及按摩以舒緩肌肉僵硬"}, "images": [], "answer": "A", "explanation": "慢性頸痛長期效果最佳：規律訓練上半身肌力與耐力（特別是深層頸屈肌與肩胛穩定肌）。被動處置效果短期；頸圈使用反而導致肌肉萎縮。"}, {"n": 6, "stem": "在訓練頸部深層屈肌（deep neck flexor）時，會讓病人做頭頸屈曲運動，在下列姿勢下訓練，難易程度由簡單\n到困難的排列順序為何？①平躺 ②平躺，維持頭微離床 ③站著頭貼牆 ④斜躺30度", "options": {"A": "①②③④", "B": "④③②①", "C": "③④①②", "D": "①④③②"}, "images": [], "answer": "C", "explanation": "顱頸屈肌訓練從重力解除→重力協助→抗重力→站姿姿勢控制。簡單到困難：③站姿頭貼牆→④斜躺30°→①平躺→②平躺維持頭微離床。"}, {"n": 7, "stem": "張嘴初期，下頜骨即偏向右側，通常是因為：", "options": {"A": "右側顳頜關節囊太緊", "B": "左側顳頜關節囊太緊", "C": "右側咬肌（masseter）太緊", "D": "左側咬肌（masseter）太緊"}, "images": [], "answer": "C", "explanation": "張嘴初期下頜偏右→右側顳頜關節翼狀肌或下頜髁活動受限或右側咬肌太緊（拉動下頜偏右）。"}, {"n": 8, "stem": "關於上頸椎韌帶穩定性測試，下列何者正確？", "options": {"A": "當將受測者的頭向左側彎時，第二頸椎會向左旋轉，是測試頂韌帶（apical ligament）完整性", "B": "當將受測者的頭向左側彎時，第二頸椎的棘突會偏向左邊，是測試頂韌帶（apical ligament）完整性", "C": "夏普－波瑟測試（Sharp-Purser test）是測試翼韌帶（alar ligament）完整性", "D": "當受測者低頭有任何不適的神經學症狀，可用夏普－波瑟測試（Sharp-Purser test），使症狀消失"}, "images": [], "answer": "D", "explanation": "夏普-波瑟測試（Sharp-Purser test）測試橫韌帶（transverse ligament）完整性：受測者頭前彎，治療師將頭向後推，若症狀消失即為陽性，代表上頸椎不穩。題目D描述符合（症狀消失）。"}, {"n": 9, "stem": "患者描述頸椎疼痛僵硬、雙腳有麻感、走路經常會蹣跚絆倒且深腱反射異常增加，此現象最可能為下列何種病\n變？", "options": {"A": "頸髓病變（cervical myelopathy）", "B": "頸椎神經根病變（radiculopathy）", "C": "頸椎神經孔狹窄", "D": "周邊神經受傷"}, "images": [], "answer": "A", "explanation": "頸髓病變（cervical myelopathy）：頸椎退化壓迫脊髓，出現上運動神經元徵象（深腱反射增加、Babinski、步態不穩、雙腳麻、手協調差）。"}, {"n": 10, "stem": "若顳頜關節發生張嘴活動度受限（closed lock）時，下列敘述何者正確？", "options": {"A": "可能是因為關節盤向前脫位（anterior dislocation），且無法復位", "B": "張嘴時，下頜骨（mandible）會偏移至健側", "C": "關節側向（lateral movement）到患側的動作程度會降低", "D": "從張嘴到閉嘴的過程中，可能聽到四聲喀啦聲（click）"}, "images": [], "answer": "A", "explanation": "顳頜關節closed lock（張嘴受限）：關節盤前移無法復位，下頜髁無法跨過盤後緣。張嘴時下頜偏向「患側」（不是健側）；側向到健側受限；無喀啦聲（盤已卡住）。"}, {"n": 11, "stem": "有關椎間盤突出的敘述，下列何者正確？①最常發生的方向為直接向後方或向後外方突出 ②若為向前突出\n時，會有背痛及神經根徵象 ③若為直接向後突出，發生在腰椎比在胸椎對脊髓產生更嚴重的壓迫 ④腰椎\n最常發生在L4、L5之間或L5、S1之間，胸椎最常發生在T11、T12之間", "options": {"A": "①④", "B": "②③", "C": "①③", "D": "②④"}, "images": [], "answer": "A", "explanation": "椎間盤突出：①最常向後外側突出（後縱韌帶較弱）；④腰椎L4-L5、L5-S1最常見、胸椎T11-T12最常見。②向前突出無背痛或神經症狀（不會壓迫神經根）；③胸椎椎管狹窄壓迫脊髓更嚴重（不是腰椎）。"}, {"n": 12, "stem": "55歲公車司機，每天開車至少8小時。最近一個月常感到下背疼痛，上週開始疼痛漫延至右側臀部，持續漫延\n至右大腿後面。經檢查後發現：背部呈現平背姿勢，站姿下做重複前彎動作，會使疼痛惡化且漫延至小腿；\n站姿下做後仰動作，會使疼痛向背部集中。此患者是屬於McKenzie分類的那一類問題？", "options": {"A": "姿勢症候群（postural syndrome）", "B": "失能症候群（dysfunction syndrome）", "C": "排列異常症候群（derangement syndrome）", "D": "退化症候群（degenerative syndrome）"}, "images": [], "answer": "C", "explanation": "重複前彎症狀加劇且周邊化、後仰症狀中央化→McKenzie排列異常症候群（derangement syndrome），椎間盤後方突出影響神經根。"}, {"n": 13, "stem": "有關僵直性脊椎炎的敘述，下列何者正確？①好發於青少年到20多歲的年輕人 ②涉及椎間盤及小面關節的\n鈣化 ③背部僵硬感覺常持續至少30分鐘，背痛會因活動而減輕、伴隨臀部疼痛 ④應教導患者以俯臥姿勢\n睡覺、坐姿時需支撐下背的弧度 ⑤可針對活動度下降的關節給予Grade III和IV的鬆動術 ⑥維持肩伸直及\n髖屈曲的活動度有助於維持胸腰椎的伸直", "options": {"A": "①③④", "B": "②⑤⑥", "C": "①④⑥", "D": "①②⑤"}, "images": [], "answer": "A", "explanation": "AS：①好發於青少年到20多歲；③晨僵超過30分鐘、活動後緩解、伴隨臀痛；④應俯臥睡姿伸直脊椎、坐姿支撐下背。⑤AS活動度受限應用較輕級數鬆動術（不是III/IV）；⑥肩屈伸與髖伸（不是屈）有助於胸腰椎伸直。①③④。"}, {"n": 14, "stem": "胸腰筋膜、豎脊肌、大腿後肌群是屬於穩定腰椎、骨盆帶及髖關節的那一系統？", "options": {"A": "前斜向系統（anterior oblique system）", "B": "後表淺斜向系統（superficial posterior oblique system）", "C": "深縱系統（deep longitudinal system）", "D": "外側系統（lateral system）"}, "images": [], "answer": "C", "explanation": "深縱系統（deep longitudinal system）：胸腰筋膜+豎脊肌+大腿後肌（biceps femoris）+薦結節韌帶，提供脊柱與骨盆髖關節縱向穩定。"}, {"n": 15, "stem": "一位45歲的男性病患，出現急性之單側背部及腿部疼痛，坐姿及彎腰時疼痛會加劇，直膝抬腿檢查為陽性反\n應，下列那一診斷較符合以上之症狀敘述？", "options": {"A": "腰背部肌肉拉傷", "B": "腰椎小面關節炎", "C": "腰椎脊椎狹窄", "D": "腰椎椎間盤突出"}, "images": [], "answer": "D", "explanation": "急性單側下背+腿痛+坐姿與彎腰加劇+SLR陽性→典型腰椎椎間盤突出壓迫神經根。"}, {"n": 16, "stem": "下列何者為單側薦骨前旋失能（unilateral anterior sacral nutation dysfunction）的可能受傷機制？", "options": {"A": "跳躍時，在腰椎屈曲的時候，單腳著地", "B": "跳躍時，在腰椎伸直的時候，單腳著地", "C": "跳躍時，在腰椎屈曲的時候，雙腳著地", "D": "跳躍時，在腰椎伸直的時候，雙腳著地"}, "images": [], "answer": "B", "explanation": "單側薦骨前旋失能（unilateral anterior nutation dysfunction）：常因跳躍時腰椎伸直位+單腳著地，髂骨向前旋轉而薦骨亦相對向前。"}, {"n": 17, "stem": "一位70歲男性木工，從年輕時即出現下背痛，近年來疼痛加劇，有時出現腿部疼痛，腰部活動度下降。X光\n片上出現L5-S1第一級脊椎滑脫，下列那些檢查結果有助於確認其症狀與脊椎滑脫相關？①L5-S1椎間活動度\n明顯增加 ②軀幹後仰時症狀更明顯 ③腹橫肌收縮時症狀減少 ④X光片同時出現明顯骨刺", "options": {"A": "①②③", "B": "僅①②", "C": "僅②③", "D": "②③④"}, "images": [], "answer": "A", "explanation": "L5-S1 spondylolisthesis（脊椎滑脫）：①滑脫椎節活動度增加（過動）；②後仰加劇（脊椎滑脫椎節後仰會增加滑動）；③核心（腹橫肌）收縮提供穩定可減輕症狀。④骨刺非滑脫直接證據。"}, {"n": 18, "stem": "下列針對神經性跛行（neurogenic claudication）的敘述，何者錯誤？", "options": {"A": "椎管狹窄（spinal canal stenosis）及神經根管狹窄（nerve root canal stenosis）都有可能造成此症狀", "B": "藉由站立休息即可快速紓解疼痛症狀", "C": "神經性跛行常會伴隨暫時性動作失調的症狀", "D": "通常於站立或走路時會明顯加劇"}, "images": [], "answer": "B", "explanation": "神經性跛行（neurogenic claudication）需「坐下或前彎」（脊椎屈曲）才能緩解（屈曲打開椎間孔）；單純站立休息無法快速緩解。"}, {"n": 19, "stem": "以髂前上棘（ASIS）和坐骨粗隆（ischial tuberosity）連線、髂後上棘（PSIS）和大轉子連線交會處可以觸診\n下列那條肌肉？", "options": {"A": "臀大肌（gluteus maximus）", "B": "臀小肌（gluteus minimus）", "C": "股方肌（quadratus femoris）", "D": "梨狀肌（piriformis）"}, "images": [], "answer": "D", "explanation": "梨狀肌位於髂後上棘（PSIS）-大轉子連線+ASIS-坐骨粗隆連線交會處，是觸診定位的標準解剖標記。"}, {"n": 20, "stem": "下列有關下背痛患者症狀與處理之敘述，何者錯誤？", "options": {"A": "脊椎退化（spondylosis）或脊椎狹窄症（spinal stenosis）引發之背痛症狀在脊椎屈曲時會緩解", "B": "利用姿勢擺位牽引，應以「側彎向疼痛對側，轉向疼痛同側」為原則，讓椎間孔空間變大，降低神經壓迫", "C": "呈現下交叉症候群的背痛患者通常會有髖屈肌太緊、腹肌無力的問題", "D": "類風濕性關節炎患者可能因脊椎伸直與側彎的動作，造成小面關節夾擠，應利用關節矯正手法 （manipulation）增加關節活動度"}, "images": [], "answer": "D", "explanation": "RA患者頸椎C1-C2不穩，禁止使用manipulation（高速低幅度推扳），會造成嚴重脊髓損傷。題敘D錯誤。"}, {"n": 21, "stem": "對於胸腰椎的運動介入，使用交替等長收縮（alternating isometrics）及節律性穩定（rhythmic stabilization）手\n法，其交替阻力之方向進展，下列何者較適合？", "options": {"A": "矢狀面→冠狀面→橫斷面", "B": "冠狀面→矢狀面→橫斷面", "C": "橫斷面→矢狀面→冠狀面", "D": "矢狀面→橫斷面→冠狀面"}, "images": [], "answer": "A", "explanation": "胸腰椎穩定訓練阻力進展：先矢狀面（前後）→冠狀面（側）→橫斷面（旋轉），由穩定到具挑戰性的方向漸進。"}, {"n": 22, "stem": "有關腰椎神經根對應之皮節區（dermatome）的敘述，下列何者正確？", "options": {"A": "第2腰椎神經根對應至大腿前側下1/3及膝前側", "B": "第3腰椎神經根對應至大腿後側上1/3", "C": "第4腰椎神經根對應至小腿內下側及大腳趾", "D": "第5腰椎神經根對應至臀部前外側"}, "images": [], "answer": "C", "explanation": "L4皮節：小腿內側下段+大腳趾。L2：大腿前側中上段；L3：大腿前側下1/3+膝；L5：小腿外側+足背+腳趾外側。"}, {"n": 23, "stem": "對於脊椎骨質疏鬆（osteoporosis）的病人，較不建議從事下列何種運動？", "options": {"A": "腹部肌肉的等長收縮（isometric contraction）運動", "B": "背部肌肉的等長收縮（isometric contraction）運動", "C": "腹部肌肉的等張收縮（isotonic contraction）運動", "D": "背部肌肉的等張收縮（isotonic contraction）運動"}, "images": [], "answer": "C", "explanation": "骨質疏鬆患者應避免脊椎屈曲動作（壓迫前柱骨折風險），等張腹肌運動（如仰臥起坐）會造成脊椎屈曲，故不建議。"}, {"n": 24, "stem": "關於脊柱側彎（scoliosis）之敘述，下列何者正確？", "options": {"A": "長短腳（leg length discrepancy）是常見造成結構性側彎之可能原因", "B": "在X光片上觀察椎根（pedicles）之對稱性，亦可測量脊柱側彎角度", "C": "楔形椎骨（wedged vertebra）是造成結構性脊柱側彎的原因之一", "D": "在X光片上量測Cobb's角度，可評估椎體旋轉角度"}, "images": [], "answer": "C", "explanation": "結構性脊柱側彎可由楔形椎骨、半椎骨等先天結構異常造成。長短腳屬功能性側彎；椎根對稱性與旋轉相關但不直接量側彎角度；Cobb's量側彎角度（不是旋轉）。"}, {"n": 25, "stem": "跪坐（heel-sitting）時，手往前伸超過頭，主動軀幹側彎向右之牽張（stretch）運動，較適合下列那一類脊柱\n側彎患者？", "options": {"A": "左側胸椎側彎（left thoracic curve）患者", "B": "右側胸椎側彎（right thoracic curve）患者", "C": "左側腰椎側彎（left lumbar curve）患者", "D": "右側腰椎側彎（right lumbar curve）患者"}, "images": [], "answer": "B", "explanation": "右胸椎側彎（凸右）：應牽張凹側（左側）。但題目敘述「主動側彎向右」會強化右側彎曲—實際應為強化凸側、伸展凹側。題目選B供參。"}, {"n": 26, "stem": "根據Neer對原發性肩關節夾擠症候群（primary shoulder impingement syndrome）之分期，在第一時期（stage\nI）時，下列那一種症狀最不可能出現？", "options": {"A": "在肱骨大結節（greater tuberosity）附近會有壓痛點", "B": "肩外展60度到120度，會有疼痛弧（painful arc）", "C": "Neer夾擠測試（impingement test）為陽性反應", "D": "棘下肌（infraspinatus）有萎縮現象"}, "images": [], "answer": "D", "explanation": "Neer夾擠分期：Stage I（年輕<25歲）：肌腱發炎與可逆性水腫；Stage II（25-40歲）：肌腱纖維化與發炎；Stage III（>40歲）：旋轉袖撕裂、骨刺、肌肉萎縮（如棘下肌）。Stage I不會出現萎縮。"}, {"n": 27, "stem": "以關節鏡（arthroscopic）手術修復肩旋轉肌群（rotator cuff）部分撕裂（partial-thickness tear），修復後執行\n物理治療，下列何者最不適當？", "options": {"A": "術後4週為保護期，需用吊帶（sling）保護，即使運動也不能拿掉", "B": "術後12週時，應可達到完全之主動肩關節活動度", "C": "術後16週時，肩關節應能執行低強度的功能性活動", "D": "術後22週時，肩關節執行功能性活動應不會有疼痛或無力感"}, "images": [], "answer": "A", "explanation": "旋轉袖修復術後：4週內保護期需用吊帶，但「運動時可拿掉」進行控制下AROM/PROM。題敘A過於絕對。"}, {"n": 28, "stem": "根據學者Inman等人的研究結果，在肩關節外展的過程中，若鎖骨無旋轉及抬高之動作，則肩外展角度最多可\n達角度為何？", "options": {"A": "150度", "B": "120度", "C": "60度", "D": "30度"}, "images": [], "answer": "B", "explanation": "Inman研究：肩外展若無鎖骨旋轉與抬高，僅能達約120°（盂肱關節120°），其後60°需鎖骨上抬+後旋才能完成180°。"}, {"n": 29, "stem": "下列那種牽張（stretch）方式適合用於後肩關節囊太緊的個案？", "options": {"A": "", "B": "", "C": "", "D": ""}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAcAAAAFmCAIAAAB1At3XAAAACXBIWXMAAA7EAAAOxAGVKw4bAAB70klEQVR4nOy9h1dVWbr2+/0vd4w7xu1zz/ede7r7pK9P9e1Tt06d7spVXcFUlqnMuUwkySiCgKgoiAQl5wwKEgRJiuQkGck5owLzPuy3mWeyNqBuKWRv3mc4GGuvvfZac23H/q3nnfOd7/wfgsVisVgG6X+87wawWCyWsYoBymKxWAaKAcpisVgGigHKYrFYBooBymKxWAaKAcpisV 症候群（thoracic outlet syndrome）的敘述，下列何者錯誤？", "options": {"A": "症狀常出現於重複執行過肩動作的時候", "B": "常有胸小肌過緊", "C": "肩外轉或外展阻力測試時，都有疼痛與無力的情形", "D": "Roos測試可能為陽性"}, "images": [], "answer": "C", "explanation": "胸廓出口症候群（TOS）：肩外展+外轉時症狀（神經血管被卡壓），但「肩外轉/外展阻力測試疼痛無力」不是典型TOS（更像旋轉袖病變）。Roos test為典型TOS測試。"}, {"n": 32, "stem": "關於次發性冰凍肩（secondary frozen shoulder），下列敘述何者正確？", "options": {"A": "也稱為肩黏連關節囊炎（adhesive capsulitis）", "B": "常造成關節囊增厚沾黏，特別是下關節囊", "C": "常在肩外傷或合併有肩骨性關節炎後產生", "D": "糖尿病屬於內因性促成因子"}, "images": [], "answer": "AC", "explanation": "次發性冰凍肩（secondary frozen shoulder/adhesive capsulitis）：A同義名稱、C常因肩外傷或肩骨關節炎產生。下關節囊增厚（不是B所述）；糖尿病為「外因性」促成因子（不是內因）。題目AC正確（一律給分）。"}, {"n": 33, "stem": "以非開刀方式治療前肩關節不穩問題，兩週內初期的治療原則，下列何者錯誤？", "options": {"A": "需限制過多的肩外轉、外展與分離（distraction）動作", "B": "需穿戴肩吊帶（sling）以限制動作", "C": "病人小於20歲者，限制動作期間可少於兩週", "D": "病人大於30歲者，在此時期即可以開始肩胛骨肌群穩定訓練"}, "images": [], "answer": "C", "explanation": "前肩不穩前2週初期：A限制肩外轉外展分離動作；B穿戴肩吊帶；D肩胛穩定訓練可進行。但<20歲青壯年初次脫位需「至少3-6週」固定（不可少於2週），故C錯誤。"}, {"n": 34, "stem": "「患者採坐姿，手臂置於肩關節內轉與屈曲90度，治療師從患者手肘處給予一個沿肱骨軸向的力量並同時將\n其手臂水平內收」，下列敘述何者正確？", "options": {"A": "稱為金姆測試（Kim test）", "B": "目的為測試前鋸肌是否無力", "C": "陽性反應為肩峰下方會出現明顯的凹陷", "D": "若患者主訴在投擲動作的隨勢期（follow through）會出現症狀，此測試可能呈現陽性"}, "images": [], "answer": "D", "explanation": "Jerk test/Jobe relocation test：肩內轉+屈曲90°，治療師沿肱骨軸向施力+水平內收，測試後上唇損傷或SLAP；投擲random「follow-through」階段症狀即陽性。"}, {"n": 35, "stem": "棒球投手由於需反覆做出肩關節外展、外轉與水平外展的投球動作，最容易發生的肩關節不穩定方向與夾擠\n位置分別為何？", "options": {"A": "後向不穩定、肩峰下夾擠", "B": "後向不穩定、前側內夾擠", "C": "前向不穩定、後側內夾擠", "D": "前向不穩定、前側內夾擠"}, "images": [], "answer": "C", "explanation": "棒球投手肩外展+外轉+水平外展→前向不穩定+「後上盂內夾擠」（posterior internal impingement，late cocking時棘上肌與盂後上唇間夾擠）。"}, {"n": 36, "stem": "下列有關肩部之「觀察結果－可能傷害」，何者正確？", "options": {"A": "梯狀變形（step deformity）－盂肱關節向下半脫位", "B": "卜派徵象（Popeye sign）－肱肌肌腱斷裂", "C": "三角肌過度平坦（flattening）－盂肱關節向前脫位", "D": "肩胛翼狀聳出（scapular winging）－肩胛下肌無力"}, "images": [], "answer": "C", "explanation": "三角肌過度平坦提示肩盂下脫位/前脫位（肱骨頭離開肩盂後的形狀變化）。Step deformity為AC脫位；Popeye sign為肱二頭肌長頭斷裂；翼狀肩胛多為前鋸肌或斜方肌無力。"}, {"n": 37, "stem": "下列有關肱二頭肌之近端肌腱受傷原因之敘述，何者正確？", "options": {"A": "上臂內旋導致肱骨頭向上向前移位，使得肱二頭肌肌腱與三角肌產生摩擦而發炎", "B": "在投球過程中，肱二頭肌會隨投擲期不同的肩部動作，改變其肌腱收縮力之向量，造成肌腱位移", "C": "棘上肌撕裂傷會造成肱二頭肌的不穩定，進而容易脫出肱二頭肌溝", "D": "若合併肩上唇受傷（SLAP lesions），其受傷機轉多半與肩關節向後伸直的動作有關"}, "images": [], "answer": "B", "explanation": "投球過程中肱二頭肌肌腱會因不同肩部位置而改變收縮力向量，造成肌腱位移與磨擦，是常見的肱二頭肌肌腱炎機轉。"}, {"n": 38, "stem": "造成青少年手肘內上髁骨突炎（medial epicondylar apophysitis）的原因，下列何者正確？", "options": {"A": "重複性腕伸直，牽拉肱骨內上髁", "B": "重複性肘外翻，牽拉肱骨內上髁", "C": "肘關節小頭（capitellum）缺血性壞死", "D": "橈骨頭半脫臼"}, "images": [], "answer": "B", "explanation": "青少年內上髁骨突炎（little leaguer's elbow）：重複性肘外翻（投球時的valgus stress）牽拉肱骨內上髁的屈肌-旋前肌共同腱起點。"}, {"n": 39, "stem": "下列那個投擲動作的時期肘外翻應力達到最大？", "options": {"A": "準備投球期（windup）", "B": "舉臂早期（early cocking）", "C": "舉臂晚期（late cocking）", "D": "隨勢期（follow through）"}, "images": [], "answer": "C", "explanation": "投球late cocking phase（舉臂晚期）：肩最大外展外轉時，肘關節最大外翻應力（valgus stress），是肘內側受傷主要時期。"}, {"n": 40, "stem": "肌皮神經（musculocutaneous nerve）癱瘓之患者，可利用下列那條肌肉來彎曲手肘？", "options": {"A": "肱橈肌（brachioradialis）", "B": "肱肌（brachialis）", "C": "肱二頭肌（biceps brachii）", "D": "旋後肌（supinator）"}, "images": [], "answer": "A", "explanation": "肌皮神經（musculocutaneous）支配肱二頭、肱肌、喙肱肌（屈肘主要肌）。失能後可用肱橈肌（橈神經支配）作為代償屈肘肌。"}, {"n": 41, "stem": "關於肘關節內上髁發炎的評估，下列敘述何者錯誤？", "options": {"A": "內上髁發炎亦叫做高爾夫球肘（golfer's elbow）", "B": "主要是旋前圓肌與屈腕肌群反覆性傷害，故肌肉收縮抗阻力會增加疼痛", "C": "若伴隨手肘與前臂內側麻痺，需辨別是否為尺神經病變或是頸部病變", "D": "因肌肉失去穩定性，故肘關節外翻應力測試（valgus stress test）必為陽性"}, "images": [], "answer": "D", "explanation": "肘關節外翻應力測試陽性反映尺側副韌帶損傷，不一定與內上髁炎相關。題目D「外翻測試必為陽性」過於絕對。"}, {"n": 42, "stem": "開放式腕隧道解離手術（open carpal tunnel release）後可能產生弓弦（bowstring）現象而影響手部肌肉功能，\n下列何者最不會受到影響？", "options": {"A": "屈拇長肌（flexor pollicis longus）", "B": "屈拇短肌（flexor pollicis brevis）", "C": "屈指淺肌（flexor digitorum superficialis）", "D": "屈指深肌（flexor digitorum profundus）"}, "images": [], "answer": "B", "explanation": "腕隧道解離術後弓弦現象：腕屈時屈肌肌腱向掌側膨出。屈拇短肌（FPB）為內在手肌，不通過腕隧道，故不受影響。其他三條皆通過腕隧道。"}, {"n": 43, "stem": "關於手指伸直延遲（extensor lag）之敘述，下列何者錯誤？", "options": {"A": "被動伸直受限程度較主動伸直大", "B": "可能是伸指肌與周圍組織沾黏所導致", "C": "運動治療重點在重建手指伸直的控制能力", "D": "可教導伸肌肌腱滑動運動（extensor tendon gliding exercise）"}, "images": [], "answer": "A", "explanation": "Extensor lag（伸直延遲）：主動伸直受限大於被動伸直。題敘A方向反向錯誤。其他三項描述正確。"}, {"n": 44, "stem": "有關手部屈肌肌腱斷裂的評估與處置，下列何者正確？", "options": {"A": "若受傷於掌骨頭部至橫腕韌帶（transverse carpal ligament）之區域，稱無人可及之處（no man's land），預 後最差", "B": "若受傷傷口不乾淨，則須馬上進行基本修補（primary repair），以免感染發生", "C": "幼兒因為身體修復能力較佳，所以強調早期肌力訓練，以達到最大肌腱滑動", "D": "動態副木（dynamic splint）可被用來進行主動式手指伸直動作，並藉由彈力帶拉回至手指彎曲位置"}, "images": [], "answer": "D", "explanation": "屈肌肌腱斷裂於「無人之境」（zone II，掌骨頭至橫腕韌帶區）預後最差（A正確）；不乾淨傷口應延遲修補（不是馬上）；幼兒應避免早期肌力訓練；動態副木設計可同時主動伸直+彈性回到屈曲位置。"}, {"n": 45, "stem": "柯力氏骨折（Colles' fracture）後可能出現反射交感神經失養症（reflex sympathetic dystrophy），有關此症之\n敘述，下列何者錯誤？", "options": {"A": "可能與神經直接受到撞擊有關", "B": "與受傷後長期固定造成腫脹可能有關", "C": "骨折癒合不完整為其主要併發症", "D": "可稱為肩手症狀（shoulder hand syndrome）產生"}, "images": [], "answer": "C", "explanation": "Colles' fracture後反射交感神經失養症（RSD/CRPS）：與神經受傷、長期固定、腫脹相關，可導致肩手症候群。「骨折癒合不完整」非主要併發症，故C錯誤。"}, {"n": 46, "stem": "關於Thomas test 和Kendall test兩者的比較，下列何者錯誤？", "options": {"A": "兩者均以動單側下肢，並觀察對側肢體的動作來判定結果", "B": "兩者均為利用單側髖關節的過度屈曲，引起骨盆後轉動作來評估對側肌肉", "C": "兩者均可用來測試肌肉長度", "D": "兩者均只是用來測試股直肌"}, "images": [], "answer": "D", "explanation": "Thomas test（測髂腰肌+股直肌）+ Kendall test（修正Thomas，測股直肌）：兩者皆雙下肢執行（一動一觀察），但Kendall特別測股直肌而Thomas測多種屈髖肌。題目D「兩者均只測股直肌」錯誤。"}, {"n": 47, "stem": "有關額切面（frontal plane）上股骨頸與骨幹間形成的夾角（neck-shaft angle of the femur）之敘述，下列何者\n錯誤？", "options": {"A": "此夾角於成人約為125度", "B": "此夾角在孩童期較成人期來得大", "C": "若此夾角大於135度時，稱為髖內翻（coxa vara）", "D": "若兩側夾角大小不同時，會出現結構性長短腳"}, "images": [], "answer": "C", "explanation": "股骨頸幹角（neck-shaft angle）：成人約125°，孩童期較大（150°）。>135°為髖外翻（coxa valga，不是內翻coxa vara）；<125°為髖內翻；兩側差異會結構性長短腳。"}, {"n": 48, "stem": "全髖關節置換術後患者初期的患側承重（weight-bearing）限制，下列敘述何者正確？①以微創手術進行置換\n的患者，可以立即依個案的舒適程度進行承重訓練 ②若有骨水泥（cemented）固定的手術，可立即依患者\n的舒適程度進行承重訓練 ③術後於平躺姿勢下的任何下肢阻力運動，髖關節的負荷都是會超過身體的重\n量 ④術後於平躺姿勢下的任何下肢阻力運動，髖關節的負荷都不會超過身體的重量", "options": {"A": "①②④", "B": "①②③", "C": "僅①②", "D": "僅②④"}, "images": [], "answer": "C", "explanation": "全髖置換術後初期承重：①微創與②骨水泥手術可立即依舒適度進行承重訓練；③④平躺下肢阻力運動髖關節負荷可超過或不超過體重（依特定動作而異），不能絕對描述。題目C正確（僅①②）。"}, {"n": 49, "stem": "有關接受關節鏡手術處理髖臼唇撕裂（hip acetabular labral tear）的患者，其患側術後承重的建議，下列何者\n正確？", "options": {"A": "修復（repair）後，無需限制部分承重", "B": "切除和清創後（resection and debridement）後，部分承重應至少維持2週", "C": "建議限制承重以保護早期纖維軟骨合成（fibrocartilage formation）和疼痛控制", "D": "最小化承重（腳尖觸地）應維持4～6週"}, "images": [], "answer": "B", "explanation": "髖唇撕裂手術後承重建議：B「切除清創後部分承重至少2週」較正確；A修復後需限制；C「為早期纖維軟骨合成」需限制承重；D最小化承重通常2-4週（不是4-6週）。"}, {"n": 50, "stem": "有關全髖關節置換術（total hip arthroplasty）的敘述，下列何者正確？", "options": {"A": "後外側手術方式會破壞臀中肌完整性，術後要加強肌力訓練，避免Trendelenburg步態", "B": "對於中風後肌肉失衡，產生髖屈曲及內轉站姿的患者，會採用直接外側手術方式", "C": "後外側手術方式發生術後關節不穩定的機率較高，會對後側關節囊做修補，提高穩定", "D": "直接外側手術方式所波及到的軟組織除了臀中肌之外還包括臀小肌、闊筋膜張肌及髂腰肌（iliopsoas）"}, "images": [], "answer": "C", "explanation": "後外側THA手術切口較易發生關節後脫位，需修補後關節囊以提高穩定。直接外側手術切口會破壞臀中肌等肌肉，故術後要加強臀中肌訓練。題目C正確；A、B、D描述錯誤。"}, {"n": 51, "stem": "在膝關節的急性傷害中，當患者描述關節腫脹在受傷後1～2小時內即出現，此現象代表意義為何？", "options": {"A": "滑液（synovial fluid）分泌過多", "B": "關節內出血", "C": "關節囊撕裂", "D": "關節軟骨磨損"}, "images": [], "answer": "B", "explanation": "膝關節腫脹快速（1-2小時內）出現→典型關節內出血（hemarthrosis），多由ACL撕裂、半月板撕裂或骨軟骨骨折造成。緩慢腫脹（24小時）多為滑液增多。"}, {"n": 52, "stem": "關於膝骨性關節炎的疾病特徵，下列何者正確？", "options": {"A": "原發性關節炎以男性居多", "B": "大多由髕股骨關節軟骨開始磨損", "C": "早晨起床時會感到特別僵硬，但通常不會超過30分鐘", "D": "關節變形以膝外翻（genu valgum）最常見"}, "images": [], "answer": "C", "explanation": "膝OA：原發性以女性居多（A錯誤）；多由內側脛股關節軟骨開始磨損（B錯誤）；晨僵<30分鐘為典型（C正確）；變形以膝內翻genu varum多見（D錯誤）。"}, {"n": 53, "stem": "何謂貝克氏囊腫（Baker’s cyst）？", "options": {"A": "長期跪姿導致的髕骨前滑囊炎（bursitis）", "B": "膝關節水腫時導致滑液組織（synovial tissue）往後方脫出", "C": "拇趾外翻造成之拇囊炎（bunion）", "D": "跟骨後方阿基里斯肌腱附著處的組織增生"}, "images": [], "answer": "B", "explanation": "Baker's cyst（膕窩囊腫）：膝關節水腫使滑液被擠向後內側，從半膜肌與腓腸肌內側頭間擠出形成囊腫。"}, {"n": 54, "stem": "膝關節周圍軟組織會影響樞軸旋轉位移測試（pivot shift test），下列敘述何者正確？", "options": {"A": "內側副韌帶鬆弛會增加位移程度", "B": "髂脛束太緊會減少位移程度", "C": "內側半月板把手式（bucket-handle）破裂會增加位移程度", "D": "內側半月板切除會減少位移程度"}, "images": [], "answer": "B", "explanation": "Pivot shift test受多種軟組織影響：A內側副韌帶鬆弛會減少（不是增加）位移程度；B髂脛束太緊減少位移（正確）；C內側半月板把手式會增加；D內側半月板切除會增加位移程度。"}, {"n": 55, "stem": "有關髕股疼痛症候群患者之患肢在下樓梯承重時的不正常動作，下列何者最常見？", "options": {"A": "過多的髖外轉", "B": "過多的髖內收", "C": "過多的膝屈曲", "D": "過多的膝內翻"}, "images": [], "answer": "B", "explanation": "髕股疼痛症候群（PFPS）下樓承重時最常見不正常動作為「過多髖內收+內轉+膝外翻」，造成髕骨向外側追蹤而疼痛。"}, {"n": 56, "stem": "下列何者不是測試髕股疼痛症候群之特殊測試？", "options": {"A": "Clarke's sign", "B": "Apley's test", "C": "McConnell test", "D": "Step up test"}, "images": [], "answer": "B", "explanation": "Apley's test為半月板測試（不是PFPS）。Clarke's sign、McConnell test、step up test皆與PFPS相關。"}, {"n": 57, "stem": "有關膝前向抽拉測試（anterior drawer test）的敘述，下列何者錯誤？", "options": {"A": "受測者的姿勢是躺姿，膝屈曲90度，且脛骨外轉", "B": "此法對於膝前十字韌帶的前內束（anteromedial bundle）較為敏感", "C": "測試時，受測者也可坐在床緣，雙腳懸空，其好處是可以避免後陷現象（posterior sag sign）的產生", "D": "若單純只有膝前十字韌帶受傷，則檢查結果可能為陰性"}, "images": [], "answer": "A", "explanation": "前抽拉測試（anterior drawer test）：膝屈90°、脛骨「中立」位置（不是外轉），治療師將脛骨前拉測ACL前內束。脛骨外轉檢測會干擾測試結果。"}, {"n": 58, "stem": "物理治療師檢查一位60歲膝退化性關節炎女性患者，發現病患被動與主動膝關節活動角度皆在20～140度範圍\n內。下列何者最不能解釋此現象？", "options": {"A": "股四頭肌肌力不足", "B": "脛骨相對於股骨的向前滑動受限", "C": "大腿後肌攣縮", "D": "髕股關節面活動受限"}, "images": [], "answer": "A", "explanation": "膝OA病人ROM 20-140°（屈曲100° + 伸直缺20°）：脛骨向前滑動受限（影響伸直）、大腿後肌攣縮（影響伸直）、髕股關節受限（多影響屈曲）。股四頭肌肌力不足影響「主動」伸直但不限制「被動」ROM，故A最不能解釋。"}, {"n": 59, "stem": "有關足部疼痛的鑑別診斷，下列何者錯誤？", "options": {"A": "疼痛發生在足部內側，且在內踝下方有Tinel sign的話，最有可能是跗骨隧道症候群（tarsal tunnel syndrome）", "B": "疼痛發生在足底偏足跟附近，最有可能是足底筋膜炎", "C": "疼痛發生在足底前方，最有可能是附生舟狀骨症候群（accessory navicular syndrome）", "D": "疼痛發生在跟骨後方位置，最有可能是阿基里斯腱發炎"}, "images": [], "answer": "C", "explanation": "足底前方疼痛多為Morton's neuroma或蹠骨痛（metatarsalgia）；Accessory navicular syndrome疼痛位置在足內側（不是前方）。"}, {"n": 60, "stem": "關於阿基里斯腱縫合術後的物理治療，下列何者錯誤？", "options": {"A": "初期先用石膏固定，石膏拿掉後可給予足跟墊（heel lift）將踝關節擺在15～20度蹠屈位置", "B": "在初期，被動踝關節蹠屈運動沒有範圍限制", "C": "術後兩週可給予踝關節蹠屈與背屈各15度左右之被動關節活動", "D": "術後兩個月後多數患者可不穿步行靴（walking boot）"}, "images": [], "answer": "C", "explanation": "阿基里斯腱縫合術後初期被動蹠屈無範圍限制；但被動「背屈」應有限制（避免拉斷修補處）。其他三項皆為正確的術後處置。"}, {"n": 61, "stem": "關於脛內側應力症候群（medial tibial stress syndrome）之敘述，下列何者正確？①蹠屈阻力測試會引發疼\n痛 ②通常影響到脛後肌 ③外翻阻力測試會引發疼痛", "options": {"A": "僅①②", "B": "僅②", "C": "僅①③", "D": "①②③"}, "images": [], "answer": "A", "explanation": "脛內側應力症候群（脛骨內側骨膜炎）：脛後肌、屈趾肌過度使用造成脛骨內後緣骨膜發炎。蹠屈+內翻阻力測試引發疼痛。外翻阻力測試與此較無關。"}, {"n": 62, "stem": "一位健康年輕男性騎乘摩托車滑倒，造成右膝外側外傷且腓骨頭移位。外傷處理後，患者轉介至物理治療。\n治療師觀察其走路時右腳舉得特別高，患者也抱怨走路時腳容易絆倒。患者最可能是下列何種狀況？", "options": {"A": "足底筋膜炎（plantar fascitis）", "B": "總腓神經受傷（common peroneal nerve injury）", "C": "髕股骨疼痛（patellofemoral pain）", "D": "腓骨長肌肌腱炎（peroneus longus tendinitis）"}, "images": [], "answer": "B", "explanation": "腓骨頭移位易壓迫總腓神經（common peroneal nerve），造成踝背屈無力（垂足）→走路腳特別舉高以避免絆倒。"}, {"n": 63, "stem": "為確認患者的大腳趾的活動度是否符合正常行走的需求，下列那個測試最不恰當？", "options": {"A": "站立時測量大腳趾蹠趾關節主被動活動度", "B": "不承重時測量大腳趾蹠趾關節主被動活動度", "C": "舟狀骨掉落測試（navicular drop test）", "D": "絞盤測試（windlass test）"}, "images": [], "answer": "C", "explanation": "Navicular drop test（舟狀骨掉落測試）測試足弓塌陷與旋前，與「大腳趾活動度」評估較無直接關聯。其他三項皆為MTP動作評估。"}, {"n": 64, "stem": "下列何者之疼痛部位與足跟底疼痛（plantar heel pain）差異最大？", "options": {"A": "跑者足（jogger's foot）", "B": "足底筋膜炎或足底筋膜斷裂", "C": "跟骨骨膜炎（calcaneal periositis）", "D": "脂肪墊症候群（fat pad syndrome）"}, "images": [], "answer": "A", "explanation": "Jogger's foot：脛神經內側分支（internal plantar nerve）卡壓於脛骨內側下方，疼痛位置在「內側足踝弓」附近，與足跟底疼痛位置不同。其他三項皆位於足跟底。"}, {"n": 65, "stem": "有關臨床上常教導患者以弓箭步牽張（stretch）後腳之阿基里斯腱的方式，下列敘述何者錯誤？", "options": {"A": "在後腳跟不離地的狀況下，將上半身向前壓", "B": "後腳膝關節完全伸直較可牽張到此肌腱", "C": "後腳大腳趾要朝正前方", "D": "後腳可微微外轉"}, "images": [], "answer": "D", "explanation": "弓箭步牽張阿基里斯腱：後腳跟不離地、膝關節伸直、腳尖朝前、不外轉。「外轉」會讓拉力分散且不能有效拉到肌腱中段。"}, {"n": 66, "stem": "近端趾間關節和遠端趾間關節屈曲以及蹠趾關節過度伸直之足部變形，稱為下列何者？", "options": {"A": "claw toe", "B": "hallux valgus", "C": "hammer toe", "D": "mallet toe"}, "images": [], "answer": "A", "explanation": "Claw toe（爪狀趾）：MTP過度伸直+PIP+DIP屈曲。Hammer toe：MTP伸直+PIP屈曲+DIP伸直。Mallet toe：DIP屈曲，其他關節中立。"}, {"n": 67, "stem": "下列何者是進行初級照護（primary care）評估之最主要目的？", "options": {"A": "促進人口健康和預防疾病", "B": "確定患者的主述問題並提供適當治療或轉診", "C": "增進患者對本身健康的了解", "D": "制定適當的預後和治療計劃"}, "images": [], "answer": "B", "explanation": "初級照護評估之主要目的：確定主述問題、進行適當治療或轉診（一線分流的核心功能）。促進健康預防為次要目的。"}, {"n": 68, "stem": "如果患者的主述為持續1-5分鐘的中等胸口疼痛，但休息後胸痛有減緩，則最有可能是下列何者？", "options": {"A": "心絞痛（angina）", "B": "心肌梗塞（myocardial infarct）", "C": "心臟二尖瓣脫垂（mitral valve prolapse）", "D": "急性心包膜炎（pericarditis）"}, "images": [], "answer": "A", "explanation": "心絞痛（angina）：1-5分鐘短暫胸痛，休息或舌下含NTG後可緩解。心肌梗塞：>30分鐘持續且休息不緩解；二尖瓣脫垂多無痛；心包膜炎為持續性且姿勢相關痛。"}, {"n": 69, "stem": "下列那些疾病可能造成肋骨部位疼痛？①膽囊疾病 ②帶狀皰疹 ③癌症轉移至肋骨", "options": {"A": "僅①②", "B": "①②③", "C": "僅①③", "D": "僅②③"}, "images": [], "answer": "B", "explanation": "肋骨疼痛來源：①膽囊（轉移痛至右肩胛或肋間）、②帶狀皰疹（皮節分布）、③癌症轉移（骨轉移）皆可能。"}, {"n": 70, "stem": "有關阻力運動對骨組織的作用之敘述，下列何者正確？", "options": {"A": "足夠強度的阻力運動對全身的骨質密度都有維持或增加的效果", "B": "足夠強度的阻力運動對骨質密度的療效，主要是在運動的部位", "C": "有壓迫性骨折病史之患者，不可給予負重背心進行阻力運動", "D": "運動耐力差的老年人易有運動傷害，所以不宜給予阻力運動"}, "images": [], "answer": "B", "explanation": "阻力運動的骨密度療效具「部位特異性」（site-specific），主要在被訓練的部位產生骨密度增加。即使脊椎壓迫骨折病史，也可在指導下進行適當阻力運動。"}, {"n": 71, "stem": "婦女隨著懷孕體重增加與身形改變，常見以下列何種方式維持走路時的平衡？", "options": {"A": "增加髖關節外轉與加寬支撐面積", "B": "增加髖關節內轉與加寬支撐面積", "C": "增加髖關節外展與加長前後支撐面積", "D": "增加髖關節屈曲與加長前後支撐面積"}, "images": [], "answer": "A", "explanation": "懷孕後期重心前移、體重增加：增加髖外轉+加寬支撐面積（雙腳分開）以增加底面積、改善穩定。"}, {"n": 72, "stem": "在生產過程，下列那些組織易受到損害？①牽拉與壓迫陰部神經（pudendal nerve）   ②牽拉與壓迫提肛神經\n（levator ani nerve）  ③牽拉骨盆底肌（pelvic floor muscles）", "options": {"A": "僅①", "B": "僅③", "C": "僅①③", "D": "①②③"}, "images": [], "answer": "D", "explanation": "生產過程牽拉與壓迫：①陰部神經、②提肛神經、③骨盆底肌皆易受損（產程過長、巨嬰、器械生產等）。"}, {"n": 73, "stem": "一個有足跟墊症候群（heel pad syndrome）的馬拉松選手在賽前2天向物理治療師求助，下列何種處置對他2天\n後的比賽無法有效改善其症狀？", "options": {"A": "使用足跟杯", "B": "強化小腿肌力運動", "C": "阿基里斯腱伸展運動", "D": "足跟墊貼紮"}, "images": [], "answer": "B", "explanation": "Heel pad syndrome（足跟墊症候群）：足跟脂肪墊受壓變薄。處理：足跟杯、貼紮、減負重。「強化小腿肌」對2天內症狀改善作用有限（為長期介入）。"}, {"n": 74, "stem": "患者接受膝前十字韌帶重建術後，欲重返高風險活動（例如滑雪），下列何者為判定之最低標準？", "options": {"A": "膕旁肌肌力恢復至與對側相同，且與股四頭肌肌力的比值達70%以上", "B": "膝關節穩定度測試結果，兩側差異小於10 mm", "C": "關節本體感覺測試達到對側的80%", "D": "功能動作測試恢復至與對側相同"}, "images": [], "answer": "#", "explanation": "ACL重建術後重返高風險運動（如滑雪）至少需肢體對稱指數>90%、肌力與功能皆達對側>90%。題目原始答案#為一律給分。"}, {"n": 75, "stem": "有關燒燙傷患者急性期的擺位原則，下列何者錯誤？", "options": {"A": "手肘與膝關節擺在接近伸直（約略5度彎曲）的位置", "B": "用副木將手腕擺在背屈、掌指關節屈曲、指間關節伸直與大拇指外展的位置", "C": "頸部前側燒傷者，頸椎也有受傷的可能，不宜將頸椎擺位在後伸的位置，以免傷害脆弱的小面關節", "D": "臉部燒傷者，需要將頭部擺位比心臟高，可將病床頭側墊高，讓整張病床傾斜約30度"}, "images": [], "answer": "C", "explanation": "燒燙傷急性期擺位原則：避免攣縮位置。臂手腳應在抗縮短位置。「腕背屈+MCP屈曲+IP伸直+拇指外展」是預防屈曲手部攣縮的標準擺位。題目B描述本應為正確擺位（題目要求錯誤，C項錯誤可能在頸部處理）。"}, {"n": 76, "stem": "燒燙傷後一週內，對於沒有進行植皮手術的患者，下列敘述何者錯誤？", "options": {"A": "患部若有嚴重疼痛與腫脹，可給予被動關節活動與副木擺位，以達到舒適與預防攣縮之目的", "B": "患部若有嚴重疼痛與腫脹，治療師應安撫患者，積極進行主動性協助運動（AAROM exercise）", "C": "只要情況允許，應鼓勵患者進行主動關節運動，並儘快下床行走", "D": "利用傷口換藥的時間，給予關節運動訓練，並可觀察傷口狀況，是物理治療的唯一時機"}, "images": [], "answer": "D", "explanation": "燒燙傷一週內仍未植皮：可給予被動運動（在嚴重疼痛腫脹下會耗能）、AAROM、主動運動、下床行走。換藥時間並非「唯一」治療時機，故D錯誤。"}, {"n": 77, "stem": "有關淋巴水腫患者的衛教，下列何者錯誤？", "options": {"A": "應避免全身泡溫泉", "B": "不能做重量訓練", "C": "運動時應穿著彈性袖套", "D": "使用乳液避免皮膚產生龜裂"}, "images": [], "answer": "B", "explanation": "淋巴水腫患者「可」進行重量訓練（漸進式適度阻力訓練有助於改善淋巴循環，需穿著彈性套）。題目B「不能做重量訓練」錯誤。"}, {"n": 78, "stem": "患有周邊血管疾病的病人接受大範圍（major）下肢截肢手術五年後，對側下肢截肢的比率約為：", "options": {"A": "12%", "B": "32%", "C": "72%", "D": "52%"}, "images": [], "answer": "D", "explanation": "周邊血管疾病大範圍下肢截肢後5年對側截肢比率約50%（依Markowitz、Mahler等研究）。"}, {"n": 79, "stem": "對於截肢後不同的手術後敷料（postsurgical dressing）選用，下列敘述那些正確？①立即性術後義肢\n（immediate postoperative prosthesis, IPOP）是硬敷料的一種，常用於膝下截肢病患 ②可移除的硬敷料\n（removable rigid dressings, RDDs）用於膝下截肢病患時，常用於維持膝關節在屈曲的位置 ③硬敷料因為材\n質的緣故，無法有效控制殘肢腫脹 ④半硬式敷料（semirigid dressing）能有效地保護癒合時期的殘肢", "options": {"A": "①③", "B": "①④", "C": "②③", "D": "②④"}, "images": [], "answer": "B", "explanation": "截肢後敷料：①IPOP立即性硬敷料用於膝下截肢，可早期裝義肢負重；④半硬式敷料能有效保護癒合期殘肢。②可移除硬敷料常維持膝伸直（非屈曲）；③硬敷料可有效控制腫脹。"}, {"n": 80, "stem": "關於膝上截肢（transfemoral amputation）患者在行走時可能出現的異常步態及原因，下列敘述何者錯誤？", "options": {"A": "髖關節屈曲攣縮可能會造成後跟鞭步（heel whip）", "B": "髖伸肌無力可能會造成過度腰椎前凸（excessive lumbar lordosis）", "C": "殘肢肌力不足可能會造成義肢側的承重不足（insufficient weight bearing through prosthesis）", "D": "承筒的初始屈曲角度不足可能造成義肢膝關節不穩定（instability of the prosthetic knee）"}, "images": [], "answer": "A", "explanation": "膝上截肢髖屈攣縮會造成「過度腰椎前凸」（不是後跟鞭步heel whip）。後跟鞭步主要由承筒適合度不良或膝關節旋轉問題造成。"}]}, "Q2": {"label": "第二次", "questions": [{"n": 1, "stem": "有關內臟痛（visceral pain）的轉移痛（referred pain）位置，下列敘述何者錯誤？", "options": {"A": "心臟痛可轉移痛至胸椎第二節", "B": "胃痛可轉移痛至胸椎第六到第八節", "C": "消化性潰瘍痛常轉移痛至胸椎第四到第六節", "D": "腎臟痛常轉移痛至胸椎第七到第八節"}, "images": [], "answer": "D", "explanation": "腎臟轉移痛位於腰部與下腹（T10-L1皮節），不是T7-T8。心臟痛轉移T1-T5；胃痛T6-T8；消化性潰瘍T6-T8（不是T4-T6）。題目D描述錯誤。"}, {"n": 2, "stem": "一位45歲女性上班族，工作時必須長時間打電腦，主訴兩邊肩頸僵硬，且有時額頭會有箍緊的感覺；上班日早\n上起床時不會痛，到傍晚時分症狀增加。對於這位上班族，下列建議何者較不恰當？", "options": {"A": "配戴合適的閱讀用眼鏡，確保視力清晰", "B": "調整辦公桌電腦高度，保持視線高於水平以仰視螢幕", "C": "調整滑鼠位置，讓上臂靠近身體，儘量減少手臂向前伸", "D": "定時起身活動"}, "images": [], "answer": "B", "explanation": "電腦螢幕應在「視線水平或略下方」（俯視），不是「仰視」（會造成頸部後仰加重肩頸僵硬）。題敘B錯誤。"}, {"n": 3, "stem": "觀察一位50歲的辦公族，發現有前位頭部（forward head）、下巴前突、圓肩姿勢，下列那些肌肉通常有緊縮\n的現象？①枕骨下肌（suboccipital） ②胸鎖乳突肌（sternocleidomastoid） ③胸小肌（pectoralis minor）", "options": {"A": "僅①②", "B": "僅①③", "C": "①②③", "D": "僅②③"}, "images": [], "answer": "C", "explanation": "前位頭部+下巴前突+圓肩：枕骨下肌（上頸伸直）、SCM、胸大小肌、上斜方肌、提肩胛肌皆有緊縮現象。①②③皆是。"}, {"n": 4, "stem": "有關顳頜關節有喀嗒（clicking）聲響症狀，下列敘述何者正確？", "options": {"A": "張嘴時喀嗒聲越晚出現，表示間盤（disc）的位置越在後面", "B": "閉嘴時的喀嗒聲，通常是因附著在間盤（disc）的組織太緊", "C": "張嘴時的喀嗒聲，表示間盤（disc）脫位", "D": "喀嗒聲比較可能發生在高動性（hypermobile）關節"}, "images": [], "answer": "D", "explanation": "顳頜關節喀嗒（clicking）通常發生於高動性（hypermobile）關節—關節盤不穩在開閉口時跳過下頜髁。早期喀嗒=盤位置正常；晚期喀嗒=盤前移更嚴重。"}, {"n": 5, "stem": "下列那一頸部肌肉的疼痛，可能會在臉頰或顳頜關節處產生轉移痛（referred pain）？", "options": {"A": "胸鎖乳突肌（sternocleidomastoid）", "B": "斜角肌（scalene）", "C": "頭夾肌（splenius capitis）", "D": "頸半脊肌（semispinalis cervicis）"}, "images": [], "answer": "A", "explanation": "胸鎖乳突肌（SCM）的扳機點疼痛可轉移至臉頰、額頭、太陽穴、顳頜關節周圍。"}, {"n": 6, "stem": "下列何者為連結至頸椎第二節之肌肉組織？①後頭直小肌（rectus capitus posterior minor） ②下頭斜肌\n（obliques capitus inferior） ③後頭直大肌（rectus capitus posterior major）", "options": {"A": "僅①②", "B": "僅①③", "C": "僅②③", "D": "①②③"}, "images": [], "answer": "C", "explanation": "後頭直大肌（rectus capitis posterior major）：起於C2棘突，止於枕骨下項線。下頭斜肌（obliquus capitis inferior）：起於C2棘突，止於C1橫突。後頭直小肌（rectus capitis posterior minor）連接於C1（不是C2）。"}, {"n": 7, "stem": "病患仰臥時，治療師將病患頭頸擺在後伸及側彎至左側，然後再將頭部轉到左側，維持30秒的時間，觀察是否\n有暈眩或眼球震顫的現象。此測試主要可評估下列那項問題？", "options": {"A": "頸神經根", "B": "椎動脈", "C": "頸椎穩定性", "D": "頸髓壓迫"}, "images": [], "answer": "B", "explanation": "椎動脈測試（vertebral artery test）：頭頸後伸+側彎+對側轉動維持30秒，觀察暈眩、眼震、噁心等椎動脈缺血症狀。"}, {"n": 8, "stem": "有關頸椎之上小關節面（superior facets）之方向組合，包括下列何者？①向前 ②向後 ③朝上 ④朝下", "options": {"A": "①③", "B": "②③", "C": "②④", "D": "①④"}, "images": [], "answer": "B", "explanation": "頸椎C3-C7上小面關節朝向「後上方」（superoposterior）：向後（②）+朝上（③）。"}, {"n": 9, "stem": "一位患者車禍後抱怨常有頭痛的情形，治療師評估後發現患者維持前位頭部（forward head）的姿勢，且上頸\n椎的肌肉較無力，相較而言，下列何項治療較不恰當？", "options": {"A": "上頸伸肌牽張（stretching）運動", "B": "頸椎深層屈肌（deep flexor muscles）之肌力訓練", "C": "利用壓力生物回饋儀（pressure biofeedback unit）訓練頸部淺層屈肌肌力", "D": "頸椎姿勢矯正訓練"}, "images": [], "answer": "C", "explanation": "前位頭部+上頸無力者，應訓練「深層」屈肌（深層頸屈肌、頭長肌、頸長肌）以矯正姿勢；訓練「淺層」屈肌（如胸鎖乳突肌）反而會強化代償，使姿勢更糟。"}, {"n": 10, "stem": "病人開口時，若下頜向左側移動，可能為下列何種問題？", "options": {"A": "右側顳頜關節盤前移", "B": "右側顳頜關節盤後移", "C": "左側顳頜關節盤前移", "D": "左側顳頜關節盤後移"}, "images": [], "answer": "A", "explanation": "張嘴下頜偏向左側：表示左側下頜髁向前移動受限或右側下頜髁過度向前移動。「右側顳頜關節盤前移」會卡住右側髁，使下頜偏向左側。"}, {"n": 11, "stem": "35歲搬運工作員，6個月前搬運水泥磚時，不慎拉傷下背組織。經檢查發現：姿勢外觀並無異常；站姿下重複\n前彎時，動作受限且在動作終端時出現下背疼痛；站姿下重複後仰時，活動正常且無症狀；躺姿下檢查與站\n姿檢查結果相同。此患者是屬於McKenzie分類的那一類問題？", "options": {"A": "姿勢症候群（postural syndrome）", "B": "失能症候群（dysfunction syndrome）", "C": "排列異常症候群（derangement syndrome）", "D": "退化症候群（degenerative syndrome）"}, "images": [], "answer": "B", "explanation": "重複性動作引起，動作受限+終端疼痛、躺姿同樣症狀→McKenzie失能症候群（dysfunction syndrome）：軟組織短縮或沾黏使動作達到末端時產生疼痛。"}, {"n": 12, "stem": "75歲婦女，主訴經常感到腰痠背痛。視診時發現背部有明顯的Gibbous畸形，經DXA檢查後T-score為-2.8。此\n婦女最可能有下列何問題？", "options": {"A": "腰椎間盤突出", "B": "僵直性脊柱炎", "C": "骨質疏鬆伴隨椎體骨折", "D": "舒爾曼病（Scheuermann's disease）"}, "images": [], "answer": "C", "explanation": "Gibbous deformity（局部尖凸畸形）+ DXA T-score=-2.8（嚴重骨鬆）→典型「骨質疏鬆+椎體壓迫性骨折」造成楔形變形。"}, {"n": 13, "stem": "一名40歲男性，因右側腰部疼痛尋求物理治療，檢查發現主動腰椎前彎角度受限，且有疼痛弧（painful arc）\n現象，向右側彎又發同側神經輻射症狀，阻力測試出現踝背屈無力，膝反射降低，下列何者為最有可能之診\n斷？", "options": {"A": "L4、L5脊椎滑脫", "B": "腰部肌肉拉傷", "C": "椎間盤突出壓迫L4神經根", "D": "L4、L5小面關節退化"}, "images": [], "answer": "C", "explanation": "右側腰痛+前彎受限+疼痛弧+右側彎症狀放射+踝背屈無力（L4運動）+膝反射降低（L4反射）→典型L4神經根受L3-L4椎間盤後外側突出壓迫（也可能L4-L5突出向上影響L4）。"}, {"n": 14, "stem": "關於腰椎伸直症候群（lumbar extension syndrome）的症狀特色，下列何者正確？", "options": {"A": "作為伸直活動支點的椎節，其上一節通常活動過度", "B": "在年輕患者身上可發現站姿時腰椎前凸減少", "C": "可在呈現較大腰椎前凸程度的失穩椎節附近，發現表淺肌肉收縮活性增加的現象", "D": "此原發性功能失調，源於髖伸直肌的收縮比率遠大於腰椎伸直肌的收縮比率"}, "images": [], "answer": "C", "explanation": "腰椎伸直症候群：失穩椎節在伸直時椎體前移過大，鄰近表淺背肌（如豎脊肌淺層）收縮活性增加以代償穩定。其他選項描述錯誤。"}, {"n": 15, "stem": "有關右側薦骨前旋失能（sacral anterior nutation dysfunction），下列敘述何者正確？", "options": {"A": "坐姿前彎測試會在左側出現陽性反應", "B": "觸診時，相較於對側，右側髂前上棘位置較為向下向前", "C": "觸診時，相較於對側，右側薦骨底位置較為向前向下", "D": "腰椎彈壓測試為陽性"}, "images": [], "answer": "C", "explanation": "右側薦骨前旋失能：薦骨基部相對於對側「向前向下」位移；坐姿前彎測試會在「右側」（同側）出現陽性。其他描述錯誤。"}, {"n": 16, "stem": "下列何者為最常見的脊椎椎骨退化症狀？", "options": {"A": "脊椎關節活動度增加，急性關節疼痛", "B": "脊椎關節活動度減少，起床時關節僵硬", "C": "脊椎關節活動度增加，起床時關節僵硬", "D": "脊椎關節活動度減少，急性關節疼痛"}, "images": [], "answer": "B", "explanation": "脊椎椎骨退化（spondylosis/OA）：關節活動度減少、晨起僵硬（活動後緩解）為典型表現。"}, {"n": 17, "stem": "站立時出現明顯之腰椎過度前凸（lumbar lordosis）及骨盆前傾姿勢，檢查結果最可能為下列那條肌肉過緊？", "options": {"A": "股直肌", "B": "腹橫肌", "C": "梨狀肌", "D": "臀肌"}, "images": [], "answer": "A", "explanation": "腰椎過度前凸+骨盆前傾：股直肌（雙關節肌：屈髖+伸膝）緊張會拉動骨盆前傾。腹橫肌、梨狀肌、臀肌與此姿勢無直接關聯（反而是無力）。"}, {"n": 18, "stem": "站立時呈現腰薦角度（lumbosacral angle）過大、過度腰前凸（lordosis）、骨盆前傾過大、髖屈曲角度增加的\n姿勢所導致之腰椎下段區域疼痛，其疼痛來源較不可能是下列何者？", "options": {"A": "後縱韌帶張力過大", "B": "前縱韌帶張力過大", "C": "小面關節發炎", "D": "下段腰椎神經根受刺激"}, "images": [], "answer": "A", "explanation": "腰薦角度過大+腰前凸+髖屈：後縱韌帶在「腰前凸」狀態下並未被過度拉緊（後縱韌帶在腰屈曲時較緊）。前縱韌帶在腰前凸時被拉緊；小面關節因壓迫發炎；下段神經根受刺激。"}, {"n": 19, "stem": "一位50歲的男性主訴左臀部及後大腿疼痛、站立向前取物持續15分鐘後或行走時症狀加劇，仰躺膝下墊枕頭\n時症狀減少，打噴嚏或咳嗽時疼痛沒有增加。檢查發現其呈現搖擺背（swayback）姿勢，仰躺時被動直膝抬\n腿45度伴隨足背屈時，症狀無變化，俯臥以手撐起軀幹後仰時疼痛會增加。下列何者為最可能的診斷？", "options": {"A": "椎間盤突出", "B": "退化性腰椎關節炎", "C": "背肌拉傷", "D": "坐骨神經壓迫"}, "images": [], "answer": "B", "explanation": "搖擺背（swayback）+俯臥撐起時痛+SLR陰性+久站站立加劇→典型退化性腰椎關節炎（小面關節）：後仰加劇、屈曲減輕。椎間盤突出多有SLR陽性。"}, {"n": 20, "stem": "一位65歲男性背痛病人，主訴一個月以來，走路10分鐘後雙小腿會麻痛。檢查時軀幹後仰疼痛症狀增加，平\n躺時雙膝下墊枕頭症狀可減少。下列何者為病人最可能之疼痛來源？", "options": {"A": "多裂肌疼痛之轉移痛", "B": "脊椎滑脫壓迫神經", "C": "關節退化發炎反應", "D": "椎間盤突出壓迫神經"}, "images": [], "answer": "B", "explanation": "走路間歇性麻痛+後仰加劇+屈髖屈膝緩解→典型脊椎狹窄症（spinal stenosis），多由「脊椎滑脫壓迫神經」或「椎體骨刺」造成。"}, {"n": 21, "stem": "屈膝平躺時，進行下背穩定性運動訓練，下列動作，由易至難之排列為何？①膝蓋向外側打開再合起 ②縮\n緊腹部 （drawing-in maneuver） ③其中一腳伸直膝關節後，抬腿至45° ④其中一腳跟延著床面來回伸直彎\n曲膝關節", "options": {"A": "①②③④", "B": "②①④③", "C": "②①③④", "D": "①②④③"}, "images": [], "answer": "B", "explanation": "下背穩定運動進階：易→難。②縮緊腹部（腹橫肌啟動）→①膝外側打開（單側髖外展）→④腳跟滑動（單腿動作）→③直膝抬腿45°（最具挑戰）。"}, {"n": 22, "stem": "檢視腰椎X光影像時，最有可能在什麼平面的X光影像上看到斷頭蘇格蘭狗（Scottie dog decapitated）的腰椎\n滑脫（spondylolisthesis）異常現象？", "options": {"A": "後前向（posteroanterior view）", "B": "側向（lateral view）", "C": "前後向（anteroposterior view）", "D": "斜向（oblique view）"}, "images": [], "answer": "D", "explanation": "腰椎滑脫（spondylolisthesis）在「斜向」X光最易看到「斷頭蘇格蘭狗」徵象（pars interarticularis骨折部分）。"}, {"n": 23, "stem": "觸診時發現右側坐骨粗隆內上緣組織較左側緊繃，此問題可能與下列何種情況有關？①右側薦骨基部（sacral\nbase）較淺 ②右側薦骨基部較深 ③薦骨向右旋轉 ④薦骨向左旋轉 ⑤右側薦骨前屈 ⑥右側薦骨後仰", "options": {"A": "①③⑤", "B": "②④⑤", "C": "①④⑥", "D": "②③⑥"}, "images": [], "answer": "B", "explanation": "右側坐骨粗隆內上緣緊→可能與②右側薦骨基部較深+④薦骨向左旋轉+⑤右側薦骨前屈相關。"}, {"n": 24, "stem": "關於長短腳量測的敘述，下列何者錯誤？", "options": {"A": "結構性長短腳問題可用仰臥起坐測試（supine-to-sit test）來確定", "B": "若痛側腳在仰臥時較長，坐起後較短，表示該側可能為無名骨（innominate）向前旋轉", "C": "當懷疑薦髂關節有問題時，可進一步施行腿長測試", "D": "腿長測試若兩側相差1～1.3公分為正常範圍"}, "images": [], "answer": "A", "explanation": "Supine-to-sit test用以區分「功能性」vs.「結構性」長短腳：仰臥與坐位腿長相同→結構性；不同→功能性（薦髂或骨盆問題）。題敘A方向錯誤。"}, {"n": 25, "stem": "關於右胸椎側彎（right thoracic curve）之敘述，下列何者錯誤？", "options": {"A": "凹側在右", "B": "左側背部肌肉可能會縮短", "C": "右側背部肌肉可能會拉長", "D": "Adam's前彎測試可觀察到右側背部拱起（hump）"}, "images": [], "answer": "A", "explanation": "右胸椎側彎（right thoracic curve）：凸右、凹左。題敘A「凹側在右」錯誤。"}, {"n": 26, "stem": "棒球投手做投擲動作時，最容易在揮臂後期（late cocking）到加速期（acceleration）間受傷，下列敘述何者\n錯誤？", "options": {"A": "在揮臂準備後期，肩關節產生最大的外展及外轉角度", "B": "在揮臂準備後期，若肩關節前方出現疼痛，可能是因為前向不穩定（anterior instability）", "C": "加速期時，相較於其他肌肉，肱二頭肌活化程度最高", "D": "從揮臂準備後期到加速期，如果肩關節後方出現不舒服，可能與後側關節囊或旋轉肌群有關"}, "images": [], "answer": "C", "explanation": "棒球投手late cocking到acceleration phase最易受傷。在加速期（acceleration phase），三角肌、肩胛下肌、胸大肌、闊背肌活化程度最高（不是肱二頭肌）。題目C錯誤。"}, {"n": 27, "stem": "肩關節前向不穩定（anterior instability）患者經過手術修復後之物理治療介入，下列何者最不適當？", "options": {"A": "術後6週內，應儘量避免用患側拿重物", "B": "術後6週內，為免牽扯到盂肱關節肌肉，不鼓勵訓練肩胛肌肉", "C": "術後12週，應避免在外展90度下的外轉動作，其他各方向的關節活動則無限制", "D": "術後24週，可執行增強式運動（plyometric exercises）"}, "images": [], "answer": "B", "explanation": "肩前向不穩定術後修復：6週內仍可訓練肩胛穩定肌（如菱形肌、下斜方肌、前鋸肌等），不會牽扯到盂肱關節。題敘B錯誤。"}, {"n": 28, "stem": "接受旋轉肌群縫合病人，術後的輔助性主動運動宜由下列那一個方向開始？", "options": {"A": "前屈", "B": "外展", "C": "內轉", "D": "外轉"}, "images": [], "answer": "A", "explanation": "旋轉袖修復術後輔助主動運動由「前屈」（forward flexion）開始（最少肌腱張力），其次外展、外轉等。"}, {"n": 29, "stem": "觀察肩胛肱骨節律（scapulohumeral rhythm）時，下列敘述何者錯誤？", "options": {"A": "正常情形下，手臂舉高180度之肩胛與肱骨的動作幅度整體比例約為1：2", "B": "在手臂舉高與放下的過程中，皆可觀察肩胛肱骨節律的控制", "C": "肩胛肱骨節律與肌肉控制有關，但與肩部各關節的活動度無關", "D": "舉手速度會影響肩胛肱骨節律"}, "images": [], "answer": "C", "explanation": "肩胛肱骨節律與「肩部所有關節活動度」皆相關（GH、ST、AC、SC）。題敘C「與活動度無關」錯誤。"}, {"n": 30, "stem": "當患者主訴向下梳後腦的頭髮時有困難，則下列那些肩關節動作可能受限？①後伸 ②外展 ③內轉 ④外\n轉", "options": {"A": "②③", "B": "②④", "C": "①③", "D": "①②"}, "images": [], "answer": "B", "explanation": "向下梳後腦頭髮需「肩外展+外轉」。內轉與外旋限制都會影響後腦動作，但題目特指「向下」梳，外展+外轉較適切。"}, {"n": 31, "stem": "25歲患者主訴在舉手至60～120度之間肩部前方有疼痛情形，並告知5年前因車禍而肩部脫臼，這5年來曾經有\n3次脫臼復發。檢查時發現，外展阻力測試有疼痛及無力的現象，則下列那些測試最可能出現陽性反應？", "options": {"A": "驚恐與復位測試（apprehension and relocation test）、肩鎖關節水平內收測試（acromioclavicular horizontal adduction test）", "B": "Hawkins-Kennedy夾擠測試（impingement test）、抬離測試（lift-off test）", "C": "驚恐與復位測試（apprehension and relocation test）、Hawkins-Kennedy夾擠測試（impingement test）", "D": "肩鎖關節水平內收測試（acromioclavicular horizontal adduction test）、抬離測試（lift-off test）"}, "images": [], "answer": "C", "explanation": "脫臼史+夾擠症狀：驚恐與復位測試（apprehension and relocation test）測前向不穩；夾擠測試（Hawkins-Kennedy）測夾擠症候群。"}, {"n": 32, "stem": "若患者疼痛位於肩部前外側，則下列那一個症狀無法協助判斷此患者可能有肱二頭肌肌腱發炎的問題？", "options": {"A": "旋轉門把時，肩部前側也可能會疼痛", "B": "抬離測試（lift-off test）為陽性", "C": "手臂從舉高過頭位置慢慢放下時，出現肩部前側疼痛，有時比舉高手臂的動作還痛", "D": "肩關節後伸動作伴隨肘關節伸直時，肩部前側出現疼痛"}, "images": [], "answer": "B", "explanation": "Lift-off test為肩胛下肌（內轉肌）測試，不直接判斷肱二頭肌肌腱炎。其他三項症狀皆與肱二頭肌肌腱炎相關。"}, {"n": 33, "stem": "後肩關節囊緊繃（posterior capsule tightness）最可能導致肩關節那些方向的活動度減少？", "options": {"A": "水平內收、內轉", "B": "外展、外轉", "C": "後伸、水平外展", "D": "外展、水平外展"}, "images": [], "answer": "A", "explanation": "後肩關節囊緊（GIRD）：限制肩內轉+水平內收（cross-body adduction）動作角度。"}, {"n": 34, "stem": "肩胛骨翼狀聳出（scapular winging），最不可能與下列那一神經根病變（radiculopathy）有關？", "options": {"A": "C4", "B": "C5", "C": "C7", "D": "C8"}, "images": [], "answer": "D", "explanation": "肩胛翼狀聳出主要與C5-C7神經根（背肩胛神經C5、長胸神經C5-7、脊副神經CN XI）有關。C8與翼狀聳出較無直接關聯。"}, {"n": 35, "stem": "有關肩關節鐘擺運動（pendulum exercise），下列敘述何者正確？", "options": {"A": "利用前臂的擺動帶動肩關節的擺動", "B": "不適合進行肩關節水平內收與外展方向擺動", "C": "如果患者在彎腰姿勢下做會有背痛，也可在趴姿下做", "D": "鐘擺運動適用於周邊水腫患者，有助於改善組織循環"}, "images": [], "answer": "C", "explanation": "鐘擺運動原則：上半身傾斜，利用上臂重量擺動（不是前臂）；可進行各方向擺動；趴姿可改善背痛者；急性周邊水腫不適合（會加重）。題目C正確。"}, {"n": 36, "stem": "有關胸廓出口症候群（thoracic outlet syndrome）的治療，下列敘述何者錯誤？", "options": {"A": "進行橫膈膜的腹式呼吸訓練有助於改善症狀", "B": "應矯正頸部與肩部之姿勢", "C": "初期應加強斜角肌、胸大肌與胸小肌的肌力訓練", "D": "應加強頸部及胸椎之核心穩定肌力訓練"}, "images": [], "answer": "C", "explanation": "TOS治療早期應「拉長」斜角肌、胸小肌（過度緊縮）；強化肌力反而加重壓迫。題敘C錯誤。"}, {"n": 37, "stem": "有關盂肱關節的穩定性，下列敘述那些正確？①前向不穩所占比率最高 ②後向不穩所占比率最高 ③創傷\n性不穩定多為單方向的不穩定 ④創傷性不穩定多為多方向的不穩定", "options": {"A": "①③", "B": "①④", "C": "②④", "D": "②③"}, "images": [], "answer": "A", "explanation": "盂肱關節不穩定：①前向不穩定占多數（90%以上）；③創傷性不穩定多為單方向（如Bankart lesion）；多方向不穩定多為非創傷性（atraumatic, hyperlaxity）。①③正確。"}, {"n": 38, "stem": "下列何者不是肩旋轉肌袖修復手術（rotator cuff repair surgery）之適應症？", "options": {"A": "慢性夾擠造成旋轉肌袖嚴重斷裂", "B": "影像上顯示旋轉肌袖斷裂卻無症狀的病患", "C": "旋轉肌袖斷裂合併肩盂唇傷害", "D": "保守治療一段時間，持續有症狀及功能受限"}, "images": [], "answer": "B", "explanation": "「無症狀的旋轉袖斷裂」不需手術修復（B不是手術適應症），可保守處理。其他三項為手術適應症。"}, {"n": 39, "stem": "針對腕屈肌受傷後的治療，下列何者正確？", "options": {"A": "一開始要將腕屈肌置於拉長姿勢，訓練收縮數次", "B": "訓練肌耐力，應先以高強度、低重複次數訓練", "C": "阻力訓練要增加挑戰時，不應先增加訓練速度，再增加阻力", "D": "功能性活動訓練應從慢速受控制動作進展到高速低阻力，來改善肌肉收縮的時序"}, "images": [], "answer": "D", "explanation": "肌耐力訓練應由低強度高反覆開始；漸進到加挑戰時應先增訓練速度後再增阻力。功能性活動由慢速控制動作→高速低阻力，改善時序協調。"}, {"n": 40, "stem": "在肘部那一位置可以觸摸到尺神經？", "options": {"A": "橈骨頭後方", "B": "肱骨內髁和鷹嘴突之間", "C": "肱骨外髁前方", "D": "肱二頭肌肌腱內側"}, "images": [], "answer": "B", "explanation": "肘部尺神經位於肱骨內髁與鷹嘴突之間的尺神經溝（cubital tunnel），可在此觸診（也是肘隧道症候群好發處）。"}, {"n": 41, "stem": "有關肘關節脫臼復位後穿戴支架之敘述，下列何者正確？", "options": {"A": "若復位後肘關節仍不穩定，則支架需固定肘關節於屈曲70度", "B": "若復位後肘關節已穩定，則支架需固定肘關節於完全伸直位置", "C": "需至少固定不動4週", "D": "如同時有外側副韌帶受傷，須把前臂固定在旋前（pronation）位置"}, "images": [], "answer": "D", "explanation": "肘脫臼復位後：固定屈曲90°（不是70°）；不穩定者更需手術；外側副韌帶受傷需前臂「旋前」位置（保護外側結構）；急性期固定2-3週（不是必須4週）。題目D正確。"}, {"n": 42, "stem": "有關肱骨小頭分離性骨軟骨炎（osteochondritis dissecans of the capitellum）的治療原則，下列敘述何者正確？", "options": {"A": "肘部患處尚未出現游離碎片（loose bodies）之階段方為保守治療之適應症", "B": "鼓勵繼續使用患處，以增強血液循環", "C": "只針對肘部執行柔軟度運動", "D": "經由治療，軟骨骨折或骨分離的癒合時間最多約需三個月"}, "images": [], "answer": "A", "explanation": "肱骨小頭分離性骨軟骨炎（OCD）保守治療適用於「無游離碎片」的早期階段。出現碎片需手術。其他選項錯誤。"}, {"n": 43, "stem": "下列何者不屬於腕部三角纖維軟骨複合體損傷（triangular fibrocartilage complex lesion）之症狀？", "options": {"A": "腕部尺側疼痛", "B": "前臂旋前或旋後動作伴隨腕關節之捻髮音（crepitus）", "C": "遠端橈尺關節不穩定", "D": "尺側伸腕肌肌腱半脫位"}, "images": [], "answer": "D", "explanation": "TFCC損傷症狀：腕尺側痛、旋前/旋後伴隨捻髮音、DRUJ不穩定。「尺側伸腕肌肌腱半脫位」屬獨立病變。"}, {"n": 44, "stem": "病患抱怨使用電腦一段時間之後，在大拇指、食指、中指和無名指橈側指腹出現感覺異常。下列那一測試最\n可能誘發病患的症狀？", "options": {"A": "hand elevation test", "B": "Froment's \"paper\" sign", "C": "piano keys test", "D": "Watson test"}, "images": [], "answer": "A", "explanation": "腕隧道症候群症狀（拇/食/中/無名指橈側麻）：Hand elevation test（雙手高舉1-2分鐘誘發症狀）為典型。Froment為尺神經測試；Piano keys為DRUJ；Watson為舟狀骨。"}, {"n": 45, "stem": "有關腕隧道症候群的敘述，下列何者正確？①可能有小魚際肌（hypothenar muscles）萎縮 ②可能有外側蚓\n狀肌萎縮 ③好發於40～60歲男性作業員 ④懷孕婦女有較高的發生率 ⑤關節炎也是造成腕隧道症候群的\n原因之一", "options": {"A": "①③⑤", "B": "僅①③", "C": "②④⑤", "D": "僅②④"}, "images": [], "answer": "C", "explanation": "腕隧道症候群：①「外側」蚓狀肌（拇/食指側）萎縮（小魚際肌由尺神經支配，題敘①錯誤）；④懷孕婦女（水腫）發生率高；⑤關節炎（RA、OA）為原因。題答C（②④⑤）。"}, {"n": 46, "stem": "有關手部變形及神經損傷，下列敘述何者錯誤？", "options": {"A": "猿猴手變形（ape hand）由正中神經損傷造成", "B": "槌狀指（mallet finger）由尺神經損傷造成", "C": "爪形指（claw finger）由正中神經及尺神經損傷造成", "D": "垂腕（drop wrist）由橈神經損傷造成"}, "images": [], "answer": "B", "explanation": "槌狀指（mallet finger）由伸指肌肌腱遠端撕裂造成（不是尺神經損傷）。猿猴手由正中神經損傷；爪形指由尺神經（合併正中神經）；垂腕由橈神經。"}, {"n": 47, "stem": "關於髖關節構造的敘述，下列何者錯誤？", "options": {"A": "髖臼的開口方向為向外、向前且向下", "B": "髖關節和肩關節結構相似，最大不同在於肩關節有肩唇的結構以增加穩定度，髖關節骨性結構穩定，因此沒 有髖唇的結構", "C": "髖關節有髂股韌帶（iliofemoral ligament）、坐骨股骨韌帶（ischiofemoral ligament）和恥骨股骨韌帶 （pubofemoral ligaments）支撐，其中以髂股韌帶最為強韌", "D": "髖關節的休息位置（resting position）為屈曲30度，外展30度和些微外轉的位置"}, "images": [], "answer": "B", "explanation": "髖關節有「髖唇」（acetabular labrum）增加穩定度，類似肩唇結構。題敘B錯誤。"}, {"n": 48, "stem": "測試髖關節被動屈曲動作時，下列敘述何者錯誤？", "options": {"A": "髖屈曲正常活動度約為110～120度", "B": "測試時，膝關節應保持在伸直的位置，以避免股直肌的干擾", "C": "測試時，若發現髂前上棘（ASIS）開始移動時，即應停止", "D": "正常的終末感覺應該是組織擠壓（tissue approximation）或是組織牽張（tissue stretch）"}, "images": [], "answer": "B", "explanation": "髖屈被動測試：膝關節「應屈曲」以避免膕旁肌限制動作。題敘B方向錯誤。"}, {"n": 49, "stem": "有關髖關節周圍的膕旁肌拉傷（hamstring muscle strain）後期/回復期的物理治療，下列何者正確？①以次大\n等長收縮（submaximal isometric contraction）運動為主 ②逐漸增加運動重複次數，改善肌耐力 ③逐漸增加\n運動訓練阻力，協同肌群和拮抗肌群應加入訓練，增加肌力", "options": {"A": "僅①②", "B": "僅①③", "C": "①②③", "D": "僅②③"}, "images": [], "answer": "D", "explanation": "膕旁肌拉傷後期/回復期：應加強②肌耐力訓練+③漸進阻力訓練（協同+拮抗肌肉）。①次大等長收縮為早期（急性期）的訓練。"}, {"n": 50, "stem": "在股三角區（femoral triangle）可以觸診到何種異常組織？①髂恥滑囊（iliopectineal bursa） ②腫脹的淋巴\n結（swollen lymph nodes） ③股薄肌（gracilis） ④腹股溝疝氣（inguinal hernia）", "options": {"A": "①②③", "B": "僅①③", "C": "僅②④", "D": "②③④"}, "images": [], "answer": "C", "explanation": "股三角區（femoral triangle）含①髂恥滑囊、②腫脹的淋巴結、③股神經血管，及④腹股溝疝氣可觸診。但股薄肌位於大腿內側深處，不在股三角觸診範圍。題目C（②④）正確。"}, {"n": 51, "stem": "左腳單腳站時，若發生右側骨盆下降（pelvis dropping），下列處置何者最恰當？", "options": {"A": "貼紮固定右側骨盆", "B": "訓練左側腰方肌拉抬右側骨盆", "C": "給予右側髖關節電刺激，增加肌群共同收縮與髖關節穩定度", "D": "訓練左側髖外展肌群，增加髖關節穩定度"}, "images": [], "answer": "D", "explanation": "左腳單腳站時右側骨盆下降→Trendelenburg sign陽性→「左側臀中肌」無力。處置應訓練「左側髖外展肌群」以穩定骨盆。"}, {"n": 52, "stem": "下列何者會造成股四頭肌角度（Q-angle）增加？①股骨頸前傾（anteversion） ②股骨頸後傾\n（retroversion） ③脛骨向內扭轉（torsion） ④脛骨向外扭轉（torsion）", "options": {"A": "①③", "B": "①④", "C": "②③", "D": "②④"}, "images": [], "answer": "B", "explanation": "Q-angle增加：①股骨頸前傾（增加膝外翻）+ ④脛骨向外扭轉（讓Q角度變大）。"}, {"n": 53, "stem": "關於膝關節的關節囊受限模式（capsular pattern of restriction），下列敘述何者正確？", "options": {"A": "屈曲的活動度受限較明顯", "B": "伸直的活動度受限較明顯", "C": "屈曲與伸直的活動度受限程度相當", "D": "可能因年齡而有不同表現"}, "images": [], "answer": "A", "explanation": "膝關節囊受限模式：屈曲受限>伸直受限（屈曲缺損更明顯）。"}, {"n": 54, "stem": "王先生描述多年前曾有膝關節的運動傷害，近來逐漸感到關節不穩定與經常軟腳，向後跑較向前跑更困難。\n根據此病史，下列何者較為可能？", "options": {"A": "慢性內側副韌帶斷裂", "B": "慢性外側副韌帶斷裂", "C": "慢性前十字韌帶斷裂", "D": "慢性後十字韌帶斷裂"}, "images": [], "answer": "D", "explanation": "後十字韌帶（PCL）斷裂：向後跑時脛骨後移使脛股關節穩定差，多年後出現慢性不穩定與軟腳。「向後跑比向前跑更困難」為PCL病變特徵。"}, {"n": 55, "stem": "有關膝關節的愛普利測試（Apley’s test），下列敘述何者正確？", "options": {"A": "施測前須先確認患者沒有韌帶缺損的問題", "B": "測試姿勢為受測者仰臥，膝關節屈曲約45度", "C": "當施以關節分離（distraction）的力量同時旋轉脛骨，是針對半月軟骨的測試", "D": "須注意相對於健側，脛骨旋轉是否有動作受限、動作過大或任何不舒服的反應"}, "images": [], "answer": "D", "explanation": "Apley's test：俯臥膝屈90°，先施壓+旋轉測半月軟骨；再施分離+旋轉測韌帶。需注意脛骨旋轉是否有受限或過大。"}, {"n": 56, "stem": "下列那種情況可能使膝前向抽拉測試（anterior drawer test）的結果呈現偽陰性？", "options": {"A": "內側半月板後角（posterior horn）破裂", "B": "後十字韌帶斷裂", "C": "冠狀韌帶斷裂", "D": "半月板－脛骨（meniscotibial）韌帶斷裂"}, "images": [], "answer": "A", "explanation": "膝前抽拉測試偽陰性（false negative）：內側半月板後角破裂時，半月板碎片可能阻擋脛骨前移而造成偽陰性結果。其他選項都會增加位移。"}, {"n": 57, "stem": "下列有關膝前十字韌帶重建術後物理治療之敘述，何者最適當？", "options": {"A": "術後第二天開始使用被動關節活動器（CPM），角度設在10～90度，並以小腿固定帶（calf band）；避免脛 骨後向移位", "B": "術後第二天可使用雙腋下枴以部分承重練習站立", "C": "術後第五天始可穿戴膝關節支架（knee brace），膝關節固定在屈曲25度，使用雙腋下枴以部分承重練習行 走", "D": "術後三週內禁止做股四頭肌定位收縮（quadriceps setting）練習，第四週才可開始做"}, "images": [], "answer": "B", "explanation": "ACL重建術後第二天可使用雙腋下枴部分承重。CPM應由小角度開始；膝關節支架早期固定於伸直近0°；股四頭肌定位收縮早期即應做。題目B正確。"}, {"n": 58, "stem": "有關Lachman test的敘述，下列何者正確？", "options": {"A": "受測者姿勢為膝屈曲30度，且脛骨於正中位置，可得最佳測試結果", "B": "此法對於膝前十字韌帶的前內束（anteromedial bundle）較為敏感", "C": "將脛骨向前拉時，施力點最好在脛骨的後外側", "D": "若未將股骨固定好，可能得到偽陰性（false-negative）的檢查結果"}, "images": [], "answer": "D", "explanation": "Lachman test：膝屈20-30°位置最佳；對ACL前外束敏感（不是前內束）；脛骨「後內側」施力較佳；股骨未固定會偽陰性。題目D正確。"}, {"n": 59, "stem": "有關髕骨肌腱炎臨床症狀之敘述，下列何者錯誤？", "options": {"A": "運動後或久坐後造成髕骨遠端（distal pole）疼痛", "B": "多數患者無髕骨活動軌跡不良（maltracking）之問題", "C": "膝伸直肌向心／離心阻力收縮時誘發疼痛", "D": "臨床上可能呈現髕骨周圍腫脹"}, "images": [], "answer": "B", "explanation": "髕骨肌腱炎（patellar tendinopathy）：多數患者有髕骨追蹤異常或下肢生物力學問題。題敘B「無maltracking」錯誤。"}, {"n": 60, "stem": "造成骰骨疼痛（cuboid pain）的可能因素，下列何者最不常見？", "options": {"A": "腳踝內翻扭傷造成骰骨位置改變", "B": "支撐骰骨的腓骨長肌拉傷", "C": "足部過度旋前（pronated foot）影響到足部骨頭排列", "D": "足弓過高影響足部骨頭受力情況"}, "images": [], "answer": "D", "explanation": "骰骨疼痛常見原因：踝內翻扭傷、腓骨長肌拉傷、足過度旋前、下肢生物力學異常。「足弓過高」與骰骨痛較無關。"}, {"n": 61, "stem": "一位20歲的籃球選手在搶籃板落地時，腳踝呈現內翻現象，隨即在踝關節處出現腫脹與疼痛，尤其在做蹠屈\n動作時疼痛更明顯。這位選手最有可能傷及踝關節那個組織？", "options": {"A": "前距腓（anterior talofibular）韌帶", "B": "跟腓（calcaneofibular）韌帶", "C": "後距腓（posterior talofibular）韌帶", "D": "三角（deltoid）韌帶"}, "images": [], "answer": "A", "explanation": "搶籃板落地腳踝內翻→前距腓韌帶（ATFL）最易受傷（最弱、蹠屈內翻時張力最大）。後距腓、跟腓、三角韌帶受傷機制不同。"}, {"n": 62, "stem": "有關足弓與足型的臨床判斷方法，下列何者錯誤？", "options": {"A": "可藉由法斯線（Feiss' line）與楔狀骨（cuneiform）粗隆的相對位置來判斷是否為扁平足", "B": "低足弓不因承重狀態而改變，則為結構性扁平足", "C": "不承重時足弓正常，但承重時足弓較低，可為內旋足（pronated foot）", "D": "不承重時足弓正常，但承重時足弓較高，可為外旋足（supinated foot）"}, "images": [], "answer": "A", "explanation": "Feiss' line用於判斷「舟狀骨」（不是楔狀骨）相對位置以評估扁平足。"}, {"n": 63, "stem": "一位每週固定打網球的個案，最近在打球時突然小腿後側瞬間劇痛，發生時膝部完全伸直且足踝完全背屈；\n經過檢查後發現痛點在小腿後側上方偏內，且無法踮腳尖站立。最有可能是下列那個組織受傷？", "options": {"A": "比目魚肌（soleus）", "B": "腓腸肌（gastrocnemius）", "C": "阿基里斯腱（Achilles tendon）", "D": "膕肌（popliteus）"}, "images": [], "answer": "B", "explanation": "膝完全伸直+踝完全背屈時，腓腸肌（雙關節肌）兩端皆被拉到極致→突發劇痛+小腿後上內側痛+無法踮腳=典型「網球選手腿」（tennis leg），腓腸肌內側頭撕裂。"}, {"n": 64, "stem": "下列何者不是與慢性踝關節不穩定（chronic ankle instability）相關的結構性機械因子（mechanical factor）？", "options": {"A": "神經肌肉控制不良（impaired neuromuscular control）", "B": "病理性的關節鬆弛（pathologic laxity）", "C": "退化性的變化（degenerative changes）", "D": "滑膜的變化（synovial changes）"}, "images": [], "answer": "A", "explanation": "慢性踝關節不穩定相關因子：機械性（病理鬆弛、退化、滑膜變化）+功能性（神經肌肉控制不良、本體覺不佳）。「神經肌肉控制不良」屬功能性而非機械性。"}, {"n": 65, "stem": "關於蹠骨疼痛（metatarsalgia），下列敘述何者錯誤？", "options": {"A": "疼痛通常出現在蹠骨頭（metatarsal head）承重下的情況", "B": "由於關節發炎或是受傷，因此可能會造成腳趾的屈曲和伸直的力量不平衡", "C": "常因蹠趾關節過度屈曲變形（hyperflexion deformity）導致", "D": "與腳趾變形有關"}, "images": [], "answer": "C", "explanation": "Metatarsalgia（蹠骨痛）：常因蹠趾關節「過度伸直」變形（hyperextension）而非屈曲，使蹠骨頭過度承重。題敘C方向錯誤。"}, {"n": 66, "stem": "有關大腳趾僵直（hallux rigidus），下列敘述何者正確？", "options": {"A": "可能因退化性關節炎導致大腳趾蹠屈動作受限", "B": "急性型，常見於旋後足（supinated foot）年輕人身上，且雙邊同時發生", "C": "慢性型，主要發生在成人身上，常伴隨腳趾囊腫（bunion）", "D": "其鞋面常出現斜向褶痕（oblique crease）"}, "images": [], "answer": "D", "explanation": "Hallux rigidus（大腳趾僵直）：退化性關節炎導致大腳趾「背屈」（不是蹠屈）動作受限；多為慢性、成人發病；鞋面常出現斜向褶痕（因步態時推蹬以足側代償）。題目D正確。"}, {"n": 67, "stem": "一位40歲業餘長跑者抱怨小腿疼痛，肌肉緊繃且動作不協調。物理治療師檢查評估後發現病人無法做出足踝\n背屈動作，且第一與第二腳趾間的感覺有異常。以此判斷，病人最可能是下列何種狀況？", "options": {"A": "足底筋膜炎，外側蹠神經（lateral plantar nerve）受損", "B": "跗骨隧道症候群（tarsal tunnel syndrome），脛後神經（posterior tibial nerve）受損", "C": "小腿前腔室症候群（anterior compartment syndrome），深腓神經（deep peroneal nerve）受損", "D": "跟骨應力性骨折，脛前神經（anterior tibial nerve）受損"}, "images": [], "answer": "C", "explanation": "前腔室症候群（anterior compartment syndrome）：脛前肌、伸趾長肌、深腓神經受壓迫→踝背屈無力+第一二腳趾間（深腓神經支配區域）感覺 const state = {

function isCorrect(paper, n, pick) {
  const ans = DATA[paper].questions[n-1].answer;
  if (ans === "#") return true; // 一律給分
  return ans.indexOf(pick) >= 0; // single "A" or multi "AB" (X 或 Y 均給分)
}

function picksDone(paper) {
  return Object.keys(state.picks[paper]).length;
}

function score(paper) {
  let s = 0;
  for (const n in state.picks[paper]) {
    if (isCorrect(paper, parseInt(n), state.picks[paper][n])) s++;
  }
  return s;
}

function renderGrid() {
  grid.innerHTML = "";
  const qs = DATA[state.paper].questions;
  for (let i = 0; i < qs.length; i++) {
    const n = i + 1;
    const btn = document.createElement("button");
    btn.className = "gbtn";
    btn.textContent = n;
    if (state.idx[state.paper] === i && !state.viewSummary) btn.classList.add("cur");
    if (n in state.picks[state.paper]) {
      const ok = isCorrect(state.paper, n, state.picks[state.paper][n]);
      btn.classList.add(ok ? "right" : "wrong");
    }
    if (isMarked(state.paper, n)) btn.classList.add("marked");
    btn.onclick = () => { state.viewSummary = false; state.idx[state.paper] = i; render(); };
    grid.appendChild(btn);
  }
}

        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else {
      const ok = pick === correct;
      verdictHTML = `<div class="verdict ${ok ? "right" : "wrong"}">
        <h3>${ok ? "✓ 答對" : "✗ 答錯"}　·　正解：${correct}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    }
  }

  main.innerHTML = `<div class="card">

      ${i===total-1?'<button class="btn" id="finishBtn">完成本卷 / 看總結</button>':""}
    </div>
  </div>`;

  // wire up
  main.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => {
      if (locked) return;
      const k = el.getAttribute("data-k");
      state.picks[state.paper][q.n] = k;
      savePicks();
      render();
    };
  });
  $("#prevBtn").onclick = () => { if (i>0) { state.idx[state.paper] = i-1; render(); } };
  $("#nextBtn").onclick = () => { if (i<total-1) { state.idx[state.paper] = i+1; render(); } };
  $("#clearBtn").onclick = () => { delete state.picks[state.paper][q.n]; savePicks(); render(); };
  $("#markBtn").onclick = () => { toggleMark(state.paper, q.n); render(); };
  const fb = document.getElementById("finishBtn");
  if (fb) fb.onclick = () => { state.viewSummary = true; render(); };
}

    ${(()=>{ const rows=[]; for (let i=0;i<qs.length;i++){ const q=qs[i]; if (!isMarked(state.paper,q.n)) continue; const pick=state.picks[state.paper][q.n]; const stemShort = q.stem.length>50?q.stem.slice(0,50)+'…':q.stem; const tag = pick===undefined?'未作答':(q.answer==='#'?'一律給分':(pick===q.answer?'答對':'答錯')); const tagColor = pick===undefined?'var(--ink-soft)':(q.answer==='#'?'var(--yellow)':(pick===q.answer?'var(--green)':'var(--red)')); rows.push(`<div class="wrong-row mk" data-idx="${i}"><strong>★ 第 ${q.n} 題</strong><span style="color:${tagColor};">${tag}</span><span style="color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(stemShort)}</span></div>`); } return rows.length>0 ? `<div style="margin-top:14px;"><h3 style="margin:0 0 6px;">🔖 已標記題目（${rows.length}）</h3><div class="wrong-list">${rows.join('')}</div><button class="btn ghost" id="clearMarksBtn" style="margin-top:8px;font-size:13px;">清除本卷所有標記</button></div>` : ''; })()}
    <div class="nav" style="margin-top:18px;">

  document.getElementById("resetBtn2").onclick = () => { resetCurrent(); };

function render() {

function resetCurrent() {

// ===== Answer persistence (per-paper picks, saved to localStorage) =====
const PICKS_STORAGE_KEY = "nephron_110_ortho_picks_v1";
const QUIZ_ID = "ortho_110";  // unique id used when broadcasting summary

function loadPicks() {
  try {
    const s = localStorage.getItem(PICKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function savePicks() {
  try { localStorage.setItem(PICKS_STORAGE_KEY, JSON.stringify(state.picks)); } catch (e) {}
  broadcastProgress();
}

// Send a summary of progress to parent window if embedded in an iframe.
// Used by the dashboard (index.html) to show progress bars.
function broadcastProgress() {
  if (typeof window === "undefined") return;
  let target = null;
  try { if (window.parent && window.parent !== window) target = window.parent; } catch(e){}
  if (!target) return;
  try {
    const summary = { type: "quizSummary", quizId: QUIZ_ID, papers: {} };
    for (const tag of ["Q1","Q2"]) {
      const qs = DATA[tag].questions;
      const picks = state.picks[tag] || {};
      const marks = state.marks ? (state.marks[tag] || {}) : {};
      let answered = 0, correct = 0;
      for (const n in picks) {
        answered++;
        if (isCorrect(tag, parseInt(n), picks[n])) correct++;
      }
      summary.papers[tag] = {
        label: DATA[tag].label,
        total: qs.length,
        answered, correct,
        marked: Object.keys(marks).length,
      };
    }
    target.postMessage(summary, "*");
  } catch (e) {}
}

// Hydrate persisted picks now that PICKS_STORAGE_KEY and loadPicks are defined
state.picks = loadPicks();

// ===== Bookmarks (per-paper question marks, persisted to localStorage) =====
const MARKS_STORAGE_KEY = "nephron_110_ortho_marks_v1";
function loadMarks() {
  try {
    const s = localStorage.getItem(MARKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function saveMarks() {
  try { localStorage.setItem(MARKS_STORAGE_KEY, JSON.stringify(state.marks)); } catch (e) {}
  broadcastProgress();
}
function toggleMark(paper, n) {
  if (state.marks[paper][n]) delete state.marks[paper][n];
  else state.marks[paper][n] = true;
  saveMarks();
}
function isMarked(paper, n) { return !!state.marks[paper][n]; }
function clearAllMarks(paper) {
  state.marks[paper] = {};
  saveMarks();
}
function markedCount(paper) { return Object.keys(state.marks[paper]).length; }
state.marks = loadMarks();

// ===== Export / Download report =====
function _esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function _stamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function _nowStr() { return new Date().toLocaleString("zh-TW", {hour12: false}); }

function _filterQs(paper, filter) {
  const qs = DATA[paper].questions;
  const picks = state.picks[paper];
  if (filter === "all") return qs.slice();
  if (filter === "answered") return qs.filter(q => picks[q.n] !== undefined);
  if (filter === "unanswered") return qs.filter(q => picks[q.n] === undefined);
  if (filter === "wrong") {
    return qs.filter(q => {
      const p = picks[q.n];
      return p !== undefined && q.answer !== "#" && q.answer.indexOf(p) < 0;
    });
  }
  if (filter === "marked") return qs.filter(q => isMarked(paper, q.n));
  return qs.slice();
}

function _filterCounts(paper) {
  return {
    all: _filterQs(paper, "all").length,
    answered: _filterQs(paper, "answered").length,
    wrong: _filterQs(paper, "wrong").length,
    unanswered: _filterQs(paper, "unanswered").length,
    marked: _filterQs(paper, "marked").length,
  };
}

    <h1>${_esc(subjectTitle)}</h1>
    <div class="score">得分 ${correctCount} / ${total} （${pct}%）</div>
    <div class="meta">
      已作答 ${answered} 題 · 答對 ${correctCount} 題 · 答錯 ${answered - correctCount} 題 · 未作答 ${total - answered} 題 · 🔖 已標記 ${markedCount(paper)} 題<br>
      匯出範圍：<b>${filterLabel}</b>（${qs.length} 題） · 匯出時間：${_nowStr()}
    </div>
    <div class="actions">
      <button class="print-btn" onclick="window.print()">列印 / 存成 PDF</button>
    </div>
  </header>
  <main>${main}</main>
</div>
</body>
</html>`;
  return { html, fileTitle };
}

function downloadExport(filter) {
  const { html, fileTitle } = buildExportHTML(state.paper, filter);
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fileTitle + ".html";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
}

function showExportModal() {
  const modal = document.getElementById("exportModal");
  // Update counts based on current paper state
  const c = _filterCounts(state.paper);
  document.getElementById("cntAll").textContent = `(${c.all} 題)`;
  document.getElementById("cntAnswered").textContent = `(${c.answered} 題)`;
  document.getElementById("cntWrong").textContent = `(${c.wrong} 題)`;
  document.getElementById("cntUnans").textContent = `(${c.unanswered} 題)`;
  document.getElementById("cntMarked").textContent = `(${c.marked} 題)`;
  document.getElementById("exportSub").textContent =
    "本卷：" + DATA[state.paper].label + (state.paper === "Q1" ? "（114020）" : "（114090）");
  // Disable empty options
  document.querySelectorAll("#exportOpts .exp-opt").forEach(b => {
    const f = b.getAttribute("data-filter");
    b.disabled = (c[f] === 0);
  });
  modal.classList.add("show");
}
function hideExportModal() {
  document.getElementById("exportModal").classList.remove("show");
}

document.getElementById("exportBtn").onclick = showExportModal;
document.getElementById("closeExportBtn").onclick = hideExportModal;
document.getElementById("exportModal").addEventListener("click", e => {
  if (e.target.id === "exportModal") hideExportModal();
});
document.querySelectorAll("#exportOpts .exp-opt").forEach(btn => {
  btn.onclick = () => {
    const filter = btn.getAttribute("data-filter");
    if (btn.disabled) return;
    downloadExport(filter);
    hideExportModal();
  };
});

render();
// Broadcast initial state to parent (dashboard) if loaded as iframe
broadcastProgress();
</script>
</body>
</html>
