<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物理治療基礎學 — 114 年互動測驗</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --ink: #1f2933;
    --ink-soft: #52606d;
    --line: #e4e7eb;
    --primary: #1d6f9b;
    --primary-soft: #e6f1f7;
    --green: #2f9e44;
    --green-soft: #d3f9d8;
    --red: #c92a2a;
    --red-soft: #ffe3e3;
    --yellow: #d9a700;
    --yellow-soft: #fff4c2;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei",
                 "Noto Sans TC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
    font-size: 16px;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 14px 22px;
    position: sticky; top: 0; z-index: 10;
  }
  .h-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    background: #f1f3f5; border: 1px solid var(--line); color: var(--ink-soft);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .progress { color: var(--ink-soft); font-size: 14px; margin-left: auto; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 22px; max-width: 1400px; margin: 18px auto; padding: 0 22px; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; padding: 0 14px; } .sidebar { order: 2; position: static; } }
  .sidebar {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; height: fit-content; position: sticky; top: 78px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
  }
  .gbtn {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
    color: var(--ink-soft); font-size: 13px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .gbtn:hover { border-color: var(--primary); }
  .gbtn.cur { background: var(--primary); color: #fff; border-color: var(--primary); }
  .gbtn.right { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .gbtn.wrong { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .legend { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 4px; border: 1px solid var(--line); }
  .dot.r { background: var(--green-soft); border-color: var(--green); }
  .dot.w { background: var(--red-soft); border-color: var(--red); }
  .main { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .qhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .qnum { font-size: 22px; font-weight: 700; color: var(--primary); }
  .qmeta { color: var(--ink-soft); font-size: 13px; }
  .stem { font-size: 16px; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
  .qimg { display: block; max-width: 100%; max-height: 480px; margin: 8px 0; border: 1px solid var(--line); border-radius: 6px; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    transition: background .12s, border-color .12s;
    text-align: left;
    font-size: 15.5px;
    color: var(--ink);
  }
  .opt:hover:not(.locked) { background: var(--primary-soft); border-color: var(--primary); }
  .opt.locked { cursor: default; }
  .opt .label { font-weight: 700; min-width: 22px; }
  .opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .opt.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .verdict { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 14px; line-height: 1.7; }
  .verdict.right { background: var(--green-soft); color: #186b29; }
  .verdict.wrong { background: var(--red-soft); color: #861818; }
  .verdict.note { background: var(--yellow-soft); color: #6b4e00; }
  .verdict h3 { margin: 0 0 6px; font-size: 14px; }
  .nav { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    background: var(--primary); color: #fff; border: 0; padding: 9px 18px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: #fff; color: var(--red); border: 1px solid var(--red); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .summary { padding: 18px; }
  .summary h2 { margin: 0 0 8px; }
  .score { font-size: 32px; font-weight: 700; color: var(--primary); }
  .wrong-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .wrong-row { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .wrong-row:hover { background: var(--primary-soft); }
  .footer { color: var(--ink-soft); font-size: 12px; text-align: center; margin: 16px 0 30px; }

  .homelink { color: var(--soft); text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .homelink:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }


  /* Export modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,30,.45); display: none; align-items: center; justify-content: center; z-index: 100; padding: 18px; }
  .modal-bg.show { display: flex; }
  .modal-card { background: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.18); max-width: 460px; width: 100%; padding: 22px; }
  .modal-card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 700; }
  .modal-card .modal-sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; }
  .modal-card .opt-row { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
  .modal-card .exp-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; background: #f8f9fa; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left; color: var(--ink); }
  .modal-card .exp-opt:hover { background: var(--primary-soft); border-color: var(--primary); }
  .modal-card .exp-opt:disabled { opacity: 0.5; cursor: not-allowed; background: #f1f3f5; }
  .modal-card .exp-opt .count { color: var(--ink-soft); font-size: 12px; }
  .modal-card .hint { color: var(--ink-soft); font-size: 12px; line-height: 1.6; margin: 0 0 12px; }
  .modal-card .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }


  /* Bookmark / marker */
  .gbtn { position: relative; }
  .gbtn.marked::after {
    content: "★"; position: absolute; top: 1px; right: 3px;
    font-size: 10px; color: var(--yellow); line-height: 1;
    text-shadow: 0 0 2px #fff;
  }
  .markbtn {
    margin-left: auto; background: #fff; border: 1px solid var(--line);
    color: var(--ink-soft); padding: 6px 13px; border-radius: 999px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .markbtn:hover { border-color: var(--yellow); color: var(--yellow); }
  .markbtn.marked { background: var(--yellow-soft); color: #6b4e00; border-color: var(--yellow); font-weight: 600; }
  .qhead { flex-wrap: wrap; }
  .marked-badge { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--yellow-soft); color: #6b4e00; font-size: 11px; border: 1px solid var(--yellow); margin-left: 4px; }
  .wrong-row.mk { border-color: var(--yellow); }

</style>
</head>
<body>
<header>
  <div class="h-row">
    <a class="homelink" href="../../../index.html" title="回到測驗首頁">← 回首頁</a>
    <h1>物理治療基礎學 · 民國 109 年</h1>
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="Q1">第一次 (114020)</button>
      <button class="tab" data-tab="Q2">第二次 (114090)</button>
    </div>
    <div class="progress" id="progress"></div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div style="font-size:13px;color:var(--ink-soft);margin-bottom:6px;">題號（共 80 題）</div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="dot r"></i>答對</span>
      <span><i class="dot w"></i>答錯</span>
      <span style="color:var(--yellow);">★ 已標記</span>
    </div>

    <button id="summaryBtn" class="btn ghost" style="margin-top:6px;width:100%;font-size:13px;">查看本卷總結</button>
    <button id="exportBtn" class="btn ghost" style="margin-top:6px;width:100%;font-size:13px;">📤 匯出結果…</button>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="footer">資料來源：考選部 109 年第一次／第二次專技高等考試 · 物理治療師 · 物理治療基礎學</div>

<div class="modal-bg" id="exportModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h3>匯出測驗結果</h3>
    <div class="modal-sub" id="exportSub">本卷：第一次 (114020)</div>
    <div class="opt-row" id="exportOpts">
      <button class="exp-opt" data-filter="all">📄 全部題目（含詳解） <span class="count" id="cntAll"></span></button>
      <button class="exp-opt" data-filter="answered">📝 僅已作答 <span class="count" id="cntAnswered"></span></button>
      <button class="exp-opt" data-filter="wrong">❌ 僅錯題 <span class="count" id="cntWrong"></span></button>
      <button class="exp-opt" data-filter="unanswered">⏳ 僅未作答 <span class="count" id="cntUnans"></span></button>
      <button class="exp-opt" data-filter="marked">🔖 僅已標記 <span class="count" id="cntMarked"></span></button>
    </div>
    <p class="hint">將下載一份自包含的 .html 檔，可離線檢視。打開後可用瀏覽器「列印」（Ctrl/⌘+P）→「另存為 PDF」存成 PDF。</p>
    <div class="modal-actions">
      <button class="btn ghost" id="closeExportBtn">取消</button>
    </div>
  </div>
</div>

<script>

femoral nerve）"}, "images": [], "answer": "D", "explanation": "答案：D。股神經（femoral nerve）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 8, "stem": "腋神經（axillary nerve）受傷時，會影響下列那一條肌肉的動作？", "options": {"A": "胸大肌（pectoralis major）", "B": "大圓肌（teres major）", "C": "三角肌（deltoid）", "D": "闊背肌（latissimus dorsi）"}, "images": [], "answer": "C", "explanation": "答案：C。三角肌（deltoid）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 9, "stem": "下列何者含有副交感神經（parasympathetic nerve）的節前神經纖維（preganglionic fibers）？", "options": {"A": "嗅神經（olfactory nerve）", "B": "三叉神經（trigeminal nerve）", "C": "舌咽神經（glossopharyngeal nerve）", "D": "舌下神經（hypoglossal nerve）"}, "images": [], "answer": "C", "explanation": "答案：C。舌咽神經（glossopharyngeal nerve）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 10, "stem": "某甲因為中風導致語言的表達（language expression）能力喪失。請問某甲最有可能受損的大腦皮質區域為\n何？", "options": {"A": "運動前皮質（premotor cortex）", "B": "布洛卡氏區（Broca's area）", "C": "中央前回（precentral gyrus）", "D": "沃尼克氏區（Wernicke's area）"}, "images": [], "answer": "B", "explanation": "答案：B。布洛卡氏區（Broca's area）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 11, "stem": "下列關於突觸（synapse）的敘述，何者正確？", "options": {"A": "為兩個神經元直接接觸的構造", "B": "突觸的位置只位於神經元本體", "C": "突觸小泡（synaptic vesicle）的釋放過程需要能量供給", "D": "突觸小泡（synaptic vesicle）內的神經傳導物質皆為興奮性的神經傳導物質（excitatory neurotransmitter）"}, "images": [], "answer": "C", "explanation": "答案：C。突觸小泡（synaptic vesicle）的釋放過程需要能量供給—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 12, "stem": "下列關於脊髓（spinal cord）的敘述，何者錯誤？", "options": {"A": "中央H形的構造為灰質（gray matter），主要是神經元細胞本體聚集處", "B": "白質內有許多上行（ascending）與下行（descending）神經路徑", "C": "脊髓最末端處稱為脊髓圓錐（conus medullaris），約略在第一、二薦椎高度", "D": "感覺神經元可於灰質內與運動神經元形成突觸（synapse），負責脊髓反射（spinal reflex）"}, "images": [], "answer": "C", "explanation": "答案：C。脊髓最末端處稱為脊髓圓錐（conus medullaris），約略在第一、二薦椎高度—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 13, "stem": "血管收縮（vasoconstriction）是因血管壁內的平滑肌收縮所致。此平滑肌主要位於血管壁的那一層？", "options": {"A": "內層（tunica intima）", "B": "內皮下層（subendothelial layer）", "C": "中層（tunica media）", "D": "外層（tunica externa）"}, "images": [], "answer": "C", "explan 節的擠壓力"}, "images": [], "answer": "B", "explanation": "答案：B。重力與薦髂關節面的吻合度—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 65, "stem": "仰臥起坐時，左肩由靠近右膝處回躺到床面，主要負責的肌肉為何？", "options": {"A": "右腹內斜肌，腹直肌", "B": "左腹內斜肌，右腹外斜肌", "C": "左腹外斜肌，豎脊肌", "D": "左腹外斜肌，右腹內斜肌"}, "images": [], "answer": "D", "explanation": "答案：D。左腹外斜肌，右腹內斜肌—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 66, "stem": "下列何者不是下腰椎可以有效地承受相當大的彎曲力量的原因？", "options": {"A": "後脊椎韌帶的被動力量", "B": "豎脊肌的出力", "C": "胸腰筋膜的協助", "D": "髖伸肌的出力"}, "images": [], "answer": "B", "explanation": "答案：B。豎脊肌的出力—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 67, "stem": "有關舌骨上肌群（suprahyoid muscles）的功能，下列何者正確？①上舉（elevation）舌骨\n②下沉\n③穩定頸椎\n④協助吐氣\n（depression）下頷骨", "options": {"A": "僅②④", "B": "僅①③", "C": "僅①②③", "D": "①②③④"}, "images": [], "answer": "C", "explanation": "答案：C。僅①②③—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 68, "stem": "執行下頷骨向左側移（left lateral excursion of the mandible）活動時，需要那些肌肉參與？①內翼肌（medial\n②外翼肌（lateral pterygoid muscle）\n③咬肌（masseter）\n④顳肌（temporalis）\npterygoid muscle）", "options": {"A": "僅①②", "B": "僅③④", "C": "僅①②③", "D": "①②③④"}, "images": [], "answer": "D", "explanation": "答案：D。①②③④—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 69, "stem": "一位腹肌與背伸肌麻痺的小兒麻痺病人，其站立姿勢將為下列何者？", "options": {"A": "輕微軀幹後仰，骨盆前傾，以增加腹肌的張力", "B": "輕微軀幹後仰，骨盆後傾，以增加髂腰肌（iliopsoas）的張力", "C": "輕微軀幹前彎，骨盆前傾，以增加背伸肌的張力", "D": "輕微軀幹前彎，骨盆後傾，以增加胸腰筋膜（thoracolumbar fascia）的張力"}, "images": [], "answer": "D", "explanation": "答案：D。輕微軀幹前彎，骨盆後傾，以增加胸腰筋膜（thoracolumbar fascia）的張力—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 70, "stem": "下列何者不是老年步態的特徵？", "options": {"A": "步長變短", "B": "步速變慢", "C": "站立期變長", "D": "擺盪期變長"}, "images": [], "answer": "D", "explanation": "答案：D。擺盪期變長—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 71, "stem": "有關正常站立姿勢的敘述，下列何者錯誤？", "options": {"A": "重力線落在腳踝關節前方", "B": "為了維持站立平衡，腓腸肌用力多於比目魚肌", "C": "重力線落在膝關節的前方", "D": "重力線在膝關節形成伸直的力矩"}, "images": [], "answer": "B", "explanation": "答案：B。為了維持站立平衡，腓腸肌用力多於比目魚肌—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 72, "stem": "有關旋前足（pronated foot）的站姿，下列敘述何者錯誤？", "options": {"A": "導致後足外翻", "B": "伴隨髖關節 短跑運動中，為增加擺盪肢的速度，會採用下列何種訓練策略？", "options": {"A": "腳不要抬太高，以縮短擺盪軌跡長度（path length）", "B": "腳要抬高，以增加膝蓋彎曲，縮小迴轉半徑（radius of gyration）", "C": "要抬高大腿使下肢重心升高靠近身體質心，以達儲能效果", "D": "腳踝蹠屈使小腿呈流線狀，以降低空氣阻力有利下肢擺盪"}, "images": [], "answer": "B", "explanation": "答案：B。腳要抬高，以增加膝蓋彎曲，縮小迴轉半徑（radius of gyration）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 77, "stem": "承受張應力時，下列何種組織的彈性模量在拉長變形50%以前尚未有明顯增加，但超過50%時則會急遽增\n加？", "options": {"A": "關節軟骨", "B": "黃韌帶", "C": "肌腱", "D": "周邊神經"}, "images": [], "answer": "B", "explanation": "答案：B。黃韌帶—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 78, "stem": "當腰椎受到外在屈曲力矩時，下列何者產生最大的對抗力矩？", "options": {"A": "椎間盤", "B": "黃韌帶", "C": "棘間韌帶", "D": "關節囊"}, "images": [], "answer": "D", "explanation": "答案：D。關節囊—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 79, "stem": "在冠狀面上髖關節為正中位置時，下列何肌肉於髖關節外展擁有最大機械性優勢？", "options": {"A": "梨狀肌", "B": "縫匠肌", "C": "闊筋膜張肌", "D": "臀中肌"}, "images": [], "answer": "D", "explanation": "答案：D。臀中肌—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 80, "stem": "髕股骨關節疼痛病患於肌力訓練時，下列何者最可能因過度增加髕股骨關節（patellofemoral joint）壓力而導\n致疼痛？", "options": {"A": "使用大腿推蹬（leg press）機，於膝關節伸直到屈曲45度間做重量訓練", "B": "使用坐式膝伸直訓練機，於膝關節伸直到屈曲45度間做重量訓練", "C": "雙腿微蹲，於膝關節伸直到屈曲45度間做重量訓練", "D": "於髖關節正中位置至伸直15度間，做臀大肌重量訓練"}, "images": [], "answer": "B", "explanation": "答案：B。使用坐式膝伸直訓練機，於膝關節伸直到屈曲45度間做重量訓練—此選項為正確敘述，依物理治療學相關知識為標準答案。"}]}, "Q2": {"label": "第二次", "questions": [{"n": 1, "stem": "下列關於肋骨（ribs）的敘述，何者錯誤？", "options": {"A": "共有十二對", "B": "第一至第七對肋骨稱為真肋（true ribs）", "C": "第八至第十對肋骨稱為浮肋（floating ribs）", "D": "肋骨下緣具有肋溝（costal groove），有肋間血管及神經經過"}, "images": [], "answer": "C", "explanation": "答案：C。第八至第十對肋骨稱為浮肋（floating ribs）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 2, "stem": "下列蝶骨大翼（greater wing of sphenoid bone）上的孔洞由前至後的正確順序為何？", "options": {"A": "卵圓孔（foramen ovale）、圓孔（foramen rotundum）、棘孔（foramen spinosum）", "B": "圓孔（foramen rotundum）、棘孔（foramen spinosum）、卵圓孔（foramen ovale）", "C": "棘孔（foramen spinosum）、卵圓孔（foramen ovale）、圓孔（foramen rotundum）", "D": "圓孔（foramen rotundum）、卵圓孔（foramen ovale）、棘孔（foramen spinosum）"}, "images": [], "answer": "D", "explanation": "答案：D。圓孔（foramen rotundum）、卵圓孔（foramen ovale）、棘孔（foramen spinosum）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 3, "stem": "下列韌帶（ligament）與其功能的敘述，何者正確？", "options": {"A": "前十字韌帶（anterior cruciate ligament）防止脛骨（tibia）過度向後位移", "B": "後十字韌帶（posterior cruciate ligament）防止股骨（femur）過度向後位移", "C": "環狀韌帶（anular ligament）防止橈骨頭（head of radius）自橈尺近側關節（proximal radioulnar joint）脫落", "D": "坐骨股韌帶（ischiofemoral ligament）防止髖關節（hip joint）過度外側旋轉（lateral rotation）"}, "images": [], "answer": "C", "explanation": "答案：C。環狀韌帶（anular ligament）防止橈骨頭（head of radius）自橈尺近側關節（proximal radioulnar joint）脫落—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 4, "stem": "下列有關心肌（cardiac muscle）的敘述，何者錯誤？", "options": {"A": "心肌細胞具有分岔（branching）", "B": "每個心肌細胞皆為多核（multinuclei）", "C": "具有間隙接合（gap junction）", "D": "受自主神經系統所調控"}, "images": [], "answer": "B", "explanation": "答案：B。每個心肌細胞皆為多核（multinuclei）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 5, "stem": "下列那塊肌肉可將下頜骨（mandible）上提而使嘴巴關閉？", "options": {"A": "顳肌（temporalis）", "B": "頰肌（buccinator）", "C": "外翼肌（lateral pterygoid）", "D": "頦肌（mentalis）"}, "images": [], "answer": "A", "explanation": "答案：A。顳肌（temporalis）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 6, "stem": "下列有關肋間肌（intercostal muscles）的敘述，何者錯誤？", "options": {"A": "外肋間肌（external intercostal muscle）可協助吸氣（inspiration）", "B": "內肋間肌（internal  intercostal muscle）的肌肉纖維走向為由後下往前上方斜行", "C": "內肋間肌（internal intercostal muscle）可上提肋骨", "D": "外肋間肌（external intercostal muscle）由肋間神經（intercostal nerve）支配"}, "images": [], "answer": "C", "explanation": "答案：C。內肋間肌（internal intercostal muscle）可上提肋骨—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 7, "stem": "下列那一條肌肉收縮時，可以伸直大腿（extension of thigh）及屈曲小腿（flexion of leg）？", "options": {"A": "縫匠肌（sartorius）", "B": "股二頭肌（biceps femoris）", "C": "股中間肌（vastus intermedius）", "D": "股直肌（rectus femoris）"}, "images": [], "answer": "B", "explanation": "答案：B。股二頭肌（biceps femoris）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 8, "stem": "男性的陰莖勃起（erection of penis）主要是由下列何者刺激所導致？", "options": {"A": "交感神經（sympathetic nerve）", "B": "副交感神經（parasympathetic nerve）", "C": "閉孔神經（obturator nerve）", "D": "股神經（femoral nerve）"}, "images": [], "answer": "B", "explanation": "答案：B。副交感神經（parasympathetic nerve）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 9, "stem": "下列關於腦脊膜（meninges）的敘述，何者正確？", "options": {"A": "由外到內，依序有三層，分別為：軟膜（pia mater）、蜘蛛膜（arachnoid mater）、硬膜（dura mater）", "B": "三層腦脊膜（meninges）緊密貼合，提供中樞神經系統最有效的保護", "C": "脊髓外部有一往兩側延伸之齒狀韌帶（denticulate ligament），此為軟膜（pia mater）延伸的構造", "D": "大腦的硬膜（dura mater）並無緊貼著頭蓋骨，其外的空隙可作為腦部受撞擊時的緩衝空間"}, "images": [], "answer": "C", "explanation": "答案：C。脊髓外部有一往兩側延伸之齒狀韌帶（denticulate ligament），此為軟膜（pia mater）延伸的構造—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 10, "stem": "下列關於腦幹（brain stem）的敘述，何者錯誤？", "options": {"A": "由吻端（rostral）到尾端（caudal）依序分為中腦（midbrain）、橋腦（pons）、延腦（medulla oblongata）", "B": "內部包含有上行（ascending）與下行（descending）的神經路徑（tract）", "C": "大腦腳（cerebral peduncle）位於中腦（midbrain）的腹側", "D": "無神經路徑連繫腦幹和小腦(cerebellum)之間"}, "images": [], "answer": "D", "explanation": "答案：D。無神經路徑連繫腦幹和小腦(cerebellum)之間—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 11, "stem": "下列關於周邊神經系統（peripheral nervous system）的敘述，何者正確？", "options": {"A": "神經元為了接受最多的訊息，外形皆為多極性神經元（multipolar neuron）", "B": "自主神經系統（autonomic nervous system）負責本體感覺（proprioception）的傳遞", "C": "感覺神經纖維都有髓鞘（myelin sheath）包覆，以維持正常功能", "D": "骨骼肌內有感覺受器（sensory receptor），可回饋骨骼肌的收縮程度"}, "images": [], "answer": "D", "explanation": "答案：D。骨骼肌內有感覺受器（sensory receptor），可回饋骨骼肌的收縮程度—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 12, "stem": "林同學出現大腿內側肌肉無力，且無法往內側併攏的症狀。最有可能受傷的神經為何？", "options": {"A": "股神經（femoral nerve）", "B": "脛神經（tibial nerve）", "C": "閉孔神經（obturator nerve）", "D": "坐骨神經（sciatic nerve）"}, "images": [], "answer": "C", "explanation": "答案：C。閉孔神經（obturator nerve）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 13, "stem": "下列何處可最清楚地聽到主動脈半月瓣（aortic semilunar valve）的心音（heart sound）？", "options": {"A": "右側胸骨緣（sternal margin）的第二肋間（intercostal space）處", "B": "左側胸骨緣（sternal margin）的第二肋間（intercostal space）處", "C": "左側鎖骨中線（midline of clavicle）與第五肋間（intercostal space）交會處", "D": "右側胸骨緣（sternal margin ", "D": "副甲狀腺的嗜酸細胞（oxyphil cells）為主要的內分泌細胞"}, "images": [], "answer": "B", "explanation": "答案：B。甲狀腺有兩葉；副甲狀腺通常有四顆，位於甲狀腺後方—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 20, "stem": "皮膚的附屬構造（appendages of skin）是由下列何者直接衍生形成？", "options": {"A": "皮下組織（hypodermis）中的脂肪細胞（adipocyte）", "B": "真皮（dermis）中的纖維母細胞（fibroblast）", "C": "表皮（epidermis）的上皮細胞（epithelial cell）", "D": "豎毛肌（arrector pili）的肌母細胞（myoblast）"}, "images": [], "answer": "C", "explanation": "答案：C。表皮（epidermis）的上皮細胞（epithelial cell）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 21, "stem": "有關骨骼肌結構，下列敘述何者正確？", "options": {"A": "肌凝蛋白（myosin）是細肌絲（thin filaments）上的主要蛋白質", "B": "粗細肌絲（thick and thin filaments）之間的滑動是肌肉收縮的主要機制", "C": "每根粗肌絲（thick filaments）的兩端固定在M線（M-line）上", "D": "肌肉在被動離心收縮時所產生的動作可用肌絲滑動理論（sliding filament theory）解釋"}, "images": [], "answer": "B", "explanation": "答案：B。粗細肌絲（thick and thin filaments）之間的滑動是肌肉收縮的主要機制—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 22, "stem": "動作電位（action potential）產生與傳導過程之特徵，下列何者錯誤？", "options": {"A": "產生動作電位前，膜電位需達到閾值（threshold）", "B": "動作電位產生遵守全或無定律（all-or-none principle）", "C": "具有髓鞘包覆之軸突其動作電位傳導是以跳耀方式進行", "D": "半徑大無髓鞘包覆之軸突其動作電位傳導速度慢於半徑小無髓鞘包覆之軸突"}, "images": [], "answer": "D", "explanation": "答案：D。半徑大無髓鞘包覆之軸突其動作電位傳導速度慢於半徑小無髓鞘包覆之軸突—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 23, "stem": "下列何者為舉重運動的主要能量來源？", "options": {"A": "脂肪代謝系統", "B": "乳酸系統", "C": "有氧系統", "D": "三磷酸腺苷－磷酸肌酸系統（ATP-PC system）"}, "images": [], "answer": "D", "explanation": "答案：D。三磷酸腺苷－磷酸肌酸系統（ATP-PC system）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 24, "stem": "兒童與青少年發展過程中，血液裡胰島素樣生長因子（Insulin-like growth factor 1, IGF-1）濃度，約在幾歲時\n上升最快？", "options": {"A": "1到5歲", "B": "7到11歲", "C": "13到17歲", "D": "19到23歲"}, "images": [], "answer": "C", "explanation": "答案：C。13到17歲—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 25, "stem": "下列何者為阻力運動訓練最主要效果？", "options": {"A": "骨骼肌細胞數目大量增加", "B": "骨骼肌細胞大小顯著增加", "C": "骨骼肌內粒線體密度增加", "D": "體脂肪比例增加"}, "images": [], "answer": "B", "explanation": "答案：B。骨骼肌細胞大小顯著增加—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 26, "stem": "有關內分泌激素的分泌和儲存，下列敘述何者錯誤？", "options": {"A": "所有蛋白質激素都是由顆粒內質網所製造", "B": "顆粒內質網所製造的分子往往比最後分泌出去的激素分子小，稱為前原激素（preprohormone）", "C": "由酪氨酸（tyrosine）衍生出的激素，是在胞質中經酶作用而合成的", "D": "類固醇激素通常在細胞中存有大量激素的前驅物，在適當刺激下，能在短時間把前驅物轉化為激素"}, "images": [], "answer": "B", "explanation": "答案：B。顆粒內質網所製造的分子往往比最後分泌出去的激素分子小，稱為前原激素（preprohormone）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 27, "stem": "若考量能讓飛行員在短時間內保持較佳的暗適應效果，在任務執行前可配戴那種顏色的眼鏡來減少暗適應所\n需的時間？", "options": {"A": "藍色", "B": "綠色", "C": "紅色", "D": "黃色"}, "images": [], "answer": "C", "explanation": "答案：C。紅色—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 28, "stem": "生長素對醣類代謝的影響，下列敘述何者錯誤？", "options": {"A": "減少以葡萄糖作為能量消耗", "B": "抑制肝醣形成", "C": "增加胰島素分泌", "D": "使細胞對胰島素的敏感度降低"}, "images": [], "answer": "B", "explanation": "答案：B。抑制肝醣形成—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 29, "stem": "下列何種賀爾蒙與動脈硬化、末稍血管疾病最不相關？", "options": {"A": "甲狀腺素", "B": "抗利尿激素", "C": "腎上腺素", "D": "生長素"}, "images": [], "answer": "B", "explanation": "答案：B。抗利尿激素—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 30, "stem": "當一個人因為車禍而造成脊髓的右半側受到完全傷害時，也就是所謂的布朗斯夸症候群（Brown-Sequard\nsyndrome）。下列何者是其最可能表現出之臨床症狀？①受傷節以下左側輕觸覺喪失 ②受傷節以下左側溫\n度覺與痛覺喪失 ③受傷節以下左側本體感覺喪失 ④受傷節以下右側肢體運動功能喪失", "options": {"A": "僅①③", "B": "僅②④", "C": "僅①②③", "D": "①②③④"}, "images": [], "answer": "B", "explanation": "答案：B。僅②④—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 31, "stem": "下列何者是主要的吸氣肌？", "options": {"A": "腹肌（abdominal muscles）與內肋間肌（internal intercostal muscles）", "B": "橫膈肌（diaphragm）與外肋間肌（external intercostal muscles）", "C": "橫膈肌（diaphragm）與內肋間肌（internal intercostal muscles）", "D": "橫膈肌（diaphragm）與腹肌（abdominal muscles）"}, "images": [], "answer": "B", "explanation": "答案：B。橫膈肌（diaphragm）與外肋間肌（external intercostal muscles）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 32, "stem": "下圖為正常呼吸時，那種壓力的變化情形？", "options": {"A": "肋膜間壓（intrapleural pressure）", "B": "肺泡壓（alveolar pressure）", "C": "跨肺壓（transpulmonary pressure）", "D": "呼吸系統壓（respiratory system pressure）"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAArIAAAHFCAAAAAAr3UW4AAAACXBIWXMAAA7EAAAOxAGVKw4bAADUR0lEQVR4nOx9B0BU2bn/papbsslu2iZ5SV7y }, "images": [], "answer": "C", "explanation": "答案：C。維生素D—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 40, "stem": "關於局部發炎反應（local inflammation）的敘述，下列何者錯誤？", "options": {"A": "發炎反應起始於吞噬作用與補體活化作用的非專一性（nonspecific）機制", "B": "損傷區域釋放的趨化因子（chemotactic factors），例如補體蛋白或細菌產物，會吸引白血球移向感染部位， 首先抵達者是T淋巴球（T lymphocytes）", "C": "肥大細胞（mast cells）在發炎時會釋放組織胺（histamine）使微血管通透性增加，促使更多白血球進入感染 區", "D": "經過一段時間後，B淋巴球（B lymphocytes）受到刺激並產生專一性（specific）抗原的抗體以對抗入侵的細 菌"}, "images": [], "answer": "B", "explanation": "答案：B。損傷區域釋放的趨化因子（chemotactic factors），例如補體蛋白或細菌產物，會吸引白血球移向感染部位， 首先抵達者是T淋巴球（T lymphocy—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 41, "stem": "下列關於動作學上緊密排列位置（close-packed position）與鬆弛排列位置（loose-packed position）的敘述，何\n者錯誤？", "options": {"A": "係指肌肉的拉緊與鬆弛", "B": "緊密排列位置係具有最大緊貼一致性（congruency）的位置", "C": "膝關節的緊密排列位置是在完全伸直（full extension）的位置", "D": "鬆弛排列位置增加關節的附屬動作（accessory movement）"}, "images": [], "answer": "A", "explanation": "答案：A。係指肌肉的拉緊與鬆弛—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 42, "stem": "關於關節面的動作特性敘述，下列何者錯誤？", "options": {"A": "肱橈關節（humeroradial joint）：單軸旋轉（spin）", "B": "寰樞關節（atlanto-axial joint）：單軸旋轉(spin）", "C": "跗骨間關節（inter-tarsal joint）：移行（translation）或轉動（rotation）", "D": "第二指到第四指的腕掌關節（carpometacarpal joint ）：滑行（glide）"}, "images": [], "answer": "#", "explanation": "本題公告一律給分（答案不限）。題幹：關於關節面的動作特性敘述，下列何者錯誤？…可能因題意不清、選項皆有爭議或圖表不明確等原因，考選部裁定一律給分。"}, {"n": 43, "stem": "同一骨骼肌纖維以醣代謝方式、肌球蛋白三磷酸腺苷酶（myosin ATPase）活動程度、肌球蛋白重鏈型態\n（myosin heavy chain, MHC）三種方法分類並依序配對，下列何者正確？", "options": {"A": "慢氧化纖維=Type  IIA 肌球蛋白三磷酸腺苷酶纖維=MHC I纖維", "B": "快速氧化糖酵解纖維=Type I 肌球蛋白三磷酸腺苷酶纖維=MHC IIA纖維", "C": "快速氧化糖酵解纖維=Type IIB 肌球蛋白三磷酸腺苷酶纖維=MHC IIB纖維", "D": "快速糖酵解纖維=Type IIX 肌球蛋白三磷酸腺苷酶纖維=MHC IIX纖維"}, "images": [], "answer": "D", "explanation": "答案：D。快速糖酵解纖維=Type IIX 肌球蛋白三磷酸腺苷酶纖維=MHC IIX纖維—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 44, "stem": "羽狀肌纖維在下列那一個羽狀角度（pennation angle）下收縮所產生的力量最大？", "options": {"A": "10度", "B": "30度", "C": "60度", "D": "90度"}, "images": [], "answer": "A", "explanation": "答案：A。10度—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 45, "stem": "有關胸鎖關節鎖骨相對於胸骨前突（protraction）之敘述，下列何者錯誤？", "options": {"A": "鎖骨前突最大動作發生在手臂向前伸到最遠", "B": "鎖骨前突時，肋骨鎖骨韌帶後束會變緊", "C": "肩胛之後縮肌群如菱形肌（rhomboid）會限制鎖骨前突至極限", "D": "鎖骨的前突會合併肩胛骨的縮回（retraction）"}, "images": [], "answer": "D", "explanation": "答案：D。鎖骨的前突會合併肩胛骨的縮回（retraction）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 46, "stem": "美式足球員因外側上方的外力撞擊肩峰而造成鎖肩峰關節脫位（acromioclavicular dislocation），下列那些韌\n帶最易伴隨拉傷？①喙肱韌帶（coracohumeral ligament） ②肩鎖韌帶（acromioclavicular ligament） ③錐\n狀韌帶（conoid ligament） ④菱形韌帶（trapezoid ligament）", "options": {"A": "①②③", "B": "①②④", "C": "①③④", "D": "②③④"}, "images": [], "answer": "D", "explanation": "答案：D。②③④—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 47, "stem": "有關正常肩膀外展180度的動作，不包含下列那一個動作？", "options": {"A": "鎖骨後縮（retraction of clavicle）", "B": "鎖骨後轉（posterior rotation of clavicle）", "C": "肩胛前傾（anterior tilt of scapula）", "D": "肩胛外轉（external rotation of scapula）"}, "images": [], "answer": "C", "explanation": "答案：C。肩胛前傾（anterior tilt of scapula）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 48, "stem": "下列那一條肌肉不參與肩胛骨向下旋轉的動作？", "options": {"A": "菱形肌", "B": "胸大肌", "C": "提肩胛肌", "D": "胸小肌"}, "images": [], "answer": "B", "explanation": "答案：B。胸大肌—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 49, "stem": "下列那一條肌肉不是前臂旋後肌？", "options": {"A": "伸食指肌（extensor indicis）", "B": "伸拇長肌（extensor pollicis longus）", "C": "尺側伸腕肌（extensor carpi ulnaris）", "D": "橈側伸腕長肌（extensor carpi radialis longus）"}, "images": [], "answer": "C", "explanation": "答案：C。尺側伸腕肌（extensor carpi ulnaris）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 50, "stem": "一位頸椎第六節損傷且四肢癱瘓（tetraplegia）的病人，屈指肌和伸指肌幾乎麻痺只剩伸腕肌群功能完整，下\n列敘述何者錯誤？", "options": {"A": "可藉用肌腱固定動作（tenodesis action）來抓一紙杯", "B": "可藉重力使腕關節屈曲以張開手部", "C": "可藉用伸腕肌群收縮產生手部屈側的被動張力以撐住紙杯", "D": "伸指肌被拉緊以產生維持手指背側的張力"}, "images": [], "answer": "D", "explanation": "答案：D。伸指肌被拉緊以產生維持手指背側的張力—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 51, "stem": "下列那個肌肉不是手指伸直動作肌肉？", "options": {"A": "伸指肌", "B": "掌面骨間肌", "C": "掌短肌", "D": "蚓狀肌"}, "images": [], "answer": "C", "explanation": "答案：C。掌短肌—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 52, "stem": "有關手掌內部（intrinsic）和外部（extrinsic）肌肉的收縮，下列敘述何者錯誤？", "options": {"A": "手掌內部肌肉不包括蚓狀肌（lumbricals）", "B": "手掌外部肌肉不包括屈指短肌（flexor digitorum brevis）", "C": "手掌內部肌肉收縮產生掌指關節（metacarpophalangeal joint）屈曲與指間關節伸直", "D": "手掌外部肌肉單獨收縮產生掌指關節過度伸直（hyperextension）與指間關節屈曲"}, "images": [], "answer": "A", "explanation": "答案：A。手掌內部肌肉不包括蚓狀肌（lumbricals）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 53, "stem": "下列那種狀況代表髖臼對股骨頭的覆蓋較大？", "options": {"A": "股骨前傾（femoral anteversion）", "B": "股骨後傾（femoral retroversion）", "C": "較小的髖臼前傾角（acetabular anteversion angle）", "D": "較大的髖臼前傾角（acetabular anteversion angle）"}, "images": [], "answer": "C", "explanation": "答案：C。較小的髖臼前傾角（acetabular anteversion angle）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 54, "stem": "檢查病患股骨頸的扭轉角（torsion angle）發現有後傾（retroversion）的現象時，可能造成病患行走時腿部傾\n向什麼動作？", "options": {"A": "髖內轉", "B": "髖外轉", "C": "髖外展", "D": "髖內收"}, "images": [], "answer": "B", "explanation": "答案：B。髖外轉—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 55, "stem": "有關髖臼盂唇（acetabular labrum）的敘述，下列何者正確？", "options": {"A": "髖臼盂唇與關節內液間的互動可降低關節的尖峰壓力", "B": "髖臼盂唇混合橫向髖臼韌帶可避免股骨頭向上脫位", "C": "髖臼盂唇主要由透明關節軟骨所構成", "D": "髖臼盂唇受損時因缺乏血管組織穿入而不易癒合"}, "images": [], "answer": "A", "explanation": "答案：A。髖臼盂唇與關節內液間的互動可降低關節的尖峰壓力—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 56, "stem": "下列何肌肉之主要作用不具有產生脛骨對股骨的內轉動作？", "options": {"A": "縫匠肌（sartorius）", "B": "膕肌（popliteus）", "C": "股內側肌（vastus medialis）", "D": "半膜肌（semimembranosus）"}, "images": [], "answer": "C", "explanation": "答案：C。股內側肌（vastus medialis）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 57, "stem": "將下列肌肉以其生理截面積（physiologic cross-sectional area, PCSA）依照大小排序，其順序為何？①股中間\n肌（vastus intermedius） ②股外側肌（vastus lateralis） ③股二頭肌長頭（long head of biceps femoris） ④\n半腱肌（semitendinosus）", "options": {"A": "①②③④", "B": "②①③④", "C": "①②④③", "D": "②①④③"}, "images": [], "answer": "B", "explanation": "答案：B。②①③④—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 58, "stem": "膝關節自屈曲140度到完全伸直，髕骨與股骨的接觸面在下圖中的位置依序應為何？", "options": {"A": "①②③④", "B": "④③②①", "C": "③②①④", "D": "④①②③"}, "images": ["data:image/png tal bone）", "C": "蝶骨（sphenoid bone）", "D": "顴骨（zygomatic bone）"}, "images": [], "answer": "B", "explanation": "答案：B。枕骨（occipital bone）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 62, "stem": "有關下頜骨（mandible）在嘴巴完全張開過程中所涉及的關節運動，下列何者正確？", "options": {"A": "先以位移動作為主，再以轉動動作為主", "B": "先以轉動動作為主，再以位移動作為主", "C": "僅有轉動動作", "D": "僅有位移動作"}, "images": [], "answer": "B", "explanation": "答案：B。先以轉動動作為主，再以位移動作為主—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 63, "stem": "當臉頰兩邊上下臼齒用力咬緊時，下列那一塊肌肉較不參與收縮？", "options": {"A": "內翼肌（medial pterygoid muscles）", "B": "二腹肌（digastric muscles）", "C": "顳肌（temporalis muscles）", "D": "嚼肌（masseter muscles）"}, "images": [], "answer": "B", "explanation": "答案：B。二腹肌（digastric muscles）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 64, "stem": "當頭頸部向左邊旋轉到底時，由下列那一塊肌肉產生向心收縮？", "options": {"A": "左側胸鎖乳突肌（sternocleidomastoid）", "B": "左側多裂肌（multifidus）", "C": "右側頸半棘肌（semispinalis cervicis）", "D": "右側頭／頸夾肌（splenius capitis & cervicis）"}, "images": [], "answer": "C", "explanation": "答案：C。右側頸半棘肌（semispinalis cervicis）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 65, "stem": "有關脊柱下交叉綜合症候群（lower crossed syndrome）所導致的肌肉表現失衡，不包括下列何者？", "options": {"A": "腰大肌變緊", "B": "背部伸肌變緊", "C": "髖部伸肌變緊", "D": "腹肌拉長"}, "images": [], "answer": "C", "explanation": "答案：C。髖部伸肌變緊—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 66, "stem": "病患仰躺，右肩離床移近左膝後，當身體要躺回床面時，主要負責的肌肉及收縮型態為何？", "options": {"A": "右豎脊肌、右腰方肌－向心收縮", "B": "右腹外斜肌、左腹內斜肌－向心收縮", "C": "左腹外斜肌、右腹內斜肌－離心收縮", "D": "右腹外斜肌、左腹內斜肌－離心收縮"}, "images": [], "answer": "D", "explanation": "答案：D。右腹外斜肌、左腹內斜肌－離心收縮—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 67, "stem": "有關胸腰筋膜（thoracolumbar fascia）的敘述，下列何者錯誤？", "options": {"A": "胸腰筋膜前層覆蓋腰方肌", "B": "胸腰筋膜中層附著在腰部橫突的內側，與橫腹肌和腹外斜肌連接", "C": "在上肢固定的狀態下，闊背肌收縮會繃緊胸腰筋膜", "D": "胸腰筋膜提供了一個網膜層，包裹著豎脊肌和多裂肌"}, "images": [], "answer": "B", "explanation": "答案：B。胸腰筋膜中層附著在腰部橫突的內側，與橫腹肌和腹外斜肌連接—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 68, "stem": "下列何者不是理想坐姿的身體位置？", "options": {"A": "骨盆前傾", "B": "胸椎挺直", "C": "平的腰椎弧度", "D": "上顱頸椎稍微屈曲"}, "images": [], "answer": "C", "explanation": "答案：C。平的腰椎弧度—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 69, "stem": "有關姿勢穩定度的敘述，下列何者錯誤？", "options": {"A": "為了維持站姿的穩定度，膝關節必須產生彎曲的力矩", "B": "為了維持站姿的穩定度，踝關節必須產生下踩力矩", "C": "20至60歲成年人的站姿最為穩定", "D": "大部分的足內肌在站姿都是活躍的"}, "images": [], "answer": "D", "explanation": "答案：D。大部分的足內肌在站姿都是活躍的—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 70, "stem": "下列何者不是代償步態造成能量消耗增加的原因？", "options": {"A": "身體質量中心過多的位移", "B": "肌肉以較高強度用力", "C": "肌肉收縮時間較短", "D": "徵召額外的肌肉來幫忙"}, "images": [], "answer": "C", "explanation": "答案：C。肌肉收縮時間較短—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 71, "stem": "下圖為立定垂直跳的過程，由下蹲階段（down phase）至上蹬階段（up phase）至騰空階段（flight phase），\n有關肌肉收縮的敘述，下列何者正確？", "options": {"A": "在下蹲階段，踝關節背屈肌向心收縮", "B": "在下蹲階段，肩關節伸肌向心收縮", "C": "在上蹬階段，髖關節屈肌向心收縮", "D": "在上蹬階段，肩關節屈肌離心收縮"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAdgAAAF5CAIAAACz+6yFAAAACXBIWXMAAA7EAAAOxAGVKw4bAAK5YElEQVR4nHz96bdvVXUn/p//o0Y9ybCLIvZfLctUbILAvfecc09zz+25F9RYqaipaABFQAGj0ggCAgr2XYiWJhrKJjYQqAgSbLArbLCLDVSZUVX/we+d/RrrPdY9ZPzWgz32Z392s9Zcc81+zrWytbW1urp61lln7d27d9++fX/wB3/wH//jf/zDP/zDF77whWeeeeaepeXfnL/kJS8544wzzl5aLm5sbOxf2ubm5hlLO/fccy+66KJLL730iiuueOtb33rZ0v5yaW95y1ve/OY3v/rVrz58+HDuz51/8Rd/8drXvvblL3/5n/7pn77+9a9/05velNuuueaaK6+8Mid5/KqrrsrPt73tbd6QKznP8eqrr85feeGlS8vJ29/+9vyVj15++eX5Yi7m/osvvjhX3rK0N77xjfncn/3Zn73yla/c3t7OQP5wtP802ote9KIXv/jFGXWG//8tLeeBzKFDh9LbdDVvy6evXFo6cN111+XNl1xyie7l/a94xSvOO++8P/7jP37d6153wQUXXLS0N7zhDW9eWjqWzufZPGUsOdHD/JWe5yXglisGkpb7cwxwzj///Je97GWZiMA5/fyjP/qjzMhznvOc5z73uc9//vMNIf+ura1lEjPA3LC+vp45zRAyxSYrYw/wM30ZbAal8xlU4KxXhhZ45phRHD169MiRI5mgADDQSwf+5E/+JOd6a4LyOPjn2Zy/Y2kuuqLl/swLIMCHy5fmu67kmJHmc+lnEOzgwYPp5IEDB/YubXVpGV36/9KXvvTMpWUgmab8m0fOOeec9PmKpeVbgXwm5c///M8zL3lVBp7h/Jf/8l9yPV8BXn3Iz8xv7tnZ2cn0/df/+l+DkDkJqPOh9CSQzHctAd/NxXw0AM/1gDew9e+xY8cgc/rQYfpccCA4mS6dPHkyUA0qZjnkK8GZrIL0M//C59w5L6JMExQK5Huem4NdXp6LPnHRqS33v35pGV0+F0gGdMGEfD0jhRIZWvqfsWfUeU9em1flkVcv7cILL8z1rFmrPkBOb/OqoEEg+apXveo1r3lNECO3vWlpHg+EcyUYm+nIuKyFS5Z28dLyV7qUY16e6c4sB5gveMELsvSCtwFjTp797GcHt3PxP/yH/5BZyPVgeP7KMcs2UxOAp0t5MP/mes5zz const state = {
  paper: "Q1",
  idx: {Q1: 0, Q2: 0},
  picks: { Q1: {}, Q2: {} }, // hydrated later, after persistence block defines PICKS_STORAGE_KEY
};

const $ = sel => document.querySelector(sel);
const main = $("#main");
const grid = $("#grid");
const progressEl = $("#progress");

function isCorrect(paper, n, pick) {
  const ans = DATA[paper].questions[n-1].answer;
  if (ans === "#") return true; // 一律給分
  return ans.indexOf(pick) >= 0; // single "A" or multi "AB" (X 或 Y 均給分)
}

function picksDone(paper) {
  return Object.keys(state.picks[paper]).length;
}

function score(paper) {
  let s = 0;
  for (const n in state.picks[paper]) {
    if (isCorrect(paper, parseInt(n), state.picks[paper][n])) s++;
  }
  return s;
}

function renderGrid() {
  grid.innerHTML = "";
  const qs = DATA[state.paper].questions;
  for (let i = 0; i < qs.length; i++) {
    const n = i + 1;
    const btn = document.createElement("button");
    btn.className = "gbtn";
    btn.textContent = n;
    if (state.idx[state.paper] === i && !state.viewSummary) btn.classList.add("cur");
    if (n in state.picks[state.paper]) {
      const ok = isCorrect(state.paper, n, state.picks[state.paper][n]);
      btn.classList.add(ok ? "right" : "wrong");
    }
    if (isMarked(state.paper, n)) btn.classList.add("marked");
    btn.onclick = () => { state.viewSummary = false; state.idx[state.paper] = i; render(); };
    grid.appendChild(btn);
  }
}

function escapeHTML(s) { return s.replace(/&/g, "&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderQuestion() {
  const qs = DATA[state.paper].questions;
  const i = state.idx[state.paper];
  const q = qs[i];
  const pick = state.picks[state.paper][q.n];
  const locked = !!pick;
  const correct = q.answer;
  const total = qs.length;
  progressEl.textContent = `第 ${i+1} 題 / 共 ${total} 題　·　已作答 ${picksDone(state.paper)}　·　目前得分 ${score(state.paper)}`;

  let imgsHTML = "";
  for (const u of q.images) imgsHTML += `<img class="qimg" src="${u}" alt="題目附圖">`;

  let optsHTML = "";
  for (const k of ["A","B","C","D"]) {
    let cls = "opt";
    if (locked) {
      cls += " locked";
      const isCorrLetter = (correct !== "#" && correct.indexOf(k) >= 0);
      if (isCorrLetter) cls += " correct";
      else if (k === pick && correct !== "#") cls += " wrong";
      else if (correct === "#" && k === pick) cls += " correct";
    }
    optsHTML += `<button class="${cls}" data-k="${k}" ${locked ? "disabled" : ""}>
      <span class="label">${k}.</span><span>${escapeHTML(q.options[k] || "")}</span>
    </button>`;
  }

  let verdictHTML = "";
  if (locked) {
    if (correct === "#") {
      verdictHTML = `<div class="verdict note">
        <h3>本題經考選部公告「一律給分」</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else if (correct.length > 1) {
      const ok = correct.indexOf(pick) >= 0;
      const letters = correct.split("").join(" 或 ");
      verdictHTML = `<div class="verdict note">
        <h3>本題經考選部公告「答 ${letters} 均給分」　·　${ok ? "✓ 你的選擇 ("+pick+") 在正解內" : "✗ 你選 "+pick+"，未在正解內"}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else {
      const ok = pick === correct;
      verdictHTML = `<div class="verdict ${ok ? "right" : "wrong"}">
        <h3>${ok ? "✓ 答對" : "✗ 答錯"}　·　正解：${correct}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    }
  }

  main.innerHTML = `<div class="card">
    <div class="qhead">
      <span class="qnum">第 ${q.n} 題</span>
      <span class="qmeta">${DATA[state.paper].label}　·　${q.images.length>0?"含附圖":"純文字"}${isMarked(state.paper, q.n) ? ' <span class="marked-badge">🔖 已標記</span>' : ''}</span>
      <button class="markbtn ${isMarked(state.paper, q.n) ? "marked" : ""}" id="markBtn" title="標記此題以便日後複習">${isMarked(state.paper, q.n) ? "🔖 已標記" : "🔖 標記"}</button>
    </div>
    <div class="stem">${escapeHTML(q.stem)}</div>
    ${imgsHTML}
    <div class="opts">${optsHTML}</div>
    ${verdictHTML}
    <div class="nav">
      <button class="btn ghost" id="prevBtn" ${i===0?"disabled":""}>← 上一題</button>
      <button class="btn" id="nextBtn" ${i===total-1?"disabled":""}>下一題 →</button>
      <button class="btn ghost" id="clearBtn" ${locked?"":"disabled"}>清除本題作答</button>
      ${i===total-1?'<button class="btn" id="finishBtn">完成本卷 / 看總結</button>':""}
    </div>
  </div>`;

  // wire up
  main.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => {
      if (locked) return;
      const k = el.getAttribute("data-k");
      state.picks[state.paper][q.n] = k;
      savePicks();
      render();
    };
  });
  $("#prevBtn").onclick = () => { if (i>0) { state.idx[state.paper] = i-1; render(); } };
  $("#nextBtn").onclick = () => { if (i<total-1) { state.idx[state.paper] = i+1; render(); } };
  $("#clearBtn").onclick = () => { delete state.picks[state.paper][q.n]; savePicks(); render(); };
  $("#markBtn").onclick = () => { toggleMark(state.paper, q.n); render(); };
  const fb = document.getElementById("finishBtn");
  if (fb) fb.onclick = () => { state.viewSummary = true; render(); };
}

function renderSummary() {
  const qs = DATA[state.paper].questions;
  const total = qs.length;
  const done = picksDone(state.paper);
  const s = score(state.paper);
  const pct = ((s/total)*100).toFixed(1);

      <h3 style="margin:0 0 6px;">未作答（${unansweredRows.length}）</h3>
      <div class="wrong-list">${unansweredRows.join("")}</div>
    </div>`:""}
    ${(()=>{ const rows=[]; for (let i=0;i<qs.length;i++){ const q=qs[i]; if (!isMarked(state.paper,q.n)) continue; const pick=state.picks[state.paper][q.n]; const stemShort = q.stem.length>50?q.stem.slice(0,50)+'…':q.stem; const tag = pick===undefined?'未作答':(q.answer==='#'?'一律給分':(pick===q.answer?'答對':'答錯')); const tagColor = pick===undefined?'var(--ink-soft)':(q.answer==='#'?'var(--yellow)':(pick===q.answer?'var(--green)':'var(--red)')); rows.push(`<div class="wrong-row mk" data-idx="${i}"><strong>★ 第 ${q.n} 題</strong><span style="color:${tagColor};">${tag}</span><span style="color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(stemShort)}</span></div>`); } return rows.length>0 ? `<div style="margin-top:14px;"><h3 style="margin:0 0 6px;">🔖 已標記題目（${rows.length}）</h3><div class="wrong-list">${rows.join('')}</div><button class="btn ghost" id="clearMarksBtn" style="margin-top:8px;font-size:13px;">清除本卷所有標記</button></div>` : ''; })()}
    <div class="nav" style="margin-top:18px;">
      <button class="btn ghost" id="backBtn">← 回到題目</button>
      <button class="btn danger" id="resetBtn2">重置本卷</button>
    </div>
  </div>`;
  main.querySelectorAll(".wrong-row").forEach(el => {
    el.onclick = () => {
      state.idx[state.paper] = parseInt(el.getAttribute("data-idx"));
      state.viewSummary = false; render();
    };
  });
  document.getElementById("backBtn").onclick = () => { state.viewSummary = false; render(); };
  const cmb = document.getElementById("clearMarksBtn");
  if (cmb) cmb.onclick = () => { if (confirm("確定要清除「" + DATA[state.paper].label + "」這一卷的所有標記嗎？")) { clearAllMarks(state.paper); render(); } };
  document.getElementById("resetBtn2").onclick = () => { resetCurrent(); };
}

function render() {
  renderGrid();
  if (state.viewSummary) renderSummary();
  else renderQuestion();
}

function resetCurrent() {
  if (!confirm(`確定要清除「${DATA[state.paper].label}」這一卷的所有作答與標記嗎？`)) return;
  state.picks[state.paper] = {};
  state.marks[state.paper] = {};
  state.idx[state.paper] = 0;
  state.viewSummary = false;
  savePicks();
  saveMarks();
  render();
}

document.querySelectorAll(".tab").forEach(t => {

// ===== Answer persistence (per-paper picks, saved to localStorage) =====
const PICKS_STORAGE_KEY = "nephron_109_foundation_picks_v1";
const QUIZ_ID = "foundation_109";  // unique id used when broadcasting summary

function loadPicks() {
  try {
    const s = localStorage.getItem(PICKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function savePicks() {
  try { localStorage.setItem(PICKS_STORAGE_KEY, JSON.stringify(state.picks)); } catch (e) {}
  broadcastProgress();
}

// Send a summary of progress to parent window if embedded in an iframe.
// Used by the dashboard (index.html) to show progress bars.
function broadcastProgress() {
  if (typeof window === "undefined") return;
  let target = null;
  try { if (window.parent && window.parent !== window) target = window.parent; } catch(e){}
  if (!target) return;
  try {
    const summary = { type: "quizSummary", quizId: QUIZ_ID, papers: {} };
    for (const tag of ["Q1","Q2"]) {
      const qs = DATA[tag].questions;
      const picks = state.picks[tag] || {};
      const marks = state.marks ? (state.marks[tag] || {}) : {};
      let answered = 0, correct = 0;
      for (const n in picks) {
        answered++;
        if (isCorrect(tag, parseInt(n), picks[n])) correct++;
      }
      summary.papers[tag] = {
        label: DATA[tag].label,
        total: qs.length,
        answered, correct,
        marked: Object.keys(marks).length,
      };
    }
    target.postMessage(summary, "*");
  } catch (e) {}
}

// Hydrate persisted picks now that PICKS_STORAGE_KEY and loadPicks are defined
state.picks = loadPicks();

// ===== Bookmarks (per-paper question marks, persisted to localStorage) =====
const MARKS_STORAGE_KEY = "nephron_109_foundation_marks_v1";
function loadMarks() {
  try {
    const s = localStorage.getItem(MARKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function saveMarks() {
  try { localStorage.setItem(MARKS_STORAGE_KEY, JSON.stringify(state.marks)); } catch (e) {}
  broadcastProgress();
}
function toggleMark(paper, n) {
  if (state.marks[paper][n]) delete state.marks[paper][n];
  else state.marks[paper][n] = true;
  saveMarks();
}
function isMarked(paper, n) { return !!state.marks[paper][n]; }
function clearAllMarks(paper) {
  state.marks[paper] = {};
  saveMarks();
}
function markedCount(paper) { return Object.keys(state.marks[paper]).length; }
state.marks = loadMarks();

// ===== Export / Download report =====
function _esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function _stamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function _nowStr() { return new Date().toLocaleString("zh-TW", {hour12: false}); }

function _filterQs(paper, filter) {
  const qs = DATA[paper].questions;
  const picks = state.picks[paper];
  if (filter === "all") return qs.slice();
  if (filter === "answered") return qs.filter(q => picks[q.n] !== undefined);
  if (filter === "unanswered") return qs.filter(q => picks[q.n] === undefined);
  if (filter === "wrong") {
    return qs.filter(q => {
      const p = picks[q.n];
      return p !== undefined && q.answer !== "#" && q.answer.indexOf(p) < 0;
    });
  }
  if (filter === "marked") return qs.filter(q => isMarked(paper, q.n));
  return qs.slice();
}

function _filterCounts(paper) {
  return {
    all: _filterQs(paper, "all").length,
    answered: _filterQs(paper, "answered").length,
    wrong: _filterQs(paper, "wrong").length,
    unanswered: _filterQs(paper, "unanswered").length,
    marked: _filterQs(paper, "marked").length,
  };
}

<style>${css}</style>
</head>
<body>
<div class="wrap">
  <header class="report">
    <h1>${_esc(subjectTitle)}</h1>
    <div class="score">得分 ${correctCount} / ${total} （${pct}%）</div>
    <div class="meta">
      已作答 ${answered} 題 · 答對 ${correctCount} 題 · 答錯 ${answered - correctCount} 題 · 未作答 ${total - answered} 題 · 🔖 已標記 ${markedCount(paper)} 題<br>
      匯出範圍：<b>${filterLabel}</b>（${qs.length} 題） · 匯出時間：${_nowStr()}
    </div>
    <div class="actions">
      <button class="print-btn" onclick="window.print()">列印 / 存成 PDF</button>
    </div>
  </header>
  <main>${main}</main>
</div>
</body>
</html>`;
  return { html, fileTitle };
}

function downloadExport(filter) {
  const { html, fileTitle } = buildExportHTML(state.paper, filter);
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fileTitle + ".html";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
}

function showExportModal() {
  const modal = document.getElementById("exportModal");
  // Update counts based on current paper state
  const c = _filterCounts(state.paper);
  document.getElementById("cntAll").textContent = `(${c.all} 題)`;
  document.getElementById("cntAnswered").textContent = `(${c.answered} 題)`;
  document.getElementById("cntWrong").textContent = `(${c.wrong} 題)`;
  document.getElementById("cntUnans").textContent = `(${c.unanswered} 題)`;
  document.getElementById("cntMarked").textContent = `(${c.marked} 題)`;
  document.getElementById("exportSub").textContent =
    "本卷：" + DATA[state.paper].label + (state.paper === "Q1" ? "（114020）" : "（114090）");
  // Disable empty options
  document.querySelectorAll("#exportOpts .exp-opt").forEach(b => {
    const f = b.getAttribute("data-filter");
    b.disabled = (c[f] === 0);
  });
  modal.classList.add("show");
}
function hideExportModal() {
  document.getElementById("exportModal").classList.remove("show");
}

document.getElementById("exportBtn").onclick = showExportModal;
document.getElementById("closeExportBtn").onclick = hideExportModal;
document.getElementById("exportModal").addEventListener("click", e => {
  if (e.target.id === "exportModal") hideExportModal();
});
document.querySelectorAll("#exportOpts .exp-opt").forEach(btn => {
  btn.onclick = () => {
    const filter = btn.getAttribute("data-filter");
    if (btn.disabled) return;
    downloadExport(filter);
    hideExportModal();
  };
});

render();
// Broadcast initial state to parent (dashboard) if loaded as iframe
broadcastProgress();
</script>
</body>
</html>
