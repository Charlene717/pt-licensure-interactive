<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物理治療技術學 — 114 年互動測驗</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --ink: #1f2933;
    --ink-soft: #52606d;
    --line: #e4e7eb;
    --primary: #1d6f9b;
    --primary-soft: #e6f1f7;
    --green: #2f9e44;
    --green-soft: #d3f9d8;
    --red: #c92a2a;
    --red-soft: #ffe3e3;
    --yellow: #d9a700;
    --yellow-soft: #fff4c2;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei",
                 "Noto Sans TC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
    font-size: 16px;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 14px 22px;
    position: sticky; top: 0; z-index: 10;
  }
  .h-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    background: #f1f3f5; border: 1px solid var(--line); color: var(--ink-soft);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .progress { color: var(--ink-soft); font-size: 14px; margin-left: auto; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 22px; max-width: 1400px; margin: 18px auto; padding: 0 22px; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; padding: 0 14px; } .sidebar { order: 2; position: static; } }
  .sidebar {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; height: fit-content; position: sticky; top: 78px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
  }
  .gbtn {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
    color: var(--ink-soft); font-size: 13px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .gbtn:hover { border-color: var(--primary); }
  .gbtn.cur { background: var(--primary); color: #fff; border-color: var(--primary); }
  .gbtn.right { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .gbtn.wrong { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .legend { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 4px; border: 1px solid var(--line); }
  .dot.r { background: var(--green-soft); border-color: var(--green); }
  .dot.w { background: var(--red-soft); border-color: var(--red); }
  .main { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .qhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .qnum { font-size: 22px; font-weight: 700; color: var(--primary); }
  .qmeta { color: var(--ink-soft); font-size: 13px; }
  .stem { font-size: 16px; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
  .qimg { display: block; max-width: 100%; max-height: 480px; margin: 8px 0; border: 1px solid var(--line); border-radius: 6px; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    transition: background .12s, border-color .12s;
    text-align: left;
    font-size: 15.5px;
    color: var(--ink);
  }
  .opt:hover:not(.locked) { background: var(--primary-soft); border-color: var(--primary); }
  .opt.locked { cursor: default; }
  .opt .label { font-weight: 700; min-width: 22px; }
  .opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .opt.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .verdict { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 14px; line-height: 1.7; }
  .verdict.right { background: var(--green-soft); color: #186b29; }
  .verdict.wrong { background: var(--red-soft); color: #861818; }
  .verdict.note { background: var(--yellow-soft); color: #6b4e00; }
  .verdict h3 { margin: 0 0 6px; font-size: 14px; }
  .nav { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    background: var(--primary); color: #fff; border: 0; padding: 9px 18px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: #fff; color: var(--red); border: 1px solid var(--red); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .summary { padding: 18px; }
  .summary h2 { margin: 0 0 8px; }
  .score { font-size: 32px; font-weight: 700; color: var(--primary); }
  .wrong-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .wrong-row { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .wrong-row:hover { background: var(--primary-soft); }
  .footer { color: var(--ink-soft); font-size: 12px; text-align: center; margin: 16px 0 30px; }

  .homelink { color: var(--soft); text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .homelink:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }


  /* Export modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,30,.45); display: none; align-items: center; justify-content: center; z-index: 100; padding: 18px; }
  .modal-bg.show { display: flex; }
  .modal-card { background: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.18); max-width: 460px; width: 100%; padding: 22px; }
  .modal-card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 700; }
  .modal-card .modal-sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; }
  .modal-card .opt-row { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
  .modal-card .exp-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; background: #f8f9fa; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left; color: var(--ink); }
  .modal-card .exp-opt:hover { background: var(--primary-soft); border-color: var(--primary); }
  .modal-card .exp-opt:disabled { opacity: 0.5; cursor: not-allowed; background: #f1f3f5; }
  .modal-card .exp-opt .count { color: var(--ink-soft); font-size: 12px; }
  .modal-card .hint { color: var(--ink-soft); font-size: 12px; line-height: 1.6; margin: 0 0 12px; }
  .modal-card .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }


  /* Bookmark / marker */
  .gbtn { position: relative; }
  .gbtn.marked::after {
    content: "★"; position: absolute; top: 1px; right: 3px;
    font-size: 10px; color: var(--yellow); line-height: 1;
    text-shadow: 0 0 2px #fff;
  }
  .markbtn {
    margin-left: auto; background: #fff; border: 1px solid var(--line);
    color: var(--ink-soft); padding: 6px 13px; border-radius: 999px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .markbtn:hover { border-color: var(--yellow); color: var(--yellow); }
  .markbtn.marked { background: var(--yellow-soft); color: #6b4e00; border-color: var(--yellow); font-weight: 600; }
  .qhead { flex-wrap: wrap; }
  .marked-badge { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--yellow-soft); color: #6b4e00; font-size: 11px; border: 1px solid var(--yellow); margin-left: 4px; }
  .wrong-row.mk { border-color: var(--yellow); }

</style>
</head>

<header>

<script>
const DATA = {"Q1": {"label": "第一次", "questions": [{"n": 1, "stem": "「以相同強度之間歇波電刺激，當頻率愈高時產生的肌肉張力愈大」，發生此種現象的原理\n為何？", "options": {"A": "組織的適應現象（accommodation）", "B": "徵召的大小原則（size principle of recruitment）", "C": "時間加成作用（temporal summation）", "D": "同步作用（synchronization）"}, "images": [], "answer": "C", "explanation": "答案：C。時間加成作用（temporal summation）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 2, "stem": "在負極（cathode）之下神經細胞膜外所發生的電生理變化為何？", "options": {"A": "細胞膜外電位下降，傾向產生去極化（depolarization）", "B": "細胞膜外電位上升，傾向產生去極化（depolarization）", "C": "細胞膜外電位下降，傾向產生超極化（hyperpolarization）", "D": "細胞膜外電位上升，傾向產生超極化（hyperpolarization）"}, "images": [], "answer": "A", "explanation": "答案：A。細胞膜外電位下降，傾向產生去極化（depolarization）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 3, "stem": "依編號順序，下圖常見插座圖的電路名稱分別為何？", "options": {"A": "1=中性線，2=火線，3=地線", "B": "1=中性線，2=地線，3=火線", "C": "1=火線，2=中性線，3=地線", "D": "1=地線，2=火線，3=中性線"}, "images": [], "answer": "A", "explanation": "答案：A。1=中性線，2=火線，3=地線—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 4, "stem": "下列有關運動神經傳導檢測的敘述，何者正確？", "options": {"A": "以次大強度刺激", "B": "以感覺強度刺激", "C": "以超大強度刺激", "D": "以無感覺強度刺激"}, "images": [], "answer": "C", "explanation": "答案：C。以超大強度刺激—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 5, "stem": "下列有關肌電圖放大器的敘述，何者錯誤？", "options": {"A": "選擇性地只放大兩個紀錄電極間具有差異的訊號", "B": "選擇性地只放大特定範圍頻率的訊號", "C": "放大倍率隨頻率大小而不同", "D": "具高電阻特性"}, "images": [], "answer": "C", "explanation": "答案：C。放大倍率隨頻率大小而不同—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 6, "stem": "下列電刺激方法中那些可用來暫時降低肌肉痙攣？①直接針對痙攣肌肉進行神經肌肉電刺激\n②對痙攣肌肉進行感覺程度的電刺激 ③對痙攣肌肉與其拮抗肌進行交替性神經肌肉電刺激\n④直接針對痙攣肌肉之拮抗肌進行神經肌肉電刺激", "options": {"A": "僅①④", "B": "僅①②④", "C": "僅②③④", "D": "①②③④"}, "images": [], "answer": "D", "explanation": "答案：D。①②③④—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 7, "stem": "下列有關神經肌肉電刺激的使用禁忌，何者錯誤？", "options": {"A": "施行於發育中青少年骨骼生長板周邊部位", "B": "施行於裝置有需求型心率節律器病患胸腔區域", "C": "施行於有靜脈血栓炎現象之部位", "D": "緊鄰在使用中的透熱療儀器旁使用"}, "images": [], "answer": "A", "explanation": "答案：A。施行於發育中青少年骨骼生長板周邊部位—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 8, "stem": "治療中風後患者的垂足問題時，主動與被動電極片擺放位置依序應為：", "options": {"A": "股神經，脛前肌運動點", "B": "總腓神經，脛前肌運動點", "C": "脛前肌運動點，脛前肌肌腹肌腱交界點", "D": "脛前肌運動點，腓骨長肌肌腹遠端"}, "images": [], "answer": "B", "explanation": "答案：B。總腓神經，脛前肌運動點—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 9, "stem": "下列減緩疼痛的經皮神經電刺激形式中，何者利用Aβ纖維？", "options": {"A": "傳統式", "B": "脈叢式", "C": "短強式", "D": "針灸式"}, "images": [], "answer": "A", "explanation": "答案：A。傳統式—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 10, "stem": "根據過去的研究顯示，下列何者不是經皮神經電刺激能處置的症狀？", "options": {"A": "術後急性疼痛", "B": "開放性傷口疼痛", "C": "慢性下背痛", "D": "產後疼痛"}, "images": [], "answer": "B", "explanation": "答案：B。開放性傷口疼痛—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 11, "stem": "疼痛的性質屬灼熱痛時，下列何者最有可能常伴隨自主神經障礙？", "options": {"A": "神經痛", "B": "快速疼痛", "C": "慢速疼痛", "D": "疲勞性疼痛"}, "images": [], "answer": "A", "explanation": "答案：A。神經痛—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 12, "stem": "下列何者並非經皮神經電刺激（TENS）的治療禁忌症？", "options": {"A": "安裝心律調節器之病患", "B": "疑似有靜脈血栓的部位", "C": "開胸手術之病患", "D": "感覺喪失的區域"}, "images": [], "answer": "C", "explanation": "答案：C。開胸手術之病患—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 13, "stem": "通常在施行關節鬆動術（joint mobilization）前和過程中，較適合用來協助止痛的經皮神經電\n刺激模式為何？", "options": {"A": "傳統式經皮神經電刺激（conventional TENS）", "B": "短暫劇烈式經皮神經電刺激（brief intense TENS）", "C": "微電流式經皮神經電刺激（microcurrent TENS）", "D": "調節式經皮神經電刺激（modulation TENS）"}, "images": [], "answer": "B", "explanation": "答案：B。短暫劇烈式經皮神經電刺激（brief intense TENS）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 14, "stem": "常見之蘇聯波（Russian current）電刺激頻率為多少Hz？", "options": {"A": "1,000", "B": "2,500", "C": "7,500", "D": "10,000"}, "images": [], "answer": "B", "explanation": "答案：B。2,500—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 15, "stem": "對於接受肌腱移植（tendon transfer）的病患，採用下列何種治療較能改善運動功能？", "options": {"A": "功能性電刺激", "B": "肌電回饋訓練", "C": "神經肌肉電刺激", "D": "電極植入式電義肢"}, "images": [], "answer": "B", "explanation": "答案：B。肌電回饋訓練—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 16, "stem": "肌電回饋訓練中，肌電訊號收集的傳遞過程依序應為：", "options": {"A": "肌肉、皮膚、電極、回饋儀", "B": "皮膚、肌肉、電極、回饋儀", "C": "肌肉、回饋儀、皮膚、電極", "D": "肌肉、皮膚、回饋儀、電極"}, "images": [], "answer": "A", "explanation 正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 48, "stem": "下列有關徒手阻力運動的敘述，何者正確？", "options": {"A": "此類運動，對肌力已經在等級 4（Good）分以上的個案，能有效增強其肌力", "B": "治療師能依據病患之病況，隨時調整阻力大小", "C": "是一種能夠客觀量化阻力大小的訓練方式", "D": "可以訓練到各種不同速度的動作，因此將可以把訓練之成效，完全轉移至日常功能性活動 中"}, "images": [], "answer": "B", "explanation": "答案：B。治療師能依據病患之病況，隨時調整阻力大小—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 49, "stem": "在徒手抬物時，無論雙腳是伸直式或深蹲式，通常會希望腰椎能保持在稍微前凸（lordosis）\n的姿勢，但下列敘述何者不是採用這姿勢的主因？", "options": {"A": "能減少下肢肌群所需要的收縮力量，達到省力的效果", "B": "能降低脊椎後方韌帶的應力（stress）", "C": "椎間盤的壓力（compression pressure）能使其中的膠質髓核（nucleus pulposus）移向 前方", "D": "脊椎的小面關節間能有較完整的接觸，使腰椎穩定性增加"}, "images": [], "answer": "A", "explanation": "答案：A。能減少下肢肌群所需要的收縮力量，達到省力的效果—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 50, "stem": "關於協助脊髓損傷患者轉位時，應注意的事項，下列敘述何者錯誤？", "options": {"A": "剛受傷的患者，常裝有內/外固定器，因此可執行單人提起轉位法（one-person lift transfer）", "B": "剛受傷的患者，翻身時應採用圓木翻滾（log-rolling）", "C": "轉位到特定姿勢，應提供適當的支撐物與限制物（restraints）", "D": "損傷超過數月或數年的患者，轉位時應留意不要給下肢與脊椎骨太大的負重或應變"}, "images": [], "answer": "A", "explanation": "答案：A。剛受傷的患者，常裝有內/外固定器，因此可執行單人提起轉位法（one-person lift transfer）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 51, "stem": "治療師教導一位右腳受傷的病人，使用腋下柺上樓梯時，治療師應該站在那裡保護病人為正\n確？", "options": {"A": "右邊且靠近前外側", "B": "右邊且靠近後外側", "C": "左邊且靠近前外側", "D": "左邊且靠近後外側"}, "images": [], "answer": "B", "explanation": "答案：B。右邊且靠近後外側—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 52, "stem": "下列關於手杖（cane）的敘述，何者錯誤？", "options": {"A": "手杖一般是支撐在患側", "B": "可改善病人的平衡能力", "C": "可減緩下肢關節的受力", "D": "拿手杖也可走三點式步態"}, "images": [], "answer": "A", "explanation": "答案：A。手杖一般是支撐在患側—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 53, "stem": "病患仰臥，上肢置於身旁，治療師施行肱骨（humerus）之向後滑動（posterior glide）鬆動\n術，是為了幫助病患增加肩關節那一方向的動作？", "options": {"A": "外展", "B": "內收", "C": "屈曲", "D": "伸直"}, "images": [], "answer": "C", "explanation": "答案：C。屈曲—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 54, "stem": "關節鬆動術（joint mobilization）最能有效增加下列那一個構造的延展性（extensibility）？", "options": {"A": "關節囊（joint capsule）", "B": "韌帶（ligament）", "C": "肌腱（tendon）", "D": "肌肉（muscle）"}, "images": [], "answer": "A", "explanation": "答案：A。關節囊（joint capsule）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 55, "stem": "下列何種情況不適合施予按摩治療？", "options": {"A": "即將上場比賽非常緊張的運動選手", "B": "半年前曾接受乳癌開刀治療，經追蹤無轉移現象發生，目前有上肢腫脹現象", "C": "三個月前接受膝關節以下截肢，目前有幻痛的下肢", "D": "因蜂窩組織炎而腫脹的下肢"}, "images": [], "answer": "D", "explanation": "答案：D。因蜂窩組織炎而腫脹的下肢—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 56, "stem": "下列敘述何種按摩手法主要是產生刺激組織的效果，而不是放鬆的效果？", "options": {"A": "推撫法（stroking）", "B": "揉推法（kneading）", "C": "拍打法（clapping）", "D": "摩擦法（friction）"}, "images": [], "answer": "C", "explanation": "答案：C。拍打法（clapping）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 57, "stem": "以關節鬆動術增加手腕伸直（extension）活動度，可一手固定橈骨（radius），另一手將近\n端腕骨（proximal carpal bones）往下列那個方向推動？", "options": {"A": "掌心（volar）", "B": "手背（dorsal）", "C": "尺骨", "D": "橈骨"}, "images": [], "answer": "A", "explanation": "答案：A。掌心（volar）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 58, "stem": "下列敘述那項關節鬆動術可增加前臂旋前（pronation）活動度？", "options": {"A": "對橈骨頭（radial head）施以向後力量，在遠端橈尺關節對橈骨亦施以向後力量", "B": "對橈骨頭（radial head）施以向前力量，在遠端橈尺關節對橈骨施以向後力量", "C": "對橈骨頭（radial head）施以向前力量，在遠端橈尺關節對橈骨亦施以向前力量", "D": "對橈骨頭（radial head）施以向後力量，在遠端橈尺關節對橈骨施以向前力量"}, "images": [], "answer": "D", "explanation": "答案：D。對橈骨頭（radial head）施以向後力量，在遠端橈尺關節對橈骨施以向前力量—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 59, "stem": "下列有關持續性小面關節滑動術（sustained natural apophyseal glide, SNAG）之敘述，何\n者錯誤？", "options": {"A": "可用於治療某些頸因性頭痛", "B": "施壓點可在椎骨之棘突（spinous process）或關節柱（articular pillar）", "C": "通常需要以震動（oscillation）方式強化效果", "D": "施術過程中，患者要配合做主動動作"}, "images": [], "answer": "C", "explanation": "答案：C。通常需要以震動（oscillation）方式強化效果—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 60, "stem": "下列有關肌能量技術（muscle energy technique）之敘述，何者錯誤？", "options": {"A": "是一種需要肌肉主動參與收縮的治療技術", "B": "改善局部循環是其臨床療效之一", "C": "不能用來鬆動關節", "D": "可以用吸氣或呼氣來誘發動作"}, "images": [], "answer": "C", "explanation": "答案：C。不能用來鬆動關節—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 61, "stem": "下列有關關節鬆動術的敘述，何者正確？", "options": {"A": "Kaltenborn將關節鬆動術依照施力大小分為五級", "B": "關節面正常的間歇壓力負荷（intermittent compressive loads）有助促進關節腔內滑液的流 動", "C": "關節固定不動太久會造成關節軟骨萎縮，但不會使韌帶變弱", "D": "第四型關節受器（receptors）無法被關節活動所刺激"}, "images": [], "answer": "B", "explanation": "答案：B。關節面正常的間歇壓力負荷（intermittent compressive loads）有助促進關節腔內滑液的流 動—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 62, "stem": "如何執行深層摩擦按摩（deep friction massage）治療？", "options": {"A": "以單手或雙手掌在患者皮膚上往各方向推動", "B": "以指腹貼緊皮膚，將皮膚與皮下組織間滑動開來", "C": "以一手或雙手指頭併攏且微彎成杯狀，快速輕輕敲擊在皮膚上", "D": "指尖緊貼皮膚，以畫圓圈方式推動皮下組織與肌肉"}, "images": [], "answer": "B", "explanation": "答案：B。以指腹貼緊皮膚，將皮膚與皮下組織間滑動開來—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 63, "stem": "病人站在牆角進行胸大肌（pectoralis major）自我牽拉（self-stretch），若要強調牽拉胸骨\n部分（sternal portion）的胸大肌時，雙手應如何擺位在兩側牆上再牽拉？", "options": {"A": "雙肩水平外展、雙肘屈曲 90 度", "B": "雙手伸直高舉過肩，如 V 字型", "C": "雙肘屈曲低於肩膀，如 W 字型", "D": "牆角自我牽拉無法單一牽拉胸骨部分胸大肌"}, "images": [], "answer": "B", "explanation": "答案：B。雙手伸直高舉過肩，如 V 字型—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 64, "stem": "下列有關附圖中手腕徒手療法之敘述，何者錯誤？（圖中箭號為治療師施力方向）", "options": {"A": "可增加手腕向尺側偏斜（ulnar deviation）之活動度", "B": "是針對橈腕（radiocarpal）關節執行的關節鬆動術", "C": "此手法之治療平面（treatment plane）在橈骨（radius）上", "D": "此手法之固定手需同時固定橈骨（radius）與尺骨（ulna）"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAewAAAFCCAIAAAC8XnmpAAAACXBIWXMAAA7EAAAOxAGVKw4bAADZUUlEQVR4nOx9+XsUVfb+90+Yz2dGxxl3ZRRUREVcUFFwAVkUBFmVfVF2Bdl3kB3CnrCHHQJh38ISCCSQAIGQELIRwhLCEhYZdeYzI+n6vk+9T5/nUtVd6XS6q7PU+aGf6urqqntv3fue95x77rn/T3PEEUcccaTcyv8LdQEcccQRRxzxXxwQd8QRRxwpx+KAuCOOOOJIORYHxB1xxBFHyrE4IO6II444Uo7FAXFHHHHEkXIsDog74ogjjpRjKYsg/t///vc///mPfHW5XPj8/fff8fnvf/+bPxUVFeHzwYMHISqjP/Kvf/0Lnzdv3sTnr7/+qunlh6AurKOIWn1Nryzra4/cv3+fB3/88YehMIZy8oJyLagROpXmfjvsUb/99ltJ78M/oq3u3buHg//7v/8LcEFLLrdu3UJnk3fEajpS8aQsgvgfuvDYgF84rwK3AVPKsnAIGdCZUC4X4CsUGL+qtUY1bQNxQ5OqrY0yUOWoZ+wpVVCFtSCIG16Q78L3m5WVlZCQgF6KryFvnNOnT58/f54vFIUpC3rFkWBIWQRxly48UFEbw4w/8Uw5QnDNjdc3btzA8EalMKJQC0L2P//5z/z8/IKCAuKIpteUF8jfpU2CLSShokuuX79OhUpFwtdRvlreRyEK+01X2UoHDhxYsGABrcaQy4YNG6BReIy3VgHMJkc8SlkEcRFSPx6DIuXm5vIrOUX58qVAbt++DbDGOE9LS0tNTb1z5w7REF9jY2MvX77My65evRofHw8gQJUFLl1uCXYhCUBoYT4L1PLChQtCKgnlFQnEhaiyOwHp/CbjkOjo6MGDB5cFEAczmDV 敘述，依物理治療學相關知識為標準答案。"}, {"n": 67, "stem": "在踝足支架上增加何種裝置，可改善踝關節內外側不穩定（mediolateral instability）的現\n象？", "options": {"A": "T帶（T-strap）", "B": "雙向可調之踝關節（double-adjustable ankle joint）", "C": "單直條槓（single upright）", "D": "小腿帶（calf band）"}, "images": [], "answer": "A", "explanation": "答案：A。T帶（T-strap）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 68, "stem": "膝上截肢患者（above-knee amputees），初次訓練平衡或走路時，下列敘述何者可提供最\n佳穩定度？", "options": {"A": "液壓式膝關節（hydraulic knee unit）", "B": "多中心軸膝關節（polycentric knee unit）", "C": "氣壓式膝關節（pneumatic knee unit）", "D": "手動鎖住式膝關節（manual locking knee unit）"}, "images": [], "answer": "D", "explanation": "答案：D。手動鎖住式膝關節（manual locking knee unit）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 69, "stem": "費城頸圈（Philadelphia collar）適用於兒童與成人頸部問題且為商品化產品，建議病患選購\n時應指定那些參數作為標準？", "options": {"A": "前後方熱塑膠加強物厚度", "B": "泡棉材料的硬度與孔洞的密度", "C": "下巴到胸廓的高度與頸圍", "D": "頭部下緣的周長與枕骨到頸椎第七節的距離"}, "images": [], "answer": "C", "explanation": "答案：C。下巴到胸廓的高度與頸圍—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 70, "stem": "膝上截肢者（above-knee amputees）行走時出現好腳踮腳尖（vaulting）現象時，下列敘述\n何者為最可能的原因？", "options": {"A": "套筒（socket）裝配過度彎曲", "B": "義足裝配過度背屈（dorsiflexion）", "C": "義肢太長", "D": "套筒（socket）校準線（alignment）調整不好"}, "images": [], "answer": "C", "explanation": "答案：C。義肢太長—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 71, "stem": "上肢截肢者所穿戴的外部產生動力型義肢（externally powered prostheses），若要使手掌\n或手鉤打開其最主要的動力來源是下列何者？", "options": {"A": "控制帶系統（harness system）", "B": "控制連接帶（control attachment strap）", "C": "電極片", "D": "電池"}, "images": [], "answer": "D", "explanation": "答案：D。電池—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 72, "stem": "患者抱怨有足底疼痛的問題，經評估發現他在不承重時候有約8度的後足內翻（rearfoot\nvarus），而承重站立時有低足弓與跟骨外翻（calcaneus valgus）現象，則下列何種裝具最\n適合此患者？", "options": {"A": "半硬軟式的UCBL裝具（University of California Biomechanics Laboratory orthosis）", "B": "軟性的內側楔形墊（medial sole wedge）", "C": "半硬軟式的蹠底桿（metatarsal bar）", "D": "硬式的湯瑪士鞋跟（Thomas heel）"}, "images": [], "answer": "A", "explanation": "答案：A。半硬軟式的UCBL裝具（University of California Biomechanics Laboratory orthosis）—此選項為正確敘述，依物理治療學相關 ＜脂肪＜骨骼＜皮膚", "D": "脂肪＜皮膚＜骨骼＜肌肉"}, "images": [], "answer": "B", "explanation": "答案：B。肌肉＜骨骼＜脂肪＜皮膚—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 3, "stem": "對於引起固定大小神經興奮的電刺激而言，刺激電流強度與刺激時間兩參數間為何等關係？", "options": {"A": "呈反比關係", "B": "呈正比關係", "C": "呈平方關係", "D": "呈立方關係"}, "images": [], "answer": "A", "explanation": "答案：A。呈反比關係—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 4, "stem": "神經檢查中，F波路徑分別經由何者傳入與傳出？", "options": {"A": "經由α運動神經纖維傳入，由α運動神經纖維傳出", "B": "經由Ia 感覺神經纖維傳入，由α運動神經纖維傳出", "C": "經由Ib 感覺神經纖維傳入，由γ運動神經纖維傳出", "D": "經由IIb 感覺神經纖維傳入，由γ運動神經纖維傳出"}, "images": [], "answer": "A", "explanation": "答案：A。經由α運動神經纖維傳入，由α運動神經纖維傳出—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 5, "stem": "關於針刺電極在肌肉內記錄最大肌肉收縮之電氣活動，下列敘述何者錯誤？", "options": {"A": "正常時振幅約 200 至 2000µV", "B": "正常時頻率為每秒 30 至 50 次", "C": "正常時波形為無干擾型波", "D": "出現完全性且小振幅完全干擾型波時可能為肌肉病變"}, "images": [], "answer": "C", "explanation": "答案：C。正常時波形為無干擾型波—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 6, "stem": "下列關於神經肌肉電刺激的敘述，何者錯誤？", "options": {"A": "常用的刺激波頻為30~50 Hz", "B": "適用於周邊神經系統完整者", "C": "要選用具有調整“刺激週期”功能的電刺激器", "D": "選擇間歇性直流電較優於雙相位電流（biphasic current）的刺激"}, "images": [], "answer": "D", "explanation": "答案：D。選擇間歇性直流電較優於雙相位電流（biphasic current）的刺激—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 7, "stem": "脊髓損傷病患接受功能性電刺激訓練時，通常初期建議使用刺激與休息時間的比（on : off time ratio）為：", "options": {"A": "2 : 1", "B": "1 : 1", "C": "1 : 5", "D": "1 : 15"}, "images": [], "answer": "C", "explanation": "答案：C。1 : 5—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 8, "stem": "使用離子電泳法時，電流密度（current density）的範圍大約為何？", "options": {"A": "0.01至0.05 mA/cm2", "B": "0.1至0.5 mA/cm2", "C": "1至5 mA/cm2", "D": "10至50 mA/inch2"}, "images": [], "answer": "B", "explanation": "答案：B。0.1至0.5 mA/cm2—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 9, "stem": "有關神經肌肉電刺激在降低肌肉痙攣的應用，下列敘述何者錯誤？", "options": {"A": "可以直接電刺激該痙攣肌肉", "B": "可以電刺激痙攣肌肉之拮抗肌", "C": "治療效果無法持久，此時加入的運動治療才是重點", "D": "注射肉毒桿菌素病患絕不可再使用電刺激"}, "images": [], "answer": "D", "explanation": "答案：D。注射肉毒桿菌素病患絕不可再使用電刺激—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 10, "stem": "有關使用神經肌肉電刺激強化肌力，下列敘述何者正確？", "options": {"A": "使用電流波長約20 ms到100 ms", "B": "使用電流頻率約25～100 Hz", "C": "使用電流強度，建議為最大自主性收縮強度（maximal voluntary contraction）", "D": "刺激較大肌肉，建議電極採用單極擺位（monopolar placement）"}, "images": [], "answer": "B", "explanation": "答案：B。使用電流頻率約25～100 Hz—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 11, "stem": "下列高壓間歇式直流電電流參數特徵，何者錯誤？", "options": {"A": "波寬小於0.1ms", "B": "頻率100~500Hz", "C": "電壓100~500伏特", "D": "總平均電流1.2~1.5mA"}, "images": [], "answer": "B", "explanation": "答案：B。頻率100~500Hz—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 12, "stem": "下列何者不屬於經皮神經電刺激的適應症？", "options": {"A": "不明原因的疼痛", "B": "手術後的急性疼痛", "C": "慢性下背痛", "D": "開放性外傷傷口疼痛"}, "images": [], "answer": "A", "explanation": "答案：A。不明原因的疼痛—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 13, "stem": "當應用電刺激減少急性期腳踝扭傷的水腫問題時，下列何項治療計畫的安排不適用於此情況？", "options": {"A": "選用負電極直接置於水腫部位作為主動電極", "B": "選用 60 ~ 80 Hz及 1 : 4 刺激週期的間歇波引起肌肉的收縮", "C": "施以冷水浴之後再進行電刺激", "D": "將電極置於水腫部位的二端其中負電極位於遠端處"}, "images": [], "answer": "B", "explanation": "答案：B。選用 60 ~ 80 Hz及 1 : 4 刺激週期的間歇波引起肌肉的收縮—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 14, "stem": "下列有關電刺激治療傷口的極性敘述，何者正確？", "options": {"A": "細菌感染的傷口只能以負極治療至傷口完全癒合", "B": "電極極性應隨著傷口癒合的情況調整交換", "C": "促進傷口癒合應為負極", "D": "傷口癒合無關電極性"}, "images": [], "answer": "B", "explanation": "答案：B。電極極性應隨著傷口癒合的情況調整交換—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 15, "stem": "下列經皮神經電刺激的形式，何者為兩種形式的組合？", "options": {"A": "針灸式", "B": "傳統式", "C": "脈叢式", "D": "短強式"}, "images": [], "answer": "C", "explanation": "答案：C。脈叢式—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 16, "stem": "關於干擾波治療時所使用的電極個數的影響，下列何者正確？", "options": {"A": "二電極式為預先調變（premodulated）設計，提供100%調變（modulation）特性", "B": "四電極刺激較無不適感", "C": "二電極式可刺激範圍較大", "D": "四電極式刺激可得較大肌肉力矩值"}, "images": [], "answer": "A", "explanation": "答案：A。二電極式為預先調變（premodulated）設計，提供100%調變（modulation）特性—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 17, "stem": "下面中頻干擾波圖形中，兩組頻率分別為4,000與4,100Hz，則下列敘述何者正確？", "options": {"A": "此圖形是一種預先調節干擾波（premodulated interferential current）的示範圖形", "B": "此圖形中央區域之新載波頻率（carrier frequency）為4,050 Hz", "C": "此圖形中央區域之波差頻率（beat frequency）為50 Hz", "D": "此圖形中央區域 treatment plane）在橈骨（radius）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 63, "stem": "下列有關 petrissage 手法的敘述，何者錯誤？", "options": {"A": "較 effleurage 手法更能影響深層肌肉", "B": "此手法治療區域大，不能用單隻手指執行", "C": "具有促進組織液體交換的效果", "D": "與 kneading 手法類似"}, "images": [], "answer": "B", "explanation": "答案：B。此手法治療區域大，不能用單隻手指執行—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 64, "stem": "為了使肌肉能適當的放鬆與避免造成軟組織受傷，最適當的牽拉速度為何？", "options": {"A": "慢速", "B": "快速", "C": "慢速與快速交替進行，如此病人才不會太快適應", "D": "牽拉治療極為溫和，任何速度都不會造成傷害"}, "images": [], "answer": "A", "explanation": "答案：A。慢速—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 65, "stem": "下列何種手法不屬於「抑制壓力（inhibitory pressures）」式的徒手治療手法？", "options": {"A": "肌肉彈撥（strum）法", "B": "橫向彈撥（transverse strumming）法", "C": "持續壓力（sustained pressures）法", "D": "結締組織按摩（connective tissue massage）法"}, "images": [], "answer": "D", "explanation": "答案：D。結締組織按摩（connective tissue massage）法—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 66, "stem": "肘下義肢（below-elbow prosthesis）使用自主開張型（voluntary opening）手鈎，主要控制手鈎夾緊動作的裝置為：", "options": {"A": "鋼索（cable）", "B": "手鈎內側的橡膠（rubber）", "C": "手鈎的固定臂（stationary arm）", "D": "手鈎基部的橡皮圈（elastic band）"}, "images": [], "answer": "D", "explanation": "答案：D。手鈎基部的橡皮圈（elastic band）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 67, "stem": "膝上截肢者（above-knee amputees）穿戴義肢行走時出現患側外展步態（abducted gait pattern）現象時，下列那些是可能\n出現的原因？①義肢太長 ②套筒（socket）調整太外展（abduction） ③套筒內側壁（medial wall）太高 ④套筒調整前移\n太多", "options": {"A": "僅①②③", "B": "僅②③④", "C": "僅①③④", "D": "僅①②④"}, "images": [], "answer": "A", "explanation": "答案：A。僅①②③—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 68, "stem": "肘下義肢（below-elbow prostheses）裝配硬式鉸鏈（rigid hinge）時，則無法產生下列何種活動方式？", "options": {"A": "肘關節旋前-旋後（pronation-supination）", "B": "肘關節屈曲-伸直（flexion-extension）", "C": "肩關節屈曲-伸直（flexion-extension）", "D": "肩關節外展-內收（abduction-adduction）"}, "images": [], "answer": "A", "explanation": "答案：A。肘關節旋前-旋後（pronation-supination）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 69, "stem": "下列硬式奈特（Knight）背架的穿戴方式，何者不適當？", "options": {"A": "胸帶（thoracic band）高度位在肩胛骨下角下一英吋", "B": "骨盆帶（pelvic band）的兩側 const state = {
  paper: "Q1",
  idx: {Q1: 0, Q2: 0},
  picks: { Q1: {}, Q2: {} }, // hydrated later, after persistence block defines PICKS_STORAGE_KEY
};

const $ = sel => document.querySelector(sel);
const main = $("#main");
const grid = $("#grid");
const progressEl = $("#progress");

function isCorrect(paper, n, pick) {
  const ans = DATA[paper].questions[n-1].answer;
  if (ans === "#") return true; // 一律給分
  return ans.indexOf(pick) >= 0; // single "A" or multi "AB" (X 或 Y 均給分)
}

function picksDone(paper) {
  return Object.keys(state.picks[paper]).length;
}

function score(paper) {
  let s = 0;
  for (const n in state.picks[paper]) {
    if (isCorrect(paper, parseInt(n), state.picks[paper][n])) s++;
  }
  return s;
}

function renderGrid() {
  grid.innerHTML = "";
  const qs = DATA[state.paper].questions;
  for (let i = 0; i < qs.length; i++) {
    const n = i + 1;
    const btn = document.createElement("button");
    btn.className = "gbtn";
    btn.textContent = n;
    if (state.idx[state.paper] === i && !state.viewSummary) btn.classList.add("cur");
    if (n in state.picks[state.paper]) {
      const ok = isCorrect(state.paper, n, state.picks[state.paper][n]);
      btn.classList.add(ok ? "right" : "wrong");
    }
    if (isMarked(state.paper, n)) btn.classList.add("marked");
    btn.onclick = () => { state.viewSummary = false; state.idx[state.paper] = i; render(); };
    grid.appendChild(btn);
  }
}

function escapeHTML(s) { return s.replace(/&/g, "&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderQuestion() {
  const qs = DATA[state.paper].questions;
  const i = state.idx[state.paper];
  const q = qs[i];
  const pick = state.picks[state.paper][q.n];
  const locked = !!pick;
  const correct = q.answer;
  const total = qs.length;
  progressEl.textContent = `第 ${i+1} 題 / 共 ${total} 題　·　已作答 ${picksDone(state.paper)}　·　目前得分 ${score(state.paper)}`;

  let imgsHTML = "";
  for (const u of q.images) imgsHTML += `<img class="qimg" src="${u}" alt="題目附圖">`;

  let optsHTML = "";
  for (const k of ["A","B","C","D"]) {
    let cls = "opt";
    if (locked) {
      cls += " locked";
      const isCorrLetter = (correct !== "#" && correct.indexOf(k) >= 0);
      if (isCorrLetter) cls += " correct";
      else if (k === pick && correct !== "#") cls += " wrong";
      else if (correct === "#" && k === pick) cls += " correct";
    }
    optsHTML += `<button class="${cls}" data-k="${k}" ${locked ? "disabled" : ""}>
      <span class="label">${k}.</span><span>${escapeHTML(q.options[k] || "")}</span>
    </button>`;
  }

  let verdictHTML = "";
  if (locked) {
    if (correct === "#") {
      verdictHTML = `<div class="verdict note">
        <h3>本題經考選部公告「一律給分」</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;

      const ok = correct.indexOf(pick) >= 0;
      const letters = correct.split("").join(" 或 ");
      verdictHTML = `<div class="verdict note">

        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else {
      const ok = pick === correct;
      verdictHTML = `<div class="verdict ${ok ? "right" : "wrong"}">
        <h3>${ok ? "✓ 答對" : "✗ 答錯"}　·　正解：${correct}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    }
  }

  main.innerHTML = `<div class="card">
    <div class="qhead">
      <span class="qnum">第 ${q.n} 題</span>
      <span class="qmeta">${DATA[state.paper].label}　·　${q.images.length>0?"含附圖":"純文字"}${isMarked(state.paper, q.n) ? ' <span class="marked-badge">🔖 已標記</span>' : ''}</span>

    </div>
    <div class="stem">${escapeHTML(q.stem)}</div>
    ${imgsHTML}
    <div class="opts">${optsHTML}</div>
    ${verdictHTML}
    <div class="nav">

      <button class="btn ghost" id="clearBtn" ${locked?"":"disabled"}>清除本題作答</button>
      ${i===total-1?'<button class="btn" id="finishBtn">完成本卷 / 看總結</button>':""}
    </div>
  </div>`;

  // wire up
  main.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => {
      if (locked) return;
      const k = el.getAttribute("data-k");
      state.picks[state.paper][q.n] = k;
      savePicks();
      render();
    };
  });
  $("#prevBtn").onclick = () => { if (i>0) { state.idx[state.paper] = i-1; render(); } };
  $("#nextBtn").onclick = () => { if (i<total-1) { state.idx[state.paper] = i+1; render(); } };
  $("#clearBtn").onclick = () => { delete state.picks[state.paper][q.n]; savePicks(); render(); };
  $("#markBtn").onclick = () => { toggleMark(state.paper, q.n); render(); };
  const fb = document.getElementById("finishBtn");
  if (fb) fb.onclick = () => { state.viewSummary = true; render(); };
}

    ${(()=>{ const rows=[]; for (let i=0;i<qs.length;i++){ const q=qs[i]; if (!isMarked(state.paper,q.n)) continue; const pick=state.picks[state.paper][q.n]; const stemShort = q.stem.length>50?q.stem.slice(0,50)+'…':q.stem; const tag = pick===undefined?'未作答':(q.answer==='#'?'一律給分':(pick===q.answer?'答對':'答錯')); const tagColor = pick===undefined?'var(--ink-soft)':(q.answer==='#'?'var(--yellow)':(pick===q.answer?'var(--green)':'var(--red)')); rows.push(`<div class="wrong-row mk" data-idx="${i}"><strong>★ 第 ${q.n} 題</strong><span style="color:${tagColor};">${tag}</span><span style="color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(stemShort)}</span></div>`); } return rows.length>0 ? `<div style="margin-top:14px;"><h3 style="margin:0 0 6px;">🔖 已標記題目（${rows.length}）</h3><div class="wrong-list">${rows.join('')}</div><button class="btn ghost" id="clearMarksBtn" style="margin-top:8px;font-size:13px;">清除本卷所有標記</button></div>` : ''; })()}
    <div class="nav" style="margin-top:18px;">

// ===== Answer persistence (per-paper picks, saved to localStorage) =====
const PICKS_STORAGE_KEY = "nephron_105_tech_picks_v1";
const QUIZ_ID = "tech_105";  // unique id used when broadcasting summary

function loadPicks() {
  try {
    const s = localStorage.getItem(PICKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function savePicks() {
  try { localStorage.setItem(PICKS_STORAGE_KEY, JSON.stringify(state.picks)); } catch (e) {}
  broadcastProgress();
}

// Send a summary of progress to parent window if embedded in an iframe.
// Used by the dashboard (index.html) to show progress bars.
function broadcastProgress() {
  if (typeof window === "undefined") return;
  let target = null;
  try { if (window.parent && window.parent !== window) target = window.parent; } catch(e){}
  if (!target) return;
  try {
    const summary = { type: "quizSummary", quizId: QUIZ_ID, papers: {} };
    for (const tag of ["Q1","Q2"]) {
      const qs = DATA[tag].questions;
      const picks = state.picks[tag] || {};
      const marks = state.marks ? (state.marks[tag] || {}) : {};
      let answered = 0, correct = 0;
      for (const n in picks) {
        answered++;
        if (isCorrect(tag, parseInt(n), picks[n])) correct++;
      }
      summary.papers[tag] = {
        label: DATA[tag].label,
        total: qs.length,
        answered, correct,
        marked: Object.keys(marks).length,
      };
    }
    target.postMessage(summary, "*");
  } catch (e) {}
}

// Hydrate persisted picks now that PICKS_STORAGE_KEY and loadPicks are defined
state.picks = loadPicks();

// ===== Bookmarks (per-paper question marks, persisted to localStorage) =====
const MARKS_STORAGE_KEY = "nephron_105_tech_marks_v1";
function loadMarks() {
  try {
    const s = localStorage.getItem(MARKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function saveMarks() {
  try { localStorage.setItem(MARKS_STORAGE_KEY, JSON.stringify(state.marks)); } catch (e) {}
  broadcastProgress();
}
function toggleMark(paper, n) {
  if (state.marks[paper][n]) delete state.marks[paper][n];
  else state.marks[paper][n] = true;
  saveMarks();
}
function isMarked(paper, n) { return !!state.marks[paper][n]; }
function clearAllMarks(paper) {
  state.marks[paper] = {};
  saveMarks();
}
function markedCount(paper) { return Object.keys(state.marks[paper]).length; }
state.marks = loadMarks();

// ===== Export / Download report =====
function _esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function _stamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function _nowStr() { return new Date().toLocaleString("zh-TW", {hour12: false}); }

function _filterQs(paper, filter) {
  const qs = DATA[paper].questions;
  const picks = state.picks[paper];
  if (filter === "all") return qs.slice();
  if (filter === "answered") return qs.filter(q => picks[q.n] !== undefined);
  if (filter === "unanswered") return qs.filter(q => picks[q.n] === undefined);
  if (filter === "wrong") {
    return qs.filter(q => {
      const p = picks[q.n];
      return p !== undefined && q.answer !== "#" && q.answer.indexOf(p) < 0;
    });
  }
  if (filter === "marked") return qs.filter(q => isMarked(paper, q.n));
  return qs.slice();
}

function _filterCounts(paper) {
  return {
    all: _filterQs(paper, "all").length,
    answered: _filterQs(paper, "answered").length,
    wrong: _filterQs(paper, "wrong").length,
    unanswered: _filterQs(paper, "unanswered").length,
    marked: _filterQs(paper, "marked").length,
  };
}

}

function downloadExport(filter) {
  const { html, fileTitle } = buildExportHTML(state.paper, filter);
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fileTitle + ".html";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
}

function showExportModal() {
  const modal = document.getElementById("exportModal");
  // Update counts based on current paper state
  const c = _filterCounts(state.paper);
  document.getElementById("cntAll").textContent = `(${c.all} 題)`;
  document.getElementById("cntAnswered").textContent = `(${c.answered} 題)`;
  document.getElementById("cntWrong").textContent = `(${c.wrong} 題)`;
  document.getElementById("cntUnans").textContent = `(${c.unanswered} 題)`;
  document.getElementById("cntMarked").textContent = `(${c.marked} 題)`;
  document.getElementById("exportSub").textContent =
    "本卷：" + DATA[state.paper].label + (state.paper === "Q1" ? "（114020）" : "（114090）");
  // Disable empty options
  document.querySelectorAll("#exportOpts .exp-opt").forEach(b => {
    const f = b.getAttribute("data-filter");
    b.disabled = (c[f] === 0);
  });
  modal.classList.add("show");
}
function hideExportModal() {
  document.getElementById("exportModal").classList.remove("show");
}

document.getElementById("exportBtn").onclick = showExportModal;
document.getElementById("closeExportBtn").onclick = hideExportModal;
document.getElementById("exportModal").addEventListener("click", e => {
  if (e.target.id === "exportModal") hideExportModal();
});
document.querySelectorAll("#exportOpts .exp-opt").forEach(btn => {
  btn.onclick = () => {
    const filter = btn.getAttribute("data-filter");
    if (btn.disabled) return;
    downloadExport(filter);
    hideExportModal();
  };
});

render();
// Broadcast initial state to parent (dashboard) if loaded as iframe
broadcastProgress();
</script>
</body>
</html>
