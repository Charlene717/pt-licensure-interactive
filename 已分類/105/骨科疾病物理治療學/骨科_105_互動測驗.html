<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骨科疾病物理治療學 — 114 年互動測驗</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --ink: #1f2933;
    --ink-soft: #52606d;
    --line: #e4e7eb;
    --primary: #1d6f9b;
    --primary-soft: #e6f1f7;
    --green: #2f9e44;
    --green-soft: #d3f9d8;
    --red: #c92a2a;
    --red-soft: #ffe3e3;
    --yellow: #d9a700;
    --yellow-soft: #fff4c2;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei",
                 "Noto Sans TC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
    font-size: 16px;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 14px 22px;
    position: sticky; top: 0; z-index: 10;
  }
  .h-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    background: #f1f3f5; border: 1px solid var(--line); color: var(--ink-soft);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .progress { color: var(--ink-soft); font-size: 14px; margin-left: auto; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 22px; max-width: 1400px; margin: 18px auto; padding: 0 22px; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; padding: 0 14px; } .sidebar { order: 2; position: static; } }
  .sidebar {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; height: fit-content; position: sticky; top: 78px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
  }
  .gbtn {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
    color: var(--ink-soft); font-size: 13px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .gbtn:hover { border-color: var(--primary); }
  .gbtn.cur { background: var(--primary); color: #fff; border-color: var(--primary); }
  .gbtn.right { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .gbtn.wrong { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .legend { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 4px; border: 1px solid var(--line); }
  .dot.r { background: var(--green-soft); border-color: var(--green); }
  .dot.w { background: var(--red-soft); border-color: var(--red); }
  .main { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .qhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .qnum { font-size: 22px; font-weight: 700; color: var(--primary); }
  .qmeta { color: var(--ink-soft); font-size: 13px; }
  .stem { font-size: 16px; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
  .qimg { display: block; max-width: 100%; max-height: 480px; margin: 8px 0; border: 1px solid var(--line); border-radius: 6px; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    transition: background .12s, border-color .12s;
    text-align: left;
    font-size: 15.5px;
    color: var(--ink);
  }
  .opt:hover:not(.locked) { background: var(--primary-soft); border-color: var(--primary); }
  .opt.locked { cursor: default; }
  .opt .label { font-weight: 700; min-width: 22px; }
  .opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .opt.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .verdict { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 14px; line-height: 1.7; }
  .verdict.right { background: var(--green-soft); color: #186b29; }
  .verdict.wrong { background: var(--red-soft); color: #861818; }
  .verdict.note { background: var(--yellow-soft); color: #6b4e00; }
  .verdict h3 { margin: 0 0 6px; font-size: 14px; }
  .nav { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    background: var(--primary); color: #fff; border: 0; padding: 9px 18px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: #fff; color: var(--red); border: 1px solid var(--red); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .summary { padding: 18px; }
  .summary h2 { margin: 0 0 8px; }
  .score { font-size: 32px; font-weight: 700; color: var(--primary); }
  .wrong-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .wrong-row { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .wrong-row:hover { background: var(--primary-soft); }
  .footer { color: var(--ink-soft); font-size: 12px; text-align: center; margin: 16px 0 30px; }

  .homelink { color: var(--soft); text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .homelink:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }


  /* Export modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,30,.45); display: none; align-items: center; justify-content: center; z-index: 100; padding: 18px; }
  .modal-bg.show { display: flex; }
  .modal-card { background: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.18); max-width: 460px; width: 100%; padding: 22px; }
  .modal-card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 700; }
  .modal-card .modal-sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; }
  .modal-card .opt-row { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
  .modal-card .exp-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; background: #f8f9fa; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left; color: var(--ink); }
  .modal-card .exp-opt:hover { background: var(--primary-soft); border-color: var(--primary); }
  .modal-card .exp-opt:disabled { opacity: 0.5; cursor: not-allowed; background: #f1f3f5; }
  .modal-card .exp-opt .count { color: var(--ink-soft); font-size: 12px; }
  .modal-card .hint { color: var(--ink-soft); font-size: 12px; line-height: 1.6; margin: 0 0 12px; }
  .modal-card .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }


  /* Bookmark / marker */
  .gbtn { position: relative; }
  .gbtn.marked::after {
    content: "★"; position: absolute; top: 1px; right: 3px;
    font-size: 10px; color: var(--yellow); line-height: 1;
    text-shadow: 0 0 2px #fff;
  }
  .markbtn {
    margin-left: auto; background: #fff; border: 1px solid var(--line);
    color: var(--ink-soft); padding: 6px 13px; border-radius: 999px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .markbtn:hover { border-color: var(--yellow); color: var(--yellow); }
  .markbtn.marked { background: var(--yellow-soft); color: #6b4e00; border-color: var(--yellow); font-weight: 600; }
  .qhead { flex-wrap: wrap; }
  .marked-badge { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--yellow-soft); color: #6b4e00; font-size: 11px; border: 1px solid var(--yellow); margin-left: 4px; }
  .wrong-row.mk { border-color: var(--yellow); }

</style>
</head>
<body>
<header>
  <div class="h-row">
    <a class="homelink" href="../../../index.html" title="回到測驗首頁">← 回首頁</a>
    <h1>骨科疾病物理治療學 · 民國 105 年</h1>
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="Q1">第一次 (114020)</button>
      <button class="tab" data-tab="Q2">第二次 (114090)</button>
    </div>
    <div class="progress" id="progress"></div>
  </div>
</header>

<div class="layout">

    <div style="font-size:13px;color:var(--ink-soft);margin-bottom:6px;">題號（共 80 題）</div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="dot r"></i>答對</span>

  <main class="main" id="main"></main>
</div>

<div class="footer">資料來源：考選部 105 年第一次／第二次專技高等考試 · 物理治療師 · 骨科疾病物理治療學</div>

<div class="modal-bg" id="exportModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h3>匯出測驗結果</h3>
    <div class="modal-sub" id="exportSub">本卷：第一次 (114020)</div>
    <div class="opt-row" id="exportOpts">
      <button class="exp-opt" data-filter="all">📄 全部題目（含詳解） <span class="count" id="cntAll"></span></button>
      <button class="exp-opt" data-filter="answered">📝 僅已作答 <span class="count" id="cntAnswered"></span></button>
      <button class="exp-opt" data-filter="wrong">❌ 僅錯題 <span class="count" id="cntWrong"></span></button>
      <button class="exp-opt" data-filter="unanswered">⏳ 僅未作答 <span class="count" id="cntUnans"></span></button>
      <button class="exp-opt" data-filter="marked">🔖 僅已標記 <span class="count" id="cntMarked"></span></button>
    </div>
    <p class="hint">將下載一份自包含的 .html 檔，可離線檢視。打開後可用瀏覽器「列印」（Ctrl/⌘+P）→「另存為 PDF」存成 PDF。</p>
    <div class="modal-actions">
      <button class="btn ghost" id="closeExportBtn">取消</button>
    </div>
  </div>
</div>

<script>
const DATA = {"Q1": {"label": "第一次", "questions": [{"n": 1, "stem": "下列何者是做頸椎操作術（manipulation）之前，必須執行的安全測試？①翼狀韌帶壓力測試\n（alar ligament stress test）  ②椎動脈測試（vertebral artery test）  ③橫向韌帶壓力測試\n（transverse ligament stress test）", "options": {"A": "僅①", "B": "僅②③", "C": "僅①②", "D": "①②③"}, "images": [], "answer": "D", "explanation": "答案：D。①②③—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 2, "stem": "若病患主訴中指感覺麻木，則治療師會期待檢查時另有那些發現？①肩外展無力  ②腕屈曲無\n力  ③腕伸直無力  ④肱三頭肌肌腱反射減弱  ⑤肱橈肌肌腱反射減弱", "options": {"A": "①③", "B": "①③⑤", "C": "②④", "D": "②⑤"}, "images": [], "answer": "C", "explanation": "答案：C。②④—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 3, "stem": "Roos test可測試下列何種症狀？", "options": {"A": "肩胛上神經壓迫（suprascapular nerve compression）", "B": "胸廓出口症候群（thoracic outlet syndrome）", "C": "頸部退化性關節炎（cervical spondylosis）", "D": "肩夾擠症候群（impingement syndrome）"}, "images": [], "answer": "B", "explanation": "答案：B。胸廓出口症候群（thoracic outlet syndrome）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 4, "stem": "下列有關頸部旋轉之主動動作測試的敘述，何者正確？", "options": {"A": "在頸部前彎到底的位置下，旋轉測試頸部第一、二節", "B": "在頸部後仰到底的位置下，旋轉測試頸部第二、三節", "C": "在下顎內收下，旋轉測試頸部第四、五節", "D": "在下顎內收下，旋轉測試頸部第三、四節"}, "images": [], "answer": "A", "explanation": "答案：A。在頸部前彎到底的位置下，旋轉測試頸部第一、二節—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 5, "stem": "針對頸部揮鞭症候群（Whiplash Syndrome）之胸鎖乳突肌（sternocleidomastoid）治療，\n下列敘述何者正確？", "options": {"A": "給予肌力訓練，以維護頸部脊椎穩定度", "B": "給予牽拉，應將頭部及頸部置於後伸最大位置", "C": "給予按摩及軟組織鬆動術，達到放鬆肌肉效果", "D": "給予動作控制訓練，以增強肌力"}, "images": [], "answer": "C", "explanation": "答案：C。給予按摩及軟組織鬆動術，達到放鬆肌肉效果—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 6, "stem": "相較而言，頸椎間盤病變較不易發生於下列那兩節之間？", "options": {"A": "C3-C4", "B": "C4-C5", "C": "C5-C6", "D": "C6-C7"}, "images": [], "answer": "A", "explanation": "答案：A。C3-C4—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 7, "stem": "翼狀肌（pterygoid）的那一部分與關閉下頜有關？", "options": {"A": "上翼狀肌", "B": "下翼狀肌", "C": "內翼狀肌", "D": "外翼狀肌"}, "images": [], "answer": "C", "explanation": "答案：C。內翼狀肌—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 8, "stem": "頸椎之第一個椎間盤是位在下列何者之間？", "options": {"A": "第三頸椎與第四頸椎", "B": "軸椎（axis）與第三頸椎", "C": "寰椎（atlas）與軸椎（axis）", "D": "寰椎（atlas）與枕骨（occiput）"}, "images": [], "answer": "B", "explanation": "答案：B。軸椎（axis）與第三頸椎—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 9, "stem": "下列有關梨狀肌症候群（piriformis syndrome）之敘述，何者正確？", "options": {"A": "與坐骨神經痛無關", "B": "梨狀肌肌力訓練是最重要的治療項目", "C": "在髖外轉位置下，執行髖內轉之阻力測試，會有疼痛現象", "D": "在髖內轉位置下，執行髖外轉之阻力測試，會有疼痛現象"}, "images": [], "answer": "D", "explanation": "答案：D。在髖內轉位置下，執行髖外轉之阻力測試，會有疼痛現象—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 10, "stem": "長期以較大腰薦關節角度、較大之腰椎前凸、骨盆前傾及髖關節屈曲之姿勢站立，比較不會\n出現下列那種現象？", "options": {"A": "髖屈肌（hip flexor）緊縮", "B": "脊旁肌（paraspinal muscles）緊縮", "C": "臀大肌（gluteus maximus）緊縮", "D": "腹肌無力"}, "images": [], "answer": "C", "explanation": "答案：C。臀大肌（gluteus maximus）緊縮—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 11, "stem": "執行被動直膝抬腿（straight leg raise）測試時，若將髖關節加上內轉（internal rotation）動\n作，可以增加髖屈曲（hip flexion）的角度，並減少大腿後方的疼痛感，這代表：", "options": {"A": "內側膕旁肌（medial hamstrings）太緊", "B": "股骨頭（femoral head）外側軟骨磨損", "C": "股二頭肌（biceps femoris）太緊", "D": "坐骨神經（sciatic nerve）受壓迫"}, "images": [], "answer": "A", "explanation": "答案：A。內側膕旁肌（medial hamstrings）太緊—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 12, "stem": "下列有關於髖關節置換術後，病患急性期之一般運動注意事項的敘述何者錯誤？", "options": {"A": "要限制髖關節屈曲小於80到90度以及旋轉小於45度", "B": "坐在椅子或馬桶時，儘量讓膝關節略高於髖關節，以保護傷口", "C": "當上樓梯時，健側腳先上，當下樓梯時，患側腳先下", "D": "以健側下肢為軸執行轉彎或轉身的動作"}, "images": [], "answer": "B", "explanation": "答案：B。坐在椅子或馬桶時，儘量讓膝關節略高於髖關節，以保護傷口—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 13, "stem": "有關下圖髖關節測試之敘述，下列何者錯誤？", "options": {"A": "此檢查稱為Noble compression測試", "B": "若檢查結果為陽性，則代表髂脛束（iliotibial band）或是闊筋膜張肌（tensor fascia latae）過緊或過短", "C": "若膝關節水平位置明顯高於髖關節，則代表檢查結果為陽性", "D": "有轉子滑囊炎（trochanteric bursitis）之患者，於此測試時可能出現髖關節外側疼痛"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQoAAAClCAIAAAArlCQRAAAACXBIWXMAAA7EAAAOxAGVKw4bAABYlUlEQVR4nO19d5wUxdb2ogKCAVGCIlmCIIIIBgTJOaOIJAmSM4ggcclRclwykvMSl5yWnFnSLjnnoF7f9+oru9Pfc/v5+twzPWGDMLsLe/6YX09PTXV11QnPqTp1ys+IJ+TwQH/++aeUiYiIwOf//d//BQYGXrt27bfffpP//v333+Hh4ZE+5a+//pK/PIWXSKB4Rn6x3YCok luteal bursitis）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 20, "stem": "下列肌肉何者收縮時可以增加胸腰筋膜（thoracolumbar fascia）的拉力，以增加腰椎穩定\n性？", "options": {"A": "腹外斜肌", "B": "前鋸肌", "C": "腹直肌", "D": "闊背肌"}, "images": [], "answer": "D", "explanation": "答案：D。闊背肌—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 21, "stem": "針對髖部骨折的手術可能傷及的肌肉，應詳細評估下列何者？①股直肌（rectus femoris）\n②闊筋膜張肌（tensor fascia lata） ③臀中肌 ④股外側肌（vastus lateralis） ⑤股二頭\n肌", "options": {"A": "僅①②③", "B": "僅①②④", "C": "僅②③④", "D": "僅①③⑤"}, "images": [], "answer": "C", "explanation": "答案：C。僅②③④—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 22, "stem": "下列何者不屬於神經動力學測試（neurodynamic test）？", "options": {"A": "駝背測試（slump test）", "B": "俯臥膝屈曲測試（prone knee bending test）", "C": "弓弦測試（bowstring test）", "D": "McKenzie氏側滑測試（side glide test）"}, "images": [], "answer": "D", "explanation": "答案：D。McKenzie氏側滑測試（side glide test）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 23, "stem": "針對適用伸直原則（extension bias）治療的急性下背痛患者，當運用骨盆傾斜（pelvic tilt）\n運動於無痛範圍（pain-free range）來進行運動感覺或穩定度訓練（kinesthetic and\nstabilization training）時，通常較建議以下列何種動作來結束例行練習動作？", "options": {"A": "骨盆前傾（anterior tilt）", "B": "維持骨盆正中姿勢（neutral position of pelvis）", "C": "骨盆後傾（posterior tilt）", "D": "骨盆側傾（lateral tilt）"}, "images": [], "answer": "A", "explanation": "答案：A。骨盆前傾（anterior tilt）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 24, "stem": "下列有關髂股韌帶（iliofemoral ligament）之敘述，何者錯誤？", "options": {"A": "是髖關節內最強的一條韌帶", "B": "又稱Y ligament of Bigelow", "C": "主要限制髖關節外轉與彎曲動作", "D": "附著於股骨之轉子間線（intertrochanteric line）"}, "images": [], "answer": "C", "explanation": "答案：C。主要限制髖關節外轉與彎曲動作—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 25, "stem": "根據學者 Cyriax 的說法，腰痛患者若於身體前彎或側彎的過程中出現疼痛弧（ painful arc）\n的現象，最可能是下列何種問題所引起？", "options": {"A": "腰椎間盤突出", "B": "脊椎狹窄（spinal stenosis）", "C": "腰椎壓迫性骨折", "D": "背部肌肉拉傷"}, "images": [], "answer": "A", "explanation": "答案：A。腰椎間盤突出—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 26, "stem": "L2-L3神經根受壓迫時，可能看到下列何種步態？", "options": {"A": "擺盪初期骨盆後傾", "B": "擺盪初期骨盆前傾", "C": "著地期膝關節彎曲", "D": "著地期膝關節外翻"}, "images": [], "answer": "A", "explanation": "答案：A。擺盪初期骨盆後傾—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 27, "stem": "下列有關肩關節後內側夾擠測試（posterior internal impingement test）之敘述，何者錯誤？", "options": {"A": "受測者應採取俯臥姿勢，讓施測者較易觸摸受測肩的後方", "B": "將受測手臂擺位在肩外展90度、最大外轉姿勢下測", "C": "肩盂唇（labrum）傷害者，此測試結果可為陽性反應", "D": "測試結果為陽性反應者，常伴隨有肩前向不穩（anterior instability）的問題"}, "images": [], "answer": "A", "explanation": "答案：A。受測者應採取俯臥姿勢，讓施測者較易觸摸受測肩的後方—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 28, "stem": "下列那條神經損傷最可能造成肩部體表感覺改變？", "options": {"A": "背肩胛神經（dorsal scapular nerve）", "B": "外胸神經（lateral pectoral nerve）", "C": "胸背神經（thoracodorsal nerve）", "D": "上鎖骨神經（supraclavicular nerve）"}, "images": [], "answer": "D", "explanation": "答案：D。上鎖骨神經（supraclavicular nerve）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 29, "stem": "職業棒球投手之慣用手與非慣用手肩關節內轉與外轉活動度之差異之原因為：①後面旋轉肌\n緊縮 ②後關節囊緊縮 ③肱骨後傾（retroversion）角度增大 ④中盂肱韌帶（middle\nglenohumeral ligament）緊縮", "options": {"A": "僅①②③", "B": "僅①②④", "C": "僅②③④", "D": "僅①③④"}, "images": [], "answer": "A", "explanation": "答案：A。僅①②③—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 30, "stem": "下列與五十肩相關的促成因素，何者錯誤？", "options": {"A": "胸椎駝背", "B": "中風", "C": "糖尿病", "D": "顏面神經麻痺"}, "images": [], "answer": "D", "explanation": "答案：D。顏面神經麻痺—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 31, "stem": "肩關節囊前側緊縮會造成下列何種肱骨動作受到限制？", "options": {"A": "外轉", "B": "內轉", "C": "屈曲", "D": "內收"}, "images": [], "answer": "A", "explanation": "答案：A。外轉—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 32, "stem": "下列何者最有助於在抬臂過程，維持肱骨頭（humeral head）在關節盂（glenoid fossa）\n內，且若出現肌肉無力問題，可能導致肱骨頭過度向前位移的失穩現象（excessive anterior\ntranslation and instability）？", "options": {"A": "棘上肌（supraspinatus）", "B": "棘下肌（infraspinatus）", "C": "胸小肌（pectoralis minor）", "D": "肩胛下肌（subscapularis）"}, "images": [], "answer": "#", "explanation": "本題公告一律給分（答案不限）。題幹：下列何者最有助於在抬臂過程，維持肱骨頭（humeral head）在關節盂（glenoid fossa） 內，且若出現肌…可能因題意不清、選項皆有爭議或圖表不明確等原因，考選部裁定一律給分。"}, {"n": 33, "stem": "胸小肌短縮會影響肩胛骨之角度，下列敘述何者正確？", "options": {"A": "肩胛骨前突（protraction）與後傾（posterior tipping）角度均較大", "B": "肩胛骨前突（protraction）角度較大，然其後傾（posterior tipping）角度則較小", m": "施行下列那項肩關節特殊測試時，需要給予肱骨（humerus）一個軸向負荷（axial load）？", "options": {"A": "O'Brien主動壓迫測試", "B": "歸位移動測試（load and shift test）", "C": "肩盂唇曲柄測試（labral crank test）", "D": "喀拉聲測試（clunk test）"}, "images": [], "answer": "#", "explanation": "本題公告一律給分（答案不限）。題幹：施行下列那項肩關節特殊測試時，需要給予肱骨（humerus）一個軸向負荷（axial load）？…可能因題意不清、選項皆有爭議或圖表不明確等原因，考選部裁定一律給分。"}, {"n": 34, "stem": "處於冰凍期的冰凍肩患者，在抬臂過程中伴隨聳肩動作（hiking shoulder），有關其關節內活動（joint play）的檢查結果，下\n列何者受限最明顯？", "options": {"A": "肱骨頭頭向滑動（cephalad glide）", "B": "肱骨頭後向滑動（posterior glide）", "C": "肱骨頭外向滑動（lateral glide）", "D": "肱骨頭尾向滑動（caudal glide）"}, "images": [], "answer": "D", "explanation": "答案：D。肱骨頭尾向滑動（caudal glide）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 35, "stem": "有關肩關節的穩定性，下列敘述那些正確？①盂肱（glenohumeral）關節前向的穩定性，有賴盂肱韌帶維護 ②盂唇\n（glenoid labrum）加深盂窩，提高穩定度 ③有壓力加於肩峰鎖骨關節時，容易造成鎖骨往肩峰下移動 ④肩胛後縮\n（retraction）時，肩峰鎖骨關節在閉鎖（close packed）位置，比較穩定", "options": {"A": "僅③④", "B": "僅①②", "C": "僅②③", "D": "僅①④"}, "images": [], "answer": "B", "explanation": "答案：B。僅①②—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 36, "stem": "關於肩關節置換術後的物理治療，下列敘述何者正確？", "options": {"A": "肩關節一律固定於身旁，手肘彎曲90度，放在腹部", "B": "三週內，肩關節雖不須固定，但最好只做肘關節與腕關節運動", "C": "應立即加強肩關節與肩胛旁肌肉之肌力訓練", "D": "肩關節活動度的訓練可採多回合，低重複次數的方式進行"}, "images": [], "answer": "D", "explanation": "答案：D。肩關節活動度的訓練可採多回合，低重複次數的方式進行—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 37, "stem": "患有肩夾擠症之運動員，經運動訓練後，要在每秒180°角速度下之肩外轉肌群等速肌力與肩內轉肌群等速肌力比值至少約為多\n少時，才可以開始進行投擲運動？", "options": {"A": "70%", "B": "100%", "C": "50%", "D": "120%"}, "images": [], "answer": "A", "explanation": "答案：A。70%—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 38, "stem": "棘下肌完全斷裂（full-thickness infraspinatus tear）並進行修復手術後，至少需等幾週才可以進行高強度拉筋治療（vigorous\nstretching）？且最初需避免在肩關節那個動作進行末段範圍拉筋（end-range stretching）？", "options": {"A": "4週、內轉", "B": "4週、外轉", "C": "12週、內轉", "D": "12週、外轉"}, "images": [], "answer": "C", "explanation": "答案：C。12週、內轉—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 39, "stem": "下列有關肘關節活動之敘述，何者錯誤？", "options": {"A": "手肘伸直活動度的喪失是關節內病變的一個敏感指標", "B": "如果兩手手肘未曾受傷且均有10度以內之過度伸直（hyperextension），此情形可視為正常", "C": "前臂的旋前旋後動作是由尺骨繞著不動的橈骨所產生", "D": "手肘攜物角（carrying angle）的角度大小可用以判斷是否有肘外翻（cubitus valgus）現象"}, "images": [], "answer": "C", "explanation": "答案：C。前臂的旋前旋後動作是由尺骨繞著不動的橈骨所產生—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 40, "stem": "下列何者較不適用於腕隧道症候群（carpal tunnel syndrome）之治療初期？", "options": {"A": "正中神經滑動運動（median nerve gliding exercise）", "B": "手指肌腱滑動運動（tendon gliding exercise）", "C": "反覆用力握球運動（ball grasping exercise）", "D": "使用手腕護具（splint）"}, "images": [], "answer": "C", "explanation": "答案：C。反覆用力握球運動（ball grasping exercise）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 41, "stem": "有關前臂肌肉位置，由外向內之排列順序，下列何者正確？", "options": {"A": "橈側屈腕肌、旋前圓肌、尺側屈腕肌、掌長肌", "B": "旋前圓肌、掌長肌、橈側屈腕肌、尺側屈腕肌", "C": "橈側屈腕肌、掌長肌、尺側屈腕肌、旋前圓肌", "D": "旋前圓肌、橈側屈腕肌、掌長肌、尺側屈腕肌"}, "images": [], "answer": "D", "explanation": "答案：D。旋前圓肌、橈側屈腕肌、掌長肌、尺側屈腕肌—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 42, "stem": "王先生接受評估檢查時，出現前臂疼痛，同時拇指與食指的捏壓指力以及屈指深肌兩者均呈現無力現象，最有可能是下列那一\n條神經異常？", "options": {"A": "後骨間神經（posterior interosseous nerve）", "B": "尺神經（ulnar nerve）", "C": "橈神經（radial nerve）", "D": "正中神經（median nerve）"}, "images": [], "answer": "D", "explanation": "答案：D。正中神經（median nerve）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 43, "stem": "下列有關橈（radial）神經的敘述，何者正確？", "options": {"A": "是由臂神經叢（brachial plexus）之前索（anterior cord）接續下來的", "B": "後骨間（posterior interosseous）神經是其分支，它支配外展拇指長肌（abductor pollicis longus），但不支配外展拇指短肌 （abductor pollicis brevis）", "C": "其表淺感覺分支（superficial sensory branch）通過腕隧道", "D": "經過肱骨外髁（lateral epicondyle）後，進入前臂，穿過旋前圓肌（pronator teres）後再分支"}, "images": [], "answer": "B", "explanation": "答案：B。後骨間（posterior interosseous）神經是其分支，它支配外展拇指長肌（abductor pollicis longus），但不支配外展拇指短肌—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 44, "stem": "附圖為何種手部畸形？", "options": {"A": "Boutonniere deformity", "B": "Swan neck deformity", "C": "Dupuytren’s contracture", "D": "Bishop’s hand deformity"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAbwAAADiCAIAAAC6IeW7AAAACXBIWXMAAA7EAAAOxAGVKw4bAABsv0lEQVR4nOx9iVcVV7r976947/Va7603dKdfJ+lOp9NJJzEm6URN4hCNYzSOOOIIiqCiIJ 於 70 度執行開放鏈動作有較大的脛股骨關節的壓迫力", "B": "執行下肢開放鏈動作，當膝關節彎曲至 75 度時，髕股骨關節受到最大壓迫", "C": "執行下肢閉鎖鏈動作，當膝關節彎曲至 75 度時，後十字韌帶所承受之張力相當於體重", "D": "執行下肢閉鎖鏈動作，前十字韌帶於膝關節彎曲小於 25 度時承受最大拉力"}, "images": [], "answer": "B", "explanation": "答案：B。執行下肢開放鏈動作，當膝關節彎曲至 75 度時，髕股骨關節受到最大壓迫—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 48, "stem": "下列有關膝關節半月板切除術（meniscectomy）與半月板修補術（repair）患者復健時程之比較，何者最正確？", "options": {"A": "前者需要較多的關節固定限制，且較晚才可開始承重訓練", "B": "後者需要較多的關節固定限制，且較晚才可開始承重訓練", "C": "前者需要較多的關節固定限制，但可較早開始承重訓練", "D": "後者需要較多的關節固定限制，但可較早開始承重訓練"}, "images": [], "answer": "B", "explanation": "答案：B。後者需要較多的關節固定限制，且較晚才可開始承重訓練—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 49, "stem": "接受膝前十字韌帶重建術之患者，最好能在術後 7 至 10 天內儘快增進膝關節活動至膝屈曲至少幾度以上，以避免日後慢性問\n題之發生？", "options": {"A": "30", "B": "40", "C": "50", "D": "90"}, "images": [], "answer": "D", "explanation": "答案：D。90—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 50, "stem": "下列那些為適合前十字韌帶重建術患者重返競技活動的條件？①完全恢復之膝關節活動度 ②以KT-1000測量膝關節鬆弛度，\n兩膝差異>3mm ③股四頭肌肌力至少為健側的65% ④膕旁肌肌力為健側的100% ⑤膕旁肌與股四頭肌肌力比值>0.7", "options": {"A": "①②③", "B": "③④⑤", "C": "②③④", "D": "①④⑤"}, "images": [], "answer": "D", "explanation": "答案：D。①④⑤—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 51, "stem": "下列關於Q角度之敘述，何者錯誤？", "options": {"A": "代表髕骨（patella）在額面（frontal plane）之排列情形（alignment）", "B": "代表股四頭肌與髕骨韌帶之交角", "C": "在膝伸直且股四頭肌收縮的情況下會大於 15 度", "D": "與髕骨之滑動軌跡（tracking）相關"}, "images": [], "answer": "C", "explanation": "答案：C。在膝伸直且股四頭肌收縮的情況下會大於 15 度—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 52, "stem": "進行髕骨穩定性測試時，膝關節彎曲角度應約為多少，以便讓髕骨置放於滑車溝（trochlear groove）中？", "options": {"A": "0～5度", "B": "10～30度", "C": "45～60度", "D": "＞90度"}, "images": [], "answer": "B", "explanation": "答案：B。10～30度—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 53, "stem": "下列有關膝前十字韌帶重建手術常用的髕骨肌腱移植（patellar tendon graft）與膕旁肌移植（hamstring graft）之比較，何者\n正確？", "options": {"A": "髕骨肌腱移植採用骨對骨（bone-to-bone ）癒合機制，相較於膕旁肌腱移植，癒合速度較快", "B": "髕骨肌腱移植採用肌腱對骨（tendon-to-bone）癒合機制，相較於膕旁肌腱移植，癒合速度較快", "C": "膕旁肌腱移植採用骨對骨（bone-to-bone）癒合機制，相較於髕骨肌腱移植，癒合速度較快", "D": "膕旁肌腱移植採用肌腱對骨（tendon-to-bone）癒合機制，相較於髕骨肌腱移植，癒合速度較快"}, "images const state = {
  paper: "Q1",
  idx: {Q1: 0, Q2: 0},
  picks: { Q1: {}, Q2: {} }, // hydrated later, after persistence block defines PICKS_STORAGE_KEY
};

const $ = sel => document.querySelector(sel);
const main = $("#main");
const grid = $("#grid");
const progressEl = $("#progress");

function isCorrect(paper, n, pick) {
  const ans = DATA[paper].questions[n-1].answer;
  if (ans === "#") return true; // 一律給分
  return ans.indexOf(pick) >= 0; // single "A" or multi "AB" (X 或 Y 均給分)
}

function picksDone(paper) {
  return Object.keys(state.picks[paper]).length;
}

function score(paper) {
  let s = 0;
  for (const n in state.picks[paper]) {
    if (isCorrect(paper, parseInt(n), state.picks[paper][n])) s++;
  }
  return s;
}

function renderGrid() {
  grid.innerHTML = "";
  const qs = DATA[state.paper].questions;
  for (let i = 0; i < qs.length; i++) {
    const n = i + 1;
    const btn = document.createElement("button");
    btn.className = "gbtn";
    btn.textContent = n;
    if (state.idx[state.paper] === i && !state.viewSummary) btn.classList.add("cur");
    if (n in state.picks[state.paper]) {
      const ok = isCorrect(state.paper, n, state.picks[state.paper][n]);
      btn.classList.add(ok ? "right" : "wrong");
    }
    if (isMarked(state.paper, n)) btn.classList.add("marked");
    btn.onclick = () => { state.viewSummary = false; state.idx[state.paper] = i; render(); };
    grid.appendChild(btn);
  }
}

function escapeHTML(s) { return s.replace(/&/g, "&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderQuestion() {
  const qs = DATA[state.paper].questions;
  const i = state.idx[state.paper];
  const q = qs[i];
  const pick = state.picks[state.paper][q.n];
  const locked = !!pick;
  const correct = q.answer;
  const total = qs.length;
  progressEl.textContent = `第 ${i+1} 題 / 共 ${total} 題　·　已作答 ${picksDone(state.paper)}　·　目前得分 ${score(state.paper)}`;

  for (const u of q.images) imgsHTML += `<img class="qimg" src="${u}" alt="題目附圖">`;

  let optsHTML = "";
  for (const k of ["A","B","C","D"]) {
    let cls = "opt";
    if (locked) {
      cls += " locked";
      const isCorrLetter = (correct !== "#" && correct.indexOf(k) >= 0);
      if (isCorrLetter) cls += " correct";
      else if (k === pick && correct !== "#") cls += " wrong";
      else if (correct === "#" && k === pick) cls += " correct";
    }
    optsHTML += `<button class="${cls}" data-k="${k}" ${locked ? "disabled" : ""}>
      <span class="label">${k}.</span><span>${escapeHTML(q.options[k] || "")}</span>

  }

  let verdictHTML = "";
  if (locked) {
    if (correct === "#") {
      verdictHTML = `<div class="verdict note">
        <h3>本題經考選部公告「一律給分」</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else if (correct.length > 1) {
      const ok = correct.indexOf(pick) >= 0;
      const letters = correct.split("").join(" 或 ");
      verdictHTML = `<div class="verdict note">
        <h3>本題經考選部公告「答 ${letters} 均給分」　·　${ok ? "✓ 你的選擇 ("+pick+") 在正解內" : "✗ 你選 "+pick+"，未在正解內"}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else {
      const ok = pick === correct;
      verdictHTML = `<div class="verdict ${ok ? "right" : "wrong"}">
        <h3>${ok ? "✓ 答對" : "✗ 答錯"}　·　正解：${correct}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    }
  }

  main.innerHTML = `<div class="card">
    <div class="qhead">
      <span class="qnum">第 ${q.n} 題</span>
      <span class="qmeta">${DATA[state.paper].label}　·　${q.images.length>0?"含附圖":"純文字"}${isMarked(state.paper, q.n) ? ' <span class="marked-badge">🔖 已標記</span>' : ''}</span>
      <button class="markbtn ${isMarked(state.paper, q.n) ? "marked" : ""}" id="markBtn" title="標記此題以便日後複習">${isMarked(state.paper, q.n) ? "🔖 已標記" : "🔖 標記"}</button>
    </div>
    <div class="stem">${escapeHTML(q.stem)}</div>
    ${imgsHTML}
    <div class="opts">${optsHTML}</div>
    ${verdictHTML}
    <div class="nav">
      <button class="btn ghost" id="prevBtn" ${i===0?"disabled":""}>← 上一題</button>
      <button class="btn" id="nextBtn" ${i===total-1?"disabled":""}>下一題 →</button>
      <button class="btn ghost" id="clearBtn" ${locked?"":"disabled"}>清除本題作答</button>
      ${i===total-1?'<button class="btn" id="finishBtn">完成本卷 / 看總結</button>':""}
    </div>
  </div>`;

  // wire up
  main.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => {
      if (locked) return;
      const k = el.getAttribute("data-k");
      state.picks[state.paper][q.n] = k;
      savePicks();
      render();
    };
  });
  $("#prevBtn").onclick = () => { if (i>0) { state.idx[state.paper] = i-1; render(); } };
  $("#nextBtn").onclick = () => { if (i<total-1) { state.idx[state.paper] = i+1; render(); } };
  $("#clearBtn").onclick = () => { delete state.picks[state.paper][q.n]; savePicks(); render(); };
  $("#markBtn").onclick = () => { toggleMark(state.paper, q.n); render(); };
  const fb = document.getElementById("finishBtn");
  if (fb) fb.onclick = () => { state.viewSummary = true; render(); };
}

function renderSummary() {
  const qs = DATA[state.paper].questions;

    ${unansweredRows.length>0?`<div style="margin-top:14px;">
      <h3 style="margin:0 0 6px;">未作答（${unansweredRows.length}）</h3>
      <div class="wrong-list">${unansweredRows.join("")}</div>
    </div>`:""}
    ${(()=>{ const rows=[]; for (let i=0;i<qs.length;i++){ const q=qs[i]; if (!isMarked(state.paper,q.n)) continue; const pick=state.picks[state.paper][q.n]; const stemShort = q.stem.length>50?q.stem.slice(0,50)+'…':q.stem; const tag = pick===undefined?'未作答':(q.answer==='#'?'一律給分':(pick===q.answer?'答對':'答錯')); const tagColor = pick===undefined?'var(--ink-soft)':(q.answer==='#'?'var(--yellow)':(pick===q.answer?'var(--green)':'var(--red)')); rows.push(`<div class="wrong-row mk" data-idx="${i}"><strong>★ 第 ${q.n} 題</strong><span style="color:${tagColor};">${tag}</span><span style="color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(stemShort)}</span></div>`); } return rows.length>0 ? `<div style="margin-top:14px;"><h3 style="margin:0 0 6px;">🔖 已標記題目（${rows.length}）</h3><div class="wrong-list">${rows.join('')}</div><button class="btn ghost" id="clearMarksBtn" style="margin-top:8px;font-size:13px;">清除本卷所有標記</button></div>` : ''; })()}
    <div class="nav" style="margin-top:18px;">

      <button class="btn danger" id="resetBtn2">重置本卷</button>
    </div>
  </div>`;
  main.querySelectorAll(".wrong-row").forEach(el => {
    el.onclick = () => {
      state.idx[state.paper] = parseInt(el.getAttribute("data-idx"));

    };
  });
  document.getElementById("backBtn").onclick = () => { state.viewSummary = false; render(); };
  const cmb = document.getElementById("clearMarksBtn");
  if (cmb) cmb.onclick = () => { if (confirm("確定要清除「" + DATA[state.paper].label + "」這一卷的所有標記嗎？")) { clearAllMarks(state.paper); render(); } };
  document.getElementById("resetBtn2").onclick = () => { resetCurrent(); };
}

function render() {
  renderGrid();
  if (state.viewSummary) renderSummary();
  else renderQuestion();
}

function resetCurrent() {
  if (!confirm(`確定要清除「${DATA[state.paper].label}」這一卷的所有作答與標記嗎？`)) return;
  state.picks[state.paper] = {};
  state.marks[state.paper] = {};
  state.idx[state.paper] = 0;
  state.viewSummary = false;
  savePicks();
  saveMarks();
  render();
}

document.querySelectorAll(".tab").forEach(t => {

// ===== Answer persistence (per-paper picks, saved to localStorage) =====
const PICKS_STORAGE_KEY = "nephron_105_ortho_picks_v1";
const QUIZ_ID = "ortho_105";  // unique id used when broadcasting summary

function loadPicks() {
  try {
    const s = localStorage.getItem(PICKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function savePicks() {
  try { localStorage.setItem(PICKS_STORAGE_KEY, JSON.stringify(state.picks)); } catch (e) {}
  broadcastProgress();
}

// Send a summary of progress to parent window if embedded in an iframe.
// Used by the dashboard (index.html) to show progress bars.
function broadcastProgress() {
  if (typeof window === "undefined") return;
  let target = null;
  try { if (window.parent && window.parent !== window) target = window.parent; } catch(e){}
  if (!target) return;
  try {
    const summary = { type: "quizSummary", quizId: QUIZ_ID, papers: {} };
    for (const tag of ["Q1","Q2"]) {
      const qs = DATA[tag].questions;
      const picks = state.picks[tag] || {};
      const marks = state.marks ? (state.marks[tag] || {}) : {};
      let answered = 0, correct = 0;
      for (const n in picks) {
        answered++;
        if (isCorrect(tag, parseInt(n), picks[n])) correct++;
      }
      summary.papers[tag] = {
        label: DATA[tag].label,
        total: qs.length,
        answered, correct,
        marked: Object.keys(marks).length,
      };
    }
    target.postMessage(summary, "*");
  } catch (e) {}
}

// Hydrate persisted picks now that PICKS_STORAGE_KEY and loadPicks are defined
state.picks = loadPicks();

// ===== Bookmarks (per-paper question marks, persisted to localStorage) =====
const MARKS_STORAGE_KEY = "nephron_105_ortho_marks_v1";
function loadMarks() {
  try {
    const s = localStorage.getItem(MARKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function saveMarks() {
  try { localStorage.setItem(MARKS_STORAGE_KEY, JSON.stringify(state.marks)); } catch (e) {}
  broadcastProgress();
}
function toggleMark(paper, n) {
  if (state.marks[paper][n]) delete state.marks[paper][n];
  else state.marks[paper][n] = true;
  saveMarks();
}
function isMarked(paper, n) { return !!state.marks[paper][n]; }
function clearAllMarks(paper) {
  state.marks[paper] = {};
  saveMarks();
}
function markedCount(paper) { return Object.keys(state.marks[paper]).length; }
state.marks = loadMarks();

// ===== Export / Download report =====
function _esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function _stamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function _nowStr() { return new Date().toLocaleString("zh-TW", {hour12: false}); }

function _filterQs(paper, filter) {
  const qs = DATA[paper].questions;
  const picks = state.picks[paper];
  if (filter === "all") return qs.slice();
  if (filter === "answered") return qs.filter(q => picks[q.n] !== undefined);
  if (filter === "unanswered") return qs.filter(q => picks[q.n] === undefined);
  if (filter === "wrong") {
    return qs.filter(q => {
      const p = picks[q.n];
      return p !== undefined && q.answer !== "#" && q.answer.indexOf(p) < 0;
    });
  }
  if (filter === "marked") return qs.filter(q => isMarked(paper, q.n));
  return qs.slice();
}

function _filterCounts(paper) {
  return {
    all: _filterQs(paper, "all").length,
    answered: _filterQs(paper, "answered").length,
    wrong: _filterQs(paper, "wrong").length,
    unanswered: _filterQs(paper, "unanswered").length,
    marked: _filterQs(paper, "marked").length,
  };
}

  } else {
    main = body;
  }

  const html = `<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${_esc(fileTitle)}</title>
<style>${css}</style>
</head>
<body>
<div class="wrap">
  <header class="report">
    <h1>${_esc(subjectTitle)}</h1>
    <div class="score">得分 ${correctCount} / ${total} （${pct}%）</div>
    <div class="meta">
      已作答 ${answered} 題 · 答對 ${correctCount} 題 · 答錯 ${answered - correctCount} 題 · 未作答 ${total - answered} 題 · 🔖 已標記 ${markedCount(paper)} 題<br>
      匯出範圍：<b>${filterLabel}</b>（${qs.length} 題） · 匯出時間：${_nowStr()}
    </div>
    <div class="actions">
      <button class="print-btn" onclick="window.print()">列印 / 存成 PDF</button>
    </div>
  </header>
  <main>${main}</main>
</div>
</body>
</html>`;
  return { html, fileTitle };
}

function downloadExport(filter) {
  const { html, fileTitle } = buildExportHTML(state.paper, filter);
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fileTitle + ".html";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
}

function showExportModal() {
  const modal = document.getElementById("exportModal");
  // Update counts based on current paper state
  const c = _filterCounts(state.paper);
  document.getElementById("cntAll").textContent = `(${c.all} 題)`;
  document.getElementById("cntAnswered").textContent = `(${c.answered} 題)`;
  document.getElementById("cntWrong").textContent = `(${c.wrong} 題)`;
  document.getElementById("cntUnans").textContent = `(${c.unanswered} 題)`;
  document.getElementById("cntMarked").textContent = `(${c.marked} 題)`;
  document.getElementById("exportSub").textContent =
    "本卷：" + DATA[state.paper].label + (state.paper === "Q1" ? "（114020）" : "（114090）");
  // Disable empty options
  document.querySelectorAll("#exportOpts .exp-opt").forEach(b => {
    const f = b.getAttribute("data-filter");
    b.disabled = (c[f] === 0);
  });
  modal.classList.add("show");
}
function hideExportModal() {
  document.getElementById("exportModal").classList.remove("show");
}

document.getElementById("exportBtn").onclick = showExportModal;
document.getElementById("closeExportBtn").onclick = hideExportModal;
document.getElementById("exportModal").addEventListener("click", e => {
  if (e.target.id === "exportModal") hideExportModal();
});
document.querySelectorAll("#exportOpts .exp-opt").forEach(btn => {
  btn.onclick = () => {
    const filter = btn.getAttribute("data-filter");
    if (btn.disabled) return;
    downloadExport(filter);
    hideExportModal();
  };
});

render();
// Broadcast initial state to parent (dashboard) if loaded as iframe
broadcastProgress();
</script>
</body>
</html>
