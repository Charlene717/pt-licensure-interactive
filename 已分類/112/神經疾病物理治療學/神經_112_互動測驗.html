<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神經疾病物理治療學 — 114 年互動測驗</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --ink: #1f2933;
    --ink-soft: #52606d;
    --line: #e4e7eb;
    --primary: #1d6f9b;
    --primary-soft: #e6f1f7;
    --green: #2f9e44;
    --green-soft: #d3f9d8;
    --red: #c92a2a;
    --red-soft: #ffe3e3;
    --yellow: #d9a700;
    --yellow-soft: #fff4c2;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei",
                 "Noto Sans TC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
    font-size: 16px;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 14px 22px;
    position: sticky; top: 0; z-index: 10;
  }
  .h-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    background: #f1f3f5; border: 1px solid var(--line); color: var(--ink-soft);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .progress { color: var(--ink-soft); font-size: 14px; margin-left: auto; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 22px; max-width: 1400px; margin: 18px auto; padding: 0 22px; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; padding: 0 14px; } .sidebar { order: 2; position: static; } }
  .sidebar {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; height: fit-content; position: sticky; top: 78px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
  }
  .gbtn {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
    color: var(--ink-soft); font-size: 13px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .gbtn:hover { border-color: var(--primary); }
  .gbtn.cur { background: var(--primary); color: #fff; border-color: var(--primary); }
  .gbtn.right { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .gbtn.wrong { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .legend { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 4px; border: 1px solid var(--line); }
  .dot.r { background: var(--green-soft); border-color: var(--green); }
  .dot.w { background: var(--red-soft); border-color: var(--red); }
  .main { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .qhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .qnum { font-size: 22px; font-weight: 700; color: var(--primary); }
  .qmeta { color: var(--ink-soft); font-size: 13px; }
  .stem { font-size: 16px; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
  .qimg { display: block; max-width: 100%; max-height: 480px; margin: 8px 0; border: 1px solid var(--line); border-radius: 6px; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    transition: background .12s, border-color .12s;
    text-align: left;
    font-size: 15.5px;
    color: var(--ink);
  }
  .opt:hover:not(.locked) { background: var(--primary-soft); border-color: var(--primary); }
  .opt.locked { cursor: default; }
  .opt .label { font-weight: 700; min-width: 22px; }
  .opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .opt.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .verdict { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 14px; line-height: 1.7; }
  .verdict.right { background: var(--green-soft); color: #186b29; }
  .verdict.wrong { background: var(--red-soft); color: #861818; }
  .verdict.note { background: var(--yellow-soft); color: #6b4e00; }
  .verdict h3 { margin: 0 0 6px; font-size: 14px; }
  .nav { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    background: var(--primary); color: #fff; border: 0; padding: 9px 18px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: #fff; color: var(--red); border: 1px solid var(--red); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .summary { padding: 18px; }
  .summary h2 { margin: 0 0 8px; }
  .score { font-size: 32px; font-weight: 700; color: var(--primary); }
  .wrong-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .wrong-row { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .wrong-row:hover { background: var(--primary-soft); }
  .footer { color: var(--ink-soft); font-size: 12px; text-align: center; margin: 16px 0 30px; }

  .homelink { color: var(--soft); text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .homelink:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }


  /* Export modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,30,.45); display: none; align-items: center; justify-content: center; z-index: 100; padding: 18px; }
  .modal-bg.show { display: flex; }
  .modal-card { background: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.18); max-width: 460px; width: 100%; padding: 22px; }
  .modal-card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 700; }
  .modal-card .modal-sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; }
  .modal-card .opt-row { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
  .modal-card .exp-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; background: #f8f9fa; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left; color: var(--ink); }
  .modal-card .exp-opt:hover { background: var(--primary-soft); border-color: var(--primary); }
  .modal-card .exp-opt:disabled { opacity: 0.5; cursor: not-allowed; background: #f1f3f5; }
  .modal-card .exp-opt .count { color: var(--ink-soft); font-size: 12px; }
  .modal-card .hint { color: var(--ink-soft); font-size: 12px; line-height: 1.6; margin: 0 0 12px; }
  .modal-card .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }


  /* Bookmark / marker */
  .gbtn { position: relative; }
  .gbtn.marked::after {
    content: "★"; position: absolute; top: 1px; right: 3px;
    font-size: 10px; color: var(--yellow); line-height: 1;
    text-shadow: 0 0 2px #fff;
  }
  .markbtn {
    margin-left: auto; background: #fff; border: 1px solid var(--line);
    color: var(--ink-soft); padding: 6px 13px; border-radius: 999px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .markbtn:hover { border-color: var(--yellow); color: var(--yellow); }
  .markbtn.marked { background: var(--yellow-soft); color: #6b4e00; border-color: var(--yellow); font-weight: 600; }
  .qhead { flex-wrap: wrap; }
  .marked-badge { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--yellow-soft); color: #6b4e00; font-size: 11px; border: 1px solid var(--yellow); margin-left: 4px; }
  .wrong-row.mk { border-color: var(--yellow); }

</style>
</head>

<script>
const DATA = {"Q1": {"label": "第一次", "questions": [{"n": 1, "stem": "正常年輕人在跨越身高10%高度的障礙物時，身體質量中心在不同方向之位移量相對於走路時的變化，下列敘\n述何者正確？", "options": {"A": "前後與左右兩側之位移量皆增加", "B": "前後與上下之位移量皆增加", "C": "前後減少、左右兩側增加", "D": "左右兩側減少、上下增加"}, "images": [], "answer": "B", "explanation": "跨越障礙物時，跨步距離增加（前後位移增）+腳抬高過障礙（上下位移增）；左右位移變化不大；故選 B（前後與上下皆增加）。"}, {"n": 2, "stem": "下列那一項訓練符合Gentile任務分類「身體動態、手部有操作」之活動？", "options": {"A": "提著購物袋站在捷運月台", "B": "抱著孩子站在行進中的公車", "C": "撐著枴杖在公車站等公車", "D": "在音樂廳聽演奏會"}, "images": [], "answer": "B", "explanation": "Gentile 任務分類『身體動態+手部操作』= 身體會動且手要操作物品（如行進公車上抱孩子）；故選 B。"}, {"n": 3, "stem": "健康年輕人站在平衡桿上（雙肩與平衡桿平行），身體突然受到往前輕微的外力干擾，他最有可能採取的姿勢\n穩定策略為何？", "options": {"A": "踝策略", "B": "髖策略", "C": "跨步策略", "D": "伸抓策略"}, "images": [], "answer": "B", "explanation": "站在窄底面平衡桿上+前向擾動，因踝策略不夠用，且無法跨步，採『髖策略』屈髖往後拉重心；故選 B。"}, {"n": 4, "stem": "布蘭－朵夫（Brandt-Daroff）運動的效益主要是透過下列何種學習而產生？", "options": {"A": "聯結性學習（associative learning）", "B": "非聯結性學習（nonassociative learning）", "C": "操作制約（operant conditioning）", "D": "古典制約（classical conditioning）"}, "images": [], "answer": "B", "explanation": "Brandt-Daroff 運動透過重複暴露於誘發姿勢使前庭系統習慣化（habituation）→『非聯結性學習』；故選 B。"}, {"n": 5, "stem": "一位腦傷的患者無法用言語告訴治療師如何從家裡的客廳走到廚房，但他可以因為口渴毫不猶豫起身、走到廚\n房倒水喝了後再回到客廳。此位患者保留了那種記憶能力？", "options": {"A": "敘述記憶（declarative memory）", "B": "程序記憶（procedural memory）", "C": "情節記憶（episodic memory）", "D": "語意記憶（semantic memory）"}, "images": [], "answer": "B", "explanation": "無法言語說明步驟但可實際執行（內隱動作）= 程序記憶（procedural memory）保留；故選 B。"}, {"n": 6, "stem": "同樣的行走訓練，每次練習12分鐘，休息3分鐘，再重複4次，完成練習約60分鐘，此種練習的安排為何？", "options": {"A": "變異（variable）練習", "B": "隨機（random)）練習", "C": "分散（distributed）練習", "D": "集中（massed）練習"}, "images": [], "answer": "D", "explanation": "12 分鐘練習+3 分鐘休息屬『集中練習』(massed practice)，練習時間 > 休息時間；故選 D。"}, {"n": 7, "stem": "有關中樞神經系統神經可塑性的敘述，下列何者錯誤？", "options": {"A": "未受傷的神經元因附近有神經受傷，出現側枝出芽生長，支配空出的標的細胞", "B": "軸突末端向外延伸，出現再生性出芽生長，重新建立與標的神經元的連結", "C": "僅有神經功能性改變，而無結構性改變", "D": "原本功能不明的神經突觸被徵召使用"}, "images": [], "answer": "C", "explanation": "中樞神經可塑性同時包含功能性與結構性改變（神經元出芽、新突觸形成）；C 否定結構變化錯誤。"}, {"n": 8, "stem": "詢問一位總腓神經損傷患者之病史後，依序進行下列檢查：①步態分析 ②本體感覺測試 ③強度－時間曲線\n測試 ④行走輔具評估。上述檢查分別屬於國際健康功能與身心障礙分類系統（ICF）的那個層面？", "options": {"A": "①活動能力 ②身體構造與功能 ③身體構造與功能 ④環境因素", "B": "①活動能力 ②個人因素 ③身體構造與功能 ④社會參與能力", "C": "①個人因素 ②身體構造與功能 ③活動能力 ④環境因素", "D": "①身體構造與功能 ②個人因素 ③活動能力 ④社會參與能力"}, "images": [], "answer": "A", "explanation": "①步態分析=活動能力、②本體感覺=身體功能、③強度時間曲線=身體功能/構造、④輔具評估=環境因素；故選 A。"}, {"n": 9, "stem": "下列何者不包含在工具性日常生活功能（IADL）評估的面向中？", "options": {"A": "處理財務能力", "B": "自己備餐能力", "C": "自行外出搭乘交通工具能力", "D": "語言表達能力"}, "images": [], "answer": "D", "explanation": "IADL 評估含理財、備餐、外出、用藥、購物等；語言表達不在 IADL 評估面向；故選 D。"}, {"n": 10, "stem": "下列何種評估方式較能協助判斷患者之背柱內側絨帶系統（dorsal column-medial lemniscus system）是否正\n常？", "options": {"A": "使用內裝熱水的試管碰觸患者的皮膚，並詢問患者是熱水、冷水或不知道", "B": "使用手指觸碰患者的皮膚，並詢問患者有無感覺到觸碰", "C": "使用迴紋針的尖端碰觸患者的皮膚，並詢問患者有無針刺感", "D": "使用音叉放在患者的骨頭凸起處，並詢問患者有無感覺到震動"}, "images": [], "answer": "D", "explanation": "背柱-內側絨帶系統負責本體覺、震動覺與精細觸覺；音叉測震動最能評估；故選 D。"}, {"n": 11, "stem": "腦中風患者患側下肢踝關節本體覺缺損且背屈肌力不足，行走時偶有垂足現象，欲改善此步態問題，下列何\n者較適合？①站姿下練習患側腳跨上小台階 ②躺姿下於踝背屈肌給予感覺程度的神經肌肉電刺激 ③坐在\n治療球上，治療師由後方骨盆位置給予往後拉力 ④站姿下以彈力帶給予踝關節背屈阻力訓練", "options": {"A": "①②", "B": "②③", "C": "③④", "D": "①④"}, "images": [], "answer": "D", "explanation": "改善垂足適合：①跨小台階主動背屈+患側承重訓練、④彈力帶背屈阻力訓練；②感覺強度 NMES 不足以引發收縮、③骨盆後拉與垂足無關；故選 D（①④）。"}, {"n": 12, "stem": "關於使用彈力繩進行阻力訓練的優缺點，下列敘述何者最不適當？", "options": {"A": "可隨身攜帶，方便進行居家運動", "B": "進行阻力訓練時，彈力繩本身較無法提供動作的穩定", "C": "無法用於中高速度的阻力運動", "D": "可結合肢體與軀幹動作"}, "images": [], "answer": "C", "explanation": "彈力繩可訓練各種速度的阻力運動（含中高速度），故 C 描述錯誤。"}, {"n": 13, "stem": "使用修正版艾許沃斯氏量表（modified Ashworth Scale）來評估肌肉張力，下列敘述何者正確？", "options": {"A": "可以區分神經性與非神經性的肌肉阻力", "B": "公認具有良好的心理計量特性（psychometric properties）", "C": "此量表屬於次序尺度（ordinal scale）的評估方式", "D": "可以用來區別肌肉張力細微的變化"}, "images": [], "answer": "C", "explanation": "MAS 為次序尺度（ordinal scale，分 0、1、1+、2、3、4 級），故選 C。其他描述錯誤（無法區分神經/非神經、心理計量略不足、不能區別細微變化）。"}, {"n": 14, "stem": "65歲的張先生四個月前出血性中風，目前下肢沒有任何主動動作，欲利用本體感覺神經肌肉誘發術來增加下\n肢承重的能力， 下列敘述何者正確？", "options": {"A": "趴姿下利用髖關節彎曲伸直的重複收縮（repeated contractions）加強髖關節伸直的肌力", "B": "側躺姿勢下，要求張先生做出髖關節伸直的動作，利用固定－放鬆（hold-relax）加強髖關節伸直的肌力", "C": "平躺姿勢，利用D1伸直模式和節律性起始（rhythmic initiation）技巧來增加下肢承重能力", "D": "雙手－雙膝跪姿（all-four），在骨盆利用節律性固定（rhythmic stabilization）的技巧，維持此姿勢的穩定 性，來增加下肢承重"}, "images": [], "answer": "D", "explanation": "下肢無主動動作 → 不適合 PNF 收縮類技巧；可採『四足跪+節律性固定』在骨盆給穩定刺激增加承重；故選 D。"}, {"n": 15, "stem": "有關本體感覺神經肌肉誘發術的執行，下列敘述何者正確？", "options": {"A": "治療師的手接觸病人的肢體是為了支撐病人的肢體重量，所以病人能力改善時，接觸範圍也要減少", "B": "沒有特定的治療動作模式，而且每一種治療技巧都可以用來增加病人的動作穩定性", "C": "此技巧主要依靠治療師的口令和動作，若病人意識不清也能順利執行", "D": "治療過程中的口令，可以分成準備、動作、矯正三部分"}, "images": [], "answer": "D", "explanation": "PNF 口令分準備、動作、矯正三階段；故選 D。其他選項描述錯誤。"}, {"n": 16, "stem": "下列關於收縮－放鬆（CR; contract-relax）及固定－放鬆（HR; hold-relax）手法的敘述，何者最為適當？", "options": {"A": "CR：用於沒有疼痛主訴但動作角度受限的患者；HR：用於有疼痛主訴但動作角度沒有受限的患者", "B": "CR：運用於作用肌；HR：運用於拮抗肌", "C": "CR：等張收縮；HR：等長收縮", "D": "CR：由治療師控制阻力大小；HR：由患者主動控制力量大小"}, "images": [], "answer": "C", "explanation": "CR（contract-relax）= 主動肌等張收縮；HR（hold-relax）= 主動肌等長收縮；故選 C。"}, {"n": 17, "stem": "下列何者不符合神經發展治療技術（NDT）中關鍵點控制（key point control）的運\n？", "options": {"A": "以腳趾帶動髖關節彎曲／伸直動作", "B": "以肩部帶動身體平衡反應", "C": "以骨盆帶動下肢跨成翹腳姿勢", "D": "以互握之雙手帶動坐到站"}, "images": [], "answer": "C", "explanation": "NDT 關鍵點是控制中樞點（軀幹/骨盆/肩）；以腳趾帶動髖屈伸不符合 NDT 關鍵點概念，故選 A。"}, {"n": 18, "stem": "訓練一位因下肢力量不足而無法從坐姿站起來的個案，根據玻巴斯學派的概念，應優先選擇下列何者？", "options": {"A": "在臀部下面墊個枕頭，讓骨盆呈現前傾角度", "B": "讓個案用手撐雙側椅面，補強膝蓋無力的狀況", "C": "儘量讓個案彎腰低頭，以改變身體重心位置", "D": "給予助行器，讓患者可以扶著站起來"}, "images": [], "answer": "A", "explanation": "Bobath 概念優先選用『改變姿勢起始位』而非用代償（手撐、輔具、彎腰）；骨盆前傾可幫助 STS 啟動；故選 A。"}, {"n": 19, "stem": "下列何者為強調肌肉張力與反射相關的神經物理治療技巧？", "options": {"A": "玻巴斯與布朗斯壯治療", "B": "本體感覺神經肌肉誘發與動作再學習", "C": "布朗斯壯治療與動作再學習", "D": "玻巴斯與本體感覺神經肌肉誘發"}, "images": [], "answer": "A", "explanation": "強調肌張力與反射的技巧 = 玻巴斯+布朗斯壯；PNF/動作再學習更強調主動動作模式；故選 A。"}, {"n": 20, "stem": "平衡評估系統測試（Balance Evaluation Systems Test）中的傾斜測試（Incline test），讓受測者閉眼站在往上\n傾斜10度的板子上，其主要測試標的為何？", "options": {"A": "對支撐底面積改變的反應", "B": "穩定度極限（limit of stability）", "C": "視覺對站立平衡的貢獻程度", "D": "體感覺對站立平衡的貢獻程度"}, "images": [], "answer": "D", "explanation": "閉眼站在傾斜板（10°）= 改變支撐面/體感覺輸入，主要測『體感覺』對站立平衡的貢獻；故選 D。"}, {"n": 21, "stem": "下列關於任務取向模式的敘述，何者最正確？", "options": {"A": "由Bobath學派提倡，認為動作是由個人、任務與環境互動後呈現的結果", "B": "減少機能損傷是任務取向模式的治療策略之一", "C": "治療師可採用單純的感覺刺激來誘發出複雜且符合任務目標的動作", "D": "不強調病患自主解決動作難題的能力"}, "images": [], "answer": "B", "explanation": "Task-oriented 治療策略含降低機能損傷（impairment-level training）；故選 B 正確。其他選項描述錯誤。"}, {"n": 22, "stem": "利用任務取向策略訓練中風患者，下列何者錯誤？", "options": {"A": "分析動作能力和品質，以確定動作缺失", "B": "對處於低張狀態患者，利用原始反射來誘發張力出現", "C": "先練習動作缺失的部分後，再連結到日常生活的功能性活動", "D": "治療過程中根據患者的表現修改訓練動作的難易度"}, "images": [], "answer": "B", "explanation": "Task-oriented 不主張用原始反射誘發張力；屬 Bobath/Brunnstrom 早期觀念；故 B 錯誤。"}, {"n": 23, "stem": "有關上肢復健機械手套之原理敘述，下列何者錯誤？", "options": {"A": "可藉由收取手部肌肉之表面肌電訊號進行分析來控制機械手臂", "B": "透過可視化的圖形與遊戲介面顯示在螢幕上來給予生物回饋，強化肌力與動作學習", "C": "患者透過重複完成訓練，強化大腦對於手部的控制", "D": "由於需要有肌肉明顯收縮之肌電訊號才能給予控制系統判斷，通常僅能用於肌肉可明顯收縮之慢性中風患 者"}, "images": [], "answer": "D", "explanation": "現代上肢機械手套（如 EMG/EEG-driven）即使僅微弱肌電訊號也可放大訓練；不限於慢性中風；D 描述錯誤。"}, {"n": 24, "stem": "王先生已經中風6個月了，目前下肢仍然沒有主動動作，只有膝關節有輕微的伸直張力，在治療師的指導下可\n以在治療室內進行走路練習，為了增加行走時患側下肢跨步的能力，下列何種治療方式較適當？", "options": {"A": "在平躺姿勢下帶領病人重複做髖關節彎曲內收及膝關節彎曲的動作", "B": "病人靠牆站，將體重移到患側腳，練習拉長患側承重時間", "C": "行走練習時，拍打患側的股四頭肌提醒腳抬高", "D": "行走練習前先冰敷患側的股四頭肌，誘發股四頭肌的收縮"}, "images": [], "answer": "A", "explanation": "中風 6 個月+下肢無主動動作+伸直張力，平躺帶領『屈髖內收+屈膝』(D1 屈曲模式) 練習跨步；故選 A。"}, {"n": 25, "stem": "為左側偏癱個案進行視覺偏盲測試時，下列測試方式何者正確？", "options": {"A": "治療師坐在病患左側，以確認病患可見的視野範圍，再進行測試", "B": "治療師給予清楚的口令，並請病患眼睛跟著治療師的手指移動", "C": "病患通常無法自覺偏盲問題，所以要先請病患轉動頭部以觀察其眼球動作", "D": "治療師坐在病患對面，並請病患眼睛盯著治療師的鼻子再進行測試"}, "images": [], "answer": "D", "explanation": "視野檢查法（confrontation test）：治療師坐對面，請病患盯著治療師鼻子，再從周圍移入手指；故選 D。"}, {"n": 26, "stem": "評估中風患者後發現：在觸碰皮膚時，可正確回答是否有被觸碰；以裝熱水及冷水試管觸碰皮膚時，可正確\n判斷試管溫度；將音叉放在骨頭突起處，無法正確判斷振動感覺；在掌心寫數字時，無法正確判斷數字。下\n列何者正確？", "options": {"A": "聯合皮質感覺異常、深層感覺異常、表層感覺正常", "B": "聯合皮質感覺正常、深層感覺異常、表層感覺正常", "C": "聯合皮質感覺正常、深層感覺正常、表層感覺異常", "D": "聯合皮質感覺異常、深層感覺正常、表層感覺異常"}, "images": [], "answer": "A", "explanation": "皮質感覺異常（無法辨識掌心數字 = graphesthesia 缺損）；深層感覺異常（震動覺無法判別）；表層正常（觸碰、溫度可正確判斷）；故選 A。"}, {"n": 27, "stem": "關於單側忽略中風患者的介入方式，下列何者較不適當？", "options": {"A": "請患者尋找患側手腕綁的紅線", "B": "強調不跨過身體中線的動作", "C": "以健側手帶領患側手拿抹布擦拭桌面", "D": "想像自身如轉動的燈塔般掃視地上的線條"}, "images": [], "answer": "B", "explanation": "單側忽略應『鼓勵跨中線動作』（不是強調不跨）；故 B 不適當。"}, {"n": 28, "stem": "中風個案陳先生行走速度為 0.4公尺／秒，下列何者不是可能的原因？", "options": {"A": "下肢肌力不足", "B": "推進力量的程度小", "C": "站立期結束時的髖關節伸直角度大", "D": "髖外展／內收力量降低"}, "images": [], "answer": "C", "explanation": "中風行走慢（0.4 m/s）通常是肌力不足、推進力小、髖伸直角度小、髖外展內收力下降；C 說『站立期結束時髖伸直角度大』反而代表正常，與行走慢不符，故 C 不是原因。"}, {"n": 29, "stem": "王先生左側視徑（optic tract）因血塊壓迫嚴重受損，關於視野症狀出現之位置為下列何者？", "options": {"A": "右眼顳側、左眼顳側", "B": "右眼鼻側、左眼鼻側", "C": "右眼顳側、左眼鼻側", "D": "右眼鼻側、左眼顳側"}, "images": [], "answer": "C", "explanation": "左視徑損傷 → 雙眼右側同名性偏盲 → 右眼鼻側視野缺損+左眼顳側視野缺損；故選 C。"}, {"n": 30, "stem": "美國國家衛生研究院腦中風評估表（NIH Stroke Scale）中，測量感覺及知覺的測試，不包含下列那一項？", "options": {"A": "視野", "B": "針刺覺及疼痛覺", "C": "肢體本體感覺", "D": "半側感知覺忽略"}, "images": [], "answer": "C", "explanation": "NIHSS 含意識、視野、針刺/疼痛覺、感知覺忽略、面部癱、肢體運動、共濟、語言、構音；不含『肢體本體感覺』；故選 C。"}, {"n": 31, "stem": "下列那一個量表可以完整評估中風病人坐姿到站姿下的姿勢控制能力？", "options": {"A": "軀幹控制測試（Trunk control test）", "B": "軀幹損傷量表（Trunk Impairment Scale）", "C": "傅格－梅爾評估量表（Fugl-Meyer assessment scale）", "D": "中風病患姿勢控制評估量表（The Postural Assessment Scale for Stroke Patients）"}, "images": [], "answer": "D", "explanation": "PASS（Postural Assessment Scale for Stroke Patients）涵蓋坐臥到站姿全範圍姿勢控制；故選 D。"}, {"n": 32, "stem": "給予有感覺障礙的中風病人感覺訓練時，下列何種訓練方式較不建議？", "options": {"A": "患者觸摸自己的健側及患側肢體，增進雙側感覺的對稱性", "B": "手肘穿戴空氣副木後，上肢承重給予關節壓擠刺激", "C": "給予患側手多樣性、高強度的感覺刺激，引起退縮反應", "D": "透過鏡像視覺回饋，給予患側心像練習手部活動的感覺"}, "images": [], "answer": "C", "explanation": "感覺障礙者不應給高強度引起退縮反應的刺激（會造成誤學習與焦慮）；故 C 不建議。"}, {"n": 33, "stem": "後大腦動脈阻塞的病患，常伴隨下列那些症狀，需要進一步進行相關測試？①同側偏盲 ②視丘症候群 ③\n表達型失語症 ④記憶力缺損", "options": {"A": "①②③", "B": "①③④", "C": "①②④", "D": "②③④"}, "images": [], "answer": "C", "explanation": "PCA 阻塞典型症狀：對側同側偏盲①、視丘症候群②、記憶力缺損④（顳葉內側）；表達型失語為 MCA Broca 區，與 PCA 無關；故選 C（①②④）。"}, {"n": 34, "stem": "王太太住在有電梯的大樓，1個月前中風導致左側偏癱，目前在平行桿中練習走路，希望出院後可以自己在家\n中行走不用輪椅。下列那項測試結果最能確認已經達到此目標？", "options": {"A": "巴氏量表分數為70分", "B": "10公尺行走測試花費15秒", "C": "睜眼單腳站可達30秒", "D": "布朗斯壯分級達第四期"}, "images": [], "answer": "B", "explanation": "10 公尺行走測試 15 秒 = 速度約 0.67 m/s，達『社區內行走』臨界值；最能確認獨立行走目標；故選 B。"}, {"n": 35, "stem": "下列何者為有推者症候群（pusher syndrome）中風患者之典型特徵？", "options": {"A": "坐姿下身體重心會偏向後倒", "B": "站姿下因為患側無法支撐體重而讓重心拉向健側", "C": "行走時，患側下肢的擺盪期會過度內收向健側，形成剪刀腳", "D": "行走時若健側使用手杖支撐，重心偏移的現象通常會好轉"}, "images": [], "answer": "C", "explanation": "Pusher syndrome 行走時患側下肢推向健側，但若健側使用手杖支撐反而會穩定（不會讓重心偏移好轉）；題目選 D 為錯誤敘述—實際使用手杖通常不能矯正核心 pusher 問題；按官方答案 D 描述。題目正解：A 為典型坐姿前後不穩定但 pusher 是『側向推向患側』而非後倒；B 描述錯誤（pusher 是把重心推向患側，非健側）；C 是 sciatic nerve gait，與 pusher 無關；D 應該是錯誤的；題目選 D 為正確敘述屬題目選項異常；按官方答案 D。"}, {"n": 36, "stem": "下列何者屬於國際健康功能與身心障礙分類系統（ICF）中，用來評估中風個案的參與（participation）面向？", "options": {"A": "傅格－梅爾評估量表（Fugl-Meyer assessment scale）", "B": "中風衝擊量表（Stroke Impact Scale）", "C": "計時坐站起走測試（Timed up-and-go test）", "D": "巴氏量表（Barthel Index）"}, "images": [], "answer": "B", "explanation": "Stroke Impact Scale (SIS) 評估包含參與面向（社會、情緒、生活品質）；故選 B。FMA 是身體功能、TUG 是活動、Barthel 是活動。"}, {"n": 37, "stem": "對於脊髓損傷患者，下列何項的輔具選配較為適當？", "options": {"A": "下肢全癱的患者應優先選用電動輪椅，以節省上肢肌力", "B": "T4胸髓完全損傷的患者可利用功能性電刺激完全取代支架及輪椅，進行日常活動", "C": "頸髓高位完全損傷的患者可利用具備自動導航功能的電動輪椅，以節省上肢的控制需求", "D": "頸髓完全損傷的患者可以穿戴體重承重式訓練系統，取代患者失去的下肢功能"}, "images": [], "answer": "C", "explanation": "頸髓高位完全損傷可使用具自動導航功能的電動輪椅以節省上肢控制需求；故選 C。其他描述太絕對或不正確。"}, {"n": 38, "stem": "C7脊髓損傷病患經常抱怨頭暈、耳鳴，量測其血壓為80／60 mm Hg、心跳每分鐘65下，下列何者為主要原\n因？", "options": {"A": "神經性休克（neurogenic shock）", "B": "自主神經反射增強（autonomic hyper-reflexia）", "C": "呼吸肌肌力不足", "D": "脊髓休克"}, "images": [], "answer": "A", "explanation": "C7 脊損急性期可能因交感神經失調導致『神經性休克』(低血壓、心搏緩慢)；故選 A。"}, {"n": 39, "stem": "下列何者是布朗－斯夸症候群（Brown-Sequard Syndrome）所表現出之臨床症狀？①受傷同側的運動功能 n": "L-dopa 對動作遲緩、僵直效果好；對顫抖效果中等；對『姿勢不穩』效果『差』(屬非多巴胺路徑)；故選 D。"}, {"n": 52, "stem": "巴金森氏病患者雙手快速且重複做10次前臂旋前－旋後動作，並記錄動作時間。此方式最可能評估的臨床表\n徵為何？", "options": {"A": "動作遲緩", "B": "肌肉張力異常", "C": "靜止性顫抖", "D": "姿勢異常"}, "images": [], "answer": "A", "explanation": "前臂旋前旋後快速重複動作評估『動作遲緩 (bradykinesia)』；故選 A。"}, {"n": 53, "stem": "巴金森氏病患者若有雙側症狀且平衡稍差，但仍能獨立生活，依侯葉氏分期（Hoehn and Yahr stage），應屬\n於下列那一期？", "options": {"A": "I", "B": "II", "C": "III", "D": "IV"}, "images": [], "answer": "C", "explanation": "雙側症狀+平衡稍差+獨立生活=H&Y 第 III 期；故選 C。"}, {"n": 54, "stem": "失智症患者走路常常跌倒，經常告訴家人看到家裡有小偷在偷東西，他很害怕會躲起來。這位患者罹患的可\n能是那一種類型的失智症？", "options": {"A": "阿茲海默型失智症", "B": "血管型失智症", "C": "額顳葉型失智症", "D": "路易氏體失智症"}, "images": [], "answer": "D", "explanation": "視幻覺（看到小偷）+睡眠障礙+跌倒 = 路易氏體失智症（DLB）的典型症狀；故選 D。"}, {"n": 55, "stem": "造成小腦病變的下肢姿勢性低張，與小腦輸出至下列那些路徑的興奮性改變有關？①皮質脊髓徑\n（corticospinal tract） ②紅核脊髓徑（rubrospinal tract） ③前庭脊髓徑（vestibulospinal tract） ④網狀脊\n髓徑（reticulospinal tract）", "options": {"A": "①②", "B": "②③", "C": "③④", "D": "①④"}, "images": [], "answer": "C", "explanation": "小腦輸出至紅核脊髓徑②+前庭脊髓徑③+網狀脊髓徑④；皮質脊髓徑①與小腦無直接連結；故選 C（③④）。"}, {"n": 56, "stem": "訓練小腦損傷患者的物理治療活動設計，由簡單到困難，下列準則何者正確？①動作速度由慢到快 ②由粗\n大動作訓練到精細動作訓練 ③由張眼訓練到閉眼訓練 ④由不加重量在肢體上，到加重量在肢體上   ⑤從\n平躺，進展到坐姿，再到站姿 ⑥先訓練近端穩定度，再訓練遠端肢體控制", "options": {"A": "②④⑥", "B": "①②③⑤", "C": "①③④", "D": "②③⑤⑥"}, "images": [], "answer": "D", "explanation": "小腦訓練漸進原則：先粗大→精細②、先張眼→閉眼③、先平躺→坐→站⑤、先近端→遠端⑥；① 速度由慢到快、④加重量由不加→加，皆是漸進原則；故選 D（②③⑤⑥）—題目選 D 為包含正確的進程組合。"}, {"n": 57, "stem": "下列何種方式適用於評估小腦患者內生性干擾（self-imposed perturbation）對站姿平衡的影響？", "options": {"A": "在站姿下，快速舉起雙手", "B": "在站姿下，看著前方維持不動", "C": "在站姿下，治療師用手推病患", "D": "在站姿下，地板突然向前移動"}, "images": [], "answer": "A", "explanation": "內生性干擾（self-imposed perturbation）= 患者自身產生的擾動；快速舉雙手會產生身體重心轉移與擾動，最適合測試此情況；故選 A。"}, {"n": 58, "stem": "多發性硬化症患者的物理治療活動設計，下列症狀治療與活動安排何者正確？", "options": {"A": "感覺異常：給予熱敷降低皮膚緊繃感", "B": "容易疲乏：改變環境，逐漸增加體力及能量的消耗", "C": "肌無力：肌耐力訓練採間歇、上下肢及有氧無氧交替訓練，中間須充分休息", "D": "體溫影響神經傳導：在較低體溫時運動容易導致呼吸困難，建議中午時運動"}, "images": [], "answer": "C", "explanation": "MS 肌無力訓練應採『間歇式、上下肢及有氧無氧交替+充分休息』，避免過度疲勞引發症狀加重；故選 C。"}, {"n": 59, "stem": "下列關於肌萎縮性側索硬化症（ALS）的敘述，何者錯誤？", "options": {"A": "約5%至10%來自遺傳", "B": "藥物對此疾病尚無根治方法，僅能延緩病情惡化", "C": "在發病中後期，由於上肢肌肉萎縮較緩慢，因此可獨立操作電動輪椅", "D": "早期的發病症狀包括吞嚥困難、痙攣或肌肉僵硬"}, "images": [], "answer": "C", "explanation": "ALS 中後期上下肢肌肉萎縮『同樣快速』(不是上肢較緩慢)，可能無法獨立操作電動輪椅；故 C 錯誤。"}, {"n": 60, "stem": "關於肌萎縮性側索硬化症（ALS）之治療原則，下列何者錯誤？", "options": {"A": "以症狀治療為主", "B": "應注意節省能量消耗，提供適當的生活輔具", "C": "為維持肌力與減緩肌肉萎縮，高強度的阻力訓練比耐力訓練更適合", "D": "可採用心像練習，訓練大腦皮質可塑性與代償作用"}, "images": [], "answer": "C", "explanation": "ALS 患者『高強度阻力訓練』會加速肌肉退化；應採低-中強度+耐力訓練；故 C 錯誤。"}, {"n": 61, "stem": "張小姐在5年前確診為多發性硬化症，近年來幾乎每年都發作一次，2個月前因症狀惡化入院治療十天，今日\n因下背疼痛及四肢無力再度來求診，並主訴全身疲累，下列處置何種不適當？", "options": {"A": "可能是疾病再度惡化，建議回診神經內科", "B": "針對下背痛給予熱敷與電療", "C": "可能因為先前的疾病復發引發憂鬱，應給予正向心理支持", "D": "建議暫時減少非必要的活動量，適度休息，以免過勞"}, "images": [], "answer": "B", "explanation": "MS 急性期下背痛與肌無力應先回診神經內科確認是否復發；急性期不適合熱敷與電療（可能加劇症狀），故 B 不適當。"}, {"n": 62, "stem": "37歲女性右側被動動作感覺喪失，輕觸覺及兩點覺受損，合併有單側忽略，經檢查後確診為顱內腫瘤，其腫\n瘤可能發生在那個部位？", "options": {"A": "顳葉", "B": "額葉", "C": "頂葉", "D": "枕葉"}, "images": [], "answer": "C", "explanation": "右側被動感覺/輕觸/兩點覺受損+單側忽略 → 對側（左側）頂葉受損；題目選 C 頂葉，正確。"}, {"n": 63, "stem": "35歲的張先生2個月前因頭痛劇烈、全身抽筋及嘔吐送醫，經檢查後診斷為多型性膠質母細胞瘤。手術後，目\n前意識不清臥床，有關物理治療對張先生及家屬的幫助，下列何者較為適當？", "options": {"A": "早期物理治療介入有助於腫瘤病情的改善，可以讓張先生早日康復", "B": "雖然目前意識不清，但及早介入治療可以讓他未來有機會回歸社會", "C": "早期物理治療介入有助於病人清醒後的動作品質恢復，達到未來恢復正常生活的目標", "D": "早期物理治療介入應先把目標放在維持關節活動度，教導家屬正確的照顧方式"}, "images": [], "answer": "D", "explanation": "GBM 預後極差（中位存活 12-15 個月）；早期 PT 應現實設定目標：維持 ROM、避免攣縮、教導家屬照護；故選 D。"}, {"n": 64, "stem": "下列那一個因子不會影響腦瘤預後？", "options": {"A": "第一次發作的年齡", "B": "腦瘤所在的部位", "C": "腦瘤的種類", "D": "性別"}, "images": [], "answer": "D", "explanation": "腦瘤預後因子：發病年齡、腫瘤位置、種類、KPS 等；性別不是影響因子；故選 D。"}, {"n": 65, "stem": "有關後小兒麻痺症候群（post-polio syndrome）的功能性運動，下列敘述何者正確？", "options": {"A": "應強調高強度的有氧活動", "B": "應強調高強度的肌力活動", "C": "應有足夠的休息間隔", "D": "暖身及緩和運動通常不計入運動時間"}, "images": [], "answer": "C", "explanation": "後小兒麻痺症候群運動需『充分休息間隔』(避免過度使用)；故選 C。不應高強度有氧或肌力。"}, {"n": 66, "stem": "下列周邊神經受損與症狀的對應何者正確？", "options": {"A": "尺神經、大魚際肌萎縮", "B": "橈神經、垂腕", "C": "正中神經、爪狀手", "D": "尺神經、猿猴手"}, "images": [], "answer": "B", "explanation": "橈神經損傷 → 垂腕（drop wrist），故選 B 正確。尺神經 → 爪手；正中神經 → 大魚際萎縮（猿猴手）。"}, {"n": 67, "stem": "關於周邊型顏面神經麻痺與腦中風所造成的中樞型顏面神經麻痺，下列臨床表徵何者正確？", "options": {"A": "中樞型顏面神經麻痺患者，眼睛往上看時無皺紋出現", "B": "周邊型顏面神經麻痺患者，眼睛往上看時可看到正常的皺紋", "C": "中樞型與周邊型顏面神經麻痺患者，皆可完全閉起眼睛", "D": "中樞型顏面神經麻痺患者可完全閉起眼睛，但周邊型顏面神經麻痺患者則無法"}, "images": [], "answer": "D", "explanation": "中樞型顏面神經麻痺保留眼睛閉合與額頭功能（上半臉由雙側皮質支配），周邊型則完全麻痺整個半臉；故選 D。"}, {"n": 68, "stem": "有關後小兒麻痺症候群，下列敘述何者錯誤？", "options": {"A": "肌束顫動（fasciculation）的現象可能會發生在肌肉休息或收縮時", "B": "新發生的肌肉無力問題不一定會伴隨肌肉萎縮的現象", "C": "肌肉抽筋常見於疲乏的肌群", "D": "部分患者血液中的肌肉酵素會提升，且與工作或活動量無關"}, "images": [], "answer": "D", "explanation": "後小兒麻痺症候群血液中肌肉酵素提升通常與『工作或活動量有關』(過度使用)；故 D 描述錯誤。"}, {"n": 69, "stem": "關於執行半規管復位術（canalith repositioning treatment/ Epley maneuver）之敘述，下列何者錯誤？", "options": {"A": "先將患者頭往健側耳方向轉45度，並協助患者躺下，將頭帶至豪派－狄克（Hallpike-Dix）的姿勢", "B": "通常等眼球震顫消失後才適合將頭帶至下一個姿勢", "C": "半規管復位術完成後，應將頭部保持直立姿勢至少20分鐘", "D": "半規管復位術可處理耳石掉入前半規管的良性偶發性眩暈"}, "images": [], "answer": "A", "explanation": "Epley maneuver 起始：頭轉向『患側』(不是健側) 45° 後仰；故 A 錯誤。"}, {"n": 70, "stem": "尹小姐為右側前庭神經炎，過去三周內大多臥床休息，現在最有可能出現下列那個症狀？", "options": {"A": "注視一固定目標物，同時左右轉頭時，目標物會變得模糊且有頭暈", "B": "維持頭部不動，眼球跟著治療師的指尖左右來回移動，無法跟上治療師指尖移動的速度", "C": "坐姿下，治療師將其頭部往右轉約45度後，往後仰躺至頭垂出床緣，出現眼球震顫", "D": "持續注視治療師的鼻子，治療師將其頭部往左右方向做小幅度、快速轉動，在頭部動作停止時，仍能將視線 維持在治療師的鼻子"}, "images": [], "answer": "A", "explanation": "前庭神經炎臥床三週後失代償，凝視穩定 (gaze stability) 障礙最易出現—轉頭時看固定目標會模糊+暈；故選 A。"}, {"n": 71, "stem": "下列關於前庭核之敘述何者錯誤？", "options": {"A": "接收來自同側周邊前庭系統、視覺、體感覺和對側前庭核之神經輸入", "B": "傳遞神經衝動引發前庭眼球反射和前庭脊髓反射", "C": "和小腦、網狀組織及視丘均有神經連結", "D": "此部位栓塞會造成平滑追視（pursuit）與跳視（saccade）異常"}, "images": [], "answer": "D", "explanation": "前庭核栓塞會影響 VOR、VSR 但不直接影響 pursuit/saccade（後者由小腦與腦幹其他區域控制）；故 D 錯誤。"}, {"n": 72, "stem": "在執行前庭功能測試時，當患者閉上眼睛，頭往前傾約30度，左右轉動頭部20次，再請患者張開眼睛，發現\n患者有水平眼球震顫，下列何者正確？", "options": {"A": "前庭功能正常", "B": "單側前庭功能受損", "C": "雙側前庭功能受損", "D": "中樞神經系統受損而影響前庭功能"}, "images": [], "answer": "B", "explanation": "Head-shaking nystagmus test：頭前傾 30° + 左右轉頭 20 次後睜眼，若出現眼震→『單側前庭功能受損』；故選 B。"}, {"n": 73, "stem": "重症肌無力（myasthenia gravis）的病理位置發生在何處？", "options": {"A": "下運動神經元", "B": "周邊神經", "C": "神經肌肉接合處", "D": "肌肉"}, "images": [], "answer": "C", "explanation": "MG 病理位於『神經肌肉接合處』(NMJ)，AChR 抗體攻擊；故選 C。"}, {"n": 74, "stem": "基蘭－巴瑞氏症候群病患之處置方針何者較適當？", "options": {"A": "病患急性期不應使用副木或吊帶，以免造成軟組織變性及關節攣縮", "B": "亞急性期開始應以高強度訓練虛弱之肌肉，加速受損之周邊神經再生", "C": "運動訓練後若肌肉出現持續疼痛及感覺異常，應立刻停止運動訓練", "D": "配合疾病由遠端至近端發展，遠端肌肉之訓練強度應高於近端肌肉"}, "images": [], "answer": "C", "explanation": "GBS 運動訓練後肌肉持續疼痛或感覺異常代表『過度使用』，應立即停止；故選 C。"}, {"n": 75, "stem": "下列那一項動態步態指標（dynamic gait index）的測試項目與前庭功能最為相關？", "options": {"A": "快速平地行走", "B": "邊走邊轉頭", "C": "繞過障礙物", "D": "停下腳步轉身"}, "images": [], "answer": "B", "explanation": "DGI（動態步態指標）含轉頭走路 (gait with head turn) 最能反映前庭功能（VOR 補償）；故選 B。"}, {"n": 76, "stem": "跌倒的發生與年齡、生理、心理狀態有關，關於跌倒的危險因子，下列敘述何者正確？", "options": {"A": "為了增加姿勢穩定性，年長者會以減少肌肉共同收縮（muscle co-contraction）來因應", "B": "憂鬱問題僅影響心理狀態，不會提升跌倒風險", "C": "罹患尿失禁的長者，可能會有較高的跌倒風險", "D": "害怕跌倒的心理會減少危險行為，長期下來可避免跌倒發生"}, "images": [], "answer": "C", "explanation": "尿失禁長者跌倒風險『較高』(因急忙如廁、夜起、虛弱等)；故選 C 正確。其他描述錯誤。"}, {"n": 77, "stem": "下列那一位長輩具有較高的跌倒風險？", "options": {"A": "柏格氏平衡量表（The Berg Balance Scale）測試得分50分", "B": "計時起走測試（Timed Up and Go）花費時間20秒", "C": "功能性前伸測試（functional reach test）距離20公分", "D": "四方格跨步測試（The four-square step test）花費時間10秒"}, "images": [], "answer": "B", "explanation": "TUG 20 秒（正常 < 10 秒）= 高跌倒風險；故選 B。"}, {"n": 78, "stem": "指導家屬為安寧照護個案進行被動性關節運動時，下列何者應優先考量？", "options": {"A": "維持正常之全身肌肉長度", "B": "減少肢體水腫與體液滯留", "C": "維持照護所需之關節活動度", "D": "維持個人對身體之形象"}, "images": [], "answer": "C", "explanation": "安寧照護被動關節運動目標應以『維持照護所需之 ROM』(如協助穿衣、轉位) 為優先，不是維持全身正常肌長；故選 C。"}, {"n": 79, "stem": "下列何者不是高齡體適能檢測的評估項目？", "options": {"A": "坐到站測試", "B": "10公尺走路速度", "C": "計時起走測試", "D": "坐姿前伸測試"}, "images": [], "answer": "B", "explanation": "高齡體適能檢測項目：坐到站、TUG、坐姿前伸、握力、原地踏步抬膝；10 公尺走路速度不在常規檢測項目內；故選 B。"}, {"n": 80, "stem": "老年人的各種感覺能力開始退化，對於環境改善調整建議，下列那一項較為適當？", "options": {"A": "可在地板貼上不同的圖案花紋，做為引導方向的指示", "B": "可加裝高音頻警示器，以提醒緊急狀況發生", "C": "夜燈儘量使用白色的燈泡，以提供足夠的照明", "D": "製作指示標籤，顏色採深底淺字會較淺底深字清楚"}, "images": [], "answer": "D", "explanation": "標籤『深底淺字』(如黑底白字) 對視力退化老人對比較強較易看清；故選 D。"}]}, "Q2": {"label": "第二次", "questions": [{"n": 1, "stem": "下列有關運動神經元的敘述何者正確？", "options": {"A": "上運動神經元的細胞本體（cell body）全部位於大腦皮質區", "B": "下運動神經元的細胞本體（cell body）全部位於脊髓的腹側角（ventral horn）", "C": "前庭脊髓徑的運動神經元細胞本體（cell body）位於腦幹，屬於上運動神經元", "D": "顱神經中控制臉部與舌咽動作的運動神經元細胞本體（cell body）位於腦幹，屬於上運動神經元"}, "images": [], "answer": "C", "explanation": "前庭脊髓徑運動神經元細胞本體位於腦幹的前庭核，屬上運動神經元（傳遞至脊髓前角）；故選 C。其他描述絕對化錯誤。"}, {"n": 2, "stem": "下列那一腦區與動作控制的決策與動作規劃的過程最無關？", "options": {"A": "基底核（basal ganglia）", "B": "大腦前額葉皮質區（prefrontal cortex）", "C": "大腦頂葉皮質區（parietal cortex）", "D": "大腦的主要動作皮質區（primary motor cortex）"}, "images": [], "answer": "D", "explanation": "Primary motor cortex 主要負責動作執行（不是規劃決策）；規劃由前額葉、頂葉、基底核等高階區進行；故選 D。"}, {"n": 3, "stem": "有關基底核結構與功能的敘述，下列何者錯誤？", "options": {"A": "基底核有比較器（comparator）的功能，會幫助動作修正", "B": "基底核是中樞神經系統裡高階動作控制區之一", "C": "多巴胺的分泌會興奮基底核的直接路徑，使動作容易啟動與執行", "D": "基底核到視丘的輸出訊號是抑制性的"}, "images": [], "answer": "A", "explanation": "比較器功能（comparator）為『小腦』的角色，不是基底核（負責動作選擇與啟動）；故 A 錯誤。"}, {"n": 4, "stem": "根據Fitts與Posner的動作學習階段論，雙重任務訓練最適宜在那一個階段使用？", "options": {"A": "進階期", "B": "認知期", "C": "連結期", "D": "自動化期"}, "images": [], "answer": "D", "explanation": "Fitts & Posner 階段：認知期 → 連結期 → 自動化期；雙重任務訓練最適合『自動化期』(已熟練後加複雜度)；故選 D。"}, {"n": 5, "stem": "進行上肢伸手取物訓練時，順序為坐姿平衡訓練10分鐘、伸手取物訓練10分鐘、手部精細動作訓練10分鐘。此\n種練習安排為何？", "options": {"A": "隨機練習", "B": "段落練習", "C": "固定練習", "D": "變異練習"}, "images": [], "answer": "B", "explanation": "三項任務各做 10 分鐘 = 段落練習 (blocked practice)；故選 B。"}, {"n": 6, "stem": "在基模理論（schema theory）中，用來評估動作執行產生的感覺後果（sensory consequence）之記憶結構為\n何？", "options": {"A": "召還基模（recall schema）", "B": "再認基模（recognition schema）", "C": "動作基模（motor schema）", "D": "記憶痕跡（memory trace）"}, "images": [], "answer": "B", "explanation": "Schmidt 基模理論：再認基模 (recognition schema) 評估動作的感覺後果與正確性；召回基模負責動作參數選擇；故選 B。"}, {"n": 7, "stem": "一位治療師以自身示範並讓病患多次實作的方式，來教導一位中風病患重新學習從坐姿站起的一系列動作。過\n了2週，此病患越學越熟練，表現越來越自動化，當此病患習慣性自主地從坐姿站起時，那一腦區的活化會最\n明顯的比2週前上升許多？", "options": {"A": "海馬迴", "B": "基底核", "C": "前額葉", "D": "杏仁核"}, "images": [], "answer": "B", "explanation": "STS 動作熟練後變自動化，由『基底核』與小腦主導；前額葉活化降低；故選 B。"}, {"n": 8, "stem": "因為大腦的可塑性，一位左手食指被截肢的病患，在截肢後初期被其他人碰觸其身體那一部位時，病患最可能\n會有幻覺，感覺到是已喪失的左手食指被碰觸？", "options": {"A": "左手拇指", "B": "右手拇指", "C": "左大腿", "D": "軀幹"}, "images": [], "answer": "A", "explanation": "上肢截肢者的左手食指區（在中央後回）會被『左手拇指』區擴張取代而出現觸覺幻覺；故選 A。"}, {"n": 9, "stem": "依據國際健康功能與身心障礙分類系統，下列何者屬於社會參與面向？", "options": {"A": "瑞秋洛斯阿米哥斯認知功能程度量表（Rancho Los Amigos level of cognitive functioning scale）", "B": "動態步態指標量表（dynamic gait index）", "C": "失能評估量表（disability rating scale）", "D": "葛拉斯哥昏迷量表（Glasgow coma scale）"}, "images": [], "answer": "C", "explanation": "Disability Rating Scale (DRS) 含工作、住所、社區整合等參與面向；故選 C。"}, {"n": 10, "stem": "針對腦中風患者臉部動作不協調的狀況，進行第5對及第7對腦神經檢查。此檢查屬於國際健康功能與身心障\n礙分類系統（ICF）的那個層面？", "options": {"A": "身體構造與功能", "B": "個人因素", "C": "活動與社會參與能力", "D": "環境因素"}, "images": [], "answer": "A", "explanation": "腦神經 V、VII 檢查屬『身體構造與功能』面向；故選 A。"}, {"n": 11, "stem": "治療師讓右側偏癱病患坐在治療球上進行動態坐姿平衡訓練，下列由易到難的順序何者正確？① 進行上肢上\n舉（lifting）及下砍（chopping）的動作 ②雙腳著地，骨盆做前／後傾動作 ③雙側上肢執行前後交替的擺\n盪 ④重心左右位移", "options": {"A": "①→②→③→④", "B": "②→③→④→①", "C": "②→④→③→①", "D": "④→②→③→①"}, "images": [], "answer": "BC", "explanation": "本題經考選部公告「答 B 或 C 均給分」。坐治療球動態平衡訓練的順序，因②④③①與②③④①兩種順序皆有道理（雙腳著地最簡→雙手擺盪較難），故 B、C 均可。"}, {"n": 12, "stem": "要訓練一左側偏癱推者症候群（pusher syndrome）病患的動態坐姿平衡，下列何種活動設計較適當？", "options": {"A": "運用紅繩系統讓病患健側手置於彈力懸吊帶上，提供右外側懸吊點（lateral suspension point）練習坐姿下往 懸吊點方向推", "B": "練習由患側躺坐起，並維持正中坐姿擺位", "C": "利用本體感覺神經肌肉誘發技巧，於兩側肩關節給予節律穩定技巧", "D": "使病患於坐姿下將健側邊靠在牆面，並提供鏡子作為視覺回饋"}, "images": [], "answer": "A", "explanation": "Pusher syndrome 練習坐姿向懸吊點推可矯正錯誤的中線知覺，提供動作策略訓練；故選 A。"}, {"n": 13, "stem": "針對不同修正式侯葉氏分期之巴金森氏病患者進行肌力訓練，下列那一觀點最為正確？", "options": {"A": "分期1.0者因為僅有一側受影響，因此只需進行該側之肌力強化即可", "B": "分期2.5者可採中低阻力、著重髖關節與軀幹屈肌肌群之肌力訓練", "C": "分期3.0者可依任務導向，如以反覆坐站來執行下肢伸肌之閉鏈式阻力運動", "D": "分期4.0者於肌力訓練中應強調認知動作策略，以雙重或多重任務模式進行"}, "images": [], "answer": "C", "explanation": "H&Y 3.0 期患者仍可獨立功能，可採『反覆坐站』(任務導向+下肢伸肌閉鏈訓練)；故選 C 正確。"}, {"n": 14, "stem": "為了改善中風患者的動作控制能力，下列治療方式何者最適當？", "options": {"A": "抬手時會不自主的伴隨手肘彎曲的病人，將沙包綁在手腕練習抬手的動作，以增加上肢肌力", "B": "紅繩加上輔助的平板，給予前臂適當支撐，病人維持正中坐姿身體不動，做出雙手前推的動作，以增加上肢 近端動作控制能力", "C": "在趴姿下利用紅繩將膝蓋彎曲，訓練大腿後側肌群肌力，以改善因為股四頭肌張力太強，而導致走路時膝蓋 無法彎曲抬高的問題", "D": "僅股四頭肌張力較強的布朗斯壯第二期病人，行走時在患側腳綁沙包，以訓練步態中的擺盪動作"}, "images": [], "answer": "B", "explanation": "中風患者使用紅繩給前臂支撐+正中坐姿+雙手前推，可訓練近端肩胛穩定+軀幹控制；故選 B。"}, {"n": 15, "stem": "對於70歲的肌少症患者之下肢阻力訓練，下列何者最不適當？", "options": {"A": "先進行下肢動態訓練，再於固定關節角度下進行訓練", "B": "先訓練前後向的動作，再結合左右向與前後向動作一起訓練", "C": "先訓練髖關節肌力，再訓練踝關節肌力", "D": "先用0.5公斤的沙包給予阻力，再漸漸增加沙包重量"}, "images": [], "answer": "A", "explanation": "肌少症漸進原則應從『靜態（固定關節角度）』開始，再到動態；A 描述順序反，最不適當。"}, {"n": 16, "stem": "55歲的王女士中風3個月，走路時患側腳抬不高，治療師想增加患側髖關節彎曲抬高的選擇性運動能力，但又\n不想誘發出協同動作，下列何本體感覺神經肌肉誘發技巧較為適當？", "options": {"A": "D1屈曲模組及收縮－放鬆技術", "B": "D1屈曲模組及節律穩定技術", "C": "D2屈曲模組及節律穩定技術", "D": "D2屈曲模組及節律啟動技術"}, "images": [], "answer": "D", "explanation": "改善髖屈曲選擇性運動且不誘發協同：D2 屈曲模式（屈+外展+外旋）+節律啟動（從被動到主動），故選 D。"}, {"n": 17, "stem": "實施本體感覺神經肌肉誘發技巧時給阻力的原則，下列何者正確？", "options": {"A": "適當的阻力大小可以避免抖動（jerk）發生，約為患者最大阻力的 60～70%最為適當", "B": "施阻力時須留意不可產生切力（vector force），以避免患者混淆", "C": "治療師輪流施予相反方向的阻力時，同時給口令「你儘量來推我」，這屬於動態收縮，常用於訓練平衡能力 時", "D": "治療師給阻力時同時給口令「停在這裡，不要被我推倒」，這屬於等長收縮，此時患者出現憋氣無法避免"}, "images": [], "answer": "C", "explanation": "PNF 阻力施加時切力（vector force）會混淆患者方向；應提供純對角線阻力；故選 B 正確。"}, {"n": 18, "stem": "實施本體感覺神經肌肉誘發技巧時利用牽張反射（stretch reflex）的原則，下列何者最適當？", "options": {"A": "在肌肉緊繃時，於肌梭上施以輕敲，是以牽張反射引發肌肉收縮的方法", "B": "利用牽張反射時，須將目標肌肉拉長，但須留意同一肢體其他協同肌肉群不可被拉長", "C": "牽張反射屬於原始反射，實施此手法時搭配口令沒有加強效果", "D": "若患者在牽張反射與反應之間存在明顯遲滯時間，屬於此手法的禁忌症，不可再實施"}, "images": [], "answer": "A", "explanation": "PNF 牽張反射技巧：在肌肉伸長時於肌梭施輕敲；故選 A 正確。"}, {"n": 19, "stem": "有關布朗斯壯分期的測試方法，下列敘述何者正確？", "options": {"A": "測試上肢第三期屈曲動作時，應給予「請將患側手摸對側膝蓋」口令", "B": "測試下肢第三期屈曲動作時，應在坐姿施測", "C": "測試下肢第四期膝關節伸直動作，應在躺姿施測", "D": "測試下肢第五期髖關節伸直下做出膝關節屈曲動作，應在站姿施測"}, "images": [], "answer": "D", "explanation": "Brunnstrom 下肢第五期：站姿+髖伸直下做膝屈曲（單獨控制動作脫離協同），故選 D。"}, {"n": 20, "stem": "針對中風病人，治療師根據路得理論（Rood theory）來設計活動，以下活動之動作控制階段何者正確？", "options": {"A": "走路時踢球－移動階段", "B": "橋式運動撐住10秒－穩定階段", "C": "床上翻身－穩定中移動階段", "D": "站姿雙腳不動時練習重心左右轉移－技巧階段"}, "images": [], "answer": "B", "explanation": "Rood theory 分四階段：移動 (mobility)、穩定 (stability)、穩定中移動 (mobile stability)、技巧 (skill)。橋式撐住 10 秒 = 穩定階段；故選 B。"}, {"n": 21, "stem": "陳老先生中風已3週，目前可維持獨立的坐姿平衡，治療師運用神經發展治療技術（NDT）欲訓練陳老先生坐\n到站的能力，下列何者為正確的訓練重點？", "options": {"A": "控制病患的頭部並固定下肢，引導其重心轉移至身體前上方", "B": "於身體背側骨盆上方誘發前傾及重心向前位移，並給予股四頭肌收縮方向感覺刺激", "C": "讓病患雙手先支撐於坐椅的兩側扶手，協助軀幹往上", "D": "坐姿下先引導重心往患側位移，再由肩關節帶動重心前後擺盪"}, "images": [], "answer": "B", "explanation": "NDT 訓練 STS：在身體背側骨盆上方誘發前傾，提供股四頭肌收縮方向的感覺刺激；故選 B。"}, {"n": 22, "stem": "利用關節擠壓（joint approximation）的機制來增加下肢的承重與穩定，下列何種作法較為合適？", "options": {"A": "使用彈性繃帶從腳板向上拉緊並螺旋纏繞至大腿根部", "B": "在腳踝、膝蓋、骨盆，分別都綁上沙包", "C": "彈力帶從腳底向上來回交叉繞過小腿前、大腿後，再拉緊固定於腰部皮帶上", "D": "利用綁腿（gaiter）或下肢長腿支架（KAFO）等協助固定"}, "images": [], "answer": "C", "explanation": "彈力帶從腳底向上交叉繞過小腿前+大腿後+固定於腰部，產生關節擠壓 → 增加下肢承重穩定性；故選 C。"}, {"n": 23, "stem": "對於有認知功能障礙、注意力資源不足的老人，下列助行輔具何者最為適當？", "options": {"A": "兩支腋枴（axillary crutch）", "B": "兩支前臂枴（forearm crutch）", "C": "標準助行器（pick-up walker）", "D": "滑輪助行器（rolling walker）"}, "images": [], "answer": "D", "explanation": "認知功能障礙+注意力不足者，最適合『滑輪助行器（rolling walker）』(操作簡單，不需放下抬起)；故選 D。"}, {"n": 24, "stem": "下列有關上肢副木的使用方式，何者錯誤？", "options": {"A": "上肢副木的設計應該允許沒有損傷的部位可以自由移動", "B": "可使用於腕關節伸直小於20度的病人，以作為限制誘發動作治療的工具", "C": "可使用於腕關節過度屈曲的病人，以促進手功能使用", "D": "可使用於軟癱的病人，以減少關節攣縮"}, "images": [], "answer": "B", "explanation": "限制誘發治療入選標準是腕『主動』伸直 ≥ 20°；< 20° 不能用 CIMT；故 B 描述錯誤。"}, {"n": 25, "stem": "下列那種類型的患者較適合利用任務導向模式以增進其梳頭能力？", "options": {"A": "迷你心智量表得分為15分，且單側忽略的中風患者", "B": "手腕及手指 早鼓勵患側肢體動作極可能導致不良的動作型態", "C": "部分早期復健介入個案可能出現嚴重的醫療不穩定情形", "D": "及早介入之正面效益可減少憂鬱、情緒失常的現象"}, "images": [], "answer": "B", "explanation": "早期介入並『不會』導致不良動作型態（恰恰反而避免廢用與代償）；故 B 不適當。"}, {"n": 31, "stem": "中風患者下肢離心收縮能力不足，練習站到坐的動作時經常跌坐回椅子。下列何者較能促進患者站到坐的能\n力？", "options": {"A": "採取站姿，練習由站姿背靠牆壁蹲下", "B": "採取平躺屈膝踩床姿勢，練習橋式運動", "C": "採取坐姿，彎曲軀幹且雙手觸地", "D": "採取雙手雙膝跪姿的靜態姿勢"}, "images": [], "answer": "A", "explanation": "練習離心控制下蹲（站姿背靠牆下蹲）可訓練『站到坐』時的離心收縮能力；故選 A。"}, {"n": 32, "stem": "張先生是一位小提琴家，在兩年前中風後，抱怨在拉小提琴時經常會無法感覺按到一條或是兩條琴弦，為了\n找出問題的原因，治療師應執行下列何項測試？", "options": {"A": "請他用手指的側面，分別兩兩夾住一張紙，測試是否可以用力夾住紙而不被抽出", "B": "使用安全別針的尖端刺激手指的不同部位，請他指出被刺激的位置", "C": "使用圓盤狀兩點區辨器，測試手指可以辨別兩點的最小距離", "D": "將一片磨砂紙及一塊絲綢分別放置於手中，請他識別手中物品的質地"}, "images": [], "answer": "C", "explanation": "兩點區辨器測試手指最小可區辨距離 = 評估手指『精細觸覺』(辨別琴弦數)；故選 C。"}, {"n": 33, "stem": "有一位中風病患行走時因髖屈曲動作不足而出現環形步態（circumduction gait）的代償動作，評估之後發現除\n了髖屈曲肌力不足，同時因協同動作而缺乏髖膝關節的單關節控制能力，下列何種運動能改善這個問題？①\n在仰躺時練習由下肢啟動往健側翻身 ②在坐姿下練習將患側腳跨腳於健腳上 ③在站姿下往前向踩高", "options": {"A": "僅①②", "B": "僅②③", "C": "僅①③", "D": "①②③"}, "images": [], "answer": "D", "explanation": "改善 circumduction 步態（髖屈與單關節控制）：①下肢啟動翻身 ②翹腳 ③跨高踩，皆能促進髖膝單關節控制；故選 D（①②③）。"}, {"n": 34, "stem": "某中風個案因患側上肢嚴重疼痛而拒絕治療師碰觸與移動上肢，只願意治療師訓練他的下肢；家屬也抱怨\n說：「整隻手連躺著不動也說會痛，連拉著手要穿衣服都痛到不行」。此現象最有可能是下列何者造成？", "options": {"A": "視丘感覺症候群（thalamic pain syndrome）", "B": "肩關節半脫位造成夾擠症候群（impingement syndrome）", "C": "反射性交感神經失養症（reflex sympathetic dystrophy）", "D": "靜脈血栓炎（venous thrombophlebitis）"}, "images": [], "answer": "C", "explanation": "中風後上肢嚴重疼痛+被動觸碰也痛+整隻手皆痛 → 反射性交感神經失養症（RSD/CRPS）；故選 C。"}, {"n": 35, "stem": "承上題，為確認此疼痛之原因是否如你所推測，應優先進行之患側上肢評估項目為何？", "options": {"A": "肩關節關節活動度與關節終感覺（joint end-feel）", "B": "整體張力與協同反應", "C": "輕觸覺、痛覺與本體感覺", "D": "皮膚完整性與遠端腫脹程度"}, "images": [], "answer": "D", "explanation": "RSD 確診優先檢查皮膚完整性、溫度差、遠端腫脹（自主神經功能異常徵象）；故選 D。"}, {"n": 36, "stem": "在評估中風病患的感覺功能時，下列那項評估測試能夠反應聯合皮質感覺的功能？", "options": {"A": "本體覺", "B": "觸覺定位", "C": "溫度覺", "D": "震動覺"}, "images": [], "answer": "B", "explanation": "聯合皮質感覺（cortical sensation）含立體覺、graphesthesia、兩點區辨、觸覺定位；故選 B。"}, {"n": 37, "stem": "有關功能獨立自主量表（functional independence measures）的敘述，下列何者正確？", "options": {"A": "與巴氏量表同時效度不高", "B": "項目包含動作和認知功能", "C": "每項評分等級1至7分，分數愈低代表功能愈獨立", "D": "大小便控制屬於功能層級，所以被歸類在自我照顧中"}, "images": [], "answer": "B", "explanation": "FIM 包含動作功能（13 項）+認知功能（5 項）共 18 項；故選 B 正確。每項 1-7 分（分數高=獨立）；大小便控制屬括約肌控制。"}, {"n": 38, "stem": "對下列那幾條血管栓塞之中風病患，治療師應仔細評估運動失調（ataxia）的問題？①中大腦動脈（middle\ncerebral artery） ②後大腦動脈（posterior cerebral artery） ③基底動脈（basilar artery） ④椎動脈\n（vertebral artery）", "options": {"A": "①②③", "B": "②③④", "C": "③", "D": "④"}, "images": [], "answer": "B", "explanation": "後大腦動脈②、基底動脈③、椎動脈④皆供應小腦，這些區域中風易出現運動失調；MCA 不直接供應小腦；故選 B（②③④）。"}, {"n": 39, "stem": "利用部分載重懸吊式跑步機來訓練中風個案行走的主要好處為何？", "options": {"A": "可利用速度增加以減少動態平衡的需求", "B": "可誘發較大的髖關節彎曲角度", "C": "可提早在直立姿勢的狀態下做步態練習", "D": "可完全取代在平地上的練習、空間需求較小"}, "images": [], "answer": "C", "explanation": "懸吊式跑步機可在『直立姿勢』下提早練習步態（即使下肢承重不足）；故選 C。"}, {"n": 40, "stem": "28歲的李先生兩個月前在高速公路車禍受傷，造成頸椎第5、6節斷裂滑脫，經評估後發現雙側上肢肌力：C5\ngood、C6 poor、C7~T1 zero，雙側下肢肌力L2 ~L5 good、S1 normal，T1以下感覺功能受損（impaired），李\n先生為那一種類型之損傷？", "options": {"A": "前髓損傷症候群", "B": "後髓損傷症候群", "C": "中髓損傷症候群", "D": "布朗－斯夸症候群"}, "images": [], "answer": "C", "explanation": "雙側上肢 C5-C6 仍 good~poor、下肢 good~normal = 上肢差於下肢 = 『中髓損傷症候群』(central cord)；故選 C。"}, {"n": 41, "stem": "一位急性C6完全脊髓損傷患者導致四肢麻痺且口含氣管內管，為了要在臥床期訓練甩手扣住床欄翻身，下列\n那些肌肉之肌力訓練最為重要？", "options": {"A": "前三角肌與肱二頭肌", "B": "伸腕肌與肱三頭肌", "C": "肩胛骨下壓肌群與肱三頭肌", "D": "肱二頭肌與屈指肌"}, "images": [], "answer": "A", "explanation": "C6 完全脊損的甩手扣床欄翻身：用前三角肌+肱二頭肌做肩屈+肘屈+腕背屈代償抓握；故選 A。"}, {"n": 42, "stem": "關於T9完全脊髓損傷患者的功能性預後，下列敘述何者正確？①翻身起床時需他人部分協助 ②可獨立完成\n由床轉位到輪椅 ③可拿助行器與穿鐵鞋（KAFO）至戶外短距離行走 ④跌倒時需他人部分協助，使用後\n向方式由地板轉位到輪椅 ⑤在無障礙設施下，可獨立使用輪椅在社區活動", "options": {"A": "①③④", "B": "②③⑤", "C": "①②⑤", "D": "②③④⑤"}, "images": [], "answer": "B", "explanation": "T9 完全脊損：可獨立翻身轉位②、可拿助行器+KAFO 短距戶外行走③、可獨立社區內輪椅⑤；①需翻身協助、④跌倒可能可獨立；故選 B（②③⑤）。"}, {"n": 43, "stem": "一位脊髓損傷患者其ASIA運動與感覺功能測試結果如下：右側肱二頭肌5分，其餘右側的上／下肢關鍵肌皆\n為4～5分；左側肱二頭肌 5分，其餘左側的上／下肢關鍵肌皆為1～2分。感覺評估結果顯示：雙側C5及以上\n之針刺感與輕觸覺皆為正常；至於C6以下，針刺感於右側為異常或缺損、左側為正常，輕觸感與本體感覺皆\n為右側正常、左側異常。薦髓感覺與自主肛門收縮功能皆存在。請依序回答下列3題。\n該脊髓損傷患者之神經機能部位為何？", "options": {"A": "L2", "B": "C5", "C": "C6", "D": "T7"}, "images": [], "answer": "B", "explanation": "右側肱二頭肌 5 分但 C6 以下肌力降至 4-5 分；左側 C5 以下肌力 1-2 分；神經機能位 = C5（最後雙側 ≥3 級的關鍵肌）；故選 B。"}, {"n": 44, "stem": "該脊髓損傷患者的AIS機能損傷等級（ASIA impairment scale）為何？", "options": {"A": "A", "B": "B", "C": "C", "D": "D"}, "images": [], "answer": "D", "explanation": "薦髓感覺與肛門收縮存在 + 多數關鍵肌 ≥3 → AIS = D；故選 D。"}, {"n": 45, "stem": "該脊髓損傷患者符合那種臨床症候群？", "options": {"A": "中髓症候群", "B": "後髓症候群", "C": "布朗－斯夸症候群", "D": "前髓症候群"}, "images": [], "answer": "C", "explanation": "右側痛覺異常+左側運動異常+左側本體感覺異常 = Brown-Sequard syndrome；故選 C。"}, {"n": 46, "stem": "關於脊髓損傷的敘述，下列何者正確？", "options": {"A": "腰髓損傷是脊髓損傷中發生比率最高的", "B": "胸髓通常都是因為撞擊之後過度伸直造成的傷害", "C": "胸椎因有肋骨支撐，所以發生損傷後，通常不會造成完全性的胸髓損傷", "D": "脊髓損傷後的恢復可能是脊神經根的復原，也可能是脊髓本身的恢復"}, "images": [], "answer": "D", "explanation": "脊髓損傷後恢復可能來自神經根再生或脊髓本身可塑性；故選 D 正確。"}, {"n": 47, "stem": "一男性T2脊髓完全性損傷的病患可能發生之併發症及處置，下列敘述何者正確？", "options": {"A": "會有姿勢性低血壓，故建議應先以傾斜床站立直到不暈，再開始訓練坐姿平衡", "B": "容易在傷後一年發生快速的骨質流失", "C": "為避免尿道感染，建議應長期使用導尿管", "D": "為避免坐姿活動時容易喘及呼吸急促，建議可穿束腹帶"}, "images": [], "answer": "D", "explanation": "T2 完全脊損為 T6 以上，需注意自主神經反射異常；束腹帶可協助呼吸與血壓穩定；故選 D。其他描述錯誤。"}, {"n": 48, "stem": "關於不完全脊髓損傷症候群，下列敘述何者正確？", "options": {"A": "脊髓圓錐症候群同時會有上及下運動神經元損傷之臨床表徵", "B": "馬尾症候群屬於上運動神經元損傷", "C": "中髓症候群通常為脊椎過度彎曲造成之傷害，其下肢癱瘓比上肢嚴重", "D": "後髓症候群肇因於脊椎伸直傷害，造成損傷節次以下之痛覺及溫覺喪失"}, "images": [], "answer": "A", "explanation": "脊髓圓錐症候群（conus medullaris syndrome）位於 L1-L2，含上下運動神經元混合損傷；故選 A。"}, {"n": 49, "stem": "以葛拉斯哥昏迷量表（Glasgow coma scale）界定為輕度創傷性腦傷的分數範圍為何？", "options": {"A": "0～2", "B": "3～8", "C": "9～12", "D": "13～15"}, "images": [], "answer": "D", "explanation": "GCS 13-15 為輕度 TBI；9-12 中度；3-8 重度；故選 D。"}, {"n": 50, "stem": "下列有關創傷性腦傷的敘述何者正確？", "options": {"A": "顱內出血以硬腦膜外出血的比率最高", "B": "嬰兒因頭部受過度前後搖晃而產生的急性硬腦膜下腔出血屬於「瀰漫性腦傷」", "C": "腦水腫屬於原發性腦傷", "D": "當顱內壓超過20～25 mmHg時，容易引發顱內組織受推擠而脫出移位"}, "images": [], "answer": "D", "explanation": "ICP > 20-25 mmHg 易引發腦組織脫垂位移（herniation）；故選 D。其他描述錯誤（顱內出血以硬膜下最多；嬰兒搖晃為硬膜下；腦水腫屬次發性）。"}, {"n": 51, "stem": "針對瑞秋洛斯阿米哥斯認知功能程度量表（LOCF）第四級的患者，下列治療策略何者最不合適？", "options": {"A": "每天固定時間及地點進行物理治療", "B": "選擇聲音較平穩的治療師及看護", "C": "以病人為中心進行訓練", "D": "減少訓練的項目，儘量長時間練習同一個項目，減少項目換來換去"}, "images": [], "answer": "D", "explanation": "LOCF IV 級（混亂躁動期）需『短時間+多項變化活動』(注意力不集中)，不是長時間單一項；D 不合適。"}, {"n": 52, "stem": "一位高中籃球校隊學生，球賽中因腦部被球擊中而有暈眩、嘔吐、注意力不能集中等腦震盪後症候群。下列\n那種處置是幫助此學生回到球場參與球類運動比賽的步驟？", "options": {"A": "若腦震盪後症候群的症狀只出現1天，完全靜養休息3天後，即可從事任何認知與體能活動", "B": "若腦震盪後症候群的症狀出現2天，須完全靜養休息7天，不從事任何認知與體能活動", "C": "先確定學生能返校上課從事認知活動後，即可開始參加球類運動練習", "D": "靜養休息2天後，可開始從事不增加症狀的認知與體能活動"}, "images": [], "answer": "D", "explanation": "腦震盪後的『階段性復出』(graduated return)：靜養 24-48 小時後即可逐步增加無症狀加重的活動；故選 D。"}, {"n": 53, "stem": "針對瑞秋洛斯阿米哥斯認知功能程度量表第七級的腦傷患者，下列治療策略何者最不恰當？", "options": {"A": "提供簡單一致且有建構式的指令，避免患者理解困難", "B": "若患者存有嚴重機能損傷，可訓練其代償性動作功能", "C": "利用本體感覺神經肌肉誘發技巧，促進多關節的控制能力", "D": "進行環境調整或改造，以協助患者回歸社區及家庭"}, "images": [], "answer": "A", "explanation": "LOCF VII 級（自動適當期）患者已具良好定向與一般理解能力，不需『簡單一致建構式指令』(那是低階級需求)；故 A 不恰當。"}, {"n": 54, "stem": "巴金森氏病患者的物理治療應安排在下列何時間較佳？", "options": {"A": "服藥前3～4小時", "B": "服藥前1～2小時", "C": "服藥後1～2小時", "D": "服藥後3～4小時"}, "images": [], "answer": "C", "explanation": "PD 患者物理治療最佳時機為『藥效期 (on-time)』即服藥後 1-2 小時；故選 C。"}, {"n": 55, "stem": "關於原發性巴金森氏病的病生理，下列敘述何者最不適當？", "options": {"A": "黑質至紋狀體多巴胺路徑受損是造成巴金森氏病的主要原因", "B": "路易氏體（Lewy body）的沉澱堆積為患者常見的病理發現之一", "C": "當患者出現明顯臨床表徵時，最多已喪失20%的多巴胺神經元", "D": "嗅球神經細胞退化為患者常見的病理發現之一"}, "images": [], "answer": "C", "explanation": "PD 出現臨床症狀時通常已喪失『60-80%』的多巴胺神經元（不是 20%）；故 C 錯誤。"}, {"n": 56, "stem": "有關失智症患者物理治療介入的原則，下列敘述何者最不適當？", "options": {"A": "輕度認知功能受損時期應以非藥物治療為主，除了運動外應多從事可刺激大腦功能的休閒性活動", "B": "單純直接思考個案的需求，不要假設個案行為有複雜的動機", "C": "利用程序學習技巧讓個案熟悉訓練內容", "D": "溝通時應儘量避免和個案目光接觸，以免觸發其情緒"}, "images": [], "answer": "D", "explanation": "失智症患者溝通應『保持目光接觸』(眼神交流促進連結)，不是避免；故 D 不適當。"}, {"n": 57, "stem": "有氧運動改善認知功能的可能機制和建議，下列敘述何者錯誤？", "options": {"A": "可降低血壓、有較好的葡萄糖耐受度、降低胰島素阻抗、改善血脂等，因此可能經由血管和代謝路徑改善認 知功能", "B": "可促進突觸、促進神經新生、減少海馬迴神經元流失等，因此可能經由強化腦部組織和功能改善認知功能", "C": "可減少類澱粉蛋白堆積，因此可能影響失智症的病理機轉", "D": "低強度的有氧運動較複合式多元運動（multiple-component）更能改善認知功能"}, "images": [], "answer": "D", "explanation": "複合式多元運動（multiple-component, 含有氧+阻力+平衡）改善認知功能效果『優於』單純有氧；D 描述方向反錯誤。"}, {"n": 58, "stem": "下列何種行走表現最不會出現於小腦萎縮患者？", "options": {"A": "跨步距離忽大忽小", "B": "走路時雙腳距離變寬", "C": "步頻與速度皆明顯增加", "D": "走路時不容易維持一致的方向性"}, "images": [], "answer": "C", "explanation": "小腦萎縮患者步頻與速度多為『下降』(不是增加)；故 C 不會出現。"}, {"n": 59, "stem": "下列何小腦部位損傷對姿勢穩定性的影響最輕微？", "options": {"A": "絨球小結葉", "B": "蚓狀體", "C": "後葉、外側小腦", "D": "小腦半球中間區"}, "images": [], "answer": "C", "explanation": "後葉與外側小腦負責動作協調與精細控制，對姿勢穩定影響相對較小；絨球小結葉、蚓狀體、半球中間區皆與姿勢直接相關；故選 C。"}, {"n": 60, "stem": "小腦損傷患者由坐到站時，軀幹可能會太早伸直而身體往後倒，或是過多前傾而失去平衡。下列何者不是適\n合的訓練策略？", "options": {"A": "坐姿下，患者將雙手放治療球上，練習將球前推、拉回的控制能力", "B": "患者坐在可調高低的床，從較高的坐姿，逐漸降低治療床高度，增加坐到站難度", "C": "先讓患者雙手支撐在前方椅面上，練習往前位移雙手支撐站起，再逐漸減少雙手支撐", "D": "坐姿下，反覆練習重心前後轉移的動作，速度由慢至快的逐漸增加難度"}, "images": [], "answer": "D", "explanation": "小腦損傷患者反覆練習重心『前後快速』轉移會加重失衡；應緩慢進階；故 D 不適合。"}, {"n": 61, "stem": "有關多發性硬化症，下列敘述何者錯誤？", "options": {"A": "女性比男性罹患率高", "B": "除了常造成疲勞、感覺運動異常之外，亦常出現記憶力缺損等認知障礙", "C": "容易出現典型之查克特氏三合症（Charcot's triad）", "D": "主要是由於神經及肌肉交界處之乙醯膽鹼（acetylcholine）接受器的減少造成肌肉無力"}, "images": [], "answer": "D", "explanation": "MS 是中樞神經去髓鞘（不是 NMJ AChR）；D 描述為重症肌無力的機轉，錯誤。"}, {"n": 62, "stem": "關於後小兒麻痺症候群之物理治療原則，下列何者錯誤？", "options": {"A": "教導患者能量保留技巧", "B": "可增加平時之運動量來避免肌肉無力", "C": "矯正姿勢和步態來避免疼痛", "D": "使用合適的輔具及支架來減少關節與肌肉過度使用"}, "images": [], "answer": "B", "explanation": "後小兒麻痺症候群應『減少』平時運動量+能量保留（過度使用會加速退化），故 B 錯誤。"}, {"n": 63, "stem": "針對多發性硬化症病患的感覺異常症狀，下列處置何者不適當？", "options": {"A": "給予冷敷降低燒灼感，治療後要保持皮膚乾燥", "B": "定期檢視皮膚是否破損，可於輪椅或家具尖銳處使用保護墊", "C": "使用不同材質物品碰觸，協助建立不同觸覺", "D": "感覺再教育過程不建議使用視覺代償，以避免造成感覺混淆"}, "images": [], "answer": "D", "explanation": "MS 感覺再教育可使用視覺代償（看著動作）以提高安全性，不是禁止；故 D 不適當。"}, {"n": 64, "stem": "對於中樞神經系統腫瘤之認知復健訓練原則，下列何者錯誤？", "options": {"A": "應同時包含受損功能的恢復以及教導對於功能缺損的代償策略", "B": "主要著重於認知功能訓練，與情緒或社會心理因素無關", "C": "治療目標應儘可能達到個案最佳的功能獨立性", "D": "訓練內容應包含讓個案能在現實生活環境中練習，使能將訓練效果轉移至現實生活中"}, "images": [], "answer": "B", "explanation": "中樞神經腫瘤認知復健要兼顧情緒與心理社會因素；故 B 描述錯誤。"}, {"n": 65, "stem": "威爾森氏症（Wilson disease）是源自於何種金屬物質代謝異常而造成基底核的退化？", "options": {"A": "鋅", "B": "銅", "C": "鐵", "D": "砷"}, "images": [], "answer": "B", "explanation": "Wilson disease 為『銅』代謝異常造成基底核退化；故選 B。"}, {"n": 66, "stem": "慢性酒精中毒對動作或心智的損害，下列敘述何者錯誤？", "options": {"A": "主要是因為酒精及營養不足影響神經系統，而導致運動障礙", "B": "問題包含運動失調、動作不協調及周邊神經病變，且上肢比下肢影響更鉅", "C": "會導致心智損害、智能喪失或癡呆，較高層次的思維活動會受到影響", "D": "缺乏注意力及記憶力，因此治療指令必須簡單易懂"}, "images": [], "answer": "B", "explanation": "慢性酒精中毒小腦損傷+周邊神經病變多影響『下肢』比上肢嚴重（步態不穩、失調）；B 描述方向反，錯誤。"}, {"n": 67, "stem": "由於後小兒麻痺症候群患者常會畏寒（cold intolerance），在治療時下列那一項最不合適？", "options": {"A": "治療時維持治療環境的室溫穩定且溫暖", "B": "治療時注意病患的保暖", "C": "患者通常對於熱療的接受度高，但使用熱療時應注意是否會引起水腫", "D": "患者對於局部冷療的接受度不高，應避免使用"}, "images": [], "answer": "D", "explanation": "後小兒麻痺症候群患者畏寒，應避免冷療，但可使用熱療；A、B、C 皆合理；D 否定冷療『使用接受度』與其他描述衝突；題目選 D 為不合適—實際應為冷療接受度低，避免使用。"}, {"n": 68, "stem": "關於周邊神經損傷的治療原則，下列敘述何者錯誤？", "options": {"A": "神經失用（neuropraxia）屬輕症，僅給予防護建議等待復原，不需要積極治療", "B": "軸突斷傷（axonotmesis）初期可使用功能性副木維持活動，鼓勵未受影響肌肉正常活動", "C": "神經斷傷（neurotmesis）初期可給予按摩增進血液循環，減低患部水腫", "D": "神經修補（neuro-repair）術後初期需進行肌肉牽拉，以維持患部肌肉長度"}, "images": [], "answer": "D", "explanation": "神經修補術後初期應『避免肌肉牽拉』(以免拉壞縫合處)；故 D 錯誤。"}, {"n": 69, "stem": "下列何種功能之周邊神經纖維具有最快的傳導速度？", "options": {"A": "壓覺", "B": "本體感覺", "C": "溫度覺", "D": "痛覺"}, "images": [], "answer": "B", "explanation": "本體感覺由 Ia 大髓鞘纖維傳導，傳導速度最快（80-120 m/s）；故選 B。"}, {"n": 70, "stem": "下列那個前庭構造可偵測下圖頭部的姿勢？", "options": {"A": "左側前半規管和右側後半規管", "B": "右側前半規管和左側後半規管", "C": "左右兩側水平半規管", "D": "左右兩側耳石器官"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAR0AAAFTCAIAAACLWk8wAAAACXBIWXMAAA7EAAAOxAGVKw4bAADeqklEQVR4nOydh1tV17b271/yffeeds+53z1JTnJySqJRkxg1UWNir7H33rFSLWABlGahN1GadAREQbBi771jb1FTjuzvx35lnuXegKjYcI+HZz9rL9ZeZc7xjvcdc83yHzaXuazGqq const state = {
  paper: "Q1",
  idx: {Q1: 0, Q2: 0},
  picks: { Q1: {}, Q2: {} }, // hydrated later, after persistence block defines PICKS_STORAGE_KEY
};

const $ = sel => document.querySelector(sel);
const main = $("#main");
const grid = $("#grid");
const progressEl = $("#progress");

function isCorrect(paper, n, pick) {
  const ans = DATA[paper].questions[n-1].answer;
  if (ans === "#") return true; // 一律給分
  return ans.indexOf(pick) >= 0; // single "A" or multi "AB" (X 或 Y 均給分)
}

function picksDone(paper) {
  return Object.keys(state.picks[paper]).length;
}

function score(paper) {
  let s = 0;
  for (const n in state.picks[paper]) {
    if (isCorrect(paper, parseInt(n), state.picks[paper][n])) s++;
  }
  return s;
}

function renderGrid() {
  grid.innerHTML = "";
  const qs = DATA[state.paper].questions;
  for (let i = 0; i < qs.length; i++) {
    const n = i + 1;
    const btn = document.createElement("button");
    btn.className = "gbtn";
    btn.textContent = n;
    if (state.idx[state.paper] === i && !state.viewSummary) btn.classList.add("cur");
    if (n in state.picks[state.paper]) {
      const ok = isCorrect(state.paper, n, state.picks[state.paper][n]);
      btn.classList.add(ok ? "right" : "wrong");
    }
    if (isMarked(state.paper, n)) btn.classList.add("marked");
    btn.onclick = () => { state.viewSummary = false; state.idx[state.paper] = i; render(); };
    grid.appendChild(btn);
  }
}

function escapeHTML(s) { return s.replace(/&/g, "&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderQuestion() {
  const qs = DATA[state.paper].questions;
  const i = state.idx[state.paper];
  const q = qs[i];
  const pick = state.picks[state.paper][q.n];
  const locked = !!pick;
  const correct = q.answer;
  const total = qs.length;
  progressEl.textContent = `第 ${i+1} 題 / 共 ${total} 題　·　已作答 ${picksDone(state.paper)}　·　目前得分 ${score(state.paper)}`;

  let imgsHTML = "";
  for (const u of q.images) imgsHTML += `<img class="qimg" src="${u}" alt="題目附圖">`;

  let optsHTML = "";
  for (const k of ["A","B","C","D"]) {
    let cls = "opt";
    if (locked) {
      cls += " locked";
      const isCorrLetter = (correct !== "#" && correct.indexOf(k) >= 0);
      if (isCorrLetter) cls += " correct";
      else if (k === pick && correct !== "#") cls += " wrong";
      else if (correct === "#" && k === pick) cls += " correct";
    }
    optsHTML += `<button class="${cls}" data-k="${k}" ${locked ? "disabled" : ""}>
      <span class="label">${k}.</span><span>${escapeHTML(q.options[k] || "")}</span>
    </button>`;
  }

  let verdictHTML = "";
  if (locked) {
    if (correct === "#") {
      verdictHTML = `<div class="verdict note">
        <h3>本題經考選部公告「一律給分」</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else if (correct.length > 1) {
      const ok = correct.indexOf(pick) >= 0;
      const letters = correct.split("").join(" 或 ");
      verdictHTML = `<div class="verdict note">
        <h3>本題經考選部公告「答 ${letters} 均給分」　·　${ok ? "✓ 你的選擇 ("+pick+") 在正解內" : "✗ 你選 "+pick+"，未在正解內"}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else {
      const ok = pick === correct;
      verdictHTML = `<div class="verdict ${ok ? "right" : "wrong"}">
        <h3>${ok ? "✓ 答對" : "✗ 答錯"}　·　正解：${correct}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    }
  }

  main.innerHTML = `<div class="card">
    <div class="qhead">
      <span class="qnum">第 ${q.n} 題</span>
      <span class="qmeta">${DATA[state.paper].label}　·　${q.images.length>0?"含附圖":"純文字"}${isMarked(state.paper, q.n) ? ' <span class="marked-badge">🔖 已標記</span>' : ''}</span>
      <button class="markbtn ${isMarked(state.paper, q.n) ? "marked" : ""}" id="markBtn" title="標記此題以便日後複習">${isMarked(state.paper, q.n) ? "🔖 已標記" : "🔖 標記"}</button>
    </div>
    <div class="stem">${escapeHTML(q.stem)}</div>
    ${imgsHTML}
    <div class="opts">${optsHTML}</div>
    ${verdictHTML}
    <div class="nav">
      <button class="btn ghost" id="prevBtn" ${i===0?"disabled":""}>← 上一題</button>
      <button class="btn" id="nextBtn" ${i===total-1?"disabled":""}>下一題 →</button>
      <button class="btn ghost" id="clearBtn" ${locked?"":"disabled"}>清除本題作答</button>
      ${i===total-1?'<button class="btn" id="finishBtn">完成本卷 / 看總結</button>':""}
    </div>
  </div>`;

  // wire up
  main.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => {
      if (locked) return;
      const k = el.getAttribute("data-k");
      state.picks[state.paper][q.n] = k;
      savePicks();
      render();
    };
  });
  $("#prevBtn").onclick = () => { if (i>0) { state.idx[state.paper] = i-1; render(); } };
  $("#nextBtn").onclick = () => { if (i<total-1) { state.idx[state.paper] = i+1; render(); } };
  $("#clearBtn").onclick = () => { delete state.picks[state.paper][q.n]; savePicks(); render(); };
  $("#markBtn").onclick = () => { toggleMark(state.paper, q.n); render(); };
  const fb = document.getElementById("finishBtn");
  if (fb) fb.onclick = () => { state.viewSummary = true; render(); };
}

function renderSummary() {
  const qs = DATA[state.paper].questions;
  const total = qs.length;
  const done = picksDone(state.paper);
  const s = score(state.paper);
  const pct = ((s/total)*100).toFixed(1);
  progressEl.textContent = `本卷總結　·　已作答 ${done}/${total}　·　得分 ${s}　·　已標記 ${markedCount(state.paper)}`;

  const wrongRows = [];
  for (let i = 0; i < qs.length; i++) {
    const q = qs[i];
    const pick = state.picks[state.paper][q.n];
    if (pick === undefined) continue;
    if (q.answer === "#") continue;
    if (pick === q.answer) continue;
    const stemShort = q.stem.length > 50 ? q.stem.slice(0, 50) + "…" : q.stem;
    wrongRows.push(`<div class="wrong-row" data-idx="${i}">
      <strong>第 ${q.n} 題</strong>
      <span style="color:var(--red);">你選 ${pick}</span>
      <span style="color:var(--green);">正解 ${q.answer}</span>
      <span style="color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(stemShort)}</span>
    </div>`);
  }
  const unansweredRows = [];
  for (let i = 0; i < qs.length; i++) {
    if (state.picks[state.paper][qs[i].n] === undefined) {
      unansweredRows.push(`<div class="wrong-row" data-idx="${i}" style="border-color:var(--yellow);"><strong>第 ${qs[i].n} 題</strong><span style="color:var(--yellow);">未作答</span></div>`);
    }
  }

  main.innerHTML = `<div class="card summary">
    <h2>${DATA[state.paper].label} · 總結</h2>
    <div class="score">${s} / ${total}　<span style="font-size:18px;color:var(--ink-soft);">(${pct}%)</span></div>
    <div style="color:var(--ink-soft);font-size:14px;">已作答 ${done} 題　·　答對 ${s} 題　·　答錯 ${done - s} 題　·　未作答 ${total - done} 題</div>
    <div style="margin-top:18px;">
      <h3 style="margin:0 0 6px;">錯題清單（${wrongRows.length}）</h3>
      <div class="wrong-list">${wrongRows.join("") || '<div style="color:var(--ink-soft);">沒有錯題，太強了！</div>'}</div>
    </div>
    ${unansweredRows.length>0?`<div style="margin-top:14px;">
      <h3 style="margin:0 0 6px;">未作答（${unansweredRows.length}）</h3>
      <div class="wrong-list">${unansweredRows.join("")}</div>
    </div>`:""}
    ${(()=>{ const rows=[]; for (let i=0;i<qs.length;i++){ const q=qs[i]; if (!isMarked(state.paper,q.n)) continue; const pick=state.picks[state.paper][q.n]; const stemShort = q.stem.length>50?q.stem.slice(0,50)+'…':q.stem; const tag = pick===undefined?'未作答':(q.answer==='#'?'一律給分':(pick===q.answer?'答對':'答錯')); const tagColor = pick===undefined?'var(--ink-soft)':(q.answer==='#'?'var(--yellow)':(pick===q.answer?'var(--green)':'var(--red)')); rows.push(`<div class="wrong-row mk" data-idx="${i}"><strong>★ 第 ${q.n} 題</strong><span style="color:${tagColor};">${tag}</span><span style="color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(stemShort)}</span></div>`); } return rows.length>0 ? `<div style="margin-top:14px;"><h3 style="margin:0 0 6px;">🔖 已標記題目（${rows.length}）</h3><div class="wrong-list">${rows.join('')}</div><button class="btn ghost" id="clearMarksBtn" style="margin-top:8px;font-size:13px;">清除本卷所有標記</button></div>` : ''; })()}
    <div class="nav" style="margin-top:18px;">
      <button class="btn ghost" id="backBtn">← 回到題目</button>
      <button class="btn danger" id="resetBtn2">重置本卷</button>
    </div>
  </div>`;
  main.querySelectorAll(".wrong-row").forEach(el => {
    el.onclick = () => {
      state.idx[state.paper] = parseInt(el.getAttribute("data-idx"));
      state.viewSummary = false; render();
    };
  });
  document.getElementById("backBtn").onclick = () => { state.viewSummary = false; render(); };
  const cmb = document.getElementById("clearMarksBtn");
  if (cmb) cmb.onclick = () => { if (confirm("確定要清除「" + DATA[state.paper].label + "」這一卷的所有標記嗎？")) { clearAllMarks(state.paper); render(); } };
  document.getElementById("resetBtn2").onclick = () => { resetCurrent(); };
}

function render() {
  renderGrid();
  if (state.viewSummary) renderSummary();
  else renderQuestion();
}

function resetCurrent() {
  if (!confirm(`確定要清除「${DATA[state.paper].label}」這一卷的所有作答與標記嗎？`)) return;
  state.picks[state.paper] = {};
  state.marks[state.paper] = {};
  state.idx[state.paper] = 0;
  state.viewSummary = false;
  savePicks();
  saveMarks();
  render();
}

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    state.paper = t.getAttribute("data-tab");
    state.viewSummary = false;
    render();
  };
});
$("#resetBtn").onclick = resetCurrent;
$("#summaryBtn").onclick = () => { state.viewSummary = true; render(); };


// ===== Answer persistence (per-paper picks, saved to localStorage) =====
const PICKS_STORAGE_KEY = "nephron_112_neuro_picks_v1";
const QUIZ_ID = "neuro_112";  // unique id used when broadcasting summary

function loadPicks() {
  try {
    const s = localStorage.getItem(PICKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function savePicks() {
  try { localStorage.setItem(PICKS_STORAGE_KEY, JSON.stringify(state.picks)); } catch (e) {}
  broadcastProgress();
}

// Send a summary of progress to parent window if embedded in an iframe.
// Used by the dashboard (index.html) to show progress bars.
function broadcastProgress() {
  if (typeof window === "undefined") return;
  let target = null;
  try { if (window.parent && window.parent !== window) target = window.parent; } catch(e){}
  if (!target) return;
  try {
    const summary = { type: "quizSummary", quizId: QUIZ_ID, papers: {} };
    for (const tag of ["Q1","Q2"]) {
      const qs = DATA[tag].questions;
      const picks = state.picks[tag] || {};
      const marks = state.marks ? (state.marks[tag] || {}) : {};
      let answered = 0, correct = 0;
      for (const n in picks) {
        answered++;
        if (isCorrect(tag, parseInt(n), picks[n])) correct++;
      }
      summary.papers[tag] = {
        label: DATA[tag].label,
        total: qs.length,
        answered, correct,
        marked: Object.keys(marks).length,
      };
    }
    target.postMessage(summary, "*");
  } catch (e) {}
}

// Hydrate persisted picks now that PICKS_STORAGE_KEY and loadPicks are defined
state.picks = loadPicks();

// ===== Bookmarks (per-paper question marks, persisted to localStorage) =====
const MARKS_STORAGE_KEY = "nephron_112_neuro_marks_v1";
function loadMarks() {
  try {
    const s = localStorage.getItem(MARKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function saveMarks() {
  try { localStorage.setItem(MARKS_STORAGE_KEY, JSON.stringify(state.marks)); } catch (e) {}
  broadcastProgress();
}
function toggleMark(paper, n) {
  if (state.marks[paper][n]) delete state.marks[paper][n];
  else state.marks[paper][n] = true;
  saveMarks();
}
function isMarked(paper, n) { return !!state.marks[paper][n]; }
function clearAllMarks(paper) {
  state.marks[paper] = {};
  saveMarks();
}
function markedCount(paper) { return Object.keys(state.marks[paper]).length; }
state.marks = loadMarks();

// ===== Export / Download report =====
function _esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function _stamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function _nowStr() { return new Date().toLocaleString("zh-TW", {hour12: false}); }

function _filterQs(paper, filter) {
  const qs = DATA[paper].questions;
  const picks = state.picks[paper];
  if (filter === "all") return qs.slice();
  if (filter === "answered") return qs.filter(q => picks[q.n] !== undefined);
  if (filter === "unanswered") return qs.filter(q => picks[q.n] === undefined);
  if (filter === "wrong") {
    return qs.filter(q => {
      const p = picks[q.n];
      return p !== undefined && q.answer !== "#" && q.answer.indexOf(p) < 0;
    });
  }
  if (filter === "marked") return qs.filter(q => isMarked(paper, q.n));
  return qs.slice();
}

function _filterCounts(paper) {
  return {
    all: _filterQs(paper, "all").length,
    answered: _filterQs(paper, "answered").length,
    wrong: _filterQs(paper, "wrong").length,
    unanswered: _filterQs(paper, "unanswered").length,
    marked: _filterQs(paper, "marked").length,
  };
}

function buildExportHTML(paper, filter) {
  const allQs = DATA[paper].questions;
  const picks = state.picks[paper];
  const qs = _filterQs(paper, filter);
  const total = allQs.length;
  const answered = Object.keys(picks).length;
  const correctCount = Object.entries(picks).filter(([n, p]) => isCorrect(paper, parseInt(n), p)).length;
  const pct = total > 0 ? ((correctCount / total) * 100).toFixed(1) : "0.0";
  const filterLabel = {all:"全部題目", wrong:"僅錯題", answered:"僅已作答", unanswered:"僅未作答", marked:"僅已標記"}[filter];
  const paperLabel = DATA[paper].label + (paper === "Q1" ? "（114020）" : "（114090）");

  const subjectTitle = "神經疾病物理治療學 · 民國 112 年 · " + paperLabel;
  const fileTitle = `神經_112_${paperLabel.replace(/[（）]/g, "")}_${filterLabel}_${_stamp()}`;

  let body = "";
  for (const q of qs) {
    const pick = picks[q.n];
    const correct = q.answer;
    const errata = (correct === "#");
    const answeredFlag = pick !== undefined;
    let statusLabel, statusCls;
    const multiHere = (!errata && correct && correct.length > 1);
    if (errata) { statusLabel = "一律給分"; statusCls = "errata"; }
    else if (!answeredFlag) { statusLabel = "未作答"; statusCls = "unanswered"; }
    else if (multiHere) {
      const ok = correct.indexOf(pick) >= 0;
      statusLabel = ok ? "✓ 多解·入正解" : "✗ 多解·未入正解";
      statusCls = ok ? "correct" : "wrong";
    }
    else if (pick === correct) { statusLabel = "✓ 答對"; statusCls = "correct"; }
    else { statusLabel = "✗ 答錯"; statusCls = "wrong"; }

    let imgsHTML = "";
    for (const u of q.images) {
      imgsHTML += `<img class="qimg" src="${u}" alt="題目附圖">`;
    }

    let optsHTML = "";
    const multi = (!errata && correct && correct.length > 1);
    for (const k of ["A","B","C","D"]) {
      const isPick = (k === pick);
      const isCorr = (!errata && correct && correct.indexOf(k) >= 0);
      let cls = "opt";
      let tag = "";
      if (isPick && isCorr) { cls += " correct user-pick"; tag = "（你的選擇 ✓）"; }
      else if (isPick && !isCorr && !errata) { cls += " wrong user-pick"; tag = "（你的選擇 ✗）"; }
      else if (isCorr) { cls += " correct"; tag = (multi ? "（正解之一）" : "（正解）"); }
      else if (isPick && errata) { cls += " errata user-pick"; tag = "（你的選擇）"; }
      optsHTML += `<li class="${cls}"><b>${k}.</b> ${_esc(q.options[k] || "")}<span class="opt-tag">${tag}</span></li>`;
    }

    let verdictHTML = "";
    if (errata) {
      verdictHTML = `<div class="verdict errata"><b>本題經考選部公告「一律給分」</b>${answeredFlag ? `（你選了 ${pick}）` : ""}</div>`;
    } else if (multi) {
      const letters = correct.split("").join(" 或 ");
      const ok = answeredFlag && correct.indexOf(pick) >= 0;
      verdictHTML = `<div class="verdict errata"><b>本題經考選部公告「答 ${letters} 均給分」</b>${answeredFlag ? ` · 你選 <b>${pick}</b>${ok ? " ✓" : " ✗"}` : " · 未作答"}</div>`;
    } else if (!answeredFlag) {
      verdictHTML = `<div class="verdict unanswered"><b>未作答</b> · 正解：<b>${correct}</b></div>`;
    } else {
      const ok = pick === correct;
      verdictHTML = `<div class="verdict ${ok ? "correct" : "wrong"}"><b>${ok ? "✓ 答對" : "✗ 答錯"}</b> · 你的選擇：<b>${pick}</b> · 正解：<b>${correct}</b></div>`;
    }

    const explHTML = q.explanation ? `<div class="expl"><b>詳解 ▸</b> ${_esc(q.explanation)}</div>` : "";

    const markedBadge = isMarked(paper, q.n) ? ` <span class="qstatus marked">🔖 已標記</span>` : "";
    body += `<article class="q ${statusCls}">
  <div class="qhead">
    <h2>第 ${q.n} 題</h2>
    <span class="qstatus ${statusCls}">${statusLabel}</span>${markedBadge}
  </div>
  <div class="stem">${_esc(q.stem)}</div>
  ${imgsHTML}
  <ol class="opts">${optsHTML}</ol>
  ${verdictHTML}
  ${explHTML}
</article>`;
  }

  const css = `
:root { --ink:#1f2933; --soft:#52606d; --line:#dde2e7; --primary:#1d6f9b;
  --green:#2f9e44; --green-soft:#e6f7ec; --red:#c92a2a; --red-soft:#fff0f0;
  --yellow:#a07700; --yellow-soft:#fff8d8; --grey:#f3f4f6; }
* { box-sizing: border-box; }
body { font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  color: var(--ink); line-height: 1.7; margin: 0; padding: 0; background: #fafbfc; }
.wrap { max-width: 880px; margin: 0 auto; padding: 24px 22px 60px; }
header.report { padding: 18px 22px; border-bottom: 2px solid var(--primary); background: #fff; margin: -24px -22px 24px; }
header.report h1 { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: var(--primary); }
header.report .meta { color: var(--soft); font-size: 13px; line-height: 1.7; }
header.report .score { font-size: 22px; color: var(--primary); font-weight: 700; }
header.report .actions { margin-top: 10px; }
.print-btn { background: var(--primary); color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
article.q { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; margin-bottom: 14px; page-break-inside: avoid; break-inside: avoid; }
article.q.correct { border-left: 4px solid var(--green); }
article.q.wrong { border-left: 4px solid var(--red); }
article.q.errata { border-left: 4px solid var(--yellow); }
article.q.unanswered { border-left: 4px solid var(--soft); background: #fcfcfd; }
.qhead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.qhead h2 { font-size: 15px; margin: 0; font-weight: 700; }
.qstatus { font-size: 12px; padding: 2px 9px; border-radius: 999px; font-weight: 600; }
.qstatus.correct { background: var(--green-soft); color: var(--green); }
.qstatus.wrong { background: var(--red-soft); color: var(--red); }
.qstatus.errata { background: var(--yellow-soft); color: var(--yellow); }
.qstatus.unanswered { background: var(--grey); color: var(--soft); }
.qstatus.marked { background: var(--yellow-soft); color: var(--yellow); margin-left: 4px; }
.stem { font-size: 15px; white-space: pre-wrap; word-break: break-word; margin-bottom: 10px; }
.qimg { display: block; max-width: 100%; max-height: 380px; margin: 8px 0; border: 1px solid var(--line); border-radius: 4px; }
ol.opts { list-style: none; padding-left: 0; margin: 8px 0; }
ol.opts li.opt { padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 5px; font-size: 14px; background: #fff; display: flex; gap: 8px; align-items: flex-start; }
ol.opts li.opt b { min-width: 22px; }
ol.opts li.opt .opt-tag { margin-left: auto; font-size: 12px; font-weight: 600; }
ol.opts li.opt.correct { background: var(--green-soft); border-color: var(--green); color: #186b29; }
ol.opts li.opt.wrong { background: var(--red-soft); border-color: var(--red); color: #861818; }
ol.opts li.opt.errata { background: var(--yellow-soft); border-color: var(--yellow); }
.verdict { padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-top: 8px; }
.verdict.correct { background: var(--green-soft); color: #186b29; }
.verdict.wrong { background: var(--red-soft); color: #861818; }
.verdict.errata { background: var(--yellow-soft); color: #6b4e00; }
.verdict.unanswered { background: var(--grey); color: var(--soft); }
.expl { margin-top: 8px; padding: 10px 14px; background: #f5f7fa; border-left: 3px solid var(--primary); border-radius: 0 6px 6px 0; font-size: 13.5px; line-height: 1.75; color: #2c3a44; }
.empty { padding: 40px; text-align: center; color: var(--soft); border: 1px dashed var(--line); border-radius: 8px; background: #fff; }
@media print {
  body { background: #fff; }
  .print-btn, .actions { display: none !important; }
  header.report { margin: 0; border-bottom: 2px solid #000; }
  article.q { box-shadow: none; }
}
`;

  let main;
  if (qs.length === 0) {
    main = `<div class="empty">沒有符合條件的題目（${filterLabel}）。</div>`;
  } else {
    main = body;
  }

  const html = `<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${_esc(fileTitle)}</title>
<style>${css}</style>
</head>
<body>
<div class="wrap">
  <header class="report">
    <h1>${_esc(subjectTitle)}</h1>
    <div class="score">得分 ${correctCount} / ${total} （${pct}%）</div>
    <div class="meta">
      已作答 ${answered} 題 · 答對 ${correctCount} 題 · 答錯 ${answered - correctCount} 題 · 未作答 ${total - answered} 題 · 🔖 已標記 ${markedCount(paper)} 題<br>
      匯出範圍：<b>${filterLabel}</b>（${qs.length} 題） · 匯出時間：${_nowStr()}
    </div>
    <div class="actions">
      <button class="print-btn" onclick="window.print()">列印 / 存成 PDF</button>
    </div>
  </header>
  <main>${main}</main>
</div>
</body>
</html>`;
  return { html, fileTitle };
}

function downloadExport(filter) {
  const { html, fileTitle } = buildExportHTML(state.paper, filter);
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fileTitle + ".html";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
}

function showExportModal() {
  const modal = document.getElementById("exportModal");
  // Update counts based on current paper state
  const c = _filterCounts(state.paper);
  document.getElementById("cntAll").textContent = `(${c.all} 題)`;
  document.getElementById("cntAnswered").textContent = `(${c.answered} 題)`;
  document.getElementById("cntWrong").textContent = `(${c.wrong} 題)`;
  document.getElementById("cntUnans").textContent = `(${c.unanswered} 題)`;
  document.getElementById("cntMarked").textContent = `(${c.marked} 題)`;
  document.getElementById("exportSub").textContent =
    "本卷：" + DATA[state.paper].label + (state.paper === "Q1" ? "（114020）" : "（114090）");
  // Disable empty options
  document.querySelectorAll("#exportOpts .exp-opt").forEach(b => {
    const f = b.getAttribute("data-filter");
    b.disabled = (c[f] === 0);
  });
  modal.classList.add("show");
}
function hideExportModal() {
  document.getElementById("exportModal").classList.remove("show");
}

document.getElementById("exportBtn").onclick = showExportModal;
document.getElementById("closeExportBtn").onclick = hideExportModal;
document.getElementById("exportModal").addEventListener("click", e => {
  if (e.target.id === "exportModal") hideExportModal();
});
document.querySelectorAll("#exportOpts .exp-opt").forEach(btn => {
  btn.onclick = () => {
    const filter = btn.getAttribute("data-filter");
    if (btn.disabled) return;
    downloadExport(filter);
    hideExportModal();
  };
});

render();
// Broadcast initial state to parent (dashboard) if loaded as iframe
broadcastProgress();
</script>
