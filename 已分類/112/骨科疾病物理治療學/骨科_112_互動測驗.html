<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骨科疾病物理治療學 — 114 年互動測驗</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --ink: #1f2933;
    --ink-soft: #52606d;
    --line: #e4e7eb;
    --primary: #1d6f9b;
    --primary-soft: #e6f1f7;
    --green: #2f9e44;
    --green-soft: #d3f9d8;
    --red: #c92a2a;
    --red-soft: #ffe3e3;
    --yellow: #d9a700;
    --yellow-soft: #fff4c2;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei",
                 "Noto Sans TC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
    font-size: 16px;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 14px 22px;
    position: sticky; top: 0; z-index: 10;
  }
  .h-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    background: #f1f3f5; border: 1px solid var(--line); color: var(--ink-soft);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .progress { color: var(--ink-soft); font-size: 14px; margin-left: auto; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 22px; max-width: 1400px; margin: 18px auto; padding: 0 22px; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; padding: 0 14px; } .sidebar { order: 2; position: static; } }
  .sidebar {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; height: fit-content; position: sticky; top: 78px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
  }
  .gbtn {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
    color: var(--ink-soft); font-size: 13px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .gbtn:hover { border-color: var(--primary); }
  .gbtn.cur { background: var(--primary); color: #fff; border-color: var(--primary); }
  .gbtn.right { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .gbtn.wrong { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .legend { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 4px; border: 1px solid var(--line); }
  .dot.r { background: var(--green-soft); border-color: var(--green); }
  .dot.w { background: var(--red-soft); border-color: var(--red); }
  .main { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .qhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .qnum { font-size: 22px; font-weight: 700; color: var(--primary); }
  .qmeta { color: var(--ink-soft); font-size: 13px; }
  .stem { font-size: 16px; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
  .qimg { display: block; max-width: 100%; max-height: 480px; margin: 8px 0; border: 1px solid var(--line); border-radius: 6px; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    transition: background .12s, border-color .12s;
    text-align: left;
    font-size: 15.5px;
    color: var(--ink);
  }
  .opt:hover:not(.locked) { background: var(--primary-soft); border-color: var(--primary); }
  .opt.locked { cursor: default; }
  .opt .label { font-weight: 700; min-width: 22px; }
  .opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .opt.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .verdict { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 14px; line-height: 1.7; }
  .verdict.right { background: var(--green-soft); color: #186b29; }
  .verdict.wrong { background: var(--red-soft); color: #861818; }
  .verdict.note { background: var(--yellow-soft); color: #6b4e00; }
  .verdict h3 { margin: 0 0 6px; font-size: 14px; }
  .nav { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    background: var(--primary); color: #fff; border: 0; padding: 9px 18px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: #fff; color: var(--red); border: 1px solid var(--red); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .summary { padding: 18px; }
  .summary h2 { margin: 0 0 8px; }
  .score { font-size: 32px; font-weight: 700; color: var(--primary); }
  .wrong-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .wrong-row { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .wrong-row:hover { background: var(--primary-soft); }
  .footer { color: var(--ink-soft); font-size: 12px; text-align: center; margin: 16px 0 30px; }

  .homelink { color: var(--soft); text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .homelink:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }


  /* Export modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,30,.45); display: none; align-items: center; justify-content: center; z-index: 100; padding: 18px; }
  .modal-bg.show { display: flex; }
  .modal-card { background: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.18); max-width: 460px; width: 100%; padding: 22px; }
  .modal-card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 700; }
  .modal-card .modal-sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; }
  .modal-card .opt-row { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
  .modal-card .exp-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; background: #f8f9fa; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left; color: var(--ink); }
  .modal-card .exp-opt:hover { background: var(--primary-soft); border-color: var(--primary); }
  .modal-card .exp-opt:disabled { opacity: 0.5; cursor: not-allowed; background: #f1f3f5; }
  .modal-card .exp-opt .count { color: var(--ink-soft); font-size: 12px; }
  .modal-card .hint { color: var(--ink-soft); font-size: 12px; line-height: 1.6; margin: 0 0 12px; }
  .modal-card .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }


  /* Bookmark / marker */
  .gbtn { position: relative; }
  .gbtn.marked::after {
    content: "★"; position: absolute; top: 1px; right: 3px;
    font-size: 10px; color: var(--yellow); line-height: 1;
    text-shadow: 0 0 2px #fff;
  }
  .markbtn {
    margin-left: auto; background: #fff; border: 1px solid var(--line);
    color: var(--ink-soft); padding: 6px 13px; border-radius: 999px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .markbtn:hover { border-color: var(--yellow); color: var(--yellow); }
  .markbtn.marked { background: var(--yellow-soft); color: #6b4e00; border-color: var(--yellow); font-weight: 600; }
  .qhead { flex-wrap: wrap; }
  .marked-badge { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--yellow-soft); color: #6b4e00; font-size: 11px; border: 1px solid var(--yellow); margin-left: 4px; }
  .wrong-row.mk { border-color: var(--yellow); }

</style>
</head>
<body>
<header>
  <div class="h-row">
    <a class="homelink" href="../../../index.html" title="回到測驗首頁">← 回首頁</a>
    <h1>骨科疾病物理治療學 · 民國 112 年</h1>
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="Q1">第一次 (114020)</button>
      <button class="tab" data-tab="Q2">第二次 (114090)</button>
    </div>
    <div class="progress" id="progress"></div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div style="font-size:13px;color:var(--ink-soft);margin-bottom:6px;">題號（共 80 題）</div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="dot r"></i>答對</span>
      <span><i class="dot w"></i>答錯</span>
      <span style="color:var(--yellow);">★ 已標記</span>
    </div>
    <button id="resetBtn" class="btn danger" style="margin-top:12px;width:100%;font-size:13px;">重置本卷作答</button>
    <button id="summaryBtn" class="btn ghost" style="margin-top:6px;width:100%;font-size:13px;">查看本卷總結</button>
    <button id="exportBtn" class="btn ghost" style="margin-top:6px;width:100%;font-size:13px;">📤 匯出結果…</button>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="footer">資料來源：考選部 112 年第一次／第二次專技高等考試 · 物理治療師 · 骨科疾病物理治療學</div>

<div class="modal-bg" id="exportModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h3>匯出測驗結果</h3>
    <div class="modal-sub" id="exportSub">本卷：第一次 (114020)</div>
    <div class="opt-row" id="exportOpts">
      <button class="exp-opt" data-filter="all">📄 全部題目（含詳解） <span class="count" id="cntAll"></span></button>
      <button class="exp-opt" data-filter="answered">📝 僅已作答 <span class="count" id="cntAnswered"></span></button>
      <button class="exp-opt" data-filter="wrong">❌ 僅錯題 <span class="count" id="cntWrong"></span></button>
      <button class="exp-opt" data-filter="unanswered">⏳ 僅未作答 <span class="count" id="cntUnans"></span></button>
      <button class="exp-opt" data-filter="marked">🔖 僅已標記 <span class="count" id="cntMarked"></span></button>
    </div>
    <p class="hint">將下載一份自包含的 .html 檔，可離線檢視。打開後可用瀏覽器「列印」（Ctrl/⌘+P）→「另存為 PDF」存成 PDF。</p>
    <div class="modal-actions">
      <button class="btn ghost" id="closeExportBtn">取消</button>
    </div>
  </div>
</div>

<script>
const DATA = {"Q1": {"label": "第一次", "questions": [{"n": 1, "stem": "當患者用右手壓住左邊的第一肋骨，然後做出頭頸後伸（extension）、側彎到右邊、旋轉到左側的動作，是希\n望牽張（stretch）下列那條肌肉？", "options": {"A": "胸鎖乳突肌（sternocleidomastoid）", "B": "前斜角肌（scalenus anterior）", "C": "斜方肌（trapezius）", "D": "提肩胛肌（levator scapulae）"}, "images": [], "answer": "B", "explanation": "壓住第 1 肋骨+頭頸後伸+右側彎+左旋轉 = 牽張左側『前斜角肌』(scalenus anterior)，故選 B。"}, {"n": 2, "stem": "有關急性期（0～3週）之頸部揮鞭症候群（whiplash syndrome）之敘述，下列何者最不適當？", "options": {"A": "可以物理因子降低病人的疼痛", "B": "可戴頸圈（collar），但要避免固定時間太久，以免造成肌肉無力", "C": "若身體狀況允許，鼓勵患者儘速回到工作崗位", "D": "可教導患者四肢關節的運動，但應避免軀幹的運動"}, "images": [], "answer": "D", "explanation": "急性期 whiplash 不應限制軀幹運動（會加重僵硬與失能），應鼓勵主動活動；故 D 不適當。"}, {"n": 3, "stem": "頂韌帶（apical ligament）的功能為限制枕骨至第一或第二頸椎區間的：①拉離（distraction） ②擠壓\n（compression） ③旋轉（rotation）", "options": {"A": "僅①", "B": "僅②", "C": "①③", "D": "②③"}, "images": [], "answer": "AC", "explanation": "本題經考選部公告「答 A 或 C 均給分」。Apical ligament 限制 C0-C1/C2 的拉離①與旋轉③；A、C 均可。"}, {"n": 4, "stem": "當進行頸部活動度檢查時，發現頸椎後仰及左側彎有明顯限制，下列何者最不可能是造成此現象的原因？", "options": {"A": "右側頸屈肌過於緊繃", "B": "左側頸伸肌過於緊繃", "C": "左側椎間盤有小突出", "D": "前縱韌帶與脊椎體的沾黏"}, "images": [], "answer": "B", "explanation": "頸後仰+左側彎受限：右側頸屈肌緊（A 對）、左側椎間盤突（C 對）、前縱韌帶沾黏（D 對）；左側頸伸肌緊縮應使左側彎受限但促進後仰，B 邏輯不合，故 B 最不可能。"}, {"n": 5, "stem": "張嘴初期下巴歪向右邊，通常是由於下列何原因造成的？", "options": {"A": "右邊咬肌（masseter）的肌肉攣縮（spasm）", "B": "左邊顳頜關節之活動度受限", "C": "左邊咬肌（masseter）的肌肉攣縮（spasm）", "D": "左邊顳頜關節間盤（disk）前移"}, "images": [], "answer": "A", "explanation": "張嘴下巴歪向右邊，是右側咬肌（masseter）攣縮造成（不對稱限制了張口），故選 A。"}, {"n": 6, "stem": "胸廓擴張度（chest expansion）常被用來表示下列那個關節的活動度？", "options": {"A": "椎間關節（intervertebral joints）", "B": "肋椎關節（costovertebral joints）", "C": "肋胸骨關節（costosternal joints）", "D": "小面關節（apophyseal or facet joints）"}, "images": [], "answer": "B", "explanation": "胸廓擴張度反映『肋椎關節』(costovertebral joint) 活動度，故選 B。"}, {"n": 7, "stem": "造成頸椎中央椎管狹窄（central stenosis），最不可能為下列何原因？", "options": {"A": "椎間盤突出", "B": "頸部前彎動作，使髓腔的前後徑變小", "C": "後縱韌帶鈣化（ossification of the posterior longitudinal ligament）", "D": "骨刺增生"}, "images": [], "answer": "B", "explanation": "頸前彎時椎管前後徑會『增加』(後縱韌帶被拉開)，反而緩解狹窄；故 B 不會造成狹窄。"}, {"n": 8, "stem": "有關頸椎間盤病變之敘述，下列何者正確？", "options": {"A": "好發於65歲以上老年人", "B": "好發於上頸椎", "C": "臨床症狀一定合併痛及肌肉無力", "D": "相較於腰椎間盤病變，頸椎間盤病變較少發生"}, "images": [], "answer": "D", "explanation": "頸椎間盤病變相對於腰椎較少發生（因頸椎椎間盤承重小於腰椎）；故選 D。"}, {"n": 9, "stem": "當懷疑病患的上肢麻痛與感覺異常來自於頸椎神經根病變時，下列何者不是相關的測試？", "options": {"A": "頸椎拉離測試（distraction test）", "B": "頸椎椎孔壓迫測試（foraminal compression test）", "C": "肩部外展測試（shoulder abduction test）", "D": "頸椎前向剪力測試（anterior shear test）"}, "images": [], "answer": "D", "explanation": "頸椎前向剪力測試屬於『不穩定測試』(寰樞關節不穩定)，與神經根病變無直接相關；故選 D。"}, {"n": 10, "stem": "治療師以肌肉能量技術（muscle energy technique）進行肋骨半脫位（subluxation）的矯正時，針對右側一根卡\n在後面的肋骨，下列那一方向的等長肌肉收縮是最適當的治療？", "options": {"A": "右肩關節屈曲（shoulder flexion）", "B": "左肩關節伸直（shoulder extension）", "C": "右肩關節水平方向內收（horizontal adduction）", "D": "左肩關節水平方向外展（horizontal abduction）"}, "images": [], "answer": "C", "explanation": "右側肋骨卡在後方需『向前推回』，可用右肩水平內收的等長收縮（拉前胸肋骨往前）；故選 C。"}, {"n": 11, "stem": "跨欄選手在薦髂關節處有明顯壓痛，進行站立前屈測試（standing flexion test）時，發現右側髂後上棘\n（PSIS）向上滑動的距離較大。患者仰臥時，物理治療師比較患者兩側髂前上棘（ASIS）的高度，發現右側\n較低，最可能為下列何種狀況？", "options": {"A": "右側髂骨卡在前旋轉位置，是右側髂骨前旋轉失能", "B": "右側髂骨卡在後旋轉位置，是右側髂骨後旋轉失能", "C": "左側髂骨卡在前旋轉位置，是左側髂骨前旋轉失能", "D": "左側髂骨卡在後旋轉位置，是左側髂骨後旋轉失能"}, "images": [], "answer": "A", "explanation": "PSIS 站立前彎右側上滑+ASIS 仰臥右低 = 『右髂骨前旋失能』(anterior rotation dysfunction)；故選 A。"}, {"n": 12, "stem": "下列利用仰臥起坐訓練腹肌的運動，由易到難的排列順序為何？①雙手在頭後坐起（curl up） ②雙手在胸\n前坐起（curl up） ③雙手在身體兩旁坐起（curl up）", "options": {"A": "③②①", "B": "③①②", "C": "②③①", "D": "②①③"}, "images": [], "answer": "A", "explanation": "仰臥起坐難度：手臂位置重心愈高愈難；身體兩旁（③）最易→胸前（②）→頭後（①）最難；故選 A（③②①）。"}, {"n": 13, "stem": "一位 L4／5腰椎間盤向左外側突出患者，身體檢查時發現：站立時，呈現身體向左側彎姿勢，要求患者向右\n側彎時，主訴左側下肢（臀部及大腿）的疼痛加劇，另外軀幹向前彎或坐姿症狀加劇，站直走路或後仰較舒\n服。左大腿外側、小腿內側及大腳趾背側感覺異常；左踝背屈肌力無力、左膝深腱反射降低。依據現有資\n料，下列敘述何者正確？", "options": {"A": "主要壓迫到L5神經根", "B": "屬於屈曲導向（flexion bias）的背痛患者", "C": "椎間盤於L5神經根的內側突出", "D": "執行右腳被動直腿提起測試，可預期左腳發生陽性反應"}, "images": [], "answer": "D", "explanation": "L4/5 椎間盤左外突壓迫『L5 神經根』；屬伸直導向（後仰較舒服）；右側彎引起左側痛代表突出在 L5 神經根『內側』，向右拉時更壓迫；故選 D 正確。"}, {"n": 14, "stem": "站立時常處於懶散姿勢（slouched posture）者，下列那一肌肉最可能發生緊繃縮短？", "options": {"A": "髂肌", "B": "下腹肌", "C": "髖伸肌", "D": "下胸椎伸肌"}, "images": [], "answer": "C", "explanation": "懶散站姿（slouched posture）下髖伸位，臀大肌與膕旁肌（『髖伸肌』)反而被縮短；其他選項描述方向反；故選 C。"}, {"n": 15, "stem": "當薦骨後扭轉失能（sacral backward torsion dysfunction），出現在右斜軸上的左扭轉時，可能會出現下列何種\n狀況？", "options": {"A": "右側薦骨底往前旋受限", "B": "坐姿前彎測試和Gillet's測試會在右側出現陽性反應", "C": "當腰椎為平坦（flatten）狀態時，腰椎彈壓測試（spring test）為陽性", "D": "在俯臥時左側薦骨底和下外角會往前"}, "images": [], "answer": "C", "explanation": "薦骨後扭轉於右斜軸的左扭轉時，當腰椎為『平坦』(屈曲位置) 狀態下做彈壓測試會出現陽性反應（背側壓力傳導不對稱）；故選 C。"}, {"n": 16, "stem": "下列何者最不可能是職業引發下背痛的危險因子？", "options": {"A": "長期坐姿", "B": "常提重物", "C": "長期走動", "D": "常採蹲姿"}, "images": [], "answer": "C", "explanation": "下背痛職業危險因子：久坐、抬重物、蹲姿、震動暴露；長期走動（無重物、無不良姿勢）反而較不是危險因子；故選 C。"}, {"n": 17, "stem": "下背痛患者出現脊椎側移（lateral shift）； 久坐及站立前彎時症狀會往腳部延伸；咳嗽時疼痛加劇；軀幹後\n仰則疼痛向下背集中。下列何者為患者最可能的疼痛來源？", "options": {"A": "腰椎椎間盤", "B": "腰椎小面關節", "C": "腰椎肌肉痙攣", "D": "肌筋膜症候群"}, "images": [], "answer": "A", "explanation": "脊椎側移+久坐前彎症狀往腳延伸+咳嗽痛+後仰集中 = 椎間盤後外突的典型表現；故選 A。"}, {"n": 18, "stem": "測試閉孔神經（obturator nerve）的機械性敏感度（mechanosensitivity）時，下肢擺位應包括那些動作？", "options": {"A": "髖屈曲、髖內收、膝伸直、踝背屈", "B": "髖屈曲、髖外展、膝伸直、踝背屈", "C": "髖屈曲、髖內旋、膝伸直、踝蹠屈", "D": "髖屈曲、髖外旋、膝伸直、踝蹠屈"}, "images": [], "answer": "B", "explanation": "閉孔神經張力測試：髖屈+外展+膝伸+踝背屈；故選 B。"}, {"n": 19, "stem": "如果背痛患者在仰躺姿勢無法將腳抬起或放下；在四點跪姿（4-point position）且維持腰椎在正中排列\n（neutral alignment）姿勢下，無法將單手與對側腳抬起；則應優先訓練下列那些肌肉？①腹橫肌 ②腹直\n肌    ③腰椎多裂肌 ④大腿後肌群", "options": {"A": "①②", "B": "②④", "C": "①③", "D": "③④"}, "images": [], "answer": "C", "explanation": "仰躺無法抬腳放下+四點跪姿不能動 = 軀幹深層穩定肌（腹橫肌+多裂肌）功能不足；故選 C（①③）。"}, {"n": 20, "stem": "對慢性下背痛患者執行被動直膝抬腿測試到髖屈曲60度時，患者覺得膝關節後方有疼痛感，加上頸部屈曲或\n伸直動作，皆未改變此痛感，下列何者是最有可能之問題？", "options": {"A": "腰椎間盤突出（lumbar intervertebral disc herniation）", "B": "髂腰韌帶扭傷（iliolumbar ligament sprain）", "C": "坐骨神經機械敏感度過增（excessive mechanosensitivity of the sciatic nerve）", "D": "大腿後肌群（hamstrings）長度不足"}, "images": [], "answer": "D", "explanation": "SLR 60° 膝後痛+頸屈伸不改變痛感 = 大腿後肌群長度不足（不是神經張力問題）；故選 D。"}, {"n": 21, "stem": "關於下背痛患者的運動治療原則，下列何者正確？", "options": {"A": "脊柱側彎（scoliosis）僅適合脊椎穩定（stabilization）原則", "B": "平背姿勢（flat back posture）適合屈曲導向（flexion bias）", "C": "椎間盤後外側突出適合伸直導向（extension bias）", "D": "脊椎滑脫（spondylolisthesis）僅適合脊椎鬆動（mobilization）原則"}, "images": [], "answer": "C", "explanation": "椎間盤後外側突出 → 後仰可使核脫離神經根，屬伸直偏好；故選 C。其他選項描述太絕對。"}, {"n": 22, "stem": "物理治療師檢查下背痛患者時，將其髖關節被動置於屈曲、外展、外轉的終端角度即產生疼痛，此檢查結果\n與下列何者最不相關？", "options": {"A": "薦髂關節失能", "B": "髂腰肌（iliopsoas）痙攣", "C": "髖關節病變", "D": "縫匠肌（sartorius）痙攣"}, "images": [], "answer": "D", "explanation": "髖被動屈曲外展外轉終端=FABER 測試，與 SI、髖、髂腰肌、內收肌相關；縫匠肌主要為髖屈+外展+外轉，FABER 為其縮短姿勢，反而會疼痛較少；故 D 最不相關。"}, {"n": 23, "stem": "經物理治療師觀察後，發現患者有頭部前移（forward head posture）、圓肩（round shoulder）及腰椎過度前凸\n（lumbar hyperlordosis）的問題，則較不建議患者執行下列何項運動？", "options": {"A": "腹肌肌力訓練", "B": "胸小肌牽張（stretch）運動", "C": "頸伸肌牽張（stretch）運動", "D": "胸大肌肌力訓練"}, "images": [], "answer": "D", "explanation": "前位頭部+圓肩+腰前凸患者，胸大肌處於緊縮狀態；應做『胸大肌牽拉』而非肌力訓練；故選 D 不建議。"}, {"n": 24, "stem": "有關造成功能性脊椎側彎之可能原因，下列敘述何者錯誤？", "options": {"A": "脊柱兩側肌張力不平衡", "B": "長短腿", "C": "長期姿勢不良", "D": "脊椎構造有不可逆之脊柱旋轉"}, "images": [], "answer": "D", "explanation": "功能性側彎是可逆的，不應有『不可逆的脊柱旋轉』(那是結構性側彎)；故 D 錯誤。"}, {"n": 25, "stem": "病患正面站姿若出現腳尖朝內（in-toeing）的錯誤姿勢，則下列相關身體部位的變化，何者較不可能出現？", "options": {"A": "脛骨向內扭轉（medial torsion）", "B": "股骨向內扭轉（medial torsion）", "C": "股骨後轉（retroversion）", "D": "內旋足（pronated foot）"}, "images": [], "answer": "C", "explanation": "腳尖朝內 (in-toeing) 常見原因：脛骨內轉、股骨內轉、股骨『前傾』(anteversion，不是後轉)、內旋足；C 描述方向反，最不可能。"}, {"n": 26, "stem": "盂肱關節人工關節置換（glenohumeral joint arthroplasty）術後4週內為保護期，在此時期之物理治療計畫內\n容，下列何者最不適當？", "options": {"A": "須以吊帶（sling）保護", "B": "盂肱關節的被動關節運動，無須限制活動方向", "C": "可以讓患者做鐘擺運動（pendulum exercise）", "D": "可以讓患者在肩胛平面（scapular plane）做三角肌的不承重等長收縮運動"}, "images": [], "answer": "B", "explanation": "盂肱人工關節置換術後 4 週內的被動關節運動須限制方向（特別是外轉避免拉扯肩胛下肌縫合處）；故 B 不適當。"}, {"n": 27, "stem": "下列何種狀況不是次發性肩關節夾擠症候群（shoulder impingement syndrome）的發生原因？", "options": {"A": "肩峰下出口（subacromial outlet）狹窄", "B": "前鋸肌（serratus anterior）無力", "C": "肩胛肱骨節律（scapulohumeral rhythm）失序", "D": "旋轉肌群（rotator cuff）無力"}, "images": [], "answer": "A", "explanation": "次發性夾擠由肩胛肱骨節律異常+前鋸肌、旋轉肌弱+姿勢造成；肩峰下出口狹窄為『原發性 (outlet impingement)』；故選 A。"}, {"n": 28, "stem": "肩盂上唇前後（SLAP, superior labrum anterior and posterior）受傷，經開刀修復後，下列那個介入方式最不適\n當？", "options": {"A": "開刀後2週內可執行被動肩關節活動", "B": "使用吊帶（sling）最好不要超過4週", "C": "開刀後2週內即應開始肘屈曲（elbow flexion）肌力訓練", "D": "開刀後6週可以開始有旋轉肌群（rotator cuff）肌力訓練"}, "images": [], "answer": "C", "explanation": "SLAP 修復術後 2 週內肘屈曲肌力訓練會牽拉長頭肌腱影響上盂唇癒合；應暫緩；故 C 不適當。"}, {"n": 29, "stem": "有關肩關節前向不穩定（anterior instability），可以用閉鎖式復位（closed reduction）方式來處理，下列敘述\n何者最不適當？", "options": {"A": "相較於關節鏡（arthroscopic）手術，閉鎖式復位較不易傷到臂神經叢（brachial plexus）", "B": "復位後，年輕人比老年人需較長時間的活動限制", "C": "在保護期，可在肩關節休息位置（resting position）下執行肩外轉（external rotation）的運動，不超過15度為 限", "D": "在保護期，可在安全方向執行maitland第二級（grade II）的肩關節鬆動術"}, "images": [], "answer": "A", "explanation": "閉鎖式復位（closed reduction）相較關節鏡手術，反而『更可能』因復位手法不當而傷及臂神經叢（C8-T1）；故 A 描述方向反，錯誤。"}, {"n": 30, "stem": "急性原發性肩旋轉肌群結構損傷，最不可能出現下列何種症狀？", "options": {"A": "舉手有疼痛弧（painful arc）的特徵，但過了這弧度就不太疼痛", "B": "從舉手過頭的位置慢慢放下可能會痛，甚至有時比舉手還痛", "C": "疼痛位於肩膀的前外側，有時會向手臂延伸", "D": "肩關節角度會呈現關節囊型態（capsular pattern）受限模式"}, "images": [], "answer": "D", "explanation": "急性原發性肩袖損傷不會出現『capsular pattern』(那是關節囊問題)；旋轉肌損傷為非關節囊型受限；故 D 錯誤。"}, {"n": 31, "stem": "女性患者主訴當解開身後衣扣時有困難，可能與下列那些動作受限有關？①肩內收 ②肩後伸 ③肩內轉\n④肩外轉", "options": {"A": "①②③", "B": "①②④", "C": "僅②③", "D": "僅①④"}, "images": [], "answer": "A", "explanation": "解開背後衣扣需肩內收+肩後伸+肩內轉；肩外轉與此動作無關；故選 A（①②③）。"}, {"n": 32, "stem": "有關肩關節非出口夾擠（nonoutlet impingement）之敘述，下列何者錯誤？", "options": {"A": "症狀發生在肩外展90度及內轉到最大角度時", "B": "通常發生於過肩型運動的運動員", "C": "發生在肩旋轉肌群與盂唇（glenoid labrum）的上後方", "D": "可以後內夾擠測試（posterior internal impingement test）  "B": "可能是臀大肌肌腱滑過股骨大轉子的摩擦聲", "C": "可能是髂股（iliofemoral）韌帶滑過股骨頭的摩擦聲", "D": "可能是髖關節唇（acetabular labrum）的撕裂"}, "images": [], "answer": "C", "explanation": "髖屈+外展+外轉位置內彈響（snapping at 45°）= 髂股韌帶滑過股骨頭；故選 C。"}, {"n": 51, "stem": "有關膕旁肌（hamstring）拉傷的敘述，下列何者正確？", "options": {"A": "好發在膕旁肌的內側肌群", "B": "通常發生在向心收縮時", "C": "骨盆姿勢與膕旁肌拉傷風險無關", "D": "薦髂關節失能增加膕旁肌拉傷風險"}, "images": [], "answer": "D", "explanation": "膕旁肌拉傷風險與骨盆姿勢有關；薦髂關節失能會增加風險；故選 D 正確。"}, {"n": 52, "stem": "關於膝關節特殊測試與組織的配對，下列何者正確？①外樞軸旋轉位移測試（lateral pivot shift test）—前十字\n韌帶 ②反向拉克曼測試（reverse Lachman's test）—後十字韌帶 ③賽斯利測試（Thessaly test）—半月軟\n骨 ④諾貝壓迫測試（Noble compression test）—髕骨內側皺襞", "options": {"A": "僅①②", "B": "僅①②③", "C": "僅③④", "D": "①②③④"}, "images": [], "answer": "B", "explanation": "①Lateral pivot shift = ACL（前外旋轉不穩）✓、②Reverse Lachman = PCL ✓、③Thessaly = 半月軟骨 ✓、④Noble = 髂脛束（不是髕骨皺襞）✗；故選 B（①②③）。"}, {"n": 53, "stem": "若觀察到主動膝伸直時髕骨有過度外移的髕骨動作軌跡障礙（patellar tracking dysfunction），下列何者是常見\n的原因？①髕骨過高 ②髂脛束過緊 ③股直肌肌力不足 ④髕骨內側支持帶（retinaculum）過緊", "options": {"A": "僅③④", "B": "僅①②", "C": "①②④", "D": "②③④"}, "images": [], "answer": "B", "explanation": "髕骨外移軌跡障礙原因：髕骨高②、髂脛束緊②、股直肌弱③（VMO 弱）、髕骨外側支持帶緊（不是內側④）；故選 B（①②）。"}, {"n": 54, "stem": "關於跳躍膝（jumper’s knee）的敘述，下列何者正確？", "options": {"A": "與伸肌機轉（extensor mechanism）過度使用有關", "B": "最常見的症狀是髕股關節疼痛", "C": "髕骨研磨測試（patellar grind test）的結果多為陽性", "D": "通常會伴隨股四頭肌拉傷"}, "images": [], "answer": "A", "explanation": "Jumper's knee（跳躍膝） = 髕骨肌腱炎，與『伸肌機轉過度使用』有關；故選 A。"}, {"n": 55, "stem": "以生物力學的關聯性來看，髕骨肌腱炎患者的那一足踝部肌肉較常見無力？", "options": {"A": "足外翻肌", "B": "足內翻肌", "C": "踝背屈肌", "D": "踝蹠屈肌"}, "images": [], "answer": "C", "explanation": "髕骨肌腱炎患者常見『踝背屈肌（脛前肌）』無力；力學鏈影響整個下肢；故選 C。"}, {"n": 56, "stem": "膝關節前向抽拉測試（anterior drawer test）結果為偽陽性，其最有可能的原因是：", "options": {"A": "關節血腫", "B": "後十字韌帶斷裂", "C": "膕旁肌痙攣", "D": "半月軟骨破裂"}, "images": [], "answer": "B", "explanation": "PCL 斷裂使脛骨後沉，做前抽拉時看似前移大 → 偽陽性 ACL；故選 B。"}, {"n": 57, "stem": "膝前十字韌帶撕裂後，須具備下列那些條件，始得考慮採用非手術療法，而達成功的治療結果？①患側達膝\n屈曲90度的被動關節活動度 ②患側股四頭肌肌力達健側的75%以上 ③利用單邊腋下枴可以走路 ④  "下列何者與跑步有關的過度使用傷害最直接相關？", "options": {"A": "性別", "B": "訓練不當", "C": "跑步的地面", "D": "跑鞋的狀態"}, "images": [], "answer": "B", "explanation": "跑步過度使用傷害最直接原因為『訓練不當』(強度、量、頻率)；故選 B。"}, {"n": 65, "stem": "下列何者不是腳踝扭傷後重新回到正常活動至少須具備的條件？", "options": {"A": "踝關節應有完整的標準關節活動度", "B": "踝關節應有完整的功能性肌力、肌耐力與爆發力", "C": "踝關節在進行活動時不應該產生疼痛或腫脹", "D": "踝關節應有足夠的本體感覺、平衡、協調性及敏捷度"}, "images": [], "answer": "A", "explanation": "重返活動條件：完整功能性肌力+肌耐力+爆發力、無痛無腫、本體感覺平衡敏捷；不一定需『標準關節活動度』(只需功能性 ROM)；故選 A。"}, {"n": 66, "stem": "下列何者為外側踝關節扭傷中最常見的關節錯位（positional fault）？", "options": {"A": "腓骨向前位移，造成遠端脛腓關節錯位", "B": "脛骨向前位移，造成遠端脛腓關節錯位", "C": "腓骨向下位移，造成距骨小腿關節（talocrural joint）錯位", "D": "距骨向下位移，造成距骨小腿關節（talocrural joint）錯位"}, "images": [], "answer": "A", "explanation": "外側踝扭傷常見錯位 = 『腓骨遠端向前位移』(因腓骨被拉前)；故選 A。"}, {"n": 67, "stem": "足部的避震系統可利用足弓高度變化產生緩衝效果，下列敘述何者錯誤？", "options": {"A": "距下關節在崎嶇地面會處在較旋前（pronated）位置，而使足部關節變得鬆弛", "B": "足底筋膜的延展性有限，但回彈力佳，是重要的避震系統之一", "C": "足底筋膜的絞盤效應（windlass mechanism）會讓腳板變得鬆弛以適應地面", "D": "足跟墊（heel pad）的脂肪能有效減少足部與地面的衝量"}, "images": [], "answer": "C", "explanation": "Windlass 機制（足底筋膜在大腳趾背屈時拉緊）會使足弓『升高 + 變硬』(rigid)，不是鬆弛；故 C 錯誤。"}, {"n": 68, "stem": "上身篩檢測試（upper quadrant screening examination）的內容不包含下列那項檢測？", "options": {"A": "頸椎各椎節之關節內活動（joint play）", "B": "在頸椎活動度末端施以被動壓迫（overpressure）", "C": "C5-T1的皮節檢查", "D": "上運動神經元測試"}, "images": [], "answer": "A", "explanation": "上身篩檢測試含主動 ROM、被動末端壓迫、皮節、肌力、上運動神經元測試；不含『關節內 joint play』(屬細部評估)；故選 A。"}, {"n": 69, "stem": "有關肋膜疼痛（pleural pain）的臨床表徵，下列何者錯誤？", "options": {"A": "側躺於患側時，症狀會加劇", "B": "觸診通常不會誘發肋膜疼痛", "C": "疼痛可沿著肋骨緣或進到上腹部", "D": "深呼吸會誘發疼痛"}, "images": [], "answer": "A", "explanation": "肋膜疼痛（pleural pain）側躺於患側時，因壓迫減少肋膜摩擦反而緩解；故 A 描述方向反，錯誤。"}, {"n": 70, "stem": "有關骨質疏鬆症之敘述，下列何者錯誤？", "options": {"A": "因初期無明顯症狀易被忽略，高危險群應建立正確生活習慣，包含攝取足量鈣和維他命D、運動及戒菸", "B": "易發生骨折部位是脊椎、髖部與腕部", "C": "停經女性因老化和缺乏雌激素，使骨組織代謝活動中的造骨能力減弱", "D": "骨質疏鬆症的防治運動，包括承重運動與阻力運動"}, "images": [], "answer": "C", "explanation": "停經女性骨鬆主要因『破骨』活性增加（不是造骨減弱）+雌激素減少；故 C 描述方向反錯誤。"}, {"n": 71, "stem": "有關骨盆底腔 ogenic sarcoma)』，故選 D。"}, {"n": 79, "stem": "某位因工作意外造成右手肘下截肢的年輕男性，經過3個月的治療後提出欲裝配肌電義手（myoelectric hand）\n之意願，希望治療師給予評估及建議，下列敘述何者錯誤？", "options": {"A": "評估殘肢形狀，應成熟定形後製作較佳", "B": "評估殘肢長度，殘肢越長則義肢操控性會越佳", "C": "評估殘肢肘關節活動度，若有明顯攣縮會影響義肢使用", "D": "須有正常神經支配的肌肉來控制肌電訊號，位置在殘肢遠端較近端佳"}, "images": [], "answer": "B", "explanation": "肌電義手控制肌肉位置在殘肢『近端』較好（神經分布更穩定）；遠端常為手部失神經區域；故 D 描述方向反，錯誤。"}, {"n": 80, "stem": "對於穿戴膝上義肢（above-knee prosthesis）患者的進階步態訓練，下列敘述那些正確？①步態訓練可以整合\n環境的變化，增加訓練難度和符合功能行走需求 ②進行步態訓練不需要先行評估個案的平衡、協調和義肢\n側的負重轉移能力 ③避障（obstacle avoidance）行走訓練，可以使用不同步道表面材質來達到訓練效果 ④\n上樓梯行走訓練，不需因義肢的不同膝部型態而有所不同", "options": {"A": "①②", "B": "①③", "C": "②③", "D": "②④"}, "images": [], "answer": "B", "explanation": "AKA 進階步態訓練：①整合環境變化、③用不同表面材質訓練避障；②訓練前需評估平衡與承重、④不同膝部需不同上樓技巧；故選 B（①③）。"}]}, "Q2": {"label": "第二次", "questions": [{"n": 1, "stem": "正常情況下，當胸椎前彎時，胸椎及肋骨會一起產生動作，下列何者正確？①胸椎前彎時，胸椎小面關節會往\n上滑動 ②胸椎前彎時，胸椎小面關節會往下滑動 ③胸椎前彎時，肋骨會往前轉動 ④胸椎前彎時，肋骨會\n往後轉動", "options": {"A": "①③", "B": "②④", "C": "①④", "D": "②③"}, "images": [], "answer": "A", "explanation": "胸椎前彎時：①小面關節向上滑動 + ③肋骨向前轉動；故選 A（①③）。"}, {"n": 2, "stem": "有關頸椎最大壓迫測試（maximum cervical compression test）時，若將患者頭部先側彎到左側，再旋轉到左\n側，下列敘述何者錯誤？", "options": {"A": "此時若有疼痛下傳至左手臂，則表示可能有神經根壓迫", "B": "此時若感覺右邊的頸部肌肉有疼痛感，可能代表右邊頸部肌肉有拉傷", "C": "若再將頸部帶到後伸位置，由頭頂部再施加垂直下壓力，患者左手臂若有症狀，可能會更嚴重", "D": "若在頸部後伸的姿勢下維持30秒，患者出現頭暈噁心的現象，則可能是左側頸動脈受到壓迫"}, "images": [], "answer": "D", "explanation": "頸部後伸+左轉維持 30 秒，若出現頭暈噁心，可能是『右側椎動脈』(對側) 受壓迫，不是左側頸動脈；故 D 描述錯誤。"}, {"n": 3, "stem": "下列何者最符合頸因性頭痛的敘述？", "options": {"A": "C5～C6 的活動度不正常", "B": "單側上頸椎後側疼痛", "C": "單側頭痛不會轉移到另一側、出現非劇烈疼痛且通常非搏動痛（nonthrobbing nature）", "D": "單側額葉、顳葉位置頭痛、叢發性（clusterlike）、雷擊性（thunderclap）、無預兆偏頭痛"}, "images": [], "answer": "C", "explanation": "頸因性頭痛特性：『單側、不轉移到對側、非劇烈、非搏動性』；故選 C。"}, {"n": 4, "stem": "一位頸痛個案主訴低頭時會有頭暈無力現象，如果用手頂住額頭症狀會消失，物理治療師觀察發現個案低頭時\n上頸椎後側有一腫塊，下列處置何者最恰當？", "options": {"A": "訓練頸椎屈肌肌肉", "B": "放鬆枕骨下肌肌肉", "C": "視動協調訓練（oculomotor training）", "D": "立即轉介醫師做進一步檢查與診斷"}, "images": [], "answer": "D", "explanation": "上頸椎後側出現腫塊+低頭頭暈無力 → 立即轉介醫師檢查（可能為腫瘤、椎動脈問題、結構不穩）；故選 D。"}, {"n": 5, "stem": "枕骨下肌群（suboccipital muscles）中，那些肌肉有附著到樞椎（C2）之棘突？① 頭後直大肌（rectus capitis\nposterior major） ②頭後直小肌（rectus capitis posterior minor） ③上頭斜肌（obliquus capitis superior） ④\n下頭斜肌（obliquus capitis inferior）", "options": {"A": "①③④", "B": "②③④", "C": "①④", "D": "②③"}, "images": [], "answer": "C", "explanation": "枕下肌附著於 C2 棘突的有：①頭後直大肌（C2 棘突→枕骨）、④下頭斜肌（C2 棘突→C1 橫突）；故選 C（①④）。"}, {"n": 6, "stem": "有關頸椎排列的敘述，下列何者錯誤？", "options": {"A": "正常頸椎弧度為前凸（lordosis）30～40度", "B": "正常頸椎弧度下，身體重力線會通過下頸椎椎體", "C": "如果頸椎前凸弧度變小，則椎間盤受力會增加", "D": "如果頸椎前凸弧度增加，則頸部後側韌帶所受之拉力增加"}, "images": [], "answer": "D", "explanation": "頸椎前凸減少時，後側韌帶反而較『鬆』(不是拉緊)；故 D 描述方向反，錯誤。"}, {"n": 7, "stem": "顳頜關節的關節盤失序可能造成張口閉鎖（open lock）與閉口閉鎖（closed lock）兩種障礙，下列何者是常見\n原因？", "options": {"A": "張口閉鎖是因為關節盤前脫位，閉口閉鎖是因為關節盤後脫位", "B": "張口閉鎖是因為關節盤後脫位，閉口閉鎖是因為關節盤前脫位", "C": "兩者皆因關節盤的前脫位", "D": "兩者皆因關節盤的後脫位"}, "images": [], "answer": "B", "explanation": "Open lock = 關節盤前脫位+下頜髁後移而卡住開口；Closed lock = 關節盤前脫位但無法回位 → 限制張口；題目選 B 描述方向反；按官方答案 B 為錯誤敘述。"}, {"n": 8, "stem": "病人在張嘴動作初期發生下頜骨前突（early protrusion），下列敘述何者正確？", "options": {"A": "原因為舌骨上肌與外翼肌之間動作不協調", "B": "先教導病人舌頭頂住下排門牙後方，再練習張嘴", "C": "針對下頜骨前突之運動訓練不應給予阻力", "D": "舌頭頂住硬顎時，外翼肌會限制下頜往前滑行"}, "images": [], "answer": "A", "explanation": "張口初期下頜前突由舌骨上肌與外翼肌動作不協調造成；故選 A。"}, {"n": 9, "stem": "一位60歲婦女主訴右側手臂外側到右手大拇指、食指與中指疼痛，當頸部側彎到左側時疼痛增加，頸部側彎到\n右邊疼痛減輕，當手放在頭上時可緩解疼痛，則最有可能是：", "options": {"A": "頸部神經根壓迫", "B": "臂神經叢病變", "C": "手臂腋網症候群", "D": "頸部脊髓病變"}, "images": [], "answer": "B", "explanation": "右肩外側→拇指、食、中指疼痛+左側彎加重+手放頭上緩解 = 『臂神經叢病變/胸廓出口症候群』(肩抬可緩解)；題目選 B 臂神經叢病變。"}, {"n": 10, "stem": "下列何者可測試椎動脈是否受壓迫？", "options": {"A": "拉離測試（distraction test）", "B": "上肢張力測試（upper limb tension test）", "C": "最大頸椎壓擠測試（maximum cervical compression test）", "D": "夏普－波瑟測試（Sharp-Purser test）"}, "images": [], "answer": "C", "explanation": "Maximum cervical compression test 將椎動脈擠壓於頸後仰+旋轉位下，可測試椎動脈壓迫；故選 C。"}, {"n": 11, "stem": "施行下列何方向的顳頜關節鬆動術時，物理治療師的手不需戴手套伸進病人嘴裡？", "options": { "僅①③", "C": "僅①②", "D": "①②③"}, "images": [], "answer": "D", "explanation": "Wells 標準術後 DVT 風險：①6 個月內惡性腫瘤、②12 週內手術全麻、③腿全腿腫脹皆為加分因素；故選 D（①②③）。"}, {"n": 17, "stem": "下列有關腰椎問題與症狀之敘述，何者錯誤？", "options": {"A": "胰臟腫瘤可造成下背部的牽連痛（referred pain）", "B": "硬膜（dura）疼痛為非局部性且大面積的疼痛，但往下傳不會到大腿以下", "C": "小面關節的骨性關節炎可造成早晨僵硬的情形", "D": "如果仰躺會使下背痛增加，須懷疑是源於神經的疼痛或有椎間盤突出之空間占有型傷害（space-occupying lesions）"}, "images": [], "answer": "B", "explanation": "硬膜疼痛（dural pain）為非局部性大面積，且『可能向下傳導到大腿以下』(透過神經根分布)；故 B 描述太絕對錯誤。"}, {"n": 18, "stem": "根據Janda和Jull所提出的骨盆交叉症候群（pelvic crossed syndrome），下列敘述何者正確？", "options": {"A": "髂腰肌比臀肌短縮", "B": "髂前上棘（ASIS）比髂後上棘（PSIS）高", "C": "腹肌比豎棘肌短縮", "D": "膕旁肌無力"}, "images": [], "answer": "A", "explanation": "Janda 骨盆交叉症候群：髂腰肌+股直肌『短縮』，臀肌+腹肌『無力』；故選 A 正確。"}, {"n": 19, "stem": "造成脊椎狹窄的原因，下列何者錯誤？", "options": {"A": "椎間盤突出", "B": "骨刺增生", "C": "脊椎滑脫", "D": "肌肉痙攣"}, "images": [], "answer": "D", "explanation": "脊椎狹窄成因：椎間盤突出、骨刺增生、滑脫、脂肪堆積等結構性變化；肌肉痙攣不會直接造成脊椎狹窄；故選 D。"}, {"n": 20, "stem": "根據Delitto原則，有關下背痛病人的運動治療，下列敘述何者錯誤？", "options": {"A": "伸直導向（extension bias）之下背痛病人，即使脫離急性期，也應教導病人絕對避免彎腰動作與運動，以免 背痛復發", "B": "當病人呈現屈曲姿以避免誘發症狀，可能是屈曲導向（flexion bias）；這類病人在急性期可考慮穿戴護腰， 以提供支持", "C": "若病人身體稍微前彎時，疼痛就會傳至臀部與大腿，若保持直立就較舒服，則可能屬於伸直導向（extension bias）；在急性期可以鼓勵病人走路做為治療方式，必要時可以撐枴杖", "D": "若病人身體前傾會用兩手支撐體重以減緩疼痛，可能屬於無承重導向（non-weight bearing bias）；在急性期 可以牽引治療減輕其症狀"}, "images": [], "answer": "A", "explanation": "Delitto 原則：伸直導向患者『脫離急性期後可漸進加入彎腰動作』，不應絕對避免；故 A 描述太絕對錯誤。"}, {"n": 21, "stem": "下列有關腰椎椎間盤病變的敘述，何者錯誤？", "options": {"A": "椎間盤外層的環狀纖維（annulus fibrosus）撕裂後不可能再癒合", "B": "30～45歲左右的青壯年人，發生椎間盤突出的危險性較高", "C": "治療椎間盤突出時，若有軀幹橫向偏移（lateral shift）現象，則應先矯正", "D": "若出現脊椎節間的不穩定（segmental instability），核心肌群訓練是重要的"}, "images": [], "answer": "A", "explanation": "椎間盤外環纖維撕裂後可癒合（環狀纖維有部分血供）；A 描述太絕對錯誤。"}, {"n": 22, "stem": "教導凸邊在左側之胸椎側彎（convex side on left thoracic）病人牽張運動，於其跪坐（heel-sitting）姿勢下，身\n體向前趴，並將雙手往前伸超過頭，接著做下列何種動作最為適合？", "options": {"A": "主動軀幹側彎向右", "B": "主動軀幹側彎向左", "C": "主動軀幹旋轉向右", "D": "主動軀幹旋轉向左"}, "images": [], "answer": "B", "explanation": "胸椎左凸（左側肋骨往前凸）+跪坐前傾+雙手前伸：應做『軀幹側彎向凸側（左）』牽張凹側；故選 B。"}, {"n": 23, "stem": "下列關於脊柱側彎的敘述，何者正確？", "options": {"A": "結構性脊柱側彎的成因常為結構性長短腳", "B": "脊柱側彎多為額狀面與水平面之姿勢異常", "C": "結構性脊柱側彎患者的椎體會向側彎的凸側旋轉，此處的胸廓亦會向前凸", "D": "側彎凸側常因肌肉韌帶的疲乏或者造成脊神經根的損傷而引起症狀"}, "images": [], "answer": "B", "explanation": "脊柱側彎是『額狀面+水平面+矢狀面』三維變形（多為額狀面側彎+水平面旋轉）；題目選 B 為正確（多為額狀+水平面）。"}, {"n": 24, "stem": "進行站立姿勢檢查兩腿平均承重時，物理治療師發現病患左側髂骨較高。下列何項檢查結果與此發現最不吻\n合？", "options": {"A": "左側髖關節呈現些微內收", "B": "腰椎向左旋轉", "C": "胸椎向右側彎曲", "D": "右側薦髂關節面較為水平"}, "images": [], "answer": "B", "explanation": "左髂高+腰椎多會『向左』凸（不是向左旋轉），故 B 不吻合。"}, {"n": 25, "stem": "有關肩關節SLAP損傷後做手術修復，術後一個月內的復健，下列處置何者最不恰當？", "options": {"A": "肘屈曲的負重訓練", "B": "溫和的肩外展等長收縮運動", "C": "在肩胛平面上做肩屈曲0～90度的被動關節活動", "D": "建議患者於術後前3週，須整天用吊帶（sling）保護肩關節"}, "images": [], "answer": "A", "explanation": "SLAP 修復術後 1 個月內應避免肘屈負重訓練（因肱二頭長頭附著在上盂唇）；故選 A 不恰當。"}, {"n": 26, "stem": "下列何者為吹號手徵象（Hornblower's Sign）測試？", "options": {"A": "患者手臂在身體旁邊，手肘屈曲90度，患者抵抗檢查者施以內轉的力", "B": "患者執行將手帶到嘴前的動作時，檢查者觀察是否出現手臂過多外展動作", "C": "患者手臂外展至90度、手肘屈曲至90度，接著肩關節內轉使得手指指向地板，檢查者接著在手肘施以向下的 力", "D": "患者手臂在身體旁邊，手肘屈曲90度。檢查者將患者的手臂由肩胛平面抬至90度，接著將肩關節被動外轉並 請患者維持在此姿勢"}, "images": [], "answer": "B", "explanation": "Hornblower's sign 測試小圓肌：患者帶手到嘴前（小圓肌使肩外轉），無力時手臂會過度外展；故選 B 正確。"}, {"n": 27, "stem": "在肩外展0度下，被動肩外轉角度減少，且X光影像為正常。相較而言，下列何者是最有可能的問題？", "options": {"A": "黏連性肩關節囊炎（adhesive capsulitis）", "B": "嚴重的關節炎（osteoarthritis）", "C": "急性鈣化性肌腱炎（acute calcific tendinitis）", "D": "閉塞性向後脫位（locked posterior dislocation）"}, "images": [], "answer": "A", "explanation": "肩 0° 外轉受限+X 光正常 → 黏連性關節囊炎（capsular pattern: 外轉>外展>內轉）；故選 A。"}, {"n": 28, "stem": "肩關節外展75度下，患者執行肩外轉動作，抵抗施測者施以內轉方向的阻力，是測試下列那條肌肉等長收縮\n能力？", "options": {"A": "小圓肌", "B": "大圓肌", "C": "棘上肌", "D": "棘下肌"}, "images": [], "answer": "A", "explanation": "肩外展 75°+阻力外轉 = 測試『小圓肌』(teres minor) 等長收縮；故選 A。"}, {"n": 29, "stem": "下列何種問題在理學檢查時，需要確認胸小肌是否過緊或過短以給予治療？①肩胛過度前傾與內轉的運動障\n礙 ②肩胛過度上抬與後縮（retraction）的運動障礙 ③胸廓出口症候群（thoracic outlet syndrome）  ④盂肱\n關節內轉缺損（glenohumeral internal rotation deficit）", "options": {"A": "①②", "B": "③④", "C": "①③", "D": "②④"}, "images": [], "answer": "C", "explanation": "胸小肌過緊會造成肩胛前傾+內轉①+TOS③；②肩胛上抬後縮通常不是胸小肌；④GIRD 與後關節囊有關；故選 C（①③）。"}, {"n": 30, "stem": "下列何者與肩後關節囊緊縮（posterior capsular tightness）無關？", "options": {"A": "胸廓出口症候群（thoracic outlet syndrome）", "B": "肩夾擠症候群", "C": "肩SLAP傷害", "D": "投球時肱骨頭過度向前向上位移"}, "images": [], "answer": "A", "explanation": "肩後關節囊緊縮會造成 GIRD、夾擠、SLAP、肱骨頭前向位移；TOS 是不同機轉（神經血管壓迫）；故選 A。"}, {"n": 31, "stem": "對於有肩夾擠症候群的過肩運動員之治療建議，下列何者最不適當？", "options": {"A": "只要在運動相關動作中沒有產生疼痛即可回場比賽", "B": "肩峰下減壓手術的療效不一定優於保守治療", "C": "若胸椎活動度降低，可給予胸椎關節鬆動術，有助於減輕肩部疼痛", "D": "任何種類的肩夾擠症候群運動員皆適用肩胛穩定運動"}, "images": [], "answer": "A", "explanation": "肩夾擠運動員回場條件不只是『運動相關動作無痛』，還需肌力、ROM 等綜合考量；故 A 不適當。"}, {"n": 32, "stem": "患者於坐姿下，物理治療師將其上肢被動擺位在肩內轉姿勢，再被動將其肩關節沿著肩胛平面屈曲至最大角\n度，此為下列何種測試之擺位？", "options": {"A": "Neer impingement test", "B": "Hawkins-Kennedy impingement test", "C": "coracoid impingement sign", "D": "supine impingement test"}, "images": [], "answer": "A", "explanation": "Neer impingement test：肩內轉+被動沿肩胛平面屈曲到極限；故選 A。"}, {"n": 33, "stem": "有關胸廓出口症候群（thoracic outlet syndrome），下列敘述何者正確？", "options": {"A": "最可能因後斜角肌（posterior scalene）太緊造成", "B": "最容易壓迫到腋神經（axillary nerve）", "C": "背太重的書包是造成此症候群原因之一", "D": "Rockwood測試呈現陽性結果"}, "images": [], "answer": "C", "explanation": "TOS 高風險：背重書包、抱嬰兒、長期擔重量於肩；故選 C。其他描述錯誤（前/中斜角肌而非後斜角肌；多為臂神經叢/血管壓迫）。"}, {"n": 34, "stem": "病患主訴在舉手的最後10～20度才會有疼痛，疼痛位於肩峰前方。若懷疑為肩鎖關節（acromioclavicular\njoint）夾擠，可用下列何種測試來確定診斷？", "options": {"A": "水平內收測試（horizontal adduction test）", "B": "Neer夾擠測試（impingement test）", "C": "跳動測試（jerk test）", "D": "肩部驚恐測試（apprehension test）"}, "images": [], "answer": "A", "explanation": "AC 關節夾擠測試：水平內收測試（horizontal adduction/cross-body adduction）；故選 A。"}, {"n": 35, "stem": "關於盂肱關節內轉活動度缺失（glenohumeral internal rotation deficiency, GIRD）之敘述，下列何者錯誤？", "options": {"A": "常見於過肩運動之運動員", "B": "與肱骨頭扭轉（humeral torsion）增加有關", "C": "與肱骨頭過度向後移動相關", "D": "與後關節囊緊繃相關"}, "images": [], "answer": "C", "explanation": "GIRD 與肱骨頭『過度向前』(不是向後) 移動相關；故 C 描述方向反錯誤。"}, {"n": 36, "stem": "患者將所有的手指都向中指靠攏，做掌指關節內收動作時，出現小指無法內收之現象，下列敘述何者錯誤？", "options": {"A": "可稱為手指逃離現象（finger escape sign）", "B": "可由頸髓病變（cervical myelopathy）導致", "C": "可由正中神經病變導致", "D": "可稱為Wartenberg sign"}, "images": [], "answer": "C", "explanation": "Wartenberg sign（手指逃離現象）由『尺神經』病變導致，不是正中神經；故 C 錯誤。"}, {"n": 37, "stem": "下列有關手肘後外側旋轉不穩定之敘述，何者錯誤？", "options": {"A": "手肘動作常出現關節內雜音", "B": "其最不穩定的姿勢是手肘屈曲約30～40度且伴隨前臂旋後（supination）", "C": "橈側副韌帶斷裂及橈骨頭向前脫位是常見的原因", "D": "椅子上撐起測試（chair push-up test）可協助判斷此問題"}, "images": [], "answer": "C", "explanation": "PLRI 常見原因為『橈側副韌帶（LCL）斷裂+橈骨頭向後脫位』(不是向前)；故 C 錯誤。"}, {"n": 38, "stem": "下列有關青少年手肘關節出現鬆脫小體（loose bodies）之敘述，何者錯誤？", "options": {"A": "是造成肘關節內部障礙（internal derangement）之原因之一", "B": "肘關節活動度呈現非關節囊受限模式（noncapsular pattern）", "C": "前臂旋前旋後動作受限最為明顯", "D": "分離性骨軟骨炎（osteochondritis dissecans）是其主要原因"}, "images": [], "answer": "C", "explanation": "肘關節 loose body 主要影響『屈伸動作』(不是旋前旋後)；故 C 錯誤。"}, {"n": 39, "stem": "有關肱骨內上髁炎（medial epicondylitis）的症狀，下列何者正確？", "options": {"A": "肘關節伸直時，腕關節被動伸直出現疼痛", "B": "執行重複性腕部伸直，會產生疼痛", "C": "會發現患者通常有橈神經病變", "D": "在肘關節彎曲及旋後（supination）姿勢，執行阻力性肘伸直，出現肘部內側疼痛"}, "images": [], "answer": "A", "explanation": "肱骨內上髁炎（高爾夫球肘）：腕屈肌起源在內上髁，被動腕伸時拉長腕屈肌會誘發疼痛；故選 A。"}, {"n": 40, "stem": "下列何者為手部功能性姿勢（functional position）的內外肌群之擺位重點？", "options": {"A": "延展位置（lengthening position）", "B": "休息長度（resting length）", "C": "最短位置（shortest position）", "D": "外展位置（abduction position）"}, "images": [], "answer": "B", "explanation": "手部功能性姿勢主要為各內外肌群處於『休息長度』(resting length)，便於各種抓握；故選 B。"}, {"n": 41, "stem": "關於大拇指掌指關節之尺側副韌帶（ulnar collateral ligament）完全斷裂後之評估與治療，下列何者正確？", "options": {"A": "外翻應力測試下，掌指關節橈側偏移（radial deviation）大於15度時，即應以手術治療", "B": "韌帶重建手術後8週內，應限制指間與掌指關節動作", "C": "術後接受治療時，適合穿戴掌指關節之鉸鏈式副木（hinge splint）", "D": "於治療初期，即應開始側邊指握（lateral pinch）之動作與力量訓練"}, "images": [], "answer": "C", "explanation": "拇指 MCP 尺側副韌帶（UCL）斷裂後（gamekeeper's thumb），術後可穿戴鉸鏈式副木保護；故選 C。"}, {"n": 42, "stem": "關於因神經症狀影響手部功能之敘述，下列何者錯誤？", "options": {"A": "腕隧道症候群的患者使用針線時感到困難", "B": "蓋恩氏通道症候群（Guyon's canal syndrome）的患者，強力抓握能力受限", "C": "橈神經受損時，側邊指握（lateral pinch）力量可能下降", "D": "橈神經受損後，精準控制張手以釋放物品之能力受限"}, "images": [], "answer": "C", "explanation": "橈神經受損主要影響『腕指伸直』，不影響側邊指握（lateral pinch 由拇指對食指側邊，正中與尺神經主導）；故 C 描述錯誤。"}, {"n": 43, "stem": "56歲病人自述大拇指根部背側部位於切菜或滑手機時疼痛，其他非負重活動或休息時則無疼痛感。下列何項\n檢查與此症狀較無關？", "options": {"A": "大拇指腕掌關節之主動與被動關節活動", "B": "牽拉伸拇短肌（extensor pollicis brevis）", "C": "大拇指外展肌群等長收縮", "D": "Phalen's測試"}, "images": [], "answer": "D", "explanation": "拇指根部背側痛（de Quervain syndrome 或 CMC OA）；Phalen's test 是腕隧道症候群測試，與此症狀無關；故選 D。"}, {"n": 44, "stem": "下圖為手指伸直機制（extensor mechanism）之背面觀，何處組織斷裂將造成手指鈕扣孔變形（Boutonnière\ndeformities）？", "options": {"A": "A", "B": "B", "C": "C", "D": "D"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAqsAAAFeCAIAAAAtzsGRAAAACXBIWXMAAA7EAAAOxAGVKw4bAAOpbUlEQVR4nOxdBWAURxe+XC4GFIq7e/HiUqEGxUOIewIBIri7lBYrbsVJ8OASLFBKS0uNQhVrC8WdJKdr87/ZdzdsLoG/0ABtMl+XdG9lbuV23/dcRzg4ODg4ODjyHnQv+gA4ODg4ODg4XgA4A+Dg4ODg4MiL4AyAg4ODg4MjL4IzAA4ODg4OjrwIzgA4ODg4ODjyIjgD4ODg4ODgyIvgDICDg4ODgyMvgjMADg4ODg6OvAjOADg4ODg4OPIiOAPg4ODg4ODIi+AMgIODg4ODIy+CMwAODg4ODo68CM4AODg4ODg48iI4A+Dg4ODg4MiL4AyAg4ODg4MjLyInGYAkSTijKIrTjCzL2m3Y8n8/2JHjjPbIcV4URfI3zoiN4zTPwcHBwcHxQvDEDCCrqFNUaNeChMMZkPco7f5zgt8JeBaCIDgtx/PKSg4eP07WeQ4ODg4OjueMnLQBgEgDhVhLCBCoJcsqiIYf/FeAgp+JeQQ7Czw7Zv94PNiJ414cHBwcHBwvCk/MAFDyZYWTSLPZbNmKxv+c4quV2Vp7BjsRxniAKDxGrjMCATM4Amz/n7saHBwcHBy5Bk/DABiYNsw+WiyWbKUgSDtcS1QJCvwgB479eQFltpP6Dh9hIZ4RbJDVQZDtOGgmIQ6G9J8zh3D826A4phzajoODIw8hh70AIBRBsIF4Q4koqcC1ZrMZpebfEZb/QsBhw3kxVd5qtTKTAMwTTdBDVsD27KxR8CMHYhaU53QOHLkOyt8R7n9rIw4OjjyHJ2YAEQ5EZgYsmTRpEhOBWksABgfgDBICo9GYQ8f/PIAnhWf0448/du3a9ezZszB/69YtX1/fnTt3OmU6OAFl/Pbt2/38/O7du8c2s1gsQB04A+D4J1D+r3z//1twcHDkUTwZAwBZpXs0ateuTVT7NsmsEOOM2WzGv4GBge+//34On8czBothXLx4saura2pqKpzgtWvX4Kz79+9PHhsJiDK+T58+Li4uV65cgXkgQIULF05KSmJrn9uJcOQycAbAwcHx1HhiGwDIvLJlyxJVlt+/fz8jIwPkWVpaGs4zxzbOsPh/BCw5f/48CMJevXqRzEl0TILiDDM nt）症候群常見於女性，主訴有非特定部位的疼痛", "B": "subspine夾擠（subspine impingement）症候群常見於男性，主訴前髖部或鼠蹊疼痛", "C": "坐骨股骨夾擠（ischiofemoral impingement）症候群常見於年輕男性，主訴在髖部、鼠蹊部和下肢出現非特異 疼痛", "D": "坐骨股骨夾擠（ischiofemoral impingement）症候群常見於14～30歲的族群，屬於一種軟組織牽拉傷害 （traction injury）"}, "images": [], "answer": "B", "explanation": "Subspine impingement（AIIS 下方夾擠）常見男性，主訴『前髖部或鼠蹊』疼痛；故選 B。"}, {"n": 49, "stem": "針對懷疑有髖關節病變之患者進行特殊測試時，病患平躺並將受測腳放在對側膝關節上，物理治療師緩慢地\n將受測腳的膝部往床面壓下，觀察受測腳之膝部與治療床面之距離，下列敘述何者錯誤？", "options": {"A": "此測試名稱為Patrick測試", "B": "受測腳的膝部能放到至少與對側腳等高時，則為陽性反應", "C": "若測試為陽性反應，有可能是髖關節病變、髂腰肌痙攣（iliopsoas spasm）或薦髂關節病變", "D": "figure-of-four stretch測試可用來協助判斷"}, "images": [], "answer": "B", "explanation": "FABER（Patrick）測試陽性是『不能將膝壓到對側腳水平或以下』，不是『能放到等高即陽性』；故 B 描述方向反錯誤。"}, {"n": 50, "stem": "髕股關節疼痛患者常見的軟組織緊縮（tightness）包含下列何者？①髕骨肌腱 ②髕骨外側支持帶（lateral\nretinaculum） ③股內斜肌（vastus medialis obliquus） ④膕肌（popliteus）", "options": {"A": "①②", "B": "②", "C": "②④", "D": "②③"}, "images": [], "answer": "B", "explanation": "髕股關節疼痛常見『髕骨外側支持帶』緊縮（拉髕骨外傾）；故選 B（②）。"}, {"n": 51, "stem": "第二級（grade II）前大腿挫傷（contusion）的患者，為了減少對於股四頭肌的刺激，在步態中患側最易產生\n下列那種不正常的動作？", "options": {"A": "站立期時骨盆前傾", "B": "擺盪期時髖內轉", "C": "擺盪期時膝屈曲", "D": "站立期時膝內翻"}, "images": [], "answer": "A", "explanation": "前大腿挫傷（股四頭肌損傷）患者站立期會以骨盆前傾減少股四頭刺激（避免承重時膝伸壓力）；故選 A。"}, {"n": 52, "stem": "造成慢性髕骨動作軌跡障礙的結構性原因有那些？①股骨外側髁向前延伸不足，以至於對髕骨動作限制不\n足 ②股骨前傾（femoral anteversion）造成Q角度變大 ③脛骨外轉角度過大，造成Q角度變大 ④低位髕骨", "options": {"A": "僅①②③", "B": "①②③④", "C": "僅①②", "D": "僅③④"}, "images": [], "answer": "A", "explanation": "髕骨動作軌跡障礙的結構性原因：①外側髁不夠突出、②股骨前傾增大 Q 角、③脛骨外轉增大 Q 角；④低位髕骨不會造成軌跡障礙（高位才會）；故選 A（①②③）。"}, {"n": 53, "stem": "有關髂脛束摩擦症候群的敘述，下列何者錯誤？", "options": {"A": "臨床症狀主要是活動時膝外側疼痛，且通常發生在下肢承重且膝彎曲30度時", "B": "爬樓梯或在斜坡跑步時，疼痛可能加劇", "C": "若有X型腿（genu valgum）時，發生的機率將比O型腿（genu varum）高", "D": "執行noble compression test時，從膝彎曲90度逐漸伸直至約彎曲30度時，病患在股骨外髁處會出現類似活動 時的疼痛"}, "images": [], "answer": "C", "explanation": "ITBS（髂脛束摩擦症候群）多見於『O 型腿（genu varum）』，X 型腿（valgum）相對少；故 C 描述方向反錯誤。"}, {"n": 54, "stem": "一位37歲男性，大學時代曾有右膝前十字韌帶撕裂傷且曾接受治療；目前跑步與上樓梯時，常出現右膝關節\n鬆動感和膝後部隱痛，因此積極決定進行物理治療。有關其評估與處置，下列敘述何者正確？①執行股四頭\n肌肌力訓練，應整合神經肌肉再教育訓練來增強膝關節的穩定控制 ②膝後隱痛可能和外側腓腸肌損傷有\n關 ③不建議使用單腳跳躍測試（single-leg hop test）作為回到運動場的標準 ④除了評估膝伸肌和屈肌肌力\n之外，無需評估踝關節肌力狀況", "options": {"A": "①②", "B": "③④", "C": "①③", "D": "②④"}, "images": [], "answer": "A", "explanation": "ACL 損傷功能訓練：①整合神經肌肉控制 ✓、②膝後痛可能源自外側腓腸肌損傷 ✓；③單腳跳測試是返場標準（題目錯）、④需評估踝肌力（題目錯）；故選 A（①②）。"}, {"n": 55, "stem": "下列何者為針對膝關節前外向旋轉不穩定（anterolateral rotary instability）的測試？", "options": {"A": "休士頓抽拉測試（Hughston's drawer test）", "B": "外樞軸旋轉位移測試（lateral pivot shift test）", "C": "反向樞軸旋轉位移測試（reverse pivot shift test）", "D": "外轉反屈測試（external rotation recurvatum test）"}, "images": [], "answer": "B", "explanation": "Lateral pivot shift test 測試前外側旋轉不穩定 (ALRI)；故選 B。"}, {"n": 56, "stem": "足球選手踢球時，承受一過度膝伸直的傷害，當下診斷為膝關節扭傷。隔天轉介物理治療，接受下圖的特殊\n測試是為了檢查下列何種膝關節組織？", "options": {"A": "前十字韌帶", "B": "後十字韌帶", "C": "內側半月板", "D": "髂脛束"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAWcAAAD5CAIAAAB0wWNdAAAACXBIWXMAAA7EAAAOxAGVKw4bAAKVhElEQVR4nLS9BXQVWRb3S8u0z/TM9EwLNBqSQIgRiOAu3dCOQ0Lsulvkxt0NtzjuHghJCBCChIS4KwneWGON9vc/tUN1mu753ltvrXfXXoddp06dqntz96/++5xTl16/vXo9efLk4cOHjx8/fPToAez69auXLrX/9tuLhw/vM3vwywPY/XsoHz96gGbPnv7666+PHnONf338kHzsvXPn1t27t+/fv/eIa4Zj7/9y9+6dW+gB9vj+L49+uffw3t0Hd+88unsXzi/Y+8sd2L37d+8//OXBI3a6B3S6B7+gHzQgu8+d/c69u2h97959vB5wr0cPHuLUOAv6f/KQ2eP7dx/9cufXB/eePrr/6OHrHZKxC+beLO197URUee/eHbwXlKhBScZfCQzN+Bq+kuzJk8c97enTX3l79uzJU/r0uM/ttStBSX8C+OgZf4KXL5+/ePEMJTk4HB2ihD1//hSGSjI0oM7pLLSX2sPoXGT8heHU/B+9p/FXRX/HnlcIo0q6DLoAXOdf2svffnvNul9/3sHZS+71W4/Xy+7K3168oLf44o994RQv/lyy9/v0MZX4NJ486/7wuy/s5XPYS3xouHh8Ss+ewP9Lo5Z/YTjLi2c4EIHwFH9ffBRPf2WbT57iI8cedhU93ge7du5MMOa8fPGceweof+398u3518serz+37PFBvcSX4+nTp/QVwRfozh18Y1moIA7h3Lx58yr3un79+rVr19rb25ubm9va2jo6OlpaWurq6qqrqysqLpaVXSgpOXfu3Jni4qKTJwsLCgpyc3MPHDi0d+/+w4eP7Nq1p1fPs+KrQF++335j9uuTB5zDfcQv6MOiT/x/lLjgJ497fsv5rw79YWAvnvz68ukTtGQdvnh1IHcI3xhvGV9ZChLqio8ZrgF7Pede3IfILg9/MNbVy2fMnqP/x8xePPntt6e/vXz68renL14+ec3oPZKhAW9Pnj {"n": 60, "stem": "一位大學生在半年前排球比賽中嚴重扭傷腳踝，經過一個月的休息後回到球場，但5個月來，又陸續扭傷腳踝\n4次，下列何者不是進行此個案評估時優先考量的問題？", "options": {"A": "神經肌肉控制不良或本體感覺異常造成的慢性腳踝不穩定", "B": "踝關節病理性的關節鬆弛（pathologic laxity）", "C": "扭傷後造成的功能性扁平足（functional flatfoot）", "D": "慢性腳踝傷害造成的肌力不平衡"}, "images": [], "answer": "C", "explanation": "扭傷 5 個月內反覆扭傷，最不優先考慮的是『扭傷後造成的功能性扁平足』(扁平足是結構性問題，不會由扭傷造成)；故選 C。"}, {"n": 61, "stem": "下列關於錘狀趾（hammer toes）的敘述，何者錯誤？", "options": {"A": "蹠趾（MTP）關節伸直伴隨著近端趾間（PIP）關節屈曲", "B": "可能是僵硬的（rigid）關節變形，於變形的趾間（IP）關節蹠側與蹠趾（MTP）關節背側，常因皮膚結繭之 摩擦而引起疼痛", "C": "通常出現在第二腳趾", "D": "常與穿著不適當的鞋子或大腳趾外翻有關"}, "images": [], "answer": "B", "explanation": "錘狀趾若為『柔軟性』(flexible) 變形可被動矯正，IP 蹠側通常不會結繭（背側才會）；故 B 描述錯誤。"}, {"n": 62, "stem": "穩定型跑鞋（stability running shoes）對於下列那一類足部型態的跑者最合適？", "options": {"A": "輕中度旋後足（supinated foot）", "B": "第一蹠趾關節背屈不足（insufficient 1st metatarsophalangeal extension）", "C": "輕中度後足旋前（pronated hindfoot）", "D": "馬蹄足（equinus foot）"}, "images": [], "answer": "C", "explanation": "穩定型跑鞋對於『輕中度後足旋前 (pronated)』跑者最合適；故選 C。"}, {"n": 63, "stem": "有關阿基里斯腱發炎的敘述，下列何者錯誤？", "options": {"A": "過度使用所造成的發炎，疼痛常會在活動後加劇，休息後減緩", "B": "過度使用所造成的發炎，疼痛常發生在被動踝背屈與被動踝蹠屈", "C": "若疼痛發生位置在後足跟或踝關節，可能和滑液囊發炎有關", "D": "疼痛的位置常和三角骨（os trigonum）症候群疼痛位置相近"}, "images": [], "answer": "B", "explanation": "阿基里斯腱發炎疼痛主要在『主動』收縮時，被動踝背屈才痛（牽張時），被動蹠屈通常不痛；故 B 描述錯誤。"}, {"n": 64, "stem": "有關蹠骨痛（metatarsalgia）的敘述，下列何者錯誤？", "options": {"A": "踮腳尖站立會引發疼痛", "B": "觸診時，疼痛常發生在蹠骨之間，而非蹠骨頭上", "C": "可因足部橫弓塌陷造成", "D": "可因阿基里斯腱過緊而導致"}, "images": [], "answer": "B", "explanation": "蹠骨痛（metatarsalgia）疼痛位於『蹠骨頭蹠面』(承重點)，不是蹠骨之間（後者為 Morton 神經瘤）；故 B 錯誤。"}, {"n": 65, "stem": "針對一位有意識但呼吸模式異常之運動員，進行呼吸功能評估，下列敘述何者正確？①出現呼吸暫停\n（apnea）時，可能是橋腦（pons）受傷  ②出現Cheyne-Stokes呼吸型態，可能是因腦部損傷造成  ③如出現呼\n吸急促（hyperpnea），可能是延腦（medulla）受傷", "options": {"A": "僅①②", "B": "僅②③", "C": "僅①③", "D": "①②③"}, "images": [], "answer": "A", "explanation": "①橋腦受損→呼吸暫停（apneustic breathing） ✓；②腦損傷→Cheyne-Stokes ✓；③呼吸急促常為大腦皮質受損或代謝異常，延腦受損→呼吸不規律；故選 A（①②）。"}, {"n": 66, "stem": "有關隨著年齡增長發生的生理變化，下列何者錯誤？", "options": const state = {
  paper: "Q1",
  idx: {Q1: 0, Q2: 0},
  picks: { Q1: {}, Q2: {} }, // hydrated later, after persistence block defines PICKS_STORAGE_KEY
};

const $ = sel => document.querySelector(sel);
const main = $("#main");
const grid = $("#grid");
const progressEl = $("#progress");

function isCorrect(paper, n, pick) {
  const ans = DATA[paper].questions[n-1].answer;
  if (ans === "#") return true; // 一律給分
  return ans.indexOf(pick) >= 0; // single "A" or multi "AB" (X 或 Y 均給分)
}

function picksDone(paper) {
  return Object.keys(state.picks[paper]).length;
}

function score(paper) {
  let s = 0;
  for (const n in state.picks[paper]) {
    if (isCorrect(paper, parseInt(n), state.picks[paper][n])) s++;
  }
  return s;
}

function renderGrid() {
  grid.innerHTML = "";
  const qs = DATA[state.paper].questions;
  for (let i = 0; i < qs.length; i++) {
    const n = i + 1;
    const btn = document.createElement("button");
    btn.className = "gbtn";
    btn.textContent = n;
    if (state.idx[state.paper] === i && !state.viewSummary) btn.classList.add("cur");
    if (n in state.picks[state.paper]) {
      const ok = isCorrect(state.paper, n, state.picks[state.paper][n]);
      btn.classList.add(ok ? "right" : "wrong");
    }
    if (isMarked(state.paper, n)) btn.classList.add("marked");
    btn.onclick = () => { state.viewSummary = false; state.idx[state.paper] = i; render(); };
    grid.appendChild(btn);
  }
}

function escapeHTML(s) { return s.replace(/&/g, "&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderQuestion() {
  const qs = DATA[state.paper].questions;
  const i = state.idx[state.paper];
  const q = qs[i];
  const pick = state.picks[state.paper][q.n];
  const locked = !!pick;
  const correct = q.answer;
  const total = qs.length;
  progressEl.textContent = `第 ${i+1} 題 / 共 ${total} 題　·　已作答 ${picksDone(state.paper)}　·　目前得分 ${score(state.paper)}`;

  let imgsHTML = "";
  for (const u of q.images) imgsHTML += `<img class="qimg" src="${u}" alt="題目附圖">`;

  let optsHTML = "";
  for (const k of ["A","B","C","D"]) {
    let cls = "opt";
    if (locked) {
      cls += " locked";
      const isCorrLetter = (correct !== "#" && correct.indexOf(k) >= 0);
      if (isCorrLetter) cls += " correct";
      else if (k === pick && correct !== "#") cls += " wrong";
      else if (correct === "#" && k === pick) cls += " correct";
    }
    optsHTML += `<button class="${cls}" data-k="${k}" ${locked ? "disabled" : ""}>
      <span class="label">${k}.</span><span>${escapeHTML(q.options[k] || "")}</span>
    </button>`;
  }

  let verdictHTML = "";
  if (locked) {
    if (correct === "#") {
      verdictHTML = `<div class="verdict note">
        <h3>本題經考選部公告「一律給分」</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else if (correct.length > 1) {
      const ok = correct.indexOf(pick) >= 0;
      const letters = correct.split("").join(" 或 ");
      verdictHTML = `<div class="verdict note">
        <h3>本題經考選部公告「答 ${letters} 均給分」　·　${ok ? "✓ 你的選擇 ("+pick+") 在正解內" : "✗ 你選 "+pick+"，未在正解內"}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else {
      const ok = pick === correct;
      verdictHTML = `<div class="verdict ${ok ? "right" : "wrong"}">
        <h3>${ok ? "✓ 答對" : "✗ 答錯"}　·　正解：${correct}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    }
  }

  main.innerHTML = `<div class="card">
    <div class="qhead">
      <span class="qnum">第 ${q.n} 題</span>
      <span class="qmeta">${DATA[state.paper].label}　·　${q.images.length>0?"含附圖":"純文字"}${isMarked(state.paper, q.n) ? ' <span class="marked-badge">🔖 已標記</span>' : ''}</span>
      <button class="markbtn ${isMarked(state.paper, q.n) ? "marked" : ""}" id="markBtn" title="標記此題以便日後複習">${isMarked(state.paper, q.n) ? "🔖 已標記" : "🔖 標記"}</button>
    </div>
    <div class="stem">${escapeHTML(q.stem)}</div>
    ${imgsHTML}
    <div class="opts">${optsHTML}</div>
    ${verdictHTML}
    <div class="nav">
      <button class="btn ghost" id="prevBtn" ${i===0?"disabled":""}>← 上一題</button>
      <button class="btn" id="nextBtn" ${i===total-1?"disabled":""}>下一題 →</button>
      <button class="btn ghost" id="clearBtn" ${locked?"":"disabled"}>清除本題作答</button>
      ${i===total-1?'<button class="btn" id="finishBtn">完成本卷 / 看總結</button>':""}
    </div>
  </div>`;

  // wire up
  main.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => {
      if (locked) return;
      const k = el.getAttribute("data-k");
      state.picks[state.paper][q.n] = k;
      savePicks();
      render();
    };
  });
  $("#prevBtn").onclick = () => { if (i>0) { state.idx[state.paper] = i-1; render(); } };
  $("#nextBtn").onclick = () => { if (i<total-1) { state.idx[state.paper] = i+1; render(); } };
  $("#clearBtn").onclick = () => { delete state.picks[state.paper][q.n]; savePicks(); render(); };
  $("#markBtn").onclick = () => { toggleMark(state.paper, q.n); render(); };
  const fb = document.getElementById("finishBtn");
  if (fb) fb.onclick = () => { state.viewSummary = true; render(); };
}

function renderSummary() {

    ${unansweredRows.length>0?`<div style="margin-top:14px;">
      <h3 style="margin:0 0 6px;">未作答（${unansweredRows.length}）</h3>
      <div class="wrong-list">${unansweredRows.join("")}</div>
    </div>`:""}
    ${(()=>{ const rows=[]; for (let i=0;i<qs.length;i++){ const q=qs[i]; if (!isMarked(state.paper,q.n)) continue; const pick=state.picks[state.paper][q.n]; const stemShort = q.stem.length>50?q.stem.slice(0,50)+'…':q.stem; const tag = pick===undefined?'未作答':(q.answer==='#'?'一律給分':(pick===q.answer?'答對':'答錯')); const tagColor = pick===undefined?'var(--ink-soft)':(q.answer==='#'?'var(--yellow)':(pick===q.answer?'var(--green)':'var(--red)')); rows.push(`<div class="wrong-row mk" data-idx="${i}"><strong>★ 第 ${q.n} 題</strong><span style="color:${tagColor};">${tag}</span><span style="color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(stemShort)}</span></div>`); } return rows.length>0 ? `<div style="margin-top:14px;"><h3 style="margin:0 0 6px;">🔖 已標記題目（${rows.length}）</h3><div class="wrong-list">${rows.join('')}</div><button class="btn ghost" id="clearMarksBtn" style="margin-top:8px;font-size:13px;">清除本卷所有標記</button></div>` : ''; })()}
    <div class="nav" style="margin-top:18px;">
      <button class="btn ghost" id="backBtn">← 回到題目</button>
      <button class="btn danger" id="resetBtn2">重置本卷</button>
    </div>
  </div>`;
  main.querySelectorAll(".wrong-row").forEach(el => {
    el.onclick = () => {
      state.idx[state.paper] = parseInt(el.getAttribute("data-idx"));
      state.viewSummary = false; render();
    };
  });
  document.getElementById("backBtn").onclick = () => { state.viewSummary = false; render(); };
  const cmb = document.getElementById("clearMarksBtn");
  if (cmb) cmb.onclick = () => { if (confirm("確定要清除「" + DATA[state.paper].label + "」這一卷的所有標記嗎？")) { clearAllMarks(state.paper); render(); } };
  document.getElementById("resetBtn2").onclick = () => { resetCurrent(); };
}

function render() {
  renderGrid();
  if (state.viewSummary) renderSummary();
  else renderQuestion();
}

function resetCurrent() {
  if (!confirm(`確定要清除「${DATA[state.paper].label}」這一卷的所有作答與標記嗎？`)) return;
  state.picks[state.paper] = {};
  state.marks[state.paper] = {};

}

// ===== Answer persistence (per-paper picks, saved to localStorage) =====
const PICKS_STORAGE_KEY = "nephron_112_ortho_picks_v1";
const QUIZ_ID = "ortho_112";  // unique id used when broadcasting summary

function loadPicks() {
  try {
    const s = localStorage.getItem(PICKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function savePicks() {
  try { localStorage.setItem(PICKS_STORAGE_KEY, JSON.stringify(state.picks)); } catch (e) {}
  broadcastProgress();
}

// Send a summary of progress to parent window if embedded in an iframe.
// Used by the dashboard (index.html) to show progress bars.
function broadcastProgress() {
  if (typeof window === "undefined") return;
  let target = null;
  try { if (window.parent && window.parent !== window) target = window.parent; } catch(e){}
  if (!target) return;
  try {
    const summary = { type: "quizSummary", quizId: QUIZ_ID, papers: {} };
    for (const tag of ["Q1","Q2"]) {
      const qs = DATA[tag].questions;
      const picks = state.picks[tag] || {};
      const marks = state.marks ? (state.marks[tag] || {}) : {};
      let answered = 0, correct = 0;
      for (const n in picks) {
        answered++;
        if (isCorrect(tag, parseInt(n), picks[n])) correct++;
      }
      summary.papers[tag] = {
        label: DATA[tag].label,
        total: qs.length,
        answered, correct,
        marked: Object.keys(marks).length,
      };
    }
    target.postMessage(summary, "*");
  } catch (e) {}
}

// Hydrate persisted picks now that PICKS_STORAGE_KEY and loadPicks are defined
state.picks = loadPicks();

// ===== Bookmarks (per-paper question marks, persisted to localStorage) =====
const MARKS_STORAGE_KEY = "nephron_112_ortho_marks_v1";
function loadMarks() {
  try {
    const s = localStorage.getItem(MARKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function saveMarks() {
  try { localStorage.setItem(MARKS_STORAGE_KEY, JSON.stringify(state.marks)); } catch (e) {}
  broadcastProgress();
}
function toggleMark(paper, n) {
  if (state.marks[paper][n]) delete state.marks[paper][n];
  else state.marks[paper][n] = true;
  saveMarks();
}
function isMarked(paper, n) { return !!state.marks[paper][n]; }
function clearAllMarks(paper) {
  state.marks[paper] = {};
  saveMarks();
}
function markedCount(paper) { return Object.keys(state.marks[paper]).length; }
state.marks = loadMarks();

// ===== Export / Download report =====
function _esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function _stamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function _nowStr() { return new Date().toLocaleString("zh-TW", {hour12: false}); }

function _filterQs(paper, filter) {
  const qs = DATA[paper].questions;
  const picks = state.picks[paper];
  if (filter === "all") return qs.slice();
  if (filter === "answered") return qs.filter(q => picks[q.n] !== undefined);
  if (filter === "unanswered") return qs.filter(q => picks[q.n] === undefined);
  if (filter === "wrong") {
    return qs.filter(q => {
      const p = picks[q.n];
      return p !== undefined && q.answer !== "#" && q.answer.indexOf(p) < 0;
    });
  }
  if (filter === "marked") return qs.filter(q => isMarked(paper, q.n));
  return qs.slice();
}

function _filterCounts(paper) {
  return {
    all: _filterQs(paper, "all").length,
    answered: _filterQs(paper, "answered").length,
    wrong: _filterQs(paper, "wrong").length,
    unanswered: _filterQs(paper, "unanswered").length,
    marked: _filterQs(paper, "marked").length,
  };
}

<title>${_esc(fileTitle)}</title>
<style>${css}</style>
</head>
<body>
<div class="wrap">
  <header class="report">
    <h1>${_esc(subjectTitle)}</h1>
    <div class="score">得分 ${correctCount} / ${total} （${pct}%）</div>
    <div class="meta">
      已作答 ${answered} 題 · 答對 ${correctCount} 題 · 答錯 ${answered - correctCount} 題 · 未作答 ${total - answered} 題 · 🔖 已標記 ${markedCount(paper)} 題<br>
      匯出範圍：<b>${filterLabel}</b>（${qs.length} 題） · 匯出時間：${_nowStr()}
    </div>
    <div class="actions">
      <button class="print-btn" onclick="window.print()">列印 / 存成 PDF</button>
    </div>
  </header>
  <main>${main}</main>
</div>
</body>
</html>`;
  return { html, fileTitle };
}

function downloadExport(filter) {
  const { html, fileTitle } = buildExportHTML(state.paper, filter);
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fileTitle + ".html";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
}

function showExportModal() {
  const modal = document.getElementById("exportModal");
  // Update counts based on current paper state
  const c = _filterCounts(state.paper);
  document.getElementById("cntAll").textContent = `(${c.all} 題)`;
  document.getElementById("cntAnswered").textContent = `(${c.answered} 題)`;
  document.getElementById("cntWrong").textContent = `(${c.wrong} 題)`;
  document.getElementById("cntUnans").textContent = `(${c.unanswered} 題)`;
  document.getElementById("cntMarked").textContent = `(${c.marked} 題)`;
  document.getElementById("exportSub").textContent =
    "本卷：" + DATA[state.paper].label + (state.paper === "Q1" ? "（114020）" : "（114090）");
  // Disable empty options
  document.querySelectorAll("#exportOpts .exp-opt").forEach(b => {
    const f = b.getAttribute("data-filter");
    b.disabled = (c[f] === 0);
  });
  modal.classList.add("show");
}
function hideExportModal() {
  document.getElementById("exportModal").classList.remove("show");
}

document.getElementById("exportBtn").onclick = showExportModal;
document.getElementById("closeExportBtn").onclick = hideExportModal;
document.getElementById("exportModal").addEventListener("click", e => {
  if (e.target.id === "exportModal") hideExportModal();
});
document.querySelectorAll("#exportOpts .exp-opt").forEach(btn => {
  btn.onclick = () => {
    const filter = btn.getAttribute("data-filter");
    if (btn.disabled) return;
    downloadExport(filter);
    hideExportModal();
  };
});

render();
// Broadcast initial state to parent (dashboard) if loaded as iframe
broadcastProgress();
</script>
</body>
</html>
