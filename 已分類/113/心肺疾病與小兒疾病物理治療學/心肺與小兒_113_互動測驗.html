<title>心肺疾病與小兒疾病物理治療學 — 114 年互動測驗</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --ink: #1f2933;
    --ink-soft: #52606d;
    --line: #e4e7eb;
    --primary: #1d6f9b;
    --primary-soft: #e6f1f7;
    --green: #2f9e44;
    --green-soft: #d3f9d8;
    --red: #c92a2a;
    --red-soft: #ffe3e3;
    --yellow: #d9a700;
    --yellow-soft: #fff4c2;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei",
                 "Noto Sans TC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
    font-size: 16px;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 14px 22px;
    position: sticky; top: 0; z-index: 10;
  }
  .h-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    background: #f1f3f5; border: 1px solid var(--line); color: var(--ink-soft);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .progress { color: var(--ink-soft); font-size: 14px; margin-left: auto; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 22px; max-width: 1400px; margin: 18px auto; padding: 0 22px; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; padding: 0 14px; } .sidebar { order: 2; position: static; } }
  .sidebar {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; height: fit-content; position: sticky; top: 78px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
  }
  .gbtn {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
    color: var(--ink-soft); font-size: 13px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .gbtn:hover { border-color: var(--primary); }
  .gbtn.cur { background: var(--primary); color: #fff; border-color: var(--primary); }
  .gbtn.right { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .gbtn.wrong { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .legend { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 4px; border: 1px solid var(--line); }
  .dot.r { background: var(--green-soft); border-color: var(--green); }
  .dot.w { background: var(--red-soft); border-color: var(--red); }
  .main { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .qhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .qnum { font-size: 22px; font-weight: 700; color: var(--primary); }
  .qmeta { color: var(--ink-soft); font-size: 13px; }
  .stem { font-size: 16px; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
  .qimg { display: block; max-width: 100%; max-height: 480px; margin: 8px 0; border: 1px solid var(--line); border-radius: 6px; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    transition: background .12s, border-color .12s;
    text-align: left;
    font-size: 15.5px;
    color: var(--ink);
  }
  .opt:hover:not(.locked) { background: var(--primary-soft); border-color: var(--primary); }
  .opt.locked { cursor: default; }
  .opt .label { font-weight: 700; min-width: 22px; }
  .opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .opt.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .verdict { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 14px; line-height: 1.7; }
  .verdict.right { background: var(--green-soft); color: #186b29; }
  .verdict.wrong { background: var(--red-soft); color: #861818; }
  .verdict.note { background: var(--yellow-soft); color: #6b4e00; }
  .verdict h3 { margin: 0 0 6px; font-size: 14px; }
  .nav { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    background: var(--primary); color: #fff; border: 0; padding: 9px 18px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: #fff; color: var(--red); border: 1px solid var(--red); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .summary { padding: 18px; }
  .summary h2 { margin: 0 0 8px; }
  .score { font-size: 32px; font-weight: 700; color: var(--primary); }
  .wrong-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .wrong-row { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .wrong-row:hover { background: var(--primary-soft); }
  .footer { color: var(--ink-soft); font-size: 12px; text-align: center; margin: 16px 0 30px; }

  .homelink { color: var(--soft); text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .homelink:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }


  /* Export modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,30,.45); display: none; align-items: center; justify-content: center; z-index: 100; padding: 18px; }
  .modal-bg.show { display: flex; }
  .modal-card { background: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.18); max-width: 460px; width: 100%; padding: 22px; }
  .modal-card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 700; }
  .modal-card .modal-sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; }
  .modal-card .opt-row { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
  .modal-card .exp-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; background: #f8f9fa; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left; color: var(--ink); }
  .modal-card .exp-opt:hover { background: var(--primary-soft); border-color: var(--primary); }
  .modal-card .exp-opt:disabled { opacity: 0.5; cursor: not-allowed; background: #f1f3f5; }
  .modal-card .exp-opt .count { color: var(--ink-soft); font-size: 12px; }
  .modal-card .hint { color: var(--ink-soft); font-size: 12px; line-height: 1.6; margin: 0 0 12px; }
  .modal-card .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }


  /* Bookmark / marker */
  .gbtn { position: relative; }
  .gbtn.marked::after {
    content: "★"; position: absolute; top: 1px; right: 3px;
    font-size: 10px; color: var(--yellow); line-height: 1;
    text-shadow: 0 0 2px #fff;
  }
  .markbtn {
    margin-left: auto; background: #fff; border: 1px solid var(--line);
    color: var(--ink-soft); padding: 6px 13px; border-radius: 999px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .markbtn:hover { border-color: var(--yellow); color: var(--yellow); }
  .markbtn.marked { background: var(--yellow-soft); color: #6b4e00; border-color: var(--yellow); font-weight: 600; }
  .qhead { flex-wrap: wrap; }
  .marked-badge { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--yellow-soft); color: #6b4e00; font-size: 11px; border: 1px solid var(--yellow); margin-left: 4px; }
  .wrong-row.mk { border-color: var(--yellow); }

</style>

<script>
const DATA = {"Q1": {"label": "第一次", "questions": [{"n": 1, "stem": "關於功能肺餘容積（Functional residual capacity, FRC）的測量，下列何者正確？", "options": {"A": "利用波以爾定律以體箱計（Body Plethysmography）量測，一般人FRC大約是2500 mL", "B": "利用肺流量以一般簡易肺功能測試量測，一般人FRC大約是5000 mL", "C": "利用波以爾定律以體箱計（Body Plethysmography）量測，一般人FRC約占全肺量的25%", "D": "利用肺流量以一般簡易肺功能測試量測，一般人FRC約占全肺量的50%"}, "images": [], "answer": "A", "explanation": "FRC 由體箱計（body plethysmography）以波以爾定律量測，正常成人 FRC 約 2,500 mL（約占 TLC 40-50%）；故選 A。一般肺量計無法測 FRC（因含 RV 不會吐出）。"}, {"n": 2, "stem": "有關換氣—灌流的敘述，下列何者正確？", "options": {"A": "當換氣超過灌流時，則稱為分流異常", "B": "當換氣浪費在沒有血液灌流的部位，或血液灌流浪費在沒有換氣的單位，就稱為換氣—灌流的不配合 （mismatch）", "C": "正常情況下，換氣—灌流比值最佳為0.5", "D": "當灌流超過換氣時，則稱為死腔換氣"}, "images": [], "answer": "B", "explanation": "V/Q mismatch 指換氣與灌流不匹配（換氣多於灌流=死腔效應；灌流多於換氣=分流效應）；故選 B。正常 V/Q 約 0.8-1.0；換氣超過灌流為『dead space ventilation』，灌流超過換氣為『shunt』。"}, {"n": 3, "stem": "有關健康成人肺功能的正常值範圍，下列何者錯誤？", "options": {"A": "最大呼吸時，肺泡內壓則可高達 ±200 mmHg", "B": "死腔是不參與氣體交換的部分，通常在145～155 mL之間", "C": "死腔與潮氣量的比值常用來表示機械性換氣的有效性，正常值約為25～40%", "D": "容量彈性（compliance）的倒數即為彈性程度（elastance），一般正常值在2.5～8.5 cmH2O/L"}, "images": [], "answer": "A", "explanation": "肺泡內壓最大可達約 ±100 cmH2O（約 ±75 mmHg），不會到 ±200 mmHg；故 A 錯誤。"}, {"n": 4, "stem": "下列何者為評估呼吸音的正確技巧？", "options": {"A": "為尊重患者的隱私避免暴露，應隔著患者的衣服進行呼吸音的評估", "B": "為避免患者勞累，最好在患者仰躺的姿勢下進行呼吸音的評估", "C": "進行呼吸音評估時，如果聽到的聲音很微弱或遙遠，可請患者進行深呼吸以便再次確認", "D": "評估呼吸音時，必須比較前胸與後背聽到呼吸音在強度與音調上的差異"}, "images": [], "answer": "C", "explanation": "呼吸音微弱時可請患者深呼吸再次確認，故選 C。應直接接觸皮膚（不隔衣物）；坐姿較佳；前後音強度本就有差，比較『同節對稱兩側』而不是前後。"}, {"n": 5, "stem": "關於胸腔手術後的物理治療，下列何者正確？", "options": {"A": "接受後外側胸腔手術（posterolateral thoracotomy）的患者應避免肩膀屈曲過肩的姿勢，以免傷口裂開", "B": "接受正中胸骨切開術（median sternotomy）的患者應避免咳嗽，以免傷口裂開", "C": "插有胸管（chest tube）的患者需要臥床不能參與物理治療的運動訓練", "D": "左肺部分切除的患者應避免左側在下的側躺（side lying on the left side）"}, "images": [], "answer": "#", "explanation": "本題經考選部公告「一律給分」。各選項都有部分正確之處：A 後外側胸切確要避免肩過度活動但漸進可恢復、B 應鼓勵咳嗽（用枕頭支撐），C 插胸管仍可活動，D 切除側下方躺有助分泌物排出，故全給分。"}, {"n": 6, "stem": "有些氣喘患者在不發作時可能沒有症狀或肺功能正常。氣喘嚴重程度的分級標準是依據何指標訂定？", "options": {"A": "尖峰呼氣流速值，日間症狀，夜間症狀", "B": "第一秒用力吐氣量，用力肺活量", "C": "用藥量與運動自覺量表", "D": "最大吸氣壓，最大呼氣壓"}, "images": [], "answer": "A", "explanation": "氣喘嚴重度分級依：日間症狀頻率、夜間症狀、PEFR 與其變異率；故選 A。"}, {"n": 7, "stem": "氣喘患者從事運動時若要預防運動誘發型氣喘可以如何做？", "options": {"A": "運動前10～15分鐘服用擬交感神經刺激的氣管擴張噴霧劑", "B": "選擇乾燥的環境運動", "C": "縮短熱身運動的強度與時間", "D": "縮短冷卻期的強度與時間"}, "images": [], "answer": "A", "explanation": "EIA 預防：運動前 10-15 分鐘吸入短效 β2-agonist 支氣管擴張劑；故選 A。應充分熱身緩和、避免冷乾環境。"}, {"n": 8, "stem": "李先生是慢性阻塞性肺疾病患者，肺功能的檢查為FEV1＝65%；DLCO＝65%；FVC＝70%。根據美國醫學會\n（AMA）對呼吸障礙（disability）的分級標準，李先生分級屬於何者？", "options": {"A": "Class 1", "B": "Class 2", "C": "Class 3", "D": "Class 4"}, "images": [], "answer": "B", "explanation": "AMA 呼吸障礙分級依 FEV1、DLCO、FVC 等 % 預測值：60-79% 為 Class 2 (mild)；故選 B。"}, {"n": 9, "stem": "一位在物理治療進行肺部復原的氣喘患者，這週幾乎每天都需要使用急救型支氣管擴張藥物，下列何者是物\n理治療師最適切的處置行為？", "options": {"A": "降低運動訓練強度", "B": "增加運動前吸入型支氣管擴張藥物的劑量", "C": "暫停訓練並尋求進一步醫療處置協助", "D": "加強運動過程中血氧的監測"}, "images": [], "answer": "C", "explanation": "幾乎天天需要急救型支氣管擴張劑代表氣喘控制不佳；應暫停運動訓練並請醫療進一步介入處置；故選 C。"}, {"n": 10, "stem": "一位因為急性敗血症併發肺炎住在加護病房的患者，下列何項物理治療介入最不適宜？", "options": {"A": "四肢被動運動", "B": "執行抽痰技術", "C": "側身引流擺位", "D": "床邊站起"}, "images": [], "answer": "D", "explanation": "急性敗血症+肺炎+加護病房：患者血流動力學不穩，床邊站起運動風險過高；故 D 最不適宜。"}, {"n": 11, "stem": "在病房中看到治療師在病人上腹部放一沙包，最可能的目的為何？", "options": {"A": "呼吸肌訓練", "B": "協助排痰與肺部清潔", "C": "整合性呼吸照護中配合呼吸器使用", "D": "作為咳嗽訓練"}, "images": [], "answer": "A", "explanation": "上腹部放沙包是『阻力性吸氣肌訓練』(增加橫膈收縮負荷)，故選 A。"}, {"n": 12, "stem": "洪先生因跌倒撞擊頭部感到頭痛不適，緊急送醫發現有硬腦膜下血腫（subdural hematoma, SDH），手術後\n在加護病房觀察，目前可自行呼吸但意識不清。下列關於物理治療的敘述，何者正確？", "options": {"A": "若有硬腦膜上壓力監測時，任何時候都不應使顱內壓超過20 mmHg、腦灌流壓小於50 mmHg", "B": "若頭骨尚未補回，不宜進行物理治療", "C": "不可刺激氣管協助自發的咳嗽", "D": "不可刺激胸壁誘發自主深呼吸動作"}, "images": [], "answer": "A", "explanation": "硬腦膜下血腫患者：ICP 不應 > 20 mmHg、CPP 不應 < 50 mmHg；A 為標準照護指引。其他選項過於絕對（頭骨未補仍可治療、可刺激咳嗽與深呼吸）。"}, {"n": 13, "stem": "接受胃部切除手術患者，術後胸部X光顯示右下肺葉側底節（lateral basal segment）有塌陷現象。治療師\n進行局部呼吸運動時，給予徒手壓力的最佳手部位置為何處？", "options": {"A": "右胸前側肋骨下段（right anterior lower ribs）", "B": "右前胸（right anterior mid-chest）", "C": "右胸外側肋骨下段（right lower lateral costal area）", "D": "右側肩胛骨下方（right subscapular area）"}, "images": [], "answer": "C", "explanation": "右下肺葉側底節塌陷時，給予『右胸外側肋骨下段』徒手壓力可促進該區擴張；故選 C。"}, {"n": 14, "stem": "以居家方式進行肺部復健的氣喘患者，建議應每日測量並記錄下列那項參數以了解自己氣道管徑的變化？", "options": {"A": "心率", "B": "吸氣尖峰流速", "C": "脈搏血氧飽和度（pulse oxygen saturation, SpO2）", "D": "吐氣尖峰流速"}, "images": [], "answer": "D", "explanation": "氣喘居家應每日測量 PEFR（吐氣尖峰流速）監測氣道；故選 D。"}, {"n": 15, "stem": "下列何者不是影響心搏量（stroke volume）的因素？", "options": {"A": "前負荷（preload）", "B": "心臟本身的收縮力（contractility）", "C": "後負荷（afterload）", "D": "房室瓣膜的數量"}, "images": [], "answer": "D", "explanation": "心搏量受三因子影響：preload、contractility、afterload；瓣膜數量為解剖固定，不影響 SV；故選 D。"}, {"n": 16, "stem": "下列何者為影響運動時心輸出量增加最顯著的生理參數？", "options": {"A": "心率", "B": "心搏量", "C": "平均動脈壓", "D": "周邊血管阻力"}, "images": [], "answer": "A", "explanation": "運動時心輸出量增加主要靠『心率上升』（最多 3-4 倍），SV 增加幅度有限（約 1.5 倍）；故選 A。"}, {"n": 17, "stem": "下列何者不是臨床上心導管檢查的評估項目？", "options": {"A": "運動時心臟功能的改變", "B": "心血管狹窄之百分比", "C": "冠狀動脈阻塞所侵犯之血管位置", "D": "心臟瓣膜的功能"}, "images": [], "answer": "A", "explanation": "心導管為靜態結構檢查，無法評估『運動時心臟功能改變』（須運動測試或運動同位素）；故選 A。"}, {"n": 18, "stem": "對於運動測試結果的應用，下列何者錯誤？", "options": {"A": "心臟病患因服用β阻斷劑，故運動心率無法反應運動強度", "B": "症狀限制之極限運動測試結果可訂定患者的最大心率與最大運動量", "C": "心臟病患者之心絞痛閾與心肌的攝氧量呈正相關", "D": "心絞痛閾以心率乘以平均血壓（HR×MAP）的值來呈現"}, "images": [], "answer": "D", "explanation": "心絞痛閾以 RPP（HR×SBP，rate-pressure product）呈現，不是 HR×MAP；故 D 錯誤。"}, {"n": 19, "stem": "下列何者於高齡族群的變化易呈下降趨勢？", "options": {"A": "高血壓盛行率", "B": "糖尿病盛行率", "C": "體脂肪率", "D": "肌肉質量率"}, "images": [], "answer": "D", "explanation": "高齡族群肌肉質量會下降（肌少症），其他三項（高血壓、糖尿病、體脂肪）盛行率上升；故選 D。"}, {"n": 20, "stem": "下列何者為心肌損傷較專一的酵素指標？", "options": {"A": "肌氨酸酐磷酸（creatine phosphokinase, CPK)", "B": "乳酸脫氫酵素（lactic dehydrogenase, LDH）", "C": "血清麩氨草醋酸轉氨（serum glutamic oxaloacetic transaminase, SGOT）", "D": "Troponin I或T"}, "images": [], "answer": "D", "explanation": "Troponin I/T 是心肌損傷最特異的標記；CPK、LDH、SGOT 較廣泛存在於其他組織；故選 D。"}, {"n": 21, "stem": "賈先生為缺血性心臟病患者，其最大攝氧量（VO2 max）為 25 mL/kg/min。依「美國心血管和肺部復健學\n會」、「美國醫師學會」準則，以METs（metabolic equivalents）為危險性分級指標時，其危險性分級為\n何？", "options": {"A": "無危險性", "B": "低危險性", "C": "中等危險性", "D": "高危險性"}, "images": [], "answer": "B", "explanation": "VO2max 25 mL/kg/min ≈ 7.1 METs；依 AACVPR 分級 5-7 METs 為低危險，> 7 METs 屬中等運動能力，題目選 B「低危險性」。"}, {"n": 22, "stem": "王先生的胸腔X光片如下圖，可知他目前有那些導線裝置？①CVP line　②endotracheal tube　③chest\ntube　④swan-ganz　⑤ECG", "options": {"A": "①②③④⑤", "B": "僅②④⑤", "C": "僅①③④", "D": "僅①②③⑤"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAYcAAAH0CAIAAABZynZGAAAACXBIWXMAAA7EAAAOxAGVKw4bAALlXUlEQVR4nLz9WfBG2VnW/f+QSUAQI4igyIwGGUIIhsEwJZCQQBIIEOAlDBlJQhrTnfSU9DylO52BQAgkEDJ0SBMFtEAOnNDSEkotywmt0rLKM6vkxFnE6f32/riv96Hz/79H+K6DXfvZzx7WXnuta933dQ/r6kM+5EOufmfpyId92Ie1/T2/5/f8k3/yT37jN37jH/2jf/Srv/qr7373ux/3uMd9xVd8xc78iI/4iM7stI/8yI9s+1u/9Vudszv83t/7e9v/hE/4hOc85zn/63/9r//5P/9n29tuu+0zP/MzO94JbbtKBdp+6Id+aDsf/uEfbueyJpeV7KFtO8ejK+7WOR9+lI/+6I/u33Y6WMXa/v7f//s/5mM+puOd7C/3dKvO8dzdrXP2xI/6qI9abZ2sqp7utK71r8tt1f+y8p/xGZ/xxCc+8fGPf/xnf/Zn33KUn/iJn7j55pv/1J/6U9/8zd/81Kc+9fu+7/te9rKXvehFL/r+7//+F77whS94wQt+4Ad+4Hu/93v/r6N8z/d8z/Oe97wa005/vfGNb7zxxhsfeOCBW2+99Yd+6Ic6s0te/OIXv+gondD2pS996SuO8oM/+IP99ZKXvKQzX/nKV77qVa/q0a95zWuqRje566672r761a++/fbb3/SmN/3oj/7offfdd//997/hDW+4++6777nnnvYffPDBth3v5LYdv+OOO9rvm959lO5281H+zFF6Sje89tpru/DHf/zH3/zmN7/uda+799577zxK9+wm7fTErq0ab33rWzvhpptu6q92OtJfbe86Smf2uI6338HXvva1Pa6DvcgPn6XXrAGvueaaHt3P3vTlL395BzvStoPtdLD9qtcJtUZHaqLrrruug53cfo3W8R88Su35/Oc/X3vW5p3go7T91m/91obDFx7l8z7v8x772Mf+yT/5J9v/rM/6rE//9E//tE/7tE/6pE/61E/91D/6R//oF3zBFzj48R//8X/wD/7BukGD4o/8kT/ycR/3cf385E/+5I87Sj2kLrqOZBSsK+qc60vrV4/qY48azh/yQWWdc6NMZ/7gO3jcBx//4Dp88HN/94tR5zG//du/HZT8l//yX37zN38TrFT+0l/6S1cHOjREO9N7fu3Xfm1/vetd77o6xvCHHqWbvPe97+3C+llft5H2r//1v/6v//W/fvmXf7lnfdhRtm/nI46y+vyBP/AH+nKN5D7t53zO53zxF39xY/vLvuzL6gF98s/93M9t2/kqrD5avCMf+7Ef+4f/8B9+8pOf/CVf8iX1g3rJJ37iJ/6hP/SHYM0KAP 服用Inderal，不可採用心率訂定運動強度", "C": "王小姐使用Nitroglycerin，應監測胸悶及心肌缺氧症候", "D": "張太太使用Bosmin，可能運動誘發氣喘"}, "images": [], "answer": "D", "explanation": "Bosmin (epinephrine) 用於急救，會擴張支氣管，不會誘發氣喘（反而是治療氣喘）；故 D 錯誤。"}, {"n": 24, "stem": "在急症病房執行床邊物理治療時，當病患出現下列那些症候時可能代表血液中二氧化碳濃度過高？①皮膚泛\n紅　②出汗　③躁動不安　④嗜睡", "options": {"A": "①④", "B": "②③", "C": "①②③", "D": "①②④"}, "images": [], "answer": "D", "explanation": "高 CO2 血症典型症狀：皮膚泛紅①、出汗②、嗜睡④（C 也可能但躁動較常為急性低氧）；故選 D（①②④）。"}, {"n": 25, "stem": "針對上肢有氧運動及下肢有氧運動，執行相類似之運動強度時，下列何者正確？①上肢運動的收縮壓值低於\n下肢運動的　②上肢運動的最大攝氧量高於下肢運動的　③上肢運動的換氣閾值低於下肢運動的　④上肢運\n動的心率血壓乘積值高於下肢運動的", "options": {"A": "①②", "B": "③④", "C": "①②③", "D": "②③④"}, "images": [], "answer": "B", "explanation": "上肢有氧運動相同強度下：HR 較高、SBP 較高、心率血壓乘積值較高 ④、換氣閾值低 ③；故選 B（③④）。"}, {"n": 26, "stem": "有關症狀限制最大運動測試的絕對禁忌症，下列何者正確？①持續不穩定型心絞痛　②中度主動脈瓣狹窄\n③收縮壓180mmHg　④活動性（active）心內膜炎", "options": {"A": "①④", "B": "②③", "C": "①②③", "D": "②③④"}, "images": [], "answer": "A", "explanation": "症狀限制最大運動測試絕對禁忌：持續不穩定型心絞痛①、活動性心內膜炎④；中度 AS、SBP 180 為相對禁忌；故選 A。"}, {"n": 27, "stem": "李先生55歲冠狀動脈繞道手術之後，進行第二期的心臟復健運動訓練，最大運動測試結果，最大攝氧量為30\nmL/kg/min， 預備以50%的攝氧量儲存量（VO2Reserve）進行運動訓練， 目標攝氧量建議訂在那個強度\nmL/kg/min？", "options": {"A": "13.3", "B": "15.0", "C": "16.8", "D": "18.5"}, "images": [], "answer": "C", "explanation": "VO2R 公式：目標 VO2 = (VO2max - VO2rest) × % + VO2rest = (30 - 3.5) × 0.5 + 3.5 = 16.75 ≈ 16.8 mL/kg/min；故選 C。"}, {"n": 28, "stem": "針對心絞痛病患接受有氧運動訓練後，可帶來生理上適應性的變化，下列訓練效果之敘述何者正確？①提升\n最大攝氧量　②下降心絞痛閾值　③次大運動時心率血壓乘積上升　④次大運動時動靜脈氧差值上升", "options": {"A": "①③", "B": "②④", "C": "①④", "D": "②③"}, "images": [], "answer": "C", "explanation": "心絞痛患者有氧訓練適應：①最大攝氧量提升、④次大運動 a-vO2 差上升；②心絞痛閾值『提升』而非下降、③RPP 在次大運動下降；故選 C（①④）。"}, {"n": 29, "stem": "下列何者為劇烈身體活動和運動時最可能會產生的潛在立即性風險？", "options": {"A": "冠狀動脈血管瘤", "B": "急性心肌梗塞", "C": "血管粥狀動脈硬化", "D": "骨質疏鬆"}, "images": [], "answer": "B", "explanation": "劇烈運動最可能的立即風險為『急性心肌梗塞』，故選 B。"}, {"n": 30, "stem": "當患者從事跑步運動訓練時，物理治療師提醒將注意力放在呼吸頻率的調控或腿部疲勞的感覺上，此方法運\n用何種原理？", "options": {"A": "結合（association）", "B": "解離（disassociation）", "C": "著重過程", "D": "預防再發（relapse prevention）"}, "images": [], "answer": "A", "explanation": "讓患者注意呼吸與肌肉感覺屬於『結合 (association)』策略；解離則是讓注意力轉移到外界（如音樂）；故選 A。"}, {"n": 31, "stem": "下列何種公式可量化計算出有氧運動的量（quantity）？", "options": {"A": "運動頻率、運動強度、運動時間，三者的乘積", "B": "每週每組肌肉／動作所做的運動總組數（sets）", "C": "關節活動度（range of motion）增加的角度", "D": "運動強度和運動類型的加總"}, "images": [], "answer": "A", "explanation": "有氧運動量 = F × I × T（頻率 × 強度 × 時間）三者乘積；故選 A。"}, {"n": 32, "stem": "針對高血壓患者執行運動測試之敘述，下列何者正確？", "options": {"A": "休息時收縮壓≧200mmHg，舒張壓≧110mmHg是執行運動測試的適應症", "B": "如高血壓有得到良好控制，可直接執行較劇烈的運動", "C": "如果是以診斷為目的的測試，患者不需暫停服用高血壓藥物", "D": "如果測試目的是為了設計運動處方，在醫療的監督下，患者不需暫停服用高血壓藥物"}, "images": [], "answer": "D", "explanation": "高血壓患者運動測試若以『運動處方設計』為目的（非診斷），可在醫療監督下繼續服藥；故選 D。"}, {"n": 33, "stem": "懷孕時期因為生理與結構的變化，孕婦的運動反應會因此而產生變化，下列敘述何者最不可能產生？", "options": {"A": "與非懷孕婦女相比，孕婦從事負重運動時，耗氧量會明顯增加；而在靜止或非負重運動時的變化並不明顯", "B": "懷孕階段的孕婦在休息時、非最大運動、及最大運動時的心率皆會明顯增加", "C": "懷孕階段孕婦血容量（blood volume）會增加約50%，產後會回復", "D": "懷孕期間孕婦的通氣量（minute ventilation, VE）會增加，氧耗當量（VE/VO2）和二氧化碳當量 （VE/VCO2）會因此而增加"}, "images": [], "answer": "B", "explanation": "懷孕期心率休息與最大運動時皆增加；通氣量也增加，但氧耗當量 (VE/VO2) 與 VE/VCO2 在懷孕時並『不會明顯增加』（因 VO2 與 VCO2 也按比例增加）；故 D 描述錯誤；題目選 B 為最不可能產生的反應；按官方答案 B。"}, {"n": 34, "stem": "同齡的男、女族群接受10週條件匹配的運動處方（comparable programs），訓練前發現女性最大耗氧量\n（maximal VO2 [mL/kg/min]）普遍較男性低，而訓練後發現兩個族群的最大耗氧量皆有明顯提升。以下針對\n訓練對性別特異性改善（sex-specific improvement）的敘述，何者最不恰當？", "options": {"A": "女性訓練前的Peak VO2普遍較男性低。此外，接受訓練後提升Peak VO2的增加幅度，女性亦明顯較男性低", "B": "女性的基本體脂肪（body fat）較高，是造成訓練前的Peak VO2較男性低的原因之一", "C": "女性的血紅素（hemoglobin）普遍較男性低，是造成訓練前的Peak VO2較男性低的原因之一", "D": "女性的左心室容積較小，使得尖峰心搏量（stroke volume）較男性少，是造成訓練前的Peak VO2較男性低 的原因之一"}, "images": [], "answer": "A", "explanation": "訓練後女性提升 VO2 的『相對幅度』與男性相當（甚至略高）；A 說「幅度明顯較男性低」錯誤。"}, {"n": 35, "stem": "面對代謝症候群患者的諮詢，下列何者應是首要重視的問題？", "options": {"A": "攝取太少水分", "B": "肥胖和不活動", "C": "缺乏肌力", "D": "HDL-C濃度升高"}, "images": [], "answer": "B", "explanation": "代謝症候群諮詢首要為『肥胖與不活動』之改善（生活型態介入），故選 B。"}, {"n": 36, "stem": "為維持老年人骨骼健康， 童在輪椅上的擺位座墊與支撐系統"}, "images": [], "answer": "C", "explanation": "兒童 PT 不可給予『醫療診斷』(屬醫師業務)；故選 C 為不可能服務範疇。"}, {"n": 44, "stem": "為使以家庭為中心的早期介入產生成效，其服務的重要元素何者錯誤？", "options": {"A": "由專業人員到家中直接訓練兒童的能力", "B": "介入融入於日常生活作息中，以促進兒童發展", "C": "介入應多加強父母親與專業人員的夥伴關係", "D": "增強家長的親職能力"}, "images": [], "answer": "A", "explanation": "家庭中心早期介入應『支持家長執行』而非『專業人員直接訓練』(後者違反 family-centered 精神)；故 A 錯誤。"}, {"n": 45, "stem": "某團隊欲開發一項新的兒童發展篩檢量表，並以「臺北市學前兒童發展檢核表第二版」做為黃金標準，則此\n項研究屬於下列何種效度檢驗？", "options": {"A": "預測效度", "B": "內容效度", "C": "同時效度", "D": "表面效度"}, "images": [], "answer": "C", "explanation": "新工具與既有黃金標準同時施測比較，是『同時效度 (concurrent validity)』；故選 C。"}, {"n": 46, "stem": "一名約兩歲幼兒看見媽媽正在哺餵弟弟，她也拿起玩具奶瓶假裝餵洋娃娃，根據皮亞傑的認知心理理論，這\n是屬於下列那一個階段？", "options": {"A": "反射階段", "B": "初級循環反應", "C": "次級循環反應", "D": "以心智創造新基模"}, "images": [], "answer": "D", "explanation": "兩歲兒童拿玩具奶瓶餵洋娃娃 = 心智表徵+假裝遊戲，屬感覺動作期最後階段『以心智創造新基模』；故選 D。"}, {"n": 47, "stem": "學校系統物理治療師可選用下列那一量表，協助國中體育老師瞭解唐氏症學生的動作協調與平衡能力？", "options": {"A": "粗大動作功能量表-66（Gross Motor Function Measure-66）", "B": "兒童動作評量測驗第二版（Movement Assessment Battery for Children-Second Edition）", "C": "學校日常生活功能評量（School Function Assessment）", "D": "兒童生活功能量表（Pediatric Evaluation of Disability Inventory）"}, "images": [], "answer": "B", "explanation": "唐氏症兒童動作協調與平衡能力評估，使用 MABC-2（適用 3-16 歲）；故選 B。"}, {"n": 48, "stem": "有關個案腓腸肌比目魚肌無力（Gastrocnemius-soleus weakness）的步態臨床表現，下列何者錯誤？", "options": {"A": "行走速度變慢", "B": "在站立期，需大腿後肌（hamstrings）維持身體直立", "C": "在站立末期（terminal stance），過多膝屈曲（knee flexion）", "D": "擺盪期足部離地（foot clearance）有困難，需髖屈肌（hip flexors）協助"}, "images": [], "answer": "B", "explanation": "腓腸-比目魚肌無力時站立期需『股四頭肌或髖伸肌』維持身體直立，不是膕旁肌（膕旁肌會屈膝）；故 B 錯誤。"}, {"n": 49, "stem": "下列有關一般兒童如廁的發展次序，由先到後，那個次序正確？①解便後會表現不舒服樣　②除了擦拭需協\n助外，會自己上廁所大小便　③解便後能表達已大便或小便　④解便前會先告知大人要大便或小便", "options": {"A": "①②③④", "B": "①③④②", "C": "③①④②", "D": "④①②③"}, "images": [], "answer": "B", "explanation": "兒童如廁發展次序：①解便後表現不舒服 → ③解便後能表達 → ④解便前能告知 → ②自己上廁所；故選 B。"}, {"n": 50, "stem": "一位治療師想要同時瞭解發展遲緩幼兒的家庭軟硬體環境以及家長與兒童互動的態度，下列那一項評估工具\n最適合？", "options": {"A": "家庭環境評估量表（Home Observation for Measurement of the Environment Inventory）", "B": "親子互動觀察量表（Parent-child Interaction Observational Scale）", "C": "親職壓力量表（Parent Stress Index）", "D": "兒童教導量表（Nursing Child Assessment Teaching Scale）"}, "images": [], "answer": "A", "explanation": "HOME（Home Observation for Measurement of the Environment）同時評估家庭硬體環境+親子互動態度；故選 A。"}, {"n": 51, "stem": "在為身心障礙兒童進行輔具評估時，除兒童外，誰應被界定為輔具使用者？", "options": {"A": "輔具廠商", "B": "輔具研發人員", "C": "主要照顧者", "D": "早療機構的行政人員"}, "images": [], "answer": "C", "explanation": "兒童輔具評估的『使用者』除兒童外，主要照顧者也是使用者（協助操作、維護）；故選 C。"}, {"n": 52, "stem": "下列有關於目前高危險新生兒早期介入所遵循的發展理論，何者錯誤？", "options": {"A": "動態系統理論", "B": "以家庭為中心照顧理論", "C": "古典制約理論", "D": "協同發展理論"}, "images": [], "answer": "C", "explanation": "現代高危險新生兒早療基於『動態系統理論、家庭中心、協同發展』；古典制約理論不是主要遵循；故 C 錯誤。"}, {"n": 53, "stem": "下列有關早產兒病變的敘述，何者對兒童發展預後的危險性最高？", "options": {"A": "第二級早產兒視網膜病變", "B": "第二度腦室內出血", "C": "第二級腦室周圍白質軟化症", "D": "輕度肺支氣管發育不全症"}, "images": [], "answer": "C", "explanation": "第二級腦室周圍白質軟化症 (PVL) 對動作預後最不利（典型雙邊麻痺型 CP）；故選 C。"}, {"n": 54, "stem": "下列有關無嚴重腦部損傷的早產兒，在新生兒階段神經構造與動作功能之敘述，何者錯誤？", "options": {"A": "下肢原始反射較上肢原始反射先開始發展", "B": "四肢的屈肌張力的發展是從近端到遠端", "C": "相較於足月新生兒，早產兒在矯齡足月時的屈肌張力較差", "D": "相較於足月新生兒，早產兒在矯齡足月時的腦部白質和灰質分化較差"}, "images": [], "answer": "B", "explanation": "早產兒屈肌張力發展是從『遠端到近端』，不是近端到遠端；故 B 錯誤。"}, {"n": 55, "stem": "有關早產兒在新生兒階段餵食問題的治療介入，下列敘述何者錯誤？", "options": {"A": "餵食前於口腔內部及周圍予以適當刺激，可幫助早產兒整合口腔動作", "B": "餵食時輕柔撫觸早產兒及表達鼓勵話語的正向互動，可促進餵食的警醒程度", "C": "不餵食時給予早產兒適當感覺運動刺激，可促進餵食能力", "D": "應要減少無營養的奶嘴吸吮，多使用不同種類的奶瓶和奶嘴做有奶的吞嚥協調訓練"}, "images": [], "answer": "D", "explanation": "早產兒餵食前應提供無營養性吸吮（non-nutritive sucking）促進口腔協調；D 說減少無營養奶嘴錯誤。"}, {"n": 56, "stem": "有關對患有腦性麻痺兒童的輔助科技運用，下列敘述何者錯誤？", "options": {"A": "輔助科技對兒童而言是屬於ICF的環境因素", "B": "使用阿德里裝禁忌症之一為髖關節脫臼比率≧50%", "C": "對具獨立行走能力者，原則上動作限制較少之下肢支架比限制較多的下肢支架，對兒童粗大動作功能改善 較好", "D": "粗大動作功能分類系統（GMFCS）第IV～V級兒童，由於預後無法行走，因此不需考慮功能性移位輔具"}, "images": [], "answer": "D", "explanation": "GMFCS IV-V 兒童雖無法行走，但仍需考慮『移  "explanation": "DCD 介入應採『由上而下取向』(top-down，CO-OP)，注重任務與情境，不是先改善 body function；故 A 不適合。"}, {"n": 62, "stem": "給予患有唐氏症兒童的療育介入，何者為正確？", "options": {"A": "宜儘早建立規律身體活動的習慣，以預防肥胖", "B": "進行體育活動需避免身體轉動的動作，以預防第一、二節頸椎關節不穩定的問題加劇", "C": "因有先天性心臟構造異常的可能，避免心肺耐力訓練", "D": "因身形較短小，需減少敏捷度運動，但加強靜態穩定性動作"}, "images": [], "answer": "A", "explanation": "唐氏症兒童肥胖風險高，應『早建立規律身體活動習慣』；故選 A。但需注意 AAI 安全。"}, {"n": 63, "stem": "為了增進患有唐氏症兒童的智能與學習動機，下列何項介入方式較不適當？", "options": {"A": "強調親子互動與兒童在自然環境下學習", "B": "讓兒童有機會選擇介入進行的活動", "C": "要求兒童執行每一次的任務活動都要成功", "D": "安排多樣性的活動，且作息儘量規律"}, "images": [], "answer": "C", "explanation": "唐氏症兒童學習介入不應要求『每次都成功』(過於嚴格反而打擊動機)；應允許失敗與嘗試；故 C 不適當。"}, {"n": 64, "stem": "美美在生氣時常會大哭並作嘔，同時期待大人注意她。媽媽與治療師討論後決定當她大哭作嘔時，大人先離\n開其視線，等到哭聲減小再回來安撫。此方法是應用何項策略？", "options": {"A": "積極增強（給予正增強物）", "B": "消極增強（拿掉負增強物）", "C": "懲罰（給予負增強物）", "D": "隔離（拿掉正增強物）"}, "images": [], "answer": "D", "explanation": "美美哭+大人離開→哭聲減小→大人回來：屬於『隔離 (time-out, 拿掉正增強物)』策略，故選 D。"}, {"n": 65, "stem": "一位1歲兒童因車禍造成頭部外傷，使用兒童瑞秋量表評估為階級II，下列敘述何者最不適當？", "options": {"A": "兒童聽到自己的名字會有反應，也可以認得主要照顧者", "B": "物理治療評估應著重於觀察兒童的自發性行為以及簡單的任務活動", "C": "兒童看到有興趣的玩具會主動靠近，並動手操作玩具", "D": "物理治療介入策略應該要提升兒童的動機，在結構性的環境裡進行活動"}, "images": [], "answer": "C", "explanation": "瑞秋兒童量表 II 級為泛化反應期，兒童不會主動接近玩具與操作（這是更高階）；C 描述太樂觀，最不適當。"}, {"n": 66, "stem": "對於頭部外傷兒童物理治療介入的處理原則，下列何者最合宜？", "options": {"A": "於急性期側躺擺位時，可放置枕頭於兩腿之間，以避免髖內收肌群攣縮", "B": "於急性期擺位時，頭部應採低於心臟的位置，以降低顱內壓", "C": "於急性期，應對四肢採用快速被動關節運動，以誘發肌肉收縮及避免關節攣縮", "D": "於恢復期，應強調單一肢體動作控制，以取代任務導向訓練"}, "images": [], "answer": "A", "explanation": "急性期側躺擺位於兩腿間放枕頭可避免髖內收攣縮；故選 A。其他選項描述錯誤（不應床頭低、不應快速被動運動、不應放棄任務導向）。"}, {"n": 67, "stem": "針對裘馨氏肌肉失養症（Duchenne Muscular Dystrophy）兒童，下列何項治療原則錯誤？", "options": {"A": "加強訓練剩餘肌力", "B": "呼吸功能訓練可延緩呼吸功能退化", "C": "在發病後早期階段，即可開始進行適當的阻力運動", "D": "在發病後行走晚期階段，加強主動動作，避免進行被動的牽拉運動"}, "images": [], "answer": "D", "explanation": "DMD 行走晚期肌力下降，主動運動受限，被動牽拉仍重要以維持 ROM；D 否定被動牽拉錯誤。"}, {"n": 68, "stem": "下列有關兒童下肢肢體排列（alignment）與肢體旋轉角度在成長發育過程中之敘述，何者錯誤？", "options": {"A": "一般而言，出生時下肢呈現O型腿，至青春期時呈現略微X型腿", "B": "脛骨內旋（tibial medial torsion）通常發生在1～4歲的兒童", "C": "一般而言，髖關節內轉的角度均比外轉角度小", "D": "股骨頭過度前傾（femoral anteversion）的兒童傾向盤腿坐"}, "images": [], "answer": "D", "explanation": "髖關節內轉角度通常『大於』外轉（特別是兒童期）；故 C 描述錯誤。"}, {"n": 69, "stem": "下列何者不屬於一般兒童在肌肉骨骼系統發育過程中會出現的正常樣態，應該建議接受進一步檢查？", "options": {"A": "2歲兒童站立時呈現扁平足", "B": "3歲女童站立時呈現明顯的O型腿", "C": "新生嬰兒的髖關節外轉角度明顯比內轉角度較大", "D": "7歲兒童的股骨前傾（femoral anteversion）16度"}, "images": [], "answer": "B", "explanation": "3 歲女童站立時呈現明顯 O 型腿屬異常（生理性 O 型腿應在 18-24 個月轉為微 X 型）；故 B 需進一步檢查。"}, {"n": 70, "stem": "一位嬰兒經常呈現斜頸但並無明顯肌肉腫塊，下列那一項最不可能是要考量的鑑別診斷？", "options": {"A": "中樞神經損傷", "B": "脊柱裂", "C": "胃食道逆流", "D": "視覺問題"}, "images": [], "answer": "B", "explanation": "脊柱裂與斜頸無直接關聯（脊柱裂主要影響下肢）；故選 B 最不需考慮。"}, {"n": 71, "stem": "下列有關一般足月幼兒心肺功能發展變化的描述，何者錯誤？", "options": {"A": "呼吸速率在出生時約每分鐘35次，在8歲時下降至每分鐘約20次", "B": "心跳速率在出生後5分鐘時為每分鐘約80次，在8歲時升高至每分鐘約100次", "C": "動脈血氧分壓（PaO2）在出生後5小時約為62～86 mmHg，在青少年時增加至約為80～100 mmHg", "D": "肺泡數量在嬰兒出生時約為2千5百萬個，在8歲時增加至2億5千萬個以上"}, "images": [], "answer": "B", "explanation": "新生兒 HR 約 120-160 bpm，5 分鐘時不會降到 80；8 歲時降至 80-100 bpm。B 描述方向相反。"}, {"n": 72, "stem": "負責產生表面張力素的第二型肺泡細胞組織，大約在肺部發育的那一個階段開始形成？", "options": {"A": "胚胎期（embryonic period）", "B": "偽腺體期（pseudoglandular period）", "C": "通道化期（canalicular period）", "D": "囊狀期（saccular period）"}, "images": [], "answer": "C", "explanation": "Type II pneumocyte（分泌表面張力素）約在通道化期 (canalicular period, 17-26 週) 開始形成；故選 C。"}, {"n": 73, "stem": "有關對呼吸肌力不足之兒童進行呼吸訓練的敘述，下列何者錯誤？", "options": {"A": "使用阻力性呼吸訓練，可增加吸氣肌或吐氣肌肌力", "B": "使用快及深的呼吸模式，可增加肺泡的通氣量", "C": "訓練橫膈肌，可提升吸氣量", "D": "促進肩帶（shoulder girdle）部位的活動度，可增進呼吸時的胸廓活動幅度"}, "images": [], "answer": "B", "explanation": "呼吸肌弱者應採『慢且深』的呼吸（增加肺泡通氣量），不是快又深；故 B 錯誤。"}, {"n": 74, "stem": "下列那一項最不可能是正在接受化學治療的白血病（leukemia）兒童會出現的治療副作用？", "options": {"A": "身體局部皮膚乾裂甚至纖維化", "B": "腳踝與足部肌肉無力與感覺異常", "C": "覺得全身無力容易疲倦", "D": "頭暈或頭痛"}, "images": [], "answer": "A", "explanation": "白血病化療常見副作用：周邊神經病變（B）、疲倦（C）、頭暈頭痛（D）；皮膚乾裂纖維化是放射治療常見，不是化療典型副作用；故選 A。"}, {"n": 75, "stem": "依據功能性肌力測試法，10個月大的嬰兒 es": [], "answer": "D", "explanation": "MIP（最大吸氣壓）是評估吸氣肌肌力最直接的指標；故選 D。"}, {"n": 9, "stem": "一位患有先天性纖毛運動異常症（primary ciliary dyskinesia, PCD）的患者，下列何者對患者氣道清潔最\n有幫助？", "options": {"A": "腹式呼吸", "B": "圓唇吐氣", "C": "有氧運動", "D": "正壓吐氣輔助器（positive expiratory pressure, PEP）"}, "images": [], "answer": "D", "explanation": "PCD 患者纖毛清除功能不良；正壓吐氣輔助器 (PEP) 可協助清除分泌物；故選 D。"}, {"n": 10, "stem": "關於單肺移植患者在門診接受物理治療時的敘述，下列何者錯誤？", "options": {"A": "胸腔物理治療計畫與胸腔手術後的治療類似", "B": "需要接受積極的氣道衛生技術治療", "C": "運動時血氧飽和度下降可能是排斥的第一徵兆", "D": "學者建議手術在4～6週內不宜從事四肢關節活動"}, "images": [], "answer": "D", "explanation": "肺移植後 4-6 週可進行四肢關節活動（受控不損及胸切口）；D 否定錯誤。"}, {"n": 11, "stem": "下列何者不是徒手震動的禁忌？", "options": {"A": "痰中有血絲（streak）或輕微咳血者", "B": "乳癌患者之乳房重建位置", "C": "骨質疏鬆處", "D": "肺栓塞病人"}, "images": [], "answer": "A", "explanation": "徒手震動禁忌含：乳房重建處、骨質疏鬆處、肺栓塞；少量血絲（streak）非絕對禁忌（嚴重咳血才是）；故選 A。"}, {"n": 12, "stem": "肺部手術後發生在早期（0～2週）常見之併發症，不包括下列何者？", "options": {"A": "肺張不全，肺塌陷，換氣不足", "B": "肋膜積水，血胸，膿胸", "C": "肺栓塞，深部靜脈血栓", "D": "胸廓畸形，傷口疼痛"}, "images": [], "answer": "D", "explanation": "肺術後 0-2 週常見：肺擴張不全、肋膜積水、血胸、膿胸、PE/DVT；胸廓畸形屬慢性後遺症（不是早期）；故選 D。"}, {"n": 13, "stem": "下列何種神經或神經肌肉疾病合併出現限制型肺部疾病的機率最低？", "options": {"A": "T1完全脊髓損傷", "B": "中期肌萎縮性側索硬化（amyotrophic lateral sclerosis）", "C": "三級重症肌無力（myasthenia gravis）", "D": "第二期巴金森氏症（Parkinson disease）"}, "images": [], "answer": "D", "explanation": "PD II 期僅輕度動作症狀，未到呼吸肌無力階段；不會出現顯著限制型肺疾病；故選 D。"}, {"n": 14, "stem": "若在長照機構中為一位有慢性呼吸道疾病的患者進行治療，已知該患者長期服用全身性類固醇藥物，下列何\n者較不可能是藥物造成的影響？", "options": {"A": "骨質疏鬆", "B": "遠端肌肉無力", "C": "椎間盤壓迫性骨折", "D": "增加周邊關節完整性"}, "images": [], "answer": "D", "explanation": "全身性類固醇副作用：骨鬆、近端肌無力、椎體壓迫骨折；不會增加關節完整性（反而可能加速關節破壞）；故 D 不可能。"}, {"n": 15, "stem": "有關心肌的構造及功能，下列何者錯誤？", "options": {"A": "心肌和骨骼肌一樣無橫紋", "B": "心肌因有間板（intercalated disk）和離子極易通透之結合點（gap junction）的存在，當節律器發生收 縮刺激，興奮會很快傳遞，使得心肌能很快地一齊收縮，像是一個完整的合體細胞（syncytium）", "C": "可將心肌視為組成兩心房的心房合體細胞和組成兩心室的心室合體細胞，這兩合體細胞由圍繞於心房、心 室及之間的結締組織分隔", "D": "心肌具有自發性（automaticity），可以自己產生週期性的動作電位"}, "images": [], "answer": "A", "explanation": "心肌『有橫紋』（striated involuntary muscle）；A 說「無橫紋」錯誤。"}, {"n": 16, "stem": "有關冠狀動脈（coronary artery）分支與血流之敘述，下列何者正確？", "options": {"A": "左旋冠狀動脈（left circumflex artery），沿著心室間溝一直到心臟尖端，主要供應前側左心室的血流", "B": "左前降冠狀動脈（left anterior descending coronary artery），由主要冠狀動脈分出，供應左心房以 及左心室之外側和後側壁的血液", "C": "右冠狀動脈，由主動脈竇的右前方出來，主要供應右心房、右心室及部分左心室後側壁", "D": "一般人休息時冠狀動脈血流量平均為35mL/min/100g，在最大運動量時可達到75mL/min/100g"}, "images": [], "answer": "C", "explanation": "RCA 由主動脈竇右前出，供應右心房、右心室及『部分左心室後側壁』；故選 C。"}, {"n": 17, "stem": "臨床上有下列那些情況發生時，必須停止或減少病人的運動量？①心率反應較休息時增加每分鐘20次　②血\n壓下降20 mmHg　③出現暈眩、發紺、呼吸困難　④心電圖ST段下降或ST段上升超過2 mm", "options": {"A": "①②③", "B": "②③④", "C": "①③④", "D": "①②④"}, "images": [], "answer": "B", "explanation": "停止運動的徵候：SBP 下降 ≥ 10 mmHg②、嚴重症狀如暈眩發紺呼吸困難③、ECG ST 變化④；HR 上升 20 下不算停止指標①；故選 B（②③④）。"}, {"n": 18, "stem": "有關心導管介入性治療急性冠狀動脈症候群之短期目標，下列敘述何者錯誤？", "options": {"A": "及早完成梗塞相關血管（infarct related artery）之再灌流，以防梗塞擴大", "B": "死亡與其他併發症之預防", "C": "冠狀動脈再度梗塞之預防", "D": "同時治療非梗塞血管之狹窄以避免殘存之缺氧現象發生"}, "images": [], "answer": "D", "explanation": "ACS 急性冠狀動脈介入治療『短期目標』為:再灌流、預防死亡與再梗塞；同時治療非梗塞血管狹窄屬『長期管理』，不在短期目標內；故 D 錯誤。"}, {"n": 19, "stem": "有關胸痛（心肌缺氧），下列敘述何者錯誤？", "options": {"A": "心肌缺氧，是因為心臟氧氣之供應不足以支應新陳代謝之需求", "B": "不穩定心絞痛（unstable angina），動脈硬化斑塊破裂或動脈硬化病灶處有血栓併存為最常見病理機制", "C": "變異型心絞痛（Prinzmental's angina），胸痛發生時，常見心電圖ST段明顯下降", "D": "變異型心絞痛（Prinzmental's angina） ，其病理機制與冠狀動脈痙攣（spasm）相關"}, "images": [], "answer": "C", "explanation": "Prinzmetal angina（變異型）發作時 ST 段『上升』（不是下降）；故 C 錯誤。"}, {"n": 20, "stem": "有關心臟瓣膜二尖瓣（mitral valve）之敘述，下列何者錯誤？", "options": {"A": "二尖瓣脫垂，嚴重者會出現二尖瓣回流（mitral regurgitation, MR）而造成心室舒張期雜音", "B": "二尖瓣脫垂，好發於Marfan’s syndrome族群", "C": "二尖瓣狹窄，心房顫動（atrial fibrillation）為其常見心律不整", "D": "二尖瓣狹窄，風濕熱為其常見原因"}, "images": [], "answer": "A", "explanation": "二尖瓣脫垂回流會出現『心室收縮期雜音』(systolic murmur，不是舒張期)；故 A 錯誤。"}, {"n": 21, "stem": "對於經皮心肺繞道裝置（ECMO）的敘述，下列何者正確？", "options": {"A": "ECMO對心臟的支持程度小於主動脈氣球幫浦", "B": "VA ECMO只可取代心的功能，無法取代肺的功能", "C": "VV ECMO可同時取代心與肺的功能", "D": "VV ECMO只可取代肺的功能，無法取代心的功能"}, "images": [], "answer": "D", "explanation": "VV ECMO 只取代肺功能（無法取代心，因為血流仍由心臟驅動）；VA ECMO 可同時取代心+肺；故選 D。"}, {"n": 22, "stem": "物理治療師與病人面談時應有雙向溝通，下列敘述何者錯誤？", "options": {"A": "為節省時間，不必自我介紹", "B": "傾聽病人描述他的狀況，並決定病人症狀的嚴重性", "C": "引導家屬參與病人的治療計畫，尤其是病人的配偶", "D": "協助病人建立治療的目標，與病人達成共識"}, "images": [], "answer": "A", "explanation": "面談應自我介紹建立信任，不應為節省時間省略；故 A 錯誤。"}, {"n": 23, "stem": "有關人工節律器植入之敘述，何者錯誤？", "options": {"A": "病人有病竇症或房室阻斷等併發症，須裝置人工節律器", "B": "人工節律器有固定心率及可隨病人需求改變心率的類型", "C": "裝有人工節律器患者不需要加長運動暖身期，也不會有過度疲倦和呼吸短促的症狀", "D": "運動期間要經常監聽病人的血壓，運動停止前要有緩和運動的時間"}, "images": [], "answer": "C", "explanation": "裝有人工節律器者仍可能因暖身不足或運動過量出現疲倦呼吸短促；C 描述太樂觀，錯誤。"}, {"n": 24, "stem": "李先生60歲心肌梗塞後7天，目前於一般病房，X光片發現併發心包膜發炎積水，下列何種心肺物理治療方法\n較為適切？", "options": {"A": "舌咽呼吸", "B": "橫膈呼吸", "C": "行走訓練", "D": "姿位引流"}, "images": [], "answer": "B", "explanation": "心肌梗塞後併心包膜炎積水患者，宜採『橫膈呼吸』減少胸膜刺激+促進通氣；故選 B。"}, {"n": 25, "stem": "針對高血壓病患執行運動訓練時，監測其安全運動反應，就下列藥物中，那些不建議使用心率的變化來評估\n運動訓練強度？①鈣離子阻斷劑　②甲型腎上腺素阻斷劑　③利尿劑　④乙型交感神經阻斷劑", "options": {"A": "①②", "B": "①④", "C": "①③④", "D": "②③④"}, "images": [], "answer": "B", "explanation": "鈣離子阻斷劑①與 β 阻斷劑④會使心率反應遲鈍，不適合用 HR 評估訓練強度；故選 B。"}, {"n": 26, "stem": "57歲蔡先生接受心肺運動測試後，得知最大心率為155 bpm，而休息心率為80 bpm，達到無氧閾時心率約為\n142 bpm，在設定運動處方時，有氧訓練熱身時期之最適當心率約為：", "options": {"A": "85～95 bpm", "B": "105～115 bpm", "C": "125～135 bpm", "D": "140～150 bpm"}, "images": [], "answer": "B", "explanation": "HRR = 155-80 = 75；50% HRR + 80 = 117.5；暖身 30-40% HRR ≈ 105-110 bpm；故選 B（105-115）。"}, {"n": 27, "stem": "執行心肺運動耐力訓練時，下列運動強度的比較何者最不類似？", "options": {"A": "50%最大攝氧量和65%最大心率", "B": "75%最大心率和60%心率儲存量", "C": "50%最大攝氧量和自覺用力係數12", "D": "70%最大攝氧量和50%心率儲存量"}, "images": [], "answer": "D", "explanation": "70% VO2max 約等於 60% HRR（不是 50%）；故選 D 為最不類似的對應。"}, {"n": 28, "stem": "你是一位居家物理治療師，患者使用下列那些藥物時需特別避免碰撞，降低出血傾向？①Coumadin\n②Aspirin　③Digoxin　④Lasix", "options": {"A": "①②", "B": "③④", "C": "①③", "D": "②④"}, "images": [], "answer": "A", "explanation": "Coumadin（warfarin）①與 aspirin②為抗凝/抗血小板藥，避免碰撞出血；Digoxin、Lasix 與出血無直接關聯；故選 A。"}, {"n": 29, "stem": "對機械性心臟瓣膜置換手術後病人進行運動治療的注意事項，下列何者非關其特異性？", "options": {"A": "高強度運動時要注意發生瓣膜狹窄的徵兆", "B": "避免採用高衝擊性的運動型態", "C": "術後早期活動要注意心肌缺血的徵兆", "D": "暖身及緩和的時間宜縮短"}, "images": [], "answer": "D", "explanation": "機械瓣膜患者『暖身緩和』不應縮短，以避免心血管事件（瓣膜病人需更謹慎）；故 D 不是特異性注意事項。"}, {"n": 30, "stem": "陳先生半年前曾發生過心絞痛，經藥物治療後到目前未再出現過症狀，他平時有規律運動習慣，最近欲參與\n社區所舉辦的健走活動，你會給他什麼樣的建議？", "options": {"A": "最好不要參與以免發生心血管相關症狀", "B": "可以參與，但建議先做運動測試確認活動耐受度", "C": "可以參與，除了做運動測試之外還要進行身體檢查", "D": "可以參與，無須作任何身體檢查及運動測試"}, "images": [], "answer": "D", "explanation": "已穩定半年+規律運動的心絞痛者，參加健走（中低強度）即使無檢查也合理；故選 D。"}, {"n": 31, "stem": "為預防老年人跌倒，在下列的運動內容，何者的幫助相對較少？", "options": {"A": "爆發力", "B": "坐姿平衡", "C": "敏捷性", "D": "上肢柔軟度"}, "images": [], "answer": "D", "explanation": "預防跌倒主要靠：爆發力、平衡、敏捷、下肢肌力；上肢柔軟度幫助較少；故選 D。"}, {"n": 32, "stem": "關於握力測試（handgrip strength test）的敘述，下列何者錯誤？", "options": {"A": "執行前須先調整握把的寬度，並校正握力數值到零", "B": "握力測試可測量前臂和手部肌群的最大等長收縮（isometric）的肌力", "C": "根據美國運動醫學會建議，每隻手都測量兩次，並取兩次的平均值作為測驗結果", "D": "測試時請受測者雙腳稍微分開站立，測試時握力器不可碰觸到身體其他部位"}, "images": [], "answer": "C", "explanation": "ACSM 建議握力測試每隻手測 3 次，取『最大值』作為結果（不是平均值）；故 C 錯誤。"}, {"n": 33, "stem": "王先生上個月因心肌梗塞住院，進行經皮冠狀動脈介入術（percutaneous coronary intervention, PCI）\n後恢復良好出院，今進行症狀限制最大運動測試，若過程中出現下列何者為終止測試的絕對禁忌症？", "options": {"A": "收縮壓下降10 mmHg無合併其他缺血症狀", "B": "出現中度心絞痛", "C": "胸痛的感覺增加", "D": "出現跛行（claudication）"}, "images": [], "answer": "B", "explanation": "中度心絞痛屬最大運動測試的『絕對』終止指標；故選 B。"}, {"n": 34, "stem": "擬定運動處方時會包含F.I.T.T.V.P等內容設計，下列敘述何者屬於V？", "options": {"A": "一週運動5次，連續4週", "B": "執行50% HRR的跑步運動", "C": "每週執行運動目標1000 METs", "D": "每週的運動總量都要上調10%"}, "images": [], "answer": "C", "explanation": "FITTVP 中 V = Volume（總量）；每週 1000 METs 為運動總量指標；故選 C。"}, {"n": 35, "stem": "兒童的生理與結構處於正在成長階段且未臻成熟，其運動反應會與成年人有所不同。下列敘述何者最不適\n當？", "options": {"A": "兒童在次大與最大運動時的心率與血壓皆較成年人高", "B": "兒童的呼吸頻率較成年人高；但是因呼吸深度較淺，所以通氣量一般仍較成年人低", "C": "針對兒童的肌力訓練建議可採60%～80% 1-RM強度，反覆次數為每肌群做12～15次", "D": "兒童因體型較成年人小，其絕對耗氧量（absolute VO2[L/mL]）較成年人低"}, "images": [], "answer": "A", "explanation": "兒童最大運動時 SBP 較低（不是較高）；A 說「兒童心率與血壓皆較成人高」錯誤。"}, {"n": 36, "stem": "在運動處方的設計當中，常以設計個案的目標心率（THR）來當作其運動強度的指標。而THR的設定方式有\n二：心率儲存量百分比（%HRR）和最大心率之百分比（%HRmax）。對於此兩個指標的差異，下列敘述何者最\n不適當？", "options": {"A": "以 %HRR設定運動強度較 %HRmax精準，採用 %HRmax有低估的可能性", "B": "%HRR方法才能夠以1比1的相關性，較精準地反應耗氧量儲存量百分比（%VO2R）", "C": "對有氧能力愈差的人（≦5 METs）來說，%HRR與 %HRmax之間的設定差異會較有氧能力好的人（≧10 METs）來得大", "D": "在低運動強度（≦45%VO2R）的設定上，%HRR與 %HRmax之間的差異會較高運動強度時（≧85%VO2R）來得小"}, "images": [], "answer": "D", "explanation": "%HRR 與 %HRmax 在低運動強度時差異會『較大』(不是較小)；故 D 描述方向錯誤。"}, {"n": 37, "stem": "因為懷孕期間身體各系統的改變，對運動的生理反應亦產生影響。下列何種生理反應的明顯增加，在孕婦身\n上是最不可能觀察到的現象？", "options": {"A": "心率", "B": "耗氧量", "C": "血氧飽和度", "D": "每分鐘通氣量"}, "images": [], "answer": "C", "explanation": "懷孕運動觀察到：HR↑、VO2↑、VE↑；血氧飽和度（SpO2）已接近 100%上限，不會有明顯增加；故選 C。"}, {"n": 38, "stem": "有關乳癌患者在手術治療後（有接受部分腋下淋巴摘除）進行上肢阻力運動的敘述，下列何者錯誤？", "options": {"A": "出現淋巴水腫臨床症狀者，需在監督下進行阻力訓練", "B": "建議淋巴水腫高危險患者在患側進行阻力運動時須穿戴壓力套（compression garments）", "C": "阻力訓練後，出現患側手沉重感，須注意是淋巴水腫的前兆", "D": "若患肢出現淋巴水腫且因感染正在接受抗生素治療，阻力訓練可以照常進行不受影響"}, "images": [], "answer": "D", "explanation": "感染中接受抗生素治療時，阻力訓練應暫停或調整；不可『不受影響照常進行』；故 D 錯誤。"}, {"n": 39, "stem": "下列那一類癌症患者接受放射治療（至原腫瘤部位）會有相對較高機率產生治療相關之心臟及肺臟毒性？", "options": {"A": "食道癌（esophageal cancer）", "B": "大腸直腸癌（colorectal cancer）", "C": "攝護腺癌（prostate cancer）", "D": "卵巢癌（ovarian cancer）"}, "images": [], "answer": "A", "explanation": "食道癌放射治療部位接近心臟與肺臟，最易造成心肺毒性；故選 A。"}, {"n": 40, "stem": "癌症化學療法容易造成骨髓抑制（bone marrow suprression）， 主要會影響血液中何種成分的生成？", "options": {"A": "白血球", "B": "紅血球", "C": "血小板", "D": "血漿"}, "images": [], "answer": "A", "explanation": "化療造成骨髓抑制最先影響『白血球』（生命週期最短，最快下降）；故選 A。"}, {"n": 41, "stem": "根據動作學習理論，教導一般兒童動作技巧，下列何項策略使用錯誤？", "options": {"A": "需有足夠的練習", "B": "練習原則由簡單而複雜", "C": "完全採取肢體動作協助的方式，以增進動作學習", "D": "教導的內容需依據兒童所處的情境與需求設計"}, "images": [], "answer": "C", "explanation": "教導兒童動作技巧不應『完全用肢體協助』(被動)；應由協助漸進至自主；故 C 錯誤。"}, {"n": 42, "stem": "兒童物理治療師將玩具藏在容器中，測試兒童是否會嘗試各種解決問題（problem solving）的方法拿到玩\n具，以了解其認知功能的發展，此作法是依據那位學者的理論？", "options": {"A": "格塞爾（Gesell）", "B": "史金納（Skinner）", "C": "皮亞傑（Piaget）", "D": "佛洛伊德（Freud）"}, "images": [], "answer": "C", "explanation": "皮亞傑認為兒童透過解決問題探索基模，藏玩具於容器測試問題解決行為符合其理論；故選 C。"}, {"n": 43, "stem": "Rosenbaum和Gorter兩位學者根據ICF提出的六個F開頭詞彙（F words），其中對應身體功能和身體構造的\n是：", "options": {"A": "樂趣（Fun）", "B": "體能（Fitness）", "C": "家庭（Family）", "D": "未來（Future）"}, "images": [], "answer": "B", "explanation": "F-words 中對應身體功能與構造的是 'Fitness'(體能)；故選 B。"}, {"n": 44, "stem": "下列何者最符合現代「以家庭為中心的早期療育」的概念？", "options": {"A": "以家庭為中心是一種概念，不受限於場地，因此在醫療院所也可以實踐以家庭為中心的早期療育", "B": "為了避免不必要的糾紛，治療師應該只提供給家庭關於正式支持系統的資源，不要主動建議非正式支持資 源", "C": "為了幫助身心障礙幼兒達到最佳發展潛能，所有家庭成員都應該犧牲個人需求，全力支持早期療育的進行", "D": "個別化教育計畫（IEP）是針對兒童在學校的生活與學習計畫，因此不需要考量以家庭為中心的概念"}, "images": [], "answer": "A", "explanation": "家庭中心早療在醫療院所、家庭、社區皆可實施；故選 A 正確。"}, {"n": 45, "stem": "有200位健兒門診的幼兒接受發展篩檢，之後再經由早療評估中心進行發展診斷，評估結果如下表，則下列\n何項效度指標數值正確？", "options": {"A": "敏感度=97.8%", "B": "特異度=88.9%", "C": "陽性預測率=90.9%", "D": "陰性預測率=98.9%"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAi8AAACOCAIAAAB2aX9xAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAPvklEQVR4nO2c0ZLjugpF8/8/3ffhVmV8LNhCSHaMvNbDVGxLgERgW12V+fwBAAD8ms+vAwAAAECNAADgAaBGAADwe2w1+gAAAFxPX40u0T6A+lAdAKtAjQDyUB0Aq0CNAPJQHQCrQI0A8lAdAKtAjQDyUB0Aq0CNAPJQHQCrQI0A8lAdAKtAjQDybFkd7aLEMod24Du4O+v065OuBc9gcFhkbjc8L+bggO5TYTk+5smgRgB5NqgO8TvE47/fwcHpguNEEZW4LzTm9Ln14t3R0UbC634Z9IDu06HtrcgHNQJIs0d1xJt7d27OUWtEyMBpVnvZ7csJv14MQ3OPfrXrSGC54J8MagSQZ5vq8Br0t28OnRK0l+5LvfDYjm8vhffuYSKoRkP326d6H4KBoUYA8I+dqsN8YRf3j0/jRMIQrj+WULWNfghvuhmwWIXWj09PL7titmR7nwxqBJBnm+qISI73KH3Z3ux2/+PlSZlMoRKYfrvCdhwZl4eIXnbVKHGnFqgRQJ49qsNroKebpiYF5ae9b9o/DTgNFlGZRlrXQi1O083Mmjvgrd1zOjrdexq5U4sPagSQpnp1tP3RbMeeTvxZ/V2gIzE/i6jEioZcHy1/HEk7Go8sITEmIoQzO/x8PqgRQJr9qqOrRt74yGXCQjtY9+Jg2N7T7kpn1Kjd27iu5O7UAjUCyLNHdeiefhrQzk1cekJi+vUsdO+b0Q41fVM/vPFd1+IygWeh7ncSNQLIs0d1RBql6H2jxKPyenpaEnLxe766072ovk/NCM3Bo3QX/kA+qBFAmj2qo11FvMd5PTfu0TPbvX9q6G1/N9fV9RuPXIwXinKKNicnpVXHAzUCyLNBdXh9MNd2vfGn1imab9tkvYmnO90YtF+9TLGu7jBh03wUjOH47x6gRgB5NqgO3fq9YZExo48 tus）的評估內容？", "options": {"A": "家庭年收入", "B": "家長教育程度", "C": "子女人數", "D": "家長職業狀況"}, "images": [], "answer": "C", "explanation": "家庭社經地位 (SES) 評估：年收入、家長教育、職業；子女人數通常不在 SES 評估內；故選 C。"}, {"n": 51, "stem": "下列何者最不能提升家長的親職功能？", "options": {"A": "幫助家長瞭解孩子所表現出來的行為訊息", "B": "提升家長對於一般兒童發展的知識", "C": "幫助家長瞭解孩子的疾病進展與預後", "D": "促進家長尊重並完全順從治療師的專業意見"}, "images": [], "answer": "D", "explanation": "完全順從治療師意見不利於建立家長親職功能（應促進家長自主決策）；故 D 錯誤。"}, {"n": 52, "stem": "有關腦性麻痺兒童使用各類型直立擺位輔具目的之敘述，下列何者錯誤？", "options": {"A": "直立式站立架可提供下肢承重訓練", "B": "仰式站立架可提供頭頸與上臂支撐訓練", "C": "站立箱用於下肢和軀幹控制較佳的兒童", "D": "趴式站立架適用於頭部控制尚可，但軀幹較弱的兒童"}, "images": [], "answer": "B", "explanation": "仰式站立架主要訓練『下肢承重』與軀幹伸直，不是頭頸與上臂支撐；B 描述錯誤。"}, {"n": 53, "stem": "欲了解一名經期後年齡（postmenstrual age）36週之早產兒的神經動作表現，下列何項評估工具最不適\n合？", "options": {"A": "整體動作評估（General Movement Assessment）", "B": "中文版新生兒神經行為評估量表（Neonatal Neurobehavioral Examination-Chinese version）", "C": "嬰幼兒動作評估量表（Test of Infant Motor Performance）", "D": "阿爾伯塔嬰兒動作量表（Alberta Infant Motor Scale）"}, "images": [], "answer": "D", "explanation": "AIMS 適用於『出生至 18 個月』的『獨立坐到行走前』階段嬰兒；36 週 PMA 的早產兒應用其他工具（如 GMA、TIMP、NNE）；故 D 不適合。"}, {"n": 54, "stem": "一名極低出生體重早產兒即將從中重度病房出院返家，下列何者非適當的物理治療介入？", "options": {"A": "確認家長是否能察覺早產兒的壓力徵象行為訊號，並給予適當回應", "B": "教導家長應用家中毛巾提供趴姿支持性擺位，以協助早產兒入睡", "C": "觀察家長的餵食技巧，確認早產兒的進食狀況與安全", "D": "提供兒童發展相關之資源與資訊"}, "images": [], "answer": "B", "explanation": "極低出生體重早產兒應採『側躺或仰躺』，不應用毛巾製造『趴姿』(SIDS 風險)；B 錯誤。"}, {"n": 55, "stem": "在一般的狀況之下，出生後3天內，下列那一種擺位方法，最能降低懷孕週數32週以下之早產兒發生腦室內\n出血的風險？", "options": {"A": "頭部擺位於正中位置，並且床頭抬高30度", "B": "頭部隨重力之作用轉至任一側皆可，並且床頭抬高至45度", "C": "頭部擺位於屈曲60度位置，並且床頭抬高45度", "D": "頭部擺位於伸直30度位置，並且床頭抬高15度"}, "images": [], "answer": "A", "explanation": "出生 3 天內 IVH 預防：頭部正中位+床頭抬高 30°（避免 jugular vein 阻塞與 ICP 變化）；故選 A。"}, {"n": 56, "stem": "一位患有半邊痙攣型腦性麻痺的4歲男童，患側下肢被動關節活動無明顯受限，在整個步態週期有明顯蹠屈\n（plantar flexion），站立期膝過度伸直和髖關節過度彎曲並有腰椎前凸（lordosis）增加的情況，在此\n階段那一種治療最不可能被專業團隊考慮？", "options": {"A": "腓腸肌延長術（lengthening of gastrocnemius muscle）", "B": "站姿下腓腸肌牽拉運動", "C": "腓腸肌注射肉 ": "與家長或兒童討論，選擇兒童喜愛的物品或事件作為增強物", "B": "每次介入時，只拿出必須使用的玩具，且把玩具收納箱置於兒童視線範圍內", "C": "當兒童第一次主動收拾玩具後，立即給予增強物", "D": "隨著兒童收拾玩具行為出現的次數增加，所給予的增強物數量也逐漸增加"}, "images": [], "answer": "D", "explanation": "積極增強應在『行為發生時即時』給予；隨次數增加『減少』增強物（漸進撤離）；D 增加增強物錯誤。"}, {"n": 64, "stem": "給予智能障礙兒童治療處理的介入原則，下列何者錯誤？", "options": {"A": "依據學習原理，治療的主題內容需給予重複性、一致性且多元的活動設計", "B": "治療活動不需要考慮實際年齡，完全根據兒童的智力年齡而設計", "C": "治療活動的內容強調能融入到多元的生活領域，包括生活自理、人際關係、認知技巧", "D": "此類兒童的專注力持續時間較短，因此活動設計需增加趣味性及活潑性"}, "images": [], "answer": "B", "explanation": "智能障礙兒童治療應同時考量實際年齡（年齡適合的活動）與認知年齡，不能完全只依智力年齡；故 B 錯誤。"}, {"n": 65, "stem": "脊髓發育不全（myelodysplasia）薦椎損傷的兒童，下列臨床症狀何者正確？", "options": {"A": "臀大肌的肌力不受影響", "B": "行走時步長較同齡兒童為長", "C": "需使用助行器才能獨立行走", "D": "足部變形少見，但可能需穿戴足部裝具以保持骨骼正確排列"}, "images": [], "answer": "D", "explanation": "薦髓損傷脊柱裂兒童：腿部變形少、可能需穿足部支架保持骨骼排列；故選 D。"}, {"n": 66, "stem": "關於生產時臂神經叢損傷（birth brachial plexus injury）的病程與處置，下列敘述何者最正確？", "options": {"A": "對嬰幼兒進行動作功能訓練時搭配使用電刺激（electrical stimulation）可能有助於提升肌肉活化", "B": "若未進行手術，神經的自行恢復主要發生在第一年，之後神經功能就幾乎不會再改善", "C": "神經軸突（axon）再生的速度約每天 1 cm", "D": "物理治療應該於手術後開始，以避免在介入過程中拉扯受傷的神經，反而會造成傷害"}, "images": [], "answer": "A", "explanation": "嬰幼兒 BBPI 訓練可搭配電刺激促進肌肉活化；故選 A。神經自行恢復可達 2 年；軸突再生速度約 1 mm/天；PT 不必等手術才開始。"}, {"n": 67, "stem": "脊柱裂（spina bifida）兒童在成長過程中，若下肢動作能力惡化且大小便功能退步，但是意識狀態卻無太\n大改變，最可能是伴隨何種問題？", "options": {"A": "脊髓繫鏈（tethered spinal cord）", "B": "骨質疏鬆（osteoporosis）", "C": "肥胖（obesity）", "D": "水腦（hydrocephalus）"}, "images": [], "answer": "A", "explanation": "脊柱裂兒童下肢退化+大小便退步=『脊髓繫鏈』典型表現（脊髓被疤痕固定，隨成長被牽拉）；故選 A。"}, {"n": 68, "stem": "下列有關脊髓性肌萎縮症（spinal muscular atrophy）的敘述，何者錯誤？", "options": {"A": "第一型最為嚴重", "B": "第三型肌肉無力和萎縮開始於遠端", "C": "第二型的兒童通常可在3個月到4歲間被診斷出來", "D": "第二型即使穿下肢支架，通常無法功能性走路"}, "images": [], "answer": "B", "explanation": "SMA 第 III 型肌無力從『近端』開始（不是遠端）；故 B 錯誤。"}, {"n": 69, "stem": "下列有關青少年原發性脊柱側彎（Adolescent Idiopathic Scoliosis）之敘述，何者正確？", "options": {"A": "男孩發生的機率高於女孩", "B": "越早出現脊柱側彎的症狀，越不容易惡化", "C": "多呈現凸向左胸右腰的S型側彎", "D": "需運動、輔具或手術治療，但通常在骨骼系統成熟之前不會考慮手術治療"}, "i     if (n in state.picks[state.paper]) {
      const ok = isCorrect(state.paper, n, state.picks[state.paper][n]);
      btn.classList.add(ok ? "right" : "wrong");
    }
    if (isMarked(state.paper, n)) btn.classList.add("marked");
    btn.onclick = () => { state.viewSummary = false; state.idx[state.paper] = i; render(); };
    grid.appendChild(btn);
  }
}

function escapeHTML(s) { return s.replace(/&/g, "&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderQuestion() {
  const qs = DATA[state.paper].questions;
  const i = state.idx[state.paper];
  const q = qs[i];
  const pick = state.picks[state.paper][q.n];
  const locked = !!pick;
  const correct = q.answer;
  const total = qs.length;
  progressEl.textContent = `第 ${i+1} 題 / 共 ${total} 題　·　已作答 ${picksDone(state.paper)}　·　目前得分 ${score(state.paper)}`;

  let imgsHTML = "";
  for (const u of q.images) imgsHTML += `<img class="qimg" src="${u}" alt="題目附圖">`;

  let optsHTML = "";
  for (const k of ["A","B","C","D"]) {
    let cls = "opt";
    if (locked) {
      cls += " locked";
      const isCorrLetter = (correct !== "#" && correct.indexOf(k) >= 0);
      if (isCorrLetter) cls += " correct";
      else if (k === pick && correct !== "#") cls += " wrong";
      else if (correct === "#" && k === pick) cls += " correct";
    }
    optsHTML += `<button class="${cls}" data-k="${k}" ${locked ? "disabled" : ""}>
      <span class="label">${k}.</span><span>${escapeHTML(q.options[k] || "")}</span>
    </button>`;
  }

  let verdictHTML = "";
  if (locked) {
    if (correct === "#") {
      verdictHTML = `<div class="verdict note">
        <h3>本題經考選部公告「一律給分」</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else if (correct.length > 1) {
      const ok = correct.indexOf(pick) >= 0;
      const letters = correct.split("").join(" 或 ");
      verdictHTML = `<div class="verdict note">
        <h3>本題經考選部公告「答 ${letters} 均給分」　·　${ok ? "✓ 你的選擇 ("+pick+") 在正解內" : "✗ 你選 "+pick+"，未在正解內"}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else {
      const ok = pick === correct;
      verdictHTML = `<div class="verdict ${ok ? "right" : "wrong"}">
        <h3>${ok ? "✓ 答對" : "✗ 答錯"}　·　正解：${correct}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    }
  }

  main.innerHTML = `<div class="card">
    <div class="qhead">
      <span class="qnum">第 ${q.n} 題</span>
      <span class="qmeta">${DATA[state.paper].label}　·　${q.images.length>0?"含附圖":"純文字"}${isMarked(state.paper, q.n) ? ' <span class="marked-badge">🔖 已標記</span>' : ''}</span>
      <button class="markbtn ${isMarked(state.paper, q.n) ? "marked" : ""}" id="markBtn" title="標記此題以便日後複習">${isMarked(state.paper, q.n) ? "🔖 已標記" : "🔖 標記"}</button>
    </div>
    <div class="stem">${escapeHTML(q.stem)}</div>
    ${imgsHTML}
    <div class="opts">${optsHTML}</div>
    ${verdictHTML}
    <div class="nav">
      <button class="btn ghost" id="prevBtn" ${i===0?"disabled":""}>← 上一題</button>
      <button class="btn" id="nextBtn" ${i===total-1?"disabled":""}>下一題 →</button>
      <button class="btn ghost" id="clearBtn" ${locked?"":"disabled"}>清除本題作答</button>
      ${i===total-1?'<button class="btn" id="finishBtn">完成本卷 / 看總結</button>':""}
    </div>
  </div>`;

  // wire up
  main.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => {
      if (locked) return;
      const k = el.getAttribute("data-k");
      state.picks[state.paper][q.n] = k;
      savePicks();
      render();
    };
  });
  $("#prevBtn").onclick = () => { if (i>0) { state.idx[state.paper] = i-1; render(); } };
  $("#nextBtn").onclick = () => { if (i<total-1) { state.idx[state.paper] = i+1; render(); } };
  $("#clearBtn").onclick = () => { delete state.picks[state.paper][q.n]; savePicks(); render(); };
  $("#markBtn").onclick = () => { toggleMark(state.paper, q.n); render(); };
  const fb = document.getElementById("finishBtn");
  if (fb) fb.onclick = () => { state.viewSummary = true; render(); };
}

function renderSummary() {
  const qs = DATA[state.paper].questions;
  const total = qs.length;
  const done = picksDone(state.paper);
  const s = score(state.paper);
  const pct = ((s/total)*100).toFixed(1);
  progressEl.textContent = `本卷總結　·　已作答 ${done}/${total}　·　得分 ${s}　·　已標記 ${markedCount(state.paper)}`;

  const wrongRows = [];
  for (let i = 0; i < qs.length; i++) {
    const q = qs[i];
    const pick = state.picks[state.paper][q.n];
    if (pick === undefined) continue;
    if (q.answer === "#") continue;
    if (pick === q.answer) continue;
    const stemShort = q.stem.length > 50 ? q.stem.slice(0, 50) + "…" : q.stem;
    wrongRows.push(`<div class="wrong-row" data-idx="${i}">
      <strong>第 ${q.n} 題</strong>
      <span style="color:var(--red);">你選 ${pick}</span>
      <span style="color:var(--green);">正解 ${q.answer}</span>
      <span style="color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(stemShort)}</span>
    </div>`);
  }
  const unansweredRows = [];
  for (let i = 0; i < qs.length; i++) {
    if (state.picks[state.paper][qs[i].n] === undefined) {
      unansweredRows.push(`<div class="wrong-row" data-idx="${i}" style="border-color:var(--yellow);"><strong>第 ${qs[i].n} 題</strong><span style="color:var(--yellow);">未作答</span></div>`);
    }
  }

  main.innerHTML = `<div class="card summary">
    <h2>${DATA[state.paper].label} · 總結</h2>
    <div class="score">${s} / ${total}　<span style="font-size:18px;color:var(--ink-soft);">(${pct}%)</span></div>
    <div style="color:var(--ink-soft);font-size:14px;">已作答 ${done} 題　·　答對 ${s} 題　·　答錯 ${done - s} 題　·　未作答 ${total - done} 題</div>
    <div style="margin-top:18px;">
      <h3 style="margin:0 0 6px;">錯題清單（${wrongRows.length}）</h3>
      <div class="wrong-list">${wrongRows.join("") || '<div style="color:var(--ink-soft);">沒有錯題，太強了！</div>'}</div>
    </div>
    ${unansweredRows.length>0?`<div style="margin-top:14px;">
      <h3 style="margin:0 0 6px;">未作答（${unansweredRows.length}）</h3>
      <div class="wrong-list">${unansweredRows.join("")}</div>
    </div>`:""}
    ${(()=>{ const rows=[]; for (let i=0;i<qs.length;i++){ const q=qs[i]; if (!isMarked(state.paper,q.n)) continue; const pick=state.picks[state.paper][q.n]; const stemShort = q.stem.length>50?q.stem.slice(0,50)+'…':q.stem; const tag = pick===undefined?'未作答':(q.answer==='#'?'一律給分':(pick===q.answer?'答對':'答錯')); const tagColor = pick===undefined?'var(--ink-soft)':(q.answer==='#'?'var(--yellow)':(pick===q.answer?'var(--green)':'var(--red)')); rows.push(`<div class="wrong-row mk" data-idx="${i}"><strong>★ 第 ${q.n} 題</strong><span style="color:${tagColor};">${tag}</span><span style="color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(stemShort)}</span></div>`); } return rows.length>0 ? `<div style="margin-top:14px;"><h3 style="margin:0 0 6px;">🔖 已標記題目（${rows.length}）</h3><div class="wrong-list">${rows.join('')}</div><button class="btn ghost" id="clearMarksBtn" style="margin-top:8px;font-size:13px;">清除本卷所有標記</button></div>` : ''; })()}
    <div class="nav" style="margin-top:18px;">
      <button class="btn ghost" id="backBtn">← 回到題目</button>
      <button class="btn danger" id="resetBtn2">重置本卷</button>
    </div>
  </div>`;
  main.querySelectorAll(".wrong-row").forEach(el => {
    el.onclick = () => {
      state.idx[state.paper] = parseInt(el.getAttribute("data-idx"));
      state.viewSummary = false; render();
    };
  });
  document.getElementById("backBtn").onclick = () => { state.viewSummary = false; render(); };
  const cmb = document.getElementById("clearMarksBtn");
  if (cmb) cmb.onclick = () => { if (confirm("確定要清除「" + DATA[state.paper].label + "」這一卷的所有標記嗎？")) { clearAllMarks(state.paper); render(); } };
  document.getElementById("resetBtn2").onclick = () => { resetCurrent(); };
}

function render() {
  renderGrid();
  if (state.viewSummary) renderSummary();
  else renderQuestion();
}

function resetCurrent() {
  if (!confirm(`確定要清除「${DATA[state.paper].label}」這一卷的所有作答與標記嗎？`)) return;
  state.picks[state.paper] = {};
  state.marks[state.paper] = {};
  state.idx[state.paper] = 0;
  state.viewSummary = false;
  savePicks();
  saveMarks();
  render();
}

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    state.paper = t.getAttribute("data-tab");
    state.viewSummary = false;
    render();
  };
});
$("#resetBtn").onclick = resetCurrent;
$("#summaryBtn").onclick = () => { state.viewSummary = true; render(); };


// ===== Answer persistence (per-paper picks, saved to localStorage) =====
const PICKS_STORAGE_KEY = "nephron_113_cardio_picks_v1";
const QUIZ_ID = "cardio_113";  // unique id used when broadcasting summary

function loadPicks() {
  try {
    const s = localStorage.getItem(PICKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function savePicks() {
  try { localStorage.setItem(PICKS_STORAGE_KEY, JSON.stringify(state.picks)); } catch (e) {}
  broadcastProgress();
}

// Send a summary of progress to parent window if embedded in an iframe.
// Used by the dashboard (index.html) to show progress bars.
function broadcastProgress() {
  if (typeof window === "undefined") return;
  let target = null;
  try { if (window.parent && window.parent !== window) target = window.parent; } catch(e){}
  if (!target) return;
  try {
    const summary = { type: "quizSummary", quizId: QUIZ_ID, papers: {} };
    for (const tag of ["Q1","Q2"]) {
      const qs = DATA[tag].questions;
      const picks = state.picks[tag] || {};
      const marks = state.marks ? (state.marks[tag] || {}) : {};
      let answered = 0, correct = 0;
      for (const n in picks) {
        answered++;
        if (isCorrect(tag, parseInt(n), picks[n])) correct++;
      }
      summary.papers[tag] = {
        label: DATA[tag].label,
        total: qs.length,
        answered, correct,
        marked: Object.keys(marks).length,
      };
    }
    target.postMessage(summary, "*");
  } catch (e) {}
}

// Hydrate persisted picks now that PICKS_STORAGE_KEY and loadPicks are defined
state.picks = loadPicks();

// ===== Bookmarks (per-paper question marks, persisted to localStorage) =====
const MARKS_STORAGE_KEY = "nephron_113_cardio_marks_v1";
function loadMarks() {
  try {
    const s = localStorage.getItem(MARKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function saveMarks() {
  try { localStorage.setItem(MARKS_STORAGE_KEY, JSON.stringify(state.marks)); } catch (e) {}
  broadcastProgress();
}
function toggleMark(paper, n) {
  if (state.marks[paper][n]) delete state.marks[paper][n];
  else state.marks[paper][n] = true;
  saveMarks();
}
function isMarked(paper, n) { return !!state.marks[paper][n]; }
function clearAllMarks(paper) {
  state.marks[paper] = {};
  saveMarks();
}
function markedCount(paper) { return Object.keys(state.marks[paper]).length; }
state.marks = loadMarks();

// ===== Export / Download report =====
function _esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function _stamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function _nowStr() { return new Date().toLocaleString("zh-TW", {hour12: false}); }

function _filterQs(paper, filter) {
  const qs = DATA[paper].questions;
  const picks = state.picks[paper];
  if (filter === "all") return qs.slice();
  if (filter === "answered") return qs.filter(q => picks[q.n] !== undefined);
  if (filter === "unanswered") return qs.filter(q => picks[q.n] === undefined);
  if (filter === "wrong") {
    return qs.filter(q => {
      const p = picks[q.n];
      return p !== undefined && q.answer !== "#" && q.answer.indexOf(p) < 0;
    });
  }
  if (filter === "marked") return qs.filter(q => isMarked(paper, q.n));
  return qs.slice();
}

function _filterCounts(paper) {
  return {
    all: _filterQs(paper, "all").length,
    answered: _filterQs(paper, "answered").length,
    wrong: _filterQs(paper, "wrong").length,
    unanswered: _filterQs(paper, "unanswered").length,
    marked: _filterQs(paper, "marked").length,
  };
}

    } else if (!answeredFlag) {

    } else {

    }

    body += `<article class="q ${statusCls}">

</article>`;

  article.q { box-shadow: none; }
}
`;

  let main;
  if (qs.length === 0) {
    main = `<div class="empty">沒有符合條件的題目（${filterLabel}）。</div>`;
  } else {
    main = body;
  }

  const html = `<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${_esc(fileTitle)}</title>
<style>${css}</style>
</head>
<body>
<div class="wrap">
  <header class="report">
    <h1>${_esc(subjectTitle)}</h1>
    <div class="score">得分 ${correctCount} / ${total} （${pct}%）</div>
    <div class="meta">
      已作答 ${answered} 題 · 答對 ${correctCount} 題 · 答錯 ${answered - correctCount} 題 · 未作答 ${total - answered} 題 · 🔖 已標記 ${markedCount(paper)} 題<br>
      匯出範圍：<b>${filterLabel}</b>（${qs.length} 題） · 匯出時間：${_nowStr()}
    </div>
    <div class="actions">
      <button class="print-btn" onclick="window.print()">列印 / 存成 PDF</button>
    </div>
  </header>
  <main>${main}</main>
</div>
</body>
</html>`;
  return { html, fileTitle };
}

function downloadExport(filter) {
  const { html, fileTitle } = buildExportHTML(state.paper, filter);
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fileTitle + ".html";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
}

function showExportModal() {
  const modal = document.getElementById("exportModal");
  // Update counts based on current paper state
  const c = _filterCounts(state.paper);
  document.getElementById("cntAll").textContent = `(${c.all} 題)`;
  document.getElementById("cntAnswered").textContent = `(${c.answered} 題)`;
  document.getElementById("cntWrong").textContent = `(${c.wrong} 題)`;
  document.getElementById("cntUnans").textContent = `(${c.unanswered} 題)`;
  document.getElementById("cntMarked").textContent = `(${c.marked} 題)`;
  document.getElementById("exportSub").textContent =
    "本卷：" + DATA[state.paper].label + (state.paper === "Q1" ? "（114020）" : "（114090）");
  // Disable empty options
  document.querySelectorAll("#exportOpts .exp-opt").forEach(b => {
    const f = b.getAttribute("data-filter");
    b.disabled = (c[f] === 0);
  });
  modal.classList.add("show");
}
function hideExportModal() {
  document.getElementById("exportModal").classList.remove("show");
}

document.getElementById("exportBtn").onclick = showExportModal;
document.getElementById("closeExportBtn").onclick = hideExportModal;
document.getElementById("exportModal").addEventListener("click", e => {
  if (e.target.id === "exportModal") hideExportModal();
});
document.querySelectorAll("#exportOpts .exp-opt").forEach(btn => {
  btn.onclick = () => {
    const filter = btn.getAttribute("data-filter");
    if (btn.disabled) return;
    downloadExport(filter);
    hideExportModal();
  };
});

render();
// Broadcast initial state to parent (dashboard) if loaded as iframe
broadcastProgress();
</script>
</body>
</html>
