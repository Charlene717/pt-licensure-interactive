<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神經疾病物理治療學 — 114 年互動測驗</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --ink: #1f2933;
    --ink-soft: #52606d;
    --line: #e4e7eb;
    --primary: #1d6f9b;
    --primary-soft: #e6f1f7;
    --green: #2f9e44;
    --green-soft: #d3f9d8;
    --red: #c92a2a;
    --red-soft: #ffe3e3;
    --yellow: #d9a700;
    --yellow-soft: #fff4c2;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei",
                 "Noto Sans TC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
    font-size: 16px;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 14px 22px;
    position: sticky; top: 0; z-index: 10;
  }
  .h-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    background: #f1f3f5; border: 1px solid var(--line); color: var(--ink-soft);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .progress { color: var(--ink-soft); font-size: 14px; margin-left: auto; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 22px; max-width: 1400px; margin: 18px auto; padding: 0 22px; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; padding: 0 14px; } .sidebar { order: 2; position: static; } }
  .sidebar {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; height: fit-content; position: sticky; top: 78px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
  }
  .gbtn {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
    color: var(--ink-soft); font-size: 13px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .gbtn:hover { border-color: var(--primary); }
  .gbtn.cur { background: var(--primary); color: #fff; border-color: var(--primary); }
  .gbtn.right { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .gbtn.wrong { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .legend { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 4px; border: 1px solid var(--line); }
  .dot.r { background: var(--green-soft); border-color: var(--green); }
  .dot.w { background: var(--red-soft); border-color: var(--red); }
  .main { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .qhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .qnum { font-size: 22px; font-weight: 700; color: var(--primary); }
  .qmeta { color: var(--ink-soft); font-size: 13px; }
  .stem { font-size: 16px; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
  .qimg { display: block; max-width: 100%; max-height: 480px; margin: 8px 0; border: 1px solid var(--line); border-radius: 6px; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    transition: background .12s, border-color .12s;
    text-align: left;
    font-size: 15.5px;
    color: var(--ink);
  }
  .opt:hover:not(.locked) { background: var(--primary-soft); border-color: var(--primary); }
  .opt.locked { cursor: default; }
  .opt .label { font-weight: 700; min-width: 22px; }
  .opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .opt.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .verdict { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 14px; line-height: 1.7; }
  .verdict.right { background: var(--green-soft); color: #186b29; }
  .verdict.wrong { background: var(--red-soft); color: #861818; }
  .verdict.note { background: var(--yellow-soft); color: #6b4e00; }
  .verdict h3 { margin: 0 0 6px; font-size: 14px; }
  .nav { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    background: var(--primary); color: #fff; border: 0; padding: 9px 18px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: #fff; color: var(--red); border: 1px solid var(--red); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .summary { padding: 18px; }
  .summary h2 { margin: 0 0 8px; }
  .score { font-size: 32px; font-weight: 700; color: var(--primary); }
  .wrong-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .wrong-row { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .wrong-row:hover { background: var(--primary-soft); }
  .footer { color: var(--ink-soft); font-size: 12px; text-align: center; margin: 16px 0 30px; }

  .homelink { color: var(--soft); text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .homelink:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }


  /* Export modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,30,.45); display: none; align-items: center; justify-content: center; z-index: 100; padding: 18px; }
  .modal-bg.show { display: flex; }
  .modal-card { background: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.18); max-width: 460px; width: 100%; padding: 22px; }
  .modal-card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 700; }
  .modal-card .modal-sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; }
  .modal-card .opt-row { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
  .modal-card .exp-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; background: #f8f9fa; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left; color: var(--ink); }
  .modal-card .exp-opt:hover { background: var(--primary-soft); border-color: var(--primary); }
  .modal-card .exp-opt:disabled { opacity: 0.5; cursor: not-allowed; background: #f1f3f5; }
  .modal-card .exp-opt .count { color: var(--ink-soft); font-size: 12px; }
  .modal-card .hint { color: var(--ink-soft); font-size: 12px; line-height: 1.6; margin: 0 0 12px; }
  .modal-card .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }


  /* Bookmark / marker */
  .gbtn { position: relative; }
  .gbtn.marked::after {
    content: "★"; position: absolute; top: 1px; right: 3px;
    font-size: 10px; color: var(--yellow); line-height: 1;
    text-shadow: 0 0 2px #fff;
  }
  .markbtn {
    margin-left: auto; background: #fff; border: 1px solid var(--line);
    color: var(--ink-soft); padding: 6px 13px; border-radius: 999px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .markbtn:hover { border-color: var(--yellow); color: var(--yellow); }
  .markbtn.marked { background: var(--yellow-soft); color: #6b4e00; border-color: var(--yellow); font-weight: 600; }
  .qhead { flex-wrap: wrap; }
  .marked-badge { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--yellow-soft); color: #6b4e00; font-size: 11px; border: 1px solid var(--yellow); margin-left: 4px; }
  .wrong-row.mk { border-color: var(--yellow); }

</style>
</head>
<body>
<header>
  <div class="h-row">
    <a class="homelink" href="../../../index.html" title="回到測驗首頁">← 回首頁</a>
    <h1>神經疾病物理治療學 · 民國 113 年</h1>
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="Q1">第一次 (114020)</button>
      <button class="tab" data-tab="Q2">第二次 (114090)</button>
    </div>
    <div class="progress" id="progress"></div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div style="font-size:13px;color:var(--ink-soft);margin-bottom:6px;">題號（共 80 題）</div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="dot r"></i>答對</span>
      <span><i class="dot w"></i>答錯</span>
      <span style="color:var(--yellow);">★ 已標記</span>
    </div>
    <button id="resetBtn" class="btn danger" style="margin-top:12px;width:100%;font-size:13px;">重置本卷作答</button>
    <button id="summaryBtn" class="btn ghost" style="margin-top:6px;width:100%;font-size:13px;">查看本卷總結</button>
    <button id="exportBtn" class="btn ghost" style="margin-top:6px;width:100%;font-size:13px;">📤 匯出結果…</button>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="footer">資料來源：考選部 113 年第一次／第二次專技高等考試 · 物理治療師 · 神經疾病物理治療學</div>

<div class="modal-bg" id="exportModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h3>匯出測驗結果</h3>
    <div class="modal-sub" id="exportSub">本卷：第一次 (114020)</div>
    <div class="opt-row" id="exportOpts">
      <button class="exp-opt" data-filter="all">📄 全部題目（含詳解） <span class="count" id="cntAll"></span></button>
      <button class="exp-opt" data-filter="answered">📝 僅已作答 <span class="count" id="cntAnswered"></span></button>
      <button class="exp-opt" data-filter="wrong">❌ 僅錯題 <span class="count" id="cntWrong"></span></button>
      <button class="exp-opt" data-filter="unanswered">⏳ 僅未作答 <span class="count" id="cntUnans"></span></button>
      <button class="exp-opt" data-filter="marked">🔖 僅已標記 <span class="count" id="cntMarked"></span></button>
    </div>
    <p class="hint">將下載一份自包含的 .html 檔，可離線檢視。打開後可用瀏覽器「列印」（Ctrl/⌘+P）→「另存為 PDF」存成 PDF。</p>
    <div class="modal-actions">
      <button class="btn ghost" id="closeExportBtn">取消</button>
    </div>
  </div>
</div>

<script>
const DATA = {"Q1": {"label": "第一次", "questions": [{"n": 1, "stem": "有關動作控制理論中「動作程式」之敘述，下列何者正確？", "options": {"A": "產生動作之前，會在中樞神經系統內準備而形成的具體的神經網路記憶結構", "B": "動作程式存在於中樞系統中", "C": "必須在有感覺回饋下，才能產生動作型態", "D": "動作程式是一種閉鏈式理論"}, "images": [], "answer": "B", "explanation": "動作程式存在於中樞神經系統中（B 對）。其他選項：動作程式是抽象表徵不一定是神經網路記憶結構（A 略偏）；動作程式可在無感覺回饋下執行（C 錯）；動作程式理論屬開鏈式（D 錯）。"}, {"n": 2, "stem": "下列何者為通用動作程式（generalized motor program）中的不可變參數？ћ總時間 ќ相對時間 ѝ總力\n量 ў相對力量 џ順序", "options": {"A": "ћќѝ", "B": "ѝўџ", "C": "ћѝџ", "D": "ќўџ"}, "images": [], "answer": "D", "explanation": "GMP 不可變參數：相對時間②、相對力量④、順序⑤；可變參數：總時間、總力量、肌肉選擇。故選 D（②④⑤）。"}, {"n": 3, "stem": "下列何動作控制理論，強調動作是由上而下調控，在高階神經系統受損後，會出現原始反射性動作？", "options": {"A": "反射理論", "B": "階層理論", "C": "動作程式理論", "D": "動態系統理論"}, "images": [], "answer": "B", "explanation": "階層理論強調由上而下調控，高階受損後低階反射性動作（如原始反射）失去抑制而出現，故選 B。"}, {"n": 4, "stem": "下列現象之敘述，何者錯誤？", "options": {"A": "相較於靜態站立，中風病人在靜態站立同時進行數學計算，身體質量中心的位移面積較大", "B": "雙重任務中，認知任務的難度越高，所需要的注意力越高", "C": "病人行走時，若加上簡單數學運算，病人會因為焦慮越走越快", "D": "相較於低跌倒風險老人，高風險老人在靜態站立同時進行數學計算，身體質量中心的位移面積較大"}, "images": [], "answer": "C", "explanation": "雙重任務（dual task）下患者通常因認知資源被分散而走路會更慢、不穩；C 說「越走越快」與雙重任務干擾原則相反，錯誤。"}, {"n": 5, "stem": "下列動作學習理論，何者主張學習動作技巧過程中，最重要的問題是如何控制身體的自由度？", "options": {"A": "Fitts 與Posner 的三階段模型（Fitts & Posner three-stage model）", "B": "Gentile 的兩階段模型（Gentile's two-stage model）", "C": "生態學理論（Ecological Theory）", "D": "Bernstein 的動作學習三階段論（Bernstein's three-stage approach to motor learning）"}, "images": [], "answer": "D", "explanation": "Bernstein 三階段論強調動作學習的核心是『控制身體自由度（degrees of freedom）』，故選 D。"}, {"n": 6, "stem": "關於神經可塑性與功能恢復的關聯性，下列敘述何者錯誤？", "options": {"A": "主要運動皮質區受損後，功能的恢復與患側大腦次級運動皮質區的重組（reorganization）有關", "B": "皮質脊髓系統受損後，功能的恢復與網狀脊髓路徑的徵召有關", "C": "小腦的功能對於主要運動皮質區受損後功能之恢復扮演重要的角色", "D": "周邊神經損傷之後，在大腦並不會有皮質重塑分布構圖（remapping）的現象發生"}, "images": [], "answer": "D", "explanation": "周邊神經損傷後大腦皮質會發生 cortical remapping（如截肢者出現殘肢以外區域代表）；D 否定此現象，錯誤。"}, {"n": 7, "stem": "有關神經可塑性的敘述，下列何者正確？", "options": {"A": "神經系統重塑不會受到環境與經驗的影響", "B": "大腦受傷後，小腦在功能的復原也扮演重要的角色，尤其和動作學習有關係", "C": "短期的神經塑性，指的是神經元間聯結數目及結構的改變", "D": "長期的神經塑性，指的是突觸連結強度或效能的提升與抑制"}, "images": [], "answer": "B", "explanation": "小腦在動作學習與大腦受傷後的功能恢復扮演重要角色（B 對）；環境經驗會影響可塑性；短期可塑性指突觸效能改變、長期才是結構變化。"}, {"n": 8, "stem": "何婆婆因腦中風左半邊偏癱，出院後仍覺左側較無力，但已可自行穿脫衣服，且每天使用助行器散步15 分\n鐘。此描述涵蓋國際健康功能與身心障礙分類系統（ICF）那些層面？ ћ身體構造 ќ身體功能 ѝ活動能力\nў社會參與 џ個人因素 Ѡ環境因素", "options": {"A": "ѝўџ", "B": "ќѝџѠ", "C": "ћќѝ", "D": "ћѝўџ"}, "images": [], "answer": "C", "explanation": "穿脫衣服=身體功能②+活動能力③；助行器散步=活動③+環境因素⑥（助行器）；故選 B（②③⑥）。"}, {"n": 9, "stem": "36 歲的盧小姐為小腦萎縮症患者，上肢功能評估結果如下：ћ指－鼻－指測試（finger-nose-finger test）\n比正常慢 ќ無法準確伸手拿起面前的寶特瓶 ѝ穿有鈕扣的衣服時無法獨立完成。以上評估結果分別對應國\n際健康功能與身心障礙分類系統（ICF）的那個層面？", "options": {"A": "ћ活動能力 ќ身體功能 ѝ活動能力", "B": "ћ身體功能 ќ活動能力 ѝ個人因素", "C": "ћ身體功能 ќ活動能力 ѝ活動能力", "D": "ћ活動能力 ќ身體功能 ѝ環境因素"}, "images": [], "answer": "C", "explanation": "指鼻指比較慢=身體功能①；無法準確拿瓶=活動能力②；穿鈕扣=活動能力③；故選 C。"}, {"n": 10, "stem": "利用固定式踝足矯具（AFO）改善中風患者的垂足問題，以減少行走失能。以國際健康功能與身心障礙分類系\n統（ICF）的觀點，給予AFO 是改變了那一個因子？", "options": {"A": "活動", "B": "參與", "C": "環境因素", "D": "個人因素"}, "images": [], "answer": "C", "explanation": "AFO 屬輔具，依 ICF 屬『環境因素』，故選 C。"}, {"n": 11, "stem": "急性期臥床中風偏癱個案，其患側邊呈現軟癱現象，利用治療球為其進行治療時，下列何者較不適合？", "options": {"A": "躺姿下將球置於患側邊手部下方，治療師協助進行彈壓（bouncing）治療球，可增加患側感覺刺激", "B": "斜躺坐姿（semi-sitting）下，引導個案利用健側手將身體前方的球往患側推，可誘發腹肌", "C": "躺姿下將兩側下肢彎曲置於球上，由治療師帶動球往左右轉動動作，可增加上下軀幹分節（segment）動作", "D": "坐姿下將患側上臂外展置於球上，治療師協助上臂將球做側向推拉動作，可活動患側肩關節"}, "images": [], "answer": "D", "explanation": "軟癱期患側肩半脫位風險高，將外展上臂置於球上做側推會造成肩拉力傷害，故 D 較不適合。"}, {"n": 12, "stem": "一急性期中風偏癱個案，患側上肢軟癱造成肩胛骨下壓、向下旋轉（depression, downward rotation），合\n併有肩關節半脫位，使用肌貼處理半脫位問題，下列何者最適當？", "options": {"A": "肩關節前舉至90 度，肌貼固定於前鋸肌與上斜方肌", "B": "肩關節外展至45 度，肌貼固定於前鋸肌與棘上肌", "C": "肩關節外展至45 度，肌貼固定於棘上肌與後三角肌", "D": "肩關節前舉至90 度，肌貼固定於肱二頭肌與小圓肌"}, "images": [], "answer": "C", "explanation": "肩胛下壓+下旋+半脫位處理：肌貼可固定棘上肌（拉提肱骨頭）+後三角肌（穩定肩胛），故選 C。"}, {"n": 13, "stem": "下列何者強調以主動參與和動態的動作來控制肌肉張力？", "options": {"A": "玻巴斯（Bobath）學派", "B": "布朗斯壯（Brunnstrom）治療", "C": "本體感覺神經肌肉誘發技巧（PNF）", "D": "動作再學習"}, "images": [], "answer": "A", "explanation": "Bobath 學派強調個案主動參與+動態動作以正常化張力，故選 A。Brunnstrom 用反射、PNF 用對角模式。"}, {"n": 14, "stem": "45 歲的王先生3 個月前左側殼核出血，開顱手術後在加護病房住了1 個月，右側下肢仍舊無力，僅有部分聯\n合動作（associated reaction）出現，而沒有主動動作能力，家屬希望王先生可以自己站起來移位到輪椅\n上，下列何者較不適當？", "options": {"A": "因下肢肌力太差，影響站立能力，宜使用沙包進行右下肢肌力訓練", "B": "可以利用本體感覺神經肌肉誘發技巧加強患側下肢承重能力", "C": "可以利用神經發展治療，進行患側下肢承重的功能性活動訓練", "D": "重複正確練習坐姿下軀幹前傾，讓雙下肢承重同時練習軀幹穩定的控制"}, "images": [], "answer": "A", "explanation": "下肢無主動動作的患者使用沙包做阻力訓練，僅是肌力訓練，不利功能恢復；現代神經復健不建議純肌力訓練，故 A 不適當。"}, {"n": 15, "stem": "50 歲的泥水師傅，沒有任何其他系統性疾病，右側中大腦動脈阻塞性中風已經3 週，初步理學評估發現，右\n側肢體肌力正常，左側上／下肢布朗斯壯分期皆為第五期，分數皆達滿分，但個案仍無法安全站立行走，下\n列何者與此現象較不相關？", "options": {"A": "個案可能有患側注意力缺失問題，造成無法有效使用患側肢體，而無法安全站立行走", "B": "個案如果有患側感覺缺失，可能不知道自己患側腳是否正確踏地，造成患側無法承重，而無法安全站立行走", "C": "個案可能有右側偏盲，右側視野的缺損，造成站立平衡較差，而影響站立行走", "D": "個案可能有動作協調能力問題，導致站立平衡不佳影響站立行走"}, "images": [], "answer": "C", "explanation": "MCA 中風影響上肢比下肢嚴重，又題目肌力與 Brunnstrom 滿分；C「右側偏盲」屬視野缺損，與 MCA 區域相關但右側中風應導致對側（左）視野缺損，敘述不一致；故 C 較不相關。"}, {"n": 16, "stem": "關於偏癱個案的動作誘發，下列敘述何者較符合現代玻巴斯的治療概念？", "options": {"A": "為強調動作的品質，應先由治療師帶著病患執行被動動作，避免產生不正常動作模式", "B": "為使病患較容易產生動作，動作誘發前應進行靜態的姿勢準備", "C": "強調運用重複牽拉技巧誘發主動動作", "D": "強調透過準備，使個案在適當的動態姿勢下主動產生動作"}, "images": [], "answer": "D", "explanation": "現代 Bobath 強調在動態姿勢下主動誘發動作（不是被動或靜態），故選 D。"}, {"n": 17, "stem": "下列何種本體感覺神經肌肉誘發技巧，較能協助起始動作有困難的患者開始動作？", "options": {"A": "作用肌反轉（agonist reversal）", "B": "節律啟動（rhythmic initiation）", "C": "交替性等長收縮（alternating isometric）", "D": "固定－放鬆－主動收縮（hold relax active motion）"}, "images": [], "answer": "B", "explanation": "PNF 節律啟動 (rhythmic initiation) 從被動→主動漸進過渡，最適合動作起始困難者，故選 B。"}, {"n": 18, "stem": "治療師要求中風患者平躺時的橋式運動做出左右重心轉移，此活動是根據路得理論（Rood theory）的那一個\n動作控制階段設計而來？", "options": {"A": "移動", "B": "穩定", "C": "穩定中移動", "D": "技巧"}, "images": [], "answer": "C", "explanation": "橋式運動下做左右重心轉移屬『穩定中移動』(mobile stability) 階段，故選 C。"}, {"n": 19, "stem": "一名腦中風患者行走過程中，常因擺盪末期會出現踝內翻而造成該側著地時步態不穩，根據布朗斯壯的動作\n評估，造成此步態異常，下肢最可能的問題為何？", "options": {"A": "伴隨有雷密特氏徵象（Raimiste's phenomenon）", "B": "處於第三期的屈曲協同動作", "C": "具有第二期伸直張力", "D": "缺乏第五期的足踝控制"}, "images": [], "answer": "D", "explanation": "擺盪末期出現踝內翻造成不穩，缺乏選擇性踝控制（屬 Brunnstrom 第五期能力），故選 D。"}, {"n": 20, "stem": "依據玻巴斯理論，下列何處損傷與中風後的張力與反射異常最有關？", "options": {"A": "脊髓丘腦徑", "B": "皮質脊髓徑", "C": "脊髓小腦徑", "D": "脊髓後柱內側蹄系徑"}, "images": [], "answer": "B", "explanation": "中風後上動作神經元損傷（皮質脊髓徑），導致張力異常與反射過強，故選 B。"}, {"n": 21, "stem": "脊髓損傷患者須使用前臂枴與擺盪越枴步態來行走。下列何本體感覺神經肌肉誘發技巧之模式，最適合用來\n強化上肢肌力？", "options": {"A": "D1 屈曲模式", "B": "D1 伸直模式", "C": "D2 屈曲模式", "D": "D2 伸直模式"}, "images": [], "answer": "B", "explanation": "脊損 swing-through 步態使用前臂枴需強化肩伸+內收+伸肘，符合 D1 伸直模式（肩伸、內收、內轉），故選 B。"}, {"n": 22, "stem": "下列關於限制誘發療法（constraint induced movement therapy）的敘述，何者較不適當？", "options": {"A": "應用在上肢時，能改善急性中風患者的上肢功能", "B": "應用在上肢時，能幫助患側沒有自主動作的患者產生動作", "C": "應用在上肢時，能改善慢性中風患者的上肢功能", "D": "應用在下肢時，能改善慢性中風患者的下肢動作功能"}, "images": [], "answer": "B", "explanation": "CIMT 入選條件需患側手有最低限度的主動動作（腕伸 ≥20°、指伸 ≥10°）；患側『沒有自主動作』者無法做 CIMT，故 B 不適當。"}, {"n": 23, "stem": "一位社區老人過度依賴視覺維持平衡，導致在某些情況下行走有困難，下列何測試最能突顯他的問題？", "options": {"A": "計時起走測試（timed up and go test）", "B": "說話時停止行走測試（stops walking when talking）", "C": "6 分鐘行走測試（6-minute walk test）", "D": "動態步態指標（dynamic gait index）"}, "images": [], "answer": "D", "explanation": "DGI 含轉頭、變速、跨越障礙等動態挑戰，最能凸顯依賴視覺的平衡缺失（多為動態），故選 D。"}, {"n": 24, "stem": "有關虛擬實境之敘述，下列何者最適當？", "options": {"A": "頭戴式螢幕無法提供沉浸式的虛擬實境", "B": "虛擬實境的訓練效果通常無法轉移到真實環境", "C": "在醫學方面，虛擬實境不屬於科技輔具", "D": "沉浸式的虛擬實境可能導致使用者有噁心嘔吐的副作用"}, "images": [], "answer": "D", "explanation": "VR 沉浸式訓練可能引起暈動症（噁心嘔吐），故 D 正確。其他描述錯誤（HMD 提供沉浸式、訓練效果可轉移、VR 屬輔具）。"}, {"n": 25, "stem": "腦血管病變引起的單側忽略現象，通常可被歸納為下列何者？", "options": {"A": "前大腦動脈症候群", "B": "中大腦動脈症候群", "C": "後大腦動脈症候群", "D": "椎基底動脈症候群"}, "images": [], "answer": "B", "explanation": "單側忽略多由非優勢半球（右側）頂葉損傷造成，最常見為 MCA 區域中風，故選 B。"}, {"n": 26, "stem": "進行腦中風個案視野檢查後發現個案對左側部分視野的刺激缺乏反應，因此該個案時而在檢查中頻頻將頭轉\n向左側試圖找尋治療師的手指位置，根據此一檢查結果，該個案應最符合下列何種狀況？", "options": {"A": "感覺（sensation）缺損的偏盲（hemianopsia）", "B": "知覺（perception）缺損的偏盲（hemianopsia）", "C": "感覺（sensation）缺損的忽略（neglect）", "D": "知覺（perception）缺損的忽略（neglect）"}, "images": [], "answer": "A", "explanation": "個案會主動轉頭找視覺刺激代表他『知道有缺損』（保有意識），這是感覺缺損的 hemianopsia；neglect 患者通常不知道對側有刺激，故選 A。"}, {"n": 27, "stem": "治療推者症候群（pusher syndrome）個案的姿勢問題時，下列何種策略最不適當？", "options": {"A": "使用鏡子提供身體垂直定位資訊", "B": "在偏癱側的肩膀提供阻力，促進重心轉移向偏癱側", "C": "以修正式蹠行姿勢（modified plantigrade posture）訓練站姿時，應儘量降低非偏癱側上肢的支撐與承重", "D": "鼓勵個案主動發掘並解決姿勢問題"}, "images": [], "answer": "B", "explanation": "Pusher syndrome 訓練應促進對非偏癱側的『承重與認知』（與直覺相反），不應降低；C 說「儘量降低非偏癱側支撐」錯誤；題目選 C 為最不適當。"}, {"n": 28, "stem": "85 歲的王先生左側殼核出血（putaminal hemorrage）2 週，目前狀況穩定，治療師將手指放在王先生的正前\n方，接著將手指向左右，上下移動，並要求王先生眼睛要跟上手指的動作及方向，此為下列那對腦神經之測\n試？", "options": {"A": "第三對", "B": "第五對", "C": "第七對", "D": "第十對"}, "images": [], "answer": "A", "explanation": "上下左右追視動作測試的是動眼神經（CN III）、滑車神經（CN IV）、外展神經（CN VI），其中第三對是主要動眼神經；故選 A。"}, {"n": 29, "stem": "65 歲的王先生中風2 個月，雖然有接受密集治療，上下肢動作能力恢復到布朗斯壯分期的第五期且有推者症\n候群，目前仍無法獨立行走，而且坐姿及站姿下都會往患側傾倒，沒有任何試圖保護自己的動作或害怕的樣\n子。下列敘述何者較適當？", "options": {"A": "主因為患側肌力較差，所以容易倒向患側，建議利用沙包進行患側肌力訓練", "B": "主因為中線認知有問題，應該多做一些增加中線認知的活動", "C": "會一直往患側傾倒，可能是因為王先生配合度不佳", "D": "推者症候群的個案通常預後都不好，應將治療目標設在獨立輪椅行動"}, "images": [], "answer": "B", "explanation": "Pusher syndrome 主因是中線認知（垂直感）異常，需訓練對中線的認知；A 沙包訓練無效；C 不是配合度問題；D 預後可改善（4-6 個月通常會緩解）；故選 B。"}, {"n": 30, "stem": "一位右後外側視丘受損的中風個案，患側下肢於站立時出現屈曲、重心偏向患側，且行走擺盪期易出現內收\n現象。針對個案的診斷與臨床表現，下列何種治療策略最為適合？", "options": {"A": "先透過牽拉患側腳的內收肌以降低不正常肌肉張力，再進行步態訓練", "B": "站立訓練時，提供患側下肢伸肌感覺刺激，以強化伸直動作控制", "C": "使個案兩腳分別站立於體重計上，提供視覺回饋以訓練平均承重", "D": "站立時，訓練個案健側邊靠近門框以門框為標的，進行重心轉移"}, "images": [], "answer": "D", "explanation": "後外側視丘受損常造成感覺缺損與本體感覺差。患側站立屈曲、重心偏患側、擺盪期內收，需站立時使用門框作為視覺與物理參考點訓練重心轉移，故選 D。"}, {"n": 31, "stem": "一位中風患者，左側上下肢皆為布朗斯壯第三期，第一天進行坐到站的訓練，下列那一個姿勢有利於訓練患\n者利用患側施力站起來？", "options": {"A": "", "B": "", "C": "", "D": ""}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAAHSCAIAAADZh2FLAAAACXBIWXMAAA7EAAAOxAGVKw4bAAGH/ElEQVR4nNS9abxU1Zm3zZOk0510ZzKJibGdxSFRIw44Dy + 暖身緩和；故選 C。"}, {"n": 36, "stem": "下列何者不是顱內壓升高時伴隨的臨床徵象？", "options": {"A": "意識程度降低", "B": "心律降低", "C": "視神經乳頭水腫（papilledema）", "D": "呼吸不規律"}, "images": [], "answer": "B", "explanation": "顱內壓升高時血壓上升、心律『下降』(Cushing reflex)，B 描述方向相反，錯誤（其實 B 描述「心律降低」是 Cushing 反射的特徵之一，但題目要找『不』伴隨的徵象，需更仔細看選項）。實際上 B 為 ICP 升高時的現象（Cushing reflex 中的心搏緩慢），故 B 不算「不伴隨」；題目選 B 表示 B 為「不」伴隨的，可能因為 Cushing 反射在 ICP 升高末期才出現，初期反而 HR 增快。按官方答案 B。"}, {"n": 37, "stem": "35 歲的電腦工程師王先生，小腦梗塞型中風3 週，目前仍有運動失調（ataxia）、辨距不能（dysmetria）\n及坐姿平衡差等問題，下列何者較為適當？", "options": {"A": "因為目前坐姿平衡差，建議家屬讓病人在病房先練習閉上眼睛維持坐姿平衡的運動，再張開眼睛練習", "B": "其實病人有動作能力，應該鼓勵及早使用助行器來進行走路訓練", "C": "現在就應該鼓勵病人重複練習用筷子吃飯", "D": "各項活動訓練之前，應先確認軀幹是否能維持該活動所需的姿勢穩定"}, "images": [], "answer": "D", "explanation": "小腦中風患者各活動前應先確認軀幹姿勢穩定（核心穩定→近端→遠端），故選 D。其他描述（從閉眼開始、即用助行器、馬上用筷子）皆不適當。"}, {"n": 38, "stem": "為避免上肢完全偏癱患者發生肩疼痛及肩脫位，對於病人和家屬的衛教內容，何者最不適當？", "options": {"A": "患側肩關節的擺位，側躺於患側時要避免肩關節夾擠，坐姿時患側肩膀要有支撐", "B": "上肢的上舉及外展關節運動，要特別注意肩胛骨的往上旋轉（upward rotation）及前突（protraction）", "C": "手肘伸直型的肩吊帶及肌肉神經電刺激，都可以用來降低肩半脫位的發生", "D": "鼓勵病人上肢主動活動，以健側手帶動患側手的方式，將手儘量舉高到可以活動的範圍"}, "images": [], "answer": "D", "explanation": "完全偏癱+健側手帶動患側手到極限可能拉傷肩關節（肩半脫位風險），故 D 不適當。"}, {"n": 39, "stem": "慣用手是右手的右側偏癱缺血性中風病患，需用肢體語言幫助溝通，最有可能完全阻塞的血管為下列何者？", "options": {"A": "左腦前大腦動脈", "B": "左腦中大腦動脈", "C": "左腦後大腦動脈", "D": "基底動脈"}, "images": [], "answer": "B", "explanation": "右手慣用+右側偏癱+需肢體溝通 → 左大腦語言區（Broca/Wernicke）受損 → MCA 區域，故選 B。"}, {"n": 40, "stem": "欲透過任務導向模式協助一名右側偏癱患者獨立完成以右手拿杯子喝水的任務，下列何者最佳？", "options": {"A": "由家屬幫忙對躺在治療床上的患者執行5 次上肢被動關節運動", "B": "患者平躺在治療床上，雙手握枴杖，手肘伸直並將枴杖移至頭頂10 次", "C": "患者左手以手套限制動作，右手練習拿取在桌面不同位置的5 個塑膠杯", "D": "患者站立時兩側手肘伸直、手掌張開，支撐於治療床上，維持1 分鐘"}, "images": [], "answer": "C", "explanation": "任務導向：限制健側、用實際杯子在不同位置練習拿取（功能性活動），最符合 task-oriented，故選 C。"}, {"n": 41, "stem": "下列何者不是脊髓損傷病患常有的呼吸功能障礙？", "options": {"A": "肺容積降低", "B": "呼吸肌的力量和耐力減小", "C": "血氧偏低", "D": "胸壁容量彈性增加"}, "images": [], "answer": "D", "explanation": "脊髓損傷會降低胸壁的彈性（變硬），不是增加；故 D 錯誤。"}, {"n": 42, "stem": "脊髓損傷患者於急性期之心肺功能訓練，下列何者錯誤？", "options": {"A": "可以使用姿勢引流、扣擊、震動等手法協助病患排除肺部不同部位之分泌物", "B": "可利用誘發性肺量計（incentive spirometer）經由有阻力的吸吐氣訓練，達到強化呼吸肌肉的功能", "C": "使用束腹有助於橫膈膜每次收縮的範圍加大，進而產生更大的吸氣量", "D": "可教導照顧者將手放在病患的腹部肚臍下方，向下、向內同時向頭部的方向推壓腹部，協助病患有效咳嗽"}, "images": [], "answer": "D", "explanation": "脊髓損傷急性期應協助有效咳嗽用『腹部上推（往內+往胸方向）』，但 D 描述「向下、向內、向頭部」中的『向下』方向錯誤；標準是『向上向內推』；故 D 錯誤。"}, {"n": 43, "stem": "18 歲的林小弟6 個月前在游泳池跳水造成頸椎第五節斷裂，目前C7 完全沒有感覺與動作功能，此次因肺炎\n再度入院治療，下列有關呼吸功能訓練的敘述，何者不適當？", "options": {"A": "測量林小弟最大吸氣和最大吐氣時的腋下位置周徑變化，可瞭解呼吸時胸廓是否擴張", "B": "為了改善痰液清除能力，應該加強腹肌肌力訓練", "C": "肺活量可能會降到正常的一半以下，應該加強訓練", "D": "應該加強胸大肌的肌力訓練來改善呼吸和增強咳嗽功能"}, "images": [], "answer": "B", "explanation": "C7 完全脊損腹肌完全癱瘓，無法主動訓練腹肌（沒有肌肉可訓練）；故 B 不適當。"}, {"n": 44, "stem": "下列那些症狀可能發生於男性T4 脊髓完全損傷1 天的個案？ћ下肢不易排汗 ќ勃起功能保留 ѝ低血壓\nў心跳加速", "options": {"A": "ћѝ", "B": "ќў", "C": "ѝў", "D": "ћќ"}, "images": [], "answer": "A", "explanation": "T4 急性期：交感神經中斷 → 下肢不易排汗①、低血壓③；脊髓休克使勃起反射喪失、心跳緩慢；故選 A（①③）。"}, {"n": 45, "stem": "有關脊髓損傷患者呼吸功能的問題與\n與處置方式，下列敘述何者錯誤？", "options": {"A": "外肋間肌的癱瘓無力會導致肺擴張 量減少", "B": "照護或訓練方式與其脊髓受傷節次 並無一定關聯性", "C": "腹肌與內肋間肌的癱瘓無力會影響 吐氣與咳嗽的效能", "D": "呼吸肌訓練方法包括在腹部加阻力 、使用自誘性呼吸訓練器（incentive spirom meter）等"}, "images": [], "answer": "B", "explanation": "脊損呼吸照護策略需依損傷節次（C5 以上、T1 以上、T6 以上各有不同）；B 否認與節次的關聯，錯誤。"}, {"n": 46, "stem": "關於脊髓損傷之機能損傷等級（ASI\nA impairment scale），下列敘述何者正確？\n？", "options": {"A": "四肢癱瘓是指胸、腰或薦髓損傷， 造成雙下肢、軀幹或骨盆腔的感覺與運動功能 能不同程度之喪失", "B": "ASIA A 為完全性損傷，薦髓無任何 何感覺和運動功能的保留", "C": "ASIA D 為不完全性損傷，在脊髓損 損傷區以下，會有一半以上關鍵肌的肌力低於 3 分", "D": "不完全性脊髓損傷可由肛門皮膚黏 膜交界是否有動作判定"}, "images": [], "answer": "B", "explanation": "ASIA A 為完全性損傷，S4-S5 無感覺與運動，故 B 正確。四肢癱瘓是頸髓損傷；ASIA D 是大多數關鍵肌 ≥3 分；不完全性由 S4-S5 是否有感覺/動作判定。"}, {"n": 47, "stem": "38 歲脊髓損傷患者接受第一次評估\n，其感覺和動作的表現如下表。依ASIA 分類\n，其神經機能損傷等級為\n何？", "options": {"A": "ASIA B，神經受傷等級C8；部分殘 殘留區域T1", "B": "ASIA A，神經受傷等級C7", "C": "ASIA C，神經受傷等級C6；部分殘 殘留區域T1", "D": "ASIA D，神經受傷等級C8"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAACJCAIAAAAZuZLLAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAwVElEQVR4nO2dd3QVx/n3OTmxT5wEHyfuDjY ion": "LOCF 第四級為躁動混亂期，需固定一致的環境與指令以降低焦慮；故選 D。"}, {"n": 53, "stem": "創傷後失去意識的時間是創傷性腦傷嚴重度的重要指標。一般而言，輕度創傷性腦傷失去意識的時間應小於\n多少分鐘？", "options": {"A": "30", "B": "60", "C": "90", "D": "120"}, "images": [], "answer": "A", "explanation": "輕度 TBI（mTBI）失去意識時間 < 30 分鐘，故選 A。"}, {"n": 54, "stem": "不同於腦損傷患者的物理治療，巴金森氏病患者的物理治療更著重提示策略。下列關於提示策略之敘述，何\n者錯誤？", "options": {"A": "患者由於基底核受損，內在學習不足或喪失，缺乏足夠內在提示，產生起始動作困難及動作緩慢等動作障礙", "B": "藉由內在提示策略，可以促進患者的額葉活化，增加注意力", "C": "地上畫橫線，可促進患者跨步的步長", "D": "利用節拍器發出有節奏的聲音，可促進患者增加步數"}, "images": [], "answer": "B", "explanation": "PD 提示策略主要使用『外在提示』(視覺、聽覺) 來繞過缺損的內在提示；B 說「內在提示」錯誤。"}, {"n": 55, "stem": "下列何種行走表現最不會出現於原發性巴金森氏病患者？", "options": {"A": "跨步距離變短", "B": "走路速度變慢", "C": "走路起步時啟動困難", "D": "走路時雙手交替擺動幅度變大"}, "images": [], "answer": "D", "explanation": "PD 步態雙手擺動『減少』（動作幅度減小），不是增大；故 D 不會出現。"}, {"n": 56, "stem": "關於侯葉氏分期1～2.5 的巴金森氏病患者，下列何者評估的需求性最低？", "options": {"A": "害怕跌倒程度", "B": "關節僵硬程度", "C": "躺於床上的擺位姿勢", "D": "認知功能"}, "images": [], "answer": "C", "explanation": "H&Y 1-2.5 期的 PD 患者仍能自行翻身與床上活動；『躺床擺位』評估需求性最低，故選 C。"}, {"n": 57, "stem": "原發性巴金森氏病患者在疾病初期，最不可能出現下列何種症狀？", "options": {"A": "寫字變小", "B": "嚴重的姿勢性低血壓與膀胱功能障礙", "C": "面具臉", "D": "單側肢體出現靜止性顫抖與動作變慢"}, "images": [], "answer": "B", "explanation": "PD 早期不會出現嚴重姿勢性低血壓與膀胱障礙（後者屬晚期或多系統萎縮 MSA）；故選 B。"}, {"n": 58, "stem": "迷你心智量表（MMSE）中，其中一項測試為評估者說出3 個名詞後，要求個案立即說出這3 個名詞，這項測\n試是評估認知功能中的那個面向？", "options": {"A": "記憶力", "B": "注意力", "C": "定向感", "D": "語言"}, "images": [], "answer": "B", "explanation": "MMSE 立即重複 3 個物品名是『注意力』與短期登錄；故選 B。"}, {"n": 59, "stem": "促進認知功能的健腦操設計應儘可能包含下列那些元素？ћ身體柔軟度 ќ越過身體中線的動作 ѝ手眼協\n調 ў雙重任務 џ專注力和反應力", "options": {"A": "ћќѝўџ", "B": "僅ќѝўџ", "C": "僅ћќѝў", "D": "僅ќѝў"}, "images": [], "answer": "B", "explanation": "健腦操：跨中線②、手眼協調③、雙重任務④、專注反應⑤皆是核心元素；身體柔軟度①不是健腦核心；故選 B。"}, {"n": 60, "stem": "一位40 歲小腦損傷患者，其影像學檢查呈現絨球小結葉（flocculonodular lobe）受損，則下列那項反射功\n能最可能出現異常？", "options": {"A": "對稱張力迷路反射（symmetrical tonic labyrinthine reflex）", "B": "腰張力反射（tonic lumbar reflex）", "C": "不對稱性頸張力反射（asymmetrical tonic neck reflex）", "D": "前庭動眼反射（vestibulo-ocular reflex）"}, "images": [], "answer": "D", "explanation": "Flocculonodular lobe（前庭小腦）受損影響 VOR、姿勢平衡；故選 D。"}, {"n": 61, "stem": "使用指－鼻－指（finger-nose-finger）測試來評估小腦功能損傷患者，下列敘述何者錯誤？", "options": {"A": "主要是用來評估辨距不良", "B": "快速執行此測試，常會有動作超過", "C": "慢速執行此測試，常會有動作不足", "D": "主要是用來評估肘關節的單關節動作控制"}, "images": [], "answer": "D", "explanation": "Finger-nose-finger 評估辨距、震顫、協調，包含跨多關節的整合；D 說「單關節動作控制」錯誤。"}, {"n": 62, "stem": "42 歲多發性硬化症的患者，最近一次發作後經過3 個月治療，可以在住家附近的公園使用助行器散步。2 個\n月前因為右側肢體無力入院，經診斷為左側殼核受損，治療至今，患者可自行完成翻身、側身起床，且坐姿\n平衡佳，上肢布朗斯壯分期第三期，下肢布朗斯壯分期第四期。下列那一種治療方式較不適當？", "options": {"A": "行走訓練可以考慮使用部分載重的懸吊系統，減輕體重負荷", "B": "應該利用阻力型腳踏車，給予高阻力高強度的訓練來加強心肺耐力", "C": "可以利用本體感覺神經肌肉誘發技巧的手法加強患側腳的承重能力", "D": "教導個案應該重複練習活動，但要少量多次，不可以做到全身冒汗"}, "images": [], "answer": "B", "explanation": "MS + 中風患者運動應低-中強度為主、避免疲勞；高阻力高強度可能加劇 MS 疲勞，故 B 不適當。"}, {"n": 63, "stem": "有關多發性硬化症，下列敘述何者錯誤？", "options": {"A": "主要是因神經肌肉接合處損傷造成", "B": "最常見的類型為復發緩解型", "C": "常注射皮質類固醇來緩解急性發作", "D": "常注射β干擾素來減緩惡化速度"}, "images": [], "answer": "A", "explanation": "MS 是中樞神經去髓鞘疾病（不是神經肌肉接合處），故 A 錯誤。"}, {"n": 64, "stem": "下列疾病何者容易引發中樞性疲乏？", "options": {"A": "後小兒麻痺症候群", "B": "多發性硬化症", "C": "基蘭－巴瑞氏症候群", "D": "重症肌無力"}, "images": [], "answer": "B", "explanation": "MS 容易引發中樞性疲乏（central fatigue），故選 B。GBS、後小兒麻痺、MG 多為周邊或肌肉性疲乏。"}, {"n": 65, "stem": "下列何種疾病是因為個體對銅的代謝異常，而導致基底核病變？", "options": {"A": "威爾森氏症", "B": "亨丁頓氏症", "C": "巴金森氏病", "D": "阿茲海默症"}, "images": [], "answer": "A", "explanation": "Wilson's disease（威爾森氏症）是銅代謝異常導致基底核損害，故選 A。"}, {"n": 66, "stem": "小張30 歲是哈佛大學博士畢業的電腦軟體設計工程師，目前未婚，3 個月前昏倒送醫診斷為星狀細胞瘤第四\n級（astrocytomas, grade 4），雖然醫師一致覺得預後不佳，但小張仍然接受了手術切除及放射治療。目\n前，小張因為右側肢體無力，日常生活仍需家人完全協助。有關物理治療目標與處置的敘述，下列何者正\n確？", "options": {"A": "小張是個有高學識背景的年輕人，治療目標應設定在回到工作崗位上繼續原來的工作", "B": "小張年輕有為而且未婚，應該要治療到可以自己正常行走，治療時要避免使用代償功能", "C": "小張已經完成了相關手術及放射治療，表示腫瘤已經受到控制，加上物理治療可促進神經塑性，應該將目標 訂在回歸日常生活獨立", "D": "治療目標的設定應該與家屬和小張共同商量，先從日常生活可以減少依賴他人協助開始"}, "images": [], "answer": "D", "explanation": "高惡性度腫瘤（GBM）治療目標應與家屬共同商量，從降低依賴開始，符合現實期待；故選 D。"}, {"n": 67, "stem": "下列何者不是交感神經受損之臨床症狀？", "options": {"A": "出現灼熱感", "B": "指甲生長快速", "C": "排汗異常", "D": "溫度調控障礙"}, "images": [], "answer": "B", "explanation": "交感神經受損臨床表現：灼熱感、排汗異常、溫度調控異常、皮膚變化；指甲生長『緩慢』而非快速；故 B 錯誤。"}, {"n": 68, "stem": "關於造成後小兒麻痺症候群（post-polio syndrome）之可能因素，下列何者最不適當？", "options": {"A": "長期不使用受影響的肌肉", "B": "小兒麻痺發病時期潛伏在身體的病毒再次活動", "C": "老化", "D": "運動神經元軸突生長功能受損"}, "images": [], "answer": "A", "explanation": "Post-polio syndrome 機轉與長期未使用無關，反而是『過度使用』導致殘存運動神經元負擔過重退化；故 A 不適當。"}, {"n": 69, "stem": "有關周邊神經病變之物理治療介入，下列何者錯誤？", "options": {"A": "手術後，在臥床時應注意肢體適當擺位，以避免神經再度受傷", "B": "手術後，患側肢體宜在固定期後及早開始活動，以預防攣縮及沾黏", "C": "神經失用症（neuropraxia）患者不需積極治療，但應避免進一步傷害並等待恢復", "D": "可以利用神經肌肉電刺激治療來加速神經再生，但應注意不要用於有感覺喪失的患者"}, "images": [], "answer": "D", "explanation": "周邊神經感覺喪失區域使用 NMES 並無禁忌，反而可協助再支配；D 描述「不要用於有感覺喪失」錯誤。"}, {"n": 70, "stem": "有關周邊神經損傷之預後，下列敘述何者錯誤？", "options": {"A": "軸突斷傷（axonotmesis）之預後較神經斷裂（neurotmesis）為佳", "B": "神經損傷部位在肢體遠端者，相較於肢體近端者，神經再支配所需時間較久", "C": "受傷部位出現水腫或疤痕，預後較差", "D": "年紀較輕的患者較年長的患者，預後較佳"}, "images": [], "answer": "B", "explanation": "周邊神經損傷部位『遠端』者，神經再生路徑短，所需時間『較短』（不是較久）；故 B 錯誤。"}, {"n": 71, "stem": "一位患者抱怨2 天前開始有不平衡及眩暈的症狀，在進行檢查時，發現患者在坐姿時，將頭往左傾斜有純垂\n直方向且擺動性的眼球震顫，而眼球震顫的方向不會因頭部姿勢改變而有任何變化。除此之外，搖頭誘發眼\n震測試（head-shaking induced nystagmus test）結果為陰性。關於此患者症狀之敘述下列何者正確？ћ\n可能是由中樞神經系統異常導致 ќ可能是由周邊前庭系統異常導致 ѝ針對後半規管的豪派－狄克測試結果\n應為陽性 ў眼球平滑追蹤測試正常 џ眼球快速掃視測試異常", "options": {"A": "ћџ", "B": "ќѝ", "C": "ћў", "D": "ќў"}, "images": [], "answer": "A", "explanation": "純垂直方向眼震、不受頭位改變、HSN 陰性 → 中樞性病變①；眼球快速掃視可能異常⑤；故選 A（①⑤）。"}, {"n": 72, "stem": "張先生抱怨平時在從事日常活動，特別是轉頭或轉身時，會有頭暈不平衡的症狀。治療師評估後發現其眼球\n水平追視（pursuit）及水平跳視（saccade）正常，頭部猛推測試（head impulse test）往右側轉時異常，\n豪派－狄克測試為陰性。治療師應採用下列何項訓練較為合適？", "options": {"A": "伊普萊操作手法（Epley procedures）", "B": "法朗克氏運動（Frenkel exercise）", "C": "以阮柏氏站姿（Romberg’s stance）同時看著前方時鐘的中心點並上下點頭", "D": "在站姿下訓練轉身，儘量保持頭部穩定且跟著身體一起轉動，先訓練往右側轉，再訓練往左側轉"}, "images": [], "answer": "C", "explanation": "Head impulse test 異常+水平追視/掃視正常+Hallpike 陰性 → 單側前庭病變；訓練『凝視穩定』(VOR×1，看固定點上下點頭)，故選 C。"}, {"n": 73, "stem": "關於前庭功能測試，下列敘述何者正確？", "options": {"A": "兩側溫差測驗（caloric test），檢測內耳耳蝸是否受損導致耳鳴症狀", "B": "眼振電圖儀（electronystagmography）可量化眼球位置及移動，偵測異常的前庭脊髓反射", "C": "旋轉椅檢查（rotary chair test），利用頭部旋轉偵測眼球震顫，來診斷水平面半規管是否正常", "D": "在執行頭部猛推測試（head thrust test）前不必先評估個案的頸椎活動度"}, "images": [], "answer": "C", "explanation": "旋轉椅檢查利用頭旋轉誘發水平半規管的眼球震顫，診斷半規管功能；故選 C。其他描述錯誤。"}, {"n": 74, "stem": "關於前庭復健的治療原則，下列何者錯誤？", "options": {"A": "以轉頭、點頭、轉動身體、改變行走方向或速度、轉圈等方式給予刺激", "B": "先從張眼練習，進展到閉眼練習", "C": "先從站在平地練習，進展到站在軟墊上練習", "D": "先從雙腳併攏站立練習，進展到加大雙腳底面積站立練習"}, "images": [], "answer": "D", "explanation": "前庭復健漸進原則：先大支撐底面積→小支撐底面積；D 說「先併攏→加大」方向反，錯誤。"}, {"n": 75, "stem": "有關基蘭－巴瑞氏症候群之臨床徵候，下列何者錯誤？", "options": {"A": "是一種急性多發性神經炎，可能侵犯身體的運動、感覺及自主神經系統", "B": "主要臨床症狀為對稱性發展，肌肉無力通常由遠端開始，特徵為從下肢雙腿無力擴及上肢與面部之上行性肌 肉無力", "C": "嚴重者於受影響的肢體會有深度肌腱反射增強情形", "D": "患者也常出現由遠端到近端的肢段疼痛、感覺異常或麻木現象"}, "images": [], "answer": "C", "explanation": "GBS 為 LMN 損傷，深層肌腱反射『減弱或消失』，不是增強；故 C 錯誤。"}, {"n": 76, "stem": "關於重症肌無力之敘述，下列何者最不適當？", "options": {"A": "為一種自體免疫系統疾病，由於乙醯膽鹼接受器遭到破壞而影響神經與肌肉接合處的神經傳導功能", "B": "通常為四肢肌肉最早受影響", "C": "多數患者可經由藥物治療使症狀改善", "D": "介入原則主要是維持正確且固定之運動模式，避免過度活動造成肌肉疲勞"}, "images": [], "answer": "B", "explanation": "MG 通常以『眼肌』先受影響（眼皮下垂、複視），不是四肢；故 B 不適當。"}, {"n": 77, "stem": "使用Otago 運動計畫協助一位居家長者進行預防跌倒及強化平衡能力訓練，下列何項是最常會使用的器材？", "options": {"A": "彈力帶", "B": "可綁式沙包", "C": "搖晃板", "D": "直徑16～20 公分球"}, "images": [], "answer": "B", "explanation": "Otago 計畫使用 ankle weights（可綁式沙包）做下肢肌力訓練，是核心器材；故選 B。"}, {"n": 78, "stem": "下列何者不包含在世界衛生組織之長者整合性照護指引（ICOPE）中所提出的6 個關鍵指標評估？", "options": {"A": "視力障礙", "B": "憂鬱情形", "C": "睡眠品質", "D": "聽力障礙"}, "images": [], "answer": "C", "explanation": "ICOPE 6 大關鍵指標：行動、營養、視力、聽力、認知、心情；不含『睡眠品質』；故選 C。"}, {"n": 79, "stem": "83 歲蕭爺爺因脊椎退化長骨刺，到醫院接受腰椎壓迫手術，術後有下背部傷口疼痛及下肢無力的狀況，平日\n起身、移位及日常生活功能多需家人協助。家屬欲申請長照居家復能服務，下列何者是物理治療居家復能的\n主要目標？", "options": {"A": "訓練軀幹核心肌群減少腰椎壓迫", "B": "增加下肢肌力", "C": "完成獨立坐到站", "D": "避免下肢關節攣縮"}, "images": [], "answer": "C", "explanation": "腰椎手術後居家復能主要目標是恢復獨立功能（如自行坐到站，最直接影響日常生活），故選 C。"}, {"n": 80, "stem": "下表為80 歲男性的體適能檢測結果。個案平時沒有運動的習慣。根據檢測結果，應給予何種運動訓練計畫，\n以改善其體適能？", "options": {"A": "先以低強度有氧及阻力運動訓練2 週，接著以中強度有氧及阻力運動訓練2 週後，再加入平衡訓練", "B": "先進行高難度之平衡訓練，使平衡表現>50%後，再進行中強度有氧及阻力運動訓練", "C": "在每次訓練課程中，皆同時進行低強度有氧及阻力運動訓練", "D": "以高強度有氧及阻力運動訓練2 週後，再加入高難度之平衡訓練"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAhUAAAD+CAIAAAACmmBBAAAACXBIWXMAAA7EAAAOxAGVKw4bAACfrUlEQVR4nOy9d1RV17f+/Y0x5qqxxNgTe4299xp7ifHajb33XmNHQQVRUbFhQbl2FKMBFcSuiAoiNlDEglgBrwXlp171/YwzR9a7cw4gdk9czx9n7LP3KnOtPed85txt/eeVhoaGhobGm+M/n1oADQ0NDQ2rhOYPDQ0NDY23geYPDQ0NDY23geYPDQ0NDY23geYPDQ0NDY23geYPDQ0NDY23geYPDQ0NDY23geYPDQ0NDY23geYPDQ0NDY23geYPDQ0NDY23geYPDQ0NDY23wWv44+XLl25ubl9//fV/NDQ0PgMkT55c26OGAGX4f//v/30cqogXr+eP//mf//nv//7v//u///s4AmloaCSC6OjokydPXrt27VMLovGJ8b//+7//9V//pflDQ0MjSXjx4oW9vb2npyeG+all0fjE0PyhoaHxBoA/li9ffuDAAc0fGlbJH0+fPvXy8rpz546ZBvN3z549gYGBWrM1ND4c8BfPnz//VL1j3SEhIbNnz4bJjPv5O2fOnGvXriVk/nFxcXfv3v0QItFpVFTUOzYSGRlpdb7LKvmDU5U+ffoMGTKEh4cbkxIUqG/fvt27dz9//rzZaUB1du3a9d133z179oxD69at279//8OHD6XWiBEj0LxHjx5JdxcuXBg4cGDNmjXv379vKcyJEycaNGhQunTpSpUq1alTB8H4W7FixapVq5YqVapAgQIuLi6i2RQ+e/Zs/fr1y5cvX7ly5Sr/BFV++eUXWujcubNOrTSsBej29OnTt2/fHhoaGhYWlkR/R63evXtjthia0e9T/dy5cy1atBBC4lCvXr0oxm+891cojyFXr17d1tb21q1bmPPp06fxD8SUNjY2efPm9fHxEXdGSQ8PDwqLhPzu3LkTZ4fpYW5UXLt2bY4cOX7//XfsF/PESJs1a4Y9bty4MelOnKZatmxZokSJrVu3vqPrh9tmzZpVoUKF4OBga2ERq+QPhMbzenp6ogSqGEdRhSVLlkybNs3R0dEyNqEWGpkiRQoKeHt7586dWz1CkCxZMqqcOXMG7qEjV1fXtm3brl69GtUcM2aMaoouihQpguJygomALl269Oeff6I9EyZMIHY4bQKEceXKFaWyaDO8cvTo0YCAgKP/BIVXrlzZqFEjS2k1ND5boKtYEJqPOdjZ2WE7Zg/kfPXVV1iZ2U6KDR482M/Pb/369RiF8o9sHD9+/Pvvv4ddaFmiN+x9+PDhly9ftnSj7KHrdOnS5c+fH8NJlSoV3n/KlClt2rQpWbJkly5devbs+eOPPyJDmjRp2rdvT2hIay9NgD/wzhEREdLOzZs36SJXrlxYtL+/P9tEctg7AiTRfTMDtWvXnjx58vXr19/L3D548ADOq1evXqdOnawiprQy/kBQTv+9e/dwyrt372ZDYhAOtWrVavPmzRRGC1HroUOHJuSU2b948eI9e/ao/APdJR3esGEDihgUFAS7dOzY8erVqyQ6Y8eOVRbyzTffkNmQXpD3kKw8efJk2LBh2NLjx4+Zx9jYWJoyUhrCHDp0CEu4c+dOvOM6fPjw1KlT9+7day3hhobGa0EcnSFDhqRc4JILzuTxZr4SOxo4cCD5jZldsJ+ ": "Task-oriented 訓練設計兼顧 impairment、movement strategies 與 functional task，故選 C。"}, {"n": 4, "stem": "人在虛擬實境的環境中，會隨著所感知到的環境變化而產生即時因應的動作。此種「感知－行動配對」\n（perception-action coupling）現象用下列那一種動作控制理論來解釋最為合適？", "options": {"A": "反射理論（reflex theory）", "B": "系統理論（systems theory）", "C": "動態系統理論（dynamical systems theory）", "D": "生態學理論（ecological theory）"}, "images": [], "answer": "D", "explanation": "VR 中感知-行動配對符合『生態學理論』(Gibson)，強調個體與環境互動產生 affordance，故選 D。"}, {"n": 5, "stem": "就記憶與學習的特性而言，操作制約（operant conditioning）屬於下列何者？①聯結性學習（associative\nlearning）  ②程序性學習（procedural learning）   ③內隱性學習（implicit learning）   ④非敘述\n性學習（nondeclarative learning）", "options": {"A": "①②③", "B": "②③④", "C": "①③④", "D": "①②④"}, "images": [], "answer": "C", "explanation": "操作制約屬聯結性學習①、內隱學習③、非敘述性學習④；不一定屬程序性學習②；故選 C（①③④）。"}, {"n": 6, "stem": "在工作記憶（working memory）系統中，主要負責注意力控制的區塊為何？", "options": {"A": "中央執行器（central executive system）", "B": "事件緩衝器（episodic buffer）", "C": "視覺空間描繪板（visuospatial sketchpad）", "D": "音韻迴路（phonological loop）"}, "images": [], "answer": "A", "explanation": "工作記憶的中央執行器負責『注意力分配與認知控制』，故選 A。"}, {"n": 7, "stem": "兩位出血性中風病患年齡、中風嚴重度和中風危險因子都相當，在中風前常運動者較中風前無運動習慣者在\n急性期恢復得較好。下列何者是最有可能的解釋？", "options": {"A": "有運動習慣者的神經再生能力較佳", "B": "有運動習慣者的神經細胞側枝發芽（collateral sprouting）能力較佳", "C": "有運動習慣者有較多的多餘神經路徑（redundant neural pathways）可被去覆蓋（unmasking）而導致功 能恢復", "D": "有運動習慣者腦細胞受腫脹壓迫時，腦細胞死亡的速率較慢"}, "images": [], "answer": "C", "explanation": "中風前有運動者腦部具更多『多餘神經路徑』可被去覆蓋使用，促進功能恢復；故選 C。"}, {"n": 8, "stem": "有關促進中樞神經疾病患者的神經塑性，下列敘述何者最為適當？", "options": {"A": "訓練的任務需相當簡單，讓患者都能輕易完成，以促進神經塑性", "B": "訓練的任務需好玩有趣，以促進患者學習增加神經塑性", "C": "年輕人及年長者的大腦均有相同程度的神經塑性", "D": "單一的訓練環境比豐富的訓練環境，更易促進神經塑性的產生"}, "images": [], "answer": "B", "explanation": "促進神經塑性的訓練應該『有趣、有挑戰、有意義』；故選 B。其他選項描述錯誤。"}, {"n": 9, "stem": "對周邊神經損傷患者的物理治療包括：①增進患部血液循環　②避免關節肌肉攣縮　③給予電刺激維持肌肉\n力量。以上各項所需之評估，分別對應國際健康功能與身心障礙分類系統（ICF）的那個層面？", "options": {"A": "①身體構造  ②身體構造  ③身體功能", "B": "①身體構造  ②身體功能  ③活動能力", "C": "①身體功能  ②身體功能  ③身體構造", "D": "①身體功能  ②活動能力  ③身體功能"}, "images": [], "answer": "A", "explanation": "周邊神經損傷後增進血液循環與避免攣縮屬『身體構造』；電刺激維持肌力屬『身體功能』；故選 A。"}, {"n": 10, "stem": "將患者右側肘關節屈曲至90度，並請患者將左側上肢擺在相同位置，此步驟最有可能評估下列何神經路徑？", "options": {"A": "外側皮質脊髓徑（lateral corticospinal tract）", "B": "前側皮質脊髓徑（anterior corticospinal tract）", "C": "脊髓丘腦徑（spinothalamic tract）", "D": "背柱內側絨帶系統（dorsal column-medial lemniscus system）"}, "images": [], "answer": "D", "explanation": "雙側鏡像位置擺放需要本體感覺，由背柱-內側絨帶系統傳遞；故選 D。"}, {"n": 11, "stem": "腦傷患者在仰躺姿勢下，治療師使用艾許沃斯氏量表來評估上肢張力時，發現其右側手肘肱二頭肌痙攣等級\n為2，肱三頭肌為1。此時，若患者向右轉頭過來看向治療師，此時該部位張力最有可能會發生那種變化？", "options": {"A": "肱二頭肌、肱三頭肌張力等級均變為0", "B": "肱二頭肌不變，肱三頭肌變為1+", "C": "肱二頭肌變為3，肱三頭肌不變", "D": "肱二頭肌變為1+，肱三頭肌變為2"}, "images": [], "answer": "D", "explanation": "ATNR（不對稱頸張力反射）：頭轉向側上肢伸、對側上肢屈；患者向右轉頭使右上肢伸直化（肱二頭肌張力會降低）、左上肢屈曲化；題目右側肢體：右轉頭側 → 該側肱二頭肌張力下降但選項無此改變；題目選 D『肱二頭肌變 1+，肱三頭肌變 2』表示反射使屈肌(肱二頭)張力下降為 1+、伸肌(肱三頭)張力升高為 2，符合 ATNR 機轉。"}, {"n": 12, "stem": "使用肌力評估指數（motricity index）來評估中風個案之肌力時，在上、下肢各要評估那些動作？", "options": {"A": "肩關節屈曲與外展、手肘彎曲與伸直、髖關節彎曲與伸直、膝關節彎曲與伸直", "B": "肩關節外展、手肘彎曲、食指與拇指捏握、髖關節彎曲、膝關節伸直、踝關節背屈", "C": "肩關節屈曲、手肘彎曲、握拳、髖關節伸直、膝關節伸直、踝關節蹠屈", "D": "手肘彎曲、握拳、膝關節伸直、踝關節背屈"}, "images": [], "answer": "B", "explanation": "Motricity Index 上肢測肩外展、肘屈、捏握；下肢測髖屈、膝伸、踝背屈；故選 B。"}, {"n": 13, "stem": "右側偏癱的腦中風病患於站姿下，患側手由左上往右下方拉彈力繩，下列何者不是此訓練之目的？", "options": {"A": "側向跨步反應", "B": "重心往患側位移", "C": "上下軀幹分解動作", "D": "脫離上肢屈曲協同動作"}, "images": [], "answer": "A", "explanation": "對角線拉彈力繩（左上→右下）目的是脫離屈曲協同④、重心往患側位移②、上下軀幹分節③，但『側向跨步反應』屬下肢平衡反應，與此上肢訓練無關；故 A 不是訓練目的。"}, {"n": 14, "stem": "有關肌肉張力之敘述，下列何者正確？", "options": {"A": "評估肌肉張力之前，宜先評估個案的被動關節活動度", "B": "肌肉張力過高常見於下運動神經元或小腦損傷的病人", "C": "肌肉張力是指肌肉收縮狀態下的緊張度", "D": "肌肉張力過低時，被動關節活動度較小"}, "images": [], "answer": "A", "explanation": "肌肉張力評估前需先確認被動 ROM 完整（避免攣縮造成誤判為高張）；故 A 正確。其他描述錯誤。"}, {"n": 15, "stem": "50歲的患者右側中大腦動脈梗塞性中風3週，之前沒有任何其他系統性疾病，日前評估時發現肩關節有一指\n幅的半脫位現象，下列何種原因不是造成半脫位的原因？", "options": {"A": "軀幹張力太低", "B": "左側上肢肩關節彎曲張力較強", "C": "左側棘上肌張力太低", "D": "左側肩胛骨位置比較向下旋轉"}, "images": [], "answer": "B", "explanation": "中風患者的左側上肢肩屈張力增強會幫助維持肩位置（上抬），『不會』造成半脫位；故 B 不是原因。"}, {"n": 16, "stem": "下列那個敘述最符合現代玻巴斯技巧的想法？", "options": {"A": "若患者有恢復正常功能潛力時，不建議使用代償模式來達到功能獨立的目標", "B": "治療計畫不需考量是否符合動作學習的原則", "C": "與系統理論不同，訂定治療目標時不需考量患者能力與所處生活環境之現實需求", "D": "治療時不宜搭配其他種療法，如副木、肌力訓練、跑步機等"}, "images": [], "answer": "A", "explanation": "現代 Bobath：有恢復潛力時不鼓勵過早代償（避免 learned non-use），故 A 正確。"}, {"n": 17, "stem": "關於玻巴斯與布朗斯壯治療理論，下列敘述何者錯誤？", "options": {"A": "玻巴斯治療的理念是循序漸進，由坐到站而步行", "B": "布朗斯壯治療的理念是強調誘發動作，鼓勵自主性動作", "C": "玻巴斯治療強調使用原始反射來誘發動作", "D": "布朗斯壯治療強調逐一打破協同動作，引導自主性動作"}, "images": [], "answer": "C", "explanation": "Bobath 強調『抑制原始反射』（不是使用），故 C 錯誤。"}, {"n": 18, "stem": "在布朗斯壯治療方法中，為了誘發真正的握持反射（true grasp reflex），應該如何刺激掌面？", "options": {"A": "在第二、三、四、五掌指關節（metacarpophalangeal joint）給予向心方向刺激", "B": "在第二、三、四、五掌指關節（metacarpophalangeal joint）給予離心方向刺激", "C": "在大魚際肌（thenar eminence）給予向心方向刺激", "D": "在小魚際肌（hypothenar eminence）給予離心方向刺激"}, "images": [], "answer": "B", "explanation": "Brunnstrom 真握持反射：『離心方向（從近端往遠端）』刺激掌指關節區誘發握緊，故選 B。"}, {"n": 19, "stem": "55歲左側殼核出血性中風患者，經測試後發現右側膝伸直肌、蹠屈肌出現痙攣，且右下肢無自主動作控制，\n則此病人右下肢為布朗斯壯分期第幾期？", "options": {"A": "一", "B": "二", "C": "三", "D": "四"}, "images": [], "answer": "B", "explanation": "膝伸肌、蹠屈肌出現痙攣（張力出現）但無自主動作 = Brunnstrom 第二期，故選 B。"}, {"n": 20, "stem": "某實習生正在替因中風而導致右側偏癱的患者做治療，他讓患者平躺在治療床邊右腳垂出床緣，並將患者的\n下肢彎曲，膝關節朝向左側肩膀方向抬高，並且對著患者說：「讓我幫你，我們一起把腳彎起來，很好，然\n後放鬆伸直，再來一次，腳彎起來。」如此的活動重複了數次。下列有關此治療之敘述何者正確？", "options": {"A": "主要目的為增加下肢彎曲能力", "B": "使用固定反轉（stabilizing reversals）技巧", "C": "使用節律性固定（rhythmic stabilization）技巧", "D": "將手放在腳底及大腿後側處給予阻力"}, "images": [], "answer": "A", "explanation": "「我幫你 → 你跟我做 → 你自己做」漸進過渡是 PNF rhythmic initiation 的核心特徵；題目主目的是增加屈曲能力（A 對）。"}, {"n": 21, "stem": "對於有僵硬膝關節步態（stiff knee gait）的中風病人，以布朗斯壯的下肢分期進行動作與步態測試，下\n列何者最不會顯示與此問題相關的異常？", "options": {"A": "坐姿下，膝關節單獨彎曲", "B": "坐姿下，膝關節自主伸直", "C": "站姿髖關節伸直下，膝關節單獨彎曲", "D": "步態擺盪期，髖膝踝的相對活動角度"}, "images": [], "answer": "B", "explanation": "Stiff knee gait 主因擺盪期股直肌過度活化；坐姿膝『單獨』屈曲評估膝屈肌；自主伸直在僵硬膝步態無關，故 B 最不會顯示。"}, {"n": 22, "stem": "物理治療師建議一名尚無法獨立維持站姿平衡的急性中風患者，使用體重支撐懸吊系統練習行走。下列敘述\n何者較能支持這個治療模式？", "options": {"A": "玻巴斯治療的理念強調在中風早期能力不足時，可依賴行走輔具來練習獨立行走", "B": "布朗斯壯治療主張透過懸吊系統誘發踝關節背屈動作", "C": "本體感覺神經肌肉誘發技巧建議透過懸吊系統來誘發本體感覺而產生行走動作", "D": "任務導向模式的理念鼓勵透過懸吊系統，及早開始行走功能訓練"}, "images": [], "answer": "D", "explanation": "懸吊體重支撐系統可讓無法獨立站立的患者『及早』練習行走→任務導向訓練的核心，故選 D。"}, {"n": 23, "stem": "使用軟墊、厚地毯、可滾動的傾斜板等來作為站立平面，訓練病人的站立平衡，此訓練手法之治療目標最可\n能為下列何者？", "options": {"A": "減少病人對體感覺的依賴", "B": "減少病人對視覺的依賴", "C": "減少病人對前庭覺的依賴", "D": "訓練病人的跨步策略"}, "images": [], "answer": "A", "explanation": "軟墊+斜板擾亂體感覺輸入，訓練患者減少對體感覺的依賴（迫使用視覺/前庭代償）；故選 A。"}, {"n": 24, "stem": "以虛擬實境進行動作學習時可結合不同回饋方式，下列何者最不適合？", "options": {"A": "結果知識（knowledge of result）", "B": "負向動機回饋（negative motivational feedback）", "C": "觸覺回饋（tactile feedback）", "D": "表現知識（knowledge of performance）"}, "images": [], "answer": "B", "explanation": "VR 動作學習應使用正向動機回饋（不是負向），故 B 不適合。"}, {"n": 25, "stem": "對傳統限制誘發動作訓練的敘述，下列何者錯誤？", "options": {"A": "限制腦中風個案健側肢體的活動", "B": "普遍適用於各布朗斯壯分期之個案", "C": "對個案進行每天長達6小時的高強度訓練", "D": "利用行為塑造原則促進個案學習"}, "images": [], "answer": "B", "explanation": "傳統 CIMT 入選標準需要患側手有最低限度動作（腕伸 ≥20°、指伸 ≥10°），不適用各 Brunnstrom 期；故 B 錯誤。"}, {"n": 26, "stem": "75歲的王先生昨天早上吃早餐時忽然無法拿住筷子，口齒不清向右跌倒送至急診，診斷為急性梗塞型中風；\n昨天下午住進神經內科病房，今日會診物理治療介入。下列那一個不是治療師進入病房後應立刻優先的評估\n項目？", "options": {"A": "先評估意識狀態，再評估其他項目", "B": "評估患側的感覺功能，以衛教如何給予適當保護", "C": "評估患側的運動功能（如布朗斯壯分期），以教導家屬如何協助執行日常生活活動", "D": "評估患側肌力，以決定給予多少沙包進行阻力訓練"}, "images": [], "answer": "D", "explanation": "急性中風急診後第一天的物治評估，『不應立即用沙包做阻力訓練』（過早重訓可能加重損傷），故 D 不應優先。"}, {"n": 27, "stem": "治療師為中風的陳奶奶進行上肢肌力測試發現，健側上肢執行伸直動作時，患側上肢亦出現伸直反射，此為\n下列何者？", "options": {"A": "associated reaction", "B": "associated movement", "C": "Raimiste phenomenon", "D": "synergy movement"}, "images": [], "answer": "A", "explanation": "健側做動作時患側出現相同方向反射 = associated reaction，故選 A。"}, {"n": 28, "stem": "關於缺血性中風所引發的缺血性連鎖反應，下列那些為正確的反應與順序？①抑止鈣離子進入細胞引發細胞\n腫脹　②釋放過多的麩胺酸（glutamate）　③ 抑制天門冬胺酸（aspartate）分泌　④抑制ATP產生　⑤過\n多的鈣離子進入細胞引起形成自由基的反應　⑥細胞死亡", "options": {"A": "③→①→④→⑥", "B": "②→④→⑤→⑥", "C": "⑤→②→④→⑥", "D": "①→②→④→⑥"}, "images": [], "answer": "B", "explanation": "缺血性連鎖反應：②麩胺酸過釋 → ④ATP 不足 → ⑤鈣離子過度進入 → ⑥細胞死亡；故選 B。"}, {"n": 29, "stem": "李先生因突然眩暈跌倒，同時出現右側臉部失去知覺，送醫後診斷為缺血性中風，其受損血管較可能為何？", "options": {"A": "右側椎基底動脈", "B": "左側後大腦動脈", "C": "右側中大腦動脈", "D": "左側內頸動脈"}, "images": [], "answer": "#", "explanation": "本題經考選部公告「一律給分」。眩暈+對側臉部失感覺典型為延腦外側症候群（Wallenberg），由椎基底動脈分支 PICA 阻塞造成；但選項描述模糊故全給分。"}, {"n": 30, "stem": "右側癱瘓中風病患，上下肢皆為布朗斯壯第一期，進行橋式運動，以下列何種姿勢最容易？", "options": {"A": "右腳單腳抬臀運動", "B": "雙腳膝關節彎曲30度", "C": "雙腳膝關節彎曲60度", "D": "雙腳膝關節彎曲120度"}, "images": [], "answer": "D", "explanation": "Brunnstrom 第一期軟癱期，膝彎曲角度越大（120°）橋式抬臀力臂越短、最容易完成，故選 D。"}, {"n": 31, "stem": "一位小腦中風的患者接受4週功能性平衡訓練，下列那項測試最適合用來評估物理治療的效果？", "options": {"A": "阮柏氏測試（Romberg's test）", "B": "傅格－梅爾評估量表（Fugl-Meyer assessment scale）", "C": "柏格氏平衡量表（Berg balance scale）", "D": "推者症候臨床量表（clinical assessment scale for contraversive pushing）"}, "images": [], "answer": "C", "explanation": "BBS 為平衡功能評估的標準工具，最適合 4 週功能性平衡訓練的療效追蹤；故選 C。"}, {"n": 32, "stem": "有關腦中風病患的肌力訓練原則，下列何者正確？", "options": {"A": "肌力小於3分（fair）的病患，無法實施本體感覺神經肌肉誘發技巧", "B": "肌力大於3分（fair）的病患，可以綁上沙包袋實施阻力訓練", "C": "較無力的病患，相對於離心收縮，應優先進行需徵召較少動作單位的向心收縮訓練", "D": "健側肢體沒有無力現象，不需要進行肌力訓練"}, "images": [], "answer": "B", "explanation": "肌力 ≥ 3 分（fair）患者可開始綁沙包做阻力訓練，故 B 正確。其他描述錯誤。"}, {"n": 33, "stem": "有關中風病患的有氧訓練運動處方設計，下列何者適當？①早期訓練可採行功能性活動　②平衡能力不佳的\n病患最好採用固定式腳踏車　③強度目標應為最大攝氧量的70～80%　④為了確保安全性，病患應接受徹底\n的檢查和在監督之下進行運動", "options": {"A": "①②", "B": "②③", "C": "①②④", "D": "①④"}, "images": [], "answer": "C", "explanation": "中風有氧處方：早期可從功能活動開始①、平衡差者用固定式腳踏車②、需安全評估與監督④；強度應 50-80% VO2max（70-80% 過高），故選 C（①②④）。"}, {"n": 34, "stem": "治療師欲與有單側忽略（unilateral neglect）之中風病患互動時，為充分引起病患的注意並引導他增加對\n患側之使用，下列做法何者最合適？", "options": {"A": "坐在患者的正前方，同時給予兩側體感覺刺激", "B": "坐在患者正前方偏健側處，先吸引患者目光再慢慢移向患側", "C": "坐在患者的患側處，出聲呼叫患者並搖晃患側肢體", "D": "坐在患者後方，並在前方放置鏡子讓個案可以看到自己"}, "images": [], "answer": "B", "explanation": "單側忽略患者：先在健側偏前方吸引目光，再慢慢將刺激移向患側，鼓勵跨中線注意力訓練；故選 B。"}, {"n": 35, "stem": "承上題，此個案之病灶最有可能為下列何者？", "options": {"A": "右大腦頂葉皮質", "B": "右大腦枕葉皮質", "C": "左大腦額葉皮質", "D": "左大腦顳葉皮質"}, "images": [], "answer": "A", "explanation": "單側忽略最常見於『右側大腦頂葉皮質』損傷，故選 A。"}, {"n": 36, "stem": "中風個案的肌力訓練原則，下列何者最為適當？", "options": {"A": "高阻力、低重複次數（＜5次）", "B": "低阻力、高重複次數（10～15次）", "C": "儘量每天訓練，至少一週五天", "D": "以遠端肌群之阻力訓練為主"}, "images": [], "answer": "B", "explanation": "中風患者肌力訓練應低-中阻力（避免不正常張力）+ 高重複次數；故選 B。"}, {"n": 37, "stem": "訓練中風患者上肢近端關節的穩定度，並預防上肢屈曲協同動作的發生，下列何者最適當？", "options": {"A": "坐在床緣，雙手合抱舉高進行水平外展與內收", "B": "坐在輪椅，治療師協助患側手抬舉至肩屈曲90度", "C": "坐在床緣，以伸直的患側上肢支撐於床面", "D": "坐在輪椅，雙手交握並將軀幹朝地面彎曲"}, "images": [], "answer": "C", "explanation": "伸直患側上肢支撐床面=『伸直承重』訓練，可預防屈曲協同並穩定近端，故選 C。"}, {"n": 38, "stem": "關於推者症候群（pusher syndrome）的敘述，下列何者錯誤？", "options": {"A": "患者的視覺垂直感（visual-vertical perception）是異常的", "B": "可能與丘腦後外側（posterolateral thalamus）受損有關", "C": "較常見於左側偏癱的病人", "D": "通常在中風6個月後就較少見"}, "images": [], "answer": "A", "explanation": "Pusher syndrome 患者視覺垂直感『正常』、感覺-動作垂直感異常；A 描述方向錯誤。"}, {"n": 39, "stem": "腦幹中風2個月的患者，可以拿單枴在平坦的地面獨立行走20公尺，上下樓梯需要口頭提示。下列何者是功\n能性活動，且能挑戰到平衡能力？", "options": {"A": "在使用單側扶手的情況下上樓梯", "B": "閉眼時，單腳站立", "C": "使用單枴行走30公尺", "D": "在不平穩地面行走"}, "images": [], "answer": "D", "explanation": "腦幹中風患者已能拿單枴行走、上下樓梯需提示，『不平穩地面行走』屬功能性且具平衡挑戰；故選 D。"}, {"n": 40, "stem": "右側小腦梗塞的腦中風患者會出現何側肢體的動作問題？", "options": {"A": "右側", "B": "左側", "C": "兩側皆會", "D": "兩側皆不會"}, "images": [], "answer": "A", "explanation": "小腦病變產生『同側』肢體動作問題（小腦症狀為 ipsilateral），故選 A。"}, {"n": 41, "stem": "80歲的林爺爺原有雙側膝關節退化，輕微失智，6個月前因為突然頭暈雙腳無力在浴室跌倒，造成腰椎第一\n節壓迫性骨折，經過完整的復健治療至今，目前雙下肢肌力0分，L2以下的感覺功能也完全喪失，大小便無\n法自解，下列的治療或訓練的目標設定何者不適當？", "options": {"A": "加強雙上肢肌力，讓他可以自行推動一般輪椅活動", "B": "應該可以訓練到自行翻身起床，獨立坐在床邊", "C": "應該可以自行執行簡單的日常生活照顧，例如：刷牙、洗臉、吃飯", "D": "要訓練到在家中可以使用雙側腋下枴和長腿支架行走"}, "images": [], "answer": "D", "explanation": "L1 壓迫骨折+雙下肢肌力 0 分+大小便無法自解，目標應為輪椅獨立與部分日常生活，無法用雙腋下枴+長腿支架步行（過於樂觀），故 D 不適當。"}, {"n": 42, "stem": "關於脊髓休克（spinal shock）症狀，下列敘述何者錯誤？", "options": {"A": "脊髓休克恢復過程第一階段症狀主要呈現受傷神經節以下的肌腱反射減弱或消失", "B": "脊髓休克恢復過程第四階段之症狀指標為過度反射與造成痙攣", "C": "脊髓休克時常呈現自主神經反射異常，造成血壓上升，心跳增快現象", "D": "脊髓休克時受傷節數以下的感覺及運動能力皆喪失"}, "images": [], "answer": "C", "explanation": "脊髓休克時自主神經會出現『低血壓+心跳緩慢』（不是血壓上升+心跳增快）；故 C 錯誤。"}, {"n": 43, "stem": "關於脊髓損傷患者常出現之痙攣症狀與臨床處理，下列敘述何者錯誤？", "options": {"A": "主要是上運動神經元損傷之症狀", "B": "臨床上常使用Baclofen來降低脊髓損傷患者痙攣症狀", "C": "可能原因為脊隨的α或γ運動神經元受到過度抑制", "D": "臨床上可利用痙攣來協助站立功能"}, "images": [], "answer": "C", "explanation": "脊髓損傷痙攣的機轉是 α 與 γ 運動神經元『失去高位抑制』而過度活躍，不是受『過度抑制』；C 描述方向反，錯誤。"}, {"n": 44, "stem": "下列各項症候群的敘述，何者錯誤？", "options": {"A": "前髓症候群造成損傷節次以下之雙側溫痛覺與運動功能喪失", "B": "後髓症候群造成損傷節次以下之溫痛覺喪失，但運動功能良好", "C": "中髓症候群所造成之運動功能缺損特色為上肢功能比下肢差", "D": "布朗－斯夸症候群之特徵為損傷同側運動功能喪失，對側溫痛覺喪失"}, "images": [], "answer": "B", "explanation": "後髓症候群（後柱+後角受損）：本體與震動覺喪失，運動功能保留，但因感覺失調而呈現失調步態；B 描述為前髓症候群（運動+痛溫覺喪失）；故 B 錯誤。"}, {"n": 45, "stem": "關於脊髓損傷引發之症狀與臨床物理治療處理方式，下列敘述何者錯誤？", "options": {"A": "脊髓損傷所引起的姿勢性低血壓，主要原因是受傷後交感神經興奮性下降", "B": "發現脊髓損傷出現姿勢性低血壓時，處理原則為讓患者平躺並抬高下肢", "C": "T6以上脊髓損傷患者常因膀胱脹尿或尿路感染引發自主神經反射失調", "D": "當發現脊髓損傷患者出現自主神經反射失調現象時，須立即讓患者躺下"}, "images": [], "answer": "D", "explanation": "AD 發作時應立即讓患者『坐起』+ 找出誘發原因（膀胱、腸道、皮膚刺激），不是平躺；故 D 錯誤。"}, {"n": 46, "stem": "有關脊髓損傷患者穿著長腿支架（KAFO）訓練站立平衡之敘述，下列何者正確？", "options": {"A": "無論是那節脊髓完全損傷，都應鼓勵患者穿著長腿支架練習站姿，以增加穩定度", "B": "胸髓損傷患者穿著長腿支架，可以利用髂股韌帶（iliofemoral ligament）來協助站姿的穩定度", "C": "胸髓損傷患者穿著長腿支架時，身體重心要保持在髖關節之前", "D": "胸髓損傷患者穿著長腿支架時肩部要後收（retraction），頭要彎曲"}, "images": [], "answer": "B", "explanation": "胸髓損傷穿 KAFO 站立時，靠髂股韌帶（Y ligament）的張力使骨盆/髖伸直被動穩定（C-curve posture）；故 B 正確。"}, {"n": 47, "stem": "關於低功能期（瑞秋洛斯阿米哥斯認知功能程度量表第一～三級）的腦傷患者，下列治療何者最不恰當？", "options": {"A": "可提供適當的擺位，避免褥瘡等次發性問題", "B": "應將病患安排在安靜的環境中，與其講話時維持平穩不變的音調", "C": "可儘早協助病患坐立於病床或輪椅以促進其軀幹控制", "D": "應給予關節活動度維持組織延展性並避免關節攣縮"}, "images": [], "answer": "B", "explanation": "LOCF 1-3 級為昏迷-泛化反應-局部反應期，環境應安靜但音調可有變化以喚醒；題目選 B 為錯誤敘述（『維持平穩不變音調』不對）。"}, {"n": 48, "stem": "創傷性腦部外傷的瀰漫性軸突損傷若發生在胼胝體的中央段落，則病患主要出現的問題為何？", "options": {"A": "高階認知障礙", "B": "記憶力損傷", "C": "兩側下肢無力", "D": "兩側下肢間的協調障礙"}, "images": [], "answer": "D", "explanation": "胼胝體中央段損傷影響兩側大腦半球的協調，下肢動作之間協調受影響；故選 D。"}, {"n": 49, "stem": "針對瑞秋洛斯阿米哥斯認知功能程度量表（LOCF）第五～六級的腦傷患者，下列何種治療策略最不恰當？", "options": {"A": "提供多步驟的指令以促進認知功能", "B": "提供功能性活動訓練以增加日常生活功能", "C": "提供姿勢控制與平衡訓練以增加日常生活獨立性與安全性", "D": "提供任務導向訓練以增加上肢動作功能"}, "images": [], "answer": "A", "explanation": "LOCF 5-6 級認知能力有限，提供『多步驟指令』超過認知能力；應給單步驟簡化指令；故 A 不恰當。"}, {"n": 50, "stem": "小吳3個月前因為車禍造成頭部外傷，目前仍然無法與外界互動，幾乎整天都在睡覺，四肢張力很強，下列\n何者不是小吳可能出現的次發性損傷？", "options": {"A": "認知功能障礙", "B": "垂足", "C": "足部外踝的壓瘡", "D": "髖部的異位性骨增生"}, "images": [], "answer": "A", "explanation": "認知功能障礙是 TBI 的主要『原發性』神經損傷症狀，不是次發性；垂足、壓瘡、異位骨化才是次發性；故選 A。"}, {"n": 51, "stem": "對轉身時易發生凝凍步態（freezing of gait）的巴金森氏病個案，下列訓練方式何者較不恰當？", "options": {"A": "轉身時集中注意力默算減數", "B": "轉身時口數節拍維持跨步節奏", "C": "轉身時刻意屈膝抬腿提高腳步", "D": "轉身時將180度的轉身分解為二個90度的轉身"}, "images": [], "answer": "A", "explanation": "Freezing of gait 凍步轉身時應『集中外在注意力』（如數拍、視覺目標），不是內在計算；故 A 不恰當。"}, {"n": 52, "stem": "王伯伯患有巴金森氏病，平日多坐在家中看電視。他兩手關節活動度差，且身體有明顯的駝背姿勢與僵直。\n最適合他的本體感覺神經肌肉誘發術為何？", "options": {"A": "雙手對稱D1屈曲模式", "B": "雙手對稱D1伸直模式", "C": "雙手對稱D2屈曲模式", "D": "雙手對稱D2伸直模式"}, "images": [], "answer": "C", "explanation": "PD 駝背僵硬患者使用『雙手對稱 D2 屈曲模式』（肩屈+外展+外轉+伸肘+伸腕）可拉伸前胸+伸展軀幹，故選 C。"}, {"n": 53, "stem": "正常狀態下，在基底核的多巴胺對基底核內的直接與間接路徑的作用分別為下列何者？", "options": {"A": "興奮、興奮", "B": "興奮、抑制", "C": "抑制、興奮", "D": "抑制、抑制"}, "images": [], "answer": "B", "explanation": "BG 內：多巴胺對 D1 直接路徑為『興奮』，對 D2 間接路徑為『抑制』；故選 B。"}, {"n": 54, "stem": "臨床失智評估量表（clinical dementia rating）為分級失智症患者疾病程度的工具之一。下列何者不是此\n量表所評估的內容？", "options": {"A": "常遺忘最近發生的事情", "B": "有時會找不到路", "C": "需時常提醒吃藥", "D": "很容易不專心"}, "images": [], "answer": "D", "explanation": "CDR 評估記憶、定向、判斷與解決問題、社區事務、家庭嗜好、個人照顧；『容易不專心』屬注意力，不在 CDR 評估項目內，故選 D。"}, {"n": 55, "stem": "李奶奶是一名失智症患者，主要症狀是忘東忘西，最近更是忘了家人的名字、出門就會迷路。以磁振造影檢\n查，最主要會發現那一個腦區有萎縮的現象？", "options": {"A": "①", "B": "②", "C": "③", "D": "④"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAWQAAAFFCAIAAABUiQDkAAAACXBIWXMAAA7EAAAOxAGVKw4bAAIIuUlEQVR4nOy9d3xd1ZU2bLnoXnXpXrWr3ntvVq+WLcmy5SLbktW7rN57711yx7iBwRUbFwiYHkiAhAAhTEJCCJmZ9/1+3/ebb75/  "explanation": "小腦損傷協調訓練應從『慢速』開始，動作品質優先，再漸進加快；A 說「先快後慢」方向反，最不合適。"}, {"n": 57, "stem": "下列何種代償性策略可減輕小腦損傷病患的協調障礙對執行日常活動的干擾？", "options": {"A": "加快動作速度，增加參與活動的肢體或關節", "B": "增加動作幅度，減少參與活動的肢體或關節", "C": "降低動作速度，增加參與活動的肢體或關節", "D": "降低動作速度，減少參與活動的肢體或關節"}, "images": [], "answer": "D", "explanation": "小腦損傷代償策略：降低速度、減少參與肢段（簡化動作自由度），故選 D。"}, {"n": 58, "stem": "下列何者不是多發性硬化症的臨床症狀？", "options": {"A": "勒赫米特現象（Lhermitte's sign）", "B": "阿索夫徵候（Uhthoff's phenomenon）", "C": "韋博氏症候群（Weber's syndrome）", "D": "查克特氏三合症（Charcot's triad）"}, "images": [], "answer": "C", "explanation": "MS 症狀含 Lhermitte sign、Uhthoff phenomenon、Charcot's triad；Weber's syndrome 是腦幹中風（中腦）症候群，與 MS 無關；故選 C。"}, {"n": 59, "stem": "55歲的張小姐10年前確診為多發性硬化症，最近平均半年症狀就會復發一次，且每次發作後身體狀況就退步\n一些，因此前來求診，下列建議何者最適當？", "options": {"A": "可以利用彈力帶進行等長肌力訓練，且每次應該做到肌肉痠痛才能達到訓練效果", "B": "可以到健身房做重量訓練，訓練過程應該儘量增加重量，直到肌肉疲乏", "C": "多曬太陽可以避免骨質疏鬆，所以建議儘量於中午時間到公園走路運動", "D": "建議養成每天固定運動的習慣，量力而為，少量多次的運動"}, "images": [], "answer": "D", "explanation": "MS 患者應『少量多次、量力而為』運動，避免過度疲勞與升溫；故選 D。"}, {"n": 60, "stem": "有關多發性硬化症與基蘭－巴瑞氏症候群之敘述，下列何者正確？", "options": {"A": "多發性硬化症為中樞神經髓鞘脫失，而中樞神經髓鞘為許旺氏細胞製造", "B": "基蘭－巴瑞氏症候群為周邊神經髓鞘脫失，而周邊神經髓鞘為寡樹突膠細胞製造", "C": "通常基蘭－巴瑞氏症候群的預後相較多發性硬化症佳", "D": "二者皆為神經去髓鞘疾病，會導致肌肉無力、感覺異常及深度肌腱反射減少或喪失"}, "images": [], "answer": "C", "explanation": "GBS 預後比 MS 佳（GBS 多數可恢復、MS 為慢性退化），故選 C。其他配對描述錯誤。"}, {"n": 61, "stem": "下列何者較不會出現認知功能缺損？", "options": {"A": "裘馨氏肌肉失養症（Duchenne muscular dystrophy）", "B": "肌萎縮性側索硬化症（amyotrophic lateral sclerosis）", "C": "後小兒麻痺症候群（post-polio syndrome）", "D": "多發性硬化症（multiple sclerosis）"}, "images": [], "answer": "C", "explanation": "Post-polio syndrome 影響運動神經元（已有 polio 病史的肌肉），不影響認知；DMD/ALS/MS 都可能影響認知（DMD 可有輕度智能障礙、ALS 有額顳失智、MS 有認知衰退），故選 C。"}, {"n": 62, "stem": "依據Sinaki等學者的分期，有關肌萎縮性側索硬化症（ALS）患者的介入，下列何者正確？", "options": {"A": "第一階段患者，宜儘早選配適當的輪椅", "B": "第二階段患者，可利用按摩降低患者的痙攣", "C": "第三階段患者，應維持足夠的行走訓練量", "D": "第四階段患者，運動時應小心避免患者跌倒"}, "images": [], "answer": "BCD", "explanation": "本題經考選部公告「答 B 或 C 或 D 或 BC/BD/CD/BCD 均給分」。Sinaki ALS 分期介入：第二階段中等失能可按摩降痙攣（B）、第三階段需漸進減少行走訓練（C 描述錯誤但給分）、第四階段運動避免跌倒（D），多選擇皆有合理之處。"}, {"n": 63, "stem": "依據世界衛生組織的中樞神經系統腫瘤分級，「生長速度緩慢但有時會侵犯鄰近組織、有往高惡性度發展之\n傾向、惡性或非惡性腫瘤」分類於那一個等級？", "options": {"A": "I", "B": "II", "C": "III", "D": "IV"}, "images": [], "answer": "B", "explanation": "WHO 中樞神經腫瘤分級 II：生長緩慢、可能侵犯但有惡性傾向；故選 B。"}, {"n": 64, "stem": "愛滋病毒可能侵犯神經系統，下列何者不是愛滋病毒感染者在疾病初期（急性感染期，血液CD4淋巴球值\n>500 Cells/MCL）可能出現的神經系統病變？", "options": {"A": "無菌性腦膜炎（aseptic meningitis）", "B": "愛滋病失智複合症（HIV-associated dementia）", "C": "發炎性去髓鞘多發性神經病變（inflammatory demyelinating polyneuropathy）", "D": "腦神經麻痺（cranial nerve palsies）"}, "images": [], "answer": "B", "explanation": "AIDS-associated dementia 出現於『晚期』(CD4 < 200)，急性感染期（CD4 > 500）較少出現；故選 B。"}, {"n": 65, "stem": "有關腦炎與腦膜炎的比較，下列何者正確？", "options": {"A": "常見的腦炎是由細菌引起的；而常見的腦膜炎是由病毒引起的", "B": "腦膜炎常引起腦壓升高；而腦炎常引起腦壓降低", "C": "腦炎及腦膜炎的臨床症狀有發燒、頭痛、頸部僵硬", "D": "預後均與何時使用抗生素有關"}, "images": [], "answer": "C", "explanation": "腦炎與腦膜炎都會發燒、頭痛、頸僵硬等共通症狀；故選 C。其他配對描述錯誤。"}, {"n": 66, "stem": "下列何者不是賽登氏（Seddon）周邊神經受損分類之項目？", "options": {"A": "神經失用（neuropraxia）", "B": "瓦勒氏退化（Wallerian degeneration）", "C": "軸突斷傷（axonotmesis）", "D": "神經斷傷（neurotmesis）"}, "images": [], "answer": "B", "explanation": "Seddon 周邊神經分類：neuropraxia、axonotmesis、neurotmesis 三類；Wallerian degeneration 是『軸突遠端退化現象』(後續變化)，不是分類項目，故選 B。"}, {"n": 67, "stem": "關於周邊神經損傷的物理治療介入原則，下列敘述何者錯誤？", "options": {"A": "對於下肢損傷的病患，急性期時建議穿著具有保護性及大小合宜的鞋子，以保護皮膚", "B": "對於上肢損傷的病患，急性期時不建議使用握把加大的工具，以避免手部承受過大的壓力", "C": "復原期時，可逐步以不同材質的物品觸摸按壓敏感的肢體區域，以降低過度敏感的反應", "D": "復原期時，可以讓病患在不同材質的地面上行走，以誘發感覺重建"}, "images": [], "answer": "B", "explanation": "周邊神經損傷急性期上肢損傷時握把『加大』可降低手部壓力與用力，是『建議』使用，B 否定錯誤。"}, {"n": 68, "stem": "下列疾病發生原因，何者與自體免疫反應較不相關？", "options": {"A": "基蘭－巴瑞氏症候群", "B": "重症肌無力", "C": "後小兒麻痺症候群", "D": "多發性硬化症"}, "images": [], "answer": "C", "explanation": "Post-polio syndrome 為先前小兒麻痺病毒感染後的退化現象，與『自體免疫』無直接關聯；故選 C。GBS、MG、MS 皆為自體免疫疾病。"}, {"n": 69, "stem": "王小姐因眩暈就診，被診斷為左側後半規管良性偶發性姿勢性眩暈，治療師欲施行耳石復位術（canalith\nrepositioning maneuver）以改善她的症狀，下列何者為正確的操作起始動作？", "options": {"A": "在長坐姿下，將頭往左轉約45度後，往後仰躺", "B": "在長坐姿下，將頭往右轉約45度後，往後仰躺", "C": "在長坐姿下，頭保持在正中往前直視之姿勢，往後仰躺", "D": "在躺姿下，頭部下方放枕頭，使頸椎呈現屈曲約30度之姿勢"}, "images": [], "answer": "A", "explanation": "Canalith repositioning（Epley）左側後半規管：起始為長坐姿、頭往『患側左轉 45°』，後仰躺；故選 A。"}, {"n": 70, "stem": "承上題，欲完成耳石復位術，依據前庭受損側，接下來的動作操作順序何項正確？①由側躺之姿勢回到坐姿\n②頭保持後仰30度的姿勢下，將頭往同側轉90度 ③頭保持後仰30度的姿勢下，將頭往對側轉90度 ④保持頭\n部的姿勢下，將身體往對側翻至側躺 ⑤保持頭部的姿勢下，將身體往同側翻至側躺", "options": {"A": "⑤②①", "B": "②⑤①", "C": "③④①", "D": "④③①"}, "images": [], "answer": "C", "explanation": "Epley 左後半規管復位：起始左轉 45° 後仰 → ③頭往對側（右）轉 90°（仍仰）→ ④身體往對側（右）翻側躺 → ①坐起；故選 C（③④①）。"}, {"n": 71, "stem": "張小姐抱怨騎摩托車過馬路時要看左右兩邊的來車時，會有頭暈且不平衡的症狀，且走路時容易偏向一側，\n治療師評估後發現其頭部猛推測試（head impulse test）往左轉時異常，動態視覺敏銳度檢查（dynamic\nvisual acuity）異常，其餘檢查包括眼球水平追視及水平掃視則為正常，豪派－狄克測試亦為陰性。根據\n其症狀及評估結果，治療師欲提供張小姐治療計畫，下列何項訓練較為適合？", "options": {"A": "行走時，眼睛盯著遠方一固定目標往前走", "B": "行走時，眼睛來回看左右兩側的固定目標物並同時轉頭", "C": "坐在一張有靠背且可搖晃的椅子上，靠著椅子前後搖晃身體", "D": "坐在床緣，頭往右轉45度後，往左側躺下，待眩暈停止後再慢慢坐起來"}, "images": [], "answer": "B", "explanation": "Head impulse test 左側異常+DVAT 異常 → 左前庭病變；訓練眼球穩定 (VOR×1) 凝視左右目標+轉頭，故選 B。"}, {"n": 72, "stem": "某前庭損傷病患較依賴視覺和體感覺來維持平衡，下列何項測試最能顯示出這個問題？", "options": {"A": "豪派－狄克測試（Hallpike-Dix test）", "B": "柏格氏平衡量表（Berg balance scale）", "C": "斜板測試（incline test）", "D": "多方向伸取測試（multidirectional reach test）"}, "images": [], "answer": "C", "explanation": "依賴視覺與體感覺的患者用『斜板測試』(incline test) 改變站立平面可凸顯前庭依賴問題；故選 C。"}, {"n": 73, "stem": "關於重症肌無力的敘述，下列何者錯誤？", "options": {"A": "症狀有眼皮下垂及複視的情況", "B": "深層肌腱反射檢查通常不會出現異常", "C": "早上通常臨床症狀較輕微，重複活動後肌肉會快速無力，所以要提醒患者在下午時從事較輕鬆的工作", "D": "應教導個案進行高強度高重複的肌耐力訓練，以增加個案的肌耐力，克服肌肉容易疲勞的問題"}, "images": [], "answer": "D", "explanation": "MG 為神經肌肉接合處病變，肌肉訓練應採低強度低重複 + 多次休息；高強度高重複會加速疲乏；故 D 錯誤。"}, {"n": 74, "stem": "有關基蘭－巴瑞氏症候群的臨床症狀，下列敘述何者錯誤？", "options": {"A": "以急性發炎脫鞘性多發神經病變為最常見", "B": "視不同亞型，可能影響運動神經、感覺神經、自主神經或顱神經", "C": "主要的臨床症狀為對稱性發展，由上肢往下肢進展的肌肉無力", "D": "部分會出現延髓性麻痺"}, "images": [], "answer": "C", "explanation": "GBS 經典『下肢遠端往上行進的對稱性無力』(ascending paralysis)，不是上往下；故 C 錯誤。"}, {"n": 75, "stem": "有關基蘭－巴瑞氏症候群，下列敘述何者正確？", "options": {"A": "會導致感覺神經缺損，因此往往不會有疼痛問題", "B": "會導致周邊運動神經缺損，因此肌肉將長時間處於低張力狀態，無需預防關節攣縮", "C": "影響以周邊神經系統為主，因此大腦及中樞神經不受影響下，心理健康也通常不受影響", "D": "個案於治療當下能執行自主活動且無異狀，但仍需觀察數天，確認無過度使用或疲勞，方能再提升運動劑 量"}, "images": [], "answer": "D", "explanation": "GBS 患者運動需小心觀察過度使用，每次治療後追蹤確認無疲勞才漸進加量；故 D 正確。其他描述錯誤。"}, {"n": 76, "stem": "下列有關各種活動能力與平衡功能測試中，那一種不包含閉眼狀態的項目？", "options": {"A": "柏格氏平衡測試（Berg balance test）", "B": "阮柏氏測試（Romberg's test）", "C": "簡短體能活動工具（short physical performance battery）", "D": "功能性步態測試（functional gait assessment）"}, "images": [], "answer": "C", "explanation": "SPPB 含步速、平衡、坐站，但平衡項目主要是『不同腳併站姿』，不一定包含閉眼項目（閉眼站不是 SPPB 項目）；故選 C。"}, {"n": 77, "stem": "根據Study of Osteoporotic Fracture（SOF）的衰弱篩檢，下列那些長者會被判定為衰弱？", "options": {"A": "A、B", "B": "C、D", "C": "B、D", "D": "A、C"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAokAAACUCAIAAABwYiQaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAeB0lEQVR4nO2d6VXsOhCEJ5cbDLEQCpEQCHEQi5/O1KNP01osayy129T3gwPGi1xaSi3J9mMjhBBCyJV4eCeAEEIIIb+gNxNCCCHX4n9vfhBCCCHElYI3O3QMyKkwE2dDhddDzV2g7C7Qm+8JM3E2VHg91NwFyu4CvfmeMBNnQ4XXQ81doOwu0JvvCTNxNlR4PdTcBcruAr35njATZ0OF10PNXaDsLtCb7wkzcTZUeD3U3AXK7gK9+Z4wE2dDhddDzV2g7C4E9uavr6+Pjw/vVFyUKJkYFyq8HmruAmV34Zg3f35+6iej397e9InME9PJOM2T1P/+/Wsk5e1J+uX7+7uzNKTd0s7yZ7piMuyeA29PxOoUK82xUrtlldfUnRCE01xILVvxnRIhCJdgU9TDlXNwzJuTuWrzE69NJS/Jgd/TDuLZ70/y/YukPREHJynlDO3I+N8PsrPuLvxlwlWnVGxSmgN1rcIpvP2uIBDcNz1HCZdg8PFE/xmonG8xZddFPRmE2FMgDngzwlndB0k3nApZHubKbsab0/6NLkxSUxSULk/aqM8A0KxIn0jsOWVGrEI/j3DVCXUp0CRFOIW33w1WXp2vT0TNt2x4b9sLOa5GRNmjF/XtaNwMs9Rb0g0nQzXRqoTR4s1fT9pJQXcSBzbCX23McOW0c0pGulA7Lv9ThKtOiC0CDXuEU3hj3OxB0jl6uxRRdtOYxOr3g2PejClkE8ia4Fhv6fFm7bVycinN2KiPxe96RgGiI+yWSe5+CW5JOAUwBhOoFQun8BZ/oC+i5nnoEo6IshtvLo6/Xpxj3rwpU5SK3fZmcdDOuFmnbLdMYIUFGnRcNFDjPpVY1en7+1smR6IMPcVSGOjlmeHCiC2s5vTm9eTeHC4XDnszgOnibl+MmwU0HMZcH79XgwMdNG/PCEAamojFaAaxdJCFCIGCuVgKA91CobpF6QmB6JoH5QayR8yFQW/efsaiMYyczzfDLPu9GWaPffQoN86WtyCImNG+4KjUrOsF3n+cWNUp5WPKPvTDosRzsRQGpqrmveqLE1H
