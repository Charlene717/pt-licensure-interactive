<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骨科疾病物理治療學 — 114 年互動測驗</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --ink: #1f2933;
    --ink-soft: #52606d;
    --line: #e4e7eb;
    --primary: #1d6f9b;
    --primary-soft: #e6f1f7;
    --green: #2f9e44;
    --green-soft: #d3f9d8;
    --red: #c92a2a;
    --red-soft: #ffe3e3;
    --yellow: #d9a700;
    --yellow-soft: #fff4c2;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei",
                 "Noto Sans TC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
    font-size: 16px;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 14px 22px;
    position: sticky; top: 0; z-index: 10;
  }
  .h-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    background: #f1f3f5; border: 1px solid var(--line); color: var(--ink-soft);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .progress { color: var(--ink-soft); font-size: 14px; margin-left: auto; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 22px; max-width: 1400px; margin: 18px auto; padding: 0 22px; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; padding: 0 14px; } .sidebar { order: 2; position: static; } }
  .sidebar {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; height: fit-content; position: sticky; top: 78px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
  }
  .gbtn {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
    color: var(--ink-soft); font-size: 13px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .gbtn:hover { border-color: var(--primary); }
  .gbtn.cur { background: var(--primary); color: #fff; border-color: var(--primary); }
  .gbtn.right { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .gbtn.wrong { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .legend { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 4px; border: 1px solid var(--line); }
  .dot.r { background: var(--green-soft); border-color: var(--green); }
  .dot.w { background: var(--red-soft); border-color: var(--red); }
  .main { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .qhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .qnum { font-size: 22px; font-weight: 700; color: var(--primary); }
  .qmeta { color: var(--ink-soft); font-size: 13px; }
  .stem { font-size: 16px; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
  .qimg { display: block; max-width: 100%; max-height: 480px; margin: 8px 0; border: 1px solid var(--line); border-radius: 6px; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    transition: background .12s, border-color .12s;
    text-align: left;
    font-size: 15.5px;
    color: var(--ink);
  }
  .opt:hover:not(.locked) { background: var(--primary-soft); border-color: var(--primary); }
  .opt.locked { cursor: default; }
  .opt .label { font-weight: 700; min-width: 22px; }
  .opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .opt.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .verdict { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 14px; line-height: 1.7; }
  .verdict.right { background: var(--green-soft); color: #186b29; }
  .verdict.wrong { background: var(--red-soft); color: #861818; }
  .verdict.note { background: var(--yellow-soft); color: #6b4e00; }
  .verdict h3 { margin: 0 0 6px; font-size: 14px; }
  .nav { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    background: var(--primary); color: #fff; border: 0; padding: 9px 18px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: #fff; color: var(--red); border: 1px solid var(--red); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .summary { padding: 18px; }
  .summary h2 { margin: 0 0 8px; }
  .score { font-size: 32px; font-weight: 700; color: var(--primary); }
  .wrong-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .wrong-row { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .wrong-row:hover { background: var(--primary-soft); }
  .footer { color: var(--ink-soft); font-size: 12px; text-align: center; margin: 16px 0 30px; }

  .homelink { color: var(--soft); text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .homelink:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }


  /* Export modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,30,.45); display: none; align-items: center; justify-content: center; z-index: 100; padding: 18px; }
  .modal-bg.show { display: flex; }
  .modal-card { background: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.18); max-width: 460px; width: 100%; padding: 22px; }
  .modal-card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 700; }
  .modal-card .modal-sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; }
  .modal-card .opt-row { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
  .modal-card .exp-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; background: #f8f9fa; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left; color: var(--ink); }
  .modal-card .exp-opt:hover { background: var(--primary-soft); border-color: var(--primary); }
  .modal-card .exp-opt:disabled { opacity: 0.5; cursor: not-allowed; background: #f1f3f5; }
  .modal-card .exp-opt .count { color: var(--ink-soft); font-size: 12px; }
  .modal-card .hint { color: var(--ink-soft); font-size: 12px; line-height: 1.6; margin: 0 0 12px; }
  .modal-card .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }


  /* Bookmark / marker */
  .gbtn { position: relative; }
  .gbtn.marked::after {
    content: "★"; position: absolute; top: 1px; right: 3px;
    font-size: 10px; color: var(--yellow); line-height: 1;
    text-shadow: 0 0 2px #fff;
  }
  .markbtn {
    margin-left: auto; background: #fff; border: 1px solid var(--line);
    color: var(--ink-soft); padding: 6px 13px; border-radius: 999px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .markbtn:hover { border-color: var(--yellow); color: var(--yellow); }
  .markbtn.marked { background: var(--yellow-soft); color: #6b4e00; border-color: var(--yellow); font-weight: 600; }
  .qhead { flex-wrap: wrap; }
  .marked-badge { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--yellow-soft); color: #6b4e00; font-size: 11px; border: 1px solid var(--yellow); margin-left: 4px; }
  .wrong-row.mk { border-color: var(--yellow); }

</style>
</head>

<header>
  <div class="h-row">
    <a class="homelink" href="../../../index.html" title="回到測驗首頁">← 回首頁</a>

    <div class="tabs" id="tabs">

    </div>
    <div class="progress" id="progress"></div>
  </div>
</header>

<div class="layout">

    <div class="legend">
      <span><i class="dot r"></i>答對</span>

    <button id="exportBtn" class="btn ghost" style="margin-top:6px;width:100%;font-size:13px;">📤 匯出結果…</button>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="footer">資料來源：考選部 108 年第一次／第二次專技高等考試 · 物理治療師 · 骨科疾病物理治療學</div>

<div class="modal-bg" id="exportModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h3>匯出測驗結果</h3>

      <button class="exp-opt" data-filter="answered">📝 僅已作答 <span class="count" id="cntAnswered"></span></button>
      <button class="exp-opt" data-filter="wrong">❌ 僅錯題 <span class="count" id="cntWrong"></span></button>
      <button class="exp-opt" data-filter="unanswered">⏳ 僅未作答 <span class="count" id="cntUnans"></span></button>
      <button class="exp-opt" data-filter="marked">🔖 僅已標記 <span class="count" id="cntMarked"></span></button>
    </div>
    <p class="hint">將下載一份自包含的 .html 檔，可離線檢視。打開後可用瀏覽器「列印」（Ctrl/⌘+P）→「另存為 PDF」存成 PDF。</p>

    </div>
  </div>
</div>

<script>
const DATA = {"Q1": {"label": "第一次", "questions": [{"n": 1, "stem": "60歲王先⽣抱怨頸部疼痛逐漸加重，坐姿檢查時發現後仰（extension）比前彎（flexion）痛，休息時疼痛會\n減緩，動作檢查沒有不穩定之症狀，請問他最可能有下列那個問題？", "options": {"A": "頸椎滑脫（spondylolisthesis）", "B": "頸椎狹窄（stenosis）", "C": "頸椎椎間盤突出（disc herniation）", "D": "頸部伸肌拉傷"}, "images": [], "answer": "B", "explanation": "答案：B。頸椎狹窄（stenosis）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 2, "stem": "有⼀病患在前天開⾞時，遭後⽅⾞輛快速衝撞，昨天開始有頸部疼痛與僵硬。就診後確定無骨折與神經⾎管傷\n害，下列何種處置⽬前不宜？", "options": {"A": "可使⽤軟式頸圈（soft cervical collar），以保護⽀持頭頸部及維持姿勢", "B": "可使⽤第⼀⾄第⼆級的關節鬆動術（joint mobilization with grade I-II），以減輕疼痛", "C": "可教導頸椎與胸椎及早進⾏屈曲與後伸之牽張（stretching）運動，以增加關節活動度", "D": "⿎勵病患儘量維持⽇常⽣活活動，將有助於預後"}, "images": [], "answer": "C", "explanation": "答案：C。可教導頸椎與胸椎及早進⾏屈曲與後伸之牽張（stretching）運動，以增加關節活動度—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 3, "stem": "下列何者非椎動脈堵塞可能造成之症狀？", "options": {"A": "頭暈（dizziness）", "B": "發⾳困難（dysarthria）", "C": "外側延髓症候群（Wallenberg's syndrome）", "D": "盜汗（sweating）"}, "images": [], "answer": "D", "explanation": "答案：D。盜汗（sweating）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 4, "stem": "有關顱頸屈曲測試（craniocervical flexion test）的敘述，下列何者錯誤？①⽤以測試頸部深層伸肌群的肌⾁\n功能\n②患者仰躺，屈膝（crook lying）\n③頭部維持在正中位置，頸後墊著氣壓式壓⼒計，以20毫米汞柱\n為起始測試壓⼒\n④測試過程中執⾏抬頭動作，避免使⽤表層肌群，不可閉氣⽤⼒", "options": {"A": "僅①②", "B": "僅②③", "C": "僅①④", "D": "僅②④"}, "images": [], "answer": "C", "explanation": "答案：C。僅①④—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 5, "stem": "有關評估頸椎肌⾁之敘述，下列何者正確？", "options": {"A": "頸椎深層肌⾁扮演穩定肌⾓⾊時，反應時間應夠⻑，肌耐⼒應夠久", "B": "慢性頸椎痛患者常有頸椎淺層肌⾁⽤⼒過度及深層肌⾁無⼒現象", "C": "頸椎深層肌⾁扮演穩定肌⾓⾊時，反應時間應夠短，爆發⼒應夠強", "D": "急性頸椎痛患者常有頸椎淺層肌⾁無⼒及深層肌⾁⽤⼒過度現象"}, "images": [], "answer": "B", "explanation": "答案：B。慢性頸椎痛患者常有頸椎淺層肌⾁⽤⼒過度及深層肌⾁無⼒現象—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 6, "stem": "頸椎活動度不正常的個案於仰躺時，接受第⼀與第⼆頸椎關節被動活動度評估，下列那⼀項是正確的測試⽅\n法？", "options": {"A": "將受測者的頸部完全伸展，比較左右兩側旋轉的⾓度", "B": "將受測者的頸部完全屈曲，比較左右兩側旋轉的⾓度", "C": "將受測者的頸部完全側彎⾄任⼀邊，比較向左與向右旋轉⾓度的差異", "D": "將受測者的頸部完全旋轉⾄任⼀邊，比較向左與向右側彎⾓度的差異"}, "images": [], "answer": "B", "explanation": "答案：B。將受測者的頸部完全屈曲，比較左右兩側旋轉的⾓度—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 7, "stem": "觀察頸椎後側時，上頸椎處有⼀往後隆起類似階梯的結構，且Sharp-Purser test發現有頸椎不穩定的現象，最\n可能是發⽣下列那⼀種狀況？", "options": {"A": "頸椎棘突骨折", "B": "枕骨向前滑脫", "C": "第⼀頸椎向前滑脫", "D": "第⼆頸椎向前滑脫"}, "images": [], "answer": "C", "explanation": "答案：C。第⼀頸椎向前滑脫—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 8, "stem": "有關頸椎運動覺訓練（kinesthetic training），下列敘述何者正確？", "options": {"A": "可⽤點頭運動訓練安全的脊椎動作", "B": "應強調機械反射性的肌⼒訓練", "C": "儘量不要讓個案感受到錯誤姿勢所產⽣的症狀改變", "D": "須同時使⽤頸圈"}, "images": [], "answer": "A", "explanation": "答案：A。可⽤點頭運動訓練安全的脊椎動作—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 9, "stem": "⼀位45歲男性患者抱怨右⼿⼿臂疼痛（如圖），從這個⾝體圖判斷，下列有關造成此疼痛區域的可能原因，\n何者可能性最低？", "options": {"A": "斜⾓肌（scalene）激痛點（trigger point）之牽連痛", "B": "橈神經（radial nerve）機械敏感（mechanosensitivity）過⾼", "C": "頸椎神經根病變（radiculopathy）", "D": "Wartenberg疾病／現象"}, "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALEAAAFUCAIAAADktUoXAAAACXBIWXMAAA7EAAAOxAGVKw4bAAB9/UlEQVR4nOx9BZhVVfc+3+/vF36CCirdSHd3g7R0p3QIgnSNNEgrIIKSoiBdAtLdnRJS0jBM1639f+95Oevb3OFeZsY7AwOsh+dy5txzzt1nr3ev2muvnUC9ovT48WMehIeH8yAoKCgiIgIHDoeDZ2w2W1hYmN1uxzG/IuE4NDSU53GAP/EQi8UiF/CrV5USvOgGxCKBkdevX3/06JHLSR7oIAgJCQHLgQ8gAECR8xaD9NsfPnx4+/bt2Gz1i6dXFhNWq1XkQXBwMJiNP/EpmCC5CAAhSAJABKKFfwIKV65cie02vyT0ymICFBgYCGTIn8DEn3/+qQwcABzK4PTy5cuHDRs2cODA2bNnb9++/d69ew6DRFqcP3/e5bEBAQFx9QYvhl5lTEDIk/cAwd27d3kSXAdTV65cWaxYsYQJE5YsWbJ58+bVqlUDLPCZwqB69erNnz8fABIR4ufnxwMID3nUq0qvLCYePHjAAwx6jmwcYNAPHz48T548hQoVWr9+PS+AZsHnpUuXaDniYNSoUVWqVKlUqVKzZs3u378PSMH4ABSAJ97yTHXzytAriwkS0AAzk8dbt24tUaJE/fr1jx8/rowRf+HCBQKCPAYmYJDyGEoH1wNAuGXWrFl8AnwZWhi861WlVxkT9CN4PGPGjDp16nTr1g3HYDwsCf0yZUgRm0G0TPEJ2QDeT5w4MWfOnF27dqUUgYcipuurSvEeEw43JK4mLM0TJ0689dZbBw8e9HC9OwKAfH19/+///m/ChAnKCFcQQxAkAiC9MXHeAd6nVxYTyhjTIIz19OnTL1y4UBkSIrqYwF379+8/cuRI2bJl16xZQzMFGuQNJl5ecsdLxiFgHDRo0ACmIi9m0CK6mPD398fn0qVLP/jgA5xhgOsNJl5ecsdLMhJDPEEC5ztC5t+5c8fD9e4IvKfVCdnQtm3bfv36KSMG+gYTLy95GN9wE+BSTp48WRmGJJQI7MToYgJ34V6wHziAhEiUKNHNmzffYOKlJg+YgKuZJEkSHEiUCQyOLiaAA9x448YNZcyZtW7dunfv3uqNjfkykzteQiTMmzevYcOGVCLKDEJEFxPyQ5z6Wr16dZEiRSCB3mDi5SUPvKx n": 10, "stem": "有關頸部神經學檢查之敘述，下列何者錯誤？", "options": {"A": "⼿指內收／外展動作是第1胸椎神經根之肌節（myotome）", "B": "⼩指區域為第8頸椎神經根之⽪節（dermatome）", "C": "三頭肌（triceps）深腱反射是測試第7頸椎神經根", "D": "頸部側彎動作是第2頸椎神經根之肌節（myotome）"}, "images": [], "answer": "D", "explanation": "答案：D。頸部側彎動作是第2頸椎神經根之肌節（myotome）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 11, "stem": "相對於站姿時，下列那項活動對於L3椎間盤內壓增加之比例最⼤？", "options": {"A": "⾛路", "B": "⼤笑", "C": "腰椎旋轉", "D": "腰椎側彎"}, "images": [], "answer": "B", "explanation": "答案：B。⼤笑—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 12, "stem": "有關腰椎⼩⾯關節之滑液囊半⽉軟骨夾擠（impacted synovial meniscoid）的敘述，下列何者錯誤？", "options": {"A": "此類病患的主訴為背部鎖住且不敢動彈", "B": "較常發⽣於腰椎活動度過⼩的中年女性", "C": "進⾏⾝體檢查時可發現病患兩邊的脊側肌（paraspinal muscles）有不對稱的肌⾁痙攣", "D": "通常不會有神經症狀"}, "images": [], "answer": "B", "explanation": "答案：B。較常發⽣於腰椎活動度過⼩的中年女性—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 13, "stem": "續發性背痛（secondary backache）患者中常⾒的交感神經現象，包含下列那些臨床表現？①⽪膚或肌⾁會\n有痛覺過敏情形\n②肌⾁張⼒降低\n③易起雞⽪疙瘩或有局部⽪膚之營養變化\n④可歸因於背根神經結損\n傷\n⑤其體表症狀符合神經⽀配分布狀態", "options": {"A": "僅①③④", "B": "僅②④⑤", "C": "僅②③④", "D": "僅①③⑤"}, "images": [], "answer": "A", "explanation": "答案：A。僅①③④—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 14, "stem": "影響下背痛的姿勢或動作因素中，下列敘述何者最不適當？", "options": {"A": "源⾃於⼩⾯關節的腰痛，通常會因坐下⽽緩解，⾛路則會加重其症狀", "B": "椎間盤後環狀纖維（annulus fibrosus）撕裂之患者，可因坐下休息明顯減輕其症狀", "C": "⾝體前彎的動作過程中，會出現疼痛弧（painful arc），可能為椎間盤突出造成", "D": "由坐站起時，會先增加疼痛，⾄站直時疼痛則減輕，可能為韌帶不穩定問題"}, "images": [], "answer": "B", "explanation": "答案：B。椎間盤後環狀纖維（annulus fibrosus）撕裂之患者，可因坐下休息明顯減輕其症狀—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 15, "stem": "下列何種測試為陽性反應時，會讓你懷疑下背痛患者的腰椎間盤突出是在神經根的內側？①單腳站姿下，軀\n幹後仰測試引發症狀\n②站姿下，軀幹側彎⾄健側引發症狀\n③仰臥時，主動直膝抬腿（active SLR）測試\n時腰⼸拱起\n④仰臥時，於健側進⾏被動直膝抬腿測試會引發症狀", "options": {"A": "僅①②", "B": "僅③④", "C": "僅①③", "D": "僅②④"}, "images": [], "answer": "D", "explanation": "答案：D。僅②④—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 16, "stem": "如何教導背痛患者⾃我矯正「向右偏移」（right lateral shift）的姿勢？①右肩靠牆、左⼿將左側骨盆向右推\n②左肩靠牆、右⼿將右側骨盆向左推\n③右⼿將右側胸廓向左推、左⼿將左側骨盆向右推\n④左⼿將左側\n胸廓向右推、右⼿將右側骨盆向左推", "options": {"A": "僅①③", "B": "僅②④", "C": "僅①④", "D": "僅②③"}, "images": [], "answer": "A", "explanation": "答案：A。僅①③—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 17, "stem": "有關腰椎核⼼穩定訓練的概念，下列敘述何者錯誤？", "options": {"A": "對於脊椎開⼑後的病⼈，尤其是後開⽅式的病⼈，不適宜進⾏核⼼穩定訓練", "B": "髖關節／骨盆帶（hip/pelvic girdle）肌⾁是重要的核⼼穩定肌群", "C": "軀幹與骨盆的核⼼穩定是完成所有肢體動作之基礎", "D": "⽀撐腹腔穩定性的肌⾁群包括橫膈、腹橫肌、多裂肌與骨盆底肌"}, "images": [], "answer": "A", "explanation": "答案：A。對於脊椎開⼑後的病⼈，尤其是後開⽅式的病⼈，不適宜進⾏核⼼穩定訓練—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 18, "stem": "下列有關輕微脊椎滑脫（spondylolisthesis）保守治療之敘述，何者正確？", "options": {"A": "通常會建議病⼈穿戴護腰以限制腰椎前彎與旋轉的動作", "B": "可包括脊椎穩定運動、腹肌訓練、腰⽅肌與腰豎脊肌等速肌⼒訓練等", "C": "膕旁肌的牽張（stretching）運動非常重要，因為膕旁肌太緊會造成骨盆前傾，使腰椎的穩定性變差", "D": "應教育病⼈避免反覆性過度的後仰與旋轉動作，以免病情惡化"}, "images": [], "answer": "D", "explanation": "答案：D。應教育病⼈避免反覆性過度的後仰與旋轉動作，以免病情惡化—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 19, "stem": "有關急性期背痛病⼈運動治療的敘述，下列何者錯誤？", "options": {"A": "當病⼈出現鞍部⿇⽊（saddle anesthesia）現象時，可能是椎間盤壓迫神經，要做脊椎伸直運動，以減少 椎間盤向後外側脫垂，降低神經壓⼒", "B": "當脊椎伸直運動可以減緩病⼈的症狀時，在急性期應避免脊椎屈曲的運動", "C": "當沒有任何動作或姿勢可減緩或讓疼痛向⼼集中化（centralization），則不宜給予脊椎伸直運動", "D": "病⼈呈現極度疼痛且全⾝僵硬、不願意動時，則不宜給予脊椎伸直運動"}, "images": [], "answer": "A", "explanation": "答案：A。當病⼈出現鞍部⿇⽊（saddle anesthesia）現象時，可能是椎間盤壓迫神經，要做脊椎伸直運動，以減少 椎間盤向後外側脫垂，降低神經壓⼒—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 20, "stem": "下列那些腰椎組織受傷會產⽣radicular pain？", "options": {"A": "脊椎韌帶", "B": "⼩⾯關節與周圍的關節囊", "C": "脊椎神經與脊椎神經根", "D": "腰椎肌⾁與肌膜"}, "images": [], "answer": "C", "explanation": "答案：C。脊椎神經與脊椎神經根—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 21, "stem": "下列何種運動最適合骨質疏鬆且已發⽣腰椎前部壓迫性骨折半年之患者？", "options": {"A": "仰臥起坐運動", "B": "合併軀幹旋轉運動及軀幹屈曲運動", "C": "軀幹屈曲運動", "D": "軀幹伸直運動"}, "images": [], "answer": "D", "explanation": "答案：D。軀幹伸直運動—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 22, "stem": "⼀舉重選⼿抱怨伸直腰椎時有明顯的下背疼痛，久站、快⾛或把物體舉⾼過肩時症狀都會加劇。檢查發現其\n腰椎棘突（spinous process）有壓痛出現，且在四⾜跪姿下，患者做骨盆前傾的動作會讓症狀加劇，後傾時\n會減輕。相較之下，下列何種治療最適合緩解此患者的症狀？", "options": {"A": "腰椎核⼼穩定運動", "B": "機械牽引", "C": "腰椎後伸運動", "D": "膕旁肌牽張(stretching)運動"}, "images": [], "answer": "A", "explanation": "答案：A。腰椎核⼼穩定運動—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 23, "stem": "脊柱功能性單元（functional spinal unit）⼜稱做動作節段（motion segment），其組成不包括下列何者？", "options": {"A": "脊椎骨（vertebrae）", "B": "韌帶（ligament）", "C": "肌⾁（muscle）", "D": "椎間盤（intervertebral disk）"}, "images": [], "answer": "C", "explanation": "答案：C。肌⾁（muscle）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 24, "stem": "當⼀位病患抱怨下背痛時，其治療師懷疑是薦髂關節損傷。下列那⼀測試最適合？", "options": {"A": "Thigh thrust test", "B": "Clarke's sign", "C": "Ober's test", "D": "Thompson's test"}, "images": [], "answer": "A", "explanation": "答案：A。Thigh thrust test—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 25, "stem": "在薦髂關節的觸診中，下列何者出現表⽰髂骨（ilium）向上移動（upslip）？", "options": {"A": "該側髂前上棘（ASIS）和髂後上棘（PSIS）都低於對側", "B": "該側髂前上棘（ASIS）和髂後上棘（PSIS）都⾼於對側", "C": "該側髂前上棘（ASIS）較對側低，該側髂後上棘（PSIS）對側⾼", "D": "該側髂前上棘（ASIS）較對側⾼，該側髂後上棘（PSIS）對側低"}, "images": [], "answer": "B", "explanation": "答案：B。該側髂前上棘（ASIS）和髂後上棘（PSIS）都⾼於對側—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 26, "stem": "下列有關顳頜關節的動作敘述，何者正確？", "options": {"A": "關節的主動動作是向前和稍微向內", "B": "上下排牙齒的接觸最多時，稱為中央咬合（centric occlusion）", "C": "關節動作的第⼀階段主要是發⽣在上關節腔的轉動（rotation）", "D": "關節動作的第⼆階段主要是下頜骨（mandible）在不動的關節盤（disc）上做前向滑⾏（anterior translation）"}, "images": [], "answer": "B", "explanation": "答案：B。上下排牙齒的接觸最多時，稱為中央咬合（centric occlusion）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 27, "stem": "當顳頜關節障礙患者張嘴時，下頜偏向左側⽽產⽣類似C形之軌跡（C-type curve）時，下列敘述何者錯誤？", "options": {"A": "左側的關節為低活動度（hypomobility）", "B": "可能是患側的嚼肌（masseter）、翼狀肌（pterygoid）痙攣", "C": "關節側向動作（lateral movement）向右側的程度會降低", "D": "右側的關節盤向前脫位（anterior displacement），且無法復位"}, "images": [], "answer": "D", "explanation": "答案：D。右側的關節盤向前脫位（anterior displacement），且無法復位—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 28, "stem": "針對原發性胸椎脊柱側彎的矯正，下列敘述何者錯誤？", "options": {"A": "個案於坐姿可以將脊柱凹側⼿部抬⾼進⾏牽張", "B": "進⾏肩胛骨的核⼼穩定訓練有助於側彎的矯正", "C": "個案側躺在脊柱凹側，將肩膀與骨盆下壓⾄床⾯有助於脊柱伸直", "D": "進⾏腹外斜肌訓練有助於側彎的矯正"}, "images": [], "answer": "C", "explanation": "答案：C。個案側躺在脊柱凹側，將肩膀與骨盆下壓⾄床⾯有助於脊柱伸直—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 29, "stem": "有關針對胸椎進⾏的垂直牽引測試（vertical traction test），下列敘述何者正確？", "options": {"A": "受測者仰臥，雙⼿交叉置於胸前", "B": "測試者半蹲在受測者的疼痛側，雙⼿環抱前後肋骨，以緩緩站起的⽅式進⾏牽引", "C": "如果是縱韌帶受傷，此牽引的動作通常會減緩個案的疼痛症狀", "D": "如果是⼩⾯關節的急性發炎，此牽引的動作通常會引發個案的疼痛症狀"}, "images": [], "answer": "D", "explanation": "答案：D。如果是⼩⾯關節的急性發炎，此牽引的動作通常會引發個案的疼痛症狀—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 30, "stem": "有關胸椎⼩⾯關節（facet joint）的結構與活動特性，下列敘述何者錯誤？", "options": {"A": "第2⾄第11節胸椎的上關節突的⼩⾯關節（facet joint）朝向後且有⼀些朝外側", "B": "胸椎關節的休息姿勢是胸椎位在屈曲與後伸的動作中間", "C": "胸椎關節的閉鎖位置（close packed position）是胸椎往同⼀⽅向旋轉與側彎到底", "D": "胸椎關節的關節囊受限模式（capsular pattern）是旋轉與側彎動作限制較其他動作多，且兩個動作的限制 程度接近"}, "images": [], "answer": "C", "explanation": "答案：C。胸椎關節的閉鎖位置（close packed position）是胸椎往同⼀⽅向旋轉與側彎到底—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 31, "stem": "下列何者最適合⽤於改善病患在⼿臂上舉時，所出現的肩胛骨過度上抬現象？", "options": {"A": "病患⾃⾏練習肩胛下壓", "B": "病患練習肩胛下壓，治療師同時在肘部給予往上的阻⼒", "C": "治療師給予下斜⽅肌（lower trapezius）觸覺指引，病患應於肩胛上旋時，專注於避免肩胛上抬", "D": "治療師給予菱形肌（rhomboids）觸覺指引，病患應於肩胛下旋時，專注於避免肩胛上抬"}, "images": [], "answer": "C", "explanation": "答案：C。治療師給予下斜⽅肌（lower trapezius）觸覺指引，病患應於肩胛上旋時，專注於避免肩胛上抬—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 32, "stem": "物理治療師請病患將⼿貼在背後腰部，然後將⼿慢慢抬離背部，但病患無法將⼿抬離背部，這表⽰下列那⼀\n肌⾁損傷？", "options": {"A": "棘上肌", "B": "棘下肌", "C": "肩胛下肌", "D": "⼩圓肌"}, "images": [], "answer": "C", "explanation": "答案：C。肩胛下肌—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 33, "stem": "針對旋轉袖肌肌腱炎（rotator cuff tendinitis）的運動訓練，下列運動的進階順序，何者較適當？①⼿臂在肩\n胛平⾯外展30～45度且⼿肘屈曲90度時，利⽤彈⼒帶為阻⼒做肩內外轉的動作\n②雙⼿在胸前接拋3～5磅\n的治療球\n③站姿肩外轉的姿勢下做肩胛⾯的外展(scaption)\n④站姿⼿臂⾃然下垂且⼿肘屈曲90度，進⾏\n肩內外轉的等⻑收縮", "options": {"A": "②①④③", "B": "③④①②", "C": "④①③②", "D": "④③②①"}, "images": [], "answer": "C", "explanation": "答案：C。④①③②—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 34, "stem": "臂無⼒症候群（dead arm syndrome）的患者，在下列那個肩部動作下，比較會突然感覺上肢疼痛與無⼒？", "options": {"A": "極端的外展與內轉", "B": "極端的外展與外轉", "C": "正中的外展與內轉", "D": "正中的外展與外轉"}, "images": [], "answer": "B", "explanation": "答案：B。極端的外展與外轉—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 35, "stem": "下列有關患者疼痛表現之敘述，何者錯誤？", "options": {"A": "胸廓出⼝症候群常在頸肩部有深層的、惱⼈的及牙痛般的疼痛", "B": "急性鈣化性肩肌腱炎通常是灼痛、燃燒似的疼痛", "C": "頸神經根疼痛患者通常⼿舉起⾼過頭部時，症狀會加劇", "D": "肩峰鎖骨關節疼痛患者在肩外展⼤於90度時，疼痛更明顯"}, "images": [], "an 物理治療學相關知識為標準答案。"}, {"n": 19, "stem": "下列有關腰多裂肌（multifidus）的敘述，何者錯誤？", "options": {"A": "與身體其他骨骼肌相比，有較多比例的第一型肌纖維組成", "B": "深層的多裂肌處於最好的生物力學位置，是產生脊椎後伸動作最主要的肌肉", "C": "是控制脊椎在「中立區」（neutral zone）最重要的肌肉組織", "D": "檢測與訓練腰多裂肌收縮時，觸摸與口令之引導很重要，如 : 「請將我手指下的肌肉鼓起來，但保持骨盆與 脊椎不能動。」"}, "images": [], "answer": "B", "explanation": "答案：B。深層的多裂肌處於最好的生物力學位置，是產生脊椎後伸動作最主要的肌肉—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 20, "stem": "已經治療過一段時間的背痛病人，若出現下列那些紅旗警訊時，建議將病人轉介醫師做進一步檢查？①50歲\n男性，早上起床要彎腰拿東西時，一彎腰突然出現閃電狀的疼痛從臀部傳到小腿，所以整天只敢保持直挺的\n②55歲男性，沒有中風或其他已知的神經系統相關病史，但是病人抱怨最近有肌肉緊繃感，走路速度\n姿勢\n③60歲女性，抱怨最近晚上睡覺時，會因為痛而醒來，且醒來\n變慢，也較容易跌倒，足踝反射有增強現象\n後也因疼痛而無法再入睡", "options": {"A": "①②③", "B": "僅①③", "C": "僅②③", "D": "僅①②"}, "images": [], "answer": "C", "explanation": "答案：C。僅②③—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 21, "stem": "腰椎椎間盤突出患者接受非手術治療，下列何者為有利之預後因子？", "options": {"A": "對側之直膝抬腿測試為陽性反應", "B": "患者積極參與執行運動", "C": "執行軀幹向後伸直時，會誘發原有的腳痛", "D": "影像醫學顯示伴隨椎管狹窄"}, "images": [], "answer": "B", "explanation": "答案：B。患者積極參與執行運動—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 22, "stem": "使用壓力生物回饋儀（StabilizerTM Pressure Bio-Feedback unit）執行腰椎合併下肢負重（limb loading）的穩定\n訓練，下列敘述何者正確？", "options": {"A": "將壓力生物回饋儀充氣到20 mmHg", "B": "患者仰躺，回饋儀置於腰部下方，強調訓練背伸直肌群", "C": "訓練肌耐力時，需要增加下肢負荷，從膝部伸直抬腿45度，增加負荷至下肢彎曲舉到髖關節彎曲90度", "D": "患者需要將脊椎置於中立姿勢，執行腹部穩定內縮的動作（drawing-in maneuver）"}, "images": [], "answer": "D", "explanation": "答案：D。患者需要將脊椎置於中立姿勢，執行腹部穩定內縮的動作（drawing-in maneuver）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 23, "stem": "下列有關座椅調整方式，何者最能減輕坐姿時的腰椎壓迫力？", "options": {"A": "使用4公分高的軟坐墊", "B": "增加座板和背靠間的角度至100度", "C": "移除座椅扶手", "D": "移除座椅背靠"}, "images": [], "answer": "B", "explanation": "答案：B。增加座板和背靠間的角度至100度—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 24, "stem": "物理治療師利用肌肉能量技術（muscle energy technique）治療薦骨反屈傷害（counternutated sacrum\nlesion）。病患坐著，物理治療師的一手放在病人軀幹，另一手放在病人下列的那一部位？", "options": {"A": "薦骨基部（base of sacrum）", "B": "薦骨下外角（inferior lateral angle of sacrum）", "C": "髂後上棘（posterior superior iliac spine）", "D": "坐骨粗隆（ischial tuberosity）"}, "images": [], "answer": "A", "explanation": "答案：A。薦骨基部（base of sacrum）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 25, "stem": "在正常行走過程中，下列何者不是骨盆的正常動作型式？", "options": {"A": "薦骨前扭轉（sacral anterior torsion）", "B": "薦骨後扭轉（sacral posterior torsion）", "C": "髂骨前旋轉（iliac anterior rotation）", "D": "髂骨後旋轉（iliac posterior rotation）"}, "images": [], "answer": "B", "explanation": "答案：B。薦骨後扭轉（sacral posterior torsion）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 26, "stem": "當病人有開口限制，治療師執行鬆動術技巧時應將病人下顎如何移動？", "options": {"A": "向下", "B": "向後", "C": "向上", "D": "向右"}, "images": [], "answer": "A", "explanation": "答案：A。向下—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 27, "stem": "為訓練正常張嘴動作，可讓舌頭頂住上顎（hard palate），同時將下頜骨（mandible）保持於下列那個位置？", "options": {"A": "後移位置（retruded position）", "B": "突出位置（protruded position）", "C": "外側位置（lateral position）", "D": "內側位置（medial position）"}, "images": [], "answer": "A", "explanation": "答案：A。後移位置（retruded position）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 28, "stem": "脊柱側彎之椎體旋轉程度，可從X光影像觀察下列那一結構的相對位置得知？", "options": {"A": "椎間盤（intervertebral disc）", "B": "椎板（lamina）", "C": "椎弓根（pedicle）", "D": "小面關節（facet joint）"}, "images": [], "answer": "C", "explanation": "答案：C。椎弓根（pedicle）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 29, "stem": "針對胸椎進行駝背測試（slump test）檢查是否有硬脊髓膜（dura）症狀時，下列敘述何者錯誤？", "options": {"A": "採坐姿，雙手支撐於身體背後或放在腰後", "B": "胸椎最常見疼痛位置在於第8節與第9節附近", "C": "將胸椎擺放於屈曲位置後即引發劇烈疼痛，則可確認為胸椎硬脊髓膜的問題", "D": "於測試的最後階段，是藉由觀察頭部及頸椎的後伸是否可減緩症狀，來確認有無硬脊髓膜的問題"}, "images": [], "answer": "C", "explanation": "答案：C。將胸椎擺放於屈曲位置後即引發劇烈疼痛，則可確認為胸椎硬脊髓膜的問題—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 30, "stem": "以治療球進行胸椎穩定訓練時，仰躺在球上的訓練方式，下列敘述何者錯誤？", "options": {"A": "可以橋式（bridging）進行訓練", "B": "可訓練臀部肌肉對於骨盆的穩定作用", "C": "頭頸躺在治療球上，以雙手撐地做橋式動作，可增加闊背肌（latissimus dorsi）的參與", "D": "與俯臥於球上相比，較可藉由上肢承重，訓練肩帶（shoulder girdle）的穩定度"}, "images": [], "answer": "D", "explanation": "答案：D。與俯臥於球上相比，較可藉由上肢承重，訓練肩帶（shoulder girdle）的穩定度—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 31, "stem": "當患者做手臂抬高（elevation）動作時，疑似因為夾擠而有疼痛症狀，欲使用動態關節鬆動術（mobilization\nwith movement）的技巧以改善盂肱關節的移動軌跡時，通常施加於肱骨頭的滑動（glide）方向為何？", "options": {"A": "後內向", "B": "後外向", "C": "前內向", "D": "前外向"}, "images": [], "answer": "B", "explanation": "答案：B。後外向—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 32, "stem": "為增加冰凍肩病人之肩外展活動度，應考慮下列那些關節鬆動術？①肱骨頭向上滑動\n②肱骨頭向下滑動\n③鎖骨內側向上滑動\n④鎖骨內側向下滑動", "options": {"A": "僅①③", "B": "僅②④", "C": "僅①④", "D": "僅②③"}, "images": [], "answer": "B", "explanation": "答案：B。僅②④—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 33, "stem": "依據滑液關節（synovial joints）的分類，肩峰鎖骨關節屬於下列何者？", "options": {"A": "平面關節（plane joint）", "B": "屈戌關節（hinge joint）", "C": "樞軸關節（pivot joint）", "D": "雙軸髁形關節（condyloid joint）"}, "images": [], "answer": "A", "explanation": "答案：A。平面關節（plane joint）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 34, "stem": "下列何者是脊椎與肱骨間完成手臂後伸（extension）、內收（adduction）與內轉（internal rotation）最重要的\n肌肉？", "options": {"A": "斜方肌", "B": "前鋸肌", "C": "肩胛下肌", "D": "闊背肌"}, "images": [], "answer": "D", "explanation": "答案：D。闊背肌—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 35, "stem": "下列何者無法測試肩關節後向不穩？", "options": {"A": "諾伍德測試（Norwood stress test）", "B": "推拉測試（push-pull test）", "C": "彌尼阿希測試（Miniaci test）", "D": "普羅茲曼測試（Protzman test）"}, "images": [], "answer": "D", "explanation": "答案：D。普羅茲曼測試（Protzman test）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 36, "stem": "肩盂唇受損的理學檢查中，下列何種測試有中度到強度的研究證據支持用於臨床測試？", "options": {"A": "喀啦聲測試（clunk test）", "B": "擠壓轉動測試（compression rotation test）", "C": "O'Brien主動擠壓測試（active compression test）", "D": "向前滑動測試（anterior slide test）"}, "images": [], "answer": "C", "explanation": "答案：C。O'Brien主動擠壓測試（active compression test）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 37, "stem": "肩關節後側關節囊緊和下列何動作受限最有關？", "options": {"A": "後伸", "B": "外展", "C": "外轉", "D": "內轉"}, "images": [], "answer": "D", "explanation": "答案：D。內轉—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, {"n": 38, "stem": "下列那條神經損傷對於盂肱關節穩定度較無直接影響？", "options": {"A": "上肩胛神經（suprascapular nerve）", "B": "腋神經（axillary nerve）", "C": "背肩胛神經（dorsal scapular nerve）", "D": "下肩胛神經（subscapular nerve）"}, "images": [], "answer": "C", "explanation": "答案：C。背肩胛神經（dorsal scapular nerve）—此選項為正確敘述，依物理治療學相關知識為標準答案。"}, { const state = {
  paper: "Q1",
  idx: {Q1: 0, Q2: 0},
  picks: { Q1: {}, Q2: {} }, // hydrated later, after persistence block defines PICKS_STORAGE_KEY
};

const $ = sel => document.querySelector(sel);
const main = $("#main");
const grid = $("#grid");
const progressEl = $("#progress");

function isCorrect(paper, n, pick) {
  const ans = DATA[paper].questions[n-1].answer;
  if (ans === "#") return true; // 一律給分
  return ans.indexOf(pick) >= 0; // single "A" or multi "AB" (X 或 Y 均給分)
}

function picksDone(paper) {
  return Object.keys(state.picks[paper]).length;
}

function score(paper) {
  let s = 0;
  for (const n in state.picks[paper]) {
    if (isCorrect(paper, parseInt(n), state.picks[paper][n])) s++;
  }
  return s;
}

function renderGrid() {
  grid.innerHTML = "";
  const qs = DATA[state.paper].questions;
  for (let i = 0; i < qs.length; i++) {
    const n = i + 1;
    const btn = document.createElement("button");
    btn.className = "gbtn";
    btn.textContent = n;
    if (state.idx[state.paper] === i && !state.viewSummary) btn.classList.add("cur");
    if (n in state.picks[state.paper]) {
      const ok = isCorrect(state.paper, n, state.picks[state.paper][n]);
      btn.classList.add(ok ? "right" : "wrong");
    }
    if (isMarked(state.paper, n)) btn.classList.add("marked");
    btn.onclick = () => { state.viewSummary = false; state.idx[state.paper] = i; render(); };
    grid.appendChild(btn);
  }
}

function escapeHTML(s) { return s.replace(/&/g, "&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderQuestion() {
  const qs = DATA[state.paper].questions;
  const i = state.idx[state.paper];
  const q = qs[i];
  const pick = state.picks[state.paper][q.n];
  const locked = !!pick;
  const correct = q.answer;
  const total = qs.length;
  progressEl.textContent = `第 ${i+1} 題 / 共 ${total} 題　·　已作答 ${picksDone(state.paper)}　·　目前得分 ${score(state.paper)}`;

  let imgsHTML = "";
  for (const u of q.images) imgsHTML += `<img class="qimg" src="${u}" alt="題目附圖">`;

  let optsHTML = "";
  for (const k of ["A","B","C","D"]) {
    let cls = "opt";
    if (locked) {
      cls += " locked";
      const isCorrLetter = (correct !== "#" && correct.indexOf(k) >= 0);
      if (isCorrLetter) cls += " correct";
      else if (k === pick && correct !== "#") cls += " wrong";
      else if (correct === "#" && k === pick) cls += " correct";
    }
    optsHTML += `<button class="${cls}" data-k="${k}" ${locked ? "disabled" : ""}>
      <span class="label">${k}.</span><span>${escapeHTML(q.options[k] || "")}</span>
    </button>`;
  }

  let verdictHTML = "";
  if (locked) {
    if (correct === "#") {
      verdictHTML = `<div class="verdict note">
        <h3>本題經考選部公告「一律給分」</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else if (correct.length > 1) {
      const ok = correct.indexOf(pick) >= 0;
      const letters = correct.split("").join(" 或 ");
      verdictHTML = `<div class="verdict note">
        <h3>本題經考選部公告「答 ${letters} 均給分」　·　${ok ? "✓ 你的選擇 ("+pick+") 在正解內" : "✗ 你選 "+pick+"，未在正解內"}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    } else {
      const ok = pick === correct;
      verdictHTML = `<div class="verdict ${ok ? "right" : "wrong"}">
        <h3>${ok ? "✓ 答對" : "✗ 答錯"}　·　正解：${correct}</h3>
        <div>${escapeHTML(q.explanation || "")}</div>
      </div>`;
    }
  }

  main.innerHTML = `<div class="card">
    <div class="qhead">
      <span class="qnum">第 ${q.n} 題</span>
      <span class="qmeta">${DATA[state.paper].label}　·　${q.images.length>0?"含附圖":"純文字"}${isMarked(state.paper, q.n) ? ' <span class="marked-badge">🔖 已標記</span>' : ''}</span>

  $("#markBtn").onclick = () => { toggleMark(state.paper, q.n); render(); };

  if (fb) fb.onclick = () => { state.viewSummary = true; render(); };

    ${(()=>{ const rows=[]; for (let i=0;i<qs.length;i++){ const q=qs[i]; if (!isMarked(state.paper,q.n)) continue; const pick=state.picks[state.paper][q.n]; const stemShort = q.stem.length>50?q.stem.slice(0,50)+'…':q.stem; const tag = pick===undefined?'未作答':(q.answer==='#'?'一律給分':(pick===q.answer?'答對':'答錯')); const tagColor = pick===undefined?'var(--ink-soft)':(q.answer==='#'?'var(--yellow)':(pick===q.answer?'var(--green)':'var(--red)')); rows.push(`<div class="wrong-row mk" data-idx="${i}"><strong>★ 第 ${q.n} 題</strong><span style="color:${tagColor};">${tag}</span><span style="color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(stemShort)}</span></div>`); } return rows.length>0 ? `<div style="margin-top:14px;"><h3 style="margin:0 0 6px;">🔖 已標記題目（${rows.length}）</h3><div class="wrong-list">${rows.join('')}</div><button class="btn ghost" id="clearMarksBtn" style="margin-top:8px;font-size:13px;">清除本卷所有標記</button></div>` : ''; })()}

// ===== Answer persistence (per-paper picks, saved to localStorage) =====
const PICKS_STORAGE_KEY = "nephron_108_ortho_picks_v1";
const QUIZ_ID = "ortho_108";  // unique id used when broadcasting summary

function loadPicks() {
  try {
    const s = localStorage.getItem(PICKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function savePicks() {
  try { localStorage.setItem(PICKS_STORAGE_KEY, JSON.stringify(state.picks)); } catch (e) {}
  broadcastProgress();
}

// Send a summary of progress to parent window if embedded in an iframe.
// Used by the dashboard (index.html) to show progress bars.
function broadcastProgress() {
  if (typeof window === "undefined") return;
  let target = null;
  try { if (window.parent && window.parent !== window) target = window.parent; } catch(e){}
  if (!target) return;
  try {
    const summary = { type: "quizSummary", quizId: QUIZ_ID, papers: {} };
    for (const tag of ["Q1","Q2"]) {
      const qs = DATA[tag].questions;
      const picks = state.picks[tag] || {};
      const marks = state.marks ? (state.marks[tag] || {}) : {};
      let answered = 0, correct = 0;
      for (const n in picks) {
        answered++;
        if (isCorrect(tag, parseInt(n), picks[n])) correct++;
      }
      summary.papers[tag] = {
        label: DATA[tag].label,
        total: qs.length,
        answered, correct,
        marked: Object.keys(marks).length,
      };
    }
    target.postMessage(summary, "*");
  } catch (e) {}
}

// Hydrate persisted picks now that PICKS_STORAGE_KEY and loadPicks are defined
state.picks = loadPicks();

// ===== Bookmarks (per-paper question marks, persisted to localStorage) =====
const MARKS_STORAGE_KEY = "nephron_108_ortho_marks_v1";
function loadMarks() {
  try {
    const s = localStorage.getItem(MARKS_STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      return { Q1: parsed.Q1 || {}, Q2: parsed.Q2 || {} };
    }
  } catch (e) {}
  return { Q1: {}, Q2: {} };
}
function saveMarks() {
  try { localStorage.setItem(MARKS_STORAGE_KEY, JSON.stringify(state.marks)); } catch (e) {}
  broadcastProgress();
}
function toggleMark(paper, n) {
  if (state.marks[paper][n]) delete state.marks[paper][n];
  else state.marks[paper][n] = true;
  saveMarks();
}
function isMarked(paper, n) { return !!state.marks[paper][n]; }
function clearAllMarks(paper) {
  state.marks[paper] = {};
  saveMarks();
}
function markedCount(paper) { return Object.keys(state.marks[paper]).length; }
state.marks = loadMarks();

// ===== Export / Download report =====
function _esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function _stamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function _nowStr() { return new Date().toLocaleString("zh-TW", {hour12: false}); }

function _filterQs(paper, filter) {
  const qs = DATA[paper].questions;
  const picks = state.picks[paper];
  if (filter === "all") return qs.slice();
  if (filter === "answered") return qs.filter(q => picks[q.n] !== undefined);
  if (filter === "unanswered") return qs.filter(q => picks[q.n] === undefined);
  if (filter === "wrong") {
    return qs.filter(q => {
      const p = picks[q.n];
      return p !== undefined && q.answer !== "#" && q.answer.indexOf(p) < 0;
    });
  }
  if (filter === "marked") return qs.filter(q => isMarked(paper, q.n));
  return qs.slice();
}

function _filterCounts(paper) {
  return {
    all: _filterQs(paper, "all").length,
    answered: _filterQs(paper, "answered").length,
    wrong: _filterQs(paper, "wrong").length,
    unanswered: _filterQs(paper, "unanswered").length,
    marked: _filterQs(paper, "marked").length,
  };
}

function buildExportHTML(paper, filter) {
  const allQs = DATA[paper].questions;
  const picks = state.picks[paper];
  const qs = _filterQs(paper, filter);
  const total = allQs.length;
  const answered = Object.keys(picks).length;
  const correctCount = Object.entries(picks).filter(([n, p]) => isCorrect(paper, parseInt(n), p)).length;
  const pct = total > 0 ? ((correctCount / total) * 100).toFixed(1) : "0.0";
  const filterLabel = {all:"全部題目", wrong:"僅錯題", answered:"僅已作答", unanswered:"僅未作答", marked:"僅已標記"}[filter];
  const paperLabel = DATA[paper].label + (paper === "Q1" ? "（114020）" : "（114090）");

  const subjectTitle = "骨科疾病物理治療學 · 民國 108 年 · " + paperLabel;
  const fileTitle = `骨科_108_${paperLabel.replace(/[（）]/g, "")}_${filterLabel}_${_stamp()}`;

  let body = "";
  for (const q of qs) {
    const pick = picks[q.n];
    const correct = q.answer;
    const errata = (correct === "#");
    const answeredFlag = pick !== undefined;
    let statusLabel, statusCls;
    const multiHere = (!errata && correct && correct.length > 1);
    if (errata) { statusLabel = "一律給分"; statusCls = "errata"; }
    else if (!answeredFlag) { statusLabel = "未作答"; statusCls = "unanswered"; }
    else if (multiHere) {
      const ok = correct.indexOf(pick) >= 0;
      statusLabel = ok ? "✓ 多解·入正解" : "✗ 多解·未入正解";
      statusCls = ok ? "correct" : "wrong";
    }
    else if (pick === correct) { statusLabel = "✓ 答對"; statusCls = "correct"; }
    else { statusLabel = "✗ 答錯"; statusCls = "wrong"; }

    let imgsHTML = "";
    for (const u of q.images) {
      imgsHTML += `<img class="qimg" src="${u}" alt="題目附圖">`;
    }

    let optsHTML = "";
    const multi = (!errata && correct && correct.length > 1);
    for (const k of ["A","B","C","D"]) {
      const isPick = (k === pick);
      const isCorr = (!errata && correct && correct.indexOf(k) >= 0);
      let cls = "opt";
      let tag = "";
      if (isPick && isCorr) { cls += " correct user-pick"; tag = "（你的選擇 ✓）"; }
      else if (isPick && !isCorr && !errata) { cls += " wrong user-pick"; tag = "（你的選擇 ✗）"; }
      else if (isCorr) { cls += " correct"; tag = (multi ? "（正解之一）" : "（正解）"); }
      else if (isPick && errata) { cls += " errata user-pick"; tag = "（你的選擇）"; }
      optsHTML += `<li class="${cls}"><b>${k}.</b> ${_esc(q.options[k] || "")}<span class="opt-tag">${tag}</span></li>`;
    }

    let verdictHTML = "";

    } else if (multi) {
      const letters = correct.split("").join(" 或 ");
      const ok = answeredFlag && correct.indexOf(pick) >= 0;
      verdictHTML = `<div class="verdict errata"><b>本題經考選部公告「答 ${letters} 均給分」</b>${answeredFlag ? ` · 你選 <b>${pick}</b>${ok ? " ✓" : " ✗"}` : " · 未作答"}</div>`;
    } else if (!answeredFlag) {
      verdictHTML = `<div class="verdict unanswered"><b>未作答</b> · 正解：<b>${correct}</b></div>`;
    } else {
      const ok = pick === correct;
      verdictHTML = `<div class="verdict ${ok ? "correct" : "wrong"}"><b>${ok ? "✓ 答對" : "✗ 答錯"}</b> · 你的選擇：<b>${pick}</b> · 正解：<b>${correct}</b></div>`;
    }

    const explHTML = q.explanation ? `<div class="expl"><b>詳解 ▸</b> ${_esc(q.explanation)}</div>` : "";

    const markedBadge = isMarked(paper, q.n) ? ` <span class="qstatus marked">🔖 已標記</span>` : "";
    body += `<article class="q ${statusCls}">
  <div class="qhead">
    <h2>第 ${q.n} 題</h2>
    <span class="qstatus ${statusCls}">${statusLabel}</span>${markedBadge}
  </div>
  <div class="stem">${_esc(q.stem)}</div>
  ${imgsHTML}
  <ol class="opts">${optsHTML}</ol>
  ${verdictHTML}
  ${explHTML}
</article>`;
  }

  const css = `

function downloadExport(filter) {

  const blob = new Blob([html], { type: "text/html;charset=utf-8" });

  const a = document.createElement("a");
  a.href = url; a.download = fileTitle + ".html";

document.getElementById("exportModal").addEventListener("click", e => {
  if (e.target.id === "exportModal") hideExportModal();
});
document.querySelectorAll("#exportOpts .exp-opt").forEach(btn => {
  btn.onclick = () => {
    const filter = btn.getAttribute("data-filter");
    if (btn.disabled) return;
    downloadExport(filter);
    hideExportModal();
  };
});

render();
// Broadcast initial state to parent (dashboard) if loaded as iframe
broadcastProgress();
</script>
</body>
</html>
